-52E cells. These inhibitory effects were partially reversed by NF-&#x3ba;B p65 knockdown. This study is the first to demonstrate that NDQ alleviates TIF by reshaping microbial dysbiosis and modulating host- and GM-mediated tryptophan metabolism. These findings support that NDQ mitigates TIF by suppressing I&#x3ba;B/NF-&#x3ba;B signaling pathway through regulation of host-microbiota-derived tryptophan metabolism.", "keywords": [], "year": "2026", "doi": "10.1016/j.micres.2026.128592"}, {"pmid": "42335240", "title": "Fasting primes small intestinal regeneration after damage via a microbiome-metabolite-chromatin axis.", "abstract": "Fasting enhances small intestinal regeneration after radiation, but the contribution of the gut microbiome to this process remains uncharacterized. We identify Akkermansia muciniphila ( AKK ) as a key mediator of this response. AKK was enriched in fasted mice and its antibiotic depletion abrogated radioprotection, whereas reintroduction restored both organismal survival and intestinal integrity. Fasting elevated propionic acid, consistent with AKK 's metabolic output. AKK -conditioned medium and propionate induced histone H3 acetylation in intestinal stem cell cultures while in vivo fasting induced AKK -dependent H3K27ac and H3K9ac, remodeling promoter-enhancer landscapes in crypt epithelial cells. Epigenetic profiling revealed a rewired core regulatory program enriched for pioneer transcription factors (Foxa, Gata, Klf), architectural organizers (Ctcf, Boris), and lineage-defining and metabolic regulators (Cdx2, Hnf4). This program supports expansion of a population of primed persister cells characterized by open chromatin accessibility at key stem and regenerative-associated loci including Clu , Olfm4 , Lgr5, Ascl2, Lrig1, Sox9, Rnf43, and Axin2. These findings define a fasting-induced microbiome-metabolite-chromatin axis that epigenetically primes highly plastic persister cells for rapid regeneration of the intestinal epithelium following radiation-induced injury.", "keywords": ["Animals", "Regeneration", "Mice", "Intestine, Small", "Chromatin", "Fasting", "Microbiota", "Epigenesis, Genetic", "Mice, Inbred C57BL"], "year": "2026", "doi": "10.1073/pnas.2529215123"}, {"pmid": "42334790", "title": "Gut microbiota in treatment-na&#xef;ve active Crohn's disease compared to those in remission: Divergent trends in mucosal versus fecal bacterial community.", "abstract": "Evaluating the gut microbial community in Crohn's disease (CD) is best done before commencing therapy to avoid the effects of therapeutic intervention and provide a better understanding of microbial dysbiosis. We compared the microbial communities in both tissue and stool samples from treatment-naive CD patients with those in remission. Adults with CD were prospectively recruited. Patients with Crohn's disease activity index (CDAI)&#x2009;&gt;&#x2009;150 and no prior therapy were included as treatment-naive active cases and those with CDAI&#x2009;&#x2264;&#x2009;150 were considered to be in remission. Stool and rectal mucosal biopsy samples were collected, bacterial DNA was extracted, the V3-V4 region of the 16S rRNA gene was amplified and library preparation was done and sequenced on the Illumina MiSeq platform. The microbial community composition, diversity and predicted function were assessed using the QIIME2 pipeline and R packages. Microbial characteristics associated with disease status were determined. Thirty-four active CD cases (age 40.9&#x2009;&#xb1;&#x2009;11.2&#xa0;years, males 61.8%) and 33 in remission (age 39.5&#x2009;&#xb1;&#x2009;10.2&#xa0;years, 60.6% males) were recruited. Changes in bacterial diversity with disease status were more pronounced in stool than in tissue samples. On random forest analysis of the stool sample, genera such as Romboutsia, Ruminococcus and Dorea were associated with active CD, while Bifidobacterium, Escherichia and Enterococcus were associated with remission. In the mucosal sample, Bacillus, Megasphaera and other species were associated with active CD, while Veillonella, Fusobacterium, Bifidobacterium and other species were associated with remission. Several predicted metabolic pathways showed significant differences between the mucosal bacteria of active CD and those in remission. This difference was less pronounced between the two groups' stool samples. The microbial community structure and predicted function in treatment-na&#xef;ve CD differ from those in remission. The predicted differences at the functional level are prominent in the mucosal microbiota, which are not replicated in the fecal community.", "keywords": [], "year": "2026", "doi": "10.1007/s12664-026-02031-2"}, {"pmid": "42334415", "title": "Gut microbiota-dependent metabolism of 6-shogaol generates bioactive metabolites that mediate its anti-inflammatory effects.", "abstract": "6-Shogaol (6S), a major bioactive constituent of ginger, exhibits anti-inflammatory activity, but the contribution of gut microbiota to its metabolism and biological effects remains unclear. Using germ-free (GF) and specific pathogen-free (SPF) mice, we demonstrate that gut microbiota plays an essential role in the in vivo metabolism of 6S and the generation of bioactive metabolites. Two previously unreported metabolites were isolated from fecal samples, structurally characterized using high-resolution LC-MS/MS and NMR spectra, and confirmed by chemical synthesis. The most potent fecal fraction (fraction 4), enriched in microbial metabolites of 6S, significantly suppressed nitric oxide production by 75%, reduced inducible nitric oxide synthase (iNOS) expression by 22% and cyclooxygenase-2 (COX-2) expression by 64%, and inhibited NF-&#x3ba;B p65 activation by 67% in lipopolysaccharide-stimulated RAW 264.7 macrophages. Moreover, intrarectal administration of microbial metabolites of 6S markedly attenuated LPS-induced inflammatory responses in mice by inhibiting TNF-&#x3b1; and IL-6 levels, with effects comparable to or exceeding those of 6S. Collectively, these findings demonstrate that gut microbiota extensively metabolizes 6S and its microbial metabolites still exhibit anti-inflammatory activity.", "keywords": [], "year": "2026", "doi": "10.1039/d6fo01722c"}, {"pmid": "42333783", "title": "Lactiplantibacillus plantarum KLDS1.0344 ameliorates depressive-like behavior in CUMS mice: integrative multi-omics evidence linking gut microbiota alterations to sphingolipid and glycerophospholipid metabolic pathways.", "abstract": "Depression is a common and debilitating psychiatric disorder, and current pharmacotherapies are often limited by delayed onset, variable efficacy, and adverse side effects. Therefore, safer and more effective adjunctive or alternative strategies are needed. In the present study, a chronic unpredictable mild stress-induced murine model was used to evaluate the antidepressant potential of Lactiplantibacillus plantarum KLDS1.0344 by integrating behavioral assessments, neurochemical analyses, 16S rRNA sequencing, and untargeted metabolomics of intestinal contents. KLDS1.0344 significantly ameliorated depressive-like behaviors in the open field, tail suspension, forced swim, and sucrose preference tests, with the most pronounced effects observed at the high dose. These behavioral improvements were accompanied by reduced HPA-axis hormones (corticotropin-releasing hormone, adrenocorticotropic hormone, and corticosterone) and partial restoration of monoamine neurotransmitters (dopamine, norepinephrine, and 5-hydroxytryptamine) and brain-derived neurotrophic factor. Multi-omics analyses further showed that high-dose KLDS1.0344 was associated with remodeling of the gut microbiota, particularly the restoration of Lactobacillus and alterations in other key taxa, together with marked changes in sphingolipid- and glycerophospholipid-related metabolic profiles. Correlation analysis suggested coordinated associations between microbial shifts and intestinal lipid metabolic features, supporting a candidate microbiota-metabolite framework related to the psychobiotic effects of KLDS1.0344. Overall, this study provides evidence supporting the psychobiotic potential of KLDS1.0344 and its possible application in functional foods for depression-related intervention.", "keywords": [], "year": "2026", "doi": "10.1039/d6fo00143b"}], "pubmed_query": "(\"colon\"[Title] OR \"large intestine\"[Title] OR \"colorectal\"[Title] OR \"colonic\"[Title] OR \"gut microbiota\"[Title] OR \"microbiome\"[Title]) AND (\"small intestine\"[Title] OR \"duodenum\"[Title] OR \"jejunum\"[Title] OR \"ileum\"[Title] OR \"intestinal\"[Title] OR \"gut\"[Title] OR \"enterocyte\"[Title] OR \"Peyer's patches\"[Title] OR \"gut-brain axis\"[Title] OR \"enteroendocrine\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Heart__Kidney", "source": "Heart", "target": "Kidney", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: TSH, TH, Insulin, Glucagon\nNotes: - At a fasting and resting state, the heart, kidney, and liver all take up Fatty acids secreted form the WAT which might lead to a more coordinated metabolism of these organs.\nSources:", "connection_type": "Hormonal connection", "key_players": ["TSH", "TH", "Insulin", "Glucagon"], "key_players_metabolites": ["glucose", "creatinine", "cholesterol", "triglyceride", "atp", "hdl", "urea", "amp", "lipoprotein", "uric acid", "amino acids", "ldl", "triglycerides", "fatty acid", "ammonia", "glutamate", "lactate", "arginine", "malate", "creatine", "fatty acids", "serine", "glycine", "palmitate", "citrate", "pyruvate", "succinate", "bile acid"], "key_players_hormones": ["angiotensin", "fgf23", "insulin", "klotho", "natriuretic peptide", "renin", "glucagon", "mineralocorticoid", "vasopressin", "norepinephrine", "aldosterone", "il-6", "glp-1", "tnf", "interleukin-6", "bnp", "fetuin-a", "angiotensin ii", "leptin", "gip", "adiponectin", "t3", "vitamin d", "tumor necrosis factor", "il-10", "t4", "anp"], "key_players_proteins": ["sglt2", "mtor", "acc", "mtorc1", "mtorc2", "sirt1", "mapk", "nos2", "pi3k", "pparg", "glp-1 receptor", "akt", "cd36", "pgc-1"], "key_players_counts_metabolites": {"cholesterol": 14, "ammonia": 2, "glycine": 1, "amp": 5, "palmitate": 1, "citrate": 1, "atp": 8, "hdl": 7, "amino acids": 4, "glucose": 81, "fatty acid": 3, "glutamate": 2, "ldl": 4, "lactate": 2, "arginine": 2, "pyruvate": 1, "malate": 2, "creatinine": 37, "lipoprotein": 5, "triglycerides": 4, "creatine": 2, "uric acid": 5, "urea": 6, "triglyceride": 10, "fatty acids": 2, "succinate": 1, "serine": 2, "bile acid": 1}, "key_players_counts_hormones": {"tnf": 5, "bnp": 4, "natriuretic peptide": 22, "fetuin-a": 4, "fgf23": 30, "aldosterone": 10, "glucagon": 18, "mineralocorticoid": 16, "angiotensin ii": 4, "norepinephrine": 11, "renin": 20, "adiponectin": 2, "insulin": 25, "t3": 2, "vitamin d": 2, "il-10": 1, "tumor necrosis factor": 2, "vasopressin": 12, "klotho": 23, "leptin": 4, "glp-1": 9, "il-6": 10, "gip": 3, "t4": 1, "anp": 1, "angiotensin": 42, "interleukin-6": 5}, "key_players_counts_proteins": {"mapk": 3, "nos2": 1, "pi3k": 1, "mtorc1": 5, "mtorc2": 4, "pparg": 1, "sglt2": 45, "glp-1 receptor": 1, "akt": 1, "cd36": 1, "pgc-1": 1, "sirt1": 4, "acc": 9, "mtor": 10}, "notes": "- At a fasting and resting state, the heart, kidney, and liver all take up Fatty acids secreted form the WAT which might lead to a more coordinated metabolism of these organs.", "sources": [], "ai_description": "The Heart-Kidney axis is a complex interplay of metabolic and hormonal signals between the heart and kidneys, mediated primarily by the renin-angiotensin system (RAS) [1]. Activation of RAS in the kidneys leads to increased production of angiotensin II, which stimulates sympathetic nerve activity, including renal sympathetic overdrive, as assessed by 131I-MIBG imaging [3]. This sympathetic activation can contribute to cardiac dysfunction and vice versa, forming a vicious cycle that exacerbates both heart failure with preserved ejection fraction (HFpEF) and chronic kidney disease (CKD). The use of sodium-glucose cotransporter-2 inhibitors (SGLT2Is), which have been shown to mitigate renal damage without adverse cardiac effects [5], may provide a therapeutic strategy to break this axis.", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42331355", "title": "Interaction of heart failure with chronic kidney disease, liver disease and cancer: the need for systems cardiology.", "abstract": "", "keywords": [], "year": "2026", "doi": "10.1093/eurheartj/ehag476"}, {"pmid": "42329131", "title": "Do the treatment selection factors emphasized in clinical guidelines-Chronic kidney disease, cardiovascular disease, and heart failure-contribute to the risk of urinary tract infections during the administration of sodium-glucose cotransporter-2 inhibitors?", "abstract": "Sodium-glucose cotransporter-2 inhibitors (SGLT2Is) are recommended in Japan for patients with cardiovascular disease (CVD), heart failure (HF), or chronic kidney disease (CKD) due to their organ-protective effects, leading to increased use in high-risk populations. However, whether urinary tract infection (UTI) risk associated with SGLT2Is differs according to the presence of these factors remains unclear. This study aimed to estimate UTI risk among SGLT2I users and treatment selection factors and examine whether these factors modify risk. We selected dipeptidyl peptidase-4 inhibitors (DPP4Is) as the comparators. This retrospective cohort study used DeSC claims data from patients with diabetes mellitus who received their first prescription for either an SGLT2I or a DPP4I between October 2014 and February 2023. The analysis focused on data from 2019 to 2022. Hazard ratios (HRs) for UTI incidence were estimated using Cox proportional hazard regression. A total of 66,968 SGLT2I users and 170,678 DPP4I users were aged 65&#x2009;years or older. UTI incidence among SGLT2I users was 2.04% in those with treatment selection factors and 0.84% in those without. Compared with DPP4I users, the HR for UTI was 0.80 in patients with treatment selection factors and 0.51 in those without treatment selection factors. SGLT2I use was not associated with an increase in UTI risk, regardless of treatment selection factor status. These findings suggest a favorable safety profile for SGLT2Is even among high-risk populations, supporting their use following clinical guidelines.", "keywords": [], "year": "2026", "doi": "10.1111/jdi.70362"}, {"pmid": "42325759", "title": "Application of 131 I-MIBG imaging in assessing renal sympathetic overdrive in heart failure with preserved ejection fraction (HFpEF).", "abstract": "To quantitatively assess cardiac and renal sympathetic nerve activity using 131 I-metaiodobenzylguanidine (MIBG) imaging, in patients with heart failure with preserved ejection fraction (HFpEF) diagnosed via left heart catheterization, compared with matched controls. The study enrolled 18 HFpEF patients (diagnosed via left heart catheterization for exertional dyspnea as the test group) and 10 matched controls. All subjects underwent cardiac and renal 131 I-MIBG imaging. We measured early (15 min, reflecting nerve density/uptake) and delayed (4 h, reflecting neurotransmitter storage/turnover) kidney-to-mediastinum (K/M) and heart-to-mediastinum (H/M) ratios, as well as washout rates (WR). Invasive hemodynamic measurements showed elevated mean left ventricular end-diastolic pressure (mLVEDP) in the test group [21 (18, 24) mmHg vs. 7.5 (5, 8) mmHg, P &lt; 0.05]. Notably, 131 I-MIBG imaging indicated significantly higher renal sympathetic activation in the test group during both the early and delayed phases (K/M15min: 10.5 &#xb1; 2.5 vs. 3.7 &#xb1; 0.45 and K/M4h: 8.1 &#xb1; 3.3 vs. 4.6 &#xb1; 0.3, P &lt; 0.05), the former being approximately two to three times greater than the latter. This hypersympathetic state significantly paralleled the elevation in LAD and mLVEDP (P &lt; 0.05), indicating a direct link between renal neuro-overactivity and cardiac diastolic impairment. 131 I-MIBG imaging successfully quantifies renal-cardiac sympathetic crosstalk in HFpEF. The markedly elevated K/M ratios demonstrate that renal sympathetic overactivity is a core driver of hemodynamic congestion in these patients. Clinically, this technique may serve as a powerful non-invasive biomarker to identify candidates for sympatho-inhibitory therapies and provides a precise tool for monitoring therapeutic efficacy in HFpEF management.", "keywords": [], "year": "2026", "doi": "10.62347/OBPS4683"}, {"pmid": "42318367", "title": "Nivolumab-Associated Cardiac Manifestation of Cutaneous T-Cell Lymphoma in a Patient With Concurrent Renal Cell Carcinoma.", "abstract": "Cardiac involvement by cutaneous T-cell lymphoma is exceedingly rare and poses considerable diagnostic and therapeutic challenges. Immune checkpoint inhibitors targeting programmed cell death-1 have reported variable activity in T-cell lymphomas and have been associated with paradoxical progression in select cases. We report a 72-year-old man with longstanding indolent CD8-positive cutaneous T-cell lymphoma and metastatic renal cell carcinoma who developed myocardial infiltration by lymphoma after prolonged nivolumab therapy. Diagnosis was established by surgical cardiac biopsy reporting CD3-positive, CD8-positive, and CD30-negative T-cell lymphoma with clonal overlap with prior cutaneous disease. Given concern for paradoxical progression, therapy was transitioned to avelumab, an antiprogrammed death ligand-1 antibody. After nivolumab discontinuation and transition to avelumab, the patient experienced complete metabolic resolution of cardiac involvement, improvement in cardiac biomarkers, and durable control of cutaneous lymphoma over more than 3 years of follow-up. This case highlights a temporal association between programmed cell death-1 blockade and atypical dissemination of cutaneous T-cell lymphoma, supported by biologic plausibility, and underscores a potential therapeutic distinction between programmed cell death-1 and programmed death ligand-1 inhibition in malignant T-cell disorders.", "keywords": [], "year": "2026", "doi": "10.1016/j.mayocpiqo.2026.100728"}, {"pmid": "42312166", "title": "Kidney-Targeted Nanoparticle Delivery of Formoterol Mitigates Diabetic Kidney Disease without Adverse Cardiac Effects.", "abstract": "Mitochondrial dysfunction plays a critical role in the progression of diabetic kidney disease (DKD). Previous research indicates that the FDA-approved &#x3b2;2-adrenergic receptor agonist and bronchodilator formoterol are efficacious at restoring mitochondrial function and slowing DKD progression. Unfortunately, &#x3b2;2-adrenergic receptor antagonists have been shown to result in cardiovascular toxicity. To mitigate these negative effects while maintaining the therapeutic capabilities of formoterol, we developed formoterol-containing renally targeted polymeric nanoparticles (NPs). Biocompatible NPs were synthesized (300-400 nm), and efficient internalization by renal proximal tubule cells was confirmed. NPs were administered to SKH-1 Elite mice, and renal accumulation was observed within 1h and retained for 144h. To determine the therapeutic potential of this strategy for DKD treatment, BTBR ob / ob mice, a model of type 2 diabetes, were administered formoterol free drug (FFD) or formoterol-containing NPs (FNP) for 8 weeks. FFD and FNP administration slowed progression of DKD, as evidenced by reduced blood glucose levels, urine output, and the albumin:creatinine ratio. FNPs also decreased glomerular hyperfiltration, mesangial expansion, glomerulosclerosis, and tubular inflammation in BTBR ob / ob mice. Importantly, unlike FFD, the chronic administration of NP-encapsulated formoterol did not show evidence of cardiovascular toxicity. This approach introduces novel renally targeted, formoterol-containing polymeric NPs as a potential therapeutic for hyperglycemia-induced DKD.", "keywords": [], "year": "2026", "doi": "10.1021/acsptsci.6c00009"}, {"pmid": "42288441", "title": "Fibroblast growth factor 23 and mortality, heart failure and cardiovascular events across the chronic kidney disease spectrum - A systematic review and meta-analysis.", "abstract": "Fibroblast growth factor 23 (FGF23) has been implicated in the excess cardiovascular risk of chronic kidney disease (CKD), but its prognostic value remains uncertain. We conducted a systematic review and meta-analysis to assess the association of FGF23 with all-cause mortality, heart failure (HF), and atherosclerotic cardiovascular (aCV) events across the CKD spectrum. PubMed/MEDLINE and Embase were searched from inception to February 9, 2026. Observational studies enrolling adults with CKD G1-G5, end-stage kidney disease (ESKD), or kidney transplant were eligible if they reported adjusted hazard ratios for baseline intact FGF23 (iFGF23) or C-terminal FGF23 (cFGF23). Random-effects models were used for quantitative synthesis. Forty-one studies were included in the systematic review and 31 studies (25,104 patients) in the meta-analysis. Higher continuous FGF23 was associated with increased all-cause mortality (HR 1.52, 95% CI 1.26-1.83), HF (HR 1.34, 95% CI 1.22-1.58), and aCV events (HR 1.23, 95% CI 1.08-1.41). Assay type contributed importantly to heterogeneity. For mortality, cFGF23 showed a robust association, whereas iFGF23 did not (P interaction &lt;0.001). A similar pattern was observed for HF, with stronger associations for cFGF23. For aCV events, no significant assay-related subgroup difference emerged. Sensitivity analyses using categorical FGF23 were consistent, and in ESKD the highest FGF23 category was associated with higher mortality. Higher FGF23 levels are associated with adverse cardiovascular outcomes and mortality across the CKD spectrum, but the strength and consistency of these associations vary by assay type. cFGF23 showed more consistent associations, particularly for mortality and HF, although the clinical utility of this finding remains to be established.", "keywords": [], "year": "2026", "doi": "10.1016/j.ejim.2026.106987"}, {"pmid": "42287825", "title": "Acute isometric handgrip exercise enhances cardiac baroreflex sensitivity and lowers systolic blood pressure in chronic kidney disease.", "abstract": "Chronic kidney disease (CKD) impairs cardiac baroreflex sensitivity (cBRS), contributing to poor blood pressure (BP) control and heightened cardiovascular risk. Emerging evidence indicates that isometric handgrip (IHG) exercise may enhance cBRS in healthy individuals; however, its effects in CKD remain unclear. Therefore, this study tested the hypothesis that a single IHG session increases cBRS and reduces beat-to-beat BP variability (BPV) in CKD patients. In 21 patients (61&#xa0;&#xb1;&#xa0;12&#xa0;yr; stages III-IV), beat-to-beat BP (finger photoplethysmography), heart rate (HR, electrocardiography), and respiration were continuously measured before and 10-, 20-, and 30-min post IHG vs. sham exercise in a crossover design. cBRS was assessed via the sequence technique and cardiac autonomic modulation via time- and frequency-domain HR variability (HRV). BPV was quantified using time domain indexes. cBRS increased following IHG exercise (10-min: &#x394;20&#xa0;&#xb1;&#xa0;4%; 20-min: &#x394;23&#xa0;&#xb1;&#xa0;5%; 30-min: &#x394;17&#xa0;&#xb1;&#xa0;5%; all P&#xa0;&lt;&#xa0;0.004 vs rest). This increase was significantly different from sham at 10-min and 20-min (all P&#xa0;&lt;&#xa0;0.006 vs sham), but not at 30-min post-IHG (P&#xa0;=&#xa0;0.074). HR decreased throughout recovery (all P&#xa0;=&#xa0;0.001 vs rest). Systolic BP decreased 30-min following IHG exercise (&#x394;-5&#xa0;&#xb1;&#xa0;2&#xa0;mmHg; P&#xa0;=&#xa0;0.047 vs. rest). Time-domain HRV increased during recovery (P&#xa0;=&#xa0;0.005) whereas BPV remained unchanged following IHG exercise. After sham, all variables remained similar to rest, except systolic BP was significantly higher 20-min after sham. A single IHG session increased cBRS and vagal modulation, with a modest reduction in systolic BP and no change in BPV, in CKD patients. Overall, these findings suggest that IHG may serve as a non-pharmacological intervention for cardiovascular regulation in CKD.", "keywords": [], "year": "2026", "doi": "10.1016/j.autneu.2026.103446"}, {"pmid": "42285269", "title": "High-sensitivity C-reactive protein as a prognostic biomarker in cardiovascular diseases: implications for atherosclerosis, chronic kidney disease, and heart failure - a review.", "abstract": "High-sensitivity C-reactive protein (hsCRP) is gaining recognition as an important prognostic biomarker in cardiovascular diseases (CVDs), including atherosclerotic CVD (ASCVD), with and without chronic kidney disease (CKD), and heart failure (HF). Evidence suggests that systemic inflammation, measured by hsCRP, is prevalent in individuals with ASCVD, CKD, and HF, and is linked to increased risk of cardiovascular events. This review explores the interconnectedness of ASCVD, CKD, and HF within the cardiovascular-kidney-metabolic axis, with systemic inflammation emerging as a common underlying driver. Prevalence estimates show that systemic inflammation (hsCRP &#x2265; 2 mg/L) is found in 38% to 59% of patients with ASCVD, in 42% to 65% of those with both ASCVD and CKD, and in over 50% in various HF cohorts. Elevated levels of hsCRP are consistently associated with higher rates of major adverse cardiovascular events and mortality across these populations. Although hsCRP is frequently found to carry prognostic value independent of traditional biomarkers such as low-density lipoprotein cholesterol, its clinical adoption in practice is held back in part by guideline variability, lack of standardized cutoffs, and debate over how results may change clinical management with currently available therapies. The review calls for further research to define optimal hsCRP thresholds, examines the role of hsCRP in cardiovascular risk assessment, and reviews the ongoing development programs for emerging anti-inflammatory therapies. Addressing systemic inflammation could become a cornerstone of CVD management, potentially reducing residual risk beyond traditional targets.", "keywords": [], "year": "2026", "doi": "10.1016/j.tcm.2026.06.001"}, {"pmid": "42282057", "title": "Finerenone vs. spironolactone to reduce adverse outcomes in patients with cardiac-kidney-metabolic syndrome complicated by atrial fibrillation: findings from the Tianjin atrial fibrillation project.", "abstract": "", "keywords": [], "year": "2026", "doi": "10.1093/ehjopen/oeag077"}, {"pmid": "42267897", "title": "Multiomics Analysis Identifies Candidate Molecular, Microbiota, and Metabolite Features Associated with Acute Myocardial Infarction Combined with Chronic Renal Failure.", "abstract": "Chronic renal failure (CRF) is a major risk factor for acute myocardial infarction (AMI) progression and poor outcomes, but the molecular, microbial, and metabolic features of AMI combined with CRF remain unclear. In this study, four Gene Expression Omnibus datasets were analyzed separately. GSE194388 and GSE180393 were used as discovery cohorts for AMI and CRF, and GSE109048 and GSE142153 were used as validation cohorts. Fecal samples from CRF patients without AMI (negative control [NC], n = 10) and patients with AMI and advanced CKD (SY, n = 10) were analyzed by 16S rRNA sequencing. Matched serum samples were analyzed by untargeted metabolomics. Four shared candidate hub genes, PTPRC, ITGAL, CD44, and SELL, were identified and showed preliminary discriminatory performance in validation datasets, although potential overfitting should be considered. These genes were positively correlated with increased immune cell subsets. Compared with NC, SY showed exploratory taxa-level microbiota differences, including increased Enterobacterales and decreased Bifidobacterium , without significant global diversity differences. Differential serum metabolites, including increased l-kynurenine and decreased glucose, were also identified and correlated with altered taxa. This integrated multiomics analysis identified candidate immune-related genes, microbiota features, and serum metabolites associated with AMI combined with CRF, providing preliminary evidence for future validation.", "keywords": [], "year": "2026", "doi": "10.1177/15578100261457660"}], "pubmed_query": "(\"heart\"[Title] OR \"cardiac\"[Title] OR \"myocardial\"[Title] OR \"cardiomyocyte\"[Title] OR \"left ventricle\"[Title] OR \"myocardium\"[Title]) AND (\"kidney\"[Title] OR \"renal\"[Title] OR \"nephron\"[Title] OR \"glomerular\"[Title] OR \"tubular\"[Title] OR \"nephrology\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Heart__Liver", "source": "Heart", "target": "Liver", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: TSH, TH, Insulin, Glucagon\nNotes: - At a fasting and resting state, the heart, kidney, and liver all take up Fatty acids secreted form the WAT which might lead to a more coordinated metabolism of these organs.\nSources:", "connection_type": "Hormonal connection", "key_players": ["TSH", "TH", "Insulin", "Glucagon"], "key_players_metabolites": ["glucose", "fructose", "alanine", "bilirubin", "fatty acid", "fatty acids", "cholesterol", "triglycerides", "triglyceride", "glycogen", "atp", "amino acids", "lipoprotein", "uric acid", "amp", "glutamate", "amino acid", "serine", "hdl", "ldl", "nefa", "acetyl-coa", "creatinine", "acetate", "palmitate", "citrate", "bile acids", "isoleucine", "leucine", "lactate", "prostaglandin", "arginine", "creatine", "urea", "succinate", "nadh", "phospholipid", "nadph", "bile acid"], "key_players_hormones": ["insulin", "angiotensin", "tnf", "fetuin-a", "natriuretic peptide", "igf1", "anp", "adiponectin", "vitamin d", "glp-1", "glucagon", "il-6", "fgf21", "mineralocorticoid", "angiotensin ii", "tumor necrosis factor", "renin", "t3", "il-10", "vasopressin", "interleukin-6", "erythropoietin", "visfatin"], "key_players_proteins": ["sglt2", "cd36", "ampk", "mtor", "akt", "sirt1", "glp-1 receptor", "mtorc1", "mtorc2", "adiponectin receptor", "pgc-1", "inos", "insulin receptor", "sglt1", "pi3k", "p38", "glut4", "cpt1", "cyp7a1", "srebp"], "key_players_counts_metabolites": {"cholesterol": 8, "amp": 5, "glycogen": 7, "palmitate": 1, "citrate": 1, "atp": 7, "bilirubin": 16, "bile acids": 1, "hdl": 3, "acetyl-coa": 2, "amino acids": 7, "glucose": 50, "isoleucine": 1, "fatty acid": 12, "glutamate": 4, "leucine": 1, "ldl": 3, "lactate": 1, "prostaglandin": 1, "arginine": 1, "nefa": 3, "amino acid": 4, "creatinine": 2, "lipoprotein": 6, "triglycerides": 8, "acetate": 2, "creatine": 1, "uric acid": 6, "urea": 1, "triglyceride": 8, "fatty acids": 10, "fructose": 23, "succinate": 1, "nadh": 1, "phospholipid": 1, "nadph": 1, "serine": 4, "bile acid": 1, "alanine": 17}, "key_players_counts_hormones": {"tnf": 10, "natriuretic peptide": 9, "fetuin-a": 10, "fgf21": 4, "glucagon": 6, "mineralocorticoid": 4, "angiotensin ii": 4, "erythropoietin": 1, "renin": 2, "adiponectin": 7, "insulin": 40, "t3": 2, "vitamin d": 7, "il-10": 2, "visfatin": 1, "tumor necrosis factor": 4, "vasopressin": 2, "glp-1": 7, "il-6": 5, "igf1": 8, "anp": 8, "angiotensin": 13, "interleukin-6": 2}, "key_players_counts_proteins": {"pi3k": 1, "mtorc1": 5, "p38": 1, "mtorc2": 4, "glut4": 1, "adiponectin receptor": 3, "sglt2": 13, "cpt1": 1, "glp-1 receptor": 6, "insulin receptor": 2, "akt": 9, "sglt1": 2, "cd36": 13, "pgc-1": 3, "ampk": 11, "sirt1": 7, "inos": 3, "mtor": 11, "cyp7a1": 1, "srebp": 1}, "notes": "- At a fasting and resting state, the heart, kidney, and liver all take up Fatty acids secreted form the WAT which might lead to a more coordinated metabolism of these organs.", "sources": [], "ai_description": "The Heart-Liver axis is a complex interplay between metabolic dysfunction and organ-specific signaling pathways. In non-ischemic dilated cardiomyopathy [1], liver fibrosis and fatty liver disease contribute to cardiac remodeling through the release of pro-inflammatory cytokines such as TNF-α, which activates the NF-κB pathway in cardiac tissue. Conversely, the gut-liver-heart axis is also implicated in coronary artery disease, where chronic metabolic dysbiosis leads to increased circulating ATP from hepatic ischemia-reperfusion [4], driving macrophage inflammasome activation and remote cardiac injury. Dietary omega-3 fatty acids have been shown to exert protective effects on both cardiac and hepatic function, potentially mitigating the impact of these signaling pathways [3].", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42331709", "title": "Metabolic dysfunction-associated fatty liver disease and cardiac remodeling in non-ischemic dilated cardiomyopathy.", "abstract": "Metabolic dysfunction-associated fatty liver disease (MAFLD) represents systemic metabolic dysfunction and is significantly associated with cardiovascular disease. However, its specific impact on cardiac remodeling in non-ischemic dilated cardiomyopathy (NIDCM) remains unclear. This study aimed to investigate the impact of MAFLD and liver fibrosis on biventricular remodeling in patients with NIDCM. We evaluated 293 NIDCM patients using comprehensive echocardiography. Liver fibrosis was assessed via the NAFLD Fibrosis Score (NFS). Associations were analyzed using multivariable linear regression and dose-response models. MAFLD was independently associated with a larger right ventricular diameter (RV; &#x3b2;&#xa0;=&#xa0;3.32, P&#xa0;=&#xa0;0.01), increased LV posterior wall thickness (&#x3b2;&#xa0;=&#xa0;0.399, P&#xa0;=&#xa0;0.037), and a lower LV mass index (LVMI; &#x3b2;&#xa0;=&#xa0;-22.11, P&#xa0;=&#xa0;0.006), alongside a reduced prevalence of eccentric hypertrophy. This reduction in LVMI showed a graded pattern across MAFLD subtypes, being most pronounced in MAFLD with diabetes. Independently of MAFLD, more severe liver fibrosis (higher NFS) was associated with larger right heart dimensions (RV, right atrium, and main pulmonary artery) across all adjusted models. MAFLD and liver fibrosis are associated with distinct cardiac remodeling phenotypes in NIDCM, notably right heart enlargement and a unique pattern of LV remodeling. These findings highlight the clinical relevance of the liver-heart axis and support routine hepatic assessment in NIDCM management.", "keywords": [], "year": "2026", "doi": "10.1016/j.numecd.2026.104752"}, {"pmid": "42331355", "title": "Interaction of heart failure with chronic kidney disease, liver disease and cancer: the need for systems cardiology.", "abstract": "", "keywords": [], "year": "2026", "doi": "10.1093/eurheartj/ehag476"}, {"pmid": "42323382", "title": "Protective effects of dietary omega-3 on cardiac and hepatic function, mortality, and gene expression in broilers under high stocking density.", "abstract": "This study aimed to investigate the effects of dietary omega-3 fatty acids on cardiac and liver function, mortality rates, hematological parameters, tissue morphometric, and gene expression in broilers exposed to high stocking density (HSD). A total of 420 one-day-old Arian broiler chicks were allocated to a 2 &#xd7; 2 factorial arrangements consisting of two stocking densities [standard stocking density (SSD; 9 birds/m 2 ) and high stocking density (HSD; 16 birds/m 2 )] and two levels of omega-3 supplementation (0.057% basal vs. 0.5%) within a completely randomized design. At 40 days of age, birds reared under HSD and supplemented with 0.5% omega-3 showed significantly lower total ventricle-to-body weight (TV/BW) and right ventricle-to-body weight (RV/BW) ratios compared with the other groups (P &#x2264; 0.05). Additionally, omega-3 supplementation significantly reduced mortality rates in birds reared under both SSD and HSD (P &#x2264; 0.05). Omega-3 supplementation significantly reduced serum concentrations of alanine aminotransferase (ALT) and aspartate aminotransferase (AST) (P &#x2264; 0.05). Histological analysis showed that birds reared under HSD with omega-3 supplementation had thinner pulmonary arterial walls compared with those under HSD without omega-3, as well as those reared under SSD regardless of supplementation. The smallest cardiomyocyte diameter was recorded in birds reared under HSD and supplemented with 0.5% omega-3 (P &#x2264; 0.05). Gene expression analysis revealed that acetyl-CoA carboxylase alpha (ACACA) and Phosphofructokinase-1 (PFK1) were significantly down-regulated in the liver tissue of birds reared under HSD compared with those fed HSD diets supplemented with omega-3 (P &#x2264; 0.05). Overall, omega-3 supplementation was associated with reduced mortality, lower liver enzyme levels, attenuated histological alterations in the pulmonary artery and RV, and modulation of hepatic genes related to energy metabolism.", "keywords": [], "year": "2026", "doi": "10.1038/s41598-026-58263-x"}, {"pmid": "42309495", "title": "Circulating ATP from hepatic ischemia-reperfusion drives remote cardiac injury via macrophage inflammasome activation.", "abstract": "Cardiac complications after major hepatic surgery are frequent, yet how hepatic ischemia-reperfusion injury (HIRI) damages the remote heart is unknown. In 382 hepatectomy patients, the incidence of myocardial injury after noncardiac surgery (MINS) rose from 20.5% to 50% with increasing postoperative liver damage severity (P&#x202f;&lt;&#x202f;0.0001). In a murine HIRI model, cardiac dysfunction lagged behind hepatic injury; circulating ATP surged within one hour of reperfusion from the ischemic liver and was both sufficient and necessary to drive remote cardiac damage. Extracellular ATP activated the P2X7 receptor on cardiac macrophages, triggering NLRP3 inflammasome assembly and gasdermin D (GSDMD)-dependent cardiomyocyte pyroptosis; siRNA-based dominant-gating co-culture identified macrophage P2X7 as the upstream gating step, with cardiomyocyte-side P2X7 knockdown failing to abrogate downstream pyroptosis. Single-cell profiling traced this program to monocyte-derived macrophages differentiating into inflammatory macrophages, and macrophages amplified hepatocyte-derived ATP into IL-1&#x3b2;-driven cardiomyocyte pyroptosis in vitro. Clodronate-mediated macrophage depletion preserved cardiac function. The selective P2X7 antagonist JNJ-47965567 polarized cardiac macrophages toward an anti-inflammatory phenotype and suppressed NLRP3-GSDMD pyroptosis when administered up to approximately 3&#x202f;h after reperfusion onset, defining a clinically relevant therapeutic window. Adenosine activated the A2A receptor and attenuated cardiac injury dose-dependently, reversed by SCH-58261, and conferred greater cardiac protection than dexamethasone or N-acetylcysteine. These findings establish cardiac macrophages as amplifiers of liver-derived danger signals and identify the ATP-P2X7/adenosine-A2A purinergic axis as a potential pharmacological target for perioperative cardioprotection.", "keywords": [], "year": "2026", "doi": "10.1016/j.phrs.2026.108306"}, {"pmid": "42301766", "title": "Integrative analysis of the gut-liver-heart axis in&#xa0;coronary artery disease: From chronic metabolic dysbiosis to acute cardiogenic shock.", "abstract": "The complex interplay between chronic metabolic disorders and acute cardiovascular decompensation represents a critical frontier in cardiology. This integrative research program conducted at Chongqing Medical University systematically examines the gut-liver-heart axis across the cardiovascular disease spectrum through three interconnected studies. First, a case-control investigation of coronary artery disease (CAD) patients with and without nonalcoholic fatty liver disease (NAFLD) revealed distinct intestinal dysbiosis patterns characterized by increased Coprococcus and Veillonella alongside decreased Parabacteroides, Bacteroides fragilis, and Bifidobacterium longum, with these microbial alterations correlating significantly with body mass index, triglyceride levels, and hepatic transaminases. Second, a retrospective cohort study of acute myocardial infarction complicated by cardiogenic shock demonstrated that elevated admission bilirubin (HR = 1.020, P = 0.003) and alanine aminotransferase independently predicted 30-day mortality, while serum albumin exerted protective effects (HR = 0.955, P &lt; 0.001). Third, analysis of a comprehensive clinical registry illuminated the systemic clustering of metabolic, renal, and inflammatory abnormalities that underpin both chronic cardiometabolic disease and acute cardiovascular collapse. Collectively, these findings establish a pathogenic continuum wherein chronic intestinal dysbiosis and subclinical hepatic dysfunction create a vulnerable substrate that amplifies injury during acute ischemic events. This research framework provides mechanistic insights into the gut-liver-heart axis and proposes integrated biomarker panels for risk stratification across cardiovascular disease stages.", "keywords": [], "year": "2026", "doi": "10.1556/030.2026.02892"}, {"pmid": "42292836", "title": "Metabolic dysfunction-associated steatotic liver disease and heart failure with preserved ejection fraction: mechanisms and clinical implications from a heart-liver metabolic axis perspective.", "abstract": "Metabolic dysfunction-associated steatotic liver disease (MASLD) and heart failure with preserved ejection fraction (HFpEF) are increasingly prevalent cardiometabolic disorders that frequently coexist in clinical practice. Growing evidence indicates that MASLD is associated with an increased risk of heart failure, with emerging data suggesting particular relevance to the HFpEF phenotype. This relationship is supported by several shared pathophysiological mechanisms, including insulin resistance, lipotoxicity, chronic low-grade inflammation, neurohormonal activation, microvascular dysfunction, fibrotic remodeling, and dysregulation of the gut-heart-liver axis, collectively supporting the concept of a heart-liver metabolic axis linking hepatic and cardiac injury. Clinically, MASLD, especially when accompanied by a greater fibrosis burden, may help identify a metabolically enriched HFpEF subgroup characterized by more advanced systemic derangement and organ remodeling. Although lifestyle intervention, sodium-glucose cotransporter 2 (SGLT2) inhibitors, incretin-based therapies, and liver-directed treatments have broadened the therapeutic framework for this overlap phenotype, prospective evidence specifically addressing patients with coexisting MASLD and HFpEF remains limited. This review summarizes the epidemiological links, shared mechanisms, risk stratification approaches, and therapeutic strategies relevant to the coexistence of MASLD and HFpEF.", "keywords": [], "year": "2026", "doi": "10.3389/fphar.2026.1863710"}, {"pmid": "42287816", "title": "Sweroside attenuates heart failure with preserved ejection fraction via targeting PCSK9-CD36 interaction to reduce cardiac-hepatic lipotoxicity.", "abstract": "Heart failure with preserved ejection fraction (HFpEF) is characterized by cardiac and hepatic lipotoxicity, necessitating effective therapeutic strategies. Sweroside, a natural compound with significant pharmacological activity, is widely investigated in pharmacological studies of cardiovascular and fatty liver diseases. However, its effects and mechanisms against HFpEF remain unclear. To investigate the effects of sweroside on cardiac function and cardiac/hepatic lipotoxicity in HFpEF mice, and to explore the underlying molecular mechanisms and targets. An HFpEF mouse model was established using a high-fat diet and l-NAME. Echocardiography, lipidomics, Masson staining, and Oil Red O staining were employed to assess the cardioprotective effects of sweroside, including the reduction of inflammation and inhibition of cardiac and hepatic lipid deposition in HFpEF mice. The effects of sweroside on lipotoxicity and inflammation induced by palmitic acid (PA) and oleic acid (OA) in H9c2, AC16, AML12, and HepG2 cells were investigated using immunofluorescence, flow cytometry, and Oil Red O staining. Western blot, co-immunoprecipitation, molecular docking, SPR, and LC-MS/MS were used to identify the direct binding of sweroside to CD36 and its impact on the PCSK9-CD36 complex. Finally, the regulatory role of sweroside on CD36 was confirmed using CD36-siRNA-transfected H9c2 cardiac cells and CD36-KO HepG2 cells. Sweroside significantly improved cardiac function and inhibited cardiac lipid deposition in HFpEF mice. Lipidomics results indicated that the improvement in cardiac function by sweroside was associated with the inhibition of inflammation and regulation of mitochondrial function. Consequently, sweroside significantly reduced the mitochondrial aggregation of the NLRP3 inflammasome in cardiac tissue, thereby suppressing the levels of IL-1&#x3b2; and IL-18. In both HFpEF mice and PA+OA-stimulated H9c2 and AC16 cardiac cell models, the ability of sweroside to inhibit lipid deposition, reduce NLRP3 inflammasome activation, and improve myocardial mitochondrial oxidative phosphorylation was potentially related to the downregulation of CD36. Furthermore, sweroside exerted a positive effect on hepatic lipid deposition in HFpEF mice. Similar effects were observed in PA+OA-stimulated AML12 and HepG2 cells, and this action was found to depend on the formation of the PCSK9-CD36 complex. Through methods including molecular docking, SPR, and LC-MS/MS, CD36 was identified as a potential direct binding target of sweroside. In CD36-siRNA-transfected H9c2 cardiac cells and CD36-KO HepG2 cells, the ability of sweroside to alleviate lipid deposition and inflammation was inhibited. This study reveals the pharmacological mechanism by which sweroside, by targeting the PCSK9-CD36 complex, inhibits the mitochondrial accumulation of the myocardial NLRP3 inflammasome, reduces inflammatory responses, reverses the hepatic lipid deposition phenotype, and improves cardiac function in HFpEF mice. Collectively, these findings provide a solid experimental basis for the development of anti-HFpEF therapeutics.", "keywords": ["Animals", "Heart Failure", "CD36 Antigens", "Proprotein Convertase 9", "Iridoid Glucosides", "Humans", "Mice", "Male", "Hep G2 Cells", "Liver", "Mice, Inbred C57BL", "Stroke Volume", "Disease Models, Animal", "Lipid Metabolism", "Rats", "Molecular Docking Simulation", "PCSK9 Inhibitors", "Myocardium", "Diet, High-Fat"], "year": "2026", "doi": "10.1016/j.phymed.2026.158403"}, {"pmid": "42281487", "title": "First Successful Bloodless Combined Heart-Liver Transplantation in a Jehovah's Witness.", "abstract": "Combined heart-liver transplantation (CHLT) represents an infrequent and highly intricate surgical intervention characterized by substantial risk. While isolated cases documenting bloodless heart transplantation or transfusion-free liver transplantation exist, a successful bloodless CHLT had not previously been recorded. This case report details the inaugural instance of such a procedure performed for a Jehovah's Witness patient. A 67-year-old male Jehovah's Witness with severe multi-vessel coronary artery disease and refractory angina, heart failure with preserved ejection fraction, and metabolic dysfunction-associated steatohepatitis (MASH)-related cirrhosis (stage III-IV) was admitted for transplant evaluation at Tampa General Hospital. Listed as UNOS Status 2e, he underwent bloodless CHLT. Preoperative hemoglobin was 15&#xa0;g/dL, and platelet count was 157&#xa0;000/&#xb5;L, optimized with erythropoietin and iron supplementation. Intraoperative blood conservation strategies included meticulous surgical techniques, acute normovolemic hemodilution (ANH, two units), cell salvage (675&#xa0;mL), cryoprecipitate (600&#xa0;mL), aminocaproic acid, and FEIBA (factor eight inhibitor bypassing activity). Both transplantations were uneventful. The patient was extubated on postoperative day 1 (POD 1). Endomyocardial biopsy on POD 16 showed no rejection. An echocardiogram on POD 18 confirmed preserved biventricular function (LVEF 60-65%). The patient was discharged on POD 24 with hemoglobin of 9.6&#xa0;g/dL and platelet count of 227&#xa0;000/&#xb5;L. At POD 60, he exhibited excellent function of both transplanted organs. This report expands the scope of bloodless medicine, offering a model for managing complex multi-organ transplants in patients with religious restrictions to blood products, with the patient continuing to exhibit excellent recovery approximately ten months post-transplant.", "keywords": ["Humans", "Male", "Jehovah's Witnesses", "Liver Transplantation", "Aged", "Heart Transplantation", "Bloodless Medical and Surgical Procedures", "Prognosis"], "year": "2026", "doi": "10.1111/ctr.70592"}, {"pmid": "42254082", "title": "Citrus Essential Oil Nanoemulsions Mitigate Cardiac, Hepatic, and Pancreatic Injury in High-Fat Obese Rats via Adiponectin/SIRT1/Nrf2 Signaling Pathways.", "abstract": "Citrus oils (COs) are consumed as herbal tea in traditional medicine to ameliorate the obesity-induced consequences. Citrus limon oil (CLO), C. aurantiifolia oil (CAO), and C. japonica oil (CJO) are widely dispersed for their medicinal properties. However, it is yet unknown how these oils work to reduce obesity. This work investigates the potential beneficial effects of the nanoemulsions (NEs) of Citrus essential oils (EOs) on hepatic steatosis and cardiac and pancreatic injury in high-fat diet (HFD)-induced obese rats and the mechanisms behind these effects. EOs were formulated as NEs using the ultrasonic emulsification method. The three NEs (150&#x2009;mg/kg) were orally and separately administered along with the standard metformin (500&#x2009;mg/kg) for 30&#x2009;days after prior induction of obesity by HFD for a period of 12&#x2009;weeks. Treatments with NEs improved HFD-induced obesity with different potentials. The NE of CJO represented more cytoprotective and antisteatotic activities. It resulted in a preferential reduction of body weight and serum levels of glucose and lipids, as well as tissue injury and oxidative stress biomarkers that were accompanied by improved tissue architectures. At the molecular level, it upregulated the antioxidants Nrf2, HO-1, and SIRT1. It also increased the levels of adiponectin while decreasing visfatin. Furthermore, it downregulated the apoptotic executor, active caspase-3. The CJO NEs have shown strong promise in lowering obesity-induced hepatic steatosis and mitigating cardiac and pancreatic injury via hypoglycemic, antidyslipidemic, cytoprotective, antioxidant, and antiapoptotic activities. These beneficial effects are collectively associated with modulating the adiponectin/SIRT1/Nrf2 signaling cascade.", "keywords": [], "year": "2026", "doi": "10.1155/jnme/3343221"}, {"pmid": "42237599", "title": "ERA4Health funded project: liver-heart crosstalk in heart failure.", "abstract": "", "keywords": [], "year": "2026", "doi": "10.1093/eurheartj/ehag360"}], "pubmed_query": "(\"heart\"[Title] OR \"cardiac\"[Title] OR \"myocardial\"[Title] OR \"cardiomyocyte\"[Title] OR \"left ventricle\"[Title] OR \"myocardium\"[Title]) AND (\"liver\"[Title] OR \"hepatic\"[Title] OR \"hepatocyte\"[Title] OR \"hepatocellular\"[Title] OR \"nonalcoholic fatty liver\"[Title] OR \"NAFLD\"[Title] OR \"NASH\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Heart__Lung", "source": "Heart", "target": "Lung", "color": "#64748b", "description": "Type: Stress response\nKey Players: \nNotes: - Might be as nervous patients during the scan breathe more heavily and have a higher heart rate. \nSources:", "connection_type": "Stress response", "key_players": ["Notes: - Might be as nervous patients during the scan breathe more heavily and have a higher heart rate."], "key_players_metabolites": ["glucose", "amp", "fatty acid", "hdl", "cholesterol", "ammonia", "ldl", "lactate", "atp", "creatinine", "lipoprotein", "acetate", "creatine", "triglyceride", "amino acids", "triglycerides", "fatty acids", "adp", "sphingolipid", "oxaloacetate", "glycine", "citrate", "bilirubin", "cysteine", "prostaglandin", "arginine", "uric acid", "urea", "serine", "linoleate"], "key_players_hormones": ["angiotensin", "tnf", "bnp", "apelin", "il-6", "mineralocorticoid", "insulin", "testosterone", "natriuretic peptide", "tumor necrosis factor", "angiotensin ii", "adrenaline", "vasopressin", "interleukin-6", "cortisol", "growth hormone", "estrogen", "il-10", "estradiol", "anp"], "key_players_proteins": ["sglt2", "sirt1", "akt", "pgc-1", "ucp2", "mapk", "pi3k", "tfam", "ampk", "inos", "mtor", "pdk1", "jnk", "p38", "cox-2"], "key_players_counts_metabolites": {"cholesterol": 7, "ammonia": 6, "sphingolipid": 1, "oxaloacetate": 1, "glycine": 1, "amp": 27, "citrate": 1, "atp": 5, "bilirubin": 1, "hdl": 8, "amino acids": 2, "glucose": 44, "fatty acid": 12, "ldl": 6, "lactate": 6, "cysteine": 1, "prostaglandin": 1, "arginine": 1, "creatinine": 5, "lipoprotein": 5, "triglycerides": 2, "acetate": 4, "creatine": 3, "uric acid": 1, "urea": 1, "triglyceride": 3, "fatty acids": 2, "adp": 2, "serine": 1, "linoleate": 1}, "key_players_counts_hormones": {"tnf": 8, "testosterone": 5, "bnp": 7, "natriuretic peptide": 5, "mineralocorticoid": 6, "angiotensin ii": 3, "cortisol": 1, "growth hormone": 1, "estrogen": 1, "insulin": 6, "apelin": 7, "il-10": 1, "adrenaline": 2, "tumor necrosis factor": 5, "vasopressin": 2, "il-6": 7, "estradiol": 1, "anp": 1, "angiotensin": 12, "interleukin-6": 2}, "key_players_counts_proteins": {"pdk1": 1, "mapk": 4, "jnk": 1, "pi3k": 3, "p38": 1, "ucp2": 7, "tfam": 2, "sglt2": 24, "akt": 11, "cox-2": 1, "pgc-1": 8, "ampk": 2, "sirt1": 12, "inos": 2, "mtor": 2}, "notes": "- Might be as nervous patients during the scan breathe more heavily and have a higher heart rate.", "sources": [], "ai_description": "The heart-lung axis is intricately linked through the release of key signaling molecules such as apelin [4], which plays a crucial role in regulating pulmonary vascular tone and right ventricular function [3]. The activation of soluble guanylate cyclase by vericiguat [5] also modulates atrial and pulmonary vein arrhythmogenesis, further highlighting the interdependence between cardiac and pulmonary physiology. Furthermore, dysregulation of the apelinergic pathway has been implicated in the pathophysiology of pulmonary arterial hypertension (PAH) [4], while latent class analysis reveals heterogeneity in PAH subtypes associated with congenital heart disease [2]. These findings underscore the importance of considering both cardiac and pulmonary function when understanding the complex interactions within the heart-lung axis.", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42337349", "title": "Respiratory muscle training improves post-stroke sarcopenia independent of stroke type, pneumonia, and cardiac comorbidities.", "abstract": "Post-stroke sarcopenia (PSP) poses a significant rehabilitation challenge due to substantial clinical heterogeneity in stroke type and comorbidities. While respiratory muscle training (RMT) offers a promising approach by targeting core physiological function, its consistent efficacy across diverse PSP subtypes remains unestablished. This study aimed to determine whether RMT's benefits are consistent regardless of stroke etiology, pneumonia status, or cardiac function. This study consisted of two phases. Phase 1 was a retrospective analysis of 89 PSP patients to characterize clinical heterogeneity. Phase 2 was a prospective randomized controlled trial in which PSP patients were allocated to RMT plus standard care (n&#x2009;=&#x2009;30) or standard care alone (n&#x2009;=&#x2009;30). The protocol included 8 weeks of supervised RMT targeting diaphragmatic and accessory respiratory muscles. Outcomes included muscle mass (ASMI, calf circumference) and strength (handgrip) as primary measures, with physical function (MBI, FMA) as secondary outcomes. Prespecified subgroup analyses evaluated treatment interactions with stroke type, pneumonia, and cardiac function. The RMT group demonstrated significantly greater improvements in functional outcomes (MBI: p&#x2009;&lt;&#x2009;0.01; FMA: p&#x2009;&lt;&#x2009;0.05) and muscle mass metrics (ASMI: p&#x2009;&lt;&#x2009;0.05; calf circumference: p&#x2009;&lt;&#x2009;0.05) compared to controls. Crucially, subgroup analyses revealed no significant interactions between treatment effect and stroke type (ischemic/hemorrhagic), pneumonia status, or cardiac function (all p&#x2009;&gt;&#x2009;0.05), suggesting consistent efficacy of RMT across these subgroups. Exploratory analysis further showed RMT mitigated the limiting effects of baseline physiological status on rehabilitation potential. RMT constitutes an effective foundational rehabilitation strategy for PSP, demonstrating consistent efficacy across major clinical subtypes. These findings support implementation as standard care irrespective of specific stroke characteristics or cardiopulmonary comorbidities, addressing a critical need in heterogeneous PSP populations.Clinical trial registration number: ChiCTR2500111452.", "keywords": [], "year": "2026", "doi": "10.1038/s41598-026-59171-w"}, {"pmid": "42323108", "title": "Phenotyping of pulmonary arterial hypertension associated with congenital heart disease using latent class analysis: insights from a national prospective registry.", "abstract": "Pulmonary arterial hypertension associated with congenital heart disease (PAH-CHD) is characterized by substantial prognostic and therapeutic heterogeneity. Conventional clinical and anatomic-pathophysiological classifications fail to fully capture these intricacies. Unsupervised clustering approaches such as latent class analysis (LCA) have been used to address this limitation. Can LCA-derived phenogroups refine risk stratification and predict PAH-targeted treatment responses in adult patients with PAH-CHD? Adult PAH-CHD patients (N=889) from a multicenter prospective registry were stratified into post- and pre-tricuspid shunt subsets. LCA was performed in each subset using 28 candidate clinical, laboratory, and hemodynamic variables. Ten-year survival and the effect of PAH-targeted therapy across phenogroups were evaluated. LCA identified four phenogroups in each subset with distinct phenotyping patterns. In post-tricuspid shunts, Group 1 (\"adaptation with open shunt\") exhibited preserved right ventricular function and the best survival despite high afterload. Groups 3 (\"maladaptation and failure\") and 4 (\"closed shunt and failure\") faced 2 to 3-fold higher mortality than Group 1. Notably, Group 2 (\"hyperkinetic state\") uniquely benefited from combination therapy (interaction P=0.026). In pre-tricuspid shunts, Groups 1 (\"high shunt and mild resistance\") and 3 (\"young female and low inflammation\") demonstrated preserved survival despite varying afterloads. However, Group 2 (\"old male and comorbidities\") had significantly higher mortality and an attenuated treatment response (interaction P=0.037) despite sharing mild hemodynamics with Group 1. Group 4 (\"high resistance and failure\") faced severe hypoxemia and the worst prognosis. LCA successfully stratified PAH-CHD patients into distinct phenogroups with varied clinical profiles, survival, and treatment responses. This data-driven phenotyping system provides a novel approach for risk stratification and may guide personalized clinical decision-making.", "keywords": [], "year": "2026", "doi": "10.1016/j.chest.2026.06.019"}, {"pmid": "42319624", "title": "Beyond the right ventricle: left heart involvement in pulmonary arterial hypertension.", "abstract": "Pulmonary arterial hypertension (PAH) is characterized by progressive remodeling of the pulmonary vasculature, leading to increased pulmonary vascular resistance and chronic right ventricular (RV) pressure overload. As RV dysfunction develops, ventricular interdependence alters the structural and functional relationship between the right and left ventricles. Although normal left-sided filling pressures define PAH, growing evidence indicates that left ventricular (LV) mechanics may be substantially affected. Leftward septal displacement, pericardial constraint, and reduced pulmonary venous return contribute to chronic underfilling of the left atrium and LV, impairing ventricular geometry and contractile dynamics despite preserved intrinsic myocardial function. However, secondary myocardial remodeling in advanced disease remains debated. These alterations may lead to subclinical or overt LV dysfunction and represent an underrecognized component of PAH pathobiology. Imaging markers such as LV global longitudinal strain, LV outflow tract velocity-time integral, and left atrial strain have emerged as potential indicators of left-sided involvement and may provide additional prognostic information. In this narrative review, we summarize current evidence on the pathobiological mechanisms linking RV dysfunction to left-sided cardiac alterations and discuss the role of ventricular interdependence in the coupling of the pulmonary circulation. Understanding this interaction may help redefine PAH as a progressive biventricular syndrome and may improve risk stratification and clinical assessment.", "keywords": ["Humans", "Ventricular Dysfunction, Right", "Heart Ventricles", "Ventricular Remodeling", "Pulmonary Arterial Hypertension", "Ventricular Function, Right", "Hypertension, Pulmonary", "Ventricular Dysfunction, Left", "Global Longitudinal Strain"], "year": "2026", "doi": "10.1007/s10741-026-10643-1"}, {"pmid": "42313476", "title": "Apelin analog treatment reverses severe pulmonary arterial hypertension and right ventricular heart failure.", "abstract": "Pulmonary arterial hypertension (PAH) is a progressive vascular syndrome characterized by aberrant signaling, severe pulmonary artery remodeling, and right ventricular (RV) failure, a major driver of morbidity and mortality. Dysregulation of the apelinergic pathway has been implicated in pulmonary vascular remodeling in PAH. Using a sugen-hypoxia rat model of PAH, we assessed the ability of a novel apelin analog, resistant to native peptidase degradation, to reverse the pathological hallmarks of PAH and RV dysfunction. Apelin analog therapy corrected the vascular lesions in the lungs and nearly normalized pulmonary arterial pressures. Early cardiorenal syndrome, RV dilation and dysfunction as well as RV cardiomyocyte and fibroblast activation induced by pressure overload, were also reversed by apelin analog treatment. Single-nucleus RNA sequencing of the lungs and RV revealed apelin-analog treatment activated several protective pathways, including rebalancing protective BMPR2 (bone morphogenetic protein receptor type 2) signaling to counteract excessive pathogenic TGFBR2 (transforming growth factor &#x3b2; receptor 2) activity in PAH. These findings highlight the therapeutic potential of exogenous apelin in reversing pulmonary vascular and cardiac pathologies in PAH and support further investigation to evaluate the clinical benefits of apelin analog treatment in patients with PAH and RV failure.", "keywords": [], "year": "2026", "doi": "10.1172/jci.insight.200684"}, {"pmid": "42308916", "title": "Vericiguat, a soluble guanylate cyclase stimulator, regulates heart failure-enhanced atrial and pulmonary vein arrhythmogenesis.", "abstract": "Heart failure (HF) and atrial fibrillation (AF) often coexist and exacerbate each other. HF enhances pulmonary vein (PV; a key AF trigger) arrhythmogenesis and calcium dysregulation, thereby promoting AF initiation. Vericiguat, a soluble guanylate cyclase stimulator, improves outcomes in HF; however, its electrophysiological effects on PV arrhythmogenesis remain unclear. Using conventional microelectrodes, we examined the effects of vericiguat (0.1, 1, and 10&#x202f;&#x3bc;M) on PV action potential and electrical activity; the effects of vericiguat (10&#x202f;&#x3bc;M) on PVs pretreated with the protein kinase K (PKG) inhibitor KT5823 (1&#x202f;&#x3bc;M) or the protein kinase A (PKA) inhibitor H89 (10&#x202f;&#x3bc;M); and the effects of vericiguat (0.2&#x202f;mg/kg, intravenous, 5 days/week for 4 weeks) on the electrical activity of HF PVs. Whole-cell patch-clamp recordings measured L-type calcium current, sodium/calcium exchanger current, and late sodium current in isolated PV myocytes with or without vericiguat (10&#x202f;&#x3bc;M). Fluorescence imaging assessed calcium transients and cytosolic calcium content in PV myocytes with or without vericiguat (10&#x202f;&#x3bc;M). Vericiguat significantly reduced PV spontaneous activity and diastolic tension without altering resting membrane potential or action potential amplitude. These antiarrhythmic effects were abolished by KT5823 or H89, indicating involvement of PKG- and PKA-dependent signaling. Vericiguat suppressed L-type calcium current, sodium/calcium exchanger current, and late sodium current and improved intracellular calcium transients and sarcoplasmic reticulum calcium content. Moreover, vericiguat significantly reduced PV spontaneous activity in HF rabbits. Vericiguat attenuates PV arrhythmogenesis in HF through PKG- and PKA-dependent mechanisms.", "keywords": [], "year": "2026", "doi": "10.1016/j.biopha.2026.119675"}, {"pmid": "42305385", "title": "Right Ventricular-Pulmonary Artery Coupling Predicts Early Myocardial Strain Improvement in SGLT2 Inhibitor-Treated HFrEF.", "abstract": "While sodium-glucose cotransporter-2 (SGLT2) inhibitors clearly benefit left ventricular recovery in heart failure with reduced ejection fraction (HFrEF), their rapid effects on right ventricular (RV) function remain poorly characterized. This prospective observational study investigated the timeline and markers of biventricular changes shortly after SGLT2 inhibitor initiation. In this prospective observational study, 50 adults with HFrEF (LVEF &lt;40%) on optimal guideline-directed therapy underwent baseline and 3-month assessments after SGLT2 inhibitor initiation. Clinical parameters, functional capacity, and comprehensive echocardiography-including speckle-tracking-were evaluated. After 3 months, NT-proBNP levels decreased significantly (1116.5 vs 913.5 pg/mL, P &lt; 0.001). Improvements were observed in LV systolic function (LVEF 28.88 vs 30.32%, P = 0.001; LV-GLS -16.35% vs -17.70%, P = 0.001) and RV performance (RVEF 37.76 vs 39.40%, P = 0.002; RVFWS -16.8% vs -18.3%, P = 0.003). These changes were accompanied by gains in functional capacity (6MWT 291.4 &#xb1; 31.6 m vs 324.0 &#xb1; 36.8 m, P &lt; 0.001) and quality of life (KCCQ-12 44.22 &#xb1; 7.88 vs 49.70 &#xb1; 8.19, P &lt; 0.001). Improvement in RVFWS correlated strongly with changes in LV-GLS (r = 0.62, P &lt; 0.001), 6MWT (r = -0.67, P &lt; 0.001), and KCCQ-12 (r = -0.62, P &lt; 0.001). Multivariable linear regression identified baseline NT-proBNP (&#x3b2; = 0.253, P = 0.032), ischemic etiology (&#x3b2; = 0.217, P = 0.044), and the TAPSE/PASP ratio (&#x3b2; = -0.510, P &lt; 0.001) as independent predictors of RV strain improvement (model R 2 = 0.546). ROC analysis demonstrated that a baseline TAPSE/PASP ratio &#x2265;0.39 predicted RV functional response (AUC 0.84; sensitivity 76%, specificity 84%). In this prospective observational study without a control group, SGLT2 inhibitor initiation was associated with coordinated biventricular improvements within three months in HFrEF patients. The baseline TAPSE/PASP ratio may serve as a useful non-invasive predictor of early RV functional recovery. These preliminary findings require confirmation in larger controlled studies.", "keywords": [], "year": "2026", "doi": "10.37616/2212-5043.1504"}, {"pmid": "42292972", "title": "Complementary medicine as a holistic approach for pain management in heart and lung transplantation.", "abstract": "Perioperative pain management in thoracic organ transplantation continues to be challenging, with inadequate pain control correlating with extended recovery times, an increased incidence of chronic pain, and an overall poorer outcome. This review highlights the importance of a holistic approach in pain management following heart and lung transplantation, combining conventional pharmacological treatments with non-pharmacological techniques. The incidence of chronic pain in transplant recipients is high, with up to 75% of lung transplant recipients experiencing chronic pain within the first five years post-transplant. The contributing factors include surgical trauma, opioid induced hyperalgesia, graft-related discomfort, and musculoskeletal issues, whilst considering non-surgical influences such as biopsychosocial issues and gender. The implementation of complementary techniques for acute and chronic pain management includes mind-body and kinetic techniques. Recent research demonstrated the potential benefits of auricular acupuncture in reducing post-operative inflammation and pain. Early mobilization, specific respiratory exercises, and positive communication strategies are significant components of comprehensive pain management. Whilst evidence base for complementary interventions is still evolving, integrating them into post-operative care plans reflects a commitment to improving patient care. Greater research should concentrate on evaluating the efficacy of complementary therapy in heart and lung transplant recipients to optimize pain management strategies and enhance post-transplant quality of life.", "keywords": [], "year": "2026", "doi": "10.1016/j.jhlto.2026.100593"}, {"pmid": "42291554", "title": "Differential biomarker responses of hemolysis, inflammation, and myocardial injury after pulsed-field pulmonary vein isolation: balloon-in-basket vs. circular catheter systems.", "abstract": "Pulsed-field ablation (PFA) is a non-thermal energy source for pulmonary vein isolation (PVI). Data comparing the biological impact of different PFA technologies remain limited. This study assessed changes in biomarkers of hemolysis, inflammation, and biochemical myocardial injury using two PFA systems: a balloon-in-basket (BiB) and a circular catheter (PS). This prospective, single-center, non-randomized study enrolled consecutive patients undergoing first-time PVI. leukocytes, C-reactive protein (CRP), platelets, lactate dehydrogenase (LDH), haptoglobin, total bilirubin, troponin T, creatine kinase (CK), myoglobin, creatinine, and estimated glomerular filtration rate (eGFR) were before and 16-18&#x2005;h after ablation. Forty patients were included (BiB n &#x2009;=&#x2009;20, PS n &#x2009;=&#x2009;20). Baseline characteristics were comparable. Acute PVI was achieved in all cases. BiB required fewer applications (16 vs. 32, p &#x2009;&lt;&#x2009;0.001), more contrast (45 vs. 30&#x2005;mL, p &#x2009;&lt;&#x2009;0.001), and had longer procedure and LA dwell times ( p &#x2009;&lt;&#x2009;0.001). Both systems caused significant increases in leukocytes, CRP, LDH, troponin, and CK without inter-group differences. Haptoglobin decreased significantly in both, more pronounced with PS (&#x394; -13 vs. -4&#x2005;mg/dL, p &#x2009;=&#x2009;0.090). Renal function remained stable overall, with one PS patient developing an acute kidney injury. In the BiB group, &#x394;-Hemoglobin correlated inversely with application number ( p &#x2009;=&#x2009;0.046). In the PS group, &#x394; -Troponin and &#x394; -CK correlated positively ( p &#x2009;&lt;&#x2009;0.05). Despite comparable overall biomarker responses, a numerically greater, non-significant haptoglobin decline and an isolated, likely multifactorial transient AKI in the PS group may suggest differences in biomarker responses, warranting further investigation in larger studies. However, the clinical relevance of these findings remains uncertain.", "keywords": [], "year": "2026", "doi": "10.3389/fcvm.2026.1774443"}, {"pmid": "42279475", "title": "Baseline Chronic Obstructive Pulmonary Disease Identifies a High-Risk Cardiopulmonary Phenotype in Patients with Heart Failure Undergoing SGLT2 Inhibitor Therapy.", "abstract": "Background/Objectives: Chronic obstructive pulmonary disease (COPD) often coexists with heart failure (HF) and can complicate the interpretation of symptoms, biomarker profiles, and clinical deterioration. Its prognostic significance at the time of sodium-glucose cotransporter 2 inhibitor (SGLT2i) initiation remains incompletely defined. We therefore evaluated whether baseline COPD was associated with a greater biomarker burden and worse 12-month outcomes in a real-world HF cohort at the time of SGLT2i initiation. Methods: This prospective single-centre observational cohort included patients with HF enrolled in a tertiary registry between May 2022 and November 2024 in whom SGLT2i therapy was initiated. HF was diagnosed according to contemporary European Society of Cardiology (ESC) criteria on the basis of compatible symptoms and/or signs, objective structural or functional cardiac abnormalities on echocardiography, and elevated N-terminal pro-B-type natriuretic peptide (NT-proBNP). COPD status was defined by a documented pre-existing diagnosis at baseline. The primary endpoint was the 12-month time-to-first composite of all-cause death or unplanned hospitalization for acute decompensated HF. Results: Among 996 patients, 122 (12.2%) had COPD. Compared with patients without COPD, those with COPD more often had a smoking history, a higher comorbidity burden, a worse New York Heart Association (NYHA) class, higher baseline N-terminal pro-B-type natriuretic peptide (NT-proBNP) and C-reactive protein (CRP) levels, and a lower estimated glomerular filtration rate (eGFR), whereas baseline HF pharmacotherapy was broadly similar. NT-proBNP remained higher at 6 and 12 months, whereas CRP remained higher at 6 months but not at 12 months. In multivariable Cox analysis adjusting for age, sex, major comorbidities, left ventricular ejection fraction (LVEF), renal function, high-density lipoprotein cholesterol (HDL-C), glycated haemoglobin (HbA1c), CRP, and log NT-proBNP, COPD remained independently associated with the primary endpoint (hazard ratio [HR] 2.610, 95% confidence interval [CI] 1.707-3.991; p &lt; 0.001) and all-cause death (HR 2.097, 95% CI 1.246-3.532; p = 0.005). Conclusions: Among patients with HF starting SGLT2i therapy, baseline COPD identified a higher-risk cardiopulmonary phenotype characterized by a greater comorbidity burden, higher inflammatory and natriuretic biomarker levels, and worse 1-year outcomes. These observational findings support closer integrated cardiology-pulmonology follow-up.", "keywords": [], "year": "2026", "doi": "10.3390/diagnostics16111606"}, {"pmid": "42242603", "title": "Methane inhalation during ex vivo lung perfusion protects donor lungs after cardiac death via modulation of MAPK-related inflammatory and oxidative pathways.", "abstract": "The scarcity of donor lungs remains a significant challenge in lung transplantation (LTx). Ex vivo lung perfusion (EVLP) presents a promising approach to repair and assess lungs obtained from donation after cardiac death (DCD). Methane is a biologically active gas with reported anti-inflammatory and antioxidant effects and may serve as an adjunctive strategy during EVLP. A rat model of warm ischemia was established, followed by EVLP with or without methane supplementation (2.5%). Lung physiology, histological injury, edema, cell death, oxidative stress, and inflammatory cytokines were assessed after EVLP. RNA sequencing and gene set enrichment analysis were performed to explore underlying mechanisms. Donor left lungs were subsequently transplanted into recipient rats to evaluate post-transplant graft function, injury, and signaling pathway activation. Methane supplementation during EVLP was associated with improved oxygenation capacity, lower pulmonary vascular resistance, reduced pulmonary edema, and fewer cell death-related signals. Histological injury after EVLP showed a decreasing trend in methane-treated lungs but did not reach statistical significance compared with standard EVLP. Gene set enrichment analysis suggested downregulation of the MAPK signaling pathway. Methane treated lungs showed reduced phosphorylation of ERK, JNK, p38, and NF-&#x3ba;B p65, while enhancing Nrf2 and HO-1 expression. After transplantation, methane-preserved lungs exhibited attenuated inflammation and oxidative injury, with reduced cytokine levels accompanied by changes in MAPK-NF-&#x3ba;B/Nrf2 signaling. Methane inhalation during EVLP may improve DCD lung function by reducing inflammation and oxidative injury, and this effect persists after LTx.", "keywords": [], "year": "2026", "doi": "10.1016/j.healun.2026.05.027"}], "pubmed_query": "(\"heart\"[Title] OR \"cardiac\"[Title] OR \"myocardial\"[Title] OR \"cardiomyocyte\"[Title] OR \"left ventricle\"[Title] OR \"myocardium\"[Title]) AND (\"lung\"[Title] OR \"pulmonary\"[Title] OR \"alveolar\"[Title] OR \"bronchial\"[Title] OR \"respiratory\"[Title] OR \"pneumocyte\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Heart__Thyroid", "source": "Heart", "target": "Thyroid", "color": "#64748b", "description": "Type: Metabolic status\nKey Players: TSH, TH\nNotes: - TH  regulates Thermogenesis, energy utilization by increasing the basal metabolic rate and regulate lipid and glucose metabolism. At hyperthyroid condition: Increased heart rate. At Hypothyroid condition: decreased heart rate.\nSources:\n- doi: 10.1177/2042018820917869\n- https://doi.org/10.1152/physrev.00030.2013", "connection_type": "Metabolic status", "key_players": ["TSH", "TH"], "key_players_metabolites": ["glucose", "cholesterol", "amp", "atp", "lipoprotein", "hdl", "creatinine", "lactate", "triglycerides", "fatty acids", "ursodeoxycholic acid", "creatine", "nadph", "fatty acid", "ketone bodies", "glutamate", "amino acid", "uric acid", "urea", "phospholipid", "serine", "bile acid"], "key_players_hormones": ["thyroid hormone", "tsh", "t3", "thyroid hormones", "thyroxine", "triiodothyronine", "t4", "thyrotropin", "natriuretic peptide", "angiotensin", "vitamin d", "tnf", "bnp", "igf-1", "angiotensin ii", "norepinephrine", "cortisol", "insulin", "glucocorticoid", "noradrenaline", "tumor necrosis factor", "epinephrine", "tgf-b", "igf1", "anp"], "key_players_proteins": ["akt", "p38", "mapk", "pi3k", "acc", "tfam", "sirt1", "mtor", "jnk", "foxo1", "cd36", "erk1", "pdk4", "ampk"], "key_players_counts_metabol
