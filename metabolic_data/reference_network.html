e Dickkopf-3 levels as a marker of injury remained constant, the increase in &#x3b1;-1-microglobulin in urine could be an expression of functionally reduced protein reabsorption from the urine and thus reduced protein overload in the kidney cells, possibly representing a kidney-protective effect of SGLT2-I.", "keywords": [], "year": "2026", "doi": "10.1016/j.xkme.2026.101416"}, {"pmid": "42376496", "title": "Targeted Sirtuin 3 Activation by Biomimetic Black Phosphorus Nanosheets Mitigates Sepsis-Induced Acute Kidney Injury through Yeast Mitochondrial Escape 1-Like 1 Deacetylation.", "abstract": "Sepsis-induced acute kidney injury (AKI) is characterized by mitochondrial dysfunction and dysregulated inflammation, with a lack of effective therapies. Studies have found that down-regulation of Sirtuin 3 (Sirt3) expression in renal tubular epithelial cells is associated with mitochondrial imbalance, suggesting its potential as a therapeutic target. Based on this, the research team developed a targeted nanodelivery system: black phosphorus nanosheets loaded with a cortistatin agonist were encapsulated with macrophage membranes modified with (KKEEE)&#x2083;K peptides to specifically deliver Sirt3-activating components to the kidneys. This nanosystem demonstrated favorable stability and biocompatibility. Ex&#xa0;vivo experiments confirmed its ability to alleviate lipopolysaccharide-induced oxidative stress, apoptosis, and inflammation in HK-2 cells, while restoring mitochondrial function. Mechanistically, the nanomaterial regulates mitochondrial homeostasis by activating the Sirt3-YME1L1 deacetylation axis. This study provides a novel nano-therapeutic strategy for sepsis-induced AKI, combining targeting capability with metabolism regulation, and holds broad implications for the treatment of inflammatory organ damage.", "keywords": [], "year": "2026", "doi": "10.34133/bmr.0379"}, {"pmid": "42376458", "title": "Mitochondria-targeted strategies in cancer radiotherapy: from ROS regulation to immunogenic cell death.", "abstract": "Radiotherapy (RT) is a crucial treatment modality for various solid tumors. Its antitumor effects not only depend on direct DNA damage but also involve the disruption of redox homeostasis centered around mitochondria and the activation of immune responses. Mitochondria, as a central hub for cellular energy metabolism and apoptosis signaling, serve both as the primary source of reactive oxygen species (ROS) and as key targets for ROS attack during RT. RT promotes the sustained accumulation of mitochondrial ROS (mROS) through mechanisms such as damage to the mitochondrial respiratory chain complexes, while also triggering compensatory clearance responses from antioxidant systems. The dynamic balance between these processes determines the cell's fate. Moreover, mitochondria play a crucial regulatory role in immunogenic cell death (ICD). Damage-associated molecular patterns (DAMPs) such as mitochondrial DNA (mtDNA), ATP, and cytochrome c, along with ROS-mediated endoplasmic reticulum stress and calcium signaling, promote dendritic cell (DC) maturation and induce antitumor immunity. In recent years, mitochondria-based RT sensitization strategies have emerged, including small molecules that modulate mROS production or antioxidant defenses, mitochondria-targeted nanocarriers, gene-editing approaches, and bioregulatory or metabolic interventions. Most nanoplatforms, gene-editing strategies, and ICD-amplifying approaches are currently supported mainly by preclinical evidence, where they have been shown to enhance RT-induced tumor cell death, promote DAMP release, and improve antitumor immune activation. In contrast, selected metabolic or bioregulatory interventions have begun to enter early clinical evaluation, including ketogenic dietary interventions combined with immune checkpoint blockade in metastatic melanoma and renal cell carcinoma (e.g., NCT06391099 and NCT06896552), although definitive evidence of clinical benefit in combination with RT remains limited. This review systematically discusses mitochondrial mechanisms of ROS generation and clearance during RT, mitochondrial regulation of ICD pathways, and emerging mitochondria-targeted radiosensitization strategies, while emphasizing the current distinction between preclinical promise and clinical translational maturity.", "keywords": [], "year": "2026", "doi": "10.3389/fcell.2026.1861854"}, {"pmid": "42376436", "title": "Bidirectional relationship between metabolic dysfunction-associated steatotic liver disease and type 2 diabetes mellitus.", "abstract": "Metabolic dysfunction-associated steatotic liver disease (MASLD) and type 2 diabetes mellitus (T2DM) are two common, interconnected conditions that pose a major global health challenge. The worldwide prevalence of MASLD among individuals with T2DM exceeds 60 %, with a substantial proportion of cases having metabolic dysfunction-associated steatohepatitis (MASH) and an increased risk of liver-related complications, such as cirrhosis, liver failure, or hepatocellular carcinoma. The coexistence of MASLD and T2DM is also associated with poorer glycemic control and a higher risk of cardiovascular events, chronic kidney disease, and mortality. Notably, MASLD increases the risk of developing T2DM, with risk rising stepwise with liver disease severity, especially liver fibrosis. The close bidirectional relationship between MASLD and T2DM creates a vicious cycle that drives liver disease progression, worsens insulin resistance, and impairs glucose metabolism. This likely reflects shared underlying mechanisms, including insulin resistance, low-grade inflammation, lipotoxicity, adipose tissue dysfunction, and an altered gut-liver axis. Screening strategies are crucial for MASLD and T2DM, with current guidelines recommending assessment of liver fibrosis in all individuals with T2DM and regular screening for dysglycemia in those with MASLD. Pharmacological treatments, especially incretin-based therapies, sodium-glucose cotransporter 2 inhibitors, and resmetirom, show significant benefits across metabolic, hepatic, and extrahepatic outcomes. Overall, recognizing and addressing the bidirectional relationship between MASLD and T2DM is essential for better risk stratification, earlier intervention, and reduced long-term hepatic and extrahepatic complications. This narrative review summarizes current evidence on the bidirectional relationship between MASLD and T2DM, discussing epidemiological data, pathophysiological mechanisms, clinical implications, and therapeutic options. See also the graphical abstract(Fig. 1).", "keywords": [], "year": "2026", "doi": "10.17179/excli2026-9462"}, {"pmid": "42376110", "title": "Subchronic comparative assessment of graded ferrous sulfate doses on biochemical, histological, and multiorgan micromorphological changes in wistar rats.", "abstract": "Iron is a necessary trace element in the human body. However, excessive concentration can promote the overproduction of reactive oxygen species, leading to oxidative stress and organ injury. This study aims to evaluate the biochemical and micromorphological changes that occur following exposure to graded doses of ferrous sulfate in a rat model. The treated groups (D1, D2, D3, and D4) were orally and daily treated with graded doses of ferrous sulfate (12.5 mg/kg [D1], 25 mg/kg [D2], 50 mg/kg [D3], and 100 mg/kg [D4]) for 6 weeks, whereas the control group received only saline solution (0.9% NaCl solution at 5 ml/kg body weight) during the same period. Different doses of ferrous sulfate did not cause mortality. Weekly control of glucose levels in all rats revealed a remarkable interaction effect ( p = 0.02) between treatment and time, indicating that the dynamics of change over time differed among the groups. Moreover, a significant effect was detected in the time factor ( p &lt; 0.001) and in the second factor, which refers to the treatments ( p &lt; 0.001). In addition, ferrous sulfate differentially altered the levels of oxidative stress biomarkers, including glutathione, catalase, glutathione-S-transferase, and malondialdehyde, as well as the acetylcholinesterase activity in a dose- and organ-dependent manner. Histopathological examination revealed signs of liver inflammation and pancreatic and kidney hyperemia. Prussian blue staining revealed no significant iron deposits in any organs. Excessive iron may cause oxidative damage to vital organs and alter blood glucose levels.", "keywords": ["Animals", "Ferrous Compounds", "Oxidative Stress", "Rats", "Rats, Wistar", "Male", "Liver", "Dose-Response Relationship, Drug", "Kidney", "Blood Glucose"], "year": "2026", "doi": "10.5455/OVJ.2026.v16.i3.45"}, {"pmid": "42376063", "title": "Pathogenesis of Neovascular Glaucoma in Diabetic Retinopathy: A Review.", "abstract": "Neovascular glaucoma (NVG) secondary to diabetic retinopathy (DR) is a severe complication driven by ischemia-induced angiogenesis. Current evidence indicates that the pathogenesis begins with retinal hypoxia caused by hyperglycemia-induced capillary occlusion, which stabilizes hypoxia-inducible factor-1&#x3b1; (HIF-1&#x3b1;) and upregulates vascular endothelial growth factor (VEGF). VEGF-A and placental growth factor (PlGF) drive abnormal angiogenesis in the retina, iris, and anterior chamber angle. Downregulation of endogenous inhibitors such as pigment epithelium-derived factor (PEDF) may exacerbate this process. Concomitant inflammation mediated by cytokines including interleukin-6 (IL-6) and tumor necrosis factor-&#x3b1; (TNF-&#x3b1;), followed by transforming growth factor-&#x3b2; (TGF-&#x3b2;)-induced fibrotic angle closure, collectively leads to refractory intraocular pressure elevation and optic nerve damage. Clinical outcomes are influenced by genetic polymorphisms, renal comorbidities, and the aqueous humor biomarker profile. Current anti-VEGF monotherapy is limited by its inability to control fibrosis and inflammation, highlighting the need for multifaceted therapeutic strategies incorporating anti-inflammatory and antifibrotic agents. Critical knowledge gaps remain in longitudinal human data and preclinical models. To improve the prognosis of this devastating disease, shifting toward systemic metabolic management and prospective multiomics-based risk stratification may represent future directions.", "keywords": [], "year": "2026", "doi": "10.1155/joph/6448312"}], "color": "#ea580c"}}, {"data": {"id": "Liver", "label": "Liver", "description": "Function: Metabolic conversions, glucose storage and conversion.\nMetabolism:\n- Gluconeogenesis (inhibited by insulin), glycogen synthesis (promoted by insulin) and glycogenolysis.\n- Lipid oxidation\n- Protein/amino acid metabolism\nKey Metabolites: Glucose, glycogen,\nKey Proteins: GLUT2\nSources:\n- doi: 10.1016/j.cub.2017.09.019", "llm_description": "The liver plays a pivotal role in metabolizing various substrates, including carbohydrates, proteins, and fats, to produce energy for the body. It primarily consumes glucose from the bloodstream to generate glycogen, which can be stored for later use, or converted into glucose through gluconeogenesis [1]. The liver also produces bile salts, which aid in fat digestion and absorption, as well as hormones such as insulin-like growth factor-1 (IGF-1) and leptin, which regulate energy balance and metabolism [2]. Key hormones like glucagon, cortisol, and thyroid hormone also significantly influence liver function, with glucagon stimulating glycogenolysis and lipolysis, while cortisol promotes gluconeogenesis and lipogenesis [3]. The liver's metabolic activity is tightly regulated by various feedback mechanisms, including the hypothalamic-pituitary-adrenal (HPA) axis, which responds to changes in energy availability and storage.", "llm_papers": [{"pmid": "42376702", "title": "NRF2-Mediated immune evasion and ferroptosis resistance in hepatocellular carcinoma: implications for immune checkpoint inhibitor response.", "abstract": "Hepatocellular carcinoma (HCC) remains a major cause of cancer-related mortality, and immune checkpoint inhibitors have become central to systemic treatment for advanced disease. However, durable responses are limited to a subset of patients, indicating the need to clarify tumor-intrinsic mechanisms that shape immune resistance. Nuclear factor erythroid 2-related factor 2 (NRF2), encoded by Nuclear Factor Erythroid 2-Related Factor 2 Like 2 (NFE2L2), is a stress-responsive transcription factor that regulates antioxidant defense, detoxification, metabolism, and redox adaptation. Although transient NRF2 activation protects hepatocytes from oxidative injury, persistent activation in HCC may promote tumor survival, immune escape, and resistance to therapy. Emerging evidence links NRF2 activity to two biologically connected processes: suppression of ferroptosis and remodeling of the tumor immune microenvironment. Through downstream targets involved in glutathione synthesis, cystine transport, iron handling, and lipid peroxide detoxification, NRF2 can reduce ferroptotic vulnerability. In parallel, NRF2-associated inflammatory and immune-regulatory pathways, including the Cyclooxygenase-2 - Prostaglandin E2 (COX2-PGE2) axis, may contribute to immune-cold phenotypes and impaired response to immune checkpoint blockade. This review summarizes current evidence on NRF2/KEAP1 signaling in HCC, with emphasis on its role in immune escape, ferroptosis suppression, and its potential implications as a biomarker and therapeutic target for understanding and potentially improving immune checkpoint inhibitor responsiveness. We also discuss the potential of NRF2-related biomarkers and therapeutic strategies, while emphasizing the challenges of selectively targeting NRF2 in patients with underlying liver dysfunction.", "keywords": [], "year": "2026", "doi": "10.17998/jlc.2026.06.28"}, {"pmid": "42376639", "title": "Management of pregnancy and outcomes in a woman with mannose-6-phosphate isomerase deficiency (MPI-CDG).", "abstract": "Congenital Disorder of Glycosylation type Ib (MPI-CDG) is a rare autosomal recessive metabolic disorder caused by deficiency of mannose-6-phosphate isomerase, resulting in impaired N-glycosylation. Unlike other CDG subtypes, MPI-CDG is not associated with neurodevelopmental impairment and is effectively treated with oral D-mannose supplementation. However, evidence guiding management during pregnancy is scarce, and D-mannose is generally avoided due to limited safety data. We describe the long-term course and pregnancy outcomes of a woman diagnosed with MPI-CDG in infancy. She was treated with oral D-mannose throughout childhood with good clinical response but demonstrated intermittent non-compliance in adulthood, complicated by hepatic fibrosis, protein-losing enteropathy, osteoporosis, anaemia, and musculoskeletal manifestations. She had two pregnancies without D-mannose supplementation. The first pregnancy was complicated by microcytic anaemia, hypoalbuminemia, pregnancy-induced cholestasis, and emergency caesarean section. A male infant was delivered and later diagnosed with Hirschsprung disease, requiring surgical correction with good outcome. Postpartum assessment of the mother demonstrated progression of liver disease to cirrhosis (F4). The second pregnancy proceeded with fewer complications and resulted in emergency caesarean delivery of a healthy female infant with normal postnatal glucose control and growth. This case contributes to the limited literature on pregnancy in MPI-CDG and illustrates that successful pregnancies are possible despite advanced multisystem disease and cessation of D-mannose therapy. It highlights the importance of multidisciplinary care, close hepatic and nutritional monitoring, and the need for further studies to clarify the safety and role of D-mannose supplementation during pregnancy.", "keywords": [], "year": "2026", "doi": "10.1016/j.ymgmr.2026.101329"}, {"pmid": "42376605", "title": "Photoperiod effects on growth, lipid metabolism, and lipidomics analysis of tilapia.", "abstract": "To investigate the effects and underlying mechanisms of photoperiod on the growth and lipid metabolism of tilapia ( Oreochromis niloticus ). Four photoperiod treatment groups were established: 10L:14D, 12L:12D, 14L:10D, and 16L:8D. Various analytical methods were employed, including tissue sectioning, blood lipid analysis, gene expression profiling, fatty acid profiling, and lipidomics, to assess the impact of photoperiod on lipid metabolism in tilapia. In both females and males, the highest relative body weight growth rates were observed in the 16L:8D group, reaching 122.1% and 133.6%, respectively. As the photoperiod increased, the visibility of lipid droplets in the liver decreased. The expression levels of lipid synthesis&#x2011;related genes ( fasn, acaca, srebp1 , and aclya ) were downregulated. Blood lipid concentrations, including cholesterol (TC), triglyceride (TG), low&#x2011;density lipoprotein (LDL), and non&#x2011;esterified fatty acid (NEFA) levels, were reduced. Saturated fatty acid (SFA) content decreased, whereas polyunsaturated fatty acid (PUFA) content increased. Lipidomic analysis revealed 54 significantly differential lipid metabolites between the control group (12L:12D) and the experimental group (16L:8D) ( P &lt;0.05), and candidate biomarkers for photoperiod&#x2011;regulated lipid metabolism were identified. These findings suggest that a long photoperiod (16L:8D) effectively increases the growth rate of tilapia and reduces blood lipid concentrations and hepatic fat deposition, thereby promoting healthy growth. This study provides a theoretical foundation for healthy aquaculture practices in fish.", "keywords": [], "year": "2026", "doi": "10.3389/fphys.2026.1794531"}, {"pmid": "42376558", "title": "Effect of dietary Moringa oleifera leaf meal on feed conversion, egg traits, and immunometabolic responses in laying hens: In vivo and ex vivo assessments.", "abstract": "Moringa oleifera is a nutrient-rich plant widely explored for its potential as a natural feed additive in poultry due to its antioxidant, antimicrobial, and immunomodulatory properties. Incorporating Moringa leaf meal into laying hen diets may influence feed efficiency (FCR), egg quality, and immune-metabolic responses, warranting comprehensive in vivo and ex vivo investigations. This study investigated the impact of incorporating M . oleifera leaf meal (MOLM) into the diets of laying hens on egg productivity, egg characteristics, antioxidant capacity, immune response, and tissue morphology. Over an 8-week period, 40 30-week-old Hy-Line Brown layers were randomly distributed into four dietary groups (10 birds per group) and received nutritionally balanced diets with MOLM supplementation levels of 0%, 2.5%, 5.0%, or 7.5%. The key performance indicators, including feed intake, egg production, egg weight, and FCR, were recorded weekly. Egg quality traits and antioxidant parameters in liver and intestinal tissues were assessed along with pro-inflammatory cytokine levels and histopathological scoring. Inclusion of 7.5% MOLM significantly improved egg production (86.5%), egg weight (60.1 g &#xb1; desert), and FCR (2.04), compared with the control group ( p &lt; 0.05). Egg quality traits, including shell thickness, yolk pigmentation, Haugh unit, and albumen height, were enhanced in the MOLM-supplemented groups, particularly at 7.5.0% inclusion. A marked increase ( p &lt; 0.01) in the activity of key antioxidant enzymes (superoxide dismutase, catalase, and glutathione peroxidase) was observed in liver and intestinal tissues, accompanied by a decline in malondialdehyde levels, reflecting an improved oxidative state. Furthermore, MOLM supplementation resulted in a dose-dependent decrease in the levels of pro-inflammatory cytokines (IL-1&#x3b2;, IL-6, and TNF-&#x3b1;). The greatest reduction was observed at the 5.0% inclusion level. Histopathological evaluations corroborated these findings, revealing significantly reduced inflammation and oxidative damage scores, particularly in the group with 7.5% MOLM. Incorporating MOLM into the diet significantly improved laying hens' performance, enhanced egg quality, boosted antioxidant capacity, and positively influenced immune responses. These findings highlight the value of MOLM as a natural phytogenic additive with potential benefits for enhancing poultry productivity and overall health.", "keywords": ["Animals", "Moringa oleifera", "Chickens", "Female", "Animal Feed", "Diet", "Plant Leaves", "Antioxidants", "Dietary Supplements", "Animal Nutritional Physiological Phenomena", "Random Allocation"], "year": "2025", "doi": "10.5455/OVJ.2025.v15.i12.30"}, {"pmid": "42376532", "title": "Clinicobiochemical and gas chromatography-mass spectrometry-based serum metabolomics for determining the therapeutic efficacy of silymarin in pneumonic Barki sheep.", "abstract": "Silymarin has anti-inflammatory, anti-oxidative, and antimicrobial properties that are superior to those of traditional treatments. These properties will enhance the further use of this medicinal plant in the veterinary field. This study aimed to evaluate the therapeutic efficacy of silymarin against sheep bacterial pneumonia using clinical, biochemical, and metabolomics approaches. Fifty adult male Barki sheep were divided into two groups based on their health status. Group 1 included healthy sheep ( n = 10); group 2 included sick sheep with clinical evidence of pneumonia ( n = 40), which were further classified into four subgroups based on treatment protocols: subgroup 1 received traditional treatment; subgroup 2 received traditional treatment plus 280 mg of silymarin orally daily; subgroup 3 (SG3) received 280 mg of silymarin orally daily; and subgroup 4 received 560 mg of silymarin orally daily. Efficacy-directed distinction between therapeutic groups was accomplished based on gas chromatography-mass spectrometry-generated serum metabolite profiles supported by partial least squares regression analysis (PLS). The PLS score plot showed a clear discrimination between the healthy and pneumonic sheep groups that exhibited lower concentrations of total antioxidant capacity (TAC), total cholesterol, high-density lipoprotein (HDL) cholesterol, and glucose, but significantly elevated liver enzyme, urea, creatinine, malondialdehyde, and low-density lipoprotein cholesterol. Clinical evaluations demonstrated that oral administration of 560 mg of silymarin produced the most rapid clinical improvement. However, metabolomic profiling indicated that 280 mg silymarin (SG3) therapy provided the most favorable therapeutic outcome, as it was strongly associated with the upregulation of TAC, glucose, and both total and HDL-cholesterol levels. Pneumonic sheep treated with silymarin (560 and 280 mg) exhibited greater clinical, metabolomic, and biochemical improvement than those treated with traditional treatment alone.", "keywords": ["Animals", "Silymarin", "Sheep", "Male", "Gas Chromatography-Mass Spectrometry", "Sheep Diseases", "Metabolomics", "Pneumonia", "Antioxidants", "Silybum marianum"], "year": "2025", "doi": "10.5455/OVJ.2025.v15.i12.11"}, {"pmid": "42376530", "title": "Therapeutic potential of branched-chain amino acids against carbon tetrachloride-induced cardiopulmonary injuries in Wistar rats.", "abstract": "Carbon tetrachloride (CCl4) is a xenobiotic hepatotoxic agent that causes pathophysiological disorders in tissues and the liver. CCl4-induced cardiopulmonary toxicity is attributed to free radical-induced dyslipidemia and oxidative damage. Branched-chain amino acids (BCAAs) stimulate systemic defense against oxidative stress, which is probably caused by CCl4, through an improvement in the antioxidant system. This study aimed to explore the therapeutic benefits of BCAAs against CCl4-induced cardiopulmonary pathologies. A total of 28 inclusive Wistar rats stand under control was standard; group 2 comprised CCl4-received rats, whereas groups 3 and 4 comprised CCl4-rats supplemented with two varying levels of BCAAs. Biochemical findings indicated that CCl4 provoked a rise in glucose and cholesterol levels compared with the control. The oxidative profile suggested increased malondialdehyde level and decreased superoxide dismutase activity in the CCl4-intoxicated heart. Supplemented BCAAs downregulated dyslipidemia and restored atrial changes in antioxidant components to be close to normal. Histopathological investigations using hematoxylin-eosin stain revealed damage to the inflamed heart-lung parenchyma of CCl4-intoxicated rats. An increase in fibrosis expression was detectable, simultaneously with a deprivation of protein content in cardiopulmonary sections, as shown by Masson trichrome and bromophenol blue techniques. Co-treated BCAAs intensified cardiopulmonary integrity, inducing scarce histological fibrosis with abundant protein. Accordingly, BCAA supplementation in CCl4-treated rats mitigated complications by reducing serum toxicity, enhancing antioxidant capacity, restoring protein expression, and improving organ health. The findings support the protective role of BCAAs with antioxidant benefits against CCl4-induced damage, suggesting their potential as a therapeutic agent for cardiopulmonary pathology.", "keywords": ["Animals", "Rats, Wistar", "Amino Acids, Branched-Chain", "Rats", "Carbon Tetrachloride", "Male", "Oxidative Stress", "Antioxidants"], "year": "2025", "doi": "10.5455/OVJ.2025.v15.i12.46"}], "color": "#92400e"}}, {"data": {"id": "Lung", "label": "Lung", "description": "Function: Oxygen uptake into the blood. \nMetabolism:\n- Very high total glucose usage (mainly for normal protein production).\n- Does more aerobic glycolysis compare to many other tissues (40% of glucose ends up in lactate in healthy rats).\nKey Metabolites: glucose, lactate\nKey Proteins: \nSources: \n- doi: 10.1146/annurev-physiol-020518-114640.\n- DOI: 10.1289/ehp.8455149\n- https://doi.org/10.1152/ajplegacy.1974.226.4.867", "llm_description": "The lungs are not typically considered a metabolic organ in the classical sense, but rather an accessory organ that plays a crucial role in gas exchange and the regulation of various physiological processes. However, they do produce several metabolic substrates, including surfactant lipids, which are essential for maintaining lung function and preventing alveolar collapse [1]. The lungs also consume oxygen and expel carbon dioxide as part of their primary function, with the rate of gas exchange being tightly regulated by hormones such as epinephrine and norepinephrine, which stimulate ventilation through beta-2 adrenergic receptors in the bronchi [2]. Additionally, the lungs produce various peptides and hormones, including surfactant protein B (SP-B), which is involved in the regulation of lung function and has been shown to have anti-inflammatory properties [3]. The metabolism of the lungs is also influenced by key hormones such as cortisol, which can suppress the expression of genes involved in inflammation and immune responses in lung tissue", "llm_papers": [{"pmid": "42376663", "title": "Intensified MR-guided pulsed adaptive cancer treatment- a potential new treatment option for large(&gt;5cm) central non-small cell lung cancer, a case report.", "abstract": "There are currently no effective treatment options for large, inoperable, centrally located thoracic lesions with poor or suboptimal response to immunotherapy. The use of SBRT for tumors larger than 5&#xa0;cm in this location is limited by toxicity. Therefore, new and innovative treatment strategies are a major unmet medical need. Adaptive radiotherapy (ART) guided by MR-Linac systems, enables real-time adjustment of the treatment plan according to daily anatomical changes and tumor response. This approach is particularly beneficial in thoracic oncology, where tumor shrinkage and respiratory motion can significantly affect dose delivery. Moreover, ART may enhance the therapeutic synergy between radiotherapy and immunotherapy. We report the case of a 65-year-old woman diagnosed with stage IV non-small cell lung cancer (NSCLC) of mixed squamous and adenocarcinoma histology. The patient initially presented with seizures, and an MRI revealed 10 intracranial metastases alongside a 55&#xa0;mm tumor in the left lung. Following stereotactic brain radiotherapy and the initiation of nivolumab plus ipilimumab, the treatment was continued with nivolumab monotherapy due to grade 3 pulmonary toxicity. Imaging demonstrated a tumor progression limited to the lung. She was then qualified for MR-guided adaptive stereotactic radiotherapy (3 &#xd7; 10 Gy), delivered at 10-day intervals. Significant tumor regression required redefinition of the GTV before fractions 2 and 3. No acute or late toxicity was observed. A 6-month follow-up PET-CT revealed marked regression in tumor size (from 79&#xa0;mm to 17&#xa0;mm) and metabolic activity (SUVmax reduced from 33.1 to 5.13). Comparative imaging showed less extensive post-radiation lung changes than typically observed after conventional radiotherapy. This case illustrates the potential of MR-guided adaptive radiotherapy to enhance treatment precision, reduce toxicity, and enable immune-radiotherapy synergy. Integration of the PULSAR concept-with spaced fractions and immunotherapy-may improve tumor response. Further clinical trials are required to confirm these benefits on larger patient populations.", "keywords": [], "year": "2026", "doi": "10.3389/fonc.2026.1791499"}, {"pmid": "42376530", "title": "Therapeutic potential of branched-chain amino acids against carbon tetrachloride-induced cardiopulmonary injuries in Wistar rats.", "abstract": "Carbon tetrachloride (CCl4) is a xenobiotic hepatotoxic agent that causes pathophysiological disorders in tissues and the liver. CCl4-induced cardiopulmonary toxicity is attributed to free radical-induced dyslipidemia and oxidative damage. Branched-chain amino acids (BCAAs) stimulate systemic defense against oxidative stress, which is probably caused by CCl4, through an improvement in the antioxidant system. This study aimed to explore the therapeutic benefits of BCAAs against CCl4-induced cardiopulmonary pathologies. A total of 28 inclusive Wistar rats stand under control was standard; group 2 comprised CCl4-received rats, whereas groups 3 and 4 comprised CCl4-rats supplemented with two varying levels of BCAAs. Biochemical findings indicated that CCl4 provoked a rise in glucose and cholesterol levels compared with the control. The oxidative profile suggested increased malondialdehyde level and decreased superoxide dismutase activity in the CCl4-intoxicated heart. Supplemented BCAAs downregulated dyslipidemia and restored atrial changes in antioxidant components to be close to normal. Histopathological investigations using hematoxylin-eosin stain revealed damage to the inflamed heart-lung parenchyma of CCl4-intoxicated rats. An increase in fibrosis expression was detectable, simultaneously with a deprivation of protein content in cardiopulmonary sections, as shown by Masson trichrome and bromophenol blue techniques. Co-treated BCAAs intensified cardiopulmonary integrity, inducing scarce histological fibrosis with abundant protein. Accordingly, BCAA supplementation in CCl4-treated rats mitigated complications by reducing serum toxicity, enhancing antioxidant capacity, restoring protein expression, and improving organ health. The findings support the protective role of BCAAs with antioxidant benefits against CCl4-induced damage, suggesting their potential as a therapeutic agent for cardiopulmonary pathology.", "keywords": ["Animals", "Rats, Wistar", "Amino Acids, Branched-Chain", "Rats", "Carbon Tetrachloride", "Male", "Oxidative Stress", "Antioxidants"], "year": "2025", "doi": "10.5455/OVJ.2025.v15.i12.46"}, {"pmid": "42376494", "title": "Reassessing the risk-modifying effects of novel antidiabetic agents on asthma-COPD overlap syndrome: a dose-stratified network meta-analysis of 316,832 adults from 128 randomised trials.", "abstract": "Asthma-chronic obstructive pulmonary disease (COPD) overlap syndrome (ACOS) accounts for 15-25% of chronic obstructive airway disease and is linked to frequent exacerbations and excess mortality. Newer glucose-lowering drugs may affect respiratory outcomes, but agent-level and dose-specific effects on ACOS are uncertain. We searched PubMed, Embase, Cochrane CENTRAL, Web of Science, ClinicalTrials.gov, ClinicalKey, ScienceDirect, and ProQuest from inception to April 03, 2026, with an initial search on Dec 12, 2024. Eligible studies were randomised controlled trials in adult participants receiving eligible glucose-lowering therapies and systematically recording ACOS-related, asthma, or COPD events during follow-up. Trials compared dipeptidyl peptidase-4 (DPP-4) inhibitors, glucagon-like peptide-1 (GLP-1) receptor agonists, sodium-glucose cotransporter 2 (SGLT2) inhibitors, and other eligible antidiabetic regimens against standard care and/or placebo control. Risk ratios (RRs) with 95% CIs were estimated relative to this control group for ACOS, asthma, and COPD outcomes. Heterogeneity was assessed using tau-squared and I 2 statistics, and small-study effects/publication bias were assessed using comparison-adjusted funnel plots and Egger's regression. Outcome was trial-reported ACOS-related respiratory events. This study is registered with PROSPERO, CRD42024626613. Canagliflozin (RR 0.62, 95% CI 0.40-0.97), empagliflozin (0.70, 0.51-0.95), dapagliflozin (0.76, 0.63-0.92), and injectable semaglutide (0.64, 0.49-0.84) were associated with lower ACOS risk than control. Dose-stratified analyses suggested stronger associations for selected regimens, with signals more evident in participants with diabetes. Dapagliflozin was associated with lower asthma risk, whereas canagliflozin, empagliflozin, and injectable semaglutide were associated with lower COPD risk. Saxagliptin was associated with higher asthma risk (2.09, 1.01-4.33). No major heterogeneity, inconsistency, or small-study effects were detected. Respiratory associations of newer glucose-lowering therapies were heterogeneous and agent specific. Selected SGLT2 inhibitors and injectable semaglutide were associated with lower ACOS-related risk, whereas saxagliptin may warrant caution in people prone to asthma. These findings support further prospective evaluation. Taiwan National Science and Technology Council.", "keywords": [], "year": "2026", "doi": "10.1016/j.eclinm.2026.104026"}, {"pmid": "42376486", "title": "Prognostic Role of Copeptin, H-FABP, and TTE in Pulmonary Embolism in the Emergency Department.", "abstract": "Pulmonary embolism (PE) remains a major diagnostic and prognostic challenge in emergency departments due to its heterogeneous clinical presentation and potentially high mortality. Although echocardiography and conventional cardiac biomarkers are commonly used in clinical practice, the additional prognostic value of novel biomarkers such as copeptin and heart-type fatty acid-binding protein (H-FABP) requires further investigation. This exploratory prospective study (March 2021-September 2022) included adult patients (&#x2265;&#x2009;18&#x2009;years) diagnosed with acute PE confirmed by radiological imaging in the emergency department. Patients with chronic/unconfirmed PE, incomplete data, or those referred from external centers were excluded. The primary analysis compared survivors and nonsurvivors at 30&#x2009;days to evaluate the prognostic value of copeptin, H-FABP, and echocardiographic parameters. Transthoracic echocardiography (TTE) was performed after diagnosis to assess right heart function and pulmonary artery pressure (PAP), right ventricular/left ventricular ratio (RV/LV), right and left ventricular end-diastolic diameters (RV-EDD and LV-EDD), and tricuspid annular plane systolic excursion (TAPSE). Biomarkers (troponin, pro-BNP, D-dimer, copeptin, and H-FABP) were analyzed using standard laboratory assays and enzyme-linked immunosorbent assay (ELISA). The primary outcome was 30-day mortality. A total of 88 patients were analyzed. Although H-FABP and copeptin levels were higher in nonsurvivors, these differences were not statistically significant for predicting 30-day mortality. Echocardiographic parameters-particularly PAP, RV-EDD, and RV/LV-were significantly associated with the severity of right ventricular dysfunction and clinical outcomes ( p &lt; 0.05). In multivariable logistic regression analysis copeptin, H-FABP, PESI score, ICU admission, RV-EDD, and LV-EDD remained independently associated with 30-day mortality. Cut-off values were determined by ROC analysis using the Youden index. Although biomarkers were not significant as continuous variables, exploratory categorized analysis based on cut-off values suggested a potential association with mortality. Rapid bedside echocardiography combined with appropriate biomarker testing may improve risk stratification in patients with PE in emergency settings, while larger studies are needed to clarify the role of these biomarkers.", "keywords": [], "year": "2026", "doi": "10.1155/emmi/9544238"}, {"pmid": "42376479", "title": "Molecular Dynamics-Based validation of a quinazoline-based KRAS inhibitor (C9) identified through QSAR-guided discovery.", "abstract": "KRAS remains one of the most challenging oncogenic targets in lung cancer because of its shallow binding surfaces, conformational flexibility, and limited availability of druggable pockets. In a preceding QSAR-guided screening and molecular docking study, compound C9, a quinazoline-based scaffold, was identified as a potential KRAS inhibitor. However, static docking alone is insufficient to fully characterize ligand stability, conformational persistence, and energetic behavior within dynamic solvent environments. Therefore, the present study employed molecular dynamics (MD) simulations and end-point free energy calculations to further investigate the dynamic interaction profile of C9 within the KRAS binding pocket. The four top-ranked docking poses of C9 (Modes 1-4) were subjected to 200 ns explicit-solvent molecular dynamics simulations. Structural stability and conformational behavior were evaluated using root-mean-square deviation root-mean-square fluctuation (RMSF), radius of gyration (Rg), dynamic cross-correlation matrix (DCCM), principal component analysis (PCA), center-of-mass distance analysis, and residue-wise ligand contact frequency profiling. Binding energetics were further assessed using MM-GBSA and MM-PBSA calculations with energy decomposition analyses. The four binding modes exhibited distinct dynamic and energetic behaviors during the simulations. Modes one and 3 demonstrated comparatively greater structural persistence and reduced conformational instability relative to Modes 2 and 4. Mode one maintained prolonged ligand contact persistence with key switch-region residues, compact conformational sampling, and relatively stable COM distance profiles throughout most of the trajectory. PCA further revealed a comparatively confined conformational basin for Mode 1, consistent with restricted collective motions and reduced conformational dispersion. However, MM-GBSA and MM-PBSA analyses identified unusually large van der Waals energy fluctuations in Modes 1, 2, and 4, suggesting transient steric instability or nonphysical energetic excursions during portions of the simulations. In contrast, Mode 3 exhibited comparatively more stable and physically interpretable interaction energy profiles with sustained negative interaction energies and reduced fluctuation amplitudes. Across all systems, electrostatic interactions represented the dominant favorable energetic contribution to KRAS-C9 binding. The combined structural, dynamic, and energetic analyses indicate that C9 is capable of adopting dynamically persistent binding conformations within the KRAS binding pocket. Among the evaluated docking modes, Modes one and 3 exhibited the most favorable balance between structural persistence and energetic stability. These findings provide computational support for the potential of the quinazoline-based scaffold C9 as a candidate KRAS-targeting compound and establish a mechanistic framework for future structure-guided optimization and experimental validation in KRAS-driven lung cancer systems.", "keywords": [], "year": "2026", "doi": "10.3389/fbinf.2026.1791576"}, {"pmid": "42376458", "title": "Mitochondria-targeted strategies in cancer radiotherapy: from ROS regulation to immunogenic cell death.", "abstract": "Radiotherapy (RT) is a crucial treatment modality for various solid tumors. Its antitumor effects not only depend on direct DNA damage but also involve the disruption of redox homeostasis centered around mitochondria and the activation of immune responses. Mitochondria, as a central hub for cellular energy metabolism and apoptosis signaling, serve both as the primary source of reactive oxygen species (ROS) and as key targets for ROS attack during RT. RT promotes the sustained accumulation of mitochondrial ROS (mROS) through mechanisms such as damage to the mitochondrial respiratory chain complexes, while also triggering compensatory clearance responses from antioxidant systems. The dynamic balance between these processes determines the cell's fate. Moreover, mitochondria play a crucial regulatory role in immunogenic cell death (ICD). Damage-associated molecular patterns (DAMPs) such as mitochondrial DNA (mtDNA), ATP, and cytochrome c, along with ROS-mediated endoplasmic reticulum stress and calcium signaling, promote dendritic cell (DC) maturation and induce antitumor immunity. In recent years, mitochondria-based RT sensitization strategies have emerged, including small molecules that modulate mROS production or antioxidant defenses, mitochondria-targeted nanocarriers, gene-editing approaches, and bioregulatory or metabolic interventions. Most nanoplatforms, gene-editing strategies, and ICD-amplifying approaches are currently supported mainly by preclinical evidence, where they have been shown to enhance RT-induced tumor cell death, promote DAMP release, and improve antitumor immune activation. In contrast, selected metabolic or bioregulatory interventions have begun to enter early clinical evaluation, including ketogenic dietary interventions combined with immune checkpoint blockade in metastatic melanoma and renal cell carcinoma (e.g., NCT06391099 and NCT06896552), although definitive evidence of clinical benefit in combination with RT remains limited. This review systematically discusses mitochondrial mechanisms of ROS generation and clearance during RT, mitochondrial regulation of ICD pathways, and emerging mitochondria-targeted radiosensitization strategies, while emphasizing the current distinction between preclinical promise and clinical translational maturity.", "keywords": [], "year": "2026", "doi": "10.3389/fcell.2026.1861854"}], "color": "#0284c7"}}, {"data": {"id": "Muscle", "label": "Muscle", "description": "Function: Enables movement by contractions. Glucose consumer during exercise. Endocrine organ which releases myokines. \nMetabolism:\n- Fatty acid oxidation is heightened during fasting.\nKey Metabolites: Glucose, fatty acids.\nKey Proteins: GLUT4\nSources: - doi: 10.1093/jas/skac035.\n- doi: 10.3390/jcm14134490\n- https://doi.org/10.1038/nrendo.2012.49\n- doi: 10.1074/jbc.REV119.008351", "llm_description": "The muscle is a dynamic tissue that primarily consumes glucose and fatty acids for energy production, with a significant role in gluconeogenesis and glycogen synthesis [1]. During intense exercise or metabolic stress, the muscle can also produce ketone bodies as an alternative energy source [2]. The hormone insulin plays a crucial role in regulating glucose uptake and storage in skeletal muscle cells, while glucagon stimulates glycogenolysis and lipolysis [3]. Additionally, growth hormone and testosterone are key hormones that regulate protein synthesis and muscle growth, particularly during periods of anabolic stress such as muscle injury or resistance training [4]. The hormone leptin, which is produced by adipose tissue, also has a significant impact on muscle metabolism, with studies suggesting that leptin can stimulate glucose uptake and insulin sensitivity in skeletal muscle cells [5].", "llm_papers": [{"pmid": "42376616", "title": "Comparative hematological and serum biochemical profiling of grassland Xichun and Xilingol horses.", "abstract": "The Grassland Xichun horse is an emerging crossbred population developed from Xilingol mares and Thoroughbred stallions in Inner Mongolia, China, yet its blood physiological profile has not been systematically characterized. In this study, we compared 32 hematological and serum biochemical parameters between 177 Grassland Xichun horses and 35 Xilingol horses maintained under the same extensive grazing conditions. Following Benjamini-Hochberg FDR correction, 17 of 32 parameters differed significantly between breeds. Grassland Xichun horses showed markedly higher RBC count (9.145 vs 7.905 &#xd7; 10&#xb9;&#xb2;/L), hemoglobin (155.41 vs 132.51 g/L), hematocrit (45.95% vs 40.29%), and MCHC, with multiple parameters reaching the large-effect threshold (absolute effect size &gt; 0.8). Compared with the Xilingol maternal breed, the Thoroughbred-sired Grassland Xichun population was associated with higher oxygen-carrying indices. Conversely, LDH showed the largest effect size among all parameters (effect size = -2.117), and AST and CK were also lower in Grassland Xichun horses, suggesting differences in basal muscle enzyme profiles and aerobic metabolic characteristics between breeds. Grassland Xichun horses additionally exhibited higher blood glucose and lower total cholesterol, indicating distinct metabolic patterns. Xilingol horses displayed elevated monocyte counts, MPV, UREA, and GGT, which may reflect differences in immune-metabolic status and physiological adaptation associated with long-term environmental and management backgrounds rather than discrete functional phenotypes. Principal component analysis revealed partial breed separation reflecting shared maternal ancestry, and Fisher's linear discriminant analysis achieved 97.6% leave-one-out cross-validation accuracy. This study characterizes the blood physiological profile of Grassland Xichun horses, provides population-level distribution data for clinical interpretation, and supports future integration of hematological phenotypes into breeding evaluation and physiological monitoring programs.", "keywords": [], "year": "2026", "doi": "10.1016/j.vas.2026.100740"}, {"pmid": "42376462", "title": "Targeting nuclear receptors in muscular dystrophies and regenerative myogenesis.", "abstract": "Skeletal muscle is a highly plastic tissue with a robust capacity for regeneration, largely driven by resident satellite cells. Muscular dystrophies comprise a heterogeneous group of inherited disorders characterized by progressive muscle degeneration, chronic inflammation, and impaired regenerative capacity. Despite well-defined genetic etiologies, effective disease-modifying therapies for these disorders, as well as many acquired myopathies, remain limited. Emerging evidence identifies nuclear receptors (NRs) as key regulators of skeletal muscle homeostasis, integrating hormonal, metabolic, and environmental signals to control transcriptional programs governing mitochondrial function, metabolism, inflammation, and myogenesis. In this review, we summarize the diverse roles and mechanisms of action of NRs in skeletal muscle biology and discuss how their dysregulation contributes to muscle wasting and disease progression. We also highlight emerging NR-targeted therapeutic strategies aimed at enhancing metabolic function, suppressing inflammation and fibrosis, and promoting muscle regeneration. Finally, we outline critical knowledge gaps and future directions to advance the translation of NR-based therapies for muscular dystrophies and related neuromuscular disorders.", "keywords": [], "year": "2026", "doi": "10.3389/fcell.2026.1878702"}, {"pmid": "42376432", "title": "Malnutrition-Sarcopenia Syndrome in older adults: Causes, consequences, and countermeasures.", "abstract": "Whether the Malnutrition-Sarcopenia Syndrome (MSS) represents a distinct clinical entity or simply describes severe malnutrition with prominent muscle wasting remains debated. Nevertheless, the coexistence of inadequate nutritional status and severe loss of skeletal muscle mass, strength, and function creates clinically significant challenges that warrant focused attention. The causes of MSS involve a vicious cycle driven by insufficient dietary intake, inflammation, hormone deficiency as well as physical inactivity. In a bidirectional relationship, malnutrition accelerates muscle protein breakdown and impairs synthesis, while sarcopenia reduces functional capacity and potentially leads to decreased physical activity and loss of independence. The consequences are substantial and include accelerated functional decline and delayed convalescence, reflected by prolonged hospital length of stay and higher rates of increased mortality compared to single conditions. Effective countermeasures require integrated interventions addressing both components simultaneously: adequate protein and energy intake, and vitamin D, combined with progressive resistance training, treatment of underlying diseases, and medication optimization. This multidisciplinary approach demonstrates synergistic benefits that exceed addressing either condition alone. Regardless of whether MSS constitutes a unique syndrome, recognizing this clinical pattern serves the pragmatic purpose of identifying vulnerable older adults who require comprehensive, simultaneous nutritional and functional interventions to break the vicious cycle and improve outcomes. See also the graphical abstract(Fig. 1).", "keywords": [], "year": "2026", "doi": "10.17179/excli2026-9426"}, {"pmid": "42376407", "title": "Metabolic adaptive role of interleukin-15 in postpartum dairy cows with negative energy balance.", "abstract": "Dairy cows exhibit a specific physiological state during the transition from late pregnancy to early lactation. This period is characterized by metabolic and immunological alterations to sustain increased energy needs. Interleukin-15 (IL-15) is a well-known anabolic cytokine that regulates energy expenditure in muscle tissue. This study aimed to investigate the role of IL-15 in the metabolic adaptation of dairy cows during the transition period. Thirty-four Holstein-Friesian cows were included in this study. Blood samples were collected twice: three weeks prepartum and three weeks postpartum from all animals to estimate &#x3b2;-HB and non-esterified fatty acids (NEFA) concentrations using ELISA, in addition to IL-15 and Glucose-regulated protein 78 ( GRP78) gene expression. Cows are considered to be at normal status or in negative energy balance (NEB) when &#x3b2;-HB is &lt;1.4 mmol/L or &#x3b2;-HB &gt;1.4 mmol/L, respectively. The results of our study revealed that &#x3b2;-HB concentrations are higher significantly ( p = 0.0001) in NEB than in normal-status cows, both prepartum and postpartum. Similar results were observed regarding NEFA concentration in NEB compared with that in normal-status cows. However, this increase in NEFA concentration did not reach a significant level both prepartum ( p = 0.100) and postpartum ( p = 0.141). In addition, NEB cows showed significant downregulation of IL-15 expression levels ( p = 0.003) compared with normal-status cows postpartum. There were no significant ( p = 0.934) differences in IL-15 expression levels between the two groups prepartum. Furthermore, the results showed that GRP78 expression levels were significantly upregulated in NEB compared to normal-status cows both prepartum ( p = 0.010) and postpartum ( p = 0.034). The body may downregulate IL-15 as a cost-saving immune adaptation. These findings indicate the pivotal physiological role of IL-15 in the regulation of postpartum energy expenditure and metabolic adaptation. Furthermore, the results showed that GRP78 expression levels were upregulated in NEB cows both pre- and postpartum as a part of metabolic adaptation in the transition period.", "keywords": [], "year": "2026", "doi": "10.5455/OVJ.2026.v16.i2.16"}, {"pmid": "42376362", "title": "Athletic Intervention After Thoracic Surgery for Lung Cancer: Rationale and Design of the ATHENA Study.", "abstract": "The optimal therapeutic approach for early-stage NSCLC (I-II, and, in some specific cases, IIIa) is lung resective surgery with mediastinal lymphadenectomy. However, it should be remarked that lung resection surgery further negatively affects respiratory muscle function and health-related quality of life (HRQoL). It is well known that exercise interventions may improve pulmonary function but the optimal approach has not been determined yet. The aim of the present study is to investigate the results obtained by administering a specific athletic/physical protocol to a cohort of patients who undergo lung surgery after NSCLC diagnosis. Among patients who underwent a surgical treatment of NSCLC and followed in our Institution, those with the highest scores of performance status, defined after multidisciplinary evaluation by Interdisciplinary Group for Thoracic Neoplasms (GINT) will be addressed to the Interdipartimental Centre in Motor and Sport Activities, Sport Medicine Centre, University of Pavia for a work protocol based on mesocycles of 3times/week for 6 months. Respiratory function, cardiopulmonary exercise capacity, caloric expenditure expressed as metabolic equivalents (METs), and health-related quality of life will be assessed at baseline, 3 months, and 6 months in a prospective single-arm pilot cohort. Caloric consumption will be measured by metabolic equivalents (MET). A quality of life (QoL) questionnaire and a spirometry will be administered to patients at the same intervals. The primary exploratory endpoint will be the change in CPET-derived VO&#x2082;peak from baseline to 6 months; secondary endpoints will include changes in FEV&#x2081;, DLCO, MIP/MEP, METs, muscle power, and EORTC QLQ-C30 scores. For each patient, written informed consent will be obtained before the enrollment. Our study is, to the best of our knowledge the first perspective clinical trial encompassing athletic programs for patients with surgical treatment of NSCLC. The study is designed to provide preliminary data on feasibility, safety, and functional outcomes of a structured post-surgical athletic intervention in carefully selected patients with early-stage NSCLC.", "keywords": [], "year": "2026", "doi": "10.1002/hsr2.72512"}, {"pmid": "42376098", "title": "Antioxidant chemistry and its role in mitigating oxidative stress in animals.", "abstract": "Oxidative stress is a major physiological challenge in poultry and livestock production, arising from an imbalance between reactive oxygen and nitrogen species generation and the antioxidant defense systems of animals. Stressors such as heat, high stocking density, transport, nutritional imbalances, and disease pressure exacerbate oxidative damage under intensive production conditions, leading to impaired immunity, reduced productivity, compromised meat quality, and increased disease susceptibility. Excessive reactive species negatively affect the immune, muscular, reproductive, digestive, and nervous systems. Although animals possess enzymatic and non-enzymatic antioxidant defenses, these mechanisms are often insufficient under high oxidative load, necessitating dietary antioxidant supplementation. Oxidative stress also interacts closely with immune function, inflammatory responses, and thermal stress, particularly heat stress, which intensifies the production of metabolic reactive oxygen species. Dietary antioxidants, including vitamins E and C, selenium, zinc, and plant-derived compounds, have demonstrated protective effects by mitigating oxidative damage, enhancing immune responses, and improving performance and product quality. Advances in oxidative stress biomarkers and analytical techniques have improved assessment accuracy, while emerging strategies, including precision nutrition, nanotechnology-based delivery systems, and regenerative therapies, offer promising avenues for management. Addressing oxidative stress through integrated nutritional, environmental, and therapeutic approaches is essential for sustainable poultry and livestock production.", "keywords": ["Animals", "Oxidative Stress", "Antioxidants", "Livestock", "Dietary Supplements"], "year": "2026", "doi": "10.5455/OVJ.2026.v16.i3.2"}], "color": "#1d4ed8"}}, {"data": {"id": "Pancreas", "label": "Pancreas", "description": "Function: Produces gastrointestinal enzymes. Secretes insulin and glucagon that regulate blood glucose levels.\nMetabolism:\n- Lower gastrointestinal enzyme production during fasting.\nKey Metabolites: \nKey Proteins: Insulin, glucagon.\nSources:\n- https://doi.org/10.1038/s41392-024-02098-3\n", "llm_description": "The pancreas is a vital organ responsible for regulating blood sugar levels through the production of two key hormones, insulin and glucagon, which primarily target glucose metabolism [2]. Insulin, produced by beta cells in the pancreatic islets, facilitates glucose uptake in cells, while glucagon, produced by alpha cells, stimulates glucose release into the bloodstream. The pancreas also produces other enzymes, such as amylase and lipase, to aid in digestion of carbohydrates and fats, respectively [3]. The metabolic function of the pancreas is regulated by key hormones, including insulin, glucagon, somatostatin, and pancreatic polypeptide, which interact with specific receptors on beta cells to modulate glucose production and release [4]. Research has shown that exercise can preserve beta-cell function in type 2 diabetes by reshaping intra-islet macrophage-beta-cell crosstalk, highlighting the importance of lifestyle interventions in managing this metabolic disorder [5].", "llm_papers": [{"pmid": "42376729", "title": "Pressure-Dependent Aromatic Ring Flips Reveal Variable Transition-State Volume and Compressibility Among Structural Regions of BPTI.", "abstract": "Conformational transitions are critical for protein function and often involve substantial rearrangements of the interior packing of amino acid residues. Rotations of aromatic side chains-so called \"ring flips\"-require transient expansion of the surrounding protein core and represent hallmark examples of transient conformational fluctuations. We recently demonstrated that activation volume and isothermal compressibility provide unique insights into ring flip transition states. Here, we report transition-state compressibilities for four aromatic side chains in bovine pancreatic trypsin inhibitor (BPTI). The compressibilities vary widely, ranging from values typical of unfolded proteins to those of the fully folded state. Notably, transition-state compressibility correlates negatively with activation energy, indicating that the likelihood of a ring flip scales with the degree of expansion in the transition state. Our results show that different structural regions, even within a small protein such as BPTI, display distinct dynamic transitions and volume fluctuations, reflecting varying extents of structural rearrangement along the transition pathways. Thus, isothermal compressibility emerges as a powerful parameter yielding insights into the relationships between ground-state structure and the transition-state expansion during conformational transitions.", "keywords": [], "year": "2026", "doi": "10.1002/cbic.70442"}, {"pmid": "42376493", "title": "Predominantly genetic, intrauterine, and lifestyle aetiologies of type 2 diabetes are associated with distinct clinical presentations and risk of complications: a Danish cross-sectional and follow-up study.", "abstract": "We investigated whether individuals who likely developed type 2 diabetes (T2D) through predominantly genetic, adverse intrauterine, or lifestyle aetiologies have different clinical presentations and complications. In this Danish nationwide combined cross-sectional and registry-based follow-up study, we included 7867 individuals with newly diagnosed T2D from the DD2 cohort, enrolled during 2010-2023 through general practices and hospital outpatient clinics across Denmark. Participants were required to have available genotyping and birthweight data; those with GAD antibody levels &gt;30 were excluded. Individuals were grouped by presumed predominant aetiologies: genetic (highest-quartile T2D genetic risk score (GRS), birthweight above lowest quartile; n = 1435); intrauterine (lowest-quartile birthweight, GRS below highest quartile; n = 1195); and lifestyle (birthweight above lowest quartile, GRS below highest quartile; n = 4380). Baseline characteristics at diagnosis were examined using linear and log-binomial or robust Poisson regression. The main follow-up outcomes were standardised 10-year risks of major adverse cardiovascular events and microvascular complications after DD2 enrolment, estimated using the Aalen-Johansen method. Compared with the genetic group (18%), intrauterine (15%) and lifestyle (56%) aetiologies both showed -6.9% lower Homeostatic Model Assessment-2 (HOMA2) insulin sensitivity, higher triglycerides (+6.6% and +5.3%), higher HOMA2 beta-cell function (+8.9% and +9.6%), and higher high-sensitivity C-reactive protein (+14.8% and +24.1%). Age at T2D diagnosis was 1.2 years lower (intrauterine) and 2.3 year higher (lifestyle). The 10-year risk of major adverse cardiovascular events was 14.8% (intrauterine), 13.2% (lifestyle), and 11.5% (genetic), corresponding to absolute risk differences (RDs) of +3.3% (95% confidence interval [CI] 0.6, 6.0) for intrauterine, and +1.7% (95% CI -0.3, 3.6) for lifestyle, vs . genetic aetiology. The 10-year risk of microvascular complications was 25.9% (intrauterine), 25.4% (lifestyle), and 21.8% (genetic), yielding RDs of +4.1% (95% CI 0.7, 7.5) for intrauterine and +3.5% (95% CI 1.0, 6.1) for lifestyle aetiology. Individuals who developed T2D with predominant intrauterine or lifestyle rather than genetic aetiology exhibited distinct characteristics including higher long-term complication risks. Future studies should validate this framework in more diverse populations and assess whether these proxy-based aetiological domains can improve risk stratification and guide treatment. This work was funded by Danish Agency for Science, the Danish Health and Medicines Authority, the Danish Diabetes Association, the Region of Southern Denmark, the Swedish Research Council, the Novo Nordisk Foundation, the Swedish ALF for Region Sk&#xe5;ne, the Crafoord Foundation, and the Swedish Diabetes Association.", "keywords": [], "year": "2026", "doi": "10.1016/j.eclinm.2026.104029"}, {"pmid": "42376110", "title": "Subchronic comparative assessment of graded ferrous sulfate doses on biochemical, histological, and multiorgan micromorphological changes in wistar rats.", "abstract": "Iron is a necessary trace element in the human body. However, excessive concentration can promote the overproduction of reactive oxygen species, leading to oxidative stress and organ injury. This study aims to evaluate the biochemical and micromorphological changes that occur following exposure to graded doses of ferrous sulfate in a rat model. The treated groups (D1, D2, D3, and D4) were orally and daily treated with graded doses of ferrous sulfate (12.5 mg/kg [D1], 25 mg/kg [D2], 50 mg/kg [D3], and 100 mg/kg [D4]) for 6 weeks, whereas the control group received only saline solution (0.9% NaCl solution at 5 ml/kg body weight) during the same period. Different doses of ferrous sulfate did not cause mortality. Weekly control of glucose levels in all rats revealed a remarkable interaction effect ( p = 0.02) between treatment and time, indicating that the dynamics of change over time differed among the groups. Moreover, a significant effect was detected in the time factor ( p &lt; 0.001) and in the second factor, which refers to the treatments ( p &lt; 0.001). In addition, ferrous sulfate differentially altered the levels of oxidative stress biomarkers, including glutathione, catalase, glutathione-S-transferase, and malondialdehyde, as well as the acetylcholinesterase activity in a dose- and organ-dependent manner. Histopathological examination revealed signs of liver inflammation and pancreatic and kidney hyperemia. Prussian blue staining revealed no significant iron deposits in any organs. Excessive iron may cause oxidative damage to vital organs and alter blood glucose levels.", "keywords": ["Animals", "Ferrous Compounds", "Oxidative Stress", "Rats", "Rats, Wistar", "Male", "Liver", "Dose-Response Relationship, Drug", "Kidney", "Blood Glucose"], "year": "2026", "doi": "10.5455/OVJ.2026.v16.i3.45"}, {"pmid": "42375983", "title": "Citrullus colocynthis extract ameliorateshypothalamic-pituitary-gonadal axis dysfunction in diabetic rats.", "abstract": "Diabetes mellitus (DM) can negatively influence the hypothalamic-pituitary-gonadal axis (HPGA) and male fertility. To investigate the effects of Citrullus colocynthis extract on HPGA regulation and pancreatic glucose transporter 2 (GLUT2) expression in streptozotocin-induced DM in male rats, together with sperm morphology and motility. Thirty-two adult male rats were divided into 4 groups of 8 animals each: negative control, positive control, treatment 1 (250 mg/kg body weight), and treatment 2 (500 mg/kg body weight) of CC extract, respectively. All groups were induced with DM, except group one. Treatments were given orally for 30 consecutive days. After animal scarification using deep anesthesia, blood samples were collected for hematological and biochemical analyses, and tissue samples were obtained for histopathological and immunohistochemical studies (pancreas) and semen analysis (testicles). Treatment 2 significantly ( p &#x2264; 0.05) decreased blood glucose and glycated hemoglobin levels with marked elevation in serum insulin levels. The significant reduction of gonadotropin-releasing hormone in diabetic rats was substantially recovered by treatment 2, whereas no changes in luteinizing hormone, follicular stimulating hormone, and testosterone levels were recorded. Sperm motility was significantly increased in diabetic rats receiving treatment 1 of CC extract. Histopathological results have shown various alterations in the testis and pancreatic tissue in diabetic rats, which were improved almost to normal levels by different doses of CC extract. Immunohistochemical analysis showed complete restoration and normal localization of GLUT2 in pancreatic beta cells after treatment with CC extract. CC extract ameliorates diabetic complications through a potent natural effect against HPGA dysfunction, pancreatic and testicular alteration, and GLUT2 overexpression in pancreatic beta cells.", "keywords": ["Animals", "Male", "Plant Extracts", "Diabetes Mellitus, Experimental", "Hypothalamic-Pituitary-Gonadal Axis", "Rats", "Citrullus colocynthis", "Glucose Transporter Type 2", "Streptozocin", "Testis", "Sperm Motility", "Blood Glucose", "Spermatozoa"], "year": "2026", "doi": "10.5455/OVJ.2026.v16.i4.48"}, {"pmid": "42375786", "title": "Exercise preserves &#x3b2;-cell function in type 2 diabetes by reshaping intra-islet macrophage-&#x3b2;-cell crosstalk.", "abstract": "Type 2 diabetes (T2D) is characterized by pancreatic islet &#x3b2;-cell dysfunction and systemic insulin resistance, with meta-inflammation playing a critical role in disease progression. As the major type of immune cell population in islets, both resident and recruited macrophages are important regulators of the islet immune microenvironment under physiological and T2D conditions. Exercise is an effective strategy for treating T2D, yet its impacts on islet inflammation and &#x3b2;-cell dysfunction remain elusive. Here, we established a mouse model of exercise intervention in obesity-associated T2D by combining high-fat diet (HFD) feeding with treadmill running. Notably, exercise markedly improves glucose tolerance and insulin sensitivity, accompanied by substantial mitigation of HFD-induced &#x3b2;-cell dysfunction, islet hypertrophy, and alterations in &#x3b2;-cell subpopulations. Exercise also reduces intra-islet infiltration of CD45 + immune cells and dampens pro-inflammatory gene expression, indicating robust attenuation of islet inflammation. Using untargeted plasma proteomics, we identified the secreted protein acidic and rich in cysteine (SPARC) as a circulating factor, whose suppression is associated with exercise-linked islet protection under HFD conditions. Mechanistically, our data support a model in which SPARC contributes to &#x3b2;-cell dysfunction, at least in part, through macrophage inflammasome-related signaling. Further analysis of a human cohort demonstrates that circulating SPARC protein levels are markedly elevated in patients with T2D, exhibiting a significant negative correlation with parameters indicative of insulin sensitivity and &#x3b2;-cell function, and a positive correlation with insulin resistance. Together, this work provides a systemic characterization of the effects of exercise intervention on islet homeostasis and &#x3b2;-cell function, and highlights SPARC as a candidate immuno-metabolic node for T2D intervention.", "keywords": [], "year": "2026", "doi": "10.1093/lifemeta/loag014"}, {"pmid": "42375383", "title": "Endothelial cell damage in patients with acute graft versus host disease receiving treatment with extracorporeal photopheresis.", "abstract": "Extracorporeal photopheresis (ECP) is a safe, effective treatment for steroid-refractory acute GVHD (SR-aGVHD). Endothelial damage is a pathological substrate of aGVHD. Endothelial damage biomarkers were measured in SR-aGVHD patients' plasma before (PRE) and 1-month after initiating ECP as second-line therapy to explore differences by treatment response. ECP-treated SR-aGVHD patients (n=35) were classified into good (GR; n=18) and poor (PR; n=17) responders. Endothelial activation biomarkers (soluble Vascular Cell Adhesion Molecule-1, sVCAM-1; von Willebrand Factor, VWF; thrombomodulin, TM; soluble TNF receptor 1, sTNFR1; angiopoietin 2; ANG2); GVHD markers (suppression tumorigenicity 2, ST2; regenerating islet-derived 3-alpha, REG3alpha; T-cell immunoglobulinmucin-3, TIM3); soluble C5b9 (sC5b9), for complement activation; and circulating dsDNA, for neutrophil extracellular traps (NETs), were analyzed. The endothelial activation and stress index (EASIX) and C-reactive protein were evaluated. Before ECP, endothelial damage biomarkers were elevated in all patients, with no significant differences between GR and PR. After 1-month, increased levels of REG3alpha and sC5b9, and decreased levels of TIM3, were observed in samples from PR. A panel combining 5 biomarkers (ST2, VWF, NETs, TIM3, ANG2) could identify GR after 1-month on ECP (likelihood ratio 2.0) and predict ECP response. We propose a simplified endothelial damage biomarker panel capturing early biological signals associated with response to ECP in SR-aGVHD patients.", "keywords": ["Humans", "Graft vs Host Disease", "Photopheresis", "Male", "Female", "Biomarkers", "Adult", "Middle Aged", "Endothelial Cells", "Acute Disease", "Treatment Outcome"], "year": "2026", "doi": "10.3389/fimmu.2026.1852600"}], "color": "#0f766e"}}, {"data": {"id": "Small Intestine", "label": "Small Intestine", "description": "Function: Nutrient absorption after food intake.\nMetabolism:\n- Some gluconeogenesis\nKey Metabolites: Glucose, Fatty acids, glycerol, amino acids.\nKey Proteins: SGLT1, GLUT5\nSources:\n- DOI: 10.1016/j.cmet.2017.04.032\n- https://doi.org/10.1038/s41467-021-21235-y\n", "llm_description": "The small intestine plays a pivotal role in metabolic physiology by primarily consuming and producing various substrates. It is responsible for the digestion and absorption of nutrients from food, including carbohydrates, proteins, and fats, which are then transported to the bloodstream for distribution to the body's tissues [1]. The small intestine also produces several key hormones that regulate metabolism, such as cholecystokinin (CCK), gastrin, and secretin, which stimulate the release of digestive enzymes and regulate appetite and satiety [2]. Additionally, the gut microbiome in the small intestine produces metabolites, such as short-chain fatty acids, which serve as energy sources for the host and influence metabolic function [3]. The interplay between these substrates, hormones, and metabolites is crucial for maintaining proper glucose and lipid metabolism, and disturbances in this balance can contribute to various metabolic disorders.", "llm_papers": [{"pmid": "42376743", "title": "Immune-Inflammatory Imbalance in Mice Under High Humidity and Three Different Ambient Temperatures: Insights From Gut Microbiome and Serum Metabolomics.", "abstract": "Gut microbiota and metabolites have been increasingly implicated in the pathogenesis of immune inflammation, which may be affected by environmental factors. This study aimed to explore the influence of co-exposure to high humidity and temperatures (low, normal or high) on biomarkers of immune inflammation and potential mechanisms. We established C57BL/6J mice models (with equal numbers of males and females) of high humidity and low temperature (HH-LT), normal temperature (HH-NT) or high temperature (HH-HT) co-exposure environments to observe the impact of high humidity and different temperature co-exposure environments for 28 and 56 consecutive days. Following exposure, results showed that all six combined exposure conditions significantly increased pro-inflammatory cytokines (TNF-&#x3b1;, IL-1&#x3b2;, IL-12p70), decreased anti-inflammatory cytokines (IL-4, IL-10) and elevated the Teff/Treg ratio in the spleen. Gut microbiota analysis revealed reduced Akkermansia and increased Desulfovibrio and Enterorhabdus. Serum metabolomics identified widespread disturbances enriched in pathways including protein digestion and absorption, lysine degradation, phenylalanine metabolism and unsaturated fatty acid biosynthesis. Pearson correlation analysis confirmed significant associations among microbial shifts, immune-inflammatory dysregulation and metabolic perturbations-suggesting that high humidity combined with different temperatures correlated with immune imbalance, likely mediated by gut dysbiosis and serum metabolic disruption.", "keywords": [], "year": "2026", "doi": "10.1111/1462-2920.70365"}, {"pmid": "42376574", "title": "Exploring the Tenebrio molitor gut microbiota response to LDPE and PET: putative genetic indicators and methodological insights.", "abstract": "Insect gut microbiomes are recognized as potential reservoirs of enzymatic activities relevant to plastic metabolism. Here, we investigated the taxonomic and functional dynamics of the Tenebrio molitor gut microbiota under dietary exposure to low-density polyethylene (LDPE) and polyethylene terephthalate (PET) using 16S rRNA sequencing and shotgun metagenomics. Significant compositional shifts were detected at the ASV level, with plastic-fed cohorts showing enrichment of taxa implicated in xenobiotic metabolism. Predicted functional changes suggested altered abundance of pathways related to aromatic compound processing and redox homeostasis. Metagenomic assembly and functional annotation, performed through a reproducible open-source workflow, revealed several putative proteins with distant homology to enzymes such as phthalate dioxygenases, urethanases, and polyhydroxyalkanoate depolymerases. A metagenome-assembled genome (MAG) assigned to Enterococcus accounted for most recovered protein-coding sequences. Although gene-level comparisons did not show statistically significant differences, Gene Set Enrichment Analysis (GSEA) highlighted ABC transporter signatures and stress-response ATPases under plastic-exposed conditions. Overall, this exploratory study reveals microbial shifts and putative genetic indicators of metabolic potential within the T. molitor gut, providing a reproducible analytical framework for future investigations into the microbial role in plastic bioconversion.", "keywords": [], "year": "2026", "doi": "10.3389/fmicb.2026.1746922"}, {"pmid": "42376558", "title": "Effect of dietary Moringa oleifera leaf meal on feed conversion, egg traits, and immunometabolic responses in laying hens: In vivo and ex vivo assessments.", "abstract": "Moringa oleifera is a nutrient-rich plant widely explored for its potential as a natural feed additive in poultry due to its antioxidant, antimicrobial, and immunomodulatory properties. Incorporating Moringa leaf meal into laying hen diets may influence feed efficiency (FCR), egg quality, and immune-metabolic responses, warranting comprehensive in vivo and ex vivo investigations. This study investigated the impact of incorporating M . oleifera leaf meal (MOLM) into the diets of laying hens on egg productivity, egg characteristics, antioxidant capacity, immune response, and tissue morphology. Over an 8-week period, 40 30-week-old Hy-Line Brown layers were randomly distributed into four dietary groups (10 birds per group) and received nutritionally balanced diets with MOLM supplementation levels of 0%, 2.5%, 5.0%, or 7.5%. The key performance indicators, including feed intake, egg production, egg weight, and FCR, were recorded weekly. Egg quality traits and antioxidant parameters in liver and intestinal tissues were assessed along with pro-inflammatory cytokine levels and histopathological scoring. Inclusion of 7.5% MOLM significantly improved egg production (86.5%), egg weight (60.1 g &#xb1; desert), and FCR (2.04), compared with the control group ( p &lt; 0.05). Egg quality traits, including shell thickness, yolk pigmentation, Haugh unit, and albumen height, were enhanced in the MOLM-supplemented groups, particularly at 7.5.0% inclusion. A marked increase ( p &lt; 0.01) in the activity of key antioxidant enzymes (superoxide dismutase, catalase, and glutathione peroxidase) was observed in liver and intestinal tissues, accompanied by a decline in malondialdehyde levels, reflecting an improved oxidative state. Furthermore, MOLM supplementation resulted in a dose-dependent decrease in the levels of pro-inflammatory cytokines (IL-1&#x3b2;, IL-6, and TNF-&#x3b1;). The greatest reduction was observed at the 5.0% inclusion level. Histopathological evaluations corroborated these findings, revealing significantly reduced inflammation and oxidative damage scores, particularly in the group with 7.5% MOLM. Incorporating MOLM into the diet significantly improved laying hens' performance, enhanced egg quality, boosted antioxidant capacity, and positively influenced immune responses. These findings highlight the value of MOLM as a natural phytogenic additive with potential benefits for enhancing poultry productivity and overall health.", "keywords": ["Animals", "Moringa oleifera", "Chickens", "Female", "Animal Feed", "Diet", "Plant Leaves", "Antioxidants", "Dietary Supplements", "Animal Nutritional Physiological Phenomena", "Random Allocation"], "year": "2025", "doi": "10.5455/OVJ.2025.v15.i12.30"}, {"pmid": "42376506", "title": "Functional recovery from malnutrition via extracts of Glycine max L. Merr and Brassica oleracea L in rats: Impacts on bodyweight, hematology, and PEPT1 expression.", "abstract": "Malnutrition, particularly protein-energy malnutrition (PEM), remains a global health concern. Functional f
