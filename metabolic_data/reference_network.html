antly reduced serum concentrations of alanine aminotransferase (ALT) and aspartate aminotransferase (AST) (P &#x2264; 0.05). Histological analysis showed that birds reared under HSD with omega-3 supplementation had thinner pulmonary arterial walls compared with those under HSD without omega-3, as well as those reared under SSD regardless of supplementation. The smallest cardiomyocyte diameter was recorded in birds reared under HSD and supplemented with 0.5% omega-3 (P &#x2264; 0.05). Gene expression analysis revealed that acetyl-CoA carboxylase alpha (ACACA) and Phosphofructokinase-1 (PFK1) were significantly down-regulated in the liver tissue of birds reared under HSD compared with those fed HSD diets supplemented with omega-3 (P &#x2264; 0.05). Overall, omega-3 supplementation was associated with reduced mortality, lower liver enzyme levels, attenuated histological alterations in the pulmonary artery and RV, and modulation of hepatic genes related to energy metabolism.", "keywords": [], "year": "2026", "doi": "10.1038/s41598-026-58263-x"}, {"pmid": "42309495", "title": "Circulating ATP from hepatic ischemia-reperfusion drives remote cardiac injury via macrophage inflammasome activation.", "abstract": "Cardiac complications after major hepatic surgery are frequent, yet how hepatic ischemia-reperfusion injury (HIRI) damages the remote heart is unknown. In 382 hepatectomy patients, the incidence of myocardial injury after noncardiac surgery (MINS) rose from 20.5% to 50% with increasing postoperative liver damage severity (P&#x202f;&lt;&#x202f;0.0001). In a murine HIRI model, cardiac dysfunction lagged behind hepatic injury; circulating ATP surged within one hour of reperfusion from the ischemic liver and was both sufficient and necessary to drive remote cardiac damage. Extracellular ATP activated the P2X7 receptor on cardiac macrophages, triggering NLRP3 inflammasome assembly and gasdermin D (GSDMD)-dependent cardiomyocyte pyroptosis; siRNA-based dominant-gating co-culture identified macrophage P2X7 as the upstream gating step, with cardiomyocyte-side P2X7 knockdown failing to abrogate downstream pyroptosis. Single-cell profiling traced this program to monocyte-derived macrophages differentiating into inflammatory macrophages, and macrophages amplified hepatocyte-derived ATP into IL-1&#x3b2;-driven cardiomyocyte pyroptosis in vitro. Clodronate-mediated macrophage depletion preserved cardiac function. The selective P2X7 antagonist JNJ-47965567 polarized cardiac macrophages toward an anti-inflammatory phenotype and suppressed NLRP3-GSDMD pyroptosis when administered up to approximately 3&#x202f;h after reperfusion onset, defining a clinically relevant therapeutic window. Adenosine activated the A2A receptor and attenuated cardiac injury dose-dependently, reversed by SCH-58261, and conferred greater cardiac protection than dexamethasone or N-acetylcysteine. These findings establish cardiac macrophages as amplifiers of liver-derived danger signals and identify the ATP-P2X7/adenosine-A2A purinergic axis as a potential pharmacological target for perioperative cardioprotection.", "keywords": [], "year": "2026", "doi": "10.1016/j.phrs.2026.108306"}, {"pmid": "42301766", "title": "Integrative analysis of the gut-liver-heart axis in&#xa0;coronary artery disease: From chronic metabolic dysbiosis to acute cardiogenic shock.", "abstract": "The complex interplay between chronic metabolic disorders and acute cardiovascular decompensation represents a critical frontier in cardiology. This integrative research program conducted at Chongqing Medical University systematically examines the gut-liver-heart axis across the cardiovascular disease spectrum through three interconnected studies. First, a case-control investigation of coronary artery disease (CAD) patients with and without nonalcoholic fatty liver disease (NAFLD) revealed distinct intestinal dysbiosis patterns characterized by increased Coprococcus and Veillonella alongside decreased Parabacteroides, Bacteroides fragilis, and Bifidobacterium longum, with these microbial alterations correlating significantly with body mass index, triglyceride levels, and hepatic transaminases. Second, a retrospective cohort study of acute myocardial infarction complicated by cardiogenic shock demonstrated that elevated admission bilirubin (HR = 1.020, P = 0.003) and alanine aminotransferase independently predicted 30-day mortality, while serum albumin exerted protective effects (HR = 0.955, P &lt; 0.001). Third, analysis of a comprehensive clinical registry illuminated the systemic clustering of metabolic, renal, and inflammatory abnormalities that underpin both chronic cardiometabolic disease and acute cardiovascular collapse. Collectively, these findings establish a pathogenic continuum wherein chronic intestinal dysbiosis and subclinical hepatic dysfunction create a vulnerable substrate that amplifies injury during acute ischemic events. This research framework provides mechanistic insights into the gut-liver-heart axis and proposes integrated biomarker panels for risk stratification across cardiovascular disease stages.", "keywords": [], "year": "2026", "doi": "10.1556/030.2026.02892"}], "pubmed_query": "(\"heart\"[Title] OR \"cardiac\"[Title] OR \"myocardial\"[Title] OR \"cardiomyocyte\"[Title] OR \"left ventricle\"[Title] OR \"myocardium\"[Title]) AND (\"liver\"[Title] OR \"hepatic\"[Title] OR \"hepatocyte\"[Title] OR \"hepatocellular\"[Title] OR \"nonalcoholic fatty liver\"[Title] OR \"NAFLD\"[Title] OR \"NASH\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Heart__Lung", "source": "Heart", "target": "Lung", "color": "#64748b", "description": "Type: Stress response\nKey Players: \nNotes: - Might be as nervous patients during the scan breathe more heavily and have a higher heart rate. \nSources:", "connection_type": "Stress response", "key_players": ["Notes: - Might be as nervous patients during the scan breathe more heavily and have a higher heart rate."], "key_players_metabolites": ["glucose", "amp", "fatty acid", "hdl", "cholesterol", "ammonia", "ldl", "lactate", "atp", "creatinine", "lipoprotein", "acetate", "creatine", "triglyceride", "amino acids", "triglycerides", "fatty acids", "adp", "sphingolipid", "oxaloacetate", "glycine", "citrate", "bilirubin", "cysteine", "prostaglandin", "arginine", "uric acid", "urea", "serine", "linoleate"], "key_players_hormones": ["angiotensin", "tnf", "bnp", "apelin", "il-6", "mineralocorticoid", "insulin", "testosterone", "natriuretic peptide", "tumor necrosis factor", "angiotensin ii", "adrenaline", "vasopressin", "interleukin-6", "cortisol", "growth hormone", "estrogen", "il-10", "estradiol", "anp"], "key_players_proteins": ["sglt2", "sirt1", "akt", "pgc-1", "ucp2", "mapk", "pi3k", "tfam", "ampk", "inos", "mtor", "pdk1", "jnk", "p38", "cox-2"], "key_players_counts_metabolites": {"cholesterol": 7, "ammonia": 6, "sphingolipid": 1, "oxaloacetate": 1, "glycine": 1, "amp": 27, "citrate": 1, "atp": 5, "bilirubin": 1, "hdl": 8, "amino acids": 2, "glucose": 44, "fatty acid": 12, "ldl": 6, "lactate": 6, "cysteine": 1, "prostaglandin": 1, "arginine": 1, "creatinine": 5, "lipoprotein": 5, "triglycerides": 2, "acetate": 4, "creatine": 3, "uric acid": 1, "urea": 1, "triglyceride": 3, "fatty acids": 2, "adp": 2, "serine": 1, "linoleate": 1}, "key_players_counts_hormones": {"tnf": 8, "testosterone": 5, "bnp": 7, "natriuretic peptide": 5, "mineralocorticoid": 6, "angiotensin ii": 3, "cortisol": 1, "growth hormone": 1, "estrogen": 1, "insulin": 6, "apelin": 7, "il-10": 1, "adrenaline": 2, "tumor necrosis factor": 5, "vasopressin": 2, "il-6": 7, "estradiol": 1, "anp": 1, "angiotensin": 12, "interleukin-6": 2}, "key_players_counts_proteins": {"pdk1": 1, "mapk": 4, "jnk": 1, "pi3k": 3, "p38": 1, "ucp2": 7, "tfam": 2, "sglt2": 24, "akt": 11, "cox-2": 1, "pgc-1": 8, "ampk": 2, "sirt1": 12, "inos": 2, "mtor": 2}, "notes": "- Might be as nervous patients during the scan breathe more heavily and have a higher heart rate.", "sources": [], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42337349", "title": "Respiratory muscle training improves post-stroke sarcopenia independent of stroke type, pneumonia, and cardiac comorbidities.", "abstract": "Post-stroke sarcopenia (PSP) poses a significant rehabilitation challenge due to substantial clinical heterogeneity in stroke type and comorbidities. While respiratory muscle training (RMT) offers a promising approach by targeting core physiological function, its consistent efficacy across diverse PSP subtypes remains unestablished. This study aimed to determine whether RMT's benefits are consistent regardless of stroke etiology, pneumonia status, or cardiac function. This study consisted of two phases. Phase 1 was a retrospective analysis of 89 PSP patients to characterize clinical heterogeneity. Phase 2 was a prospective randomized controlled trial in which PSP patients were allocated to RMT plus standard care (n&#x2009;=&#x2009;30) or standard care alone (n&#x2009;=&#x2009;30). The protocol included 8 weeks of supervised RMT targeting diaphragmatic and accessory respiratory muscles. Outcomes included muscle mass (ASMI, calf circumference) and strength (handgrip) as primary measures, with physical function (MBI, FMA) as secondary outcomes. Prespecified subgroup analyses evaluated treatment interactions with stroke type, pneumonia, and cardiac function. The RMT group demonstrated significantly greater improvements in functional outcomes (MBI: p&#x2009;&lt;&#x2009;0.01; FMA: p&#x2009;&lt;&#x2009;0.05) and muscle mass metrics (ASMI: p&#x2009;&lt;&#x2009;0.05; calf circumference: p&#x2009;&lt;&#x2009;0.05) compared to controls. Crucially, subgroup analyses revealed no significant interactions between treatment effect and stroke type (ischemic/hemorrhagic), pneumonia status, or cardiac function (all p&#x2009;&gt;&#x2009;0.05), suggesting consistent efficacy of RMT across these subgroups. Exploratory analysis further showed RMT mitigated the limiting effects of baseline physiological status on rehabilitation potential. RMT constitutes an effective foundational rehabilitation strategy for PSP, demonstrating consistent efficacy across major clinical subtypes. These findings support implementation as standard care irrespective of specific stroke characteristics or cardiopulmonary comorbidities, addressing a critical need in heterogeneous PSP populations.Clinical trial registration number: ChiCTR2500111452.", "keywords": [], "year": "2026", "doi": "10.1038/s41598-026-59171-w"}, {"pmid": "42323108", "title": "Phenotyping of pulmonary arterial hypertension associated with congenital heart disease using latent class analysis: insights from a national prospective registry.", "abstract": "Pulmonary arterial hypertension associated with congenital heart disease (PAH-CHD) is characterized by substantial prognostic and therapeutic heterogeneity. Conventional clinical and anatomic-pathophysiological classifications fail to fully capture these intricacies. Unsupervised clustering approaches such as latent class analysis (LCA) have been used to address this limitation. Can LCA-derived phenogroups refine risk stratification and predict PAH-targeted treatment responses in adult patients with PAH-CHD? Adult PAH-CHD patients (N=889) from a multicenter prospective registry were stratified into post- and pre-tricuspid shunt subsets. LCA was performed in each subset using 28 candidate clinical, laboratory, and hemodynamic variables. Ten-year survival and the effect of PAH-targeted therapy across phenogroups were evaluated. LCA identified four phenogroups in each subset with distinct phenotyping patterns. In post-tricuspid shunts, Group 1 (\"adaptation with open shunt\") exhibited preserved right ventricular function and the best survival despite high afterload. Groups 3 (\"maladaptation and failure\") and 4 (\"closed shunt and failure\") faced 2 to 3-fold higher mortality than Group 1. Notably, Group 2 (\"hyperkinetic state\") uniquely benefited from combination therapy (interaction P=0.026). In pre-tricuspid shunts, Groups 1 (\"high shunt and mild resistance\") and 3 (\"young female and low inflammation\") demonstrated preserved survival despite varying afterloads. However, Group 2 (\"old male and comorbidities\") had significantly higher mortality and an attenuated treatment response (interaction P=0.037) despite sharing mild hemodynamics with Group 1. Group 4 (\"high resistance and failure\") faced severe hypoxemia and the worst prognosis. LCA successfully stratified PAH-CHD patients into distinct phenogroups with varied clinical profiles, survival, and treatment responses. This data-driven phenotyping system provides a novel approach for risk stratification and may guide personalized clinical decision-making.", "keywords": [], "year": "2026", "doi": "10.1016/j.chest.2026.06.019"}, {"pmid": "42319624", "title": "Beyond the right ventricle: left heart involvement in pulmonary arterial hypertension.", "abstract": "Pulmonary arterial hypertension (PAH) is characterized by progressive remodeling of the pulmonary vasculature, leading to increased pulmonary vascular resistance and chronic right ventricular (RV) pressure overload. As RV dysfunction develops, ventricular interdependence alters the structural and functional relationship between the right and left ventricles. Although normal left-sided filling pressures define PAH, growing evidence indicates that left ventricular (LV) mechanics may be substantially affected. Leftward septal displacement, pericardial constraint, and reduced pulmonary venous return contribute to chronic underfilling of the left atrium and LV, impairing ventricular geometry and contractile dynamics despite preserved intrinsic myocardial function. However, secondary myocardial remodeling in advanced disease remains debated. These alterations may lead to subclinical or overt LV dysfunction and represent an underrecognized component of PAH pathobiology. Imaging markers such as LV global longitudinal strain, LV outflow tract velocity-time integral, and left atrial strain have emerged as potential indicators of left-sided involvement and may provide additional prognostic information. In this narrative review, we summarize current evidence on the pathobiological mechanisms linking RV dysfunction to left-sided cardiac alterations and discuss the role of ventricular interdependence in the coupling of the pulmonary circulation. Understanding this interaction may help redefine PAH as a progressive biventricular syndrome and may improve risk stratification and clinical assessment.", "keywords": ["Humans", "Ventricular Dysfunction, Right", "Heart Ventricles", "Ventricular Remodeling", "Pulmonary Arterial Hypertension", "Ventricular Function, Right", "Hypertension, Pulmonary", "Ventricular Dysfunction, Left", "Global Longitudinal Strain"], "year": "2026", "doi": "10.1007/s10741-026-10643-1"}, {"pmid": "42313476", "title": "Apelin analog treatment reverses severe pulmonary arterial hypertension and right ventricular heart failure.", "abstract": "Pulmonary arterial hypertension (PAH) is a progressive vascular syndrome characterized by aberrant signaling, severe pulmonary artery remodeling, and right ventricular (RV) failure, a major driver of morbidity and mortality. Dysregulation of the apelinergic pathway has been implicated in pulmonary vascular remodeling in PAH. Using a sugen-hypoxia rat model of PAH, we assessed the ability of a novel apelin analog, resistant to native peptidase degradation, to reverse the pathological hallmarks of PAH and RV dysfunction. Apelin analog therapy corrected the vascular lesions in the lungs and nearly normalized pulmonary arterial pressures. Early cardiorenal syndrome, RV dilation and dysfunction as well as RV cardiomyocyte and fibroblast activation induced by pressure overload, were also reversed by apelin analog treatment. Single-nucleus RNA sequencing of the lungs and RV revealed apelin-analog treatment activated several protective pathways, including rebalancing protective BMPR2 (bone morphogenetic protein receptor type 2) signaling to counteract excessive pathogenic TGFBR2 (transforming growth factor &#x3b2; receptor 2) activity in PAH. These findings highlight the therapeutic potential of exogenous apelin in reversing pulmonary vascular and cardiac pathologies in PAH and support further investigation to evaluate the clinical benefits of apelin analog treatment in patients with PAH and RV failure.", "keywords": [], "year": "2026", "doi": "10.1172/jci.insight.200684"}, {"pmid": "42308916", "title": "Vericiguat, a soluble guanylate cyclase stimulator, regulates heart failure-enhanced atrial and pulmonary vein arrhythmogenesis.", "abstract": "Heart failure (HF) and atrial fibrillation (AF) often coexist and exacerbate each other. HF enhances pulmonary vein (PV; a key AF trigger) arrhythmogenesis and calcium dysregulation, thereby promoting AF initiation. Vericiguat, a soluble guanylate cyclase stimulator, improves outcomes in HF; however, its electrophysiological effects on PV arrhythmogenesis remain unclear. Using conventional microelectrodes, we examined the effects of vericiguat (0.1, 1, and 10&#x202f;&#x3bc;M) on PV action potential and electrical activity; the effects of vericiguat (10&#x202f;&#x3bc;M) on PVs pretreated with the protein kinase K (PKG) inhibitor KT5823 (1&#x202f;&#x3bc;M) or the protein kinase A (PKA) inhibitor H89 (10&#x202f;&#x3bc;M); and the effects of vericiguat (0.2&#x202f;mg/kg, intravenous, 5 days/week for 4 weeks) on the electrical activity of HF PVs. Whole-cell patch-clamp recordings measured L-type calcium current, sodium/calcium exchanger current, and late sodium current in isolated PV myocytes with or without vericiguat (10&#x202f;&#x3bc;M). Fluorescence imaging assessed calcium transients and cytosolic calcium content in PV myocytes with or without vericiguat (10&#x202f;&#x3bc;M). Vericiguat significantly reduced PV spontaneous activity and diastolic tension without altering resting membrane potential or action potential amplitude. These antiarrhythmic effects were abolished by KT5823 or H89, indicating involvement of PKG- and PKA-dependent signaling. Vericiguat suppressed L-type calcium current, sodium/calcium exchanger current, and late sodium current and improved intracellular calcium transients and sarcoplasmic reticulum calcium content. Moreover, vericiguat significantly reduced PV spontaneous activity in HF rabbits. Vericiguat attenuates PV arrhythmogenesis in HF through PKG- and PKA-dependent mechanisms.", "keywords": [], "year": "2026", "doi": "10.1016/j.biopha.2026.119675"}], "pubmed_query": "(\"heart\"[Title] OR \"cardiac\"[Title] OR \"myocardial\"[Title] OR \"cardiomyocyte\"[Title] OR \"left ventricle\"[Title] OR \"myocardium\"[Title]) AND (\"lung\"[Title] OR \"pulmonary\"[Title] OR \"alveolar\"[Title] OR \"bronchial\"[Title] OR \"respiratory\"[Title] OR \"pneumocyte\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Heart__Thyroid", "source": "Heart", "target": "Thyroid", "color": "#64748b", "description": "Type: Metabolic status\nKey Players: TSH, TH\nNotes: - TH  regulates Thermogenesis, energy utilization by increasing the basal metabolic rate and regulate lipid and glucose metabolism. At hyperthyroid condition: Increased heart rate. At Hypothyroid condition: decreased heart rate.\nSources:\n- doi: 10.1177/2042018820917869\n- https://doi.org/10.1152/physrev.00030.2013", "connection_type": "Metabolic status", "key_players": ["TSH", "TH"], "key_players_metabolites": ["TSH", "TH", "glucose", "cholesterol", "amp", "atp", "lipoprotein", "hdl", "creatinine", "lactate", "triglycerides", "fatty acids", "ursodeoxycholic acid", "creatine", "nadph", "fatty acid", "ketone bodies", "glutamate", "amino acid", "uric acid", "urea", "phospholipid", "serine", "bile acid"], "key_players_hormones": ["TSH", "TH", "thyroid hormone", "t3", "thyroid hormones", "thyroxine", "triiodothyronine", "t4", "thyrotropin", "natriuretic peptide", "angiotensin", "vitamin d", "tnf", "bnp", "igf-1", "angiotensin ii", "norepinephrine", "cortisol", "insulin", "glucocorticoid", "noradrenaline", "tumor necrosis factor", "epinephrine", "tgf-b", "igf1", "anp"], "key_players_proteins": ["TSH", "TH", "akt", "p38", "mapk", "pi3k", "acc", "tfam", "sirt1", "mtor", "jnk", "foxo1", "cd36", "erk1", "pdk4", "ampk"], "key_players_counts_metabolites": {"cholesterol": 12, "ketone bodies": 1, "amp": 6, "atp": 6, "hdl": 5, "glucose": 16, "fatty acid": 2, "glutamate": 1, "lactate": 4, "amino acid": 1, "creatinine": 5, "ursodeoxycholic acid": 3, "lipoprotein": 6, "triglycerides": 4, "creatine": 3, "uric acid": 1, "urea": 1, "fatty acids": 4, "phospholipid": 1, "nadph": 3, "serine": 1, "bile acid": 1}, "key_players_counts_hormones": {"thyroid hormone": 249, "tnf": 5, "bnp": 4, "natriuretic peptide": 11, "glucocorticoid": 2, "thyroxine": 99, "igf-1": 4, "angiotensin ii": 4, "norepinephrine": 4, "cortisol": 4, "thyroid hormones": 144, "noradrenaline": 1, "insulin": 4, "t3": 172, "vitamin d": 8, "tumor necrosis factor": 1, "triiodothyronine": 94, "epinephrine": 1, "tgf-b": 1, "igf1": 1, "tsh": 221, "thyrotropin": 39, "t4": 56, "anp": 1, "angiotensin": 9}, "key_players_counts_proteins": {"mapk": 8, "jnk": 1, "pi3k": 7, "foxo1": 1, "p38": 9, "tfam": 2, "akt": 12, "cd36": 1, "erk1": 1, "pdk4": 1, "ampk": 1, "sirt1": 2, "acc": 3, "mtor": 2}, "notes": "- TH  regulates Thermogenesis, energy utilization by increasing the basal metabolic rate and regulate lipid and glucose metabolism. At hyperthyroid condition: Increased heart rate. At Hypothyroid condition: decreased heart rate.", "sources": ["doi: 10.1177/2042018820917869", "https://doi.org/10.1152/physrev.00030.2013"], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42324939", "title": "Investigating thyroid dysfunction in pediatric patients following the administration of iodinated contrast media during cardiac catheterization.", "abstract": "To determine the incidence and severity of thyroid dysfunction following iodinated contrast media (ICM) exposure in our pediatric heart center, assess adherence to FDA guidelines and evaluate the utility of routine thyroid function testing. This retrospective study reviewed charts of 186 patients under four years old who underwent cardiac catheterization between June 2022 and June 2024 at our pediatric heart center. Data collected included age, sex, gestational age, ethnicity, ICM use, and post-procedure thyroid-stimulating hormone (TSH) levels. Additional risk factors were assessed for patients with abnormal thyroid studies. Of the 186 cardiac catheterization procedures, 155 involved administration of ICM. Follow-up thyroid studies were conducted after 113 of these; three lab draws were excluded due to new diagnoses of hypothyroidism made during the study period. Among the remaining 110 cases with indicated TSH testing, only two patients (1.8&#x202f;%) demonstrated persistently elevated TSH levels&#xa0;-&#xa0;both of whom had pre-existing risk factors for thyroid dysfunction. Among the 113 cases that completed follow-up TSH studies, 69 (61.1&#x202f;%) occurred within the FDA's recommended 3-week period. Post-procedure thyroid studies were not completed in 42 cases (27.1&#x202f;%), although four patients had passed away and four were transferred to another hospital system. No clinically significant relationship was found between ICM exposure and thyroid dysfunction in patients under four years old, suggesting routine post-catheterization thyroid screening may be unnecessary.", "keywords": [], "year": "2026", "doi": "10.1515/jpem-2026-0036"}, {"pmid": "42205546", "title": "Cardiac Tamponade Secondary to Massive Pericardial Effusion in Severe Primary Hypothyroidism: A Case Report.", "abstract": "Pericardial effusion is a recognized manifestation of overt hypothyroidism, but progression to cardiac tamponade is rare. In tuberculosis-endemic settings, diagnostic focus often favors tuberculous pericarditis, risking delayed recognition of reversible endocrine causes. A 65-year-old Black African woman from Northern Uganda presented with five months of progressive dyspnea, orthopnea, and generalized edema, followed by acute pleuritic chest pain. She had a history of hypertension and type 2 diabetes mellitus. No prior thyroid disease, tuberculosis, malignancy, or rheumatologic condition was identified. Examination revealed marked sinus bradycardia (42 beats/min), elevated jugular venous pressure, muffled heart sounds, pulsus paradoxus, and Woltman's sign. The thyroid gland was diffusely enlarged without palpable nodules or cervical lymphadenopathy. Electrocardiography showed low-voltage QRS complexes. Transthoracic echocardiography demonstrated a large circumferential pericardial effusion (maximal posterior separation 3.2 cm) with right ventricular diastolic collapse and Doppler evidence of tamponade physiology, and a mildly reduced left ventricular ejection fraction of approximately 40%, with diffuse hypokinesis and no regional wall motion abnormalities, making ischemic cardiomyopathy less likely. Urgent pericardiocentesis drained 520 mL of clear, straw-colored fluid. Pericardial fluid analysis showed elevated total protein (4.2 g/dL; serum protein 7.0 g/dL; fluid-to-serum ratio 0.6), moderately elevated lactate dehydrogenase (below 1000 U/L), low adenosine deaminase (&lt;5 U/L), and negative mycobacterial studies, making tuberculous pericarditis unlikely. Thyroid function tests confirmed severe primary hypothyroidism (thyroid-stimulating hormone 88.08 mIU/L; free thyroxine 4.0 pmol/L) with positive anti-thyroid peroxidase antibodies, consistent with autoimmune thyroiditis. Low-dose levothyroxine was initiated with gradual titration. Hemodynamic status improved immediately after pericardiocentesis. Follow-up echocardiography showed complete resolution of the effusion, and the patient achieved biochemical euthyroid within three months. Severe primary hypothyroidism should be routinely considered in patients with unexplained pericardial effusion, even in tuberculosis-endemic settings. Paradoxical bradycardia in tamponade, Woltman's sign, low-voltage electrocardiography, and a protein-rich pericardial effusion with low adenosine deaminase are important diagnostic clues. Prompt pericardiocentesis treats hemodynamic compromise, while cautious levothyroxine replacement prevents recurrence.", "keywords": [], "year": "2026", "doi": "10.2147/IMCRJ.S610746"}, {"pmid": "42185778", "title": "Low T3 syndrome in heart failure: prevalence and its relationship with disease severity and ejection fraction.", "abstract": "Low T3 syndrome is a common hormonal alteration observed in patients with heart failure and has been associated with disease severity and adverse clinical outcomes. The prevalence of low T3 syndrome and its relationship with heart failure severity and ejection fraction phenotypes remain clinically relevant issues. This study aimed to evaluate the prevalence of low T3 syndrome in patients with heart failure and to investigate its association with disease severity and left ventricular ejection fraction. In this prospective observational study, 132 patients with chronic heart failure (81 males, 51 females) who were evaluated at a tertiary care hospital between June 2021 and November 2021 were consecutively enrolled. Patients with known thyroid disease, use of thyroid hormone therapy, positive anti-thyroid antibodies, severe anemia, malignancy, active inflammatory disease, or medications affecting thyroid function were excluded. Low T3 syndrome was defined as a serum total triiodothyronine level below 2.6 ng/L in the presence of normal thyroid-stimulating hormone concentrations. Patients were classified according to left ventricular ejection fraction as reduced (&lt;&#x2009;50%) or preserved (&#x2265;&#x2009;50%). Clinical characteristics, laboratory parameters, inflammatory markers, and hospitalization indicators were analyzed in relation to serum T3 levels and ejection fraction phenotypes. Low T3 syndrome was detected in 60 patients (45.5%). Reduced ejection fraction was present in 82 patients (62.1%), while 50 patients (37.9%) had preserved ejection fraction. The prevalence of low T3 syndrome was significantly higher in patients with reduced ejection fraction compared to those with preserved ejection fraction. However, this association appeared less pronounced than its relationship with overall disease severity. Patients with low T3 syndrome demonstrated features of increased disease severity, including a non-significant trend toward longer hospital stays and worse clinical profiles. Lower T3 levels were associated with indicators of more advanced heart failure, whereas the relationship with ejection fraction phenotype was less pronounced. Low T3 syndrome is highly prevalent in patients with heart failure and is associated with increased disease severity. Its relationship with ejection fraction phenotype appears secondary to its association with clinical severity. Assessment of T3 levels may provide additional insight into the clinical status of patients with heart failure beyond conventional systolic function evaluation.", "keywords": [], "year": "2026", "doi": "10.1186/s12872-026-05973-9"}, {"pmid": "42082305", "title": "Thyroid hormone deficiency-induced cardiac ion channel dysfunction: Molecular mechanisms and arrhythmic implications.", "abstract": "Thyroid hormones are essential regulators of cardiac excitability, contractility, and rhythm. Hypothyroidism induces profound electrophysiological remodeling through both genomic and non-genomic pathways, leading to altered expression and function of key ion channels, including HCN, Kv, and Ca&#xb2;&#x207a;-handling proteins. These changes result in reduced pacemaker activity, prolonged repolarization, and impaired excitation-contraction coupling, which collectively contribute to bradycardia, QT prolongation, and increased arrhythmogenic risk. Elevated thyroid-stimulating hormone (TSH) levels further exacerbate electrical instability through direct myocardial signaling. Experimental and clinical evidence indicates that many of these abnormalities could be reversible upon thyroid hormone replacement, emphasizing the importance of early diagnosis and multidisciplinary management. Understanding the molecular basis of thyroid-induced electrical remodeling provides insight into arrhythmogenesis and may guide therapeutic strategies to prevent cardiac complications in hypothyroidism.", "keywords": ["Humans", "Arrhythmias, Cardiac", "Thyroid Hormones", "Ion Channels", "Animals", "Hypothyroidism"], "year": "2026", "doi": "10.1016/bs.ctm.2026.01.002"}, {"pmid": "41948356", "title": "Cardiac Tamponade, Pituitary Hyperplasia, and Macroorchidism in Severe Primary Hypothyroidism.", "abstract": "This case reports a rare and complex presentation of severe primary hypothyroidism (PH) in an 18-year-old male. The patient presented to the emergency department with dyspnea due to impending cardiac tamponade, requiring emergency pericardiocentesis. Further evaluation revealed features of long-standing PH, including short stature, cognitive delay, and pubertal discordance with macroorchidism. Laboratory tests showed extreme elevation of TSH and multiple anterior pituitary hormone deficiencies. Magnetic resonance imaging (MRI) revealed a large sellar mass mimicking a pituitary adenoma. Treatment was initiated with levothyroxine and physiological hydrocortisone. Follow-up at 6 months showed improvement in clinical status and TSH level and significant regression of the pituitary mass on repeat MRI, confirming the diagnosis of pituitary hyperplasia in primary hypothyroidism (PHPH). This case highlights the potential for severe, life-threatening manifestations of PH and emphasizes that a therapeutic trial with levothyroxine is the definitive approach to differentiate PHPH from a TSH-secreting pituitary adenoma, thus avoiding unnecessary surgical intervention.", "keywords": [], "year": "2026", "doi": "10.1210/jcemcr/luaf322"}], "pubmed_query": "(\"heart\"[Title] OR \"cardiac\"[Title] OR \"myocardial\"[Title] OR \"cardiomyocyte\"[Title] OR \"left ventricle\"[Title] OR \"myocardium\"[Title]) AND (\"thyroid\"[Title] OR \"thyroid gland\"[Title] OR \"thyroid hormone\"[Title] OR \"T3\"[Title] OR \"T4\"[Title] OR \"TSH\"[Title] OR \"hypothyroidism\"[Title] OR \"hyperthyroidism\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Liver__Spleen", "source": "Liver", "target": "Spleen", "color": "#64748b", "description": "Type: Multiple Connections\nKey Players: \nNotes:\n- Gut-Spleen-Liver axis. Has key roles in liver Disease. Feedback loop between Spleen and Liver. Connected through lymphatic, vascular system and neurological pathways.\n- Likely to be present during inflammatory states.\nSources:\n in": 3, "il6": 3, "insulin": 22, "vitamin d": 2, "il-10": 4, "tumor necrosis factor": 14, "epinephrine": 1, "leptin": 3, "il1b": 1, "motilin": 5, "il-6": 24, "gnrh": 8, "ghrelin": 10, "epo": 13, "prolactin": 4, "interleukin-6": 5}, "key_players_counts_proteins": {"mapk": 14, "hk2": 1, "gapdh": 3, "nos2": 5, "pi3k": 4, "foxo1": 1, "mtorc1": 1, "p38": 14, "pparg": 8, "glucokinase": 1, "srebp-1c": 7, "nf-kb": 1, "akt": 10, "cox2": 1, "cox-2": 7, "erk1": 3, "ampk": 1, "inos": 4, "mtor": 2, "erk2": 3, "srebp": 7}, "notes": "- Gut-Spleen-Liver axis. Has key roles in liver Disease. Feedback loop between Spleen and Liver. Connected through lymphatic, vascular system and neurological pathways.\n- Likely to be present during inflammatory states.", "sources": ["https://doi.org/10.1096/fj.202502523RR\""], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42272668", "title": "Study on diagnostic models for insomnia and gastralgia with Liver-Spleen Disharmony Syndrome based on machine learning.", "abstract": "The prevalence of insomnia and gastralgia has recently increased. Traditional Chinese Medicine (TCM) offers unique advantages in treating these conditions. Accurate syndrome differentiation is essential for effective treatment. However, as a common syndrome in TCM for these conditions, the diagnostic criteria for Liver-Spleen Disharmony Syndrome (LSDS) currently lack uniformity. To develop a machine learning-based diagnostic model for LSDS in patients with insomnia and/or gastralgia. In this prospective observational study, clinical data from 575 patients with insomnia and/or gastralgia were collected using structured scales. The data included demographic information and clinical symptoms related to LSDS. Six machine learning algorithms-Chi-square Automatic Interaction Detector (CHAID), C5.0 decision tree, Back-Propagation Neural Network (BPNN), Radial Basis Function (RBF) network, Bayesian Network (BN), and Binomial Logistic Regression Analysis (BLRA)-were employed to construct diagnostic models for LSDS. Model performance was evaluated using receiver operating characteristic (ROC) curves, confusion matrices, and precision-recall (P-R) curves. The CHAID model outperformed all others, achieving an area under the ROC curve (AUC) of 0.889 (95% CI: 0.861-0.914), accuracy (AC) of 0.960, sensitivity (SE) of 0.972, specificity (SP) of 0.977, and an F1 score of 0.955. Prediction of variable importance in the CHAID model indicated that depression or irritability was the most important symptom variable for LSDS, followed by epigastric fullness, distending pain in hypochondrium, poor excretion of stool, diarrhea with abdominal pain, and excessive flatus. The C5.0 model ranked second (AUC = 0.797, accuracy = 0.958, F1 = 0.953). Other models showed progressively lower performance: BLRA (AUC = 0.648, accuracy = 0.947, F1 = 0.942), BPNN (AUC = 0.697, accuracy = 0.913, F1 = 0.901), BN (AUC = 0.538, accuracy = 0.944, F1 = 0.935), and RBF (AUC = 0.569, accuracy = 0.824, F1 = 0.810). We successfully developed a machine learning-based diagnostic model for Liver-Spleen Disharmony Syndrome (LSDS) in patients with insomnia and gastralgia. The CHAID model demonstrated superior performance and shows promise as an exploratory tool to assist clinicians; however, independent external validation is required before it can be considered for clinical application.", "keywords": [], "year": "2026", "doi": "10.3389/fmed.2026.1782578"}, {"pmid": "42264953", "title": "[Pathological changes and macrophage polarization in the liver and spleen of mice infected with Angiostrongylus cantonensis ].", "abstract": "To investigate the temporal changes in pathological damage and macrophage polarization in liver and spleen tissues of mice infected with Angiostrongylus cantonensis , and to preliminarily unravel the peripheral immune responses during the early stage of A. cantonensis infection. Forty female BALB/c mice at ages of 6 to 8 weeks were randomly divided into four groups, including the control group and 7-, 14-, and 21-day infection groups, with 10 mice in each group. Each mouse in the infection groups was inoculated with 30 third-stage (L3) larvae of A. cantonensis by oral gavage, and five mice were randomly selected from each infection group on days 7, 14, and 21 post-infection, while mice in the control group were given the same volume of physiological saline and five mice were randomly selected from the control group on the day of oral gavage. Mouse liver and spleen tissues were sampled. The histopathological changes of mouse liver and spleen tissues were observed using hematoxylin and eosin (HE) staining, and the percentage of positive staining area and the co-localization positive rates of the macrophage surface antigens F4/80, CD86, and CD206 were quantified in mouse liver and spleen tissues using immunohistochemical and immunofluorescence staining. In addition, five mice were collected from each infection group on days 7, 14, and 21 post-infection, and five mice were collected from the control group on the day of oral gavage. Mouse liver and spleen tissues were sampled for detection of macrophage markers CD86 and CD206 and macrophage phenotyping using flow cytometry, and the expression of M1 macrophage markers, including inducible nitric oxide synthase ( Nos2 ), tumor necrosis factor-&#x3b1; ( TNF-&#x3b1; ), interleukin-1&#x3b2; ( IL-1&#x3b2; ) and M2 markers, including arginase 1 ( Arg1 ), mannose receptor C-type 1 ( Mrc1 ) and chitinase-like protein 3 ( Chil3 ) was quantified in mouse liver and spleen tissues using real-time quantitative PCR (RT-qPCR) assay. Proliferative lesions of the hepatocyte were observed in mouse liver tissues and the follicular structures of the mouse spleen white pulp were disrupted 21 days post-infection with A. cantonensis . Immunohistochemical staining showed that there were significant differences in the percentages of F4/80, CD86 and CD206 positive staining areas in the liver and spleen tissues among the four groups of mice ( F = 242.40, 197.14, 183.19, 157.65, 242.35 and 146.24; all P values &lt; 0.001), and the percentages of positive staining in the liver and spleen tissues of mice in the 14-day infection group [(4.45 &#xb1; 0.51)%, (3.74 &#xb1; 0.67)%, (8.32 &#xb1; 0.72)%, (16.56 &#xb1; 1.14)%, (11.62 &#xb1; 0.52)%, and (8.29 &#xb1; 0.72)%, respectively] and the 21-day infection group [(3.70 &#xb1; 0.11)%, (3.22 &#xb1; 0.43)%, (11.53 &#xb1; 1.03)%, (12.59 &#xb1; 1.05)%, (9.02 &#xb1; 0.83)%, and (11.67 &#xb1; 1.10)%, respectively] were higher than in the control group [(0.35 &#xb1; 0.16)%, (0.40 &#xb1; 0.02)%, (0.93 &#xb1; 0.05)%, (2.78 &#xb1; 0.26)%, (2.33 &#xb1; 0.20)%, and (1.85 &#xb1; 0.20)%, respectively] (all P values &lt; 0.05). Immunofluorescence staining showed significant differences in the positive rates of F4/80 co-localization with CD86 and CD206 in mouse liver and spleen tissues among the four groups ( F = 24.42, 25.28, 54.51 and 130.55; all P values &lt; 0.001). Flow cytometry detected significant differences in the proportions of CD86 + and CD206 + macrophages in mouse liver and spleen tissues among the four groups ( F = 67.98, 18.41, 29.77, 172.80; all P values &lt; 0.001), and the proportions of CD206 + macrophages in the liver and spleen of the 21-day infection group were significantly higher than those in the control group [(9.25 &#xb1; 2.55)% vs (3.83 &#xb1; 0.72)%, and (4.22 &#xb1; 0.56)% vs (0.47 &#xb1; 0.18)%, respectively] (both P values &lt; 0.05). In addition, RT-qPCR assay quantified significant differences in the relative mRNA expression of M1 macrophage markers ( IL-1&#x3b2; , TNF-&#x3b1; and Nos2 ) and M2 macrophage markers ( Arg1 , Chil3 and Mrc1 ) in mouse liver and spleen tissues among the four groups ( F = 41.30, 31.82, 199.33, 19.96, 62.01, 119.76, 23.67, 95.90, 72.27, 82.59, 123.41 and 29.75; all P values &lt; 0.05). A. cantonensis infection may cause progressive pathological damage in mouse liver and spleen tissues, accompanied by dynamic temporal changes in macrophage polarization. M1 macrophage polarization predominates at the early stage of A. cantonensis infection and shifts towards M2 polarization at the later stages, suggesting that M2 polarization may participate in immune regulation at late stages of A. cantonensis infection by suppressing excessive inflammatory responses and promoting tissue repair. &#xff3b;&#x6458;&#x8981;&#xff3d; &#x76ee;&#x7684; &#x89c2;&#x5bdf;&#x5e7f;&#x5dde;&#x7ba1;&#x5706;&#x7ebf;&#x866b;&#x611f;&#x67d3;&#x5c0f;&#x9f20;&#x6a21;&#x578b;&#x4e2d;&#x5c0f;&#x9f20;&#x809d;&#x813e;&#x7ec4;&#x7ec7;&#x75c5;&#x7406;&#x635f;&#x4f24;&#x53ca;&#x5de8;&#x566c;&#x7ec6;&#x80de;&#x6781;&#x5316;&#x7684;&#x65f6;&#x5e8f;&#x6027;&#x53d8;&#x5316;, &#x521d;&#x6b65;&#x63ed;&#x793a;&#x5e7f;&#x5dde;&#x7ba1;&#x5706;&#x7ebf;&#x866b;&#x611f;&#x67d3;&#x65e9;&#x671f;&#x5916;&#x5468;&#x514d;&#x75ab;&#x53cd;&#x5e94;&#x3002; &#x65b9;&#x6cd5; 40&#x53ea;6 ~ 8&#x5468;&#x9f84;&#x96cc;&#x6027;BALB/c&#x5c0f;&#x9f20;&#x968f;&#x673a;&#x5206;&#x4e3a;&#x5bf9;&#x7167;&#x7ec4;&#x53ca;&#x611f;&#x67d3;7&#x3001;14&#x3001;21 d&#x7ec4;, &#x6bcf;&#x7ec4;10&#x53ea;&#x3002;&#x5404;&#x611f;&#x67d3;&#x7ec4;&#x6bcf;&#x53ea;&#x5c0f;&#x9f20;&#x704c;&#x80c3;&#x611f;&#x67d3;30&#x6761;&#x5e7f;&#x5dde;&#x7ba1;&#x5706;&#x7ebf;&#x866b;&#x2162;&#x671f;&#x5e7c;&#x866b;, &#x4e8e;&#x611f;&#x67d3;7&#x3001;14&#x3001;21 d&#x5404;&#x968f;&#x673a;&#x9009;&#x53d6;5&#x53ea;&#x5c0f;&#x9f20;; &#x5bf9;&#x7167;&#x7ec4;&#x4ee5;&#x7b49;&#x91cf;&#x751f;&#x7406;&#x76d0;&#x6c34;&#x704c;&#x80c3;, &#x4e8e;&#x704c;&#x80c3;&#x5f53;&#x5929;&#x968f;&#x673a;&#x9009;&#x53d6;5&#x53ea;&#x5c0f;&#x9f20;&#x3002;&#x6536;&#x96c6;&#x5404;&#x7ec4;&#x6240;&#x9009;&#x53d6;&#x5c0f;&#x9f20;&#x7684;&#x809d;&#x3001;&#x813e;&#x810f;&#x7ec4;&#x7ec7;, &#x91c7;&#x7528;&#x82cf;&#x6728;&#x7d20;-&#x4f0a;&#x7ea2; (hematoxylin and eosin, HE) &#x67d3;&#x8272;&#x89c2;&#x5bdf;&#x7ec4;&#x7ec7;&#x75c5;&#x7406;&#x635f;&#x4f24;&#x53d8;&#x5316;, &#x9 82;&#x3002;.", "keywords": ["Animals", "Female", "Spleen", "Liver", "Macrophages", "Mice, Inbred BALB C", "Strongylida Infections", "Mice", "Angiostrongylus cantonensis", "Nitric Oxide Synthase Type II"], "year": "2026", "doi": "10.16250/j.32.1915.2025228"}, {"pmid": "42151980", "title": "Innovations in liver disease assessment: clinical insights from spleen stiffness measurement in chronic liver diseases.", "abstract": "Chronic liver diseases are a major global health burden, with cirrhosis and portal hypertension driving morbidity and mortality. Non-invasive assessment of portal hypertension is critical for risk stratification and clinical decision-making. Spleen stiffness measurement (SSM) has emerged as a novel elastography-based biomarker reflecting the hemodynamic consequences of portal hypertension. This review summarizes current evidence on SSM across major chronic liver disease etiologies, including viral hepatitis, metabolic-associated fatty liver disease, and autoimmune liver diseases. We outline the principles and technical evolution of SSM across elastography platforms, including transient elastography, shear-wave elastography, and magnetic resonance elastography. Emerging data indicate that SSM provides incremental value beyond established non-invasive markers such as liver stiffness measurement and platelet count, particularly in refining risk stratification for clinically significant portal hypertension and high-risk varices. SSM may reduce unnecessary endoscopic screening and improve patient selection for therapeutic interventions. This review is based on a structured literature search of PubMed and Web of Science. SSM is a promising non-invasive biomarker with increasing translational relevance in the management of chronic liver diseases. With further standardization and prospective validation, SSM has the potential to support precision risk stratification and guide individualized clinical decision-making.", "keywords": [], "year": "2026", "doi": "10.1186/s12967-026-08244-5"}, {"pmid": "42129788", "title": "Phosphoproteomic analysis reveals differential associations between liver-spleen disharmony and qi-blood deficiency syndromes in chronic fatigue syndrome.", "abstract": "Chronic fatigue syndrome (CFS) is a debilitating disorder characterized by persistent fatigue that is not alleviated by rest and is often accompanied by multiple somatic symptoms. The etiology of CFS remains poorly understood, and conventional Western medicine offers limited effective targeted therapies. In contrast, Traditional Chinese Medicine (TCM), which utilizes pattern differentiation-particularly the Liver-Spleen Disharmony Pattern (LSDP) and the Qi-Blood Deficiency Pattern (QBDP)-has demonstrated clinical efficacy in managing CFS. However, the molecular mechanisms underpinning TCM pattern classification in CFS remain largely unexplored. A total of 30 participants were enrolled in this study, including 10 CFS patients with LSDP, 10 CFS patients with QBDP, and 10 age- and sex-matched healthy controls (HC). Serum phosphoproteomic profiling was conducted using liquid chromatography-tandem mass spectrometry (LC-MS/MS), which incorporated data-dependent acquisition (DDA) for spectral library construction and data-independent acquisition (DIA) for label-free quantification. Differentially phosphorylated sites (DPSs) and proteins (DPPs) were identified with thresholds of absolute fold change (|FC|)&#x2009;&#x2265;&#x2009;1.2 and a Benjamini-Hochberg (BH)-corrected false discovery rate (FDR)&#x2009;&lt;&#x2009;0.05. Principal component analysis (PCA) was employed to assess global differences in phosphorylation profiles across groups, and functional enrichment analyses were performed to elucidate the biological functions of differential molecules. PCA revealed distinct clustering of phosphoproteomic profiles among the three groups, with high consistency across biological replicates (PC1 explained 19.3% of the total variance, and PC2 explained 15.9%). A total of 849 non-redundant DPSs and 586 non-redundant DPPs were identified across the three pairwise comparisons. The HC vs. LSDP comparison yielded the highest number of differential molecules (406 DPSs and 351 DPPs), with a balanced distribution of upregulated and downregulated events. In contrast, the HC vs. QBDP comparison was dominated by phosphorylation upregulation (61.2% of DPSs), while the QBDP vs. LSDP comparison showed a higher proportion of downregulated DPSs (56.7%). Functional enrichment analysis indicated that upregulated DPPs in the HC vs. LSDP comparison were primarily involved in MAPK signaling and cytoskeletal remodeling, while downregulated DPPs were enriched in pathways associated with neurodegenerative diseases and nucleocytoplasmic transport. Notably, we identified a candidate differential phosphorylation site, DENND3 S472 (S472@DENND3_HUMAN), with moderate discriminatory power (raw p&#x2009;=&#x2009;0.042, BH-corrected FDR&#x2009;&lt;&#x2009;0.05, AUC&#x2009;=&#x2009;0.72). This exploratory study identified significant differences in serum phosphoproteomic profiles between CFS patients with LSDP and QBDP. The distinct phosphoproteomic signatures observed in LSDP and QBDP provide preliminary molecular evidence supporting TCM pattern differentiation in CFS. These findings enhance the understanding of CFS pathogenesis and lay the groundwork for precision-based TCM diagnosis and individualized therapeutic strategies for CFS.", "keywords": ["Humans", "Fatigue Syndrome, Chronic", "Proteomics", "Male", "Female", "Phosphoproteins", "Adult", "Liver", "Spleen", "Phosphorylation", "Middle Aged", "Case-Control Studies"], "year": "2026", "doi": "10.1186/s12967-026-08157-3"}, {"pmid": "42069604", "title": "Myeloperoxidase regulates hypoxia-induced inflammation and oxidative stress in liver-spleen axis.", "abstract": "High-altitude hypobaric hypoxia induces inflammation and oxidative stress, yet the role of myeloperoxidase (MPO) in this pathology remains incompletely understood. This study aimed to investigate whether MPO mediates injury to the liverspleen axis under hypoxic conditions. Using a 3day murine hypoxia model, we unexpectedly found that MPO deficiency exacerbated, rather than mitigated, damage to the liverspleen axis. Compared with hypoxic wildtype mice, MPO -/- mice displayed aggravated histopathological injury, accompanied by excessive phagocyte recruitment and elevated expression of key chemokines (KC, MCP1, MIP2) and proinflammatory mediators (TNF&#x3b1;, IL1&#x3b2;, IL17A). At the molecular level, MPO absence increased splenic protein expression of NF&#x3ba;B, NLRP3, and iNOS, while dysregulating the antioxidant response via the NRF2/HO1 pathway. These results reveal a novel protective role for MPO during hypoxic stress, where it functions to moderate the innate immune response and limit collateral tissue damage in the liverspleen axis. The study provides new insights into the complex immunomodulatory functions of MPO and suggests its activity is essential for maintaining immune homeostasis during acute hypoxia.", "keywords": [], "year": "2026", "doi": "10.1186/s12950-026-00503-y"}], "pubmed_query": "(\"liver\"[Title] OR \"hepatic\"[Title] OR \"hepatocyte\"[Title] OR \"hepatocellular\"[Title] OR \"nonalcoholic fatty liver\"[Title] OR \"NAFLD\"[Title] OR \"NASH\"[Title]) AND (\"spleen\"[Title] OR \"splenic\"[Title] OR \"splenomegaly\"[Title] OR \"lymphoid organ\"[Title] OR \"immune organ\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Muscle__Pancreas", "source": "Muscle", "target": "Pancreas", "color": "#64748b", "description": "Type: Hormonal : 11, "free fatty acids": 5, "prostaglandin": 1, "arginine": 3, "pyruvate": 10, "nefa": 2, "free fatty acid": 6, "amino acid": 7, "malate": 1, "creatinine": 1, "lipoprotein": 5, "ceramide": 1, "glycerol": 29, "triglycerides": 4, "ffa": 10, "acetate": 3, "creatine": 2, "triglyceride": 3, "fatty acids": 21, "fructose": 4, "nadh": 5, "glucose-6-phosphate": 7, "adp": 13, "glutamine": 3, "nadph": 1, "serine": 15, "alanine": 3}, "key_players_counts_hormones": {"thyroid hormone": 2, "tnf": 15, "testosterone": 4, "natriuretic peptide": 1, "il-1beta": 2, "interleukin-1": 1, "glucagon": 20, "igf-1": 4, "osteocalcin": 3, "tnf-alpha": 1, "growth hormone": 1, "thyroid hormones": 2, "il6": 2, "estrone": 1, "noradrenaline": 1, "estrogen": 1, "adiponectin": 2, "insulin": 932, "t3": 1, "vitamin d": 12, "adrenaline": 2, "tumor necrosis factor": 8, "irisin": 12, "epinephrine": 5, "leptin": 5, "glp-1": 12, "il-6": 27, "prolactin": 1, "somatostatin": 2, "amylin": 5, "interleukin-6": 7}, "key_players_counts_proteins": {"irs2": 1, "ucp1": 1, "mapk": 1, "hk2": 3, "jnk": 6, "pi3k": 2, "foxo1": 4, "mtorc1": 4, "p38": 1, "ucp2": 5, "glut4": 22, "fas": 4, "irs-2": 5, "tfam": 3, "sglt2": 4, "glut1": 3, "glp-1 receptor": 2, "insulin receptor": 29, "pfk": 1, "akt": 34, "irs-1": 19, "cox-2": 2, "irs1": 1, "erk1": 4, "ampk": 23, "acc": 5, "hexokinase": 2, "pgc-1alpha": 6, "mtor": 7, "pkm2": 19, "erk2": 4, "atgl": 1}, "notes": "Insulin form Pancreas directly influences glucose uptake by GLUT4.", "sources": ["doi: 10.4331/wjbc.v11.i3.76.", "doi: 10.1074/jbc.REV119.008351"], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42325217", "title": "Computed Tomography-Based Assessment of Sarcopenia and Disease Progression in Pancreatic Ductal Adenocarcinoma: A Radiomics and Machine Learning Approach.", "abstract": "Sarcopenia is a known negative prognostic factor in oncology and is frequently observed in patients with pancreatic ductal adenocarcinoma (PDAC). Computed tomography (CT) enables longitudinal muscle assessment and may provide additional prognostic information. This study aims to assess their association with prognosis in pancreatic cancer and explore the diagnostic and prognostic value of CT radiomics. A retrospective single-center study included 62 patients with primary PDAC who underwent at least three abdominal CT scans: baseline (t0), 3 months (t1), 6 months (t2), and, in 35 patients, 12 months (t3). CT-based sarcopenia was assessed using the psoas muscle index (PMI) based on reference cutoffs and cohort-specific sex-specific quartiles. Skeletal muscles at the L3 level were semi-automatically segmented. Radiomic features of the psoas were extracted and analyzed using k-nearest neighbor, decision tree, and random forest models. Prognostic relevance was evaluated using logistic regression and feature selection via least absolute shrinkage and selection operator (LASSO) regression. Tumor progression was assessed radiologically according to RECIST 1.1 criteria. CT-based sarcopenia prevalence was 45.3% using reference-based PMI thresholds. PMI declined significantly from baseline to t1 and remained stable thereafter, with women exhibiting consistently lower values. Outcome analysis showed a higher proportion of disease progression at t1 in sarcopenic patients using reference cutoffs, whereas cohort-specific quartiles demonstrated no consistent differences. Random forest models predicted sarcopenia with up to 0.73 accuracy and receiver operating characteristics area under the curve (ROC-AUC) of 0.81. LASSO regression identified the psoas short axis and cross-sectional area as the most informative features. Logistic regression using baseline radiomic features predicted disease progression status at 12 months with 0.85 accuracy, weighted F 1 0.841, and AUC 0.823. Interobserver agreement for psoas measurements was high (r = 0.86). Longitudinal CT-based assessment of PMI demonstrates progressive sarcopenia within the studied PDAC cohort, with sex-specific declines. Radiomic analysis of skeletal muscle provides complementary information and predictive insights, highlighting their potential to enhance the characterization of muscle status and its association with disease course in patients able to undergo repeated imaging.", "keywords": [], "year": "2026", "doi": "10.14740/gr2132"}, {"pmid": "42103970", "title": "Impact of preoperative skeletal muscle mass on the healing time of postoperative pancreatic fistula after pancreaticoduodenectomy.", "abstract": "Postoperative pancreatic fistula (POPF) is a serious complication following pancreaticoduodenectomy (PD). While numerous studies have investigated POPF incidence and risk factors, few have focused on POPF healing time (POPF-HT). Skeletal muscle mass has been increasingly recognized as an endocrine organ involved in interorgan communication. The aim of this study was to evaluate how skeletal muscle mass influenced the healing time of POPF after PD. This investigation included patients who developed POPF of grade B-C after PD with pancreaticojejunostomy during the study period. POPF-HT was defined as the duration from the date of PD to the removal of all drains placed for POPF treatment. Skeletal muscle mass was assessed based on preoperative computed tomography images. Clinical factors associated with POPF-HT were analyzed, including skeletal muscle index (SMI). The mean POPF-HT was 40&#x2009;&#xb1;&#x2009;15 days (median: 37 days; range: 21-105 days). Compared to those with high SMI, patients with low SMI had a significantly longer POPF-HT (46&#x2009;&#xb1;&#x2009;18 days vs. 37&#x2009;&#xb1;&#x2009;11 days, p&#x2009;=&#x2009;0.0101). In univariate analysis, low SMI was significantly associated with prolonged POPF-HT (hazard ratio: 0.5655, 95% confidence interval: 0.3687-0.8673, p&#x2009;=&#x2009;0.0090). Kaplan-Meier curves confirmed that patients with low SMI exhibited significantly delayed cumulative POPF healing (p&#x2009;=&#x2009;0.0065). Decreased skeletal muscle mass is significantly associated with prolonged POPF-HT after PD. Therefore, preoperative SMI may serve as a potentially modifiable factor associated with POPF-HT.", "keywords": [], "year": "2026", "doi": "10.1007/s00423-026-04029-y"}, {"pmid": "42084250", "title": "Serum Biomarkers and CT-Derived Muscle Indices in Sarcopenia Associated with Pancreatic Neoplasm: A Comparative Clinical Study.", "abstract": "Background: Sarcopenia is a frequent and clinically relevant condition in patients with pancreatic neoplasm, contributing to poor prognosis, reduced therapeutic tolerance, and increased mortality. The identification of reliable circulating biomarkers, alongside imaging-based muscle assessment, may improve early detection and risk stratification. Methods: This randomized prospective study included 61 patients, of whom 36 had pancreatic neoplasm associated with sarcopenia and 25 served as controls. Serum levels of osteonectin (SPARC), C-terminal agrin fragment (CAF), procollagen type III N-terminal peptide (P3NP), myostatin (MSTN), and insulin-like growth factor-1 (IGF-1) were measured using ELISA. Skeletal muscle index (SMI) and psoas muscle index (PMI) were assessed using CT at the L3 level. Results: Patients with pancreatic neoplasm and sarcopenia showed significantly altered biomarker profiles compared to controls. Osteonectin (median 936.4 vs. 539.9, p 0.001), CAF (2135.9 vs. 1165.5, p 0.001), P3NP (8.01 vs. 5.34, p 0.001), myostatin (47.71 vs. 7.85, p 0.001), and IGF-1 (142 vs. 106.7, p 0.001) were all elevated. The highest biomarker levels were consistently observed in the pancreatic neoplasm group compared to other disease groups. Additionally, 100% of patients with pancreatic neoplasm exhibited reduced SMI, confirming the high prevalence of sarcopenia. Biomarker levels were not significantly influenced by tumor location. Conclusions: The combined use of circulating biomarkers and CT-derived muscle indices provides a clinically relevant approach for identifying sarcopenia in pancreatic cancer.", "keywords": ["Humans", "Sarcopenia", "Biomarkers", "Female", "Male", "Pancreatic Neoplasms", "Prospective Studies", "Osteonectin", "Procollagen", "Aged", "Tomography, X-Ray Computed", "Myostatin", "Insulin-Like Growth Factor I", "Middle Aged", "Peptide Fragments", "Predictive Value of Tests", "Prognosis"], "year": "2026", "doi": "10.21614/chirurgia.3291"}, {"pmid": "42039130", "title": "Effects of polycystic ovary syndrome on liver, heart, muscle, and pancreatic-related diseases.", "abstract": "PCOS is far more than an ovarian disorder; it is a systemic metabolic crisis affecting 11-13% of women. This review maps its extra-ovarian reach into the liver, heart, muscle, and pancreas. We analyzed how the \"pathophysiological quartet\"-insulin resistance, hyperandrogenism, inflammation, and oxidative stress-coordinates systemic damage. PCOS prevalence skyrockets to 28.3% in women with obesity. Key findings include a 51.61% prevalence of MASLD in obese patients and a 2-4 fold increase in cardiovascular and type 2 diabetes risk. These manifestations are rooted in a shared metabolic \"soil,\" creating a vicious cycle of androgen excess and multi-organ dysfunction, including sarcopenia and &#x3b2;-cell exhaustion. Fragmented care is insufficient. The systemic nature of PCOS demands a paradigm shift toward integrated, multidisciplinary management, treating the patient as a metabolic whole.", "keywords": ["Humans", "Female", "Polycystic Ovary Syndrome", "Pancreatic Diseases", "Insulin Resistance", "Liver Diseases", "Animals", "Muscular Diseases", "Obesity"], "year": "2026", "doi": "10.3389/fendo.2026.1776584"}, {"pmid": "41808999", "title": "Pancreatic cancer-associated organ dysfunction promotes muscle autophagy and contributes to peripheral tissue wasting.", "abstract": "Normal pancreas function supports both digestion and the hormonal regulation of whole-body metabolism. We find pancreatic ductal adenocarcinoma (PDAC) disrupts the normal function of the remaining pancreas, leading to altered systemic metabolism and peripheral tissue wasting that begins early in disease progression. Using mouse models of PDAC, we find small pancreas tumors lead to both endocrine and exocrine pancreatic dysfunction that results in systemic nutrient depletion and loss of both muscle and fat tissue. Providing free glucose in the diet that is absorbed despite pancreatic exocrine dysfunction causes hyperglycemia and blunts fat wasting without affecting muscle loss. Muscle mass can be restored by free dietary amino acids or pancreatic enzyme supplementation. Exocrine dysfunction causing reduced dietary protein digestion promotes muscle proteolysis and autophagy. Autophagy is a major driver of muscle wasting in PDAC, as muscle-specific deletion of the core autophagy gene Atg7 also reduces muscle wasting. Disrupting muscle autophagy without restoring systemic nutrition slows tumor growth and improves survival of mice with PDAC. Tracing the fate of amino acids released from muscle of mice with PDAC shows redistribution to both tumor and host tissues. Notably, improving nutrition in mice with disrupted muscle autophagy promotes tumor growth. Together, the data argue that early peripheral tissue wasting associated with early pancreatic cancer is driven by altered normal pancreatic organ function that leads to reduced nutrition and enhanced muscle autophagy, releasing nutrients to support both tumor and host metabolism.", "keywords": [], "year": "2026", "doi": "10.64898/2026.02.27.708635"}], "pubmed_query": "(\"skeletal muscle\"[Title] OR \"muscle\"[Title] OR \"myocyte\"[Title] OR \"myofiber\"[Title] OR \"sarcopenia\"[Title] OR \"muscular\"[Title]) AND (\"pancreas\"[Title] OR \"pancreatic\"[Title] OR \"islet\"[Title] OR \"beta cell\"[Title] OR \"beta-cell\"[Title] OR \"insulin secretion\"[Title] OR \"exocrine pancreas\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abst
