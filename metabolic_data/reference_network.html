nsity lipoprotein cholesterol, the insulin resistance index, the insulin sensitivity index, glucagon, and insulin levels. BBR decreased levels of hypothalamic Orexin-A, the OX2R receptor, the corticotropin-releasing hormone, the pituitary and the plasma adrenocorticotropic hormone, as well as serum and urine corticosterone. At the same time, BBR increased mRNA and protein expressions of GLUT4 in skeletal muscles of model rats as well. Those results suggested that BBR can exert inhibition on the HPA-axis and increased skeletal muscle expression of GLUT4 proteins, which may be one of the important mechanisms in BBR to improve IR and regulating glucose and lipid metabolism in T2DM rats.", "keywords": [], "year": "2019", "doi": "10.2147/DMSO.S211188"}, {"pmid": "22084407", "title": "Central nervous system inflammation induces muscle atrophy via activation of the hypothalamic-pituitary-adrenal axis.", "abstract": "Skeletal muscle catabolism is a co-morbidity of many chronic diseases and is the result of systemic inflammation. Although direct inflammatory cytokine action on muscle promotes atrophy, nonmuscle sites of action for inflammatory mediators are less well described. We demonstrate that central nervous system (CNS)-delimited interleukin 1&#x3b2; (IL-1&#x3b2;) signaling alone can evoke a catabolic program in muscle, rapidly inducing atrophy. This effect is dependent on hypothalamic-pituitary-adrenal (HPA) axis activation, as CNS IL-1&#x3b2;-induced atrophy is abrogated by adrenalectomy. Furthermore, we identified a glucocorticoid-responsive gene expression pattern conserved in models of acute and chronic inflammatory muscle atrophy. In contrast with studies suggesting that the direct action of inflammatory cytokines on muscle is sufficient to induce catabolism, adrenalectomy also blocks the atrophy program in response to systemic inflammation, demonstrating that glucocorticoids are requisite for this process. Additionally, circulating levels of glucocorticoids equivalent to those produced under inflammatory conditions are sufficient to cause profound muscle wasting. Together, these data suggest that a significant component of inflammation-induced muscle catabolism occurs indirectly via a relay in the CNS.", "keywords": ["Adrenalectomy", "Analysis of Variance", "Animals", "Blotting, Western", "Central Nervous System", "Corticosterone", "Enzyme-Linked Immunosorbent Assay", "Gene Expression Profiling", "Glucocorticoids", "Humans", "Hypothalamo-Hypophyseal System", "Immunohistochemistry", "In Situ Hybridization", "Inflammation", "Interleukin-1beta", "Mice", "Mice, Inbred C57BL", "Microarray Analysis", "Muscle, Skeletal", "Muscular Atrophy", "Pituitary-Adrenal System", "Rats", "Rats, Sprague-Dawley", "Real-Time Polymerase Chain Reaction", "Signal Transduction"], "year": "2011", "doi": "10.1084/jem.20111020"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"skeletal muscle\"[Title] OR \"muscle\"[Title] OR \"myocyte\"[Title] OR \"myofiber\"[Title] OR \"sarcopenia\"[Title] OR \"muscular\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__Pancreas", "source": "Adrenal Glands", "target": "Pancreas", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: Cortisol, insulin\nNotes: Cortisol lowers insulin production in the pancreas.\nSources:\n- DOI: 10.5772/intechopen.1003161", "connection_type": "Hormonal connection", "key_players": ["Cortisol", "insulin"], "key_players_metabolites": ["Cortisol", "insulin", "glucose", "arginine", "amino acid", "fatty acids", "amp", "glutamate", "alanine", "glycogen", "beta-hydroxybutyrate", "amino acids", "lactate", "free fatty acids", "serine"], "key_players_hormones": ["Cortisol", "insulin", "acth", "glucagon", "growth hormone", "glucocorticoid", "somatostatin", "aldosterone", "vasopressin", "corticosterone", "pyy", "thyroxine", "gastrin", "testosterone", "renin", "noradrenaline", "epinephrine", "motilin"], "key_players_proteins": ["Cortisol", "insulin", "acc"], "key_players_counts_metabolites": {"amp": 2, "glycogen": 1, "beta-hydroxybutyrate": 1, "amino acids": 1, "glucose": 49, "glutamate": 2, "lactate": 1, "free fatty acids": 1, "arginine": 4, "amino acid": 3, "fatty acids": 3, "serine": 1, "alanine": 2}, "key_players_counts_hormones": {"testosterone": 1, "glucocorticoid": 7, "pyy": 2, "thyroxine": 2, "gastrin": 2, "aldosterone": 3, "glucagon": 9, "acth": 19, "cortisol": 7, "growth hormone": 8, "renin": 1, "noradrenaline": 1, "insulin": 41, "epinephrine": 1, "vasopressin": 3, "motilin": 1, "corticosterone": 3, "somatostatin": 6}, "key_players_counts_proteins": {"acc": 2}, "notes": "Cortisol lowers insulin production in the pancreas.", "sources": ["DOI: 10.5772/intechopen.1003161"], "ai_description": "", "pubmed_n": 34, "pubmed_papers": [{"pmid": "41965599", "title": "Pancreatic fat deposition as a mediator of adrenal gland volume and type 2 diabetes: evidence from MRI.", "abstract": "PURPOSE: To assess the role of body composition mediating the association between MRI-quantified adrenal gland volume (AGV) and type 2 diabetes mellitus (T2DM) and to clarify the underlying mechanisms involved. METHODS: This retrospective study analyzed 239 hospitalized patients (54 T2DM, 185 non-T2DM) with abdominal MRI. AGV was manually segmented on T1-weighted images. Body composition parameters, including subcutaneous adipose tissue (SAT) area and fat fraction (FF), visceral adipose tissue (VAT) area and FF, hepatic FF (HFF), pancreatic FF (PFF), and abdominal muscle (AM) area and FF, were quantified using MRI fat fraction mapping. RESULTS: After adjusting for age, sex, hypertension, and BMI, mediation analysis showed that PFF partially mediated the association between AGV and T2DM (OR&#x2009;=&#x2009;1.036, 95% CI: 1.009&#x2013;1.101), accounting for 8.7% of the total effect. Multivariate analysis identified both AGV (OR: 1.475, 95% CI: 1.235&#x2013;1.762) and PFF (OR: 1.069, 95% CI: 1.023&#x2013;1.116) as independent factors associated with T2DM. ROC analysis showed AUCs of 0.792 for AGV and 0.803 for PFF in differentiating T2DM. The combined AGV&#x2009;+&#x2009;PFF model achieved an AUC of 0.836 (95% CI: 0.779&#x2013;0.894). CONCLUSION: MRI-quantified AGV and PFF demonstrate potential as biomarkers for T2DM. Pancreatic fat deposition partially mediates the link between adrenal enlargement and T2DM, suggesting a novel pathway involving HPA axis dysregulation and ectopic fat deposition.", "keywords": [], "year": "2026", "doi": "10.1186/s12880-026-02184-8"}, {"pmid": "41085519", "title": "Simultaneous adrenal gland and pancreas-kidney transplantation and associated hormonal challenges.", "abstract": "Adrenal gland transplantation has only been performed in rare cases, with variable results in terms of functional activity. Consequently, there is a lack of evidence in endocrine management and tapering hormone replacement therapy after such transplantations. We report on a simultaneous pancreas-kidney and adrenal gland allotransplantation in a 48-year-old female patient with type 1 diabetes and severe autoimmune adrenal insufficiency. Surgery was uneventful, without major surgical morbidity. Pancreas and kidney graft function were excellent from the beginning. Adrenal graft function was difficult to assess and steroid tapering was not well tolerated and hampered clinical recovery. Despite the evidence of adequate graft perfusion and initially even measurable levels of cortisol production, persistent adrenal graft function was not obtained, and the patient remained on hormone replacement therapy. Simultaneous pancreas-kidney and adrenal gland transplantation is technically safe, without the need for major surgical modifications or adjustments in immunosuppression. However, it should only be performed in combination with a kidney or pancreas-kidney transplant, which justifies the lifelong immunosuppression. The major challenge remains the postoperative endocrine management, with steroid tapering and adequate assessment of adrenal graft function. Patients should be followed by an interdisciplinary team involving endocrinologists, nephrologists and transplant surgeons.", "keywords": ["Humans", "Kidney Transplantation", "Female", "Pancreas Transplantation", "Middle Aged", "Adrenal Glands", "Diabetes Mellitus, Type 1", "Adrenal Insufficiency", "Hydrocortisone"], "year": "2025", "doi": "10.57187/s.4382"}, {"pmid": "38972929", "title": "Robotic Left Pancreatectomy with Perirenal Tissue Excision and Left Adrenalectomy (Posterior Ramps) for Pancreatic Ductal Adenocarcinoma Abutting the Adrenal Gland.", "abstract": "Radical antegrade modular pancreato-splenectomy (RAMPS) has been largely described in left-sided pancreatic cancers.1.J Hepato-Biliary-Pancreat Sci 29:1156-1165 Its prognostic advantage is not clear, although a theoretical improvement in R0 resection rate has been shown.2.J Am Coll Surg 204:244-249 Furthermore, RAMPS is usually carried out without adrenal gland removal, the so-called anterior RAMPS, while extending the resection to the adrenal plane could impair perioperative outcomes.3.HPB 25:311-319 METHODS: A 40&#xa0;mm pancreatic ductal adenocarcinoma (PDAC) was found in a 70-year-old patient. Tumor infiltrates the adrenal gland and a robotic posterior RAMPS was indicated. After sectioning the splenic vessels and the pancreatic neck, the dissection was directed vertically in a sagittal plane along the left border of the superior mesenteric artery to identify the left renal vein. Our dissection plane was then directed on a caudo-cranial axis, after identification of the left renal artery and below the adrenal gland. The resection was also delimitated medially by the left borders of the superior mesenteric artery and the aorta, and posteriorly by the renal parenchyma. Postoperative course was marked by a biochemical leak. The patient was discharged on postoperative day (POD)&#xa0;5 and the drain removed at POD&#xa0;18. Pathological examination confirmed a pT2N2 PDAC with negative margins, with 4/18 positive nodes. The robotic platform is routinely employed in pancreatic surgery. Thanks to its increased degree of movement, its dexterity, and the magnification, this approach can help surgeons with vascular identification and control, in performing extended lymphadenectomies, and finding the correct planes of dissection. All these elements are crucial in a well-performed posterior RAMPS.", "keywords": ["Aged", "Humans", "Adrenal Gland Neoplasms", "Adrenal Glands", "Adrenalectomy", "Carcinoma, Pancreatic Ductal", "Pancreatectomy", "Pancreatic Neoplasms", "Prognosis", "Robotic Surgical Procedures", "Splenectomy"], "year": "2024", "doi": "10.1245/s10434-024-15414-6"}, {"pmid": "38721167", "title": "A Case Report of Bilateral Adrenal Gland Stereotactic Body Radiotherapy to Manage Hypercortisolemia in a Patient With Ectopic Adrenocorticotropic Hormone (ACTH) Production From a Metastatic Pancreatic Neuroendocrine Tumor.", "abstract": "A 63-year-old woman presented with hypokalemia, hypertension, weight gain, limb edema, and tremors. She was diagnosed with Cushing syndrome, with a 24-hour urine cortisol level of 41,013 nmol/day. Investigations revealed a grade 2 pancreatic neuroendocrine tumor with extensive hepatic metastases. Owing to excessive adrenocorticotropic hormone production from her disease, her hypercortisolemia and Cushing symptoms worsened despite ketoconazole, somatostatin analogs, and right liver lobe chemoembolization. Stereotactic body radiotherapy (SBRT) at a dose of 39 Gy in three fractions was administered to her bilateral adrenal glands in the hope of reducing her cortisol levels and improving her symptoms. Her 24-hour urine cortisol levels decreased following SBRT, but not rapidly enough; her clinical condition continued to deteriorate, and she died 21 days after treatment. SBRT was not effective as an urgent intervention in this setting; a greater latency to realize a response is likely necessary.", "keywords": [], "year": "2024", "doi": "10.7759/cureus.57852"}, {"pmid": "38471570", "title": "The Adrenal Gland and Pancreatic Islets - A Beneficial Endocrine Alliance.", "abstract": "Intraportal islet transplantation in patients with type 1 diabetes enables restoration of glucose-regulated insulin secretion. However, several factors hamper a widespread application and long-term success: chronic hypoxia, an inappropriate microenvironment and suppression of regenerative and proliferative potential by high local levels of immunosuppressive agents. Therefore, the identification of alternative and superior transplant sites is of major scientific and clinical interest. Here, we aim to evaluate the adrenal as an alternative transplantation site. The adrenal features a particular microenvironment with extensive vascularization, anti-apoptotic and pro-proliferative, anti-inflammatory and immunosuppressive effects. To validate this novel transplantation site, an in vitro co-culture system of adrenal cells and pancreatic islets was established and viability, islet survival, functional potency and antioxidative defense capacity were evaluated. For in vivo validation, an immune-deficient diabetic mouse model for intra-adrenal islet transplantation was applied. The functional capacity of intra-adrenally grafted islets to reverse diabetes was compared to a standard islet transplant model and measures of engraftment such as vascular integration were evaluated. The presence of adrenal cells positively impacted on cell metabolism and oxidative stress. Following transplantation, we could demonstrate enhanced islet function in comparison to standard models with improved engraftment and superior re-vascularization. This experimental approach allows for novel insights into the interaction of endocrine systems and may open up novel strategies for islet transplantation augmented through the bystander effect of other endocrine cells or the active factors secreted by adrenal cells modulating the microenvironment.", "keywords": ["Mice", "Animals", "Humans", "Islets of Langerhans", "Islets of Langerhans Transplantation", "Diabetes Mellitus, Type 1", "Adrenal Glands", "Insulin Secretion"], "year": "2024", "doi": "10.1055/a-2256-6344"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"pancreas\"[Title] OR \"pancreatic\"[Title] OR \"islet\"[Title] OR \"beta cell\"[Title] OR \"beta-cell\"[Title] OR \"insulin secretion\"[Title] OR \"exocrine pancreas\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__Small Intestine", "source": "Adrenal Glands", "target": "Small Intestine", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: Cortisol, insulin\nNotes: Cortisol potentially has an impact on metabolism in gut.\nSources:\n-  doi: 10.1016/j.lfs.2017.11.049.  “", "connection_type": "Hormonal connection", "key_players": ["Cortisol", "insulin"], "key_players_metabolites": ["Cortisol", "insulin", "amp", "glucose", "cholesterol", "alanine", "amino acids", "leucine", "lactate", "fatty acids", "methionine", "glycine", "isoleucine", "arginine", "butyrate"], "key_players_hormones": ["Cortisol", "insulin", "corticosterone", "acth", "glucocorticoid", "aldosterone", "crh", "neurotensin", "adrenaline", "dhea", "testosterone", "norepinephrine", "noradrenaline", "androstenedione", "epinephrine", "bnp", "natriuretic peptide", "vitamin d", "secretin"], "key_players_proteins": ["Cortisol", "insulin", "acc"], "key_players_counts_metabolites": {"methionine": 1, "cholesterol": 5, "glycine": 1, "amp": 7, "amino acids": 2, "glucose": 7, "isoleucine": 1, "leucine": 2, "lactate": 2, "arginine": 1, "butyrate": 1, "fatty acids": 2, "alanine": 5}, "key_players_counts_hormones": {"dhea": 2, "testosterone": 2, "bnp": 1, "natriuretic peptide": 1, "glucocorticoid": 22, "crh": 6, "aldosterone": 21, "acth": 35, "neurotensin": 3, "norepinephrine": 2, "cortisol": 26, "noradrenaline": 2, "androstenedione": 2, "vitamin d": 1, "adrenaline": 3, "secretin": 1, "epinephrine": 2, "corticosterone": 44}, "key_players_counts_proteins": {"acc": 8}, "notes": "Cortisol potentially has an impact on metabolism in gut.", "sources": ["doi: 10.1016/j.lfs.2017.11.049.  “"], "ai_description": "", "pubmed_n": 47, "pubmed_papers": [{"pmid": "42116487", "title": "Ready-to-use blueberry extract modulates the hypothalamic-pituitary-adrenal axis and alleviates post-stress anxiety linked to antibiotic-induced gut dysbiosis.", "abstract": "This study investigated, for the first time, the effects of crude blueberry extracts obtained using natural deep eutectic solvent (CE-NADES) or a conventional organic solvent (CE-SORG) on anxiety- and depression-related parameters in a rat model of intestinal dysbiosis induced by antibiotics. CE-NADES is a ready-to-use extract that does not require solvent removal prior to administration, while CE-SORG was reconstituted in water after solvent removal. Oral administration of blueberry extracts (10&#xa0;mg of phenolic compounds/kg b.w./day) for 11&#xa0;days showed that CE-NADES significantly reduced plasma adrenocorticotropic hormone (13.2% vs. control dysbiosis; p&#xa0;&lt;&#xa0;0.01) and corticosterone (22.5% vs. control dysbiosis; p&#xa0;&lt;&#xa0;0.0001) levels, and attenuated anxiety-like behavior after acute restraint stress in the elevated plus maze test (85.1% increased time in open arms and 10.4% decreased anxiety index vs. control dysbiosis; p&#xa0;&lt;&#xa0;0.005). In contrast, CE-SORG reduced only corticosterone levels (15% vs. control dysbiosis; p&#xa0;&lt;&#xa0;0.0001) and did not produce an anxiolytic behavioral effect. These results indicate that while both extracts modulated the hypothalamic-pituitary-adrenal (HPA) axis, CE-NADES was more effective than CE-SORG. Only CE-NADES mitigated post-stress anxiety associated with antibiotic-induced gut dysbiosis, supporting an anxiolytic effect for this ready-to-use extract. NADES solvent/delivery system was a key determinant of the anxiolytic efficacy of blueberry extract, associated with HPA axis modulation at both the pituitary and adrenal levels.", "keywords": ["Animals", "Blueberry Plants", "Dysbiosis", "Plant Extracts", "Anxiety", "Male", "Anti-Bacterial Agents", "Rats", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System", "Corticosterone", "Adrenocorticotropic Hormone", "Disease Models, Animal", "Gastrointestinal Microbiome", "Rats, Wistar", "Anti-Anxiety Agents"], "year": "2026", "doi": "10.1016/j.foodres.2026.119235"}, {"pmid": "41962594", "title": "Exposure to a high-fat diet compromises gut health, behavior, and HPA axis function, with partial reversal when limited to adolescence.", "abstract": "High-fat diet (HFD) consumption contributes to obesity, yet its impact on females of (pre)reproductive age and the effects of dietary modification after adolescence remain underexplored. This study examined how continuous HFD exposure or an adolescent switch from HFD to a standard diet (SD) shapes the gut microbiome, behavior, neurochemistry, metabolism, and key components of the hypothalamic-pituitary-adrenal (HPA) axis in female rats. Because HPA-axis alterations can occur across generations after HFD exposure, we examined reproductive-tissue HPA-axis components as potential mechanisms of transmission. Females received SD, HFD, or HFD followed by SD after majority of adolescence (postnatal day 60). HFD exposure impaired HPA-axis regulation and switching to SD during adolescence did not prevent persistent dysfunction into adulthood. However, reproductive HPA-axis components remained unaltered. Diet also strongly influenced the microbiome: while HFD disrupted microbial composition in adolescence, switching to SD partially restored it by adulthood. Behavioral and metabolic effects, including increased adiposity and anxiety-like behavior, emerged only with prolonged HFD exposure. Brain neurotransmitter concentrations remained largely unaffected. Overall, dietary history across adolescence and early adulthood shaped long-term HPA-axis function, microbiome composition, and behavioral outcomes. The absence of reproductive HPA-axis alterations suggests it is not a major mediator of maternal HFD-induced intergenerational effects. Persistent HPA-axis dysfunction despite dietary switching indicates limited reversibility, whereas the microbiome showed the greatest adaptive capacity. In contrast, lasting behavioral and metabolic consequences of HFD require continued exposure to adulthood.", "keywords": ["Animals", "Female", "Diet, High-Fat", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System", "Rats", "Gastrointestinal Microbiome", "Behavior, Animal", "Obesity", "Rats, Sprague-Dawley"], "year": "2026", "doi": "10.1016/j.brainresbull.2026.111883"}, {"pmid": "41651994", "title": "Sleep deprivation disrupts lacrimal gland homeostasis via hypothalamic-pituitary-adrenal axis and gut dysbiosis in mice.", "abstract": "Sleep deprivation (SD) disrupts systemic homeostasis, but how it drives ocular surface disease remains unclear. Using a male mouse SD model, we show that chronic SD activates the hypothalamic-pituitary-adrenal (HPA) axis, elevates corticosterone, alters gut microbiota, and depletes short-chain fatty acids (SCFAs). These alterations coincide with lacrimal gland atrophy, reduced tear secretion, and increased CD4&#x207a;/CD8&#x207a; T cell infiltration, accompanied by activation of IL-17-associated inflammatory pathways. Pharmacological inhibition of glucocorticoid synthesis with metyrapone preserves lacrimal gland structure and function while attenuating immune activation. Microbiome-directed interventions, including SCFA supplementation and fecal microbiota transplantation, rebalance gut communities, suppress pro-inflammatory T cell responses, and maintain lacrimal gland homeostasis. Transcriptomic and immunohistochemical analyses further reveal that all three interventions converge on the&#xa0;downregulation of IL-17 signaling. Collectively, these findings establish an HPA-gut microbiome-lacrimal gland axis that links neuroendocrine stress to microbial dysbiosis and ocular inflammation, and they suggest therapeutic strategies for SD-associated lacrimal gland dysfunction.", "keywords": ["Animals", "Lacrimal Apparatus", "Hypothalamo-Hypophyseal System", "Male", "Homeostasis", "Mice", "Pituitary-Adrenal System", "Sleep Deprivation", "Dysbiosis", "Gastrointestinal Microbiome", "Mice, Inbred C57BL", "Interleukin-17"], "year": "2026", "doi": "10.1038/s42003-026-09657-0"}, {"pmid": "41614720", "title": "A nonfunctional adrenal incidentaloma revealed by intestinal obstruction: metastatic adrenocortical carcinoma diagnosed by surgery.", "abstract": "This case report describes an 84-year-old male patient who presented with symptoms of intestinal obstruction and was subsequently diagnosed with metastatic adrenocortical carcinoma (ACC), a rare and aggressive endocrine malignancy. The patient arrived at the emergency department with abdominal pain, nausea, vomiting, and bloating. Imaging studies revealed a segmental ileal mass suggestive of obstruction and a large (12 &#xd7; 8 cm) adrenal mass. Hormonal assays indicated a nonfunctional adrenal incidentaloma. Due to persistent obstruction, the patient underwent surgical resection of the terminal ileum and a left adrenalectomy. Histopathological examination confirmed ACC with metastasis to the small intestine. This rare presentation is notable because ACC typically manifests with hormone excess or mass effect symptoms, and intestinal metastasis causing mechanical obstruction is exceedingly uncommon. Radiologically, the adrenal mass lacked classic features of ACC, contributing to initial diagnostic uncertainty. Postoperatively, the patient recovered uneventfully and was started on mitotane therapy after PET imaging confirmed residual disease and para-aortic lymph node metastasis. This report underscores the importance of thorough evaluation of large adrenal incidentalomas, even if nonfunctional, and highlights intestinal obstruction as a rare but possible initial presentation of metastatic ACC. It contributes to the limited literature documenting atypical clinical manifestations of this rare tumor. Adrenocortical carcinoma (ACC) is a rare and aggressive malignancy that is frequently diagnosed at an advanced or metastatic stage. Nonfunctional adrenal incidentalomas &#x2265;4 cm in size warrant comprehensive hormonal evaluation and imaging, followed by multidisciplinary assessment due to the potential risk of malignancy. In this case, despite benign-appearing radiological features, histopathological examination confirmed that the adrenal mass was a metastatic adrenocortical carcinoma. R0 resection remains the only potentially curative treatment for ACC; in selected cases, synchronous resection of metastatic lesions may be necessary. This case highlights a previously undocumented presentation of ACC manifesting as small bowel obstruction due to intestinal metastasis, thereby expanding the clinical spectrum of this rare entity.", "keywords": [], "year": "2026", "doi": "10.1530/EDM-25-0083"}, {"pmid": "41273001", "title": "Vitamin D3 Improves Hypothalamic-Pituitary-Adrenal Axis Function, Immunological Responses, and Gut Dysbiosis in Sleep Desynchrony.", "abstract": "Chronic sleep desynchrony proliferates in modern society, characterized by extended wakefulness and disrupted circadian rhythms over a long period, and is associated with various physiological and immune dysfunctions. This study investigated the health effects of long-term sleep desynchrony and subsequent vitamin D3 treatment, alongside sleep recovery, on biological factors in C57BL/6J mice by assessing their body weight, metabolic activity, stress response, immune function, and gut microbiota composition. Mice underwent 28 days of sleep desynchrony using a Lafayette chamber to model chronic disruption of the HPA axis, immune function, and gut microbiota. Sleep desynchrony did not significantly alter body weight, food intake, or water consumption, suggesting that metabolic homeostasis was preserved. However, stress hormone analysis revealed impaired HPA axis regulation in the sleep-desynchronized mice, as indicated by suppressed corticosterone levels after dexamethasone injection. Notably, vitamin D3 treatment restored the HPA axis function by enhancing corticosterone suppression. Behavioral tests of the mice indicated that sleep desynchrony reduced nest-building ability, locomotor activity, and anxiety-like behaviors, whereas vitamin D3 treatment improved their motor function. Furthermore, vitamin D3 treatment alleviated immune dysregulation by reducing neutrophil levels and increasing lymphocyte counts, suggesting a role in restoring immune balance after sleep desynchrony. Regarding gut microbiota composition, sleep desynchrony disrupted microbial diversity, reducing Bacteroidota and increasing Firmicutes, leading to dysbiosis. Vitamin D3 treatment shifted the microbiota composition toward eubiosis, aligning it closer to control-group levels. Additionally, sleep desynchrony impaired the expression of tight junction proteins in the proximal colon, compromising intestinal barrier integrity. Vitamin D3 treatment restored the levels of key tight junction proteins, such as ZO-1 and claudin, thereby maintaining gut barrier function. Vitamin D3 treatment serves as a promising intervention for mitigating the adverse health effects of chronic sleep desynchrony on the HPA axis, immune function, and gut microbiota, providing potential therapeutic benefits for preserving physiological homeostasis in the middle of a long-term sleep deficiency or chronic sleep deprivation.", "keywords": ["Animals", "Gastrointestinal Microbiome", "Mice", "Dysbiosis", "Cholecalciferol", "Male", "Mice, Inbred C57BL", "Pituitary-Adrenal System", "Hypothalamo-Hypophyseal System", "Corticosterone", "Sleep", "Circadian Rhythm", "Sleep Deprivation"], "year": "2025", "doi": "10.1002/brb3.71084"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"small intestine\"[Title] OR \"duodenum\"[Title] OR \"jejunum\"[Title] OR \"ileum\"[Title] OR \"intestinal\"[Title] OR \"gut\"[Title] OR \"enterocyte\"[Title] OR \"Peyer's patches\"[Title] OR \"gut-brain axis\"[Title] OR \"enteroendocrine\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__WAT", "source": "Adrenal Glands", "target": "WAT", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: Cortisol, insulin, adrenaline, noradrenaline\nNotes: \n- Cortisol lowers insulin production in the pancreas which will in turn lower insulin abundance and lead to less glucose uptake in WAT.\n- Cortisol drives lipolysis. Patients with a higher cortisol level (higher SUV in Adrenal Glands) will do more lipolysis and have less glucose uptake.\n- Adrenaline and noradrenaline lead to lipolysis in adipocytes and they supress the re-esterification of fatty acids .\nSources:\n-https://doi.org/10.1038/s42255-020-0217-6\n-DOI: 10.3181/00379727-99-24355", "connection_type": "Hormonal connection", "key_players": ["Cortisol", "insulin", "adrenaline", "noradrenaline"], "key_players_metabolites": ["Cortisol", "insulin", "adrenaline", "noradrenaline", "cholesterol", "isocitrate", "triglycerides", "amp", "glycogen", "citrate", "ldl", "atp", "hdl", "glucose", "vldl", "lipoprotein", "fatty acids"], "key_players_hormones": ["Cortisol", "insulin", "adrenaline", "noradrenaline", "aldosterone", "leptin", "thyroxine", "estradiol", "glucocorticoid", "acth", "mineralocorticoid", "norepinephrine", "epinephrine", "corticosterone"], "key_players_proteins": ["Cortisol", "insulin", "adrenaline", "noradrenaline", "hexokinase", "hormone-sensitive lipase"], "key_players_counts_metabolites": {"cholesterol": 4, "amp": 2, "glycogen": 2, "citrate": 2, "atp": 1, "hdl": 1, "glucose": 1, "isocitrate": 3, "ldl": 2, "vldl": 1, "lipoprotein": 1, "triglycerides": 3, "fatty acids": 1}, "key_players_counts_hormones": {"glucocorticoid": 3, "thyroxine": 10, "aldosterone": 11, "acth": 3, "mineralocorticoid": 1, "norepinephrine": 1, "cortisol": 20, "noradrenaline": 2, "insulin": 10, "adrenaline": 1, "epinephrine": 1, "leptin": 11, "corticosterone": 1, "estradiol": 4}, "key_players_counts_proteins": {"hormone-sensitive lipase": 2, "hexokinase": 3}, "notes": "- Cortisol lowers insulin production in the pancreas which will in turn lower insulin abundance and lead to less glucose uptake in WAT.\n- Cortisol drives lipolysis. Patients with a higher cortisol level (higher SUV in Adrenal Glands) will do more lipolysis and have less glucose uptake.\n- Adrenaline and noradrenaline lead to lipolysis in adipocytes and they supress the re-esterification of fatty acids .", "sources": ["https://doi.org/10.1038/s42255-020-0217-6", "DOI: 10.3181/00379727-99-24355"], "ai_description": "", "pubmed_n": 20, "pubmed_papers": [{"pmid": "38982517", "title": "Associations between adrenal gland volume and adipose tissue compartments - a whole body MRI study.", "abstract": "Obesity is associated with alterations in the hypothalamic-pituitary-adrenal (HPA) axis. Effects of glucocorticoids on adipose tissues appear to depend on the specific adipose depot, in which they take place. In this study, we aimed to investigate the role of MRI-based adrenal gland volume as an imaging marker in association with different adipose tissue compartments. The study cohort derives from the population-based research platform KORA (Cooperative Health Research in the Augsburg Region, Germany) MRI sub-study, a cross-sectional sub-study investigating the interactions between subclinical metabolic changes&#xa0;and cardiovascular disease in a study sample of 400 participants. Originally, eligible subjects underwent a whole-body MRI. MRI-based segmentations were performed manually and semi-automatically for adrenal gland volume, visceral adipose tissue (VAT), subcutaneous adipose tissue (SAT), epi- and pericardial fat and renal sinus fat. Hepatic and pancreatic lipid content were measured as pancreatic proton density fraction (PDFF) and MR-spectroscopic hepatic fat fraction (HFF). Multivariable linear regression analyses were performed. A number of 307 participants (56.2&#x2009;&#xb1;&#x2009;9.1&#xa0;years, 60.3% male, 14.3% with type 2 diabetes (T2DM), 30.6% with obesity, 34.2% with hypertension) were included. In multivariable analyses, strong positive associations between adrenal gland volume and VAT, total adipose tissue (TAT) as well as HFF persisted after extensive step-wise adjustment for possible metabolic confounders (VAT: beta&#x2009;=&#x2009;0.31, 95%-CI [0.71, 0.81], p&#x2009;&lt;&#x2009;0.001; TAT: beta&#x2009;=&#x2009;0.14, 95%-CI [0.06, 0.23], p&#x2009;&lt;&#x2009;0.001; HFF: beta&#x2009;=&#x2009;1.17, 95%-CI [1.04, 1.31], p&#x2009;=&#x2009;0.009). In contrast, associations between adrenal gland volume and SAT were attenuated in multivariate analysis after adjusting for BMI. Associations between pancreatic PDFF, epi- and pericardial fat and renal sinus fat were mediated to a great extent by VAT (pancreatic PDFF: 72%, epicardial adipose tissue: 100%, pericardial adipose tissue: 100%, renal sinus fat: 81.5%). Our results found MRI-based adrenal gland volume as a possible imaging biomarker of unfavorable adipose tissue distribution, irrespective of metabolic risk factors. Thus, adrenal gland volume may serve as a potential MRI-based biomarker of metabolic changes and contributes to an individual characterization of metabolic states and individual risk stratification. Future studies should elucidate in a longitudinal study design, if and how HPA axis activation may trigger unfavorable adipose tissue distribution and whether and to which extent this is involved in the pathogenesis of manifest metabolic syndrome.", "keywords": [], "year": "2024", "doi": "10.1186/s12986-024-00823-x"}, {"pmid": "36096484", "title": "Management of adreno-cortical adenomas using microwave ablation: study of the effects of the fat tissue.", "abstract": "Adrenocortical neoplasms are the main causes of secondary hypertension and related comorbidities including hypokalemia and cardiovascular diseases. Conventional techniques for the management of this condition are often invasive and not resolutive. Recent studies proposed microwave thermal ablation (MWA) to eradicate adrenocortical adenomas arising in proximity to sensitive structures. This study explores a new MWA approach to selectively direct the electromagnetic energy into the target and shield the surrounding tissues. The new solution relies on the anatomical and dielectric characteristics of the adrenal gland and the surrounding fat capsule. A 3&#x2009;D model of the adrenal gland is developed, and a cooled microwave applicator is placed parallel to the interface between the fat and adrenal tissue. Numerical simulations are conducted at 2.45&#x2009;GHz accounting for two energy delivery settings, two orientations of the applicator and blood perfusion of the tissues . Ex vivo and in&#xa0;vivo ablation procedures are conducted on ovine adrenal glands. Histology analysis completes the experimental studies. Numerical results show asymmetric ablation profiles in ex vivo and in&#xa0;vivo conditions. The asymmetry ratio is influenced by the procedure settings and orientation of the applicator. Ablation zones obtained experimentally agree with those predicted by the numerical simulations. Histology analysis confirms irreversible cellular changes only in the adrenal tissue close to the applicator. The outcomes show that the dielectric contrast between the fat layer and tissue target can be a tool in MWA to shape ablation zones to protect the surrounding structures from excessive temperature increases.", "keywords": ["Adenoma", "Adrenocortical Adenoma", "Animals", "Liver", "Microwaves", "Radiofrequency Ablation", "Sheep"], "year": "2022", "doi": "10.1080/02656736.2022.2114611"}, {"pmid": "34715600", "title": "Epicardial adipose tissue and adrenal gland volume in patients with borderline personality disorder.", "abstract": "Borderline personality disorder (BPD) is associated with an elevated mortality risk that is partially attributed to suicide, but few studies examined other possible causes of premature death. The present study compared epicardial adipose tissue (EAT) volume as a known early predictor of premature cardiovascular morbidity, cardiovascular risk indices, and adrenal gland volume (AGV) as an indicator for chronic hypothalamus-pituitary-adrenal (HPA) axis activation in females with borderline personality disorder (BPD), major depressive disorder (MDD) and in healthy individuals. Twenty-eight patients with BPD comorbid with MDD (BPD/MDD), 22 MDD patients and 26 healthy females (CTRL) of comparable age were included. EAT and AGV were assessed by magnetic resonance tomography; 10-year cardiovascular risk and diabetes risk were determined by PROCAM and FINDRISK score; metabolic syndrome was defined following National Cholesterol Education Adult Treatment Panel III R (NCEP/ATP III) criteria. MADRS was used to assess depression severity. After adjustment for age, body mass index (BMI), and physical activity, EAT and AGV were significantly increased in BPD/MDD compared to MDD and CTRL. EAT and AGV displayed a positive correlation. Finally, diabetes risk in BPD/MDD was elevated compared to CTRL and MDD. The present study highlights the increased cardiometabolic risk of BPD patients. We identify EAT accumulation as an early predictor and potential mediator of cardiovascular disease in BPD that appears to be driven at least in part by HPA axis dysregulation. Therefore, interventions that reduce EAT volume (i.e. exercise and diet) should be considered in the clinical management of BPD.", "keywords": ["Adipose Tissue", "Adrenal Glands", "Adult", "Borderline Personality Disorder", "Major Depressive Disorder", "Female", "Humans", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System"], "year": "2021", "doi": "10.1016/j.jpsychires.2021.10.039"}, {"pmid": "32361423", "title": "Expression of corticosteroid hormone receptors, prereceptors, and molecular chaperones in hypothalamic-pituitary-adrenal axis and adipose tissue after the administration of growth promoters in veal calves.", "abstract": "The action of glucocorticoids on target tissues is regulated by the glucocorticoid and mineralocorticoid receptors (codified by the NR3C1 and NR3C2 gene, respectively). Moreover, the prereceptor system, represented by the hydroxysteroid 11-beta dehydrogenases (HSD11Bs), catalyzes the interconversion from active glucocorticoids into inactive compounds. This study aimed to determine whether the expression of the prereceptor system, the corticosteroid receptors, and the molecules regulating their intracellular trafficking (FKBP prolyl isomerase 4 and FKBP prolyl isomerase 5) could be regulated in the hypothalamic-pituitary-adrenal axis and in different type of adipose tissue of calves by the administration of dexamethasone in combination with estradiol or prednisolone. Research about the glucocorticoid effects on bovine target tissues may allow development of new diagnostic methods that use potential molecular biomarkers of glucocorticoid treatment. The administration of dexamethasone in combination with estradiol increased the gene expression of HSD11B1 (P &lt; 0.01), HSD11B2 (P &lt; 0.05), NR3C1 (P &lt; 0.01), and NR3C2 (P &lt; 0.01) in the adrenal glands; NR3C2 in the intramuscular adipose tissue (P &lt; 0.01), and HSD11B1 in the subcutaneous adipose tissue (P &lt; 0.01). Prednisolone administration increased the gene expression of HSD11B1 (P &lt; 0.01), NR3C1 (P &lt; 0.05), and NR3C2 (P &lt; 0.05) in the adrenal glands and HSD11B1 (P &lt; 0.01) in the subcutaneous adipose tissue. Interestingly, most of the examined tissues/organs showed a significant variation of FKBP5 gene expression after the administration of dexamethasone in combination with estradiol. So, these changes suggest that the FKBP5 gene expression could be a possible biomarker of the illegal dexamethasone administration in calves.", "keywords": ["Adipose Tissue", "Adrenal Glands", "Animals", "Cattle", "Dexamethasone", "Estradiol", "Gene Expression Regulation", "Glucocorticoids", "Hypothalamo-Hypophyseal System", "Hypothalamus", "Male", "Molecular Chaperones", "Pituitary Gland", "Pituitary-Adrenal System", "Receptors, Steroid"], "year": "2020", "doi": "10.1016/j.domaniend.2020.106473"}, {"pmid": "32149734", "title": "Leptin mediates postprandial increases in body temperature through hypothalamus-adrenal medulla-adipose tissue crosstalk.", "abstract": "Meal ingestion increases body temperature in multiple species, an effect that is blunted by obesity. However, the mechanisms responsible for these phenomena remain incompletely understood. Here we show that refeeding increases plasma leptin concentrations approximately 8-fold in 48-hour-fasted lean rats, and this normalization of plasma leptin concentrations stimulates adrenomedullary catecholamine secretion. Increased adrenal medulla-derived plasma catecholamines were necessary and sufficient to increase body temperature postprandially, a process that required both &#xfeff;fatty acids generated from adipose tissue lipolysis and &#x3b2;-adrenergic activation of brown adipose tissue (BAT). Diet-induced obese rats, which remained &#xfeff;relatively hyperleptinemic while fasting, did not exhibit fasting-induced reductions in temperature. To examine the impact of feeding-induced increases in body temperature on energy balance, we compared rats fed chronically by either 2 carbohydrate-rich boluses daily or a continuous &#xfeff;isocaloric intragastric infusion. Bolus feeding increased body temperature and reduced weight gain compared with continuous feeding, an effect abrogated by treatment with atenolol. In summary, these data demonstrate that leptin stimulates a hypothalamus-adrenal medulla-BAT axis, which is necessary and sufficient to induce lipolysis and, as a result, increase body temperature after refeeding.", "keywords": ["Adipose Tissue, Brown", "Adrenal Medulla", "Animals", "Body Temperature Regulation", "Hypothalamo-Hypophyseal System", "Leptin", "Lipolysis", "Male", "Postprandial Period", "Rats", "Rats, Sprague-Dawley", "Signal Transduction"], "year": "2020", "doi": "10.1172/JCI134699"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"adipose tissue\"[Title] OR \"white adipose tissue\"[Title] OR \"fat tissue\"[Title] OR \"adipocyte\"[Title] OR \"adipogenesis\"[Title] OR \"visceral fat\"[Title] OR \"subcutaneous fat\"[Title] OR \"WAT\"[Title] OR \"lipogenesis\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Bone Marrow__Brain", "source": "Bone Marrow", "target": "Brain", "color": "#64748b", "description": "Type: Metabolic status.\nKey Players: \nNotes: \n- Might occur only during fasting as glucose is reserved for brain and immune system (bone marrow, spleen)\nSources:", "connection_type": "Metabolic status.", "key_players": ["Notes:"], "key_players_metabolites": ["Notes:", "glucose", "glutamate", "amp", "atp", "serine", "prostaglandin", "adp", "glycogen", "galactose", "fatty acid", "cholesterol", "amino acids", "lactate", "amino acid", "creatine"], "key_players_hormones": ["Notes:", "tnf", "tumor necrosis factor", "leptin", "angiotensin", "insulin", "interleukin-1", "igf-1", "il-6", "epo", "angiotensin ii", "renin", "corticosterone", "interleukin-6", "thyroid hormone", "glucocorticoid", "norepinephrine", "erythropoietin", "somatostatin", "cck", "natriuretic peptide", "glucagon", "acth", "il-4", "il6", "adiponectin", "t3", "il-10", "triiodothyronine"], "key_players_proteins": ["Notes:", "akt", "pi3k", "mapk", "p38", "mtor", "ampk", "sirt1", "inos", "jnk", "cox-2", "foxo1", "glut1", "erk1", "leptin receptor", "cox2", "cd36"], "key_players_counts_metabolites": {"cholesterol": 1, "amp": 11, "glycogen": 5, "atp": 7, "amino acids": 1, "glucose": 63, "galactose": 3, "fatty acid": 2, "glutamate": 14, "lactate": 1, "prostaglandin": 6, "amino acid": 1, "creatine": 1, "adp": 6, "serine": 7}, "key_players_counts_hormones": {"thyroid hormone": 2, "tnf": 19, "cck": 1, "natriuretic peptide": 1, "glucocorticoid": 2, "interleukin-1": 9, "glucagon": 1, "acth": 1, "igf-1": 9, "angiotensin ii": 5, "il-4": 1, "norepinephrine": 2, "erythropoietin": 2, "il6": 1, "renin": 4, "adiponectin": 1, "insulin": 10, "t3": 1, "il-10": 1, "tumor necrosis factor": 13, "triiodothyronine": 1, "leptin": 13, "corticosterone": 3, "il-6": 9, "epo": 7, "somatostatin": 2, "angiotensin": 11, "interleukin-6": 3}, "key_players_counts_proteins": {"mapk": 22, "jnk": 5, "pi3k": 31, "foxo1": 3, "p38": 21, "glut1": 2, "leptin receptor": 1, "akt": 39, "cox2": 1, "cox-2": 4, "cd36": 1, "erk1": 2, "ampk": 10, "sirt1": 8, "inos": 6, "mtor": 17}, "notes": "- Might occur only during fasting as glucose is reserved for brain and immune system (bone marrow, spleen)", "sources": [], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42335982", "title": "The skull bone marrow-meninges-brain axis: A new sentinel for neuroinflammation regulation in ischemic stroke.", "abstract": "The central nervous system (CNS) has long been regarded as relatively immune-privileged, but the discovery of glymphatic transport and meningeal lymphatic vessels has reshaped our understanding of neuroimmune communication. In ischemic stroke, emerging evidence suggests that post-injury inflammation is regulated not only by systemic leukocyte recruitment and blood-brain barrier disruption but also by a spatially organized skull bone marrow-meninges-brain axis. Anatomical studies have identified vascular channels connecting calvarial bone marrow with the dura mater, providing a potential route for rapid communication between skull marrow immune niches and CNS border compartments. After ischemic injury, brain-derived inflammatory signals may activate adjacent skull marrow niches, while skull marrow-derived myeloid cells may migrate toward the meninges and contribute to early neuroinflammatory responses. In parallel, meningeal lymphatic vessels support the clearance of cerebrospinal fluid (CSF)-derived solutes, inflammatory mediators, antigens, and cellular debris toward deep cervical lymph nodes. This review integrates current evidence into a stage-dependent influx-efflux framework. In this model, skull-dura vascular channels may support local cellular influx and immune sensing, whereas meningeal lymphatic vessels provide a molecular and antigenic efflux pathway. The balance between these processes may influence edema formation, inflammatory amplification, immune resolution, and tissue repair after stroke. However, this axis remains an emerging concept rather than a fully established therapeutic target. Human evidence mainly supports anatomical plausibility and imaging accessibility, while direct demonstration of skull marrow-derived immune-cell trafficking in human stroke is still lacking. Further mechanistic, imaging, and translational studies are needed to determine whether this axis can guide precision monitoring and modulation of post-stroke neuroinflammation.", "keywords": [], "year": "2026", "doi": "10.1016/j.expneurol.2026.115890"}, {"pmid": "42314665", "title": "Macrophage-mediated brain-bone marrow crosstalk promotes chronic stress-induced glioma growth.", "abstract": "Stress is associated with increased cancer morbidity and mortality. Here, we show that chronic stress accelerates glioma growth and reduces survival of tumor-bearing mice. Integrated multi-omics analysis of syngeneic glioma samples reveals stress-induced CD45 + CD11b + C5aR1 + macrophages, termed stress-associated macrophages (SAMs). Using parabiosis experiments in mice, we demonstrate that SAMs are derived from bone marrow monocytes. Stress-activated sympathetic nerve promotes the differentiation of ADRB2 + bone marrow monocytes into SAMs, which can be antagonized by selective ablation of catecholaminergic nerves. Conditional knockout of C5ar1 in macrophages, or pharmacologic C5aR inhibition, reduces SAMs and attenuates stress-induced glioma tumor growth in vivo. SAMs exhibit elevated CD36 expression, leading to excessive intracellular lipid accumulation and peroxidization, dampening their phagocytotic capacity. SAMs abundance correlates with self-reported stress levels and portended prognosis in glioma patients. Collectively, these findings suggest that stress reprograms tumor immune microenvironment by inducing molecularly distinguished monocyte-derived macrophages, revealing potential opportunities for immune-based cancer therapies.", "keywords": [], "year": "2026", "doi": "10.1016/j.ccell.2026.05.018"}, {"pmid": "42204700", "title": "Repeated head impacts establish a senescent cranial bone marrow niche that impairs brain metabolism.", "abstract": "Traumatic brain injury (TBI) of any severity is associated with long-term systemic inflammation and increased risk of peripheral comorbidities, yet the mechanisms driving immune dysregulation and accelerated aging after repeated sub-concussive head impacts remain poorly defined. Here, we investigated the acute and chronic effects of repetitive head impacts (RHI) on distal and proximal bone marrow compartments in the femur and calvaria, respectively. Using a modified weight-drop mouse model delivering rotational and acceleration-deceleration forces (3 hits/week for up to 16 weeks), RHI produced no mortality, skull fracture, hemorrhage, or brain leukocyte infiltration. Bone marrow stem and progenitor cell proliferation, senescence, and output were assessed using flow cytometry, senescence-associated assays, telomere analysis, and secretome profiling. One day after three consecutive impacts, RHI induced robust proliferation of LSK stem/progenitor cells in both femoral and calvarial marrow, evidenced by Ki67 expression, BrdU incorporation, and increased monocyte output. By 8 weeks (24 impacts), injury-induced proliferation subsided and LSK cells exhibited increased senescence-associated &#x3b2;-galactosidase activity and upregulation of tumor suppressor genes. At 16 weeks (48 impacts), LSK populations were depleted at both sites, displaying reduced proliferative capacity, telomere shortening, and pancytopenia in otherwise young adult mice. Calvarial bone marrow cells exposed to RHI released a distinct cytokine and proteomic secretome marked by elevated IL-6, suppressed mitochondrial and metabolic signaling, and enhanced DNA repair pathways. Notably, skull-derived secretome factors impaired cortical and hippocampal mitochondrial metabolism, and reduced microglial mitochondrial membrane potential. Together, these findings identify replicative senescence of the brain-adjacent bone marrow niche as an early and progressive consequence of repeated mild head injury, linking RHI to long-lasting metabolic dysfunction, impaired immunity, and accelerated aging.", "keywords": [], "year": "2026", "doi": "10.1186/s12974-026-03846-8"}, {"pmid": "42165939", "title": "Platelet-rich plasma-primed bone marrow mesenchymal stem cell-derived exosomes inhibit neuronal apoptosis and autophagy, and promote nerve regeneration via the miR-29a-3p/PTEN/PI3K/Akt/mTOR axis after spinal cord injury.", "abstract": "Both platelet-rich plasma (PRP) and exosomes derived from bone marrow mesenchymal stem cells (BMSCs) exhibit therapeutic potential for spinal cord injury (SCI). However, the combined application of PRP and BMSCs-derived exosome (PRP-primed BMSCs-EXO, PRP-BMSCs-EXO) has not been reported. This study aimed to investigate whether the combined use confers superior therapeutic effects and to explore the underlying molecular mechanisms. First, we examined the effects of PRP priming on the proliferation and exosome secretion of BMSCs. High-throughput sequencing and RT-qPCR were used to analyze the differential miRNA expression profiles between exosomes from PRP- primed BMSCs (PRP-BMSCs-EXO) and naive BMSCs (BMSCs-EXO). Subsequently, a series of in vitro SCI models were established to evaluate the therapeutic effects of PRP-BMSCs-EXO on SCI. TargetScan, RNAhybrid, GO, KEGG, dual-luciferase reporter assay, RT-qPCR, western blotting (WB), and rescue experiments were performed to explore the roles of miRNAs in PRP-BMSCs-EXO and the associated signaling regulatory mechanisms in SCI. Finally, a series of in vivo SCI models were used to verify the therapeutic efficacy and mechanisms of PRP-BMSCs-EXO in vivo. PRP priming promoted the proliferation and exosome secretion of BMSCs. High-throughput sequencing and RT-qPCR revealed that multiple miRNAs were highly expressed in PRP-BMSCs-EXO compared with BMSCs-EXO, among which miR-29a-3p was the most abundant. In in vitro SCI models, PRP-BMSCs-EXO exerted better therapeutic effects than BMSCs-EXO and PRP. Mechanistically, PRP-BMSCs-EXO may enhance the viability and migration and inhibit the apoptosis and autophagy of pheochromocytoma 12 (PC12) cells by delivering miR-29a-3p, thereby promoting nerve regeneration and SCI repair. Bioinformatic analysis and luciferase assays indicated that PTEN may be a downstream target gene of miR-29a-3p. Rescue experiments confirmed that the miR-29a-3p/PTEN/PI3K/Akt/mTOR axis may mediate the regulatory effects of PRP-BMSCs-EXO on neuronal apoptosis, autophagy, and nerve regeneration in SCI. These findings were further validated in in vivo SCI models. Compared with PRP and BMSC-derived exosomes alone, PRP-primed BMSC-derived exosomes provide superior neuroprotective effects against SCI. PRP-BMSCs-EXO inhibits neuronal apoptosis and autophagy and promotes nerve regeneration via the miR-29a-3p/PTEN/PI3K/Akt/mTOR axis, representing a promising and effective therapeutic strategy for SCI.", "keywords": ["Exosomes", "Spinal Cord Injuries", "Mesenchymal Stem Cells", "Platelet-Rich Plasma", "MicroRNAs", "Animals", "Autophagy", "PTEN Phosphohydrolase", "Proto-Oncogene Proteins c-akt", "Apoptosis", "TOR Serine-Threonine Kinases", "Phosphatidylinositol 3-Kinases", "Nerve Regeneration", "Signal Transduction", "Rats", "Neurons", "Rats, Sprague-Dawley", "Disease Models, Animal", "Male"], "year": "2026", "doi": "10.1007/s10735-026-10823-1"}, {"pmid": "42133908", "title": "Hematopoietic Stem Cell Transplant and Brain Volume Changes in Adults With Sickle Cell Disease.", "abstract": "Adults with sickle cell disease (SCD) are at risk of decline in brain health and cognition, even without clinical stroke. SCD-related changes on MRI include brain atrophy and T2 fluid attenuated inversion recovery (FLAIR) white matter hyperintensity (WMH) growth. Hematopoietic stem cell transplant (HSCT) can be curative, but conditioning regimens risk new complications, particularly for adults with accumulated organ damage. We tested whether successful HSCT for adults with SCD was associated with reduced brain atrophy or WMH growth. In this cohort study, adults with severe SCD underwent HSCT as part of 5 research protocols at the National Institutes of Health Clinical Center, including autologous gene therapy, HLA-matched donor HSCs, and haploidentical HSCs. Serial brain MRI scans acquired before and after transplant for up to 12 years included 3D T1-weighted and axial FLAIR sequences. Longitudinal brain volumes, segmented using FreeSurfer and corrected for total intracranial volume (TICV), were used to measure brain parenchymal fraction (BPF). A deep learning algorithm segmented WMH volumes from FLAIR sequences. Volumes were log 2 -transformed as a percentage of TICV. We tested whether HSCT success (persistent engraftment vs graft failure) or change in hemoglobin (Hb) (post-pre-HSCT) was associated with the rate of brain atrophy or WMH growth using mixed-effects linear regression. Random effects included scanner, participant intercept, and slope, while fixed effects included age and sex. Seventy-seven participants (mean age 32 &#xb1; 9 years, 43% female) who underwent HSCT were followed for a median 5.3 years (interquartile range [IQR] = 4.6). For 65 participants with successful HSCT, BPF declined nonsignificantly (-0.055%/year; 95% CI -0.12, 0.006; p = 0.08). Twelve participants with graft failure had a 7-fold greater BPF decline (-0.42%/year; 95% CI -0.57, -0.26; p &lt; 0.001; group difference p &lt; 0.001). A smaller change in Hb after HSCT was associated with steeper BPF decline (0.035%/year per unit Hb; 95% CI 0.017, 0.053; interaction p &lt; 0.001). WMH growth was similar in both groups (0.038% vs 0.030% per year; interaction p = 0.50) and was associated with older age and baseline WMHs, but not treatment success. Successful HSCT was associated with preserved brain volume, but not WMH growth, another brain health biomarker. Whether these HSCT-related brain structural changes translate to cognitive preservation remains to be determined. ClinicalTrials.gov NCT02140554 registered 2014-05-14, first enrollment February 2015; ClinicalTrials.gov NCT00061568; registered 2004-07-16, first enrollment July 2004; ClinicalTrials.gov NCT02105766; registered 2014-04-01, first enrollment April 2014; ClinicalTrials.gov NCT03077542; registered 2017-03-10, first enrollment April 2017; ClinicalTrials.gov NCT00977691; registered 2009-12-14, first enrollment December 2009. This study provides Class III evidence that in adults with sickle cell disease, successful hematopoietic stem cell transplant is associated with slower declines in BPFs over a median period of 5 years, compared with patients with transplant failure.", "keywords": ["Humans", "Female", "Male", "Anemia, Sickle Cell", "Adult", "Hematopoietic Stem Cell Transplantation", "Brain", "Magnetic Resonance Imaging", "Young Adult", "Cohort Studies", "Organ Size", "Atrophy", "Middle Aged"], "year": "2026", "doi": "10.1212/WNL.0000000000218050"}], "pubmed_query": "(\"bone marrow\"[Title] OR \"hematopoietic\"[Title] OR \"haematopoietic\"[Title] OR \"hematopoiesis\"[Title] OR \"bone marr "cholesterol": 3, "sphingolipid": 1, "propionate": 2, "amp": 6, "bile acids": 1, "amino acids": 2, "glucose": 5, "galactose": 13, "fatty acid": 10, "ldl": 1, "lactate": 5, "cysteine": 1, "prostaglandin": 2, "butyrate": 18, "pyruvate": 2, "free fatty acid": 2, "amino acid": 1, "lipoprotein": 3, "ceramide": 2, "triglycerides": 2, "acetate": 3, "creatine": 1, "uric acid": 2, "triglyceride": 1, "fatty acids": 12, "nadh": 1, "deoxycholic acid": 1, "adp": 3, "glutamine": 1, "nadph": 5}, "key_players_counts_hormones": {"progesterone": 7, "tnf": 17, "glucocorticoid": 4, "interleukin-1": 2, "fgf23": 1, "glucagon": 2, "il-4": 7, "tnf-alpha": 4, "il6": 1, "renin": 1, "estrogen": 2, "adiponectin": 4, "insulin": 8, "t3": 2, "vitamin d": 4, "resistin": 3, "il-10": 6, "tumor necrosis factor": 11, "leptin": 3, "glp-1": 2, "il-6": 12, "igf1": 3, "epo": 2, "gip": 2, "angiotensin": 6, "interleukin-6": 4}, "key_players_counts_proteins": {"sirt4": 2, "mapk": 3, "fabp": 1, "pi3k": 2, "p38": 1, "akt": 4, "erk1": 7, "ampk": 8, "inos": 5, "pkm2": 1, "cpt2": 1}, "notes": "- Might occur only during fasting as glucose is reserved for brain and immune system (bone marrow, spleen, Peyer's patches in small intestine)", "sources": ["doi: 10.4061/2010/823710"], "ai_description": "", "pubmed_n": 144, "pubmed_papers": [{"pmid": "42216221", "title": "Bone marrow mesenchymal stem cells synergize with fusobacterium nucleatum to drive colorectal tumorigenesis via gut microbiome dysbiosis.", "abstract": "The oncogenic role of F. nucleatum (Fn) in colorectal cancer (CRC) is increasingly recognized, yet its interaction with host stromal components, such as bone marrow mesenchymal stem cells (BMSCs), remains poorly understood. Building on our previous discovery that BMSC-derived Wnt3a promotes Fn-driven tumorigenesis, this study aims to investigate the synergistic interplay between BMSCs and F. nucleatum in CRC pathogenesis via the gut microbiome. Based on the established Apc Min/+ mouse model of CRC, animals were randomly assigned to four experimental groups: control, Fn-only, BMSCs-only, and Fn+BMSCs co-treatment group. Gut microbiota composition was continuously analyzed over 8 weeks by metagenomic sequencing. Metagenomic functions were predicted using PICRUSt2. The Fn+BMSCs co-treatment group exhibited the highest enrichment of F. nucleatum and the greatest reduction in microbial diversity. Fn+BMSCs co-treatment induced a distinct pro-tumorigenic shift, marked by a decline in symbiont Lactobacillus and an increase in pathobiont Escherichia-Shigella. Metagenomic analysis revealed a unique enhancement of butanoate metabolism in the Fn+BMSC co-treatment group. Furthermore, a profoundly elevated LPS level was discovered in the Fn+BMSCs co-treatment group, indicating hyperactivation of the pro-inflammatory and proliferative TLR4/NF-&#x3ba;B pathway. Our findings demonstrate that BMSCs synergize with F. nucleatum to create a tumorigenicmicroenvironment by driving microbial dysbiosis, reprogramming metabolic pathways, and amplifying pro-inflammatory signaling. Our findings reveal that BMSCs fuel CRC progression via multiple mechanisms: by altering the gut microbiome ecology and, as previously discovered, by providing oncogenic Wnt3a signals. Targeting the synergistic BMSC-Fn axis may thus offer a novel therapeutic strategy for CRC.", "keywords": [], "year": "2026", "doi": "10.1186/s13099-026-00839-z"}, {"pmid": "42203970", "title": "Gut microbiota alteration contributes to bone marrow mesenchymal stem cells connexin43 response to high-fat diet induced obesity in mice.", "abstract": "Bone marrow mesenchymal stem cells (BMSCs) contribute to controlling adipose tissue homeostasis and may be a potential target for obesity therapy. Since lack of connexin43(Cx43) in mesenchymal stem cells (MSCs) is known to combat high-fat diet (HFD)-induced adiposity. Also, HFD is a well-known risk factor for gut microbiota dysbiosis. Here we attempt to address the interaction between HFD, gut microbiota, and Cx43 deficiency in BMSCs during the development of obesity. BMSC-specific Cx43 knockout (Prrx1-Cre;Cx43 flox/flox (cKO)) and control littermate (Cx43 flox/flox (flox))mice were fed a regular chow diet or a HFD for 8 weeks. Cecal microbiome composition was assessed by 16S ribosomal RNA (rRNA) sequencing, and further analyzing correlation between gut microbiota and obesogenic parameters. Moreover, transplantation fecal microbiota was used to probe the salutary effect of BMSC Cx43. HFD fed cKO mice notably altered cecal microbiome composition as proved by a distinctively clustered separation from flox mice. Concomitantly, Allobaculum induced by HFD was strongly correlated positively with body weight, glucose intolerance, and adipose mass. The recipients with gut microbiota from cKO mice displayed anti-obesity phenotype as the donors. Gut microbiota alteration may be one main reason for the salutary effect of BMSC Cx43 knockout on body adiposity.", "keywords": [], "year": "2026", "doi": "10.1038/s41366-026-02104-4"}, {"pmid": "42075029", "title": "Modulation of Gut Microbiota Through Dietary Fibers to Enhance Regulatory T Cell-Based Immunotherapy in GVHD Following Hematopoietic Stem Cell Transplantation.", "abstract": "Graft-versus-host disease (GVHD) is one of the principal complications seen in the recipients of allogenic hematopoietic stem cell transplantation (allo-HSCT), and persists as a leading cause of post-transplant morbidity and mortality. Increasing evidence highlights the crucial influence of the gut microbiome (GM) on transplant outcomes. Microbial dysbiosis, characterized by reduced bacterial diversity and pathogenic overgrowth, is strongly associated with higher rates of complications and mortality. Patients with lower microbial diversity exhibit poorer overall survival (OS) and an increased incidence of acute GVHD (aGVHD). Conversely, restoration of beneficial commensal communities has been shown to enhance immune homeostasis, mitigate GVHD severity, and decrease infection risk. Emerging therapeutic strategies now focus on modulating the intestinal microbiome through dietary interventions, probiotics, prebiotics, and fecal microbiota transplantation (FMT). It has been demonstrated that bacterial metabolites, such as short-chain fatty acids (SCFAs) from the diet, especially a diet rich in fibers, reduce the occurrence/severity of GVHD by inducing regulatory T cells (Tregs), which release anti-inflammatory cytokines and regulate the host immune system. Hence, the implementation of dietary fibers (DFs) could increase beneficial commensals, Treg induction, and improve outcomes such as GVHD and OS in recipients of allo-HCT. Hereupon, this review addresses how a fiber-rich diet modulates GM composition, reinforces epithelial barrier integrity, and improves the efficacy of Treg-based immunotherapy by stabilizing their regulatory phenotype and increasing their functional persistence, ultimately leading to a reduction in GI complications associated with GVHD. Unlike prior reviews that primarily cover the microbiome-GVHD axis or Treg therapies in isolation, this review emphasizes fermentable dietary fibers as a mechanistically grounded, clinically actionable strategy to support Treg stability and persistence via microbiota-derived metabolites. We integrate mechanistic evidence with emerging clinical feasibility data and ongoing trials of prebiotic supplementation in allogeneic HSCT.", "keywords": ["Humans", "Graft vs Host Disease", "Hematopoietic Stem Cell Transplantation", "T-Lymphocytes, Regulatory", "Dietary Fiber", "Gastrointestinal Microbiome", "Animals", "Immunotherapy", "Prebiotics", "Dysbiosis"], "year": "2026", "doi": "10.3390/nu18081216"}, {"pmid": "42038323", "title": "Si xian formula (SXF) alleviates carboplatin-induced bone marrow microenvironment damage and promotes thrombocytopenia recovery by regulating gut microbiota and bone marrow metabolites: a correlative study.", "abstract": "Chemotherapy-induced thrombocytopenia (CIT) presents as a prevalent hematological toxicity, often complicating the clinical management of cancer patients. SI XIAN Formula (SXF), a prescription consisting of ten traditional Chinese medicine for treating chemotherapy-induced thrombocytopenia (CIT), has been widely used to treat CIT patients more than 10&#xa0;years. The mechanism of SXF remains unclear. This study was designed to systematically evaluate the therapeutic efficacy and elucidate the underlying mechanisms of SXF in a CIT mouse model. A CIT mice model was successfully established via the tail vein injection of carboplatin. The Mice were subsequently treated daily with SXF for 15&#xa0;days and 24&#xa0;days. Body weight and platelet count were recorded every 3&#xa0;days. The bone marrow cells and fluid were collected for flow cytometry analysis and cytokine detection separately. Histological changes in the femurs bone marrow were observed using H&amp;E staining. The diversity and composition of the intestinal microbiota were analyzed using 16S rDNA gene sequencing. The bone marrow metabolites were identified by HPLC-MS/MS analysis. SXF administration significantly accelerated the recovery of platelet counts to baseline levels following carboplatin -induced thrombocytopenia. Mechanistically, SXF demonstrated protective effects on multiple hematopoietic cells, including hematopoietic stem/progenitor cells, megakaryocytic progenitor cells, and bone marrow megakaryocytes in CIT-induced mice. Furthermore, SXF effectively restored carboplatin-induced alterations in hematopoietic cytokine profiles. SXF treatment altered gut microbial diversity and community structure, particularly reducing the abundance of Paraprevotella and Bacteroides while increasing the abundance of Lachnospiraceae_NK4A136 compared with the model group, which is positively correlated with all hematopoietic function indicators (P &lt; 0.001). Metabolomic profiling further revealed that SXF ameliorated the bone marrow metabolic profile in CIT-induced mice. Spearman correlation analysis revealed significant positive associations between Parabacteroides , Prevotellaceae_UCG-001 , Bacillu s, and unclassified Muribaculaceae with upregulated metabolites, while showing inverse correlations with downregulated metabolites in SXF(H) versus MDL group comparisons. Our findings demonstrate that SXF alleviates CIT in mice by orchestrating a novel gut-bone marrow regulatory axis, bridging gut microbiota and marrow metabolic remodeling. In CIT murine models, SXF administration was shown to alleviate carboplatin-induced bone marrow microenvironment injury and accelerate platelet recovery via bidirectional regulation of gut microbiota and marrow metabolic remodeling.", "keywords": [], "year": "2026", "doi": "10.3389/fphar.2026.1689477"}, {"pmid": "42034936", "title": "The gut-bone axis in osteoporosis: Microbiota-associated immune-metabolic remodeling of the bone marrow microenvironment.", "abstract": "Osteoporosis is a common systemic skeletal disease in the aging population, and its pathogenesis involves multiple mechanisms such as estrogen deficiency, aging, reduced mechanical load, chronic low-grade inflammation, and imbalance of the calcium&#x2011;phosphorus-vitamin D-PTH/FGF23 axis. In recent years, the gut-bone axis has increasingly been recognized as a complementary regulatory network for understanding the systemic heterogeneity of osteoporosis, rather than a single dominant pathway independent of classical mechanisms. Existing studies suggest that intestinal barrier status, microbiota imbalance, and their related inflammatory/metabolic signals may affect the bone marrow immune-metabolic state and bone remodeling balance through a continuous mechanism chain of \"gut output-bone marrow microenvironment translation-bone remodeling imbalance.\" Accordingly, the main significance of the gut-bone axis lies in supplementing the explanation from a cross-organ perspective of how classical osteoporosis mechanisms such as inflammation, aging, and abnormal mineral metabolism collectively converge on bone marrow microenvironment imbalance and bone loss. This article reviews how intestinal barrier dysfunction, microbiota imbalance, and their related metabolic pathways affect the bone marrow microenvironment and alter osteoblast-osteoclast coupling, focusing on three levels: gut signal output, bone marrow immune-metabolic translation, and dysregulation at the bone remodeling execution level. Currently, relatively consistent supporting evidence mainly comes from animal and preclinical mechanism studies; population studies more often suggest a correlation between the gut-bone axis and osteoporosis, while genetic/MR inference and clinical intervention evidence remain limited. Therefore, the gut-bone axis is more suitable as an analysis framework for integrating immune, metabolic, and bone marrow microenvironment changes in osteoporosis, and its translational potential is currently limited to providing insights for mechanism and stratification research levels, rather than serving as a mature intervention pathway.", "keywords": ["Humans", "Osteoporosis", "Animals", "Bone Marrow", "Gastrointestinal Microbiome", "Bone Remodeling", "Fibroblast Growth Factor-23", "Cellular Microenvironment", "Bone and Bones", "Intestinal Barrier Function"], "year": "2026", "doi": "10.1016/j.intimp.2026.116690"}], "pubmed_query": "(\"bone marrow\"[Title] OR \"hematopoietic\"[Title] OR \"haematopoietic\"[Title] OR \"hematopoiesis\"[Title] OR \"bone marrow niche\"[Title]) AND (\"small intestine\"[Title] OR \"duodenum\"[Title] OR \"jejunum\"[Title] OR \"ileum\"[Title] OR \"intestinal\"[Title] OR \"gut\"[Title] OR \"enterocyte\"[Title] OR \"Peyer's patches\"[Title] OR \"gut-brain axis\"[Title] OR \"enteroendocrine\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Bone Marrow__Spleen", "source": "Bone Marrow", "target": "Spleen", "color": "#64748b", "description": "Type: Metabolic status. Similar Function.\nKey Players: \nNotes: \n- Might occur only during fasting as glucose is reserved for brain and immune system (bone marrow, spleen, Peyer's patches in small intestine)\nSources:", "connection_type": "Metabolic status. Similar Function.", "key_players": ["Notes:"], "key_players_metabolites": ["Notes:", "glucose", "galactose", "prostaglandin", "phospholipid", "atp", "arginine", "methionine", "amp", "leukotriene", "fatty acid", "lactate", "glycerol", "cholesterol", "sphingosine-1-phosphate", "ldl", "eicosanoid", "pyruvate", "acetate", "nadph", "serine"], "key_players_hormones": ["Notes:", "erythropoietin", "il-10", "epo", "growth hormone", "tnf", "tnf-alpha", "insulin", "estrogen", "vitamin d", "corticosterone", "calcitriol", "tumor necrosis factor", "il-6", "prolactin", "acth", "igf-1", "il-4", "norepinephrine", "cortisol", "osteocalcin", "noradrenaline", "thyrotropin"], "key_players_proteins": ["Notes:", "akt", "cox-2", "pi3k", "inos", "acc"], "key_players_counts_metabolites": {"methionine": 2, "cholesterol": 1, "amp": 2, "atp": 3, "leukotriene": 2, "glucose": 13, "sphingosine-1-phosphate": 1, "galactose": 10, "fatty acid": 2, "ldl": 1, "lactate": 2, "eicosanoid": 1, "prostaglandin": 9, "arginine": 3, "pyruvate": 1, "glycerol": 2, "acetate": 1, "phospholipid": 4, "nadph": 1, "serine": 1}, "key_players_counts_hormones": {"tnf": 4, "acth": 1, "igf-1": 1, "il-4": 1, "norepinephrine": 1, "cortisol": 1, "osteocalcin": 1, "tnf-alpha": 4, "growth hormone": 6, "erythropoietin": 20, "noradrenaline": 1, "estrogen": 3, "insulin": 4, "vitamin d": 3, "il-10": 15, "calcitriol": 2, "tumor necrosis factor": 2, "corticosterone": 3, "il-6": 2, "epo": 11, "thyrotropin": 1, "prolactin": 2}, "key_players_counts_proteins": {"pi3k": 2, "akt": 7, "cox-2": 6, "inos": 2, "acc": 2}, "notes": "- Might occur only during fasting as glucose is reserved for brain and immune system (bone marrow, spleen, Peyer's patches in small intestine)", "sources": [], "ai_description": "", "pubmed_n": 150, "pubmed_papers": [{"pmid": "41547774", "title": "Prognostic value of diffusely increased FDG uptake in spleen and/ or bone marrow due to reticuloendothelial system activation in lymphoma patients.", "abstract": "The primary objective of this investigation was to evaluate the predictive utility of diffusely increased 18 F-FDG uptake in the spleen or bone marrow in lymphoma patients and explore the correlation between reticuloendothelial system activation and inflammation. Our retrospective cohort comprised 629 treatment-na&#xef;ve lymphoma patients with pathological confirmation who received diagnostic 18&#xa0;F-FDG PET/CT scans between June 2018 and December 2024. The patients cohort with conditions affecting splenic/bone marrow metabolism (e.g., anemia) or focal uptake were excluded, leaving 142 patients. Based on liver uptake, spleen and bone marrow FDG uptake were classified into two groups: diffusely increased FDG uptake (dFDG, n&#x2009;=&#x2009;67) and normal FDG uptake (nFDG, n&#x2009;=&#x2009;75). Hematologic parameters (white blood cells, monocytes, neutrophils, platelets) and inflammatory markers (lactate dehydrogenase [LDH], &#x3b2; 2 -microglobulin) were recorded within one week of PET/CT. Volumes of interest (VOIs) were delineated for the liver, spleen, and bone marrow to obtain SUVmean values, calculating SLR and BLR. Survival data were obtained via medical records or telephone follow-up. Prognostic factors were assessed using correlation analysis, proportional hazards regression modeling complemented by Kaplan-Meier survival curve estimation. No statistically significant differences were observed in age, sex, or B symptoms between groups. The dFDG group had more advanced staging (Stage III/IV: 83.6% vs. 52.0%, p&#x2009;&lt;&#x2009;0.001) and significantly higher inflammatory markers (LDH, &#x3b2; 2 -microglobulin, D-dimer; all p&#x2009;&lt;&#x2009;0.05). SLR positively correlated with LDH, &#x3b2; 2 -microglobulin, and D-dimer (all p&#x2009;&lt;&#x2009;0.05). SLR&#x2009;&gt;&#x2009;2.221 was an independent risk factor for PFS (HR&#x2009;=&#x2009;4.660, p&#x2009;=&#x2009;0.012). Diffuse bone marrow uptake showed low concordance with bone marrow aspiration (kappa&#x2009;=&#x2009;0.337, p&#x2009;&lt;&#x2009;0.001), possibly related to inflammation or marrow activation. Multivariate analysis confirmed SLR as an independent predictor of PFS. Diffuse splenic FDG uptake strongly correlates with systemic inflammation. The SLR emerged as an independent predictor of progression-free survival in our lymphoma cohort. Diffuse bone marrow uptake may involve non-neoplastic factors and requires comprehensive clinicopathological assessment. This study provides new evidence for PET/CT-guided prognostic evaluation in lymphoma.", "keywords": ["Humans", "Female", "Fluorodeoxyglucose F18", "Bone Marrow", "Male", "Lymphoma", "Positron Emission Tomography Computed Tomography", "Prognosis", "Retrospective Studies", "Spleen", "Middle Aged", "Aged", "Adult", "Mononuclear Phagocyte System", "Radiopharmaceuticals", "Aged, 80 and over"], "year": "2026", "doi": "10.1186/s12885-026-15568-4"}, {"pmid": "41280889", "title": "Long-term outcome of bone marrow transplantation in NIK deficiency: non-redundant role of non-canonical NF-&#x3ba;B signaling in thymic reconstitution and secondary lymphoid organ development.", "abstract": "Biallelic mutations in MAP3K14 , encoding NF-&#x3ba;B-inducing kinase (NIK), disrupt non-canonical NF-&#x3ba;B signaling and lead to a rare inborn error of immunity marked by impaired lymphoid organ development, defective lymphocyte maturation, and susceptib
