ites": {"cholesterol": 12, "ketone bodies": 1, "amp": 6, "atp": 6, "hdl": 5, "glucose": 16, "fatty acid": 2, "glutamate": 1, "lactate": 4, "amino acid": 1, "creatinine": 5, "ursodeoxycholic acid": 3, "lipoprotein": 6, "triglycerides": 4, "creatine": 3, "uric acid": 1, "urea": 1, "fatty acids": 4, "phospholipid": 1, "nadph": 3, "serine": 1, "bile acid": 1}, "key_players_counts_hormones": {"thyroid hormone": 249, "tnf": 5, "bnp": 4, "natriuretic peptide": 11, "glucocorticoid": 2, "thyroxine": 99, "igf-1": 4, "angiotensin ii": 4, "norepinephrine": 4, "cortisol": 4, "thyroid hormones": 144, "noradrenaline": 1, "insulin": 4, "t3": 172, "vitamin d": 8, "tumor necrosis factor": 1, "triiodothyronine": 94, "epinephrine": 1, "tgf-b": 1, "igf1": 1, "tsh": 221, "thyrotropin": 39, "t4": 56, "anp": 1, "angiotensin": 9}, "key_players_counts_proteins": {"mapk": 8, "jnk": 1, "pi3k": 7, "foxo1": 1, "p38": 9, "tfam": 2, "akt": 12, "cd36": 1, "erk1": 1, "pdk4": 1, "ampk": 1, "sirt1": 2, "acc": 3, "mtor": 2}, "notes": "- TH  regulates Thermogenesis, energy utilization by increasing the basal metabolic rate and regulate lipid and glucose metabolism. At hyperthyroid condition: Increased heart rate. At Hypothyroid condition: decreased heart rate.", "sources": ["doi: 10.1177/2042018820917869", "https://doi.org/10.1152/physrev.00030.2013"], "ai_description": "The Heart-Thyroid axis is a complex interplay between the heart and thyroid gland, mediated by key signalling molecules such as thyrotropin-releasing hormone (TRH) [1] and thyroid-stimulating hormone (TSH) [2]. In response to TSH, the thyroid gland secretes triiodothyronine (T3), which in turn increases cardiac contractility and reduces peripheral resistance, as seen in low T3 syndrome in heart failure [3]. Conversely, hypothyroidism can lead to cardiac tamponade due to pericardial effusion, a condition exacerbated by the loss of thyroid hormone-induced ion channel function, including HCN and Kv channels [4]. The axis is further modulated by TRH, which stimulates the release of norepinephrine from the adrenal medulla, increasing heart rate and blood pressure [5].", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42324939", "title": "Investigating thyroid dysfunction in pediatric patients following the administration of iodinated contrast media during cardiac catheterization.", "abstract": "To determine the incidence and severity of thyroid dysfunction following iodinated contrast media (ICM) exposure in our pediatric heart center, assess adherence to FDA guidelines and evaluate the utility of routine thyroid function testing. This retrospective study reviewed charts of 186 patients under four years old who underwent cardiac catheterization between June 2022 and June 2024 at our pediatric heart center. Data collected included age, sex, gestational age, ethnicity, ICM use, and post-procedure thyroid-stimulating hormone (TSH) levels. Additional risk factors were assessed for patients with abnormal thyroid studies. Of the 186 cardiac catheterization procedures, 155 involved administration of ICM. Follow-up thyroid studies were conducted after 113 of these; three lab draws were excluded due to new diagnoses of hypothyroidism made during the study period. Among the remaining 110 cases with indicated TSH testing, only two patients (1.8&#x202f;%) demonstrated persistently elevated TSH levels&#xa0;-&#xa0;both of whom had pre-existing risk factors for thyroid dysfunction. Among the 113 cases that completed follow-up TSH studies, 69 (61.1&#x202f;%) occurred within the FDA's recommended 3-week period. Post-procedure thyroid studies were not completed in 42 cases (27.1&#x202f;%), although four patients had passed away and four were transferred to another hospital system. No clinically significant relationship was found between ICM exposure and thyroid dysfunction in patients under four years old, suggesting routine post-catheterization thyroid screening may be unnecessary.", "keywords": [], "year": "2026", "doi": "10.1515/jpem-2026-0036"}, {"pmid": "42205546", "title": "Cardiac Tamponade Secondary to Massive Pericardial Effusion in Severe Primary Hypothyroidism: A Case Report.", "abstract": "Pericardial effusion is a recognized manifestation of overt hypothyroidism, but progression to cardiac tamponade is rare. In tuberculosis-endemic settings, diagnostic focus often favors tuberculous pericarditis, risking delayed recognition of reversible endocrine causes. A 65-year-old Black African woman from Northern Uganda presented with five months of progressive dyspnea, orthopnea, and generalized edema, followed by acute pleuritic chest pain. She had a history of hypertension and type 2 diabetes mellitus. No prior thyroid disease, tuberculosis, malignancy, or rheumatologic condition was identified. Examination revealed marked sinus bradycardia (42 beats/min), elevated jugular venous pressure, muffled heart sounds, pulsus paradoxus, and Woltman's sign. The thyroid gland was diffusely enlarged without palpable nodules or cervical lymphadenopathy. Electrocardiography showed low-voltage QRS complexes. Transthoracic echocardiography demonstrated a large circumferential pericardial effusion (maximal posterior separation 3.2 cm) with right ventricular diastolic collapse and Doppler evidence of tamponade physiology, and a mildly reduced left ventricular ejection fraction of approximately 40%, with diffuse hypokinesis and no regional wall motion abnormalities, making ischemic cardiomyopathy less likely. Urgent pericardiocentesis drained 520 mL of clear, straw-colored fluid. Pericardial fluid analysis showed elevated total protein (4.2 g/dL; serum protein 7.0 g/dL; fluid-to-serum ratio 0.6), moderately elevated lactate dehydrogenase (below 1000 U/L), low adenosine deaminase (&lt;5 U/L), and negative mycobacterial studies, making tuberculous pericarditis unlikely. Thyroid function tests confirmed severe primary hypothyroidism (thyroid-stimulating hormone 88.08 mIU/L; free thyroxine 4.0 pmol/L) with positive anti-thyroid peroxidase antibodies, consistent with autoimmune thyroiditis. Low-dose levothyroxine was initiated with gradual titration. Hemodynamic status improved immediately after pericardiocentesis. Follow-up echocardiography showed complete resolution of the effusion, and the patient achieved biochemical euthyroid within three months. Severe primary hypothyroidism should be routinely considered in patients with unexplained pericardial effusion, even in tuberculosis-endemic settings. Paradoxical bradycardia in tamponade, Woltman's sign, low-voltage electrocardiography, and a protein-rich pericardial effusion with low adenosine deaminase are important diagnostic clues. Prompt pericardiocentesis treats hemodynamic compromise, while cautious levothyroxine replacement prevents recurrence.", "keywords": [], "year": "2026", "doi": "10.2147/IMCRJ.S610746"}, {"pmid": "42185778", "title": "Low T3 syndrome in heart failure: prevalence and its relationship with disease severity and ejection fraction.", "abstract": "Low T3 syndrome is a common hormonal alteration observed in patients with heart failure and has been associated with disease severity and adverse clinical outcomes. The prevalence of low T3 syndrome and its relationship with heart failure severity and ejection fraction phenotypes remain clinically relevant issues. This study aimed to evaluate the prevalence of low T3 syndrome in patients with heart failure and to investigate its association with disease severity and left ventricular ejection fraction. In this prospective observational study, 132 patients with chronic heart failure (81 males, 51 females) who were evaluated at a tertiary care hospital between June 2021 and November 2021 were consecutively enrolled. Patients with known thyroid disease, use of thyroid hormone therapy, positive anti-thyroid antibodies, severe anemia, malignancy, active inflammatory disease, or medications affecting thyroid function were excluded. Low T3 syndrome was defined as a serum total triiodothyronine level below 2.6 ng/L in the presence of normal thyroid-stimulating hormone concentrations. Patients were classified according to left ventricular ejection fraction as reduced (&lt;&#x2009;50%) or preserved (&#x2265;&#x2009;50%). Clinical characteristics, laboratory parameters, inflammatory markers, and hospitalization indicators were analyzed in relation to serum T3 levels and ejection fraction phenotypes. Low T3 syndrome was detected in 60 patients (45.5%). Reduced ejection fraction was present in 82 patients (62.1%), while 50 patients (37.9%) had preserved ejection fraction. The prevalence of low T3 syndrome was significantly higher in patients with reduced ejection fraction compared to those with preserved ejection fraction. However, this association appeared less pronounced than its relationship with overall disease severity. Patients with low T3 syndrome demonstrated features of increased disease severity, including a non-significant trend toward longer hospital stays and worse clinical profiles. Lower T3 levels were associated with indicators of more advanced heart failure, whereas the relationship with ejection fraction phenotype was less pronounced. Low T3 syndrome is highly prevalent in patients with heart failure and is associated with increased disease severity. Its relationship with ejection fraction phenotype appears secondary to its association with clinical severity. Assessment of T3 levels may provide additional insight into the clinical status of patients with heart failure beyond conventional systolic function evaluation.", "keywords": [], "year": "2026", "doi": "10.1186/s12872-026-05973-9"}, {"pmid": "42082305", "title": "Thyroid hormone deficiency-induced cardiac ion channel dysfunction: Molecular mechanisms and arrhythmic implications.", "abstract": "Thyroid hormones are essential regulators of cardiac excitability, contractility, and rhythm. Hypothyroidism induces profound electrophysiological remodeling through both genomic and non-genomic pathways, leading to altered expression and function of key ion channels, including HCN, Kv, and Ca&#xb2;&#x207a;-handling proteins. These changes result in reduced pacemaker activity, prolonged repolarization, and impaired excitation-contraction coupling, which collectively contribute to bradycardia, QT prolongation, and increased arrhythmogenic risk. Elevated thyroid-stimulating hormone (TSH) levels further exacerbate electrical instability through direct myocardial signaling. Experimental and clinical evidence indicates that many of these abnormalities could be reversible upon thyroid hormone replacement, emphasizing the importance of early diagnosis and multidisciplinary management. Understanding the molecular basis of thyroid-induced electrical remodeling provides insight into arrhythmogenesis and may guide therapeutic strategies to prevent cardiac complications in hypothyroidism.", "keywords": ["Humans", "Arrhythmias, Cardiac", "Thyroid Hormones", "Ion Channels", "Animals", "Hypothyroidism"], "year": "2026", "doi": "10.1016/bs.ctm.2026.01.002"}, {"pmid": "41948356", "title": "Cardiac Tamponade, Pituitary Hyperplasia, and Macroorchidism in Severe Primary Hypothyroidism.", "abstract": "This case reports a rare and complex presentation of severe primary hypothyroidism (PH) in an 18-year-old male. The patient presented to the emergency department with dyspnea due to impending cardiac tamponade, requiring emergency pericardiocentesis. Further evaluation revealed features of long-standing PH, including short stature, cognitive delay, and pubertal discordance with macroorchidism. Laboratory tests showed extreme elevation of TSH and multiple anterior pituitary hormone deficiencies. Magnetic resonance imaging (MRI) revealed a large sellar mass mimicking a pituitary adenoma. Treatment was initiated with levothyroxine and physiological hydrocortisone. Follow-up at 6 months showed improvement in clinical status and TSH level and significant regression of the pituitary mass on repeat MRI, confirming the diagnosis of pituitary hyperplasia in primary hypothyroidism (PHPH). This case highlights the potential for severe, life-threatening manifestations of PH and emphasizes that a therapeutic trial with levothyroxine is the definitive approach to differentiate PHPH from a TSH-secreting pituitary adenoma, thus avoiding unnecessary surgical intervention.", "keywords": [], "year": "2026", "doi": "10.1210/jcemcr/luaf322"}, {"pmid": "41938245", "title": "Thyroid storm in a neonate and young infant: A rare but lethal cause of heart failure.", "abstract": "Neonatal heart failure has varied causes, namely left-sided obstructive lesions such as aortic stenosis, hypoplastic left heart syndrome, and coarctation of the aorta, as well as conditions such as Ebstein's anomaly, supraventricular tachycardia, atrioventricular regurgitation, and large posttricuspid shunts. However, neonatal thyrotoxicosis is a rare but potentially fatal cause of heart failure if left untreated. We present two cases of neonatal thyroid storm manifesting as heart failure and cardiogenic shock, emphasizing the diagnostic challenges, treatment strategies, and transient nature of the disease, which is mediated by maternal thyroid-stimulating hormone receptor antibodies. A literature review is also provided to highlight the clinical approach to this rare but critical condition.", "keywords": [], "year": "2025", "doi": "10.4103/apc.apc_59_25"}, {"pmid": "41870635", "title": "Virtual screening of compounds for the development of thyroid hormone analogues for potential application in cardiac regeneration.", "abstract": "Cardiovascular diseases remain the leading global cause of mortality, largely due to the limited regenerative capacity of adult cardiac tissue. Thyroid hormones, particularly tri-iodothyronine (T3), have been shown to stimulate cardiomyocyte proliferation through activation of the thyroid hormone receptor alpha (TR&#x3b1;), making this receptor a promising therapeutic target. Here we report a hierarchical and consensus, multi-level virtual screening pipeline integrating Molecular Mechanics (MM), Quantum Mechanics (QM), hybrid QM/MM calculations, and reactivity analysis based on the Fukui function to identify novel TR&#x3b1; agonists. Starting from 412&#xa0;million compounds in the ZINC15 database, physicochemical filtering, validated pharmacophore matching, and docking guided by ROC curve optimization yielded 568 candidates, from which eight compounds were selected through chemically guided visual inspection. Binding affinity was evaluated with MD/MM-PBSA, PM7, and QM/MM (B3LYP/6-31G*/CHARMM36), and complemented by Fukui reactivity mapping to rationalize protein-ligand recognition. Two ligands, including the approved drug Cetraxate, consistently showed favorable interaction energies and reactivity patterns comparable to T3, suggesting agonistic potential. This work provides a rigorous, multi-scale computational framework and identifies two mechanistically supported TR&#x3b1; agonist candidates for future experimental validation in cardiac regeneration.", "keywords": ["Molecular Docking Simulation", "Regeneration", "Ligands", "Thyroid Hormone Receptors alpha", "Humans", "Pharmacophore", "Heart", "Myocytes, Cardiac", "Thyroid Hormones", "Quantum Theory", "Molecular Dynamics Simulation", "Drug Evaluation, Preclinical", "Triiodothyronine"], "year": "2026", "doi": "10.1007/s10822-026-00787-5"}, {"pmid": "41816121", "title": "Examining the association between thyroid dysfunction and metabolic syndrome components in a setting of high atherosclerotic heart disease risk factor prevalence: A cross-sectional study from Kochi, Kerala.", "abstract": "Metabolic syndrome (MetS) and thyroid dysfunction (TD)-known atherosclerotic cardiovascular disease (ASCVD) risk factors-have each been separately documented to have significantly higher prevalence in the coastal urban population in Kochi, Kerala. This study aimed to assess the extent of overlap and association between these two entities, and their components, in such a scenario. Hospital-based cross-sectional study from December 2017 to January 2019 in a tertiary care center's General Medicine Department. Patients aged 20-80 years fulfilling the inclusion criteria were consecutively recruited after written informed consent. Baseline demographic data was collected. Waist circumference (WC) and systolic/diastolic blood pressures (SBP/DBP) were recorded. Fasting blood glucose (FBG), total cholesterol (TC), serum triglycerides (TG), and high-density lipoprotein (HDL-C) levels were determined by an automated biochemical analyzer. Triiodothyronine (T3), thyroxine (T4), and thyroid-stimulating hormone (TSH) were estimated by the electrochemiluminescence immune assay (ECLIA). MetS was diagnosed based on the modified Asian National Cholesterol Education Program (NCEP) Adult Treatment Panel III (ATP III) criteria. Pearson correlation coefficients were calculated to examine the association between MetS and TD components. Of 307 included patients with MetS (244 [79.50%] male: 63 [20.50%] female), 30.6% had TD with relative risk in females higher at 1.509 (0.989-2.356). Among the MetS components, FBG &gt; 100.0 mg/dL was the most prevalent (86.3%), followed by increased WC (83.1%), decreased HDL (61.6%), increased TG levels (57.3%), and increased SBP/DBP (46.3%). The most commonly detected TD was subclinical hypothyroidism in 82 (26.7%). Pearson correlation coefficient analysis showed no statistically significant association between any thyroid function test and MetS component. TD appears to evolve and present independently of MetS in this setting. This warrants their individual routine screening and identification, towards mitigating overall ASCVD risk.", "keywords": [], "year": "2026", "doi": "10.4103/jfmpc.jfmpc_456_25"}, {"pmid": "41792298", "title": "Subclinical myocardial dysfunction in treatment naive papillary thyroid carcinoma patients.", "abstract": "Papillary thyroid carcinoma (PTC) may contribute to cardiovascular (CV) morbidity through pro-inflammatory signaling and endothelial dysfunction, yet subclinical myocardial effects remain poorly characterized. While cardiovascular morbidity in papillary thyroid carcinoma (PTC) patients has largely been attributed to treatment-related factors such as TSH suppression, the potential contribution of the disease itself to early, subclinical cardiovascular vulnerability has not been well defined. To address this knowledge gap, we examined treatment-na&#xef;ve PTC patients for evidence of subclinical cardiovascular dysfunction. This case-control study included 36 untreated PTC patients and 20 benign nodular goiter controls. Comprehensive cardiac assessment utilized transthoracic echocardiography, tissue Doppler imaging, and two-dimensional speckle-tracking echocardiography. Serum integrin &#x3b1;v&#x3b2;3 and tumor necrosis factor-alpha (TNF-&#x3b1;) levels were quantified via enzyme-linked immunosorbent assay. Central thyroid hormone sensitivity was assessed using the Thyroid Feedback Quantile-based Index (TFQI). Compared with controls, patients with PTC exhibited evidence of subclinical myocardial functional alterations. Circulating integrin &#x3b1;v&#x3b2;3 and TNF-&#x3b1; levels were significantly higher in patients with PTC. Integrin &#x3b1;v&#x3b2;3 levels were associated with impaired GLS and diastolic dysfunction, whereas TNF-&#x3b1; showed no direct association with echocardiographic parameters. In addition, TFQI FT4 levels were increased in PTC group and demonstrated a positive correlation with circulating integrin &#x3b1;v&#x3b2;3 levels, as well as an association with impaired GLS. Treatment-naive, euthyroid patients with PTC exhibit early subclinical myocardial dysfunction despite preserved ejection fraction. Impairment in GLS, derived from echocardiographic assessment, is associated with circulating integrin &#x3b1;v&#x3b2;3 and altered central thyroid hormone sensitivity, reflecting early CV alterations that warrant confirmation in longitudinal studies.", "keywords": [], "year": "2026", "doi": "10.1038/s41598-026-41816-5"}, {"pmid": "41789311", "title": "Association of Thyroid Function With Restenosis and Long-Term Outcomes After Drug-Coated Balloon Angioplasty in Euthyroid Patients With Coronary Heart Disease.", "abstract": "The role of euthyroid hormone levels in clinical outcomes after drug-coated balloon (DCB) angioplasty in patients with coronary heart disease (CHD) remains unclear. Thus, this study aimed to explore the relationship between thyroid function and the risk of restenosis at one year, as well as the prognosis over five years in euthyroid patients with CHD following DCB angioplasty. This prospective study evaluated 189 euthyroid CHD patients who underwent successful DCB angioplasty. Coronary angiographic follow-up was performed 9-12 months post-procedure to assess the status of target lesions, with restenosis defined as &#x2265;50% reduction in luminal diameter. All patients underwent five-year clinical follow-ups, during which major adverse cardiovascular events (MACEs) were recorded. Following angiographic follow-ups, patients were categorized into two groups: those with restenosis (n = 66) and those without (n = 123). At baseline and during the follow-up, the restenosis group demonstrated significantly higher levels of thyroid-stimulating hormone (TSH), lymphocytes, hemoglobin A1c (HbA1c), lipoprotein(a), and platelet count, along with lower free triiodothyronine (FT3) levels. Multivariable logistic regression analysis revealed that the TSH levels both at the baseline (odds ratio (OR) 1.607, 95% confidence interval (CI) 1.238-2.085, p &lt; 0.001) and angiographic follow-up (OR 2.970, 95% CI 2.000-4.411, p &lt; 0.001) were independently associated with an increased risk of post-DCB restenosis. Furthermore, patients in the high TSH tertile had a 90% increased risk of MACEs during the 5-year follow-up period (hazard ratio (HR) 1.922, 95% CI 1.343-2.750, p &lt; 0.001) compared with those in the low TSH tertile. A high-normal TSH level within the euthyroid range was strongly associated with an increased 1-year restenosis risk and decreased 5-year MACE-free survival following DCB angioplasty in CHD patients.", "keywords": [], "year": "2026", "doi": "10.31083/RCM46009"}], "pubmed_query": "(\"heart\"[Title] OR \"cardiac\"[Title] OR \"myocardial\"[Title] OR \"cardiomyocyte\"[Title] OR \"left ventricle\"[Title] OR \"myocardium\"[Title]) AND (\"thyroid\"[Title] OR \"thyroid gland\"[Title] OR \"thyroid hormone\"[Title] OR \"T3\"[Title] OR \"T4\"[Title] OR \"TSH\"[Title] OR \"hypothyroidism\"[Title] OR \"hyperthyroidism\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Liver__Spleen", "source": "Liver", "target": "Spleen", "color": "#64748b", "description": "Type: Multiple Connections\nKey Players: \nNotes:\n- Gut-Spleen-Liver axis. Has key roles in liver Disease. Feedback loop between Spleen and Liver. Connected through lymphatic, vascular system and neurological pathways.\n- Likely to be present during inflammatory states.\nSources:\n- https://doi.org/10.1096/fj.202502523RR\"\n", "connection_type": "Multiple Connections", "key_players": ["Notes:"], "key_players_metabolites": ["glucose", "cholesterol", "alanine", "methionine", "amp", "adp", "glutamate", "lipoprotein", "urea", "atp", "amino acids", "prostaglandin", "triglycerides", "leukotriene", "arginine", "glutamine", "bilirubin", "hdl", "fatty acid", "amino acid", "creatinine", "triglyceride", "monoacylglycerol", "bile acid", "glycogen", "ldl", "lactate", "acetate", "fatty acids", "phospholipid", "serine", "citrate", "bile acids", "lithocholic acid", "glycerol", "deoxycholic acid"], "key_players_hormones": ["tnf", "il-6", "insulin", "tumor necrosis factor", "epo", "ghrelin", "gnrh", "gastrin", "il-4", "cortisol", "motilin", "interleukin-6", "interleukin-1", "il-10", "prolactin", "erythropoietin", "il6", "leptin", "vitamin d", "glucocorticoid", "glucagon", "norepinephrine", "growth hormone", "epinephrine", "il1b"], "key_players_proteins": ["mapk", "p38", "akt", "pparg", "srebp-1c", "cox-2", "srebp", "nos2", "pi3k", "inos", "gapdh", "erk1", "erk2", "mtor", "hk2", "foxo1", "mtorc1", "glucokinase", "nf-kb", "cox2", "ampk"], "key_players_counts_metabolites": {"methionine": 11, "cholesterol": 13, "amp": 8, "glycogen": 2, "citrate": 1, "atp": 6, "bilirubin": 3, "bile acids": 1, "hdl": 3, "lithocholic acid": 1, "leukotriene": 4, "amino acids": 5, "glucose": 31, "fatty acid": 3, "glutamate": 7, "ldl": 2, "lactate": 2, "prostaglandin": 5, "arginine": 4, "amino acid": 3, "creatinine": 3, "lipoprotein": 7, "glycerol": 1, "triglycerides": 5, "acetate": 2, "urea": 7, "triglyceride": 3, "fatty acids": 2, "phospholipid": 2, "deoxycholic acid": 1, "monoacylglycerol": 3, "adp": 8, "glutamine": 4, "serine": 2, "bile acid": 3, "alanine": 13}, "key_players_counts_hormones": {"tnf": 37, "glucocorticoid": 1, "gastrin": 5, "interleukin-1": 4, "glucagon": 1, "il-4": 5, "norepinephrine": 1, "cortisol": 5, "growth hormone": 1, "erythropoietin": 3, "il6": 3, "insulin": 22, "vitamin d": 2, "il-10": 4, "tumor necrosis factor": 14, "epinephrine": 1, "leptin": 3, "il1b": 1, "motilin": 5, "il-6": 24, "gnrh": 8, "ghrelin": 10, "epo": 13, "prolactin": 4, "interleukin-6": 5}, "key_players_counts_proteins": {"mapk": 14, "hk2": 1, "gapdh": 3, "nos2": 5, "pi3k": 4, "foxo1": 1, "mtorc1": 1, "p38": 14, "pparg": 8, "glucokinase": 1, "srebp-1c": 7, "nf-kb": 1, "akt": 10, "cox2": 1, "cox-2": 7, "erk1": 3, "ampk": 1, "inos": 4, "mtor": 2, "erk2": 3, "srebp": 7}, "notes": "- Gut-Spleen-Liver axis. Has key roles in liver Disease. Feedback loop between Spleen and Liver. Connected through lymphatic, vascular system and neurological pathways.\n- Likely to be present during inflammatory states.", "sources": ["https://doi.org/10.1096/fj.202502523RR\""], "ai_description": "The liver-spleen axis is mediated by complex interplay of hormonal and metabolic signals, with the liver playing a central role in regulating splenic function. The release of bile acids from the liver acts as a key signaling molecule, binding to specific receptors on splenic macrophages, thereby modulating their polarization and immune response [1]. Conversely, the spleen produces various cytokines and chemokines that are released into the circulation, influencing liver metabolism and function [2]. The balance between these opposing signals is crucial for maintaining homeostasis in this axis, with disruptions leading to various pathological conditions such as gastralgia and chronic fatigue syndrome [3,4].", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42272668", "title": "Study on diagnostic models for insomnia and gastralgia with Liver-Spleen Disharmony Syndrome based on machine learning.", "abstract": "The prevalence of insomnia and gastralgia has recently increased. Traditional Chinese Medicine (TCM) offers unique advantages in treating these conditions. Accurate syndrome differentiation is essential for effective treatment. However, as a common syndrome in TCM for these conditions, the diagnostic criteria for Liver-Spleen Disharmony Syndrome (LSDS) currently lack uniformity. To develop a machine learning-based diagnostic model for LSDS in patients with insomnia and/or gastralgia. In this prospective observational study, clinical data from 575 patients with insomnia and/or gastralgia were collected using structured scales. The data included demographic information and clinical symptoms related to LSDS. Six machine learning algorithms-Chi-square Automatic Interaction Detector (CHAID), C5.0 decision tree, Back-Propagation Neural Network (BPNN), Radial Basis Function (RBF) network, Bayesian Network (BN), and Binomial Logistic Regression Analysis (BLRA)-were employed to construct diagnostic models for LSDS. Model performance was evaluated using receiver operating characteristic (ROC) curves, confusion matrices, and precision-recall (P-R) curves. The CHAID model outperformed all others, achieving an area under the ROC curve (AUC) of 0.889 (95% CI: 0.861-0.914), accuracy (AC) of 0.960, sensitivity (SE) of 0.972, specificity (SP) of 0.977, and an F1 score of 0.955. Prediction of variable importance in the CHAID model indicated that depression or irritability was the most important symptom variable for LSDS, followed by epigastric fullness, distending pain in hypochondrium, poor excretion of stool, diarrhea with abdominal pain, and excessive flatus. The C5.0 model ranked second (AUC = 0.797, accuracy = 0.958, F1 = 0.953). Other models showed progressively lower performance: BLRA (AUC = 0.648, accuracy = 0.947, F1 = 0.942), BPNN (AUC = 0.697, accuracy = 0.913, F1 = 0.901), BN (AUC = 0.538, accuracy = 0.944, F1 = 0.935), and RBF (AUC = 0.569, accuracy = 0.824, F1 = 0.810). We successfully developed a machine learning-based diagnostic model for Liver-Spleen Disharmony Syndrome (LSDS) in patients with insomnia and gastralgia. The CHAID model demonstrated superior performance and shows promise as an exploratory tool to assist clinicians; however, independent external validation is required before it can be considered for clinical application.", "keywords": [], "year": "2026", "doi": "10.3389/fmed.2026.1782578"}, {"pmid": "42264953", "title": "[Pathological changes and macrophage polarization in the liver and spleen of mice infected with Angiostrongylus cantonensis ].", "abstract": "To investigate the temporal changes in pathological damage and macrophage polarization in liver and spleen tissues of mice infected with Angiostrongylus cantonensis , and to preliminarily unravel the peripheral immune responses during the early stage of A. cantonensis infection. Forty female BALB/c mice at ages of 6 to 8 weeks were randomly divided into four groups, including the control group and 7-, 14-, and 21-day infection groups, with 10 mice in each group. Each mouse in the infection groups was inoculated with 30 third-stage (L3) larvae of A. cantonensis by oral gavage, and five mice were randomly selected from each infection group on days 7, 14, and 21 post-infection, while mice in the control group were given the same volume of physiological saline and five mice were randomly selected from the control group on the day of oral gavage. Mouse liver and spleen tissues were sampled. The histopathological changes of mouse liver and spleen tissues were observed using hematoxylin and eosin (HE) staining, and the percentage of positive staining area and the co-localization positive rates of the macrophage surface antigens F4/80, CD86, and CD206 were quantified in mouse liver and spleen tissues using immunohistochemical and immunofluorescence staining. In addition, five mice were collected from each infection group on days 7, 14, and 21 post-infection, and five mice were collected from the control group on the day of oral gavage. Mouse liver and spleen tissues were sampled for detection of macrophage markers CD86 and CD206 and macrophage phenotyping using flow cytometry, and the expression of M1 macrophage markers, including inducible nitric oxide synthase ( Nos2 ), tumor necrosis factor-&#x3b1; ( TNF-&#x3b1; ), interleukin-1&#x3b2; ( IL-1&#x3b2; ) and M2 markers, including arginase 1 ( Arg1 ), mannose receptor C-type 1 ( Mrc1 ) and chitinase-like protein 3 ( Chil3 ) was quantified in mouse liver and spleen tissues using real-time quantitative PCR (RT-qPCR) assay. Proliferative lesions of the hepatocyte were observed in mouse liver tissues and the follicular structures of the mouse spleen white pulp were disrupted 21 days post-infection with A. cantonensis . Immunohistochemical staining showed that there were significant differences in the percentages of F4/80, CD86 and CD206 positive staining areas in the liver and spleen tissues among the four groups of mice ( F = 242.40, 197.14, 183.19, 157.65, 242.35 and 146.24; all P values &lt; 0.001), and the percentages of positive staining in the liver and spleen tissues of mice in the 14-day infection group [(4.45 &#xb1; 0.51)%, (3.74 &#xb1; 0.67)%, (8.32 &#xb1; 0.72)%, (16.56 &#xb1; 1.14)%, (11.62 &#xb1; 0.52)%, and (8.29 &#xb1; 0.72)%, respectively] and the 21-day infection group [(3.70 &#xb1; 0.11)%, (3.22 &#xb1; 0.43)%, (11.53 &#xb1; 1.03)%, (12.59 &#xb1; 1.05)%, (9.02 &#xb1; 0.83)%, and (11.67 &#xb1; 1.10)%, respectively] were higher than in the control group [(0.35 &#xb1; 0.16)%, (0.40 &#xb1; 0.02)%, (0.93 &#xb1; 0.05)%, (2.78 &#xb1; 0.26)%, (2.33 &#xb1; 0.20)%, and (1.85 &#xb1; 0.20)%, respectively] (all P values &lt; 0.05). Immunofluorescence staining showed significant differences in the positive rates of F4/80 co-localization with CD86 and CD206 in mouse liver and spleen tissues among the four groups ( F = 24.42, 25.28, 54.51 and 130.55; all P values &lt; 0.001). Flow cytometry detected significant differences in the proportions of CD86 + and CD206 + macrophages in mouse liver and spleen tissues among the four groups ( F = 67.98, 18.41, 29.77, 172.80; all P values &lt; 0.001), and the proportions of CD206 + macrophages in the liver and spleen of the 21-day infection group were significantly higher than those in the control group [(9.25 &#xb1; 2.55)% vs (3.83 &#xb1; 0.72)%, and (4.22 &#xb1; 0.56)% vs (0.47 &#xb1; 0.18)%, respectively] (both P values &lt; 0.05). In addition, RT-qPCR assay quantified significant differences in the relative mRNA expression of M1 macrophage markers ( IL-1&#x3b2; , TNF-&#x3b1; and Nos2 ) and M2 macrophage markers ( Arg1 , Chil3 and Mrc1 ) in mouse liver and spleen tissues among the four groups ( F = 41.30, 31.82, 199.33, 19.96, 62.01, 119.76, 23.67, 95.90, 72.27, 82.59, 123.41 and 29.75; all P values &lt; 0.05). A. cantonensis infection may cause progressive pathological damage in mouse liver and spleen tissues, accompanied by dynamic temporal changes in macrophage polarization. M1 macrophage polarization predominates at the early stage of A. cantonensis infection and shifts towards M2 polarization at the later stages, suggesting that M2 polarization may participate in immune regulation at late stages of A. cantonensis infection by suppressing excessive inflammatory responses and promoting tissue repair. &#xff3b;&#x6458;&#x8981;&#xff3d; &#x76ee;&#x7684; &#x89c2;&#x5bdf;&#x5e7f;&#x5dde;&#x7ba1;&#x5706;&#x7ebf;&#x866b;&#x611f;&#x67d3;&#x5c0f;&#x9f20;&#x6a21;&#x578b;&#x4e2d;&#x5c0f;&#x9f20;&#x809d;&#x813e;&#x7ec4;&#x7ec7;&#x75c5;&#x7406;&#x635f;&#x4f24;&#x53ca;&#x5de8;&#x566c;&#x7ec6;&#x80de;&#x6781;&#x5316;&#x7684;&#x65f6;&#x5e8f;&#x6027;&#x53d8;&#x5316;, &#x521d;&#x6b65;&#x63ed;&#x793a;&#x5e7f;&#x5dde;&#x7ba1;&#x5706;&#x7ebf;&#x866b;&#x611f;&#x67d3;&#x65e9;&#x671f;&#x5916;&#x5468;&#x514d;&#x75ab;&#x53cd;&#x5e94;&#x3002; &#x65b9;&#x6cd5; 40&#x53ea;6 ~ 8&#x5468;&#x9f84;&#x96cc;&#x6027;BALB/c&#x5c0f;&#x9f20;&#x968f;&#x673a;&#x5206;&#x4e3a;&#x5bf9;&#x7167;&#x7ec4;&#x53ca;&#x611f;&#x67d3;7&#x3001;14&#x3001;21 d&#x7ec4;, &#x6bcf;&#x7ec4;10&#x53ea;&#x3002;&#x5404;&#x611f;&#x67d3;&#x7ec4;&#x6bcf;&#x53ea;&#x5c0f;&#x9f20;&#x704c;&#x80c3;&#x611f;&#x67d3;30&#x6761;&#x5e7f;&#x5dde;&#x7ba1;&#x5706;&#x7ebf;&#x866b;&#x2162;&#x671f;&#x5e7c;&#x866b;, &#x4e8e;&#x611f;&#x67d3;7&#x3001;14&#x3001;21 d&#x5404;&#x968f;&#x673a;&#x9009;&#x53d6;5&#x53ea;&#x5c0f;&#x9f20;; &#x5bf9;&#x7167;&#x7ec4;&#x4ee5;&#x7b49;&#x91cf;&#x751f;&#x7406;&#x76d0;&#x6c34;&#x704c;&#x80c3;, &#x4e8e;&#x704c;&#x80c3;&#x5f53;&#x5929;&#x968f;&#x673a;&#x9009;&#x53d6;5&#x53ea;&#x5c0f;&#x9f20;&#x3002;&#x6536;&#x96c6;&#x5404;&#x7ec4;&#x6240;&#x9009;&#x53d6;&#x5c0f;&#x9f20;&#x7684;&#x809d;&#x3001;&#x813e;&
