rs1", "jnk", "insulin receptor", "lipoprotein lipase", "foxo", "pgc-1alpha", "mapk", "rxr", "mtorc1", "fas", "pgc-1", "hexokinase", "ucp1", "mtorc2", "pparg", "tfam", "nfkb", "irs-1", "ppara", "acc", "atgl"], "key_players_counts_metabolites": {"cholesterol": 20, "ketone bodies": 2, "amp": 23, "glycogen": 3, "palmitate": 4, "citrate": 6, "thromboxane": 2, "atp": 25, "bile acids": 1, "hdl": 1, "beta-hydroxybutyrate": 1, "amino acids": 4, "glucose": 59, "fatty acid": 11, "leucine": 9, "ldl": 2, "lactate": 11, "free fatty acids": 5, "prostaglandin": 1, "arginine": 2, "butyrate": 1, "pyruvate": 2, "free fatty acid": 2, "amino acid": 8, "valine": 1, "lipoprotein": 3, "glycerol": 5, "triglycerides": 5, "ffa": 4, "creatine": 5, "oleate": 3, "triglyceride": 3, "fatty acids": 23, "nadh": 1, "phospholipid": 9, "adp": 5, "nadph": 6, "serine": 5, "alanine": 1, "linoleate": 1}, "key_players_counts_hormones": {"thyroid hormone": 291, "cck": 2, "glucocorticoid": 7, "thyroxine": 72, "interleukin-1": 1, "igf-1": 4, "angiotensin ii": 4, "oxytocin": 3, "norepinephrine": 3, "osteocalcin": 2, "fndc5": 6, "growth hormone": 5, "thyroid hormones": 148, "renin": 5, "estrogen": 2, "adiponectin": 1, "insulin": 97, "t3": 261, "vitamin d": 10, "visfatin": 1, "calcitriol": 1, "tumor necrosis factor": 1, "irisin": 9, "triiodothyronine": 90, "leptin": 12, "il1b": 1, "corticosterone": 5, "ghrelin": 1, "tgf-beta": 9, "tsh": 103, "thyrotropin": 30, "t4": 44, "angiotensin": 12, "interleukin-6": 1}, "key_players_counts_proteins": {"ucp1": 1, "mapk": 2, "pgc-1a": 12, "jnk": 3, "rxr": 2, "pi3k": 5, "foxo1": 6, "mtorc1": 2, "p38": 18, "mtorc2": 1, "pparg": 1, "glut4": 22, "fas": 2, "tfam": 1, "nfkb": 1, "insulin receptor": 3, "akt": 21, "irs-1": 1, "lipoprotein lipase": 3, "foxo": 3, "cd36": 12, "irs1": 5, "erk1": 6, "ppara": 1, "pgc-1": 2, "ampk": 21, "ucp3": 25, "acc": 1, "hexokinase": 2, "pgc-1alpha": 3, "mtor": 8, "atgl": 1}, "notes": "- TH  regulates Thermogenesis, energy utilization by increasing the basal metabolic rate and regulate lipid and glucose metabolism. \nThermogenesis occurs to a large part in muscle.", "sources": ["doi: 10.1177/2042018820917869", "https://doi.org/10.1152/physrev.00030.2013", "doi: 10.4093/dmj.2017.41.5.327."], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42316864", "title": "Voltage-gated potassium channels mediate thyroid hormone control of skeletal muscle excitability.", "abstract": "Thyroid hormone (TH) is a critical regulator of skeletal muscle (SkM) physiology, influencing muscle development, metabolism and contractile function. However, the molecular mechanisms by which TH modulates muscle excitability and contraction remain incompletely defined. Here, we investigated the role of TH signalling in regulating SkM electrical activity through transcriptional control of ion channels. Using RNA sequencing of gastrocnemius muscles from wild-type (CTR), muscle-specific deiodinase type 2-deficient (mD2KO), and thyroid hormone receptor &#x3b1;/&#x3b2;-deficient (TR&#x3b1;KO/TR&#x3b2;KO) mice, we identified a shared transcriptional signature of TH deficiency characterized by the dysregulation of multiple ion channel genes. Notably, two potassium (K + ) channel-related genes Kcnh2 and Kcnk1, which encode for mERG1 and TWIK-1, respectively, were downregulated, while Kcnab1 was consistently upregulated in both mD2KO and TR&#x3b1;KO/TR&#x3b2;KO muscles compared with CTR, suggesting a common TH-dependent regulatory mechanism. To investigate whether such transcriptional remodelling of K + channels translates into functional changes, we assessed the direct effects of TH on K + currents using patch-clamp recordings in differentiated C2C12 cells exposed to TH as a model of physiological TH signalling. Interestingly, we found that TH treatment significantly increased mERG current density in differentiated C2C12 cells, supporting a role for TH signalling in the modulation of SkM electrical activity. Collectively, these results provide a mechanistic framework through which TH contributes to the regulation of muscle electrical stability, with potential implications for thyroid-related myopathies. KEY POINTS: Thyroid hormone (TH) regulates skeletal muscle excitability through transcriptional modulation of potassium (K + ) channel-related genes. RNA-seq analyses identified a TH-dependent signature with downregulation of Kcnh2 (mERG1) and Kcnk1 (TWIK-1), and upregulation of Kcnab1 under TH-deficient conditions. Chromatin immunoprecipitation demonstrates direct binding of TH receptors to regulatory regions of these channel genes. Electrophysiological recordings in differentiated C2C12 cells show that TH treatment increases mERG current density. This coordinated remodelling of K + channel expression provides a mechanistic basis for TH-driven optimization of muscle electrical stability and contractile performance. These findings support a role for TH signalling in the regulation of skeletal muscle electrical stability, with potential implications for thyroid-related myopathies.", "keywords": [], "year": "2026", "doi": "10.1113/JP291418"}, {"pmid": "42173706", "title": "Thyroid hormones as permissive regulators of skeletal muscle protein accretion and oxidative capacity: Implications for resistance and endurance training.", "abstract": "Thyroid hormones (THs) are fundamental regulators of skeletal muscle energy metabolism and protein turnover. Instead of directly stimulating muscle growth, they create the intracellular environment required for effective adaptation to exercise. Adequate TH availability supports mitochondrial integrity, ribosome biogenesis, and coordinated protein turnover, thereby enabling the translation of anabolic signaling into structural adaptation and remodeling. Accordingly, reduced translational efficiency during hypothyroidism may blunt hypertrophic responses. In contrast, hyperthyroidism accelerates proteolytic pathways and compromises net protein gain despite elevated turnover. Training modalities determine the physiological outcome within this endocrine context, with endurance exercise primarily enhancing oxidative remodeling, while resistance training, when sufficient biosynthetic capacity is present, can stimulate myofibrillar accretion. Reduced energy availability lowers T3 concentrations and may attenuate adaptive efficiency across both modalities. Overall, thyroid status emerges as a critical determinant of muscle remodeling capacity, underscoring the clinical relevance of thyroid assessment in exercise-based interventions.", "keywords": [], "year": "2026", "doi": "10.1016/j.beem.2026.102110"}, {"pmid": "42131420", "title": "Clinical efficacy of parathyroid autotransplantation into the forearm muscle in thyroid surgery: a retrospective cohort study on functional restoration.", "abstract": "This study was conducted to evaluate the clinical efficacy of autologous parathyroid transplantation into the forearm brachioradialis muscle during thyroid surgery and analyze the timing of graft function recovery. A total of 52 patients undergoing thyroid surgery with autologous parathyroid transplantation were selected. Serum parathyroid hormone (PTH) levels were measured at various postoperative intervals, and instances of hypoparathyroidism were recorded. Postoperative PTH levels on the transplant side were significantly higher than on the non-transplant side from week 1 to 1 year. Effective graft rates were 1.9% on day 1, 40.4% at week 1, 84.6% at 1 month, and stabilized at around 73% after 1 year. Transient hypoparathyroidism was observed in 17.3% of patients, with no permanent cases. Autologous parathyroid transplantation into the forearm brachioradialis muscle effectively preserves parathyroid function, with grafts regaining optimal function within 2-3 months and the graft still having good secretory function 1 year after surgery.", "keywords": [], "year": "2026", "doi": "10.4174/astr.2026.110.5.311"}, {"pmid": "41883468", "title": "Dynamic Monitoring of Thyroid-Stimulating Hormone Receptor Antibody and Extraocular Muscle Thickness: A Clinical Risk Stratification Model for Recurrence Risk Post-Glucocorticoid Therapy in TED Patients.", "abstract": "To develop a clinical risk stratification model for thyroid eye disease (TED) recurrence post-glucocorticoid therapy by integrating dynamic thyroid-stimulating hormone receptor antibody (TRAb), extraocular muscle (EOM) thickness, and baseline clinical-biochemical indicators, with only internal validation. A single-center retrospective cohort study of 426 TED patients (2016-2023) was conducted. Recurrence (12-month follow-up) was adjudicated by two ophthalmologists. LASSO regression screened predictors, and multiple machine learning models were built and validated via 10-fold cross-validation. Model performance was assessed by AUC and decision curve analysis (DCA). 98 patients (23.0%) had recurrence, with 89% occurring after 6 months post-treatment. Recurrent patients showed slower TRAb decline and persistent EOM thickening. 15 key predictors were identified, and the random forest (RF) model had the best performance (AUC=0.92, 95% CI: 0.88-0.95; accuracy=0.87) with consistent subgroup results (Events Per Variable=6.5, potential overfitting risk). This internally validated risk stratification model identifies factors associated with TED recurrence post-glucocorticoid therapy, with dynamic TRAb and EOM thickness as key indicators. The findings are preliminary due to no external validation and temporal limitations, and prospective multi-center studies are required before clinical implementation to inform individualized follow-up.", "keywords": [], "year": "2026", "doi": "10.2147/IJGM.S590217"}, {"pmid": "41869726", "title": "Hypothyroidism impairs skeletal muscle regeneration after injury by altering myogenic and nonmyogenic pathways.", "abstract": "Thyroid hormone signaling is an essential regulator of skeletal muscle development, function, and metabolism, yet the specific signaling pathways required for muscle regeneration are not yet defined. We used scRNA-seq and the FUCCI (fluorescent ubiquitination-based cell cycle indicator) reporter mouse model to examine how hypothyroidism impacts repair processes after cardiotoxin-induced injury in mice. During regeneration, and up to 2 months after injury, hypothyroid muscles displayed smaller myofibers and a shift to slower oxidative fiber types. scRNA-seq of tibialis anterior muscle during regeneration revealed that hypothyroidism reduced myogenic-lineage diversity. Cell cycle analysis confirmed delayed cell cycle progression at 5 and 14 days after injury, with skeletal muscle stem cells stalled at the G1/S transition, hindering differentiation. Transcriptomic data revealed altered nonmyogenic dynamics, including elevated activated fibro-adipogenic progenitors (FAPs) early in repair and persistent proinflammatory macrophages. Integrative regulon and ligand-receptor analysis further demonstrated that triiodothyronine acted through dual modes: a direct transcriptional control of myogenic cell cycle and oxidative programs and an indirect paracrine remodeling mediated by FAP and immune signaling networks. This study identified what we believe to be novel effects of hypothyroidism on myogenic heterogeneity and impaired tissue repair, offering insights into muscle-wasting mechanisms relevant to hypothyroidism-associated myopathy and sarcopenia.", "keywords": ["Hypothyroidism", "Muscle, Skeletal", "Regeneration", "Skeletal Muscle Enlargement", "G1 Phase Cell Cycle Checkpoints", "Muscular Diseases", "Male", "Animals", "Mice"], "year": "2026", "doi": "10.1172/jci.insight.197761"}], "pubmed_query": "(\"skeletal muscle\"[Title] OR \"muscle\"[Title] OR \"myocyte\"[Title] OR \"myofiber\"[Title] OR \"sarcopenia\"[Title] OR \"muscular\"[Title]) AND (\"thyroid\"[Title] OR \"thyroid gland\"[Title] OR \"thyroid hormone\"[Title] OR \"T3\"[Title] OR \"T4\"[Title] OR \"TSH\"[Title] OR \"hypothyroidism\"[Title] OR \"hyperthyroidism\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Muscle__WAT", "source": "Muscle", "target": "WAT", "color": "#64748b", "description": "“Type: Hormonal connection\nKey Players: Insulin\nNotes:\n- Insulin produced by the pancreas leads to glucose uptake in both WAT and Muscle as both express GLUT4.\n- Both organs are large glucose sinks.\nSources:\n- doi: 10.1074/jbc.REV119.008351”", "connection_type": "Hormonal connection", "key_players": ["Insulin"], "key_players_metabolites": ["Insulin", "glucose", "fatty acid", "fatty acids", "triglyceride", "amp", "cholesterol", "arginine", "fructose", "triglycerides", "succinate", "glycogen", "diacylglycerol", "pyruvate", "acetate", "sphingolipid", "oxaloacetate", "propionate", "palmitate", "amino acids", "creatinine", "lipoprotein", "lysophosphatidylcholine", "uric acid", "glutamine", "hdl", "lactate", "free fatty acid", "glycerol", "alanine", "atp", "lithocholic acid", "glutamate", "leucine", "ldl", "free fatty acids", "butyrate", "amino acid", "ceramide", "ffa", "nadh", "adp", "nadph", "serine"], "key_players_hormones": ["Insulin", "adiponectin", "fndc5", "irisin", "leptin", "il-6", "tnf", "glp-1", "interleukin-6", "glucagon", "t3", "vitamin d", "triiodothyronine", "growth hormone", "angiotensin", "natriuretic peptide", "pyy", "thyroid hormone", "testosterone", "aldosterone", "igf-1", "angiotensin ii", "osteocalcin", "omentin", "il6", "renin", "apelin", "resistin", "chemerin", "visfatin", "calcitriol", "corticosterone", "ghrelin", "thyrotropin"], "key_players_proteins": ["Insulin", "ampk", "pgc-1", "glut4", "ucp1", "akt", "sirt1", "dgat2", "ucp3", "mtor", "lxr", "hsl", "fabp", "pi3k", "mtorc1", "irs-1", "cd36", "mapk", "fatp4", "foxo1", "ucp2", "hif1a", "pparg", "fas", "irs-2", "adiponectin receptor", "glut1", "glp-1 receptor", "hormone-sensitive lipase", "insulin receptor", "chrebp", "adipose triglyceride lipase", "cox2", "lpl", "ppara", "hexokinase", "sirt3", "atgl", "srebp"], "key_players_counts_metabolites": {"cholesterol": 8, "diacylglycerol": 4, "sphingolipid": 3, "oxaloacetate": 3, "propionate": 3, "amp": 9, "glycogen": 5, "palmitate": 3, "atp": 1, "hdl": 2, "lithocholic acid": 1, "amino acids": 3, "glucose": 104, "fatty acid": 47, "glutamate": 1, "leucine": 1, "ldl": 1, "lactate": 2, "free fatty acids": 1, "arginine": 8, "butyrate": 1, "pyruvate": 4, "free fatty acid": 2, "amino acid": 1, "creatinine": 3, "lipoprotein": 3, "ceramide": 1, "glycerol": 2, "lysophosphatidylcholine": 3, "triglycerides": 6, "ffa": 1, "acetate": 4, "uric acid": 3, "triglyceride": 11, "fatty acids": 34, "fructose": 8, "succinate": 6, "nadh": 1, "adp": 1, "glutamine": 3, "nadph": 1, "serine": 1, "alanine": 2}, "key_players_counts_hormones": {"thyroid hormone": 1, "tnf": 8, "testosterone": 1, "natriuretic peptide": 2, "pyy": 2, "aldosterone": 1, "glucagon": 5, "igf-1": 1, "angiotensin ii": 1, "osteocalcin": 1, "fndc5": 14, "growth hormone": 3, "omentin": 1, "il6": 1, "renin": 1, "adiponectin": 18, "insulin": 158, "t3": 4, "vitamin d": 4, "apelin": 1, "resistin": 1, "chemerin": 1, "visfatin": 1, "calcitriol": 1, "irisin": 14, "triiodothyronine": 4, "leptin": 12, "glp-1": 7, "corticosterone": 1, "il-6": 10, "ghrelin": 1, "thyrotropin": 1, "angiotensin": 3, "interleukin-6": 6}, "key_players_counts_proteins": {"hsl": 2, "dgat2": 3, "ucp1": 10, "mapk": 1, "fabp": 2, "fatp4": 1, "pi3k": 2, "foxo1": 1, "mtorc1": 2, "ucp2": 1, "hif1a": 1, "pparg": 1, "glut4": 13, "fas": 1, "irs-2": 1, "adiponectin receptor": 1, "glut1": 1, "glp-1 receptor": 1, "hormone-sensitive lipase": 1, "insulin receptor": 1, "akt": 7, "chrebp": 1, "irs-1": 2, "adipose triglyceride lipase": 1, "cox2": 1, "lpl": 1, "cd36": 2, "ppara": 1, "pgc-1": 18, "ampk": 24, "ucp3": 3, "sirt1": 6, "hexokinase": 1, "mtor": 3, "sirt3": 1, "atgl": 1, "lxr": 3, "srebp": 1}, "notes": "- Insulin produced by the pancreas leads to glucose uptake in both WAT and Muscle as both express GLUT4.\n- Both organs are large glucose sinks.", "sources": ["doi: 10.1074/jbc.REV119.008351”"], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42282532", "title": "FAP-intrinsic Hedgehog signaling controls intramuscular adipogenesis, fibrosis, and myofiber regeneration.", "abstract": "Fibro/adipogenic progenitors (FAPs) are multipotent stromal cells that support myofiber regeneration, but can also give rise to intramuscular adipose tissue (IMAT) and fibrotic scar tissue. While the Hedgehog pathway suppresses FAP adipogenesis and promotes myofiber repair through ligand Desert Hedgehog, the key cell type that senses this signal has remained unclear. Here, we demonstrate through FAP-specific deletion of the Hedgehog signal transducer Smoothened that FAPs are the primary Hedgehog-responding cells during muscle regeneration. Loss of Smoothened in FAPs increases IMAT, causes persistent fibrosis, reduces the Hedgehog-dependent effectors TIMP3 and GDF10, and impairs myofiber regeneration. FAPs lacking Smoothened also fail to support in vitro myoblast differentiation and fusion as efficiently as control FAPs, showing that Hedgehog signaling helps establish a pro-myogenic FAP state early after injury. Pharmacological Hedgehog activation via the Smoothened agonist SAG fails to rescue adipocyte accumulation or myofiber regeneration when FAPs lack Smoothened. Together, these findings provide direct genetic evidence that FAPs are the primary cellular mediators of Hedgehog signaling in muscle and establish FAP Hedgehog signaling competence as a key determinant of regenerative outcome and a target for restoring muscle repair in disease.", "keywords": [], "year": "2026", "doi": "10.64898/2026.05.29.727896"}, {"pmid": "42249335", "title": "The inverse association between skeletal muscle mass to visceral fat ratio (SVR) and sleep disturbance: the mediating role of inflammation and aging acceleration.", "abstract": "A growing body of evidence has linked body composition to poor sleep quality. The skeletal muscle mass-to-visceral fat ratio (SVR) is a valid indicator of body composition that integrates appendicular skeletal muscle mass and visceral fat, reflecting the severity of sarcopenic obesity (SO). However, the association between SVR and sleep disturbance has not been well established. This study aimed to investigate the relationship between SVR and sleep disturbance among U.S. adults, along with the mediating roles of inflammation and biological aging. A total of 1,564 participants from the National Health and Nutrition Examination Survey (NHANES) with complete data on SVR, sleep parameters, and other essential covariates were included. Weighted multivariable logistic regression models, subgroup and interaction analyses, and restricted cubic spline (RCS) analyses were used to explore the association between SVR and sleep disturbance. Furthermore, mediation analysis was used to explore the mediating role of aggregate index of systemic inflammation (AISI), C-reactive Protein-Albumin-Lymphocyte index (CALLY), and Phenotypic age acceleration (PhenoAgeAccel) in this association. 15.22% of participants reported sleep disturbance. After full covariate adjustment, SVR was inversely associated with sleep disturbance: each unit increase in SVR was linked to a 91.1% lower risk (OR&#x2009;=&#x2009;0.089, 95% CI: 0.024-0.334), and the highest versus lowest SVR quartile showed a 57.4% reduced risk (OR&#x2009;=&#x2009;0.426, 95% CI: 0.241-0.752; P-trend&#x2009;=&#x2009;0.006). RCS analyses confirmed a significant linear dose-response relationship between SVR and sleep disturbance (P-nonlinearity&#x2009;=&#x2009;0.907). Subgroup analyses and interaction tests showed a more pronounced association in females (OR&#x2009;=&#x2009;0.42 vs. males: OR&#x2009;=&#x2009;0.01) and individuals with depression (OR&#x2009;=&#x2009;0.16 vs. non-depressed individuals: OR&#x2009;&lt;&#x2009;0.01). Additionally, after adjusting for alternative mediators in sensitivity analyses, AISI, CALLY, and PhenoAgeAccel statistically mediated 10.64%, 36.43%, and 15.99% of the association, respectively (all P&#x2009;&lt;&#x2009;0.05). SVR was inversely associated with sleep disturbance, with inflammation and biological aging statistically explaining a significant portion of this association. Further studies with longitudinal or interventional designs are warranted to clarify the causal links of body composition with inflammation, biological aging and sleep disturbance given the cross-sectional design. Not applicable.", "keywords": [], "year": "2026", "doi": "10.1186/s12888-026-08248-x"}, {"pmid": "42231158", "title": "Microbiome and metabolome patterns centered on cancer cachexia link skeletal muscle and adipose tissue depletion to clinical outcomes in locally advanced rectal cancer.", "abstract": "Cancer cachexia is a multifactorial syndrome characterized by involuntary weight loss and tissue wasting; it was associated with adverse survival outcomes in patients with locally advanced rectal cancer (LARC). However, its biological basis and links to the gut microbiome, circulating metabolites, and body composition in LARC remain unclear. We conducted a retrospective cohort study of 198 LARC patients, including 30 with cachexia. Gut microbial profiles were characterized using 16S rRNA sequencing with predictive functional inference. Serum metabolites were analyzed via orthogonal partial least squares-discriminant analysis (OPLS-DA) and validated by ROC analysis. Associations among microbial taxa, metabolites, body composition, and clinical indices were assessed using correlation analyses. Survival outcomes were evaluated by Kaplan-Meier curves and multivariate Cox regression models, with subgroup and sensitivity analyses performed to validate the robustness of findings. Cachectic patients exhibited marked reductions in BMI, circulating triglycerides and cholesterol, as well as visceral and subcutaneous adipose tissue (VAT and SAT) and skeletal muscle area (SMA) (all P&#x2009;&lt;&#x2009;0.05). Microbial &#x3b1;- and &#x3b2;-diversity were comparable between groups, yet cachexia was associated with selective enrichment of Peptostreptococcaceae, Erysipelotrichaceae, Veillonella, and Fusobacterium, alongside depletion of Faecalibacterium, Roseburia, and Prevotella. Notably, UBA1819 (Ruminococcaceae) was enriched in cachectic patients and inversely correlated with Faecalibacterium, hemoglobin, and albumin, suggesting intra-family functional divergence. Specific cachexia-enriched taxa, including Veillonella and Erysipelotrichaceae, were inversely associated with SMA and VAT, whereas butyrate-producing genera showed positive correlations with muscle preservation. Functional predictions highlighted enrichment of N-acetylneuraminate degradation in cachexia versus TCA cycle pathways in non-cachectic patients. High abundance of Peptostreptococcaceae and Erysipelotrichaceae was associated with poorer overall survival. Metabolomic profiling identified lithocholic acid, cortisone, 3,5,9-trihydroxyergost-7-en-6-one, and 5,6-DHET as cachexia-associated metabolites (AUC 0.65-0.78), which formed cross-domain correlations with microbial taxa and host tissue measures. Our findings reveal a coordinated linkage between the gut microbiome, metabolome, and host body composition in LARC cachexia. Specifically, selective microbial remodeling and metabolite perturbations are closely coupled with skeletal muscle and adipose tissue depletion and adverse survival. These results provide a conceptual foundation for future mechanistic and translational studies exploring the host-microbiome-metabolic interactions in cancer cachexia.", "keywords": [], "year": "2026", "doi": "10.1186/s12866-026-05171-9"}, {"pmid": "42226237", "title": "Purple sweet potato (Ipomoea batatas L. Lam) leaves extract prevents weight gain and lipotoxicity in mice fed a high-fat diet by increasing metabolic flexibility and oxidative metabolism in skeletal muscle and brown adipose tissue.", "abstract": "Purple sweet potato leaves are a rich source of caffeoylquinic acids (CQA) and related compounds with potential metabolic benefits. Our previous research demonstrated that 5-CQA and 3,4-diCQA increase mitochondrial respiration in primary hepatocytes. To explore the translational relevance of purple sweet potato leaves extract (PSPLE) in the management and treatment of obesity, we evaluated the effect of PSPLE in C57BL/6 mice fed a high-fat (HF) diet supplemented with either 1% or 3% PSPLE (w/w) and assessed insulin secretion in INS-1E cells. PSPLE phenolic compounds were identified by LC-MS. Male C57BL/6J mice were fed (1) a Control, (2) high-fat (HF) diet, (3) HF diet supplemented with 1% and (4) HF diet supplemented with 3% of PSPLE for 15 weeks. Body composition, energy expenditure, glucose and insulin tolerance, serum metabolites, and tissue morphology were evaluated. AMPK activation was analyzed in the liver and skeletal muscle. Complementary, &#x3b2;-cell function was assessed in vitro. LC-MS revealed that PSPLE contained abundant CQA derivatives (5-CQA, caffeic acid, 3,4-di-CQA, 3,5-di-CQA, 4,5-di-CQA, 4&#xa0;F-5CQA, and 3,4,5-tri-CQA). The HF&#x2009;+&#x2009;1% PSPLE diet attenuated weight gain and adipocyte hypertrophy, increased brown adipose UCP-1 expression, and prevented hepatic steatosis. AMPK phosphorylation was enhanced in the liver and muscle, paralleling higher oxygen consumption and energy expenditure. Although PSPLE stimulated &#x3b2;-cell metabolism and insulin secretion in vitro, in vivo glucose tolerance showed only modest improvement, likely reflecting the multiple regulatory inputs on insulin secretion under physiological conditions. PSPLE enhanced metabolic flexibility and oxidative capacity in HF-fed mice by activating AMPK-dependent pathways in muscle, liver, and adipose tissue. The higher efficacy of the 1% PSPLE indicates a hormetic response, where low polyphenol exposure triggers adaptive mitochondrial and metabolic activation, on the contrary, higher doses offer no further benefits. These results present PSPLE as a sustainable, polyphenol-rich food ingredient with potential to combat obesity-related metabolic dysfunction.", "keywords": [], "year": "2026", "doi": "10.1186/s12986-026-01144-x"}, {"pmid": "42225205", "title": "Muscle-derived ANXA2 promotes hepatic steatosis by activating SREBP1c-mediated de novo lipogenesis.", "abstract": "Hepatic steatosis, a hallmark of many liver diseases, is primarily driven by metabolic dysfunction; however, the extrahepatic regulatory mechanisms remain poorly understood. This study aimed to investigate muscle-liver crosstalk and to identify the underlying mechanisms of hepatic steatosis in patients with muscular dystrophy. We used mouse models of muscular dystrophy, fibroadipogenic progenitor (FAP)-specific annexin A2 (ANXA2) knockout mice, and muscle biopsy samples from patients with muscular dystrophy. The correlation between serum ANXA2 levels and lipid accumulation was evaluated in both human patients and mouse models of muscular dystrophy. RNA sequencing, mass spectrometry, and peptide library analyses were performed to investigate the mechanisms underlying hepatic steatosis associated with muscular dystrophy. We identified hepatic steatosis and hyperlipidemia in both patients and mouse models of muscular dystrophy. Using multiomic analyses, we found that muscle-resident FAPs secrete ANXA2, which functions as a key myokine driving hepatic steatosis. Muscle-specific overexpression of ANXA2 and manipulation of primary cells further confirmed this finding. In vivo FAP-specific ANXA2 ablation significantly alleviated systemic metabolic disturbances and hepatic steatosis in muscular dystrophy mouse models and high-fat diet-treated mice. Mechanistically, ANXA2 secreted by FAPs acts on hepatocyte-specific ANXA2R, promoting liver de novo lipogenesis through activation of the sterol regulatory element-binding protein 1c (SREBP1c) signaling pathway. Moreover, neutralizing ANXA2 suppressed hepatic steatosis and insulin resistance in mice. Collectively, our results demonstrate that ANXA2 derived from muscle FAPs promotes hepatic steatosis by activating SREBP1c-mediated de novo lipogenesis. Our findings identify the ANXA2-SREBP1c axis as a novel mechanism underlying muscle-liver metabolic crosstalk, and suggest that ANXA2 may represent a potential therapeutic target for hepatic steatosis in metabolic dysfunction-associated steatotic liver disease.", "keywords": [], "year": "2026", "doi": "10.1016/j.metabol.2026.156657"}], "pubmed_query": "(\"skeletal muscle\"[Title] OR \"muscle\"[Title] OR \"myocyte\"[Title] OR \"myofiber\"[Title] OR \"sarcopenia\"[Title] OR \"muscular\"[Title]) AND (\"adipose tissue\"[Title] OR \"white adipose tissue\"[Title] OR \"fat tissue\"[Title] OR \"adipocyte\"[Title] OR \"adipogenesis\"[Title] OR \"visceral fat\"[Title] OR \"subcutaneous fat\"[Title] OR \"WAT\"[Title] OR \"lipogenesis\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Pancreas__Thyroid", "source": "Pancreas", "target": "Thyroid", "color": "#64748b", "description": "Type: General metabolic state\nKey Players: TSH, TH\nNotes: - TH  regulates Thermogenesis, energy utilization by increasing the basal metabolic rate and regulate lipid and glucose metabolism. TH acts also through the pancreas.\nSources:\n- doi: 10.1177/2042018820917869\n- https://doi.org/10.1152/physrev.00030.2013", "connection_type": "General metabolic state", "key_players": ["TSH", "TH"], "key_players_metabolites": ["TSH", "TH", "glucose", "cholesterol", "arginine", "glutamate", "propionate", "amp", "amino acid", "ffa", "triglyceride", "fatty acids", "ldl", "glycogen", "phosphoenolpyruvate", "hdl", "free fatty acids", "lipoprotein", "amino acids", "leucine", "glycerol", "triglycerides", "acetate", "glutamine", "atp", "lactate", "malate", "creatinine", "fructose", "succinate", "glucose-6-phosphate", "serine", "alanine"], "key_players_hormones": ["TSH", "TH", "insulin", "t3", "thyroid hormone", "thyroid hormones", "triiodothyronine", "thyroxine", "glucagon", "t4", "thyrotropin", "somatostatin", "growth hormone", "amylin", "noradrenaline", "estrogen", "leptin", "testosterone", "osteocalcin", "glp1", "interleukin-1", "cortisol", "adrenaline", "epinephrine", "lh", "prolactin", "angiotensin", "tnf", "glucocorticoid", "gastrin", "acth", "norepinephrine", "renin", "fsh", "tumor necrosis factor", "secretin", "estradiol", "progesterone", "angiotensin ii", "corticosterone", "gnrh", "ghrelin"], "key_players_proteins": ["TSH", "TH", "akt", "glucokinase", "glp1r", "pi3k", "chrebp", "glut2", "fxr", "glut4", "mapk", "p38", "insulin receptor", "hexokinase", "rxr", "irs-1", "foxo", "mtor"], "key_players_counts_metabolites": {"cholesterol": 23, "propionate": 8, "amp": 8, "glycogen": 4, "phosphoenolpyruvate": 4, "atp": 1, "hdl": 3, "amino acids": 2, "glucose": 441, "glutamate": 9, "leucine": 2, "ldl": 5, "lactate": 1, "free fatty acids": 3, "arginine": 14, "amino acid": 8, "malate": 1, "creatinine": 1, "lipoprotein": 3, "glycerol": 2, "triglycerides": 2, "ffa": 8, "acetate": 2, "triglyceride": 6, "fatty acids": 6, "fructose": 1, "succinate": 1, "glucose-6-phosphate": 1, "glutamine": 2, "serine": 1, "alanine": 1}, "key_players_counts_hormones": {"progesterone": 1, "thyroid hormone": 150, "tnf": 2, "testosterone": 7, "glucocorticoid": 2, "thyroxine": 77, "gastrin": 2, "interleukin-1": 3, "glucagon": 73, "acth": 2, "angiotensin ii": 1, "norepinephrine": 2, "cortisol": 3, "osteocalcin": 4, "growth hormone": 22, "thyroid hormones": 91, "renin": 2, "noradrenaline": 9, "estrogen": 9, "insulin": 717, "t3": 184, "fsh": 2, "adrenaline": 3, "tumor necrosis factor": 2, "triiodothyronine": 89, "secretin": 2, "epinephrine": 3, "lh": 3, "leptin": 8, "corticosterone": 1, "gnrh": 1, "ghrelin": 1, "tsh": 104, "estradiol": 2, "thyrotropin": 33, "prolactin": 3, "somatostatin": 31, "t4": 69, "amylin": 14, "glp1": 4, "angiotensin": 3}, "key_players_counts_proteins": {"mapk": 2, "rxr": 1, "pi3k": 9, "p38": 2, "glut4": 3, "glucokinase": 24, "glut2": 5, "insulin receptor": 2, "akt": 27, "chrebp": 7, "irs-1": 1, "foxo": 1, "fxr": 5, "hexokinase": 2, "mtor": 1, "glp1r": 14}, "notes": "- TH  regulates Thermogenesis, energy utilization by increasing the basal metabolic rate and regulate lipid and glucose metabolism. TH acts also through the pancreas.", "sources": ["doi: 10.1177/2042018820917869", "https://doi.org/10.1152/physrev.00030.2013"], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42279352", "title": "Perioperative Thyroid-Metabolic Changes in Pancreatic Ductal Adenocarcinoma According to Surgical Management.", "abstract": "Background: Pancreatic ductal adenocarcinoma (PDAC) is associated not only with tumor progression but also with profound metabolic and nutritional disturbances. Thyroid hormone homeostasis may reflect this systemic response; however, perioperative data in PDAC remain limited. We aimed to assess perioperative changes in thyroid-related parameters in patients with PDAC undergoing different types of surgical management and to explore their associations with nutritional, metabolic, and tumor-burden variables. Methods: We performed a retrospective single-center study including 101 patients with PDAC. Thyroid-related and metabolic laboratory parameters were assessed before surgery and again 4-6 weeks later. The analyzed variables included thyroid-stimulating hormone (TSH), free triiodothyronine (FT3), free thyroxine (FT4), the FT3/FT4 ratio, albumin, total protein, glucose, insulin, HbA1c, lipid parameters, and CA 19-9. Patients were analyzed according to resectional versus non-resectional treatment and according to four procedure types. The primary endpoint was perioperative change in the FT3/FT4 ratio. Results: At baseline, resectional patients had significantly higher FT3 and FT3/FT4 ratio values and lower FT4 and CA 19-9 levels than non-resectional patients. In the whole cohort, FT3 and the FT3/FT4 ratio decreased significantly after treatment, whereas TSH increased, and FT4 remained unchanged. These endocrine changes occurred in parallel with significant declines in albumin, total protein, glucose, insulin, HbA1c, and HDL cholesterol, together with an increase in triglyceride levels. Baseline FT3 and FT3/FT4 ratios correlated positively with albumin and total protein and negatively with CA 19-9. Although perioperative changes did not differ significantly between resectional and non-resectional groups except for triglycerides, significant procedure-dependent differences were observed across the four surgical categories for FT3, FT4, TSH, and the FT3/FT4 ratio; glucose; insulin; and triglycerides. The prevalence of low-T3 syndrome increased from 11.1% preoperatively to 38.7% postoperatively. Conclusions: In PDAC, perioperative changes in thyroid hormone indices are pronounced and strongly depend on the type of surgical management. FT3 and the FT3/FT4 ratio appear to reflect systemic metabolic and nutritional adaptation as well as disease burden rather than acting as tumor-specific markers.", "keywords": [], "year": "2026", "doi": "10.3390/cancers18111769"}, {"pmid": "42181188", "title": "Thyroid autoimmunity in relation to islet autoantibodies in newly diagnosed type 1 diabetes mellitus in children and adolescents.", "abstract": "This study aimed to investigate the occurrence of thyroid autoantibodies at the onset of type 1 diabetes mellitus (T1DM) in children and adolescents, and to assess whether the presence of islet autoantibodies is associated with thyroid autoantibody presence. This retrospective cross-sectional study included 122 children and adolescents newly diagnosed with T1DM who visited Qingdao University Affiliated Women's and Children's Hospital between January 2022 and December 2024. We collected their blood glucose, glycated hemoglobin (HbA1c), C-peptide levels, and autoantibodies to islet cell antigen (ICA), glutamate decarboxylase (GADA), islet antigen-2 (IA-2A), insulin (IAA) and zinc transporter 8 (ZnT8A), thyroid peroxidase antibodies (TPOAb), and antithyroglobulin antibodies (TGAb). 84.4% of patients had at least one islet autoantibody, with IA-2A showing the highest positivity rate (64.8%) and ZnT8A the lowest (3.3%). No patient tested positive for all five antibodies. In comparison of 42 thyroid autoantibody (TA)-positive patients (34.4%) with 80 TA-negative patients, the TA-positive group was older (7.8 &#xb1; 3.0 years vs. 6.6 &#xb1; 3.1 years, P&#xa0;=&#xa0;0.045). The GADA positivity rate (60.9% vs. 41.4%, P&#xa0;=&#xa0;0.004) and IAA positivity rate (33.3% vs. 11.3%, P&#xa0;=&#xa0;0.003) were significantly higher in the TA-positive group than in the TA-negative group, with a higher median GADA titer (29.3 U/ml vs. 5.2 U/ml, P&#xa0;=&#xa0;0.029). Logistic regression analysis revealed that GADA positivity (OR&#xa0;=&#xa0;3.18, 95% CI: 1.44-7.01, P&#xa0;=&#xa0;0.004) and IAA positivity (OR&#xa0;=&#xa0;3.94, 95% CI: 1.53-10.15, P&#xa0;=&#xa0;0.004) were significantly associated with TA positivity. After adjusting for age, sex, BMI, and family history of diabetes, both remained independently associated with TA (aOR=2.68 and 4.06, respectively). Additionally, GADA titer showed a weak positive correlation with TPOAb titer (r = 0.204, P&#xa0;=&#xa0;0.024). Positive GADA and IAA antibodies were independently associated with thyroid autoimmunity in children with newly diagnosed type 1 diabetes, and GADA titer correlated with TPOAb titer. These findings support the consideration of early screening and long-term monitoring of thyroid function in children with newly diagnosed type 1 diabetes, particularly those positive for GADA and/or IAA antibodies.", "keywords": ["Humans", "Diabetes Mellitus, Type 1", "Child", "Adolescent", "Female", "Autoantibodies", "Male", "Retrospective Studies", "Cross-Sectional Studies", "Autoimmunity", "Thyroid Gland", "Child, Preschool", "Islets of Langerhans"], "year": "2026", "doi": "10.3389/fendo.2026.1822960"}, {"pmid": "41564647", "title": "Thyroid hormone signaling causally influences pancreatic disease risk: Evidence from Mendelian randomization and multi-omics integration.", "abstract": "The relationship between thyroid function and pancreatic disease has been observed clinically, yet causality remains unestablished. We applied bidirectional Mendelian randomization using genetic instruments from genome-wide association studies encompassing over 500,000 individuals to determine causal relationships. We demonstrate that genetic liability to hypothyroidism substantially protects against acute pancreatitis (odds ratio 0.37, 95&#x202f;% CI 0.17-0.80). Genetically elevated basal metabolic rate increases acute pancreatitis risk (OR 1.16) while decreasing chronic pancreatitis risk (OR 0.77), revealing divergent pathophysiological mechanisms. No causal relationship exists between thyroid function and pancreatic cancer. To elucidate underlying mechanisms, we performed multi-omics analysis including bulk RNA sequencing from 172 pancreatic adenocarcinomas, single-cell RNA sequencing from acute pancreatitis (32,830 cells), chronic pancreatitis (30,426 cells), and pancreatic cancer (95,751 cells), and GeoMx spatial transcriptomics (253 regions). High metabolic gene expression predicts favorable cancer survival (hazard ratio 0.52, P&#x202f;=&#x202f;0.0015). Single-cell analysis reveals myeloid-specific metabolic gene downregulation in chronic pancreatitis and 31-fold upregulation of the thyroid hormone-inactivating enzyme DIO3 in tumor epithelial cells. Spatial transcriptomics demonstrates that PPARGC1A downregulation occurs in preneoplastic lesions before malignant transformation. These findings establish thyroid function as a causal determinant of pancreatitis susceptibility, identify cell type-specific mechanisms including local thyroid hormone inactivation and metabolic reprogramming, and demonstrate that patient-derived organoids better preserve prognostically favorable metabolic phenotypes than cell lines. Thyroid function represents a potentially modifiable risk factor for inflammatory pancreatic disease.", "keywords": ["Humans", "Multiomics", "Thyroid Hormones", "Mendelian Randomization Analysis", "Signal Transduction", "Genome-Wide Association Study", "Pancreatic Diseases", "Pancreatitis"], "year": "2026", "doi": "10.1016/j.compbiolchem.2026.108897"}, {"pmid": "41552333", "title": "Elevated thyroid-stimulating hormone correlates with insulin resistance and &#x3b2;-cell dysfunction in type 2 diabetes with subclinical hypothyroidism.", "abstract": "To investigate the correlation between thyroid-stimulating hormone (TSH) levels and insulin function indices, including the homeostatic model assessment of insulin resistance (HOMA-IR) and &#x3b2;-cell function (HOMA-ISLET), in patients with type 2 diabetes mellitus (T2DM) complicated by subclinical hypothyroidism (SCH), and to evaluate their diagnostic value for identifying elevated TSH states. A total of 384 T2DM patients treated between April 2022 and November 2024 were retrospectively analyzed. Among them, 184 patients with SCH comprised the combined group, and 200 patients with T2DM alone comprised the diabetes group. Demographic data, fasting plasma glucose (FPG), fasting insulin (FINS), and TSH were collected to calculate HOMA-IR and HOMA-ISLET. Inter-group comparisons, correlation analyses, and receiver operating characteristic (ROC) curve analyses were performed. Compared to the diabetes group, the combined group showed significantly higher TSH, HOMA-IR, and HOMA-ISLET (all P &lt; 0.001). TSH correlated positively with HOMA-IR and negatively with HOMA-ISLET (combined group: r = 0.587 and -0.464; diabetes group: r = 0.334 and -0.545; all P &lt; 0.001). ROC analysis demonstrated favorable diagnostic performance for HOMA-IR (AUC = 0.720 for SCH; 0.892 for elevated TSH) and HOMA-ISLET (AUC = 0.711 for SCH; 0.878 for elevated TSH). HOMA-IR showed stronger discriminative ability than HOMA-ISLET in distinguishing diabetes-only from high TSH states (AUC = 0.928 vs. 0.709). Elevated TSH levels are closely associated with increased insulin resistance and impaired &#x3b2;-cell function in T2DM. Both HOMA-IR and HOMA-ISLET are valuable diagnostic tools, with HOMA-IR demonstrating superior clinical applicability for detecting T2DM with SCH and elevated TSH states.", "keywords": [], "year": "2025", "doi": "10.62347/UYSH9211"}, {"pmid": "41008194", "title": "Dietary Dityrosine Impairs Glucose Homeostasis by Disrupting Thyroid Hormone Signaling in Pancreatic &#x3b2;-Cells.", "abstract": "Growing evidence links processed red meat consumption to increased diabetes risk, with oxidized proteins and/or amino acids proposed as potential mediators. We investigated whether dityrosine (Dityr), a key oxidation biomarker in high-oxidative pork (HOP) and structural analog of thyroid hormone T3, mediates HOP-induced glucose dysregulation via thyroid hormone (TH) signaling disruption. C57BL/6J mice were fed control, low-oxidative pork (LOP), HOP, LOP + Dityr, or Dityr diets for 12 weeks. HOP and Dityr impaired glucose tolerance and induced hyperglycemia and hypoinsulinemia. Both induced oxidative stress and inflammation that partly contributed to pancreatic &#x3b2;-cell dysfunction and reduction in insulin secretion. Crucially, they downregulated pancreatic thyroid hormone receptor &#x3b2;1 (TR&#x3b2;1) and monocarboxylate transporter 8 (MCT-8), impairing TH signaling. This reduced TH transport in pancreatic tissue and triggered &#x3b2;-cell apoptosis by modulating TR&#x3b2;1-mediated expression of TH-responsive genes and proteins involved in pancreatic function, ultimately leading to diminished insulin secretion and elevated blood glucose levels. Dityr alone recapitulated the metabolic and molecular disruptions of HOP. We conclude that Dityr drives HOP-induced glucose metabolism disorders primarily by disrupting TH signaling, along with promoting oxidative stress and inflammation that collectively impair &#x3b2;-cell function. Minimizing dietary Dityr exposure via modified cooking methods or antioxidant-rich diets may mitigate diabetes risk.", "keywords": [], "year": "2025", "doi": "10.3390/foods14183220"}], "pubmed_query": "(\"pancreas\"[Title] OR \"pancreatic\"[Title] OR \"islet\"[Title] OR \"beta cell\"[Title] OR \"beta-cell\"[Title] OR \"insulin secretion\"[Title] OR \"exocrine pancreas\"[Title]) AND (\"thyroid\"[Title] OR \"thyroid gland\"[Title] OR \"thyroid hormone\"[Title] OR \"T3\"[Title] OR \"T4\"[Title] OR \"TSH\"[Title] OR \"hypothyroidism\"[Title] OR \"hyperthyroidism\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Pancreas__WAT", "source": "Pancreas", "target": "WAT", "color": "#64748b", "description": "“Type: Hormonal connection\nKey Players: Insulin\nNotes:\n- Insulin produced by the pancreas leads to glucose uptake in WAT\n- Dysfunction of adipocyte metabolism is also a key event in the development of insulin resistance.\nSources:\n- https://doi.org/10.1038/s41574-021-00471-8”", "connection_type": "Hormonal connection", "key_players": ["Insulin"], "key_players_metabolites": ["Insulin", "glucose", "fatty acid", "fatty acids", "cholesterol", "glycerol", "triglycerides", "amp", "triglyceride", "atp", "fructose", "glycogen", "ldl", "palmitate", "acetyl-coa", "glycerol-3-phosphate", "nefa", "ffa", "acetate", "hdl", "amino acid", "lipoprotein", "monoacylglycerol", "glutamine", "amino acids", "glutamate", "pyruvate", "free fatty acid", "alanine", "ammonia", "thromboxane", "bile acids", "lactate", "free fatty acids", "arginine", "butyrate", "valine", "oleate", "phospholipid", "serine", "bile acid"], "key_players_hormones": ["Insulin", "leptin", "gip", "adiponectin", "glucagon", "ghrelin", "il-6", "angiotensin", "resistin", "tnf", "interleukin-6", "progesterone", "angiotensin ii", "osteocalcin", "tumor necrosis factor", "il-4", "t3", "il-10", "visfatin", "amylin", "estrogen", "chemerin", "cck", "testosterone", "il-1beta", "pyy", "interleukin-1", "renin", "irisin", "glp-1", "prolactin", "fgf21", "gastrin", "norepinephrine", "growth hormone", "il6", "vitamin d", "apelin", "adrenaline", "epinephrine", "lh", "il1b", "estradiol", "somatostatin"], "key_players_proteins": ["Insulin", "cd36", "atgl", "pi3k", "fas", "srebp", "lxr", "fatty acid synthase", "glucokinase", "srebp-1c", "akt", "ampk", "foxo1", "acc", "p38", "pdk4", "sirt1", "jnk", "insulin receptor", "chrebp", "irs-1", "ucp1", "mapk", "pparg", "glut2", "hormone-sensitive lipase", "leptin receptor", "hsl", "glp-1 receptor", "adipose triglyceride lipase", "lipoprotein lipase", "erk1", "inos", "mtor", "glp1r"], "key_players_counts_metabolites": {"cholesterol": 28, "ammonia": 1, "glycerol-3-phosphate": 5, "amp": 12, "glycogen": 7, "palmitate": 6, "thromboxane": 1, "atp": 8, "bile acids": 1, "hdl": 3, "acetyl-coa": 6, "amino acids": 2, "glucose": 317, "fatty acid": 42, "glutamate": 2, "ldl": 7, "lactate": 1, "free fatty acids": 1, "arginine": 1, "butyrate": 1, "pyruvate": 2, "nefa": 5, "free fatty acid": 2, "amino acid": 3, "valine": 1, "lipoprotein": 3, "glycerol": 16, "triglycerides": 15, "ffa": 4, "acetate": 4, "oleate": 1, "triglyceride": 11, "fatty acids": 32, "fructose": 8, "phospholipid": 1, "monoacylglycerol": 3, "glutamine": 3, "serine": 1, "bile acid": 1, "alanine": 2}, "key_players_counts_hormones": {"progesterone": 10, "tnf": 14, "cck": 2, "testosterone": 2, "il-1beta": 2, "pyy": 2, "fgf21": 1, "gastrin": 1, "interleukin-1": 2, "glucagon": 29, "angiotensin ii": 9, "il-4": 5, "norepinephrine": 1, "osteocalcin": 9, "growth hormone": 1, "il6": 1, "renin": 2, "estrogen": 3, "adiponectin": 33, "insulin": 676, "t3": 5, "vitamin d": 1, "apelin": 1, "resistin": 15, "chemerin": 3, "il-10": 4, "visfatin": 4, "adrenaline": 1, "tumor necrosis factor": 9, "irisin": 2, "epinephrine": 1, "lh": 1, "leptin": 38, "il1b": 1, "glp-1": 2, "il-6": 22, "ghrelin": 24, "estradiol": 1, "prolactin": 2, "gip": 34, "somatostatin": 1, "amylin": 4, "angiotensin": 16, "interleukin-6": 13}, "key_players_counts_proteins": {"hsl": 1, "ucp1": 2, "mapk": 2, "fatty acid synthase": 9, "jnk": 4, "pi3k": 13, "foxo1": 6, "p38": 5, "pparg": 2, "fas": 13, "glucokinase": 8, "srebp-1c": 8, "glut2": 2, "glp-1 receptor": 1, "hormone-sensitive lipase": 2, "insulin receptor": 4, "leptin receptor": 2, "akt": 7, "chrebp": 4, "irs-1": 4, "adipose triglyceride lipase": 1, "lipoprotein lipase": 1, "cd36": 15, "erk1": 1, "pdk4": 5, "ampk": 7, "sirt1": 5, "inos": 1, "acc": 6, "mtor": 1, "atgl": 15, "lxr": 11, "srebp": 13, "glp1r": 1}, "notes": "- Insulin produced by the pancreas leads to glucose uptake in WAT\n- Dysfunction of adipocyte metabolism is also a key event in the development of insulin resistance.", "sources": ["https://doi.org/10.1038/s41574-021-00471-8”"], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42316277", "title": "IL-1&#x3b2;/CXCL12 signalling orchestrates adipocyte-pancreatic neuroendocrine tumor crosstalk.", "abstract": "Pancreatic neuroendocrine tumors (PanNETs) are rare neoplasms belonging to the broader group of neuroendocrine neoplasms. Epidemiological evidence indicates that visceral obesity is associated with both an increased incidence of PanNETs and unfavorable clinicopathological features. However, the mechanisms underlying adipocyte-PanNETs interactions remain poorly understood. Here, we investigated the crosstalk between adipocytes and PanNET cells (BON-1 and QGP-1 cell lines) using indirect co-culture systems and conditioned media derived from differentiated 3T3-L1 adipocytes or PanNET cells. Our results demonstrate that PanNET cells induce adipocyte reprogramming toward a cancer-associated adipocyte (CAA) phenotype, characterized by lipid depletion and downregulation of adipogenic markers, including Pparg, Fabp4, Hsl, and Atgl. We identified PanNET-derived interleukin-1&#x3b2; (IL-1&#x3b2;) as a key driver of adipocyte conversion into CAAs. This process was accompanied by increased secretion of the chemokine CXCL12 from CAAs, which in turn appeared to enhance PanNET cell proliferation and IL-1&#x3b2; release, thereby establishing a positive bidirectional crosstalk consistent with a feedback-like mechanism between CXCL12 and IL-1&#x3b2; in CAAs and PanNET cells, respectively. Indeed, pharmacological disruption of this axis using AMD3100, a CXCR4 antagonist, significantly reduced both IL-1&#x3b2; and CXCL12 secretion, prevented adipocyte reprogramming, and suppressed tumor cell proliferation. Comparable effects were observed following incubation of PanNET-adipocyte co-cultures with canakinumab, an IL-1&#x3b2; pathway inhibitor. Collectively, these findings identify IL-1&#x3b2; and CXCL12 as potential critical mediators of the inflammatory crosstalk between adipocytes and PanNET cells. Targeting this signalling axis may therefore represent a promising therapeutic strategy for PanNETs.", "keywords": [], "year": "2026", "doi": "10.1186/s12967-026-08428-z"}, {"pmid": "42284094", "title": "Association between inter lobular pancreatic adipose tissue and low glucose induced insulin secretion by &#x3b2;-cells.", "abstract": "The potential role of pancreatic fat on human &#x3b2;-cell dysfunction and its association with fibrosis are controversial. From the PANC-DB database, we estimated &#x3b2;-cell function with Glucose Stimulated Insulin Secretion (GSIS) and quantified fat infiltration and fibrosis using pancreatic histology sections from 45 organs from cadaveric organ donors. In the donors without diabetes, high fat infiltration and adipocyte size in the pancreatic septum were associated with lower GSIS. Low GSIS in fatty pancreas was confirmed in living pancreatic tissue slices. This association is dependent on age and global adiposity and independent of fibrosis. These results suggest that the localization and phenotype of fat infiltration in the pancreas are important factors to determine the role of adipose tissue on pancreatic endocrine function.", "keywords": [], "year": "2026", "doi": "10.1152/ajpgi.00116.2026"}, {"pmid": "42209194", "title": "Tumour-infiltrating adipocyte-derived 12,13-DiHOME subverts CD8 + T cell immunity in pancreatic ductal adenocarcinoma by promoting PPAR&#x3b3;-mediated ferritinophagy and tumour-associated neutrophil ferroptosis.", "abstract": "Pancreatic ductal adenocarcinoma (PDAC) frequently invades adjacent peripancreatic adipose tissue, yet the role of tumour-infiltrating adipocytes (TIAs) in shaping antitumour immunity remains unclear. To determine how TIAs influence PDAC progression and to define the immunometabolic mechanism involved. We used orthotopic PDAC models and Kras(LSL-G12D/+);Trp53(LSL-R172H/+);Pdx1-Cre (KPC) mice, together with neutrophil lineage peroxisome proliferator-activated receptor gamma (PPAR&#x3b3;) conditional knockout mice (PPAR&#x3b3;(fl/fl)-S100A8(cre)). Tumour metabolomics, bulk RNA sequencing (bulk RNA-seq) and single-cell RNA sequencing (scRNA-seq) were integrated with adipocyte and tumour-associated neutrophil (TAN) co-culture assays. Human relevance was assessed in a retrospective PDAC cohort (n=121) and validated in public transcriptomic datasets. High TIA abundance correlated with poorer overall survival and an immune-suppressed tumour microenvironment (TME). In mouse models, adipocyte-enriched tumours showed reduced CD8 + T cell functions. Multiomics analyses highlighted the adipocyte-derived metabolite 12,13-dihydroxy-9Z-octadecenoic acid (12,13-DiHOME) and supported its role in increasing TAN ferroptosis susceptibility. Mechanistically, 12,13-DiHOME enhanced PPAR&#x3b3;-dependent ferritinophagy signalling in TANs, accompanied by increased ferroptosis and CXCL2 production. Genetic or pharmacologic disruption of this axis, CXCL2 neutralisation or CXCR2 blocking, attenuated tumour-promoting phenotypes and restored CD8 + T cell functions in vivo and in vitro. These findings support an adipocyte-TAN immunometabolic circuit in PDAC, where TIA-derived 12,13-DiHOME promotes PPAR&#x3b3;-dependent TAN ferroptosis and increases CXCL2, leading to impaired CD8 + T&#x2009;cell functions. Targeting this pathway may help mitigate immune suppression in PDAC.", "keywords": [], "year": "2026", "doi": "10.1136/gutjnl-2025-337119"}, {"pmid": "41801557", "title": "Impaired Autophagic Flux in Adipose Tissue Aggravates Pancreatic Injury in Obesity-Related Severe Acute Pancreatitis.", "abstract": "Adipose tissue (AT) playing a crucial role in obesity-related pancreatitis. This study investigated the impact of autophagy in AT on pancreatic injury during obesity-related severe acute pancreatitis (SAP). Non-obese and obese mice were induced using a normal diet (ND) or high-fat diet (HFD) before establishing SAP. Pancreatic injury and autophagy in AT were evaluated. Adipose tissue macrophages (ATMs) were analyzed. Autophagy in RAW 264.7 cells co-cultured with palmitic acid (PA) and lipopolysaccharide (LPS), simulating the conditions of ATMs during SAP, was further investigated. The effect of PA on autophagy within inflammatory macrophages in vitro was explored, utilizing Sulfo-N-succinimidyloleate (SSO) to inhibit fatty acid transport. Additionally, the impact of autophagy in AT on inflammation in SAP mice was investigated using SSO, complemented by metabolomics analysis to uncover underlying molecular mechanisms. Pancreatic histological scores were significantly higher in obese SAP mice than in non&#x2011;obese SAP mice (n&#x2009;=&#x2009;6; 9.50&#x2009;&#xb1;&#x2009;1.05 vs. 7.33&#x2009;&#xb1;&#x2009;1.03; p&#x2009;=&#x2009;0.0005). Impaired autophagic flux was observed in the AT of obese SAP mice compared with obese control mice, as indicated by increased LC3&#x2011;II (p&#x2009;=&#x2009;0.0383) and p62 levels (p&#x2009;=&#x2009;0.0171). PA induced impaired autophagic flux in inflammatory macrophages. Inhibition of fatty acid transport partially restored impaired autophagic flux in an ATM cell model of SAP. Furthermore, this inhibition also alleviated the impairment of autophagic flux in AT and attenuated pancreatic injury in obese SAP mice. Metabolomics analysis of AT revealed elevated levels of more fatty acids and several signaling pathways correlated with autophagy in obese SAP mice. Impaired autophagic flux in AT aggravates pancreatic injury in obese SAP mice, with impaired autophagic flux in ATMs likely playing a crucial role. Metabolomics analysis revealed abnormal lipid metabolism in AT of obese SAP mice, and several signaling pathways may contribute to impaired autophagic flux in this tissue.", "keywords": ["Animals", "Autophagy", "Mice", "Obesity", "Pancreatitis", "Adipose Tissue", "Macrophages", "Pancreas", "Male", "RAW 264.7 Cells", "Palmitic Acid", "Disease Models, Animal", "Mice, Inbred C57BL", "Diet, High-Fat"], "year": "2026", "doi": "10.1002/iid3.70395"}, {"pmid": "41746929", "title": "The association between epicardial adipose tissue thickness and diabetes mellitus, hyperlipidemia, hepatosteatosis, pancreatic steatosis and pancreatitis.", "abstract": "Epicardial adipose tissue (EAT) is associated with cardiometabolic disorders such as diabetes mellitus (DM), hyperlipidemia, and nonalcoholic fatty liver disease. However, its potential relationship with pancreatic steatosis and pancreatitis remains unclear, and existing studies offer inconsistent findings. Therefore, a clearer understanding of whether EAT reflects broader systemic ectopic fat burden or inflammatory processes is needed.This study evaluated the relationships between EAT thickness and DM, hyperlipidemia, hepatosteatosis, pancreatic steatosis, and pancreatitis. This retrospective, single-center study included 200 patients who underwent abdominal CT between 2022 and 2024. EAT thickness was measured at the mid-RCA and LAD levels, and subcutaneous fat was measured at the umbilical level. Liver and pancreatic steatosis were assessed with CT or MRI. Demographic and clinical data (age, gender, LDL cholesterol, diabetes, and history of pancreatitis) were collected. Mann-Whitney U, Spearman correlation, and logistic regression were used in analyses; p&#x2009;&lt;&#x2009;0.05 was considered significant. Of the 200 patients, 31.4% had diabetes, 42% had hepatosteatosis, and 73.5% had a history of pancreatitis. EAT and subcutaneous fat were significantly higher in women at all levels (p&#x2009;&lt;&#x2009;0.05). Diabetes was associated with increased EAT in both the RCA (p&#x2009;=&#x2009;0.002) and the LAD (p&#x2009;=&#x2009;0.001). In multivariate analysis, RCA-EAT (OR=1.18, p&#x2009;=&#x2009;0.002) and age (OR=1.03, p&#x2009;=&#x2009;0.003) were significantly associated with diabetes. High LDL was associated with LAD-EAT (p&#x2009;=&#x2009;0.030). For pancreatitis, multivariate analysis identified pancreatic steatosis (OR=5.78, p&#x2009;&lt;&#x2009;0.001) and LAD-EAT (OR=1.52, p&#x2009;=&#x2009;0.002) as variables significantly associated with a history of pancreatitis. EAT thickness is significantly associated with DM, LDL cholesterol, pancreatitis history, and age, supporting its role as a potential imaging biomarker of cardiometabolic risk. These findings suggest that EAT may serve as an imaging marker of broader metabolic and inflammatory burden, supporting its relevance for cardiometabolic risk assessment.", "keywords": [], "year": "2026", "doi": "10.1371/journal.pone.0343831"}], "pubmed_query": "(\"pancreas\"[Title] OR \"pancreatic\"[Title] OR \"islet\"[Title] OR \"beta cell\"[Title] OR \"beta-cell\"[Title] OR \"insulin secretion\"[Title] OR \"exocrine pancreas\"[Title]) AND (\"adipose tissue\"[Title] OR \"white adipose tissue\"[Title] OR \"fat tissue\"[Title] OR \"adipocyte\"[Title] OR \"adipogenesis\"[Title] OR \"visceral fat\"[Title] OR \"subcutaneous fat\"[Title] OR \"WAT\"[Title] OR \"lipogenesis\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Small Intestine__Spleen", "source": "Small Intestine", "target": "Spleen", "color": "#64748b", "description": "Type: Multiple Connections\nKey Players: \nNotes:\n- Gut-Spleen-Liver axis. Has key roles in liver Disease. Feedback loop between Spleen and Liver. Connected through lymphatic, vascular system and neurological pathways.\n- Likely to be present during inflammatory states.\n- Peyer’s patches in small intestine are part of immune system and might correlate with spleen and bone marrow due to inflammation.\nSources:\n- doi: 10.4061/2010/823710 \n- https://doi.org/10.1096/fj.202502523RR\"\n", "connection_type": "Multiple Connections", "key_players": ["Notes: iiodothyronine": 1, "secretin": 2, "il1b": 1, "motilin": 3, "glp-1": 1, "il-6": 26, "ghrelin": 6, "epo": 1, "somatostatin": 6, "t4": 2, "interleukin-6": 8}, "key_players_counts_proteins": {"mapk": 5, "fatty acid synthase": 1, "jnk": 1, "pi3k": 7, "mtorc1": 1, "p38": 3, "fas": 1, "nf-kb": 3, "akt": 8, "tgr5": 1, "ampk": 1, "inos": 6, "fxr": 3, "acc": 4, "erk2": 4}, "notes": "- Gut-Spleen-Liver axis. Has key roles in liver Disease. Feedback loop between Spleen and Liver. Connected through lymphatic, vascular system and neurological pathways.\n- Likely to be present during inflammatory states.\n- Peyer’s patches in small intestine are part of immune system and might correlate with spleen and bone marrow due to inflammation.", "sources": ["doi: 10.4061/2010/823710", "https://doi.org/10.1096/fj.202502523RR\""], "ai_description": "", "pubmed_n": 130, "pubmed_papers": [{"pmid": "42333863", "title": "Evidence for bidirectional gut-spleen crosstalk in rodent models: scoping review of possible mechanisms and therapeutic implications.", "abstract": "The gut-spleen axis has been proposed to link the gut environment with splenic immune regulation and systemic homeostasis. This scoping review examines this interaction in rodent models. Following PRISMA-ScR guidelines, we analyzed literature (2015-2025) from PubMed, Scopus, and other major databases, including English-language rodent studies reporting gut and splenic outcomes. Analysis of 48 studies suggests that gut dysbiosis may alter splenic architecture and immune function mainly via microbial metabolites, particularly short-chain fatty acids. Limited evidence indicates that splenic dysfunction could impair gut barrier integrity. Systemic stressors (e.g., infection or allergy) may reinforce this bidirectional inflammatory loop. Microbiota-targeted therapies have been observed primarily through gut-initiated mechanisms. Vagus nerve-mediated signaling points to a gut-brain-spleen network, though its directional hierarchy remains unresolved. Evidence supports a gut-spleen axis in rodents, with gut-derived microbial metabolites appearing to influence splenic immunity. Support for a reciprocal spleen-to-gut pathway remains limited and emergent, highlighting a research asymmetry. Together, these interactions suggest a partially bidirectional network linking the gut ecosystem to systemic immunity, with additional neural integration extending this framework toward a gut-brain-spleen axis. This integrative model proposes the gut-spleen axis as a potential therapeutic target warranting further investigation in inflammatory, metabolic, and neurological diseases.", "keywords": ["Animals", "Spleen", "Gastrointestinal Microbiome", "Rodentia", "Dysbiosis", "Gastrointestinal Tract"], "year": "2026", "doi": "10.32725/jab.2026.006"}, {"pmid": "42328654", "title": "Polygonatum sibiricum combined with Poria cocos prevents spleen deficiency constipation via the gut microbiota-mediated brain-gut axis.", "abstract": "The study evaluates the preventive effects of Polygonatum sibiricum and Poria cocos (3:1) on spleen deficiency constipation in mice, focusing on the brain-gut axis, gut microbiota, and oxidative stress. The findings aim to inform the prevention and treatment of this condition. Thirty male specific pathogen-free (SPF) KM mice (4 weeks old, 20 &#xb1; 2&#xa0;g) were randomized into a normal control group (NC), a model group (NM), and a Polygonatum sibiricum and Poria cocos group (HF). Serum levels of 5-hydroxytryptamine (5-HT), cholecystokinin (CCK), motilin (MTL), and vasoactive intestinal peptide (VIP) were measured by ELISA. Liver superoxide dismutase (SOD) activity and malondialdehyde (MDA) content were measured by a spectrophotometer. Gut microbiota was analyzed by 16S rRNA sequencing. Compared to NM, the HF showed significantly increased 5-HT, CCK( p &lt; 0.05), and MTL ( p &lt; 0.001), and significantly decreased VIP( p &lt; 0.05). Liver MDA content was markedly higher in NM than in NC( p &lt; 0.01), with a downward trend in HF. Conversely, the liver SOD activity in NM was significantly lower than in NC( p &lt; 0.001), and the HF displayed an upward trend. Microbiota analysis revealed higher diversity in HF, as indicated by higher chao1, pielou_e, shannon, and simpson indices. The gut microbiota species composition in the HF was dominated by beneficial bacteria such as Bacteroidota and Faecalibaculum , with a reduction in pathogenic bacteria such as Proteobacteria and Escherichia-Shigella . The characteristic gut microbiota of the NM was enriched in Escherichia-Shigella and its conditional pathogens, while the characteristic gut microbiota of the HF was enriched in beneficial symbiotic bacteria such as Akkermansia , Blautia, and Bifidobacterium . The metabolic pathways and the genetic information processing pathway were improved in the HF, and the DNA repair and recombination protein pathways were also repaired. The P. sibiricum and P. cocos combination effectively prevents spleen deficiency constipation, an effect associated with the brain-gut axis and gut microbiota. The observed trends in oxidative stress markers warrant further investigation.", "keywords": [], "year": "2026", "doi": "10.3389/fphar.2026.1793441"}, {"pmid": "42322789", "title": "Electroacupuncture at Jiaji points regulates splenic immunity and gut microbiota to ameliorate peripheral immune dysfunction after spinal cord injury.", "abstract": "Peripheral immune dysfunction induced by spinal cord injury (SCI) is a key factor rendering patients prone to infection. However, there is still a lack of effective intervention methods for this pathological process. This study aims to explore the effects of electroacupuncture (EA) at Jiaji points on peripheral immune dysfunction induced by SCI in a mouse T10 SCI model. Following seven consecutive days of EA at T9 and T11, results showed that EA reversed SCI-induced splenic white pulp atrophy, CD3 + T cell reduction, and downregulation of inflammatory cytokines, indicating a systemic immunomodulatory effect. Concurrently, EA alleviated colonic mucosal inflammatory infiltration and barrier damage, and improved colonic emptying. These improvements in the intestinal environment were accompanied by specific modulation of key functional microbial genera, as well as alterations in microbial function and metabolic profiles, particularly in amino acid synthesis and bile acid metabolism. Furthermore, EA significantly upregulated the level of calcitonin gene-related peptide (CGRP) in the colon and significantly increased the gene expression of the bile acid receptor FXR in the colon of SCI mice. In the spleen, although the change in CGRP level did not reach statistical significance after EA intervention, an increasing trend was observed. These findings demonstrate that EA at Jiaji points may regulate the intestinal function-gut microbiota-bile acid synthesis/FXR signaling axis and synergistically restore splenic immune homeostasis to ameliorate peripheral immune dysfunction induced by SCI, with CGRP playing a potential neural signaling role in the processes.", "keywords": [], "year": "2026", "doi": "10.1016/j.jneuroim.2026.579008"}, {"pmid": "42232906", "title": "From \"spleen governing muscle\" to gut microbiota: mechanisms of sarcopenic obesity in perimenopausal women.", "abstract": "Sarcopenic obesity (SO) in perimenopausal women-characterized by the paradoxical coexistence of skeletal muscle loss and visceral adiposity-represents a complex metabolic challenge that conventional estrogen replacement therapies have failed to fully address. Emerging evidence from traditional Chinese medicine (TCM) suggests that the \"spleen governing muscle\" theory may offer a unique lens through which to understand this condition, with the gut microbiota serving as a critical mechanistic link between spleen deficiency and musculoskeletal deterioration. To systematically review the mechanisms linking spleen deficiency, gut microbiota dysbiosis, and sarcopenic obesity risk in perimenopausal women, integrating TCM theory with modern biomedical evidence. We synthesized findings from clinical observational studies, randomized controlled trials (RCTs), and mechanistic investigations examining the \"spleen-gut-muscle\" axis, with particular attention to studies employing 16S rRNA sequencing, metabolomics, and multi-omics approaches. Spleen deficiency-manifesting as impaired transformation and transportation of nutrients-correlates with characteristic alterations in gut microbiota composition, including reduced diversity, elevated Firmicutes /Bacteroidetes ratios, and depletion of short-chain fatty acid (SCFA)-producing taxa. These microbial changes propagate systemic inflammation through lipopolysaccharide (LPS)-TLR4 signaling, activate muscle protein degradation via MuRF1 upregulation, and compromise insulin sensitivity through diminished GLP-1 secretion. Notably, TCM interventions-including herbal formulations (Sijunzi decoction, Buzhong Yiqi decoction), acupuncture, moxibustion, catgut embedding, and tuina massage-demonstrate potential to restore microbial homeostasis, increase SCFA production, and improve muscle mass and function. However, the evidence quality remains modest, with methodological limitations including inadequate blinding, small sample sizes, and short follow-up durations. The \"spleen-gut-muscle\" axis represents a promising therapeutic target for perimenopausal sarcopenic obesity, bridging TCM theory with modern microbiome science. Nevertheless, current evidence is predominantly associative rather than causally definitive, derived largely from small-scale trials and preclinical models. Rigorous, large-scale RCTs with standardized TCM protocols, multi-omics endpoints, and extended follow-up are essential to establish efficacy and safety before microbiota-based TCM interventions can be recommended as adjunctive or standalone therapies.", "keywords": [], "year": "2026", "doi": "10.3389/fmicb.2026.1817839"}, {"pmid": "42148943", "title": "Fermented goat milk powder promotes intestinal development and enhances splenic antioxidant function in mice.", "abstract": "Fermented goat milk powder, containing probiotic bacteria, may regulate intestinal flora and modulate immunity. This study aimed to evaluate the effects of fermented goat milk powder on intestinal development, gut microbiota composition, and splenic antioxidant capacity in young mice, and to explore the potential underlying mechanisms. Metabolomics results revealed that FGMP contains various bioactive components closely related to antioxidants, such as Creatine, Choline, Betaine, and O -acetyl-L-carnitine. Supplementation increased body weight and significantly elevated serum SOD, CAT, and GSH-Px activities while reducing MDA levels. It promoted intestinal development, evidenced by increased villus height and decreased crypt depth in the jejunum and ileum. Microbial sequencing revealed an altered gut microbiota, including reduced Escherichia - Shigella and increased abundances of several other genera. Concurrently, levels of arachidonic acid and related metabolites decreased. In the spleen, antioxidant capacity was enhanced, lipid peroxidation (4-HNE) was suppressed, and mRNA levels of ACSL4 , ALOX15 , NOX1 , PTGS2 , and LPCAT3 were downregulated. These results indicate that fermented goat milk powder supports intestinal development and inhibits splenic ferroptosis via the ACSL4 / ALOX15 pathway, enhancing antioxidant status.", "keywords": [], "year": "2026", "doi": "10.1039/d6fo00370b"}], "pubmed_query": "(\"small intestine\"[Title] OR \"duodenum\"[Title] OR \"jejunum\"[Title] OR \"ileum\"[Title] OR \"intestinal\"[Title] OR \"gut\"[Title] OR \"enterocyte\"[Title] OR \"Peyer's patches\"[Title] OR \"gut-brain axis\"[Title] OR \"enteroendocrine\"[Title]) AND (\"spleen\"[Title] OR \"splenic\"[Title] OR \"splenomegaly\"[Title] OR \"lymphoid organ\"[Title] OR \"immune organ\"[Title]) AND (meta
