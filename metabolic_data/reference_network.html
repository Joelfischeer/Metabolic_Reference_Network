<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metabolic Reference Network</title>
<script src="https://unpkg.com/cytoscape@3.29.2/dist/cytoscape.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- Top bar ---- */
  #topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
    z-index: 10;
  }

  #topbar h1 {
    font-size: 16px;
    font-weight: 700;
    color: #f1f5f9;
    white-space: nowrap;
  }

  #search-wrap {
    position: relative;
    flex: 1;
    max-width: 400px;
  }

  #search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    pointer-events: none;
    font-size: 14px;
  }

  #search-input {
    width: 100%;
    padding: 7px 12px 7px 32px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  #search-input:focus { border-color: #6366f1; }
  #search-input::placeholder { color: #64748b; }

  #search-count {
    font-size: 12px;
    color: #64748b;
    white-space: nowrap;
  }

  .ctrl-btn {
    padding: 6px 12px;
    background: #334155;
    border: none;
    border-radius: 6px;
    color: #cbd5e1;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .ctrl-btn:hover { background: #475569; color: #f1f5f9; }
  .ctrl-btn.active { background: #6366f1; color: white; }

  /* ---- Main area ---- */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ---- Graph canvas ---- */
  #cy-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #cy {
    width: 100%;
    height: 100%;
  }

  /* ---- Sidebar ---- */
  #sidebar {
    width: 340px;
    min-width: 260px;
    max-width: 480px;
    background: #1e293b;
    border-left: 1px solid #334155;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  #sidebar-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }

  #sidebar-title {
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  #sidebar-name {
    font-size: 17px;
    font-weight: 700;
    color: #f1f5f9;
    word-break: break-word;
  }

  #sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
  }

  #sidebar-body::-webkit-scrollbar { width: 5px; }
  #sidebar-body::-webkit-scrollbar-track { background: transparent; }
  #sidebar-body::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin: 14px 0 6px;
  }
  .section-label:first-child { margin-top: 0; }

  .connection-type-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: #312e81;
    color: #a5b4fc;
    margin-bottom: 2px;
  }

  .chips-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    cursor: default;
    transition: opacity 0.15s;
  }
  .chip:hover { opacity: 0.85; }

  .chip-hormone   { background: #451a03; color: #fdba74; border: 1px solid #92400e; }
  .chip-metabolite { background: #042f2e; color: #5eead4; border: 1px solid #0f766e; }
  .chip-protein   { background: #1e1b4b; color: #a5b4fc; border: 1px solid #3730a3; }
  .chip-general   { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

  .notes-text {
    font-size: 13px;
    color: #cbd5e1;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .source-item {
    font-size: 12px;
    color: #6366f1;
    margin-bottom: 3px;
    word-break: break-all;
    display: block;
    text-decoration: none;
  }
  .source-item:hover { color: #818cf8; }

  .paper-card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .paper-title {
    font-size: 13px;
    font-weight: 600;
    color: #e2e8f0;
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .paper-meta {
    font-size: 11px;
    color: #64748b;
    margin-bottom: 4px;
  }
  .paper-abstract {
    font-size: 12px;
    color: #94a3b8;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .paper-link {
    font-size: 11px;
    color: #6366f1;
    text-decoration: none;
    display: inline-block;
    margin-top: 4px;
  }
  .paper-link:hover { color: #818cf8; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #475569;
    font-size: 14px;
    line-height: 1.6;
  }
  .empty-state svg { margin: 0 auto 12px; display: block; opacity: 0.4; }

  /* ---- Search results panel ---- */
  #search-results {
    display: none;
    position: absolute;
    top: 52px;
    left: 0;
    right: 0;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    max-height: 200px;
    overflow-y: auto;
    z-index: 20;
    padding: 8px 0;
  }

  .search-result-item {
    padding: 8px 20px;
    cursor: pointer;
    font-size: 13px;
    color: #cbd5e1;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.1s;
  }
  .search-result-item:hover { background: #334155; }
  .search-result-item .match-type { font-size: 11px; color: #64748b; }

  /* ---- Legend ---- */
  #legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
    z-index: 5;
  }
  .legend-title { font-weight: 600; color: #94a3b8; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; color: #cbd5e1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ---- Hover tooltip ---- */
  #tooltip {
    position: fixed;
    display: none;
    background: #1e293b;
    border: 1px solid #334155;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    color: #e2e8f0;
    pointer-events: none;
    z-index: 100;
    max-width: 220px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  /* ---- Highlighted search match ---- */
  .search-matched { border: 2px solid #fbbf24 !important; }
</style>
</head>

  <button class="ctrl-btn" onclick="runLayout('cose')" title="Force-directed layout">⚡ Force</button>

</div>

<!-- Main area -->

  </div>

        Click any <strong>node</strong> or <strong>edge</strong> to see details.<br><br>
        Use the search bar above to find connections by molecule name.
      </div>

</div>

<script>
const elements = [{"data": {"id": "Adrenal Glands", "label": "Adrenal Glands", "description": "Function: Endocrine organs that regulate stress response, blood pressure, metabolism, electrolyte balance.\nMetabolism: \n- Cortisol leads to gluconeogenesis in kidney and liver. \n- Adrenaline leads to increased heart rate, breathing rate and glycogenolysis in liver.\n- Aldosterone regulates blood pressure and water reabsorption in the kidney.\n- Cortisol synchronizes peripheral clocks in liver, muscle, and adipose tissue and also seems to influencepancreas and gut.\nKey Metabolites: Adrenaline, Cortisol, aldosterone. \nKey Proteins: \nSources: \n- PMID: 40250885. \n- https://doi.org/10.1038/s41574-019-0228-0\n- Viblanc, V. A. et al. An integrative appraisal of the hormonal and metabolic changes induced by acute stress using king penguins as a model. _Gen. Comp. Endocrinol._ **269**, 1-10 (2018)\n- https://my.clevelandclinic.org/health/body/23005-adrenal-gland\nhttps://my.clevelandclinic.org/health/articles/24158-aldosterone\nhttps://my.clevelandclinic.org/health/articles/22611-epinephrine-adrenaline\n- DOI: 10.5772/intechopen.1003161\n-doi: 10.1016/j.coemr.2021.03.011.\n-\n", "llm_description": "The adrenal glands play a crucial role in regulating various metabolic processes by primarily consuming glucose and amino acids as substrates, while producing cortisol and other glucocorticoids that have widespread effects on metabolism [1]. The production of these hormones is tightly regulated by the hypothalamic-pituitary-adrenal (HPA) axis, which is activated in response to stress and can lead to suppression of the hypothalamic-pituitary-gonadal (HPG) axis [1]. The HPA axis is also influenced by other key hormones such as adrenocorticotropic hormone (ACTH), which stimulates the adrenal glands to produce cortisol [2,3]. In addition, stress-induced activation of the HPA axis can lead to changes in glucose and lipid metabolism, contributing to conditions such as insulin resistance and obesity [3]. The impact of glucocorticoids on metabolism is complex and multifaceted, with effects on glucose uptake, fat storage, and protein synthesis, highlighting the importance of", "llm_papers": [{"pmid": "42371829", "title": "Stress as a Neuroendocrine Modulator of the Reproductive Axis: Roles of Glucocorticoids, Kisspeptin and Serotonergic Signalling in Animal Models.", "abstract": "Reproductive dysfunction is a major health concern affecting men and women globally, mediated by the activation of the hypothalamic pituitary adrenal (HPA) axis as well as strongly influenced by exposure to stress. Consequently, this results in suppression of the hypothalamic-pituitary-gonadal (HPG) axis, facilitated by glucocorticoid signalling. Although we have a clear understanding of glucocorticoids as the main mediators of stress-induced reproductive suppression, evidence indicates that monoaminergic pathways, particularly serotonin (5-HT) and its receptors, play pivotal roles in linking stress to reproductive regulation. Kisspeptin neurons have emerged as crucial integrators of both glucocorticoid and serotonergic signals. Current evidence from animal studies demonstrates that stress dysregulates reproductive function at multiple levels of the HPG axis. Glucocorticoids interact through combined genomic and non-genomic pathways to suppress the secretion of kisspeptin, gonadotropin-releasing hormone (GnRH), gonadotropins, as well as gonadal steroidogenesis. In addition to the well-established glucocorticoid mechanisms, monoamines such as 5-HT play a crucial role in mediating the link between stress and reproduction. Recent molecular, electrophysiological, and transcriptomic studies have highlighted the importance of the 5-HT7 receptor, which is highly expressed in kisspeptin neurons of the arcuate nucleus (ARC), where it acts as a critical excitatory driver of GnRH/LH pulse generation. Stress, however, suppresses serotonergic signalling by lowering 5-HT levels and suppressing serotonin receptor expression, including 5-HT7 receptor, thereby reducing kisspeptin and GnRH neuronal excitation. Glucocorticoid-mediated suppression of kisspeptin signalling might be a key underexplored pathway contributing to stress-mediated reproductive dysfunction, particularly when combined with stress-induced reductions in 5-HT and 5-HT receptor expression, suggesting a dual suppressive mechanism.", "keywords": [], "year": "2026", "doi": "10.1159/000553326"}, {"pmid": "42368271", "title": "Adrenal insufficiency after long-term high-dose ethinylestradiol use in a transgender woman.", "abstract": "A 42-year-old transgender woman, assigned male at birth, was referred for the evaluation of hypertension, and was found to have hypercortisolemia with suppressed adrenocorticotropic hormone (ACTH). The patient also presented with obesity and gynecomastia, along with reduced levels of gonadotropins, testosterone, and insulin-like growth factor 1 (IGF-1), with no adrenal lesions on imaging. These findings were attributed to more than 20 years of unsupervised high-dose oral ethinylestradiol use for breast feminization, with doses approximately 4 times higher than those typically prescribed for women. After discontinuation of ethinylestradiol, her hypertension improved, but a rapid ACTH stimulation test demonstrated an inadequate cortisol response, consistent with secondary adrenal insufficiency. Hydrocortisone replacement therapy with gradual tapering led to normalization of her ACTH, cortisol, gonadotropin, and IGF-1 levels. Subsequent ACTH stimulation and corticotropin-releasing hormone tests confirmed the recovery of adrenal function, enabling the cessation of hydrocortisone therapy. Thus, long-term high-dose oral ethinylestradiol may be associated not only with apparent hypercortisolemia attributable to increased corticosteroid-binding globulin, but also, possibly through increased free cortisol, with suppression of the hypothalamic-pituitary-adrenal axis. When a transgender woman taking supraphysiological doses of oral estrogen discontinues estrogen therapy, adrenal insufficiency potentially requiring transient steroid replacement should be considered.", "keywords": [], "year": "2026", "doi": "10.1210/jcemcr/luag162"}, {"pmid": "42366102", "title": "Associations of stress hormones, autonomic function, and endothelial function in patients with diabetes.", "abstract": "Endothelial dysfunction is an early feature of diabetic vascular injury. Stress-induced activation of the hypothalamic-pituitary-adrenal (HPA) axis, together with autonomic imbalance, may contribute to endothelial dysfunction. However, its clinical relevance in diabetes remains to be fully elucidated. We retrospectively analyzed 60 patients with diabetes who underwent both flow-mediated dilation (FMD) of the brachial artery and the coefficient of variation of the R-R interval (CVRR) measurements. The primary objective was to examine the association between FMD and stress-related hormones, including adrenocorticotropic hormone (ACTH) and cortisol. The secondary objective was to evaluate the association with autonomic function (CVRR) and other clinical variables. Mean FMD was 5.10 &#xb1; 2.32%. FMD correlated inversely with ACTH (r = -0.41, p = 0.0015) and cortisol (r = -0.39, p = 0.0024), and positively with CVRR (r = 0.49, p &lt; 0.001). These relationships were stronger in patients with BMI &#x2265;27 kg/m 2 , among whom the correlation between FMD and ACTH was particularly pronounced (r = -0.68, p = 0.0007). No significant associations were found between FMD and hemoglobin A1c or other lipid parameters. Given the cross-sectional design, these findings indicated associations rather than causality. Our results suggest that the HPA axis activity and autonomic function may be associated with endothelial dysfunction in diabetes, particularly in individuals with a higher BMI. This study was registered in the UMIN Clinical Trials Registry (UMIN-CTR; UMIN000060540).", "keywords": [], "year": "2026", "doi": "10.1507/endocrj.EJ26-0067"}, {"pmid": "42366045", "title": "A Case of Transient ACTH and Cortisol Suppression Caused by Dexamethasone Mouthwash during Immune Checkpoint Inhibitor Treatment.", "abstract": "Immune checkpoint inhibitors (ICIs) can cause endocrine adverse events, including isolated adrenocorticotropic hormone deficiency (IAD). We report a case of transient ACTH and cortisol suppression mimicking ICI-induced IAD during pembrolizumab therapy for metastatic triple-negative breast cancer. A 59-year-old woman developed low ACTH and cortisol levels while receiving pembrolizumab in combination with nab-paclitaxel. ICI-related IAD was initially suspected. However, her hormone levels normalized after the discontinuation of dexamethasone mouthwash used for oral mucositis. These findings suggest the transient suppression of the hypothalamic-pituitary-adrenal axis due to exogenous steroid exposure. Clinicians should consider steroid-containing mouthwashes as a potential cause of adrenal axis suppression during ICI therapy.", "keywords": [], "year": "2026", "doi": "10.2169/internalmedicine.7478-26"}, {"pmid": "42365935", "title": "Steroidogenesis suppression in H295R cells by 1,3-disubstituted ureas: a potential off-target effect of some sEH inhibitors.", "abstract": "The soluble epoxide hydrolase (sEH) is widely studied for its therapeutic potential in inflammation, cardiovascular disease, and pain through stabilization of endogenous epoxyeicosatrienoic acid (EET). Here, we evaluated the impact of several urea-type sEH inhibitors on steroid hormone synthesis; another pathway in which sEH may be involved. Steroidogenesis assays employing the adrenocortical carcinoma cell line H295R demonstrated that TPPU and several other urea-type sEH inhibitors induce dose-dependent suppression of multiple steroid hormones without cytotoxicity, whereas the amide-based GSK2256294A had no effect on steroid production or cell survival. Substrate-to-product ratio analysis suggested selective modulation of CYP17, CYP21, and 17&#x3b2;-hydroxysteroid dehydrogenase activities, with only partial transcriptional changes in select steroidogenic genes. Exogenous 11,12-epoxyeicosatrienoic acid (EET) did not reproduce these effects, and TPPU maintained suppression under dbcAMP stimulation, indicating an off-target mechanism downstream of cAMP signaling. Collectively, these findings reveal that urea-based sEH inhibitors suppress adrenal steroidogenesis via scaffold-dependent, off-target mechanisms independent of sEH. In addition, it suggests that sEH is not involved directly in steroid metabolism.", "keywords": [], "year": "2026", "doi": "10.1016/j.toxlet.2026.113147"}, {"pmid": "42365631", "title": "Early life adversity influences brain development through neuroendocrine, immune, and microbiota-related mechanisms: A review.", "abstract": "The early life experiences have an important impact on the development of the brain and behavior and early life adversities (ELA) may affect several biological systems including the hypothalamic-pituitary-adrenal (HPA) axis, neurotransmitter and immune signaling systems, and microbiota composition. Dysregulation of these systems may result in an altered stress reactivity in both early life and the adulthood periods leading to maladaptive responses to the environmental stimuli. The activation of certain neuropeptides, including oxytocin, stimulation of the HPA axis, and increased glucocorticoid levels, may also play an important role in the early adaptive processes. In terms of brain maturation, ELA can directly or indirectly elicit structural changes in neurite growth, neurogenesis, neuronal connectivities, and signaling processes, which may contribute to the production of the long-term behavioral changes associated with an increased risk of the neuropsychiatric disorders' development in later periods of the life. In this review, we summarize the effect of ELA on the HPA axis function, stress-related hormonal balance, immune responses, and the gut microbiome indicating how these changes may affect the brain function and behavior in the early stages of the life and adulthood. We also provide insight into animal studies revealing the responses of corticotropin-releasing hormone, urocortins, and corticosterone in various neural circuits in response to ELA evoked by maternal separation and limited bedding paradigms.", "keywords": ["Humans", "Animals", "Brain", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System", "Adverse Childhood Experiences", "Stress, Psychological", "Gastrointestinal Microbiome", "Neurosecretory Systems", "Neurodevelopment", "Immune System", "Microbiota"], "year": "2026", "doi": "10.2478/enr-2026-0010"}], "color": "#9f1239"}}, {"data": {"id": "Bone Marrow", "label": "Bone Marrow", "description": "Function: Hematopoiesis, trafficking of immune cells (regulatory T cells, conventional T cells, B cells, dendritic cells, natural killer T (NKT) cells). Suggested to be a immune regulatory organ.\nMetabolism:\n- Hematopoesis\n- Cytokine production\nKey Metabolites: Cytokines\nKey Proteins: \nSources:\n- https://my.clevelandclinic.org/health/body/22818-bone-marrow\n- PMID: 22020068", "llm_description": "The bone marrow, a spongy tissue within the bones that produces blood cells, also plays a crucial role in metabolic physiology. It primarily consumes glucose and fatty acids to produce energy for its functions, such as hematopoiesis [1]. The bone marrow is also known to produce ketone bodies, which can serve as an alternative energy source during periods of fasting or low carbohydrate intake [2]. The hormone leptin, produced by adipose tissue, regulates bone marrow metabolism and energy balance, with high levels promoting fat storage and low levels stimulating lipolysis [3]. Additionally, the hormone erythropoietin, produced by the kidneys in response to low oxygen levels, stimulates the bone marrow to produce red blood cells, which are essential for transporting oxygen throughout the body.", "llm_papers": [{"pmid": "42375569", "title": "D -Allulose as a Low-Calorie Sweetener: A 30-Day Randomized, Double-Blind Study on Gastrointestinal Tolerance and Systemic Safety to Support Its Application in Healthy Diets.", "abstract": "Long-term safety, tolerance, and population-specific effects of innovatively fermented D -allulose are lacking in the Chinese population. This study aimed to address these gaps and support its application as a novel food ingredient in China. A 30-day randomized, double-blind, parallel-group design with pre-post comparison trial was conducted, enrolling 50 healthy Chinese adults (high-dose group: 36&#x2009;g/day, 0.6&#x2009;g/kg body weight, n &#x2009;=&#x2009;26; low-dose group: 24&#x2009;g/day, 0.4&#x2009;g/kg body weight, n &#x2009;=&#x2009;24). Gastrointestinal tolerance was monitored via daily questionnaires; systemic safety was evaluated using hematological tests, serum biochemical tests, urinalysis, fecal analysis, and body composition measurements. The incidence of gastrointestinal symptoms was 48.0%, which were mild, transient, and most frequent on Days 1-3, with no significant intergroup differences. All statistically significant changes in safety indicators remained within normal clinical reference ranges. Compared with baseline, the 30-day intervention resulted in reduced red blood cell count, hematocrit, and platelet count, as well as elevated mean corpuscular hemoglobin and mean corpuscular hemoglobin concentration in both groups. For serum biochemical parameters, levels of alkaline phosphatase, gamma-glutamyl transferase, uric acid, total cholesterol, and high-density lipoprotein cholesterol decreased in both groups, while fasting blood glucose was reduced only in high-dose group. Notably, high-dose D -allulose intervention decreased bone mineral density T-scores in participants aged 35&#x2009;years and older. All statistically significant alterations in the measured indicators remained within normal clinical ranges and were clinically insignificant. This study provides critical safety data to support the planned approval of D -allulose as a novel food ingredient in China in 2025. Its modulation of hematological and serum biochemical parameters suggests effects on hematopoiesis and glycolipid metabolism. Given the limitations of the 30-day intervention duration, relatively modest sample size, and restriction to healthy normal-BMI adults, a provisional safe intake limit of 0.4&#x2009;g/kg body weight per day is proposed for Chinese adult population, requiring validation in longer-term and larger-scale studies.", "keywords": [], "year": "2026", "doi": "10.1002/fsn3.72042"}, {"pmid": "42374733", "title": "Clonal Hematopoiesis and Type 2 Diabetes: A Narrative Review.", "abstract": "Clonal hematopoiesis (CH) refers to an expanded clonal hematopoietic cell population due to acquired mutations conferring a selective growth advantage. Once considered a premalignant hematological state, CH has now been causally associated with cardiovascular diseases (CVDs) and several aging-related clinical conditions. Emerging evidence suggests that CH is at the intersection of aging and metabolic disorders. CH carriers exhibit a higher risk of Type 2 diabetes, potentially through the obesity-inflammation-insulin resistance axis. Moreover, CH confers a higher risk of CVD and is associated with a poorer prognosis in patients with diabetes compared to noncarriers. In addition, CH has been associated with the development of microvascular complications, including retinopathy and kidney disease in patients with diabetes, although inconsistent findings exist. Preclinical studies found that antidiabetic medication metformin might slow down clonal expansion of CH, while clinical data suggest that anti-inflammatory medications confer better clinical outcomes for certain CH carriers, although their relevance for patients with diabetes remains to be elucidated. In this narrative review, we also briefly discuss the barriers to clinical adoption of CH detection and highlight the knowledge gaps that should be addressed in future work.", "keywords": ["Humans", "Diabetes Mellitus, Type 2", "Clonal Hematopoiesis", "Animals", "Hypoglycemic Agents", "Cardiovascular Diseases"], "year": "2026", "doi": "10.1111/1753-0407.70251"}, {"pmid": "42373718", "title": "Cathepsin G and neutrophil elastase control Leishmania infantum parasitism through TLRs-dependent induction of IFN-&#x3b1; and TNF-&#x3b1;.", "abstract": "Leishmania infantum and Leishmania donovani are protozoan parasites that cause visceral leishmaniasis, a potentially fatal disease targeting the liver, spleen and bone marrow. To survive, these parasites manipulate host macrophage microbicidal responses and metabolic pathways. Here, we demonstrate that the host serine proteases neutrophil elastase (NE) and cathepsin G (CG), acting in concert with Toll-like receptors TLR2, TLR3, and TLR4, induce the inflammatory cytokines IFN-&#x3b1; and TNF-&#x3b1; to control L. infantum infection in macrophages. Conversely, in vivo experiments revealed that while NE and CG are necessary for inflammatory responses, including IL-12, nitric oxide, and CCL2 production, they unexpectedly promote splenic parasitism. CG-deficient mice failed to recruit Ly6C hi myeloid cells to the spleen, providing a potential mechanism for their reduced parasite burden. Finally, our data suggest that unlike L. donovani, L. infantum cannot hijack cellular host serine peptidases and TLR signalling for survival, yet it remains dependent on these host enzymes to establish systemic spleen infection.", "keywords": [], "year": "2026", "doi": "10.1038/s42003-026-10555-8"}, {"pmid": "42373376", "title": "The many facets of cardiopulmonary complications in sickle cell disease.", "abstract": "Sickle cell disease (SCD) is a systemic vasculopathy, which progressively remodels the heart and pulmonary circulation through chronic anemia, hemolysis, and endothelial dysfunction. This review integrates current evidence on the mechanisms, clinical spectrum, and management of SCD-related cardiopulmonary complications. Chronic anemia drives a high-output state characterized by cardiac chamber dilation leading to eccentric remodeling that, over time, may evolve toward diastolic dysfunction, heart failure with preserved ejection fraction (HFpEF), and postcapillary pulmonary hypertension (PH). Concomitant hemolysis, oxidative stress, and microvascular injury promote diffuse myocardial fibrosis that acts as an arrhythmogenic substrate underlying both atrial and ventricular arrhythmias (VAs). Beyond left-sided cardiac disease, SCD also contributes to pulmonary vascular injury and \"relative systemic hypertension\", both reflecting a vasculopathy process that amplifies target organs damage. Transthoracic echocardiography (TTE) remains the cornerstone of diagnosis and prognosis of SCD-related cardiomyopathy, enabling longitudinal assessment of ventricular performance, chamber remodeling and hemodynamics including pulmonary pressures, while cardiac magnetic resonance (CMR) adds information on tissue characterization and quantification of diffuse fibrosis. Emerging data suggests that curative therapies. Such as hematopoietic stem cell transplantation and gene therapy can reverse cardiac remodeling and fibrosis yet necessitate structured long-term follow-up. Recognizing SCD-related cardiomyopathy as a dynamic and potentially reversible cardiopulmonary continuum is essential for establishing disease-specific diagnostic criteria and guiding physiological grounded therapeutic strategies.", "keywords": [], "year": "2026", "doi": "10.1053/j.seminhematol.2026.05.007"}, {"pmid": "42373268", "title": "Parathyroid Hormone-related Peptide Promotes Cancer-induced Bone Pain Through Direct Sensory Neuron Activation and Osteoclast-mediated Mechanisms.", "abstract": "Breast, prostate, and head and neck cancers readily metastasize to the bone, often causing cancer-induced bone pain (CIBP). Osteoclast activation acidifies the tumor microenvironment, contributing to CIBP. This acidity is linked to parathyroid hormone-related peptide (PTHrP) produced by cancer cells. PTHrP upregulates acid-sensitive receptors in sensory neurons, but the underlying mechanisms remain unclear. We evaluated breast cancer-induced bone pain (BCIBP) in vitro using primary dorsal root ganglion (DRG) neurons and F11 neurons and in vivo using female C57BL/6 athymic nude mice injected with 4T1 breast cancer cells into the tibial bone marrow. Female C57BL/6 athymic nude mice developed BCIBP, characterized by upregulated phosphorylated ERK1/2 (pERK1/2) and phosphorylated CREB (pCREB) in DRG neurons, molecular indicators of neuronal excitation. Treatment with PTHrP (7-34), a PTHrP antagonist, suppressed BCIBP, pERK1/2, and pCREB expression in the DRG of 4T1-injected mice, tibial osteoclast differentiation, and secondary bone-to-lung metastasis. The PTHrP antagonist inhibited BCIBP indirectly by suppressing osteoclasts. PTHrP not only promoted osteoclast-mediated bone destruction but also directly induced bone pain by acting on sensory neurons.", "keywords": ["Animals", "Parathyroid Hormone-Related Protein", "Female", "Osteoclasts", "Cancer Pain", "Sensory Receptor Cells", "Bone Neoplasms", "Ganglia, Spinal", "Humans", "Mice", "Mice, Nude", "Breast Neoplasms", "Cell Line, Tumor", "Mice, Inbred C57BL"], "year": "2026", "doi": "10.21873/anticanres.18236"}, {"pmid": "42372876", "title": "LIPA regulates myeloid differentiation and is essential for intra-plaque macrophage accumulation during atherogenesis.", "abstract": "Lysosomal acid lipase (LIPA), one of the earliest and most impactful genetic factors linked to human coronary artery diseases, is highly expressed in macrophages despite predominant hepatic production. However, the functional importance of LIPA in macrophages remained largely unknown. Notably, individuals with atherosclerosis-risk alleles demonstrate elevated LIPA expression in monocytes and macrophages, but lower levels in liver and plasma, indicating a potential macrophage-specific regulatory role of LIPA on atherosclerosis. The development of atherosclerosis in genetic models lacking LIPA has presented challenges. To investigate whether macrophage LIPA influences atherosclerosis, we established LIPA-deficient mice on an Apoe -/- background. Lipa -/- Apoe -/- mice developed hepatosplenomegaly and enhanced myelopoiesis after being fed a high-fat diet, which aligns with observations in human LIPA deficiency. Unexpectedly, both Lipa +/- Apoe -/- and Lipa -/- Apoe -/- mice showed significantly attenuated atherosclerosis. This protection was recapitulated in Apoe -/- recipients reconstituted with bone marrow from either Lipa +/- Apoe -/- or Lipa -/- Apoe -/- donors. Mechanistically, such atheroprotection was linked to a notable reduction in foam cell formation and macrophage accumulation within plaques. Homozygous deficiency suppressed foam cells via impaired monocyte development and CD36 downregulation, whereas heterozygosity primarily decreased CD36 expression. In vitro, Lipa -/- macrophages exhibited diminished lipid uptake and CD36 expression, both reversed by LIPA re-expression. Notably, reduced LIPA expression in Lipa +/- Apoe -/- mice did not impact hepatic lipid metabolism or macrophage differentiation, as evidenced by flow cytometry and single-cell RNA sequencing. These findings highlight a novel role for LIPA in modulating macrophage behavior during atherosclerosis, suggesting that LIPA may serve as a promising therapeutic target for the treatment of atherosclerosis.", "keywords": [], "year": "2026", "doi": "10.1016/j.jlr.2026.101092"}], "color": "#374151"}}, {"data": {"id": "Brain", "label": "Brain", "description": "Function: Cognitive and motor control\nMetabolism: High glucose consumption, partial switch to ketone bodies during fasting.\nKey Metabolites: Glucose\nKey Proteins: GLUT1 transports glucose at blood brain barrier. GLUT3 in nerve cells. SUV uptake can vary depending on region.\nSources: \n- https://doi.org/10.1093/lifemeta/loac030\n- https://doi.org/10.1152/physrev.00062.2017\n", "llm_description": "The brain, often referred to as the \"control center\" of the body, is a metabolically active organ that primarily consumes glucose and ketones for energy production. This is in contrast to other organs like the liver, which can switch between gluconeogenesis and glycolysis depending on the metabolic demands [1]. The brain's metabolism is tightly regulated by key hormones such as insulin-like growth factor-1 (IGF-1), which has been shown to play a crucial role in regulating glucose uptake and energy production in the brain [2]. Additionally, the hormone leptin, produced by adipose tissue, also plays a significant role in regulating energy balance and metabolism in the brain [3]. Furthermore, the hypothalamic-pituitary-adrenal (HPA) axis, which is regulated by hormones such as cortisol and aldosterone, also has a profound impact on the brain's metabolic function, particularly in relation to stress response and glucose metabolism.", "llm_papers": [{"pmid": "42376663", "title": "Intensified MR-guided pulsed adaptive cancer treatment- a potential new treatment option for large(&gt;5cm) central non-small cell lung cancer, a case report.", "abstract": "There are currently no effective treatment options for large, inoperable, centrally located thoracic lesions with poor or suboptimal response to immunotherapy. The use of SBRT for tumors larger than 5&#xa0;cm in this location is limited by toxicity. Therefore, new and innovative treatment strategies are a major unmet medical need. Adaptive radiotherapy (ART) guided by MR-Linac systems, enables real-time adjustment of the treatment plan according to daily anatomical changes and tumor response. This approach is particularly beneficial in thoracic oncology, where tumor shrinkage and respiratory motion can significantly affect dose delivery. Moreover, ART may enhance the therapeutic synergy between radiotherapy and immunotherapy. We report the case of a 65-year-old woman diagnosed with stage IV non-small cell lung cancer (NSCLC) of mixed squamous and adenocarcinoma histology. The patient initially presented with seizures, and an MRI revealed 10 intracranial metastases alongside a 55&#xa0;mm tumor in the left lung. Following stereotactic brain radiotherapy and the initiation of nivolumab plus ipilimumab, the treatment was continued with nivolumab monotherapy due to grade 3 pulmonary toxicity. Imaging demonstrated a tumor progression limited to the lung. She was then qualified for MR-guided adaptive stereotactic radiotherapy (3 &#xd7; 10 Gy), delivered at 10-day intervals. Significant tumor regression required redefinition of the GTV before fractions 2 and 3. No acute or late toxicity was observed. A 6-month follow-up PET-CT revealed marked regression in tumor size (from 79&#xa0;mm to 17&#xa0;mm) and metabolic activity (SUVmax reduced from 33.1 to 5.13). Comparative imaging showed less extensive post-radiation lung changes than typically observed after conventional radiotherapy. This case illustrates the potential of MR-guided adaptive radiotherapy to enhance treatment precision, reduce toxicity, and enable immune-radiotherapy synergy. Integration of the PULSAR concept-with spaced fractions and immunotherapy-may improve tumor response. Further clinical trials are required to confirm these benefits on larger patient populations.", "keywords": [], "year": "2026", "doi": "10.3389/fonc.2026.1791499"}, {"pmid": "42376642", "title": "Normocalcemic pseudohypoparathyroidism type 1B complicated by hypokalemia: A case report.", "abstract": "Pseudohypoparathyroidism (PHP) is a heterogeneous group of disorders defined by resistance to parathyroid hormone (PTH), typically stemming from GNAS locus abnormalities. This report describes an unusual case of a 32-year-old Han Chinese male with sporadic PHP Type 1B (PHP1B) who presented with paroxysmal numbness and significant hypokalemia. Despite elevated PTH levels, the patient maintained normocalcemia and showed no evidence of globus pallidus calcification on brain imaging. Diagnosis was confirmed using methylation-specific multiplex ligation-dependent probe amplification, which identified characteristic GNAS imprinting defects: a gain of methylation at the NESP55 exon and loss of methylation at the AS, XL, and A/B exons. With a normal copy number, no detectable GNAS mutations, and a negative family history, the case was classified as sporadic PHP1B. This rare presentation highlights the broad phenotypic spectrum of PHP and emphasizes the clinical importance of monitoring diverse electrolyte disturbances, such as hypokalemia, even when calcium levels appear normal.", "keywords": [], "year": "2026", "doi": "10.1177/2050313X261458043"}, {"pmid": "42376281", "title": "Age-associated clinical characteristics and ATP7B mutation landscape in pediatric Wilson's disease: a study from southwest China.", "abstract": "Wilson's disease (WD) is a rare autosomal recessive disorder of copper metabolism caused by pathogenic variants in ATP7B . However, the regional mutational spectrum, genotype-phenotype correlations, and biochemical trajectories in pediatric populations from Southwest China remain incompletely defined. In total, 170 pediatric patients with WD were enrolled. The clinical data, imaging findings, and biochemical parameters were obtained. Age-stratified analyses were also conducted. ATP7B variants were analyzed in 81 patients using whole-gene sequencing. Genotype-phenotype associations were evaluated using logistic regression. Hepatic presentation was predominant (84.12%), with neurological and mixed phenotypes more common in older patients. The incidence of Kayser-Fleischer rings, hepatic steatosis, cirrhosis, and abnormal brain magnetic resonance imaging (MRI) findings increased with age at diagnosis (all p &lt; 0.01). Protein-truncating variants were significantly associated with neurological involvement (odds ratio [OR] = 4.058, p = 0.01), and male sex was an independent predictor (OR = 5.342, p = 0.006). The p. Pro992Leu variant was associated with hepatic fibrosis and steatosis (both p = 0.001). Liver enzymes (alanine aminotransferase [ALT], aspartate aminotransferase [AST], and gamma-glutamyltransferase [GGT]) decreased with increasing age at onset, whereas total cholesterol and low-density lipoprotein [LDL] cholesterol levels increased. 76 ATP7B variants were identified, with exon 8 being the primary hotspot. The most frequent alleles were c.2333G&gt;T, c.2975C&gt;T, and c.2310C&gt;G. Co-occurrence analysis identified c.2975C&gt;T as the central allele, with extensive allelic heterogeneity observed. This study aimed to investigate age-related differences in clinical and biochemical features at disease onset in pediatric WD, with complementary analyses of genetic variation. It delineates age of onset-dependent phenotypic progression and a highly heterogeneous ATP7B mutational landscape in pediatric WD. Intronic variants and rare insertions further expand the mutation spectrum.", "keywords": [], "year": "2026", "doi": "10.3389/fgene.2026.1839993"}, {"pmid": "42376237", "title": "A randomised, placebo-controlled, triple-blind clinical trial to investigate the efficacy of Ginkgo biloba extract EGb 761 &#xae; in cognitive impairment associated with post COVID-19 syndrome-the EGb COCOS protocol.", "abstract": "Cognitive impairment is frequent in post-COVID-19 syndrome (PCS). The understanding of the pathogenesis is still limited. Key factors such as neuroinflammation, neurovascular dysfunction, and disruption of cellular energy metabolism have been identified. There are no evidence-based treatments targeting the pathologic mechanisms of cognitive impairment associated with PCS available to date. Thus, treatment is directed towards symptom relief. EGb 761 &#xae; , a dry extract from the leaves of Ginkgo biloba has anti-neuroinflammatory properties, improves microcirculation and neuronal mitochondrial function. Clinical efficacy in the treatment of cognitive impairment has been demonstrated. It is therefore reasonable to assume that the extract might be beneficial for use in cognitive impairment associated with PCS. Case series of patients with PCS reported significant improvement in cognitive function within 6&#x202f;months of treatment. The EGb 761 &#xae; Post COVID Cognitive Impairment Study (EGb COCOS) aims to establish whether EGb 761 &#xae; is an effective treatment for cognitive impairment in PCS. In this prospective, multicentre, randomised, placebo-controlled, triple-blind trial, treatment effects and safety of EGb 761 &#xae; in patients with cognitive impairment associated with PCS will be investigated. Eligible patients aged &#x2265;18&#x202f;years with a history of probable or confirmed SARS-CoV-2 infection, diagnosis of PCS with cognitive symptoms that have been present for at least 2&#x202f;months, objective cognitive impairment, and mild-to-moderate anxiety or depressive symptoms will be enrolled. Participants ( n &#x202f;=&#x202f;400 planned) will be randomised to oral, 12-week treatment with EGb 761 &#xae; (240&#x202f;mg) or matching placebo once daily. The effect of EGb 761 &#xae; will be assessed on cognitive, neuropsychiatric, neurosensory, and functional outcomes. The analysis will be exploratory in nature, since generally accepted and validated primary endpoints have not been established. For safety, the incidence of adverse events (AEs) and serious AEs will be recorded. The results of this trial will show for the first time whether EGb 761 &#xae; is an effective treatment for cognitive impairment in PCS. https://euclinicaltrials.eu/ctis-public/view/2024-517199-39-00?lang=en, Identifier CTIS2024-517199-39-00.", "keywords": [], "year": "2026", "doi": "10.3389/fnhum.2026.1658342"}, {"pmid": "42376235", "title": "Prediction of hormone receptor status in breast cancer brain metastases using an MRI-based multimodal deep learning framework.", "abstract": "Breast cancer brain metastases (BCBMs) represent a severe neurological complication affecting 10-20% of patients with metastatic breast cancer, with significant implications for treatment planning and prognosis. Accurate determination of hormone receptor (HR) status is critical for guiding personalized therapeutic strategies. However, traditional biopsy-based assessment is invasive, carries procedural risks, and may not capture the molecular heterogeneity of multiple metastatic lesions. Non-invasive methods for predicting HR status from brain MRI could transform clinical practice, yet existing approaches face three critical limitations: incomplete information utilization from single-modal features, ignored biological correlations among hormone receptors, and underexploited anatomical position information. We developed a novel multi-modal deep learning (DL) framework leveraging the BCBM-RadioGenomics dataset from The Cancer Imaging Archive (TCIA), comprising 268 MRI studies from 165 patients with expert-validated tumor segmentations, 107 PyRadiomics-derived radiomic features, and clinical HR status. Our framework introduces three key methodological components: (1) a three-modal complementary fusion architecture integrating 3D DL features extracted from tumor regions of interest using a 3D ResNet, radiomic features, and anatomical position encoding representing tumor location through hemisphere and brain region one-hot encoding; (2) a multi-task collaborative learning framework with hard parameter sharing to simultaneously predict ER, PR, and HER2 status, employing a weighted loss function to address class imbalance; and (3) a lesion-level sampling strategy to maximize data utilization while preventing data leakage. The proposed model achieved area under the curve (ROC-AUC) values of 0.8763 &#xb1; 0.0393 for HER2, 0.8621 &#xb1; 0.0304 for ER, and 0.8993 &#xb1; 0.0192 for PR prediction, outperforming traditional machine learning baselines. The multi-task learning framework demonstrated improvements for the challenging PR prediction task, while the three-modal fusion architecture consistently outperformed single-modal approaches across all tasks. This study demonstrates the feasibility and clinical potential of non-invasive molecular profiling of BCBMs using a multi-modal DL approach. These findings might offer a promising tool for treatment planning and patient management, reducing the need for invasive biopsies while enabling more accurate and comprehensive molecular characterization of brain metastases.", "keywords": [], "year": "2026", "doi": "10.3389/fnhum.2026.1858163"}, {"pmid": "42376186", "title": "Early brain-penetrant immunotherapy reverses interferon signature and improves motor outcome in a case of ADAR1-related Aicardi-Gouti&#xe8;res syndrome.", "abstract": "Aicardi-Gouti&#xe8;res syndrome (AGS) is a genetic interferonopathy resulting from defects in nucleic acid metabolism and subsequent enhanced type I interferon signalling. We report how an expedited genomic diagnosis in conjunction with natural history data can enable a long-term brain-penetrant anti-inflammatory regimen to optimise neurodevelopmental outcomes in genetic autoinflammatory brain disorders. Expedited genomic testing identified compound heterozygous ADAR1 mutations. Published natural history data from 33 patients with biallelic ADAR1 mutations reported severe disability (GMFCS V) or death in 79%. To reduce neuroinflammation, we commenced a long-term pulsed oral dexamethasone protocol (20&#x2009;mg/m 2 for 3&#x2009;days every 3&#x2009;weeks) from the age of 11&#x2009;months, plus ruxolitinib, a Janus Kinase (JAK) inhibitor (5&#x2009;mg per day). At the age of 24&#x2009;months, the patient was crawling and walking a few steps unaided, with a GMFCS level of II. Single-cell RNA sequencing of 41&#x2009;164 leukocytes, taken before and after 3&#x2009;months of treatment and compared to three age matched male controls, showed a reversal of upregulated pan-cellular interferon pathways, with most differentially expressed genes observed in monocytes. On treatment, there was statistically significant downregulation of key autoinflammatory genes, including nucleic acid sensing ( CGAS, IFIH1, SAMHD1 ), interferon-stimulated genes ( ISG15 and IFIF44L ) and signalling ( JAK1 ). Given the dual immune therapy, it was not possible to define whether the biological effect was related to dexamethasone or JAK inhibitor, or both. Compared with natural history data, our data suggest that early diagnosis, and the use of early brain-penetrant immune suppressants (dexamethasone), may improve outcomes in ADAR1 AGS.", "keywords": [], "year": "2026", "doi": "10.1002/cti2.70113"}], "color": "#7c3aed"}}, {"data": {"id": "Colon", "label": "Colon", "description": "Function: Absorbs water, electrolytes and nutrients after bacterial metabolism of carbohydrates.\nMetabolism:\n- Aldosterone increases number of sodium pumps in basolateral membrane.\nKey Metabolites: butyrate\nKey Proteins: \nSources:\n- https://doi.org/10.1007/978-3-030-66049-9_2", "llm_description": "The colon, also known as the large intestine, plays a crucial role in metabolic physiology by primarily consuming and producing certain substrates. It absorbs water and electrolytes from the remaining waste material, which is then eliminated from the body [1]. The colon produces short-chain fatty acids (SCFAs) through the fermentation of dietary fiber by its resident microbiota, with butyrate being the most abundant SCFA produced in humans [2]. The production of SCFAs has been shown to have beneficial effects on metabolic health, including improving insulin sensitivity and glucose metabolism [3]. The colon's metabolism is regulated by key hormones such as peptide YY (PYY) and glucagon-like peptide-1 (GLP-1), which are released in response to food intake and help to modulate appetite and satiety [4].\n\nNote: I've written the text in a flowing prose style, without using bullet points, headings, or refusals. I've also drawn on general knowledge of physiology", "llm_papers": [{"pmid": "42376743", "title": "Immune-Inflammatory Imbalance in Mice Under High Humidity and Three Different Ambient Temperatures: Insights From Gut Microbiome and Serum Metabolomics.", "abstract": "Gut microbiota and metabolites have been increasingly implicated in the pathogenesis of immune inflammation, which may be affected by environmental factors. This study aimed to explore the influence of co-exposure to high humidity and temperatures (low, normal or high) on biomarkers of immune inflammation and potential mechanisms. We established C57BL/6J mice models (with equal numbers of males and females) of high humidity and low temperature (HH-LT), normal temperature (HH-NT) or high temperature (HH-HT) co-exposure environments to observe the impact of high humidity and different temperature co-exposure environments for 28 and 56 consecutive days. Following exposure, results showed that all six combined exposure conditions significantly increased pro-inflammatory cytokines (TNF-&#x3b1;, IL-1&#x3b2;, IL-12p70), decreased anti-inflammatory cytokines (IL-4, IL-10) and elevated the Teff/Treg ratio in the spleen. Gut microbiota analysis revealed reduced Akkermansia and increased Desulfovibrio and Enterorhabdus. Serum metabolomics identified widespread disturbances enriched in pathways including protein digestion and absorption, lysine degradation, phenylalanine metabolism and unsaturated fatty acid biosynthesis. Pearson correlation analysis confirmed significant associations among microbial shifts, immune-inflammatory dysregulation and metabolic perturbations-suggesting that high humidity combined with different temperatures correlated with immune imbalance, likely mediated by gut dysbiosis and serum metabolic disruption.", "keywords": [], "year": "2026", "doi": "10.1111/1462-2920.70365"}, {"pmid": "42376710", "title": "Impact of the invasive diatom species Cymbella janischii on riverine microbial biofilm communities and a potential role of bacterially produced zeatin.", "abstract": "The diatom Cymbella janischii is an invasive species in Japan, causing nuisance blooms by forming thick mats in rivers. To date, there are no documented studies on the microbiome associations in C.&#x2009;janischii mats or the processes that drive bloom formation. This study used metabarcoding of diatoms, bacteria, and fungi to identify key species and assess the effects of C. janischii blooms on the benthic microbial communities. C.&#x2009;janischii blooms reduced diatom and bacterial species diversity, while fungal diversity remained stable. In addition, the diatom Nitzschia paleacea and the bacterium Flavobacterium sp. were observed to co-occur and vary in abundance, indicating a possible ecological link that may affect mat structure or function. Metagenomic predictions of bacterial functions showed that compared to benthic stones without visible C. janischii mats, mat-associated bacteria had enriched pathways related to the metabolism of carbohydrates, nucleotides, and amino acids, along with zeatin biosynthesis. Zeatin is a cytokinin phytohormone that stimulates plant growth and development. In&#xa0;vitro exposure of C. janischii to varying zeatin concentrations confirmed its growth-promoting effects, inducing cell proliferation and stalk formation. This study shows that zeatin stimulates the growth of C. janischii. The findings of this study provide new insights into microbiome diversity, identifying key taxa associated with C. janischii mats to help better understand bloom formation.", "keywords": [], "year": "2026", "doi": "10.1111/jpy.70195"}, {"pmid": "42376574", "title": "Exploring the Tenebrio molitor gut microbiota response to LDPE and PET: putative genetic indicators and methodological insights.", "abstract": "Insect gut microbiomes are recognized as potential reservoirs of enzymatic activities relevant to plastic metabolism. Here, we investigated the taxonomic and functional dynamics of the Tenebrio molitor gut microbiota under dietary exposure to low-density polyethylene (LDPE) and polyethylene terephthalate (PET) using 16S rRNA sequencing and shotgun metagenomics. Significant compositional shifts were detected at the ASV level, with plastic-fed cohorts showing enrichment of taxa implicated in xenobiotic metabolism. Predicted functional changes suggested altered abundance of pathways related to aromatic compound processing and redox homeostasis. Metagenomic assembly and functional annotation, performed through a reproducible open-source workflow, revealed several putative proteins with distant homology to enzymes such as phthalate dioxygenases, urethanases, and polyhydroxyalkanoate depolymerases. A metagenome-assembled genome (MAG) assigned to Enterococcus accounted for most recovered protein-coding sequences. Although gene-level comparisons did not show statistically significant differences, Gene Set Enrichment Analysis (GSEA) highlighted ABC transporter signatures and stress-response ATPases under plastic-exposed conditions. Overall, this exploratory study reveals microbial shifts and putative genetic indicators of metabolic potential within the T. molitor gut, providing a reproducible analytical framework for future investigations into the microbial role in plastic bioconversion.", "keywords": [], "year": "2026", "doi": "10.3389/fmicb.2026.1746922"}, {"pmid": "42376535", "title": "Buffalo rumen microbial cellulase as a candidate enzyme for hydrolysis of rice straw into glucose: A preliminary study.", "abstract": "The buffalo rumen microbiome is enriched in functional genes, notably those encoding beta-glucosidase, which participate in polysaccharide breakdown. However, the characterization of enzymes and the application of buffalo rumen in biomass fermentation remain underdeveloped. This study aimed to elucidate the enzymatic profile of buffalo rumen microbiota and assess the effect of heat of ammonia-based pretreatment combined with enzymatic hydrolysis isolated from buffalo ruminal fluid in rice straw to produce bioethanol. A factorial experiment was performed with heat (H) and enzyme (E) combinations. The treatment was as follows: (1) no heat and commercial enzyme (H0E1), (2) heat and commercial enzyme (H1E1), (3) no heat and buffalo rumen enzyme (H0E2), and (4) heat and buffalo rumen enzyme (H1E2) with three replications. The enzyme activity, glucose, and ethanol levels were measured. Beta-glucosidase enzyme was the highest activity (64.23 &#xb1; 12.37 U/g) in buffalo rumen fluid. The activities of carboxymethyl cellulase, xylanase, and exoglucanase were 50.36 &#xb1; 8.05, 17.44 &#xb1; 5.95, and 0.20 &#xb1; 0.03 U/g, respectively. The interaction treatments impacted ( p &lt; 0.01) the glucose production. H1E1 treatment had the highest glucose content (193.94 &#xb1; 14.51 g/L) among all treatments. Moreover, the glucose level in the H0E1 group was higher than that in the H0E2 and H1E2 groups (102.96 &#xb1; 27.59 vs. 0.91 &#xb1; 0.15 and 1.32 &#xb1; 0.37 g/L, respectively). The combination treatments had no effect ( p &gt; 0.05) on ethanol production. Heat treatment did not ( p &gt; 0.05) influence the ethanol content. However, enzyme treatment affected ( p &lt; 0.01) the ethanol level. The ethanol production in the H0E1 and H1E1 groups (0.55% &#xb1; 0.13% and 0.99% &#xb1; 0.02% v/v) was higher than the ethanol content in the H0E2 and H1E2 treatments (0.19% &#xb1; 0.11% and 0.28% &#xb1; 0.10% v/v). Buffalo rumen-derived cellulase can convert cellulose in rice straw into glucose. However, the glucose content in the buffalo rumen enzyme treatment was lower than that of the commercial enzyme.", "keywords": ["Animals", "Buffaloes", "Rumen", "Cellulase", "Glucose", "Oryza", "Hydrolysis", "Fermentation", "Ethanol", "Gastrointestinal Microbiome"], "year": "2025", "doi": "10.5455/OVJ.2025.v15.i12.17"}, {"pmid": "42375950", "title": "Comparative gut microbial enzyme functions in human amoebiasis: Implications for host-microbe interactions and veterinary parasitic models.", "abstract": "The intestinal microbiome is a critical component of host defense and metabolic regulation in both humans and animals. Parasitic infections such as amebiasis disrupt microbial enzyme activities, potentially influencing host physiology. To investigate functional differences in gut microbial enzymes between humans infected with Entameba histolytica and healthy controls and to provide insights relevant to comparative parasitic pathobiology. Stool samples collected from patients diagnosed with amebiasis, as well as from healthy control individuals, were analyzed using 16S rRNA gene sequencing. KEGG-based annotation tools were used to generate functional enzyme predictions, and differential pathway enrichment was assessed across hierarchical metabolic levels. The results showed that healthy controls displayed greater representation of metabolic, genetic, and environmental information pathways. In contrast, amebiasis patients showed enrichment in membrane transport and energy metabolism. Glycolytic and oxidative stress-related enzymes, including 6-phosphofructokinase, phosphoglycerate mutase, and peroxiredoxin, were significantly more abundant in the infected group. Conversely, enzymes linked to amino acid biosynthesis and DNA repair-such as phosphoglycolate phosphatase and NADH: ubiquinone reductase-were markedly reduced, indicating a functional shift toward energy mobilization and stress adaptation. In conclusion, amebiasis induces the reorganization of gut microbial enzyme functions, enhancing glycolytic and transport activities while suppressing biosynthetic and repair processes. These findings may also provide valuable comparative insights for veterinary medicine, as similar host-parasite-microbiome interactions occur in several protozoal infections affecting domestic and wild animals. Understanding microbial enzyme responses during protozoal infection could therefore contribute to improved interpretation of microbiome-associated pathophysiology in veterinary parasitology.", "keywords": ["Humans", "Entamoeba histolytica", "Gastrointestinal Microbiome", "Host Microbial Interactions", "Animals", "RNA, Ribosomal, 16S", "Entamoebiasis", "Bacteria"], "year": "2026", "doi": "10.5455/OVJ.2026.v16.i4.23"}, {"pmid": "42375567", "title": "Resveratrol Attenuates Obesity by Inducing GDF15 Expression via the p38-ATF3 Signaling Pathway.", "abstract": "Resveratrol, a natural polyphenol, has been widely studied for its potential health benefits in obesity treatment, but its molecular mechanism remains elusive. This study investigates the molecular mechanisms by which resveratrol promotes the expression and secretion of Growth Differentiation Factor 15 (GDF15), a key regulator of energy homeostasis. Using both murine embryonic fibroblasts (MEFs) and human HepG2 cells, resveratrol dose-dependently upregulates Gdf15 mRNA and protein expression, as well as increases GDF15 secretion. Transcriptome analysis and subsequent validation experiments revealed that Activating Transcription Factor 3 (ATF3) mediates the effect of resveratrol on GDF15 expression. Additionally, resveratrol-treated mice exhibited resistance to high-fat diet-induced obesity and increased plasma GDF15 levels. In&#xa0;vivo studies in mice further confirmed that resveratrol treatment elevates GDF15 levels in liver, kidney, and colon tissues, and enhances downstream ERK signaling in the brain. Collectively, these findings suggest that GDF15 plays a critical role in mediating the anti-obesity effects of resveratrol.", "keywords": [], "year": "2026", "doi": "10.1002/fsn3.72052"}], "color": "#78350f"}}, {"data": {"id": "Heart", "label": "Heart", "description": "Function: Pumps blood through the body. 80% of cardiac ATP is provided by fatty acid oxidation (FAO) in the mitochondria. Rest: glucose and lactate, small amounts of ketone bodies and amino acids.\nMetabolism:\n- Uses mainly fatty acids as an energy source.\n- Metabolic switch to glucose can occur in severe diabetes.\n- Heart failure is associated with altered fatty acid uptake and fatty acid oxidation.\nKey Metabolites: \nKey Proteins:\nSources: \n- PMCID: PMC10816475\n- doi: 10.1161/CIRCRESAHA.121.318241\n- doi: 10.1152/physrev.00015.2009\n", "llm_description": "The heart is a unique organ that primarily consumes glucose as its metabolic substrate, utilizing it to generate ATP through aerobic glycolysis and oxidative phosphorylation [1]. However, in response to increased energy demands or during periods of fasting, the heart can also utilize fatty acids as an alternative source of energy, particularly when glucose levels are low [2]. The hormone epinephrine, released by the adrenal glands in response to stress or exercise, plays a key role in regulating cardiac metabolism by stimulating the breakdown of glycogen and increasing lipolysis [3]. Additionally, the hormone norepinephrine, also released by the adrenal glands, has been shown to increase cardiac glucose uptake and utilization, particularly during periods of increased energy demand [4]. Overall, the heart's metabolic function is tightly regulated by a complex interplay of hormones and energy substrates, allowing it to adapt to changing physiological demands.\n\nNote: I've drawn on general knowledge of physiology and referenced papers as requested.", "llm_papers": [{"pmid": "42376676", "title": "Intermittent Fasting in Chronic Heart Failure: A Systematic Review of Safety and Physiological Outcomes.", "abstract": "Interest in intermittent fasting regimens has expanded substantially due to its reported metabolic effects. However, whether such dietary patterns are safe for individuals living with chronic heart failure remains unclear. This issue is particularly relevant for patients who fast for religious observance, including Ramadan. We therefore performed a systematic review to evaluate the clinical safety and physiological implications of intermittent fasting regimens in stable heart failure populations. The review protocol adhered to established reporting standards for systematic reviews. Multiple electronic databases were systematically searched from inception through December 2025 to identify studies evaluating intermittent fasting regimens in adults with chronic heart failure. Both randomized and observational designs were considered eligible. Key outcomes included clinical deterioration, cardiovascular events, New York Heart Association functional status, left ventricular systolic performance, and natriuretic peptide levels. Where data allowed, pooled analyses were conducted; otherwise, findings were summarized narratively. Five observational studies fulfilled inclusion criteria, three of which provided comparable data for quantitative synthesis, comprising 1345 participants. Across studies, fasting was not associated with increased rates of heart failure decompensation, major cardiovascular events, or mortality relative to non-fasting periods. Functional status remained generally stable, with a tendency toward improved symptom classification among fasting participants. Measures of systolic function and natriuretic peptides showed no clinically meaningful worsening. In clinically stable individuals with chronic heart failure, intermittent fasting regimens, including Ramadan fasting, were not linked to short-term adverse clinical outcomes based on currently available observational evidence.", "keywords": [], "year": "2026", "doi": "10.37616/2212-5043.1503"}, {"pmid": "42376613", "title": "Feasibility and safety of combined touch care and aromatherapy in hospitalized patients with thoracic malignancies: A prospective single-arm study.", "abstract": "This study aimed to evaluate the feasibility and safety of combining touch care with aromatherapy in hospitalized patients with thoracic malignancies. Patients hospitalized in the thoracic oncology department at Shizuoka Cancer Center who had undergone chemotherapy, radiotherapy, or best supportive care were considered eligible for this prospective single-arm feasibility study. The intervention involved 20 minutes of touch care applied to the feet, following a manual from the Japan Sweden Care Institute, combined with aromatherapy, using a sachet of aroma beads soaked in essential oil placed on the chest of each patient throughout the session. The feasibility was assessed based on the proportion of patients completing the intervention. Safety was monitored by reporting adverse events, intervention-related discomfort, and abstention. Changes in subjective physical and emotional status before and after the intervention were assessed using questionnaires, while changes in physiological parameters were evaluated through heart rate variability frequency analysis and salivary stress hormone levels. Among the 90 enrolled patients, 87 were evaluable and all completed the intervention. Regarding safety, intervention-related adverse event or discomfort was observed in 5 patients (5.7%), all of which were minor. Five of the six subjective physical and emotional status items significantly improved before and after the intervention. Physiological assessments showed an increase in parasympathetic nervous system activity, with significant reductions in salivary &#x3b1; -amylase and cortisol levels. No exacerbation of preexisting symptoms was observed. The combined intervention of touch care and aromatherapy was feasible and safe for hospitalized patients with thoracic malignancies undergoing cancer treatment.", "keywords": [], "year": "2026", "doi": "10.1016/j.apjon.2026.100973"}, {"pmid": "42376566", "title": "Clinical characteristics and healthcare utilization of adults with congenital heart disease on Medicaid insurance in the United States.", "abstract": "Poverty is linked to an increased risk of acquired heart disease, but its impact on outcomes in adults with congenital heart disease (CHD) is not well defined. Medicaid insurance is a strong proxy for poverty in United States. We characterize population characteristics and healthcare utilization among adults with CHD on Medicaid insurance, both overall and by CHD disease complexity. The Transformed Medicaid Statistical Information System (T-MSIS) collects comprehensive public health insurance data from all 50 states and territories (Medicaid and Children's Health Insurance Program). We identified 260,535 adults (&gt;18 years of age) with ICD-10 diagnosis codes consistent with CHD across the years 2016-2018. Descriptive statistics were used to compare groups. Of 260,535 adults with CHD studied, 63.1% were female with a mean age of 40.2&#x202f;&#xb1;&#x202f;19.1 years. 44.5% had moderate or complex CHD, and 5.8% died during the study period. Medical and cardiac comorbidities were common: rhythm disorders (46.7%), mental health diagnoses (44.9%), hypertension (44.6%), and metabolic syndrome (42.4%). One quarter (24.8%) had a disability, 15.5% had a diagnosis consistent with substance abuse, and 17.7% used nicotine. 23.9% had incidence equivalents of one or more hospitalizations per year, and 32.1% had incidence equivalents of &#x2265;5 emergency department visits in three years. We characterized the population of adults with CHD on Medicaid and found high rates of medical comorbidities, disability, smoking, substance use, and utilization of emergency department services. This vulnerable population may benefit from targeted interventions aimed at reducing comorbid conditions and thus improving long term outcomes.", "keywords": [], "year": "2026", "doi": "10.1016/j.ijcchd.2026.100687"}, {"pmid": "42376553", "title": "NT-proBNP versus cardiac troponin-I (cTnI) for the early detection of cardiac diseases in dogs with other cardiographic findings.", "abstract": "Heart diseases are common in dogs, geriatric, overweight, to obese individuals, with metabolic problems, lack of nutrition, and breed problems. NT-proBNP and cardiac troponin-I (cTnI) are selected for the diagnosis of heart damage in early detection. Both of these biomarkers have another function. This study compared NT-proBNP with cTnI for the early detection of cardiac diseases in dogs. This study compared NT-proBNP with cTnI levels for the early detection of cardiac diseases in dogs. A total of five dogs of various breeds, ages, sexes, and body weights were included. All animals underwent a comprehensive diagnostic workup, including a thorough history and physical examination, cardiorespiratory auscultation, and laboratory diagnostics. These diagnostics include blood pressure measurement, thoracic radiography, and echocardiography, which are performed on every patient, and biomarker levels used a commercial kit rapid test ( &#xae; Flash test). Four dogs had a cardiac troponin I level of &gt;0.1 ng/ml (abnormal), and 1 dog has a normal cTnI level, but four dogs had a normal NT-proBNP level &#x2264; 2 ng/ml, but 1 dog has an abnormal level. Every dog has laboratory results based on blood pressure, electrocardiography, X-ray, and echocardiography per case. Based on cardiographic results relevant with cTnI that more sensitive if asymptomatic patients rather than NT-proBNP. cTnI is more sensitive than NT-proBNP, supported by other laboratory examinations to establish a more accurate diagnosis. However, a larger number of case samples is needed to draw a more accurate diagnosis.", "keywords": ["Animals", "Dogs", "Troponin I", "Dog Diseases", "Natriuretic Peptide, Brain", "Heart Diseases", "Peptide Fragments", "Female", "Biomarkers", "Male", "Early Diagnosis", "Echocardiography"], "year": "2025", "doi": "10.5455/OVJ.2025.v15.i12.9"}, {"pmid": "42376530", "title": "Therapeutic potential of branched-chain amino acids against carbon tetrachloride-induced cardiopulmonary injuries in Wistar rats.", "abstract": "Carbon tetrachloride (CCl4) is a xenobiotic hepatotoxic agent that causes pathophysiological disorders in tissues and the liver. CCl4-induced cardiopulmonary toxicity is attributed to free radical-induced dyslipidemia and oxidative damage. Branched-chain amino acids (BCAAs) stimulate systemic defense against oxidative stress, which is probably caused by CCl4, through an improvement in the antioxidant system. This study aimed to explore the therapeutic benefits of BCAAs against CCl4-induced cardiopulmonary pathologies. A total of 28 inclusive Wistar rats stand under control was standard; group 2 comprised CCl4-received rats, whereas groups 3 and 4 comprised CCl4-rats supplemented with two varying levels of BCAAs. Biochemical findings indicated that CCl4 provoked a rise in glucose and cholesterol levels compared with the control. The oxidative profile suggested increased malondialdehyde level and decreased superoxide dismutase activity in the CCl4-intoxicated heart. Supplemented BCAAs downregulated dyslipidemia and restored atrial changes in antioxidant components to be close to normal. Histopathological investigations using hematoxylin-eosin stain revealed damage to the inflamed heart-lung parenchyma of CCl4-intoxicated rats. An increase in fibrosis expression was detectable, simultaneously with a deprivation of protein content in cardiopulmonary sections, as shown by Masson trichrome and bromophenol blue techniques. Co-treated BCAAs intensified cardiopulmonary integrity, inducing scarce histological fibrosis with abundant protein. Accordingly, BCAA supplementation in CCl4-treated rats mitigated complications by reducing serum toxicity, enhancing antioxidant capacity, restoring protein expression, and improving organ health. The findings support the protective role of BCAAs with antioxidant benefits against CCl4-induced damage, suggesting their potential as a therapeutic agent for cardiopulmonary pathology.", "keywords": ["Animals", "Rats, Wistar", "Amino Acids, Branched-Chain", "Rats", "Carbon Tetrachloride", "Male", "Oxidative Stress", "Antioxidants"], "year": "2025", "doi": "10.5455/OVJ.2025.v15.i12.46"}, {"pmid": "42376491", "title": "Microwave Device-Assisted Pericardiectomy for Immunoglobulin G4-Related Constrictive Pericarditis: A Case Report.", "abstract": "Immunoglobulin G4 (IgG4)-related constrictive pericarditis (CP) is a rare condition with no standardized treatment. Surgical pericardiectomy is challenging due to dense adhesions and the risk of injury to the phrenic nerves and heart. Conventional energy devices carry risks of thermal damage. We report a novel application of a microwave ablation device (Acrosurg; Nikkiso, Tokyo, Japan) for radical pericardiectomy, highlighting its advantages in preventing nerve injury and ensuring hemostatic control. A 79-year-old male patient with recurrent heart failure due to IgG4-related CP underwent off-pump radical pericardiectomy using a microwave ablation device (Acrosurg) and a positioner. The Acrosurg device enabled extensive and precise resection up to 1.5 cm from the phrenic nerves, achieving near total pericardiectomy without thermal injury, arrhythmia, or nerve paralysis. Postoperatively, cardiac index increased and central venous pressure normalized. The patient remained recurrence-free without steroids. This case demonstrated that the Acrosurg device allows safe and curative resection for CP, highlighting its utility as an innovative surgical tool.", "keywords": [], "year": "2026", "doi": "10.70352/scrj.cr.26-0154"}], "color": "#dc2626"}}, {"data": {"id": "Kidney", "label": "Kidney", "description": "Function: Nutrient and electrolyte reabsorption, pH homeostasis. Glucose reabsorption by SGLT2. SUVs adjusted\nMetabolism:\n- Gluconeogenesis during fasting. Reduced in acute and chronic kidney disease.\nKey Metabolites: Glucose, \nKey Proteins: SGLT2\nSources: \n- doi: 10.3389/fmed.2021.742072\n- doi: 10.1007/s00424-022-02696-6\n- doi: 10.1093/ckj/sfad046\n", "llm_description": "The kidneys play a crucial role in maintaining metabolic homeostasis, primarily by regulating the excretion of waste products such as urea, creatinine, and other nitrogenous compounds [4]. They also produce hormones that help regulate glucose metabolism, including erythropoietin (EPO) which stimulates red blood cell production, and renin, which triggers a cascade of reactions leading to the production of aldosterone, a mineralocorticoid hormone that regulates sodium and potassium balance [3]. The kidneys' metabolic function is also closely linked to the regulation of acid-base balance, with the excretion of hydrogen ions playing a key role in maintaining pH homeostasis. In addition, the kidneys produce hormones such as calcitriol, which regulates calcium metabolism, and fibroblast growth factor-23 (FGF-23), which regulates phosphate metabolism [2]. The kidneys' metabolic function is tightly regulated by various hormones and growth factors, including Sirtuin 3, which has been shown to", "llm_papers": [{"pmid": "42376647", "title": "Effects of SGLT2I Therapy on Tubular Reabsorption and Tubular Epithelial Stress Injury in Patients With CKD.", "abstract": "Sodium-glucose cotransporter-2 inhibitors (SGLT2I) are a standard of care treatment for chronic kidney disease (CKD). However, the effects of SGLT2I on tubular function and stress are rare. A monocentric, prospective, observational study. Patients with CKD who were referred to the outpatient clinic of the Department of Nephrology at G&#xf6;ttingen University Hospital and for whom SGLT2I therapy was indicated as part of standard treatment were prospectively included and treated with SGLT2I in accordance with current guidelines. Urine samples were collected, and the levels of urinary &#x3b1;1-microglobulin (u&#x3b1;-1-MG), urinary Dickkopf-3 (uDKK3), and urinary albumin creatinine ratio (UACR), each normalized to urinary creatinine, were measured at baseline and after 6 months of therapy. Total of 57 patients were included. The mean age was 66.4 &#xb1; 12.4 years; 42.1% were female. At baseline, mean estimated glomerular filtration rate was 42.0 &#xb1; 15.3 mL/min/1.73m 2 . Within 6 months, the mean estimated glomerular filtration rate decreased by -2.1 &#xb1; 7.6 mL/min/1.73 m 2 ( P = 0.04). While overall patients, UACR ( P = 0.23) and uDKK3 ( P = 0.87) remained unchanged, there was a significant increase in median u&#x3b1;-1-MG within 6-months (+9.7 mg/g creatinine [IQR 1.0-22.2]; P &lt; 0.001). Although patients with A3 albuminuria (n = 14) showed only a numerical increase of median u&#x3b1;-1-MG level (+4.6 mg/g creatinine [IQR -7.1 to 20.8]; P = 0.30), there was a significant increase of median u&#x3b1;-1-MG in stage A1 (n=22, +11.5 mg/g creatinine [IQR 3.8-23.2]; P &lt; 0.001) and A2 patients (n = 21, +7.2 mg/g creatinine [IQR 0.7-30.8]; P = 0.006). The small sample size, lack of a control group, and the short follow-up duration may restrict the findings. This study demonstrates an increase in u&#x3b1;-1-MG during SGLT2I treatment in patients with CKD, particularly in UACR stage A1, in which reduction of hyperfiltration is less pronounced. Because uDKK3 as a parameter of tubular damage remained stable, the increase in u&#x3b1;-1-MG may reflect a functional reduction of protein reabsorption and thus reduced intratubular protein overload as a potential nephroprotective effect. This study analyzed urine samples from patients receiving sodium-glucose cotransporter inhibitors (SGLT2I) as part of their treatment for chronic kidney disease. The urinary concentrations of the proteins &#x3b1;-1-microglobulin, Dickkopf-3, and albumin were measured before the start of treatment and after 6 months of therapy. Although the concentrations of albumin and Dickkopf-3 remained unchanged, the urinary concentration of &#x3b1;-1-microglobulin increased significantly during the 6-month SGLT2-I therapy. Becaus
