oods sourced from crops such as Glycine max and Brassica oleracea may offer sustainable solutions. This study evaluated the effects of G. max ethanol extract (EEG), Brassica oleracea methanol extract (MEB), and their combinations on bodyweight, hematologic status, and molecular outcomes in a rat model of malnutrition. Male Wistar rats were fed a low-protein diet for 14 days to induce PEM, followed by a 28-day oral treatment phase using EEG, MEB, or their combinations at graded doses. Bodyweight, hematological profiles, and serum iron levels were measured. Small intestine peptide transporter 1 (PEPT1) gene expression was analyzed by immunohistochemistry. Phytochemical content and antioxidant capacity (IC 50 ) of the extracts were also assessed. All treatment groups showed improved weight gain, with the most significant effect observed in the high-dose combination group. Hematological parameters remained stable, and serum iron levels increased in all treated rats. PEPT1 expression was significantly upregulated, especially in the MEB and combination groups. MEB exhibited higher phenolic and flavonoid content and stronger antioxidant activity (IC 50 = 127.58 ppm), while EEG contained notable levels of saponins. EEG and MEB, individually or in combination, improved nutritional markers and enhanced nutrient transporter expression in malnourished rats. These results support their potential as functional food candidates for managing PEM.", "keywords": ["Animals", "Rats, Wistar", "Male", "Plant Extracts", "Rats", "Peptide Transporter 1", "Glycine max", "Brassica", "Body Weight", "Protein-Energy Malnutrition"], "year": "2025", "doi": "10.5455/OVJ.2025.v15.i12.27"}, {"pmid": "42376436", "title": "Bidirectional relationship between metabolic dysfunction-associated steatotic liver disease and type 2 diabetes mellitus.", "abstract": "Metabolic dysfunction-associated steatotic liver disease (MASLD) and type 2 diabetes mellitus (T2DM) are two common, interconnected conditions that pose a major global health challenge. The worldwide prevalence of MASLD among individuals with T2DM exceeds 60 %, with a substantial proportion of cases having metabolic dysfunction-associated steatohepatitis (MASH) and an increased risk of liver-related complications, such as cirrhosis, liver failure, or hepatocellular carcinoma. The coexistence of MASLD and T2DM is also associated with poorer glycemic control and a higher risk of cardiovascular events, chronic kidney disease, and mortality. Notably, MASLD increases the risk of developing T2DM, with risk rising stepwise with liver disease severity, especially liver fibrosis. The close bidirectional relationship between MASLD and T2DM creates a vicious cycle that drives liver disease progression, worsens insulin resistance, and impairs glucose metabolism. This likely reflects shared underlying mechanisms, including insulin resistance, low-grade inflammation, lipotoxicity, adipose tissue dysfunction, and an altered gut-liver axis. Screening strategies are crucial for MASLD and T2DM, with current guidelines recommending assessment of liver fibrosis in all individuals with T2DM and regular screening for dysglycemia in those with MASLD. Pharmacological treatments, especially incretin-based therapies, sodium-glucose cotransporter 2 inhibitors, and resmetirom, show significant benefits across metabolic, hepatic, and extrahepatic outcomes. Overall, recognizing and addressing the bidirectional relationship between MASLD and T2DM is essential for better risk stratification, earlier intervention, and reduced long-term hepatic and extrahepatic complications. This narrative review summarizes current evidence on the bidirectional relationship between MASLD and T2DM, discussing epidemiological data, pathophysiological mechanisms, clinical implications, and therapeutic options. See also the graphical abstract(Fig. 1).", "keywords": [], "year": "2026", "doi": "10.17179/excli2026-9462"}, {"pmid": "42376413", "title": "Clinicopathological profiling of diarrheic canine parvovirus-circovirus co-infections in Hanoi, Vietnam.", "abstract": "Canine parvovirus (CPV) causes acute hemorrhagic gastroenteritis in dogs, whereas canine circovirus (CanineCV), an emerging virus, is associated with immunosuppression and gastrointestinal disease. However, data on CPV-CanineCV coinfections are limited in Vietnam. The aim of this study was to investigate the prevalence and clinical, hematological, biochemical, and pathological features of CPV-CanineCV coinfections in dogs with enteric disease in Hanoi, Vietnam. The fecal and blood samples from suspected CPV cases were tested using molecular diagnostics. Clinical and laboratory findings were compared between the CPV mono- and coinfected groups. Necropsies were performed on the deceased animals. CPV infection was confirmed in 94.68% (89/94) of the cases, with 21.28% (19/89) showing CanineCV coinfection. Diarrhea, vomiting, and anorexia were observed in both groups, but coinfected dogs exhibited more severe symptoms, higher mortality, longer treatment, and worse recovery. The hematological findings included marked leukopenia, lymphopenia, and thrombocytopenia. Biochemical changes, such as hypoglycemia, hypoproteinemia, hypoalbuminemia, and mild liver enzyme elevations, along with notable hypokalemia and mild metabolic acidosis, were observed. Pathological findings showed a more extensive intestinal and systemic damage in patients with co-infections. CPV-CanineCV coinfection results in more severe disease than CPV alone. Routine Canine CV screening in CPV-positive dogs is recommended for better clinical management.", "keywords": ["Animals", "Dogs", "Parvoviridae Infections", "Dog Diseases", "Coinfection", "Parvovirus, Canine", "Vietnam", "Female", "Circoviridae Infections", "Diarrhea", "Circovirus", "Male", "Prevalence", "Feces"], "year": "2026", "doi": "10.5455/OVJ.2026.v16.i2.27"}], "color": "#c2410c"}}, {"data": {"id": "Spleen", "label": "Spleen", "description": "Function: Adaptive immune response (B and T-cells). Innate immune response (macrophages).\nMetabolism:\n- Baseline metabolism is likely driven by inflammation.\n- FDG uptake can strongly change based on immune activation.\nKey Metabolites: \nKey Proteins: \nSources:\n- https://doi.org/10.1038/nri1669\n- https://doi.org/10.1038/s41598-024-67905-x\n", "llm_description": "The spleen is a vital organ that plays a significant role in metabolic physiology, primarily consuming and producing certain substrates. As a filter of the blood, it removes old red blood cells, platelets, and other debris, which can lead to the production of waste products such as bilirubin [2]. The spleen also stores red blood cells and releases them into the circulation when needed, which is essential for maintaining adequate oxygen delivery to tissues. Additionally, the spleen produces cytokines and chemokines in response to infection or inflammation, which are crucial for initiating an immune response [1]. Hormones such as cortisol and adrenaline can regulate splenic function, with cortisol inducing the production of lipids and glucose in the spleen, while adrenaline stimulating the breakdown of glycogen to glucose [3].", "llm_papers": [{"pmid": "42376743", "title": "Immune-Inflammatory Imbalance in Mice Under High Humidity and Three Different Ambient Temperatures: Insights From Gut Microbiome and Serum Metabolomics.", "abstract": "Gut microbiota and metabolites have been increasingly implicated in the pathogenesis of immune inflammation, which may be affected by environmental factors. This study aimed to explore the influence of co-exposure to high humidity and temperatures (low, normal or high) on biomarkers of immune inflammation and potential mechanisms. We established C57BL/6J mice models (with equal numbers of males and females) of high humidity and low temperature (HH-LT), normal temperature (HH-NT) or high temperature (HH-HT) co-exposure environments to observe the impact of high humidity and different temperature co-exposure environments for 28 and 56 consecutive days. Following exposure, results showed that all six combined exposure conditions significantly increased pro-inflammatory cytokines (TNF-&#x3b1;, IL-1&#x3b2;, IL-12p70), decreased anti-inflammatory cytokines (IL-4, IL-10) and elevated the Teff/Treg ratio in the spleen. Gut microbiota analysis revealed reduced Akkermansia and increased Desulfovibrio and Enterorhabdus. Serum metabolomics identified widespread disturbances enriched in pathways including protein digestion and absorption, lysine degradation, phenylalanine metabolism and unsaturated fatty acid biosynthesis. Pearson correlation analysis confirmed significant associations among microbial shifts, immune-inflammatory dysregulation and metabolic perturbations-suggesting that high humidity combined with different temperatures correlated with immune imbalance, likely mediated by gut dysbiosis and serum metabolic disruption.", "keywords": [], "year": "2026", "doi": "10.1111/1462-2920.70365"}, {"pmid": "42375368", "title": "Sponge-like sonographic pattern of the spleen in immune dysregulation disorders.", "abstract": "Although splenic ultrasound (US) assessment is periodically performed in most patients with inborn error of immunity (IEI), splenic microtexture has not been specifically investigated in this setting. We describe a newly described \"sponge-like\" splenic microtexture pattern in patients with different IEIs and hematologic immune dysregulation, and discuss its potential implications. We present an index case (P1) followed by a cohort analysis including 26 patients with IEIs and 20 controls with chronic immune thrombocytopenia, for whom splenic microtexture data and iconography were available. In P1, an 11-year-old patient with an autoimmune lymphoproliferative immunodeficiency phenotype, high-frequency splenic US revealed for the first time a \"sponge-like\" pattern, not visible with standard assessment, characterized by multiple hypoechoic round foci that persisted during long-term follow-up. In the IEI cohort, 46.2% of patients had splenomegaly, and a persistent sponge-like pattern was observed in 30.8% in the absence of infections or malignancies. In the control group, only one of 20 patients showed similar US features, transiently, during acute EBV infection. Immunomodulation (sirolimus, mycophenolate mofetil, rituximab) resulted in a significant improvement or normalization in all cases. We report for the first time an association between splenic US microtexture features and IEIs. A persistent sponge-like pattern appears to be linked to IEIs/immune dysregulation, and the response to immunomodulation suggests a complex histopathological substrate. Although preliminary, our results suggest that, in patients with other signs of immune dysregulation/dysfunction, identification of this pattern could support earlier suspicion of an underlying IEI, after excluding infections and malignancies.", "keywords": ["Humans", "Child", "Ultrasonography", "Female", "Spleen", "Male", "Splenomegaly", "Purpura, Thrombocytopenic, Idiopathic", "Adolescent"], "year": "2026", "doi": "10.3389/fimmu.2026.1868964"}, {"pmid": "42375102", "title": "Transcriptomic Analysis Reveals Multilayer Regulation Underlying Development and Pregnancy in the Malayan Pangolin.", "abstract": "The critically endangered Malayan pangolin (Manis javanica) exhibits distinctive physiological adaptations; nevertheless, its molecular mechanisms underlying development and reproduction remain inadequately characterized, thereby impeding effective conservation initiatives. In this study, we conducted a comprehensive transcriptomic analysis of six tissues (intestine, kidney, liver, lung, muscle, and spleen) derived from adult, fetal, and pregnant individuals. The fetal stage demonstrated the greatest abundance of stage-specific genes, which were predominantly enriched in developmental pathways such as epithelial organization and transmembrane signaling. Differential gene expression (DGE) analysis revealed that genes upregulated in adults were primarily associated with metabolic and immune functions, whereas those upregulated in fetuses were linked to developmental processes and cell cycle regulation. Co-expression network analysis identified critical hub genes, including GLDC in adults and NCAM1 in fetuses, that are implicated in stage-specific regulatory mechanisms. Additionally, extensive differential alternative splicing (DAS) events were observed, with exon skipping (SE) representing the most frequent splicing pattern. Integrative analyses suggested that DGE and DAS largely constitute independent regulatory layers; however, a subset of hub genes, such as OBSL1 and TNIP1, exhibited concurrent differential expression and splicing, indicating their potential central roles in coordinating developmental processes. This study presents a detailed transcriptomic atlas of Malayan pangolin development and pregnancy, providing candidate biomarker genes for evaluating reproductive health and developmental status, thereby informing future conservation strategies.", "keywords": ["Animals", "Female", "Pangolins", "Pregnancy", "Gene Expression Profiling", "Transcriptome", "Gene Expression Regulation, Developmental", "Alternative Splicing"], "year": "2026", "doi": "10.1002/age.70153"}, {"pmid": "42373718", "title": "Cathepsin G and neutrophil elastase control Leishmania infantum parasitism through TLRs-dependent induction of IFN-&#x3b1; and TNF-&#x3b1;.", "abstract": "Leishmania infantum and Leishmania donovani are protozoan parasites that cause visceral leishmaniasis, a potentially fatal disease targeting the liver, spleen and bone marrow. To survive, these parasites manipulate host macrophage microbicidal responses and metabolic pathways. Here, we demonstrate that the host serine proteases neutrophil elastase (NE) and cathepsin G (CG), acting in concert with Toll-like receptors TLR2, TLR3, and TLR4, induce the inflammatory cytokines IFN-&#x3b1; and TNF-&#x3b1; to control L. infantum infection in macrophages. Conversely, in vivo experiments revealed that while NE and CG are necessary for inflammatory responses, including IL-12, nitric oxide, and CCL2 production, they unexpectedly promote splenic parasitism. CG-deficient mice failed to recruit Ly6C hi myeloid cells to the spleen, providing a potential mechanism for their reduced parasite burden. Finally, our data suggest that unlike L. donovani, L. infantum cannot hijack cellular host serine peptidases and TLR signalling for survival, yet it remains dependent on these host enzymes to establish systemic spleen infection.", "keywords": [], "year": "2026", "doi": "10.1038/s42003-026-10555-8"}, {"pmid": "42371559", "title": "Utilization of Paragonix LIVERguard&#xae; donor organ transport system for static hypothermic preservation of a multivisceral allograft.", "abstract": "Intestine transplants are highly sensitive to ischemia-reperfusion injury (IRI). Static cold storage (SCS) is the standard for multivisceral (MVT) allograft preservation but carries known risks. While several devices have been developed for liver, lung, and heart graft preservation, there are no systems validated specifically for MVT grafts. We report the first use of the Paragonix LIVERguard&#xae; Donor Liver Transport System for hypothermic static preservation of a donation after brain death (DBD) MVT allograft, transported approximately 1363 miles. The Paragonix LIVERguard&#xae; was used to preserve a pediatric MVT graft during long-distance transport between the donor and recipient hospitals. We collected donor and recipient characteristics, ischemia intervals, lab markers of IRI, vasopressor duration, intensive care unit (ICU) and hospital length of stay, and time to enteral feeding. The graft included liver, stomach, pancreas, spleen, small intestine, and colon. Cold ischemia time (CIT) was 6.8&#x202f;h. The device maintained a mean temperature of 4.5&#xb0;C (range: 3.8-5.2&#xb0;C). Endoscopy showed no evidence of rejection. There was rapid normalization of both enzymatic injury markers (AST/ALT) and metabolic markers (lactate). Enteral feeding began on POD 13 and advanced to the goal. She was discharged home on POD 103. This case represents the first reported use of the Paragonix LIVERguard&#xae; for MVT graft preservation and transport. The device maintained a narrow temperature range over a 6.8-hour CIT and more than 1300 miles of travel. Relative to historical institutional experience, the case demonstrated lower peak biochemical markers and faster normalization of graft function. These findings support further investigation into whether preservation strategies that maintain tighter thermal control may influence early graft recovery in MVT.", "keywords": [], "year": "2026", "doi": "10.1016/j.intf.2026.100362"}, {"pmid": "42368375", "title": "The Challenge of Determining the Etiology of Encephalopathy in an Elderly Patient.", "abstract": "Encephalopathy is a heterogeneous clinical syndrome with numerous neurological and systemic etiologies. We report the case of a 67-year-old man, a chronic ethanol consumer, admitted with a one-week history of confusional syndrome. Initial laboratory tests revealed severe hypercalcemia, acute kidney injury, mild anemia, and hyperproteinemia. Serum ammonia levels were within normal limits, reducing the likelihood of hepatic encephalopathy despite the patient's chronic ethanol use. Cerebral imaging excluded acute cerebrovascular events, while abdominal ultrasound demonstrated splenomegaly and normal-sized kidneys. Serum protein electrophoresis and immunofixation identified a monoclonal IgG-kappa component, strongly suggestive of multiple myeloma. The patient's neurocognitive symptoms improved rapidly following systemic corticosteroid therapy and fluid-electrolyte rebalancing, confirming hypercalcemia as the primary mechanism of encephalopathy. Hypercalcemic encephalopathy as an initial manifestation of multiple myeloma is exceedingly rare. This case highlights the diagnostic complexity in elderly patients with multiple potential contributors to altered mental status, including chronic ethanol exposure and renal dysfunction. The presence of normal renal dimensions, unexplained hypercalcemia, and a monoclonal component should prompt evaluation for plasma cell malignancy. Early recognition of hypercalcemia-induced encephalopathy and prompt investigation for underlying hematologic malignancy are essential to prevent irreversible organ damage and to ensure timely initiation of specific therapy.", "keywords": [], "year": "2026", "doi": "10.1002/ccr3.73026"}], "color": "#6b21a8"}}, {"data": {"id": "Thyroid", "label": "Thyroid", "description": "Function: Regulatory and secretory organ. TSH is the primary messenger that leads to T3 and T4 production. TH  regulates Thermogenesis, energy utilization by increasing the basal metabolic rate and regulate lipid and glucose metabolism.\n- Hyperthyroid condition: Increased heart rate, increased metabolism, can lead to high blood glucose levels due to high liver glucose production.\n- Hypothyroidism: Reduced metabolism, higher cholesterol and triglycerides in blood, higher blood pressure.\n--> Bidirectional link between TH and adiposity: \nA) TH promotes fat storage + lowers energy expenditure\nB) Excess fat tissue releases inflammatory cytokines and leptin which alters TSH secretion. They have elevates TSH levels with a healthy thyroid.\nMetabolism:\n- Hormone production.\n- TSH influences the enzyme that turns inactive T4 into active T4.\nKey Metabolites: \nKey Proteins: TH (T3 and T4), TSH (Thyrotropin)\nSources:\n- doi: 10.1177/2042018820917869\n- https://doi.org/10.1152/physrev.00030.2013\n", "llm_description": "The thyroid gland plays a crucial role in regulating metabolism, primarily by consuming iodine-rich substrates such as thyroxine (T4) and triiodothyronine (T3), which are produced through the oxidation of glucose and fatty acids [1]. The thyroid's metabolic function is regulated by key hormones, including thyroid-stimulating hormone (TSH) from the pituitary gland, which stimulates the release of T4 and T3 into the bloodstream, and thyrotropin-releasing hormone (TRH), which promotes the production of TSH [2]. Elevated levels of T3 can inhibit 5'-deiodinase activity, leading to elevated serum thyroxine and reverse triiodothyronine (T3) levels, as seen in cases of Cordarone overdose [2]. Conversely, decreased T4 and T3 levels can lead to hypothyroidism, a condition characterized by impaired metabolic function and increased oxidative stress, such as that observed in thyroid dysfunction", "llm_papers": [{"pmid": "42376563", "title": "Effect of ashwagandha ( Withania somnifera ) on endocrine and reproductive traits in Awassi sheep.", "abstract": "Although ashwagandha, or Withania somnifera , is used as a broad-spectrum treatment for a wide range of illnesses, including reproductive issues, and to improve fertility, it is also considered a potent adaptogen and anti-stressor that may assist in improving physical performance. This study aimed to evaluate the effect of two doses of ashwagandha on physiological and reproductive parameters in Awassi sheep in Iraq. Thirty Awassi ewes were randomly assigned to three groups (10 each) for 60 days: a control (placebo), 300 mg/day ashwagandha, and 600 mg/day ashwagandha. Physiological (hepcidin, growth hormone, insulin, TSH, T3, T4) and reproductive (estrogen, progesterone, FSH, LH) parameters were measured on days 0, 30, and 60, and body weights were recorded weekly. The experimental data demonstrated that both experimental groups showed increased growth hormone levels along with decreased hepcidin and insulin levels, and thyroid hormone levels (T3 and T4) increased significantly ( p &lt; 0.05) in both experimental groups after ashwagandha administration compared to the control group. Both experimental groups demonstrated significantly elevated estrogen, progesterone, and FSH levels compared with the control group. This study demonstrates that ashwagandha supplementation improves the physiological and reproductive functions of Awassi sheep, which can help boost their performance. Ashwagandha supplementation enhanced the metabolic and reproductive performance of Awassi sheep. It lowered insulin and hepcidin levels, increased growth hormone and thyroid hormone levels, and elevated estrogen, progesterone, and FSH levels, indicating improved metabolism and reproductive function.", "keywords": [], "year": "2025", "doi": "10.5455/OVJ.2025.v15.i12.24"}, {"pmid": "42376389", "title": "Assessing the effects of linseed consumption on thyroid hormones and hepatic toxicity in rats drenched with Cordarone overdose.", "abstract": "Cordarone, a benzofuranic-derivative iodine-rich medication primarily used for tachyarrhythmias, frequently induces alterations in the peripheral metabolism of thyroid hormones, predominantly by inhibiting 5'-deiodinase activity, resulting in elevated serum thyroxine and reverse triiodothyronine (T3) levels, alongside diminished serum T3 concentrations. Overt thyroid dysfunction, which manifests as either Cordarone-induced thyrotoxicosis. Linseed oil or flaxseed oil is a type of oil that comes from seeds. It is one of the oldest oils on the market. Solvent-processed flaxseed oil has been used as a drying oil in painting and varnishing for hundreds of years. Raw oil is utilized as an astringent in fungicidal lotion. It also acts as an insecticide and has some insect-repelling effects. The study sought to show the therapeutic effects of linseed oil on biochemical parameters in rats against the toxic effects of Cordarone. In this study, we used twenty-four adult male rats and splited into three groups: control group: drenched standard nutrition only. Cordarone group: drenched Cordarone (100 mg/kg/day) orally by gavage. Cordarone + Linseed oil group: rats were drenched with Cordarone (100 mg/kg/day) and linseed oil (3 ml/kg/day) for a month. At the end of this experiment, the rats were scarified and blood samples were taken from the animals for biochemical parameters (ALT, AST, troponin, TSH, T3, and T4). The data showed the positive effect of linseed in improving the thyroid gland, heart, and liver against the toxic effect of Cordarone. Linseed had a positive effect against the toxic effects of Cordarone by enhancing hematology parameters. These findings proved benefit of linseed.", "keywords": ["Animals", "Male", "Rats", "Thyroid Hormones", "Linseed Oil", "Amiodarone", "Rats, Wistar", "Chemical and Drug Induced Liver Injury", "Liver", "Anti-Arrhythmia Agents", "Thyroid Gland"], "year": "2026", "doi": "10.5455/OVJ.2026.v16.i2.8"}, {"pmid": "42375949", "title": "Reactive oxygen species and intrinsic apoptotic markers in thyroid dysfunction: Insights from experimental animal models.", "abstract": "Thyroid disorders are associated with elevated reactive oxygen species (ROS) levels that trigger apoptosis. Nevertheless, the precise connection between ROS levels and apoptotic markers in thyroid dysfunction remains unclear. To explore the relationship between ROS levels and intrinsic apoptotic (IA) markers in thyroid homogenates derived from hypothyroidism and hyperthyroidism mouse models. Eighteen male Wistar rats, each weighing 240 &#xb1; 10 g, were allocated to three groups of six rats. Hypothyroidism and hyperthyroidism were induced over 8 weeks using 0.05% Propylthiouracil (PTU) and 0.0012% Levothyroxine (L-Thy), respectively. T3, T4, and thyroid-stimulating hormone levels were measured, and thyroid size and body weights were recorded. The levels of ROS markers [MDA, glutathione (GSH), SOD-1, CAT, and GPX) and IA markers (Bax, Bcl-2, and caspase-3) were assessed in tissue homogenates. A gradual weight loss was observed in the hyperthyroidism group compared with the control group. The hypothyroid model showed elevated MDA levels and cleaved caspase-3, as well as a higher Bax/Bcl-2 ratio, whereas GSH, SOD-1, CAT, GPX, and Bcl-2 levels were lower than those in the control group ( p &lt; 0.05). In contrast, no changes were observed in the hyperthyroid models. Thyroid hormone levels are inversely correlated with ROS and positively correlated with antioxidant levels. Hypothyroidism models exhibited increased oxidative stress and pro-apoptotic markers, suggesting the initiation of apoptosis and cellular damage. Conversely, the hyperthyroid models showed no such changes.", "keywords": ["Animals", "Reactive Oxygen Species", "Male", "Apoptosis", "Rats, Wistar", "Hypothyroidism", "Hyperthyroidism", "Rats", "Biomarkers", "Disease Models, Animal", "Propylthiouracil", "Thyroid Gland", "Oxidative Stress", "Thyroxine"], "year": "2026", "doi": "10.5455/OVJ.2026.v16.i4.24"}, {"pmid": "42375902", "title": "Duloxetine-Induced Reversible Central Hypothyroidism: A Case Report.", "abstract": "Central hypothyroidism (CeH) is a rare disease caused by impaired production of thyroid-stimulating hormone (TSH), usually associated with multiple pituitary hormone deficiencies. Antidepressants have been proposed as a potential cause of an isolated form of CeH, but evidence is scarce. Here, we describe a case of a 58-year-old male with isolated low free thyroxine (fT4) and inappropriately normal TSH levels, diagnosed during treatment with duloxetine. No pituitary or thyroid disease was identified, and imaging studies were unremarkable. After exclusion of alternative causes, low-dose levothyroxine (LT4) was initiated. Following the gradual discontinuation of duloxetine and LT4, thyroid function fully normalized and remained stable at follow-up. The temporal relationship and reversibility support a possible causal role of duloxetine in inducing CeH. Although the underlying mechanisms remain unclear, this case highlights the need to consider drug-induced CeH in patients receiving antidepressants. Further studies are needed to confirm this rare association and its clinical implications.", "keywords": [], "year": "2026", "doi": "10.7759/cureus.109903"}, {"pmid": "42375713", "title": "Symptom Clusters and Quality of Life in Cervical Cancer Patients During the Perioperative Period: A Longitudinal Study.", "abstract": "This longitudinal observational study aimed to investigate symptom clusters and quality of life (QOL) in patients with cervical cancer (CC) at multiple time points during the perioperative period. It also sought to analyze the correlation between symptom clusters and QOL, thereby providing evidence for dynamic symptom cluster management and strategies to improve patients' QOL. From August to December 2025, we conducted a longitudinal observational study among 183 cervical cancer patients during the perioperative period. Participants were recruited from a gynecology center within a tertiary hospital in Northwestern China. Patients completed a demographic questionnaire, the Chinese version of the MD Anderson Symptom Inventory-perioperative symptom in patients with gynecologic cancer (MDASI-PeriOp-GYN), and the Functional Assessment of Cancer Therapy-General (FACT-G). Assessments were performed on the first day of admission (T1, preoperative baseline), 1-3 days after surgery (T2), and 7-10 days after surgery (T3). Symptom clusters were extracted using exploratory factor analysis (EFA). Longitudinal trends in symptom clusters were examined using latent class mixed models (LCMM). Trends in QOL were assessed with generalized estimating equations (GEE). Correlations between symptom clusters and QOL were analyzed using Spearman correlation analysis. Five symptom clusters were identified in cervical cancer patients during the perioperative period: pain-fatigue, psychological, hot flashes-neurological, digestive tract, and energy-deficit. The energy-deficit cluster was detected only at T2, whereas the digestive tract cluster was present at T2 and T3. LCMM analyses revealed that the pain-fatigue, psychological, and hot flashes-neurological clusters rose from T1 to T2 and subsequently declined after T2. Overall QOL followed a V-shaped trajectory: both domain and total scores declined significantly from T1 to T2, partially recovered at T3, but remained below preoperative levels. Moreover, the severity scores of all symptom clusters were negatively correlated with the total QOL score (p &lt; 0.05). Patients undergoing cervical cancer surgery often experience various symptom clusters. High symptom severity is typically associated with lower QOL. Therefore, clinical staff should prioritize the dynamic management of symptom clusters in perioperative cervical cancer patients. This strategy can help reduce symptom burden and enhance patients' QOL.", "keywords": [], "year": "2026", "doi": "10.2147/PPA.S589862"}, {"pmid": "42375633", "title": "Phenotypic Age Acceleration as a Mediator in Thyroid Hormone-Related Cardiovascular Risk Among the Elderly.", "abstract": "The association between thyroid hormones and cardiovascular disease (CVD) has been widely examined; however, the role of biological aging in this relationship remains unclear. This study systematically investigates the mediating role of phenotypic age acceleration (PhenoAgeAccel) in the relationship between thyroid hormones and CVD. The data were sourced from the 2007-2010 cycles of the National Health and Nutrition Examination Survey (NHANES). Analyses included logistic regression, linear regression, restricted cubic splines, subgroup analyses, and mediation analysis to assess the role of PhenoAgeAccel. Among participants aged &#x2265;&#x2009;60&#x2009;years, elevated free triiodothyronine (FT3) concentrations were linked to a reduced risk of CVD (adjusted odds ratio [aOR]&#x2009;=&#x2009;0.483; 95% CI: 0.273-0.856; p &#x2009;=&#x2009;0.013). Similarly, total triiodothyronine (TT3) levels were associated with a decreased CVD risk in those aged 60 and above (aOR&#x2009;=&#x2009;0.988; 95% CI: 0.980-0.995; p &#x2009;=&#x2009;0.013). Mediation analysis showed that PhenoAgeAccel mediated 21.13% of the FT3-CVD association and 23.41% of the TT3-CVD association in older adults. This study identifies an age-dependent relationship between FT3, TT3, and CVD and reveals that PhenoAgeAccel partially mediates this association. These findings suggest that interventions targeting thyroid function and biological aging may offer novel strategies for CVD prevention and management in older populations.", "keywords": [], "year": "2026", "doi": "10.1155/crp/1206757"}], "color": "#15803d"}}, {"data": {"id": "WAT", "label": "WAT", "description": "Function: Energy storage. \nMetabolism: Lipolysis during fasting. \nSecretes Leptin, which regulates hunger. Secretes lipolysis products: free fatty acids, glycerol. \nInsulin resistance: \n- WAT and Muscle are impaired in taking up glucose while the liver looses its ability in endogenous glucose production. Leads to the uncontrolled release of fatty acids from the WAT.\n- \"A current view, which proposes adipocyte dysfunction as an early cardinal event in insulin resistance, is that WAT drives metabolic fluxes that affect the liver and skeletal muscle\"[Morigny et. al.], [Roden et. al.]\n- The pancreas beta-cells have an increased burden to produce insulin. The function may then decline with time. Correlation is present in low-BMI (non diabetic?) patients while no correlation is present in high-BMI (diabetic?) patients.\nKey Proteins: GLUT4 (Insulin-dependent), GLUT1.\nSources: \n- https://doi.org/10.1038/s41574-021-00471-8\n- doi: 10.1074/jbc.REV119.008351.\n", "llm_description": "The white adipose tissue (WAT), a key player in metabolic regulation, primarily consumes and produces lipids, playing a crucial role in energy storage and release. As the primary site of lipid synthesis, WAT stores triglycerides, which can be mobilized to fuel energy production when needed [1]. The metabolism of WAT is tightly regulated by various hormones, including leptin, insulin, and adiponectin, which work together to maintain energy balance and prevent excessive fat accumulation. Leptin, in particular, has been shown to have a significant impact on WAT function, with studies demonstrating that mature adipocytes lack functional Aryl Hydrocarbon Receptor (AHR), leading to impaired lipid metabolism [2]. The physiological interplay between obesity, male fertility, and AHR highlights the complex relationships between these factors, underscoring the need for further research into novel therapeutic targets for obesity-related disorders.", "llm_papers": [{"pmid": "42376436", "title": "Bidirectional relationship between metabolic dysfunction-associated steatotic liver disease and type 2 diabetes mellitus.", "abstract": "Metabolic dysfunction-associated steatotic liver disease (MASLD) and type 2 diabetes mellitus (T2DM) are two common, interconnected conditions that pose a major global health challenge. The worldwide prevalence of MASLD among individuals with T2DM exceeds 60 %, with a substantial proportion of cases having metabolic dysfunction-associated steatohepatitis (MASH) and an increased risk of liver-related complications, such as cirrhosis, liver failure, or hepatocellular carcinoma. The coexistence of MASLD and T2DM is also associated with poorer glycemic control and a higher risk of cardiovascular events, chronic kidney disease, and mortality. Notably, MASLD increases the risk of developing T2DM, with risk rising stepwise with liver disease severity, especially liver fibrosis. The close bidirectional relationship between MASLD and T2DM creates a vicious cycle that drives liver disease progression, worsens insulin resistance, and impairs glucose metabolism. This likely reflects shared underlying mechanisms, including insulin resistance, low-grade inflammation, lipotoxicity, adipose tissue dysfunction, and an altered gut-liver axis. Screening strategies are crucial for MASLD and T2DM, with current guidelines recommending assessment of liver fibrosis in all individuals with T2DM and regular screening for dysglycemia in those with MASLD. Pharmacological treatments, especially incretin-based therapies, sodium-glucose cotransporter 2 inhibitors, and resmetirom, show significant benefits across metabolic, hepatic, and extrahepatic outcomes. Overall, recognizing and addressing the bidirectional relationship between MASLD and T2DM is essential for better risk stratification, earlier intervention, and reduced long-term hepatic and extrahepatic complications. This narrative review summarizes current evidence on the bidirectional relationship between MASLD and T2DM, discussing epidemiological data, pathophysiological mechanisms, clinical implications, and therapeutic options. See also the graphical abstract(Fig. 1).", "keywords": [], "year": "2026", "doi": "10.17179/excli2026-9462"}, {"pmid": "42376192", "title": "Mature adipocytes lack functional Aryl Hydrocarbon Receptor - a study investigating its role in diet-induced obesity in mice.", "abstract": "Despite rising awareness and advances in the field, the prevalence of obesity continues to increase. Current weight-loss treatments are often ineffective long-term, and some are associated with serious side effects. For this reason, alternative pathways need to be explored in order to identify novel pharmacological targets for the treatment of obesity. In this study, we aim to investigate the role of the ligand-activated transcription factor, aryl hydrocarbon receptor (AHR), in the development of obesity and metabolic syndrome. Using global and adipocyte-specific Ahr knock-out mouse models, we show that even though global Ahr deletion has some protective effects from diet-induced obesity and metabolic syndrome, adipocyte-specific deletion of Ahr has no effect. Furthermore, using a variety of techniques to isolate mature adipocytes, such as flotation, in-vitro differentiation, and translating ribosome affinity purification, we show no evidence that Ahr is expressed in mature white adipocytes. Finally, using single-cell RNA sequencing on cells from a Cyp1a1 fate reporter mouse line, in which eYFP can be used as a readout of AHR activation, we show that the AHR pathway is active in adipose stem and precursor cells. Using bulk RNA sequencing on adipocyte precursors stimulated with an AHR ligand in-vitro , we show evidence suggesting that Ahr may be involved in the control of adipocyte differentiation. Our study indicates that Ahr may play an important role in adipocyte precursors, particularly in the initiation of adipocyte differentiation. We suggest that further investigation into this mechanism may be important to fully elucidate AHR's effects in obesity. Despite advances in the field, obesity continues to affect millions of people&#x2019;s health and quality of life. Often, weight-loss treatments are not effective long-term and some can have serious side effects. Because of this, scientists are looking for ways to further understand and treat obesity. In this study, the researchers look a protein called aryl hydrocarbon receptor (AHR) to see if it plays a role in obesity and related health problems. The researchers in this study show that removing AHR entirely in the mouse (by genetic modification) can affect the how the mice become obese and associated metabolic problems. As fat cells are the main driving force of obesity, the researchers also remove AHR only in fat cells. However this time, the researchers show no effect on weight-gain and metabolism. They also showed that, unlike what was previously believed, AHR is not found in fat cells, even though it can be found in fat tissue. Finally, the researchers show that within fat tissue, AHR is mostly found in cells that fat cells originate from (precursor cells), and suggest that AHR may play an important role in early fat cell development. This could be an important clue in finding new ways to treat or prevent obesity, and more research is needed to understand this process better.", "keywords": [], "year": "2026", "doi": "10.12688/wellcomeopenres.25201.2"}, {"pmid": "42375965", "title": "Physiological interplay among obesity, male fertility, and aryl hydrocarbon receptor in human and mice: A mini review.", "abstract": "According to the most recent World Health Organization report in 2022, approximately 16% of people were classified as obese. Obesity is an inflammatory-mediated condition manifested by accelerated lipogenesis and excessive fat accumulation around the viscera and, in some cases, surrounding the male gonads. Thus, obesity is considered a major cause of male infertility. Many environmental toxicants, known as obesogens, are connected to obesity progression by disrupting the hormonal profile, interrupting cellular metabolism, and subsequently leading to the development of sue. Such toxicants, such as bisphenol A, a plastic derivative, and dioxins, which are byproducts of incomplete combustion or industrial processes. Interestingly, these types of toxicants, in addition to others like polycyclic aromatic hydrocarbons (PAHs) and polychlorinated biphenyls, are defined as ligands of aryl hydrocarbon receptor (AhR). AhR has critical roles in immunity, metabolism, reproduction, and cancer biology, and it is expressed in immune cells such as T/B lymphocytes, macrophages, and dendritic cells. The effect of AhR on immunity is dependent on the ligand, which could activate macrophage-induced obesity. Many AhR ligands (e.g., kynurenine and indole derivatives) can be exogenous or endogenous and affect reproductive functions, such as spermatogenesis and oocyte maturation. There are also natural antagonists to AhR, including resveratrol, which have the potential to play a role in fertility. Currently, to connect the roles of AhR in obesity-induced male infertility. This review aims to elucidate the physiological and toxicological roles of AhR in the initiation of obesity and male infertility.", "keywords": ["Animals", "Receptors, Aryl Hydrocarbon", "Humans", "Male", "Obesity", "Infertility, Male", "Mice", "Fertility"], "year": "2026", "doi": "10.5455/OVJ.2026.v16.i4.3"}, {"pmid": "42375084", "title": "Leptin Signaling at the Crossroads of Obesity, Immunity, and Cancer: Mechanistic Insights and Therapeutic Implications.", "abstract": "Leptin, an adipokine predominantly secreted by adipose tissue, has exhibited a wide range of biological functions, including regulation of energy balance, appetite, and metabolism. Accumulating evidence has demonstrated that leptin also plays a role in obesity-associated tumor progression. Elevated circulating leptin levels in obese individuals, together with the close association between obesity and increased cancer risk, have led to growing interest in leptin as a potential mediator linking adiposity to tumor growth and immune dysregulation. Recent studies have shown that leptin can directly interact with immune cells within the tumor microenvironment and promote dysfunction or exhaustion in various immune cell populations, thereby impairing anti-tumor immunity. These findings suggest that tumor-promoting effects of leptin may be mediated, at least in part, through modulation of anti-tumor immune responses. Notably, metabolic reprogramming of both immune cells and cancer cells appears to be a critical mechanism underlying leptin-mediated tumor progression and immune dysfunction. Since obesity is characterized by altered adipokine production, chronic low-grade inflammation, and immune dysregulation, leptin may serve as a critical mediator linking excess adiposity to impaired immune surveillance and cancer progression. However, the biological effects of leptin are highly context-dependent. Although leptin predominantly supports tumor progression and immune suppression in many obesity-associated cancers, it may also exert immune-stimulatory or anti-tumor effects under specific conditions. This review summarizes current mechanistic insights into the role of leptin in tumor progression and immune regulation. We also highlight therapeutic strategies that integrate leptin-targeted approaches with immunotherapy.", "keywords": [], "year": "2026", "doi": "10.4062/biomolther.2026.100"}, {"pmid": "42374898", "title": "Sex-specific hepatic effects of sweetened alcohol consumption and tannic acid intervention in adolescent rats.", "abstract": "This study investigated the combined effects of alcohol and sugar, termed sweetened alcohol consumption (SAC), and tannic acid (TA) intervention on hepatic health in adolescent rats. Sixty-four male and female 42-day-old Sprague-Dawley rats were assigned to control, TA (50&#x2009;mg/kg), SAC (10% ethanol +20% fructose), or SAC+TA groups and treated for 10&#x2009;weeks using a voluntary gelatine-based model. Growth parameters, feed intake, visceral fat, fasting glucose, insulin, HOMA-IR, lipid profiles, and hepatic outcomes, including mass, TBARS, gene expression, and histological features, were assessed. SAC reduced feed intake without affecting body mass. Females exposed to SAC showed increased visceral fat, elevated hepatic TBARS, reduced hepatocyte density, and more pronounced steatosis, indicating oxidative and structural susceptibility. In contrast, males exhibited increased HDL-cholesterol with reduced hepatic TBARS, suggesting sex-specific differences in hepatic metabolic adaptation. TA co-treatment prevented the SAC-associated increase in hepatic TBARS but did not preserve hepatocyte density or alter steatosis in females. Glucose homeostasis, insulin resistance, triglycerides, and hepatic expression of CYP2E1, SREBP-1, IL-10, NF-&#x3ba;B1, and TNF-&#x3b1; were unaffected across groups. Overall, SAC induces sex-dependent hepatic alterations during adolescence, with females showing heightened vulnerability. TA did not produce a measurable additional benefit when combined with SAC under the conditions used.", "keywords": ["Animals", "Female", "Male", "Tannins", "Liver", "Rats, Sprague-Dawley", "Rats", "Alcohol Drinking", "Sweetening Agents", "Ethanol", "Polyphenols"], "year": "2026", "doi": "10.14814/phy2.70992"}, {"pmid": "42374869", "title": "Maximal fat oxidation assessment in active postmenopausal females: A novel relative power FATmax test.", "abstract": "This study compared a novel relative-to-body-mass FATmax test (RFT; 0.15&#x2009;W/kg/4&#x2009;min from 0.45&#x2009;W/kg) with a traditional absolute power FATmax test (AFT; 10&#x2009;W/3min15sec from 30&#x2009;W) in postmenopausal females. The aim was to determine whether the RFT protocol would improve fat oxidation kinetics during exercise, in females with lower maximal fat oxidation (MFO). It was hypothesized that the longer duration and the lower workload increments would result in higher fat oxidation values than AFT. Seventeen active postmenopausal females (69.2&#x2009;&#xb1;&#x2009;5.1&#x2009;years) performed both protocols in a randomized order and were divided into above (H-MFO) or below (L-MFO) 0.3&#x2009;g/min MFO. Groups were equal in age and body composition. Overall, time to MFO was delayed during the RFT protocol (765&#x2009;&#xb1;&#x2009;621 vs. 401&#x2009;&#xb1;&#x2009;262&#x2009;s) without MFO differences. Both groups displayed longer time to MFO in RFT, whilst significantly only for L-MFO (420&#x2009;&#xb1;&#x2009;280&#x2009;s vs. 317&#x2009;&#xb1;&#x2009;232). Although no statistical differences, moderate effect sizes were observed in the L-MFO group during RFT for both MFO (0.22&#x2009;&#xb1;&#x2009;0.04 vs. 0.19&#x2009;&#xb1;&#x2009;0.06&#x2009;g/min, d&#x2009;=&#x2009;0.65) and VO 2 (12.8&#x2009;&#xb1;&#x2009;3.8 vs. 15.4&#x2009;&#xb1;&#x2009;5.5&#x2009;mL/min/kg, d&#x2009;=&#x2009;-0.53). RFT may improve the determination of substrate oxidation kinetics in postmenopausal females with reduced fat oxidation capacity, while facilitating complementary analyses requiring longer recordings and stability (efficiency and Heart Rate Variability).", "keywords": ["Humans", "Female", "Postmenopause", "Oxidation-Reduction", "Aged", "Exercise Test", "Lipid Metabolism", "Oxygen Consumption", "Energy Metabolism", "Middle Aged", "Exercise", "Adipose Tissue"], "year": "2026", "doi": "10.14814/phy2.70991"}], "color": "#b45309"}}, {"data": {"id": "Adrenal Glands__Bone Marrow", "source": "Adrenal Glands", "target": "Bone Marrow", "color": "#64748b", "description": "“Type: Hormonal Connection\nKey Players: Cortisol\nNotes: \n- Cortisol affects bone metabolism during normal Physiological conditions.\nOsteoblasts needed for bone formation are generated in the Bone marrow.\nSources:\n-DOI: 10.5772/intechopen.1003161\n”", "connection_type": "Hormonal Connection", "key_players": ["Cortisol"], "key_players_metabolites": [], "key_players_hormones": ["acth", "leptin", "corticosterone"], "key_players_proteins": ["leptin receptor"], "key_players_counts_metabolites": {}, "key_players_counts_hormones": {"acth": 3, "leptin": 2, "corticosterone": 1}, "key_players_counts_proteins": {"leptin receptor": 1}, "notes": "- Cortisol affects bone metabolism during normal Physiological conditions.\nOsteoblasts needed for bone formation are generated in the Bone marrow.", "sources": ["DOI: 10.5772/intechopen.1003161", "”"], "ai_description": "The Adrenal Glands-Bone Marrow axis is mediated by the hypothalamic-pituitary-adrenal (HPA) axis, where adrenocorticotropic hormone (ACTH) stimulates the adrenal glands to produce glucocorticoids [1]. In response to stress or inflammation, ACTH is released from the pituitary gland and binds to its receptor on the surface of bone marrow mesenchymal stem cells (BMSCs), which then release CXCL12/CXCR4 signaling molecules that attract hematopoietic stem and progenitor cells (HSPCs) to the adrenal glands, forming extramedullary hematopoietic niches [1]. This axis is also influenced by the presence of fluoride, which can damage the adrenal glands, but is repaired by extracellular vesicles derived from bone marrow mesenchymal stem cells [3]. The HPA axis plays a crucial role in regulating HSPC quiescence, self-renewal,", "pubmed_n": 6, "pubmed_papers": [{"pmid": "38728427", "title": "Inducible CXCL12/CXCR4-dependent extramedullary hematopoietic niches in the adrenal&#xa0;gland.", "abstract": "Adult hematopoietic stem and progenitor cells (HSPCs) reside in the bone marrow (BM) hematopoietic niche, which regulates HSPC quiescence, self-renewal, and commitment in a demand-adapted manner. Although the complex BM niche is responsible for adult hematopoiesis, evidence exists for simpler, albeit functional and more accessible, extramedullary hematopoietic niches. Inspired by the anecdotal description of retroperitoneal hematopoietic masses occurring at higher frequency upon hormonal dysregulation within the adrenal gland, we hypothesized that the adult adrenal gland could be induced into a hematopoietic-supportive environment in a systematic manner, thus revealing mechanisms underlying de novo niche formation in the adult. Here, we show that upon splenectomy and hormonal stimulation, the adult adrenal gland of mice can be induced to recruit and host functional HSPCs, capable of serial transplantation, and that this phenomenon is associated with de novo formation of platelet-derived growth factor receptor &#x3b1;/leptin receptor (PDGFR&#x3b1;+/LEPR+/-)-expressing stromal nodules. We further show in CXCL12-green fluorescent protein reporter mice that adrenal glands contain a stromal population reminiscent of the CXCL12-abundant reticular cells, which compose the BM HSPC niche. Mechanistically, HSPC homing to hormonally induced adrenal glands was found dependent on the CXCR4-CXCL12 axis. Mirroring our findings in mice, we found reticular CXCL12+ cells coexpressing master niche regulator FOXC1 in primary samples from human adrenal myelolipomas, a benign tumor composed of adipose and hematopoietic tissue. Our findings reignite long-standing questions regarding hormonal regulation of hematopoiesis and provide a novel model to facilitate the study of adult-specific inducible hematopoietic niches, which may pave the way to therapeutic applications.", "keywords": ["Animals", "Receptors, CXCR4", "Chemokine CXCL12", "Mice", "Hematopoietic Stem Cells", "Adrenal Glands", "Stem Cell Niche", "Mice, Inbred C57BL", "Humans", "Receptor, Platelet-Derived Growth Factor alpha", "Receptors, Leptin", "Hematopoiesis, Extramedullary", "Splenectomy", "Mice, Transgenic"], "year": "2024", "doi": "10.1182/blood.2023020875"}, {"pmid": "34054040", "title": "Adrenocortical Function in Children With Brain Tumors and Pediatric Hematopoietic Cell Transplantation Recipients.", "abstract": "Adrenocortical insufficiency (AI) is a clinical condition defined by deficient production of glucocorticoids that can result in life-threatening complications. We examined the prevalence of AI in children with brain tumors and those undergoing hematopoietic cell transplantation. Adrenocorticotropic hormone stimulation (stim) testing was used for the assessment of adrenocortical function. On the basis of 155 stim tests in 117 patients, AI was diagnosed in 27.4% of patients with brain tumors and in 21% of hematopoietic cell transplantation recipients. A number of risk factors associated with AI were identified. Adrenocorticotropic hormone stim testing led to a definitive diagnosis of AI or recovery of adrenal function and unambiguous medical management.", "keywords": ["Adrenal Insufficiency", "Adrenocorticotropic Hormone", "Brain Neoplasms", "Child", "Glucocorticoids", "Hematopoietic Stem Cell Transplantation", "Humans", "Hydrocortisone"], "year": "2022", "doi": "10.1097/MPH.0000000000002220"}, {"pmid": "33508294", "title": "Extracellular vesicles derived from bone marrow mesenchymal stem cells repair functional and structural rat adrenal gland damage induced by fluoride.", "abstract": "The adrenal glands have striking morpho-biochemical features that render them vulnerable to the effects of toxins. This study was conducted to explore the therapeutic utility of extracellular vesicles derived from bone marrow mesenchymal stem cells (BMSC-EVs) against fluoride-induced adrenal toxicity. The work included isolation and further identification of BMSC-EVs by transmission electron microscopy and flow cytometric analysis. Adrenal toxicity in rats was induced by oral administration of 300&#xa0;ppm of sodium fluoride (NaF) in drinking water for 60&#xa0;days followed by a single dose injection of BMSC-EVs. The effects of BMSC-EVs against NaF was evaluated by adrenal oxidant/antioxidant biomarkers, hormonal assay of plasma adrenocorticotrophic hormone (ACTH) and corticosterone (CORT) and mRNA gene expression quantitation for adrenal cortical steroidogenic pathway-encoding genes. Histopathological examination of the adrenal tissue was performed. BMSC-EVs were effectively isolated and characterized. NaF exposure decreased adrenal superoxide dismutase and catalase activities, increased adrenal malondialdehyde levels, elevated plasma ACTH, diminished CORT concentrations and downregulated the adrenal cortical steroidogenic pathway-encoding genes. In addition, NaF-induced marked adrenal histopathological lesions. BMSC-EVs treatment repaired damaged adrenal tissue and recovered its function greatly following NaF consumption. BMSC-EVs reversed the toxic effects of NaF and reprogramed injured adrenal cells by activating regenerative processes.", "keywords": ["Adrenal Glands", "Animals", "Bone Marrow Cells", "Cell Differentiation", "Extracellular Vesicles", "Female", "Fluorides", "Mesenchymal Stem Cells", "Microscopy, Electron, Transmission", "Rats"], "year": "2021", "doi": "10.1016/j.lfs.2021.119122"}, {"pmid": "14401042", "title": "[The influence of small doses of radium emanation on the hematopoietic system and the hypophysial-adrenal cortex axis of the white mouse].", "abstract": "", "keywords": ["Adrenal Cortex", "Animals", "Hematopoietic System", "Mice", "Pituitary Gland", "Pituitary-Adrenal System", "Radium"], "year": "1960", "doi": ""}, {"pmid": "13792512", "title": "[The action of adrenocorticotropic hormone of the hypophysis and extracts of the adrenal cortex on hematopoiesis of irradiated animals].", "abstract": "", "keywords": ["Adrenal Cortex", "Adrenal Cortex Hormones", "Adrenocorticotropic Hormone", "Animals", "Hematopoiesis", "Pituitary Gland"], "year": "1959", "doi": ""}, {"pmid": "14858249", "title": "[Research on the endocrine regulation of hematopoiesis; action of adrenal cortex hormones and ACTH; preliminary note].", "abstract": "", "keywords": ["Adrenal Cortex Hormones", "Adrenocorticotropic Hormone", "Blood", "Hematopoiesis", "Research"], "year": "1951", "doi": ""}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"bone marrow\"[Title] OR \"hematopoietic\"[Title] OR \"haematopoietic\"[Title] OR \"hematopoiesis\"[Title] OR \"bone marrow niche\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__Brain", "source": "Adrenal Glands", "target": "Brain", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: Cortisol, Adrenaline\nNotes: Stress response.  The hypothalamic-pituitary-adrenal (HPA) axis responds to stress and maintains homeostasis.\nSources:\n- doi: 10.7326/0003-4819-141-11-200412070-00008.", "connection_type": "Hormonal connection", "key_players": ["Cortisol", "Adrenaline"], "key_players_metabolites": ["amp", "glucose", "arginine", "fatty acid", "fructose", "glutamate", "leucine", "amino acid", "creatinine", "urea", "cholesterol", "propionate", "glycogen", "atp", "bile acids", "lactate", "creatine", "fatty acids", "glutamine", "alanine"], "key_players_hormones": ["cortisol", "acth", "corticosterone", "glucocorticoid", "crh", "insulin", "tnf", "leptin", "testosterone", "ghrelin", "il-10", "il-6", "angiotensin", "norepinephrine", "vitamin d", "tumor necrosis factor", "vasopressin", "dhea", "angiotensin ii", "oxytocin", "progesterone", "mineralocorticoid", "il-4", "growth hormone", "epinephrine", "aldosterone", "estrogen", "adiponectin", "interleukin-1", "glucagon", "prolactin", "pyy", "il6", "renin", "noradrenaline", "t3", "fsh", "adrenaline", "il1b", "gnrh", "estradiol", "interleukin-6"], "key_players_proteins": ["sirt1", "acc", "fabp", "p38", "fxr", "mapk", "jnk", "pi3k", "leptin receptor", "akt", "mtor", "cyp7a1", "cyp27a1"], "key_players_counts_metabolites": {"cholesterol": 1, "propionate": 1, "amp": 24, "glycogen": 1, "atp": 1, "bile acids": 1, "glucose": 24, "fatty acid": 4, "glutamate": 3, "leucine": 2, "lactate": 1, "arginine": 7, "amino acid": 2, "creatinine": 2, "creatine": 1, "urea": 2, "fatty acids": 1, "fructose": 4, "glutamine": 1, "alanine": 1}, "key_players_counts_hormones": {"progesterone": 5, "dhea": 7, "tnf": 23, "testosterone": 15, "glucocorticoid": 65, "pyy": 1, "crh": 63, "interleukin-1": 2, "aldosterone": 3, "glucagon": 2, "acth": 137, "mineralocorticoid": 4, "angiotensin ii": 6, "oxytocin": 6, "il-4": 4, "norepinephrine": 9, "cortisol": 385, "growth hormone": 4, "il6": 1, "renin": 1, "noradrenaline": 1, "estrogen": 3, "adiponectin": 3, "insulin": 25, "t3": 1, "vitamin d": 9, "il-10": 11, "fsh": 1, "adrenaline": 1, "tumor necrosis factor": 8, "epinephrine": 4, "vasopressin": 8, "leptin": 17, "il1b": 1, "corticosterone": 104, "il-6": 10, "gnrh": 1, "ghrelin": 13, "estradiol": 1, "prolactin": 2, "angiotensin": 10, "interleukin-6": 1}, "key_players_counts_proteins": {"mapk": 2, "fabp": 3, "jnk": 1, "pi3k": 1, "p38": 3, "leptin receptor": 1, "akt": 1, "sirt1": 5, "fxr": 3, "acc": 5, "mtor": 1, "cyp7a1": 1, "cyp27a1": 1}, "notes": "Stress response.  The hypothalamic-pituitary-adrenal (HPA) axis responds to stress and maintains homeostasis.", "sources": ["doi: 10.7326/0003-4819-141-11-200412070-00008."], "ai_description": "The Adrenal Glands-Brain axis is mediated by the hypothalamic-pituitary-adrenal (HPA) axis, which responds to stress signals from the brain by releasing cortisol and other glucocorticoids [1]. These hormones interact with the brain's orexin system, influencing appetite, sleep, and autonomic function, as well as modulating the renin-angiotensin-aldosterone system, which regulates blood pressure and electrolyte balance [2]. Angiotensin II receptor signaling plays a crucial role in this axis, particularly after spinal cord injury or chronic stress, where it affects endocrine and immune function [2,3]. The HPA axis also interacts with other pituitary axes, such as the thyroid and gonadal axes, to regulate energy handling and metabolism [1].", "pubmed_n": 199, "pubmed_papers": [{"pmid": "42264997", "title": "Stress and the interaction of the hypothalamic-pituitary-adrenal axis with other pituitary axes and its consequences on muscle mass.", "abstract": "In this manuscript, the relation of the hypothalamic-pituitary-adrenal axis to energy handling, thyroid function, gonadal and growth hormones are discussed against the background of stress. Clinical data from the SHIP-PAGE (steroid hormones in patients with pituitary, adrenal and gonadal endocrinopathies) study are provided to show that the HPA axis is sensitive to glucose and interferes with the activities of other pituitary axes. While chronic stress leads to central hypogonadism and a loss in muscle mass, high glucose loads hamper the plasticities of the HPA, the hypothalamic-pituitary-gonadal as well as the hypothalamic-pituitary-growth hormone axes but elevate insulin concentrations. Therefore, prevention programs ideally include strategies to reduce stress and promote muscle activity.", "keywords": [], "year": "2026", "doi": "10.1016/j.beem.2026.102131"}, {"pmid": "42250115", "title": "Angiotensin II Receptor Signaling in the Hypothalamic-Pituitary-Adrenal Axis and Spleen After Spinal Cord Injury Depends on the Sympathetic Innervation Integrity.", "abstract": "Spinal cord injury (SCI) disrupts the integrated neuroendocrine network linking the hypothalamic-pituitary-adrenal (HPA) axis, renin-angiotensin-aldosterone system, and sympathetic nervous system, resulting in endocrine and immune dysfunction. However, the effects of SCI on angiotensin II receptor signaling remain unclear. This study investigated temporal and lesion-dependent changes in angiotensin II type 1 (AT 1 ) and type 2 (AT 2 ) receptor expression following SCI in rats. Low-thoracic SCI (Th9 compression, 40&#xa0;g/15 min) was evaluated over 28 days, while acute responses to partial (Th9) versus near-complete (Th1) sympathoadrenal denervation were compared. Receptor expression was assessed in the hypothalamic paraventricular nucleus, pituitary, adrenal gland, and spleen, and correlated with hormonal and morphological alterations. Surgical stress alone activated systemic angiotensin II signaling. Low-thoracic SCI induced time- and tissue-specific changes in angiotensin receptor expression independent of circulating angiotensin II levels, indicating adaptive remodeling of HPA axis sensitivity. SCI caused transient adrenal enlargement, zona fasciculata hypertrophy, dysregulated HPA axis activity, angiotensin II-independent aldosterone production, and altered catecholamine secretion. Splenic AT 1 receptor expression showed early upregulation followed by compensatory downregulation, consistent with dynamic neuroimmune modulation. In contrast, high-thoracic SCI markedly reduced receptor expression across central and peripheral HPA axis components and the spleen, accompanied by decreased corticotropin-releasing hormone, aldosterone, and norepinephrine, stable adrenocorticotropic hormone, and elevated corticosterone and epinephrine. These findings demonstrate that the extent of sympathetic disruption critically determines neuroendocrine-immune responses after SCI and identify sympathetic innervation as a key regulator of angiotensin receptor balance and stress-axis homeostasis following spinal cord trauma.", "keywords": [], "year": "2026", "doi": "10.1007/s10571-026-01760-4"}, {"pmid": "42176200", "title": "Impact of Chronic Mild Stress on Neurotrophic and Hypothalamic-Pituitary-Adrenal Factors in the Brain of Rats Submitted to Sepsis.", "abstract": "The present study aimed to investigate the effects of chronic mild stress (CMS) on neurotrophic factors in the brains of rats subjected to the cecal ligation and puncture (CLP) model of sepsis. After 30 days of the CLP procedure, the animals were subjected to CMS. Twenty-four hours after the last stressor, the animals were euthanized, their blood was collected, and their brains were dissected in the frontal cortex and hippocampus. Then, the levels of brain-derived neurotrophic factor, neurotrophin-3, neurotrophin-4, nerve growth factor, and glial cell line-derived neurotrophic factor were evaluated in the brain structures. The levels of adrenocorticotropic hormone and corticosterone were evaluated in the serum of the rats. The four experimental groups of the present study were: (1) Sham&#x2009;+&#x2009;Non-stressed; (2) Sepsis&#x2009;+&#x2009;Non-stressed; (3) Sham&#x2009;+&#x2009;CMS; (4) Sepsis&#x2009;+&#x2009;CMS. CMS increased adrenocorticotropic hormone and corticosterone levels, whereas sepsis alone did not significantly alter these hormones. Regarding neurotrophic factors, CMS reduced the levels of BDNF, NT-3, NT-4, and NGF in both the hippocampus and frontal cortex, regardless of prior sepsis exposure. Sepsis alone was also associated with reduced levels of these neurotrophins, although the magnitude of the effect varied depending on the specific neurotrophin and brain region, with greater reductions observed for BDNF and NGF. No interaction between sepsis and CMS was detected for these neurotrophins, suggesting independent effects. Our findings suggest that sepsis and CMS independently affect most neurotrophin levels, with no clear evidence that prior sepsis potentiates the effects of subsequent CMS. GDNF represents an exception, pointing to potential region-specific mechanisms that warrant further investigation.", "keywords": ["Animals", "Male", "Sepsis", "Corticosterone", "Nerve Growth Factors", "Stress, Psychological", "Adrenocorticotropic Hormone", "Rats, Wistar", "Rats", "Disease Models, Animal", "Brain", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System"], "year": "2026", "doi": "10.1007/s12640-026-00801-6"}, {"pmid": "42173622", "title": "Changes in the orexin system, hypothalamic-pituitary-adrenal axis and circadian rhythm in juvenile-stressed rats.", "abstract": "The orexin system has been demonstrated to play various physiological roles, such as in feeding, sleep, and autonomic neural function. Clinically, orexin receptor antagonists are used as hypnotics, and several clinical trials have suggested their efficacy in major depressive disorder. We investigated the orexin system using juvenile-stressed (3-week foot shock) rats, an animal model of depression. 3-week foot shock rats had significantly reduced prepro-orexin mRNA in the hypothalamus, but not orexin A protein or orexin A -like immunoreactive cells. In contrast, orexin receptor type 1 mRNA and its protein were significantly increased in the dorsal hippocampus, suggesting that some abnormality in orexin neurotransmission in this region due to 3wFS led to changes in orexin receptor type 1. Microinjection of a selective orexin receptor type 1 antagonist, SB334867, and a selective orexin receptor type 2 antagonist, TCS OX2 29, into the dorsal hippocampus in na&#xef;ve rats reduced depressive-like behaviors, suggesting that the hippocampus is a target brain site for the antidepressant effects of orexin receptor antagonists. Furthermore, 3-week foot shock rats showed a slight enhancement of the hypothalamus-pituitary-adrenal axis, a decrease in daily variations in body temperature, and increased behavioral activity.", "keywords": ["Animals", "Orexins", "Male", "Orexin Receptors", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System", "Hippocampus", "Circadian Rhythm", "Stress, Psychological", "Orexin Receptor Antagonists", "Hypothalamus", "RNA, Messenger", "Urea", "Benzoxazoles", "Disease Models, Animal", "Rats, Sprague-Dawley", "Naphthyridines", "Depression", "Rats", "Pyridines"], "year": "2026", "doi": "10.1016/j.jphs.2026.04.003"}, {"pmid": "42143153", "title": "A longitudinal analysis of hypothalamic-pituitary-adrenal axis and metabolic energy interactions pre- and post-menarche within and among Mayan Indigenous adolescent girls.", "abstract": "Adolescent girls face significant energetic trade-offs resulting from the concurrent demands of somatic growth and reproductive maturation. The hypothalamic pituitary-adrenal axis (HPAA) is a mediator of energy allocation. However, its longitudinal role during this critical transition is unclear. Hypothesis: HPAA activity should be positively linked with energy mobilization and inversely linked with energy storage, both pre- and post-menarche. We quantified first morning urine biomarkers of HPAA activity (cortisol), potential energy uptake (c-peptide), and energy storage (adiponectin) collected pre-to post-menarche from 46 Mayan girls. We used mixed effects models to characterize HPAA activity and metabolic energy status across menarche stages. Adiponectin and c-peptide were higher pre- versus post-menarche (p&#x2009;&lt;&#x2009;0.001) after adjusting for cortisol and time relative to menarche. Cortisol was positively associated with both c-peptide and adiponectin after adjusting for time relative to menarche (p&#x2009;&lt;&#x2009;0.001). Consistent with our hypothesis, HPAA activity was positively linked to energy mobilization across the adolescent transition. Energy uptake was higher pre-menarche, a possible response to energetic demands imposed by somatic and reproductive maturation. Energy storage was higher post-menarche, which may help meet future reproductive energy needs. Understanding changes in energy metabolism during the adolescent transition is paramount to optimizing women's development and health across their life span.", "keywords": [], "year": "2026", "doi": "10.1038/s41598-026-53184-1"}, {"pmid": "42129434", "title": "Hair cortisol concentrations to picture the dysregulation of the hypothalamic-pituitary-adrenocortical axis in panic disorder.", "abstract": "Panic attacks are characterized by intense feelings of uncontrollable threat and induce experiences of intense stress. As one of the major physiological stress systems of the body, the hypothalamic-pituitary-adrenocortical axis (HPA) may be a key to our understanding of a biological basis of this anxiety disorder. While recent studies have found evidence for short-term HPA changes in panic disorder with flattened cortisol responses to stimulation, no data have been available on tonic, i.e., long-term HPA activity in these patients. The current study therefore investigated the cumulative cortisol incorporation in hair over the period of three months in patients with panic disorder (n&#x2009;=&#x2009;45) and healthy individuals (n&#x2009;=&#x2009;45). Results showed higher hair cortisol concentration in patients with panic disorder compared to healthy controls. The duration and the severity of the disorder was unrelated to hair cortisol concentrations. In subsample analyses, patients with panic disorder and comorbid depression showed no significant differences in hair cortisol concentration compared to patients with pure panic disorder. The present findings do not support to the notion that a hypoactive HPA axis may be an important biological feature of patients suffering from panic disorder. Future studies will have to show in a large sample whether a changed HPA axis reactivity is present and causally related to the development and course of the disorder.", "keywords": ["Humans", "Hydrocortisone", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System", "Panic Disorder", "Hair", "Male", "Female", "Adult", "Middle Aged", "Case-Control Studies", "Young Adult"], "year": "2026", "doi": "10.1038/s41598-026-50934-z"}, {"pmid": "42116487", "title": "Ready-to-use blueberry extract modulates the hypothalamic-pituitary-adrenal axis and alleviates post-stress anxiety linked to antibiotic-induced gut dysbiosis.", "abstract": "This study investigated, for the first time, the effects of crude blueberry extracts obtained using natural deep eutectic solvent (CE-NADES) or a conventional organic solvent (CE-SORG) on anxiety- and depression-related parameters in a rat model of intestinal dysbiosis induced by antibiotics. CE-NADES is a ready-to-use extract that does not require solvent removal prior to administration, while CE-SORG was reconstituted in water after solvent removal. Oral administration of blueberry extracts (10&#xa0;mg of phenolic compounds/kg b.w./day) for 11&#xa0;days showed that CE-NADES significantly reduced plasma adrenocorticotropic hormone (13.2% vs. control dysbiosis; p&#xa0;&lt;&#xa0;0.01) and corticosterone (22.5% vs. control dysbiosis; p&#xa0;&lt;&#xa0;0.0001) levels, and attenuated anxiety-like behavior after acute restraint stress in the elevated plus maze test (85.1% increased time in open arms and 10.4% decreased anxiety index vs. control dysbiosis; p&#xa0;&lt;&#xa0;0.005). In contrast, CE-SORG reduced only corticosterone levels (15% vs. control dysbiosis; p&#xa0;&lt;&#xa0;0.0001) and did not produce an anxiolytic behavioral effect. These results indicate that while both extracts modulated the hypothalamic-pituitary-adrenal (HPA) axis, CE-NADES was more effective than CE-SORG. Only CE-NADES mitigated post-stress anxiety associated with antibiotic-induced gut dysbiosis, supporting an anxiolytic effect for this ready-to-use extract. NADES solvent/delivery system was a key determinant of the anxiolytic efficacy of blueberry extract, associated with HPA axis modulation at both the pituitary and adrenal levels.", "keywords": ["Animals", "Blueberry Plants", "Dysbiosis", "Plant Extracts", "Anxiety", "Male", "Anti-Bacterial Agents", "Rats", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System", "Corticosterone", "Adrenocorticotropic Hormone", "Disease Models, Animal", "Gastrointestinal Microbiome", "Rats, Wistar", "Anti-Anxiety Agents"], "year": "2026", "doi": "10.1016/j.foodres.2026.119235"}, {"pmid": "42092136", "title": "Androgen loss accelerates brain tumour growth via HPA axis activation.", "abstract": "Many cancers, including glioblastoma (GBM), show a male-biased incidence and associated worse outcomes 1 . The mechanisms that underlie this sex difference remain unclear but may involve an immune response 2 that is partly driven by sex hormones such as androgens. Such hormones are thought to suppress antitumour T&#x2009;cell immunity and to promote tumour progression 3,4 . However, here we report a previously unreported tumour-suppressive role for androgens in brain tumours. Using mouse models, we demonstrate that androgen loss via castration accelerates intracranial tumour growth, whereas the opposite effect (delayed tumour growth) is observed in extracranial tumours. Similar effects were observed in male patients with GBM, in whom testosterone treatment significantly reduced the risk of death. In male mice with GBM tumours, castration-induced systemic T&#x2009;cell dysfunction driven by increased levels of serum glucocorticoids, which act on myeloid cells to promote an immunosuppressive tumour microenvironment. Mechanistically, hyperactivation of the hypothalamus-pituitary-adrenal axis in castrated mice with GBM is driven by increased neuroinflammatory signalling through IL-1&#x3b2; and TNF. Spatial transcriptomic analysis further revealed that androgen loss enhances inflammasome activation in microglia, which promotes this neuroinflammatory state. Together, our findings demonstrate that brain tumours drive distinct neuroinflammatory and neuroendocrine pathways in the androgen-deprived setting and highlight organ-specific regulation of antitumour immunity.", "keywords": ["Animals", "Male", "Mice", "Hypothalamo-Hypophyseal System", "Androgens", "Interleukin-1beta", "Brain Neoplasms", "Glioblastoma", "Pituitary-Adrenal System", "Humans", "Testosterone", "Microglia", "Orchiectomy", "Inflammasomes", "Tumor Necrosis Factor-alpha", "Tumor Microenvironment", "T-Lymphocytes", "Female", "Glucocorticoids", "Neuroinflammatory Diseases", "Mice, Inbred C57BL", "Castration"], "year": "2026", "doi": "10.1038/s41586-026-10451-5"}, {"pmid": "42072769", "title": "Cerebral Metastasis in a Fatal Adrenocortical Carcinoma: A Rare Presentation of an Aggressive Tumor.", "abstract": "Adrenocortical carcinomas (ACCs) are rare, aggressive tumors often discovered incidentally. These malignancies may present with abnormal hormone secretion or, as in some cases, as non-functioning masses causing discomfort. We present a case of brain metastasis in a patient with a giant ACC. A 50-year-old man presented with headache and dizziness. A computed tomography (CT) scan showed an intracranial lesion within the parenchyma measuring 73*60*46 mm with left internal temporal involvement, abundant vasogenic edema and compressing the lateral left ventricle. Further imaging investigations identified a large necrotic tissue mass measuring 15 cm, located on both sides of the right diaphragmatic dome, in the middle posterior region. Hormonal workup was conducted and excluded a functional adrenal tumor. A CT-guided biopsy was performed, confirming ACC. Despite medical management, the patient's condition deteriorated rapidly, with the cerebral metastasis proving fatal. This case underscores the challenges posed by advanced ACC, particularly when associated with atypical metastatic sites. Giant ACC, though rare, presents significant diagnostic and therapeutic challenges. Surgical excision with appropriate oncologic management can lead to favorable outcomes. This report contributes to the limited literature on cerebral metastases in ACC, aiming to enhance awareness among clinicians managing this rare entity.", "keywords": [], "year": "2026", "doi": "10.3390/diagnostics16081143"}, {"pmid": "42036834", "title": "Myricetin attenuates atrazine-induced dysregulation of the hypothalamic-pituitary-adrenal axis of rats via anti-oxidative, anti-inflammatory, and anti-apoptotic mechanisms.", "abstract": "The hypothalamic-pituitary-adrenal (HPA) axis is an important part of the stress response system that produces a biological reaction to stressful stimuli and can be activated by stressors such as atrazine. Atrazine (ATZ) is a common triazine herbicide used in the management of weeds in corn and sugarcane, and its persistence in the environment through runoff and leaching leads to frequent contamination of soil and water, with subsequent adverse health implications. Myricetin (MYR) is a biologically active compound with various pharmacological potentials against noxious agents. This study evaluated the effects of MYR on the HPA axis of male Wistar rats sub-chronically exposed to atrazine (ATZ), gavaged with either atrazine (50&#x2009;mg/kg), myricetin (20&#x2009;mg/kg), or a combination of both for 45 consecutive days. Exposure to ATZ increased serum levels of adrenocorticotropin-releasing hormone (ACTH) and corticosterone, and significantly decreased the activities of hypothalamic and adrenal antioxidant enzymes (catalase, glutathione S-transferase, glutathione peroxidase, reduced glutathione), and hypothalamic acetylcholinesterase (AChE). More so, ATZ-challenged rats showed increased levels of reactive oxygen species
