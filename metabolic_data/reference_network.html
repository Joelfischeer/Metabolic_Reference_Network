<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metabolic Reference Network</title>
<script src="https://unpkg.com/cytoscape@3.29.2/dist/cytoscape.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- Top bar ---- */
  #topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
    z-index: 10;
  }

  #topbar h1 {
    font-size: 16px;
    font-weight: 700;
    color: #f1f5f9;
    white-space: nowrap;
  }

  #search-wrap {
    position: relative;
    flex: 1;
    max-width: 400px;
  }

  #search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    pointer-events: none;
    font-size: 14px;
  }

  #search-input {
    width: 100%;
    padding: 7px 12px 7px 32px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  #search-input:focus { border-color: #6366f1; }
  #search-input::placeholder { color: #64748b; }

  #search-count {
    font-size: 12px;
    color: #64748b;
    white-space: nowrap;
  }

  .ctrl-btn {
    padding: 6px 12px;
    background: #334155;
    border: none;
    border-radius: 6px;
    color: #cbd5e1;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .ctrl-btn:hover { background: #475569; color: #f1f5f9; }
  .ctrl-btn.active { background: #6366f1; color: white; }

  /* ---- Main area ---- */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ---- Graph canvas ---- */
  #cy-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #cy {
    width: 100%;
    height: 100%;
  }

  /* ---- Sidebar ---- */
  #sidebar {
    width: 340px;
    min-width: 260px;
    max-width: 480px;
    background: #1e293b;
    border-left: 1px solid #334155;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  #sidebar-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }

  #sidebar-title {
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  #sidebar-name {
    font-size: 17px;
    font-weight: 700;
    color: #f1f5f9;
    word-break: break-word;
  }

  #sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
  }

  #sidebar-body::-webkit-scrollbar { width: 5px; }
  #sidebar-body::-webkit-scrollbar-track { background: transparent; }
  #sidebar-body::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin: 14px 0 6px;
  }
  .section-label:first-child { margin-top: 0; }

  .connection-type-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: #312e81;
    color: #a5b4fc;
    margin-bottom: 2px;
  }

  .chips-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    cursor: default;
    transition: opacity 0.15s;
  }
  .chip:hover { opacity: 0.85; }

  .chip-hormone   { background: #451a03; color: #fdba74; border: 1px solid #92400e; }
  .chip-metabolite { background: #042f2e; color: #5eead4; border: 1px solid #0f766e; }
  .chip-protein   { background: #1e1b4b; color: #a5b4fc; border: 1px solid #3730a3; }
  .chip-general   { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

  .notes-text {
    font-size: 13px;
    color: #cbd5e1;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .source-item {
    font-size: 12px;
    color: #6366f1;
    margin-bottom: 3px;
    word-break: break-all;
    display: block;
    text-decoration: none;
  }
  .source-item:hover { color: #818cf8; }

  .paper-card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .paper-title {
    font-size: 13px;
    font-weight: 600;
    color: #e2e8f0;
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .paper-meta {
    font-size: 11px;
    color: #64748b;
    margin-bottom: 4px;
  }
  .paper-abstract {
    font-size: 12px;
    color: #94a3b8;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .paper-link {
    font-size: 11px;
    color: #6366f1;
    text-decoration: none;
    display: inline-block;
    margin-top: 4px;
  }
  .paper-link:hover { color: #818cf8; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #475569;
    font-size: 14px;
    line-height: 1.6;
  }
  .empty-state svg { margin: 0 auto 12px; display: block; opacity: 0.4; }

  /* ---- Search results panel ---- */
  #search-results {
    display: none;
    position: absolute;
    top: 52px;
    left: 0;
    right: 0;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    max-height: 200px;
    overflow-y: auto;
    z-index: 20;
    padding: 8px 0;
  }

  .search-result-item {
    padding: 8px 20px;
    cursor: pointer;
    font-size: 13px;
    color: #cbd5e1;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.1s;
  }
  .search-result-item:hover { background: #334155; }
  .search-result-item .match-type { font-size: 11px; color: #64748b; }

  /* ---- Legend ---- */
  #legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
    z-index: 5;
  }
  .legend-title { font-weight: 600; color: #94a3b8; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; color: #cbd5e1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ---- Hover tooltip ---- */
  #tooltip {
    position: fixed;
    display: none;
    background: #1e293b;
    border: 1px solid #334155;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    color: #e2e8f0;
    pointer-events: none;
    z-index: 100;
    max-width: 220px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  /* ---- Highlighted search match ---- */
  .search-matched { border: 2px solid #fbbf24 !important; }
</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <h1>🧬 Metabolic Reference Network</h1>

  <div id="search-wrap">
    <span id="search-icon">🔍</span>
    <input id="search-input" type="text"
           placeholder="Search molecule, hormone, organ…"
           autocomplete="off">
    <div id="search-results"></div>
  </div>

  <span id="search-count"></span>

  <button class="ctrl-btn" onclick="runLayout('cose')" title="Force-directed layout">⚡ Force</button>
  <button class="ctrl-btn" onclick="runLayout('circle')" title="Circle layout">⭕ Circle</button>
  <button class="ctrl-btn" onclick="runLayout('grid')" title="Grid layout">⊞ Grid</button>
  <button class="ctrl-btn" onclick="cy.fit()" title="Fit all">⤢ Fit</button>
</div>

<!-- Main area -->
<div id="main">
  <div id="cy-wrap">
    <div id="cy"></div>
    
  </div>

  <div id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-title">Select a node or edge</div>

        </svg>
        Click any <strong>node</strong> or <strong>edge</strong> to see details.<br><br>
        Use the search bar above to find connections by molecule name.
      </div>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script>
const elements = [{"data": {"id": "Adrenal Glands", "label": "Adrenal Glands", "description": "Function: Endocrine organs that regulate stress response, blood pressure, metabolism, electrolyte balance.\nMetabolism: \n- Cortisol leads to gluconeogenesis in kidney and liver. \n- Adrenaline leads to increased heart rate, breathing rate and glycogenolysis in liver.\n- Aldosterone regulates blood pressure and water reabsorption in the kidney.\n- Cortisol synchronizes peripheral clocks in liver, muscle, and adipose tissue and also seems to influencepancreas and gut.\nKey Metabolites: Adrenaline, Cortisol, aldosterone. \nKey Proteins: \nSources: \n- PMID: 40250885. \n- https://doi.org/10.1038/s41574-019-0228-0\n- Viblanc, V. A. et al. An integrative appraisal of the hormonal and metabolic changes induced by acute stress using king penguins as a model. _Gen. Comp. Endocrinol._ **269**, 1-10 (2018)\n- https://my.clevelandclinic.org/health/body/23005-adrenal-gland\nhttps://my.clevelandclinic.org/health/articles/24158-aldosterone\nhttps://my.clevelandclinic.org/health/articles/22611-epinephrine-adrenaline\n- DOI: 10.5772/intechopen.1003161\n-doi: 10.1016/j.coemr.2021.03.011.\n-\n", "color": "#9f1239"}}, {"data": {"id": "Bone Marrow", "label": "Bone Marrow", "description": "Function: Hematopoiesis, trafficking of immune cells (regulatory T cells, conventional T cells, B cells, dendritic cells, natural killer T (NKT) cells). Suggested to be a immune regulatory organ.\nMetabolism:\n- Hematopoesis\n- Cytokine production\nKey Metabolites: Cytokines\nKey Proteins: \nSources:\n- https://my.clevelandclinic.org/health/body/22818-bone-marrow\n- PMID: 22020068", "color": "#374151"}}, {"data": {"id": "Brain", "label": "Brain", "description": "Function: Cognitive and motor control\nMetabolism: High glucose consumption, partial switch to ketone bodies during fasting.\nKey Metabolites: Glucose\nKey Proteins: GLUT1 transports glucose at blood brain barrier. GLUT3 in nerve cells. SUV uptake can vary depending on region.\nSources: \n- https://doi.org/10.1093/lifemeta/loac030\n- https://doi.org/10.1152/physrev.00062.2017\n", "color": "#7c3aed"}}, {"data": {"id": "Colon", "label": "Colon", "description": "Function: Absorbs water, electrolytes and nutrients after bacterial metabolism of carbohydrates.\nMetabolism:\n- Aldosterone increases number of sodium pumps in basolateral membrane.\nKey Metabolites: butyrate\nKey Proteins: \nSources:\n- https://doi.org/10.1007/978-3-030-66049-9_2", "color": "#78350f"}}, {"data": {"id": "Heart", "label": "Heart", "description": "Function: Pumps blood through the body. 80% of cardiac ATP is provided by fatty acid oxidation (FAO) in the mitochondria. Rest: glucose and lactate, small amounts of ketone bodies and amino acids.\nMetabolism:\n- Uses mainly fatty acids as an energy source.\n- Metabolic switch to glucose can occur in severe diabetes.\n- Heart failure is associated with altered fatty acid uptake and fatty acid oxidation.\nKey Metabolites: \nKey Proteins:\nSources: \n- PMCID: PMC10816475\n- doi: 10.1161/CIRCRESAHA.121.318241\n- doi: 10.1152/physrev.00015.2009\n", "color": "#dc2626"}}, {"data": {"id": "Kidney", "label": "Kidney", "description": "Function: Nutrient and electrolyte reabsorption, pH homeostasis. Glucose reabsorption by SGLT2. SUVs adjusted\nMetabolism:\n- Gluconeogenesis during fasting. Reduced in acute and chronic kidney disease.\nKey Metabolites: Glucose, \nKey Proteins: SGLT2\nSources: \n- doi: 10.3389/fmed.2021.742072\n- doi: 10.1007/s00424-022-02696-6\n- doi: 10.1093/ckj/sfad046\n", "color": "#ea580c"}}, {"data": {"id": "Liver", "label": "Liver", "description": "Function: Metabolic conversions, glucose storage and conversion.\nMetabolism:\n- Gluconeogenesis (inhibited by insulin), glycogen synthesis (promoted by insulin) and glycogenolysis.\n- Lipid oxidation\n- Protein/amino acid metabolism\nKey Metabolites: Glucose, glycogen,\nKey Proteins: GLUT2\nSources:\n- doi: 10.1016/j.cub.2017.09.019", "color": "#92400e"}}, {"data": {"id": "Lung", "label": "Lung", "description": "Function: Oxygen uptake into the blood. \nMetabolism:\n- Very high total glucose usage (mainly for normal protein production).\n- Does more aerobic glycolysis compare to many other tissues (40% of glucose ends up in lactate in healthy rats).\nKey Metabolites: glucose, lactate\nKey Proteins: \nSources: \n- doi: 10.1146/annurev-physiol-020518-114640.\n- DOI: 10.1289/ehp.8455149\n- https://doi.org/10.1152/ajplegacy.1974.226.4.867", "color": "#0284c7"}}, {"data": {"id": "Muscle", "label": "Muscle", "description": "Function: Enables movement by contractions. Glucose consumer during exercise. Endocrine organ which releases myokines. \nMetabolism:\n- Fatty acid oxidation is heightened during fasting.\nKey Metabolites: Glucose, fatty acids.\nKey Proteins: GLUT4\nSources: - doi: 10.1093/jas/skac035.\n- doi: 10.3390/jcm14134490\n- https://doi.org/10.1038/nrendo.2012.49\n- doi: 10.1074/jbc.REV119.008351", "color": "#1d4ed8"}}, {"data": {"id": "Pancreas", "label": "Pancreas", "description": "Function: Produces gastrointestinal enzymes. Secretes insulin and glucagon that regulate blood glucose levels.\nMetabolism:\n- Lower gastrointestinal enzyme production during fasting.\nKey Metabolites: \nKey Proteins: Insulin, glucagon.\nSources:\n- https://doi.org/10.1038/s41392-024-02098-3\n", "color": "#0f766e"}}, {"data": {"id": "Small Intestine", "label": "Small Intestine", "description": "Function: Nutrient absorption after food intake.\nMetabolism:\n- Some gluconeogenesis\nKey Metabolites: Glucose, Fatty acids, glycerol, amino acids.\nKey Proteins: SGLT1, GLUT5\nSources:\n- DOI: 10.1016/j.cmet.2017.04.032\n- https://doi.org/10.1038/s41467-021-21235-y\n", "color": "#c2410c"}}, {"data": {"id": "Spleen", "label": "Spleen", "description": "Function: Adaptive immune response (B and T-cells). Innate immune response (macrophages).\nMetabolism:\n- Baseline metabolism is likely driven by inflammation.\n- FDG uptake can strongly change based on immune activation.\nKey Metabolites: \nKey Proteins: \nSources:\n- https://doi.org/10.1038/nri1669\n- https://doi.org/10.1038/s41598-024-67905-x\n", "color": "#6b21a8"}}, {"data": {"id": "Thyroid", "label": "Thyroid", "description": "Function: Regulatory and secretory organ. TSH is the primary messenger that leads to T3 and T4 production. TH  regulates Thermogenesis, energy utilization by increasing the basal metabolic rate and regulate lipid and glucose metabolism.\n- Hyperthyroid condition: Increased heart rate, increased metabolism, can lead to high blood glucose levels due to high liver glucose production.\n- Hypothyroidism: Reduced metabolism, higher cholesterol and triglycerides in blood, higher blood pressure.\n--> Bidirectional link between TH and adiposity: \nA) TH promotes fat storage + lowers energy expenditure\nB) Excess fat tissue releases inflammatory cytokines and leptin which alters TSH secretion. They have elevates TSH levels with a healthy thyroid.\nMetabolism:\n- Hormone production.\n- TSH influences the enzyme that turns inactive T4 into active T4.\nKey Metabolites: \nKey Proteins: TH (T3 and T4), TSH (Thyrotropin)\nSources:\n- doi: 10.1177/2042018820917869\n- https://doi.org/10.1152/physrev.00030.2013\n", "color": "#15803d"}}, {"data": {"id": "WAT", "label": "WAT", "description": "Function: Energy storage. \nMetabolism: Lipolysis during fasting. \nSecretes Leptin, which regulates hunger. Secretes lipolysis products: free fatty acids, glycerol. \nInsulin resistance: \n- WAT and Muscle are impaired in taking up glucose while the liver looses its ability in endogenous glucose production. Leads to the uncontrolled release of fatty acids from the WAT.\n- \"A current view, which proposes adipocyte dysfunction as an early cardinal event in insulin resistance, is that WAT drives metabolic fluxes that affect the liver and skeletal muscle\"[Morigny et. al.], [Roden et. al.]\n- The pancreas beta-cells have an increased burden to produce insulin. The function may then decline with time. Correlation is present in low-BMI (non diabetic?) patients while no correlation is present in high-BMI (diabetic?) patients.\nKey Proteins: GLUT4 (Insulin-dependent), GLUT1.\nSources: \n- https://doi.org/10.1038/s41574-021-00471-8\n- doi: 10.1074/jbc.REV119.008351.\n", "color": "#b45309"}}, {"data": {"id": "Adrenal Glands__Bone Marrow", "source": "Adrenal Glands", "target": "Bone Marrow", "color": "#64748b", "description": "“Type: Hormonal Connection\nKey Players: Cortisol\nNotes: \n- Cortisol affects bone metabolism during normal Physiological conditions.\nOsteoblasts needed for bone formation are generated in the Bone marrow.\nSources:\n-DOI: 10.5772/intechopen.1003161\n”", "connection_type": "Hormonal Connection", "key_players": ["Cortisol"], "key_players_metabolites": ["Cortisol"], "key_players_hormones": ["Cortisol", "acth", "leptin", "corticosterone"], "key_players_proteins": ["Cortisol", "leptin receptor"], "key_players_counts_metabolites": {}, "key_players_counts_hormones": {"acth": 3, "leptin": 2, "corticosterone": 1}, "key_players_counts_proteins": {"leptin receptor": 1}, "notes": "- Cortisol affects bone metabolism during normal Physiological conditions.\nOsteoblasts needed for bone formation are generated in the Bone marrow.", "sources": ["DOI: 10.5772/intechopen.1003161", "”"], "ai_description": "", "pubmed_n": 6, "pubmed_papers": [{"pmid": "38728427", "title": "Inducible CXCL12/CXCR4-dependent extramedullary hematopoietic niches in the adrenal&#xa0;gland.", "abstract": "Adult hematopoietic stem and progenitor cells (HSPCs) reside in the bone marrow (BM) hematopoietic niche, which regulates HSPC quiescence, self-renewal, and commitment in a demand-adapted manner. Although the complex BM niche is responsible for adult hematopoiesis, evidence exists for simpler, albeit functional and more accessible, extramedullary hematopoietic niches. Inspired by the anecdotal description of retroperitoneal hematopoietic masses occurring at higher frequency upon hormonal dysregulation within the adrenal gland, we hypothesized that the adult adrenal gland could be induced into a hematopoietic-supportive environment in a systematic manner, thus revealing mechanisms underlying de novo niche formation in the adult. Here, we show that upon splenectomy and hormonal stimulation, the adult adrenal gland of mice can be induced to recruit and host functional HSPCs, capable of serial transplantation, and that this phenomenon is associated with de novo formation of platelet-derived growth factor receptor &#x3b1;/leptin receptor (PDGFR&#x3b1;+/LEPR+/-)-expressing stromal nodules. We further show in CXCL12-green fluorescent protein reporter mice that adrenal glands contain a stromal population reminiscent of the CXCL12-abundant reticular cells, which compose the BM HSPC niche. Mechanistically, HSPC homing to hormonally induced adrenal glands was found dependent on the CXCR4-CXCL12 axis. Mirroring our findings in mice, we found reticular CXCL12+ cells coexpressing master niche regulator FOXC1 in primary samples from human adrenal myelolipomas, a benign tumor composed of adipose and hematopoietic tissue. Our findings reignite long-standing questions regarding hormonal regulation of hematopoiesis and provide a novel model to facilitate the study of adult-specific inducible hematopoietic niches, which may pave the way to therapeutic applications.", "keywords": ["Animals", "Receptors, CXCR4", "Chemokine CXCL12", "Mice", "Hematopoietic Stem Cells", "Adrenal Glands", "Stem Cell Niche", "Mice, Inbred C57BL", "Humans", "Receptor, Platelet-Derived Growth Factor alpha", "Receptors, Leptin", "Hematopoiesis, Extramedullary", "Splenectomy", "Mice, Transgenic"], "year": "2024", "doi": "10.1182/blood.2023020875"}, {"pmid": "34054040", "title": "Adrenocortical Function in Children With Brain Tumors and Pediatric Hematopoietic Cell Transplantation Recipients.", "abstract": "Adrenocortical insufficiency (AI) is a clinical condition defined by deficient production of glucocorticoids that can result in life-threatening complications. We examined the prevalence of AI in children with brain tumors and those undergoing hematopoietic cell transplantation. Adrenocorticotropic hormone stimulation (stim) testing was used for the assessment of adrenocortical function. On the basis of 155 stim tests in 117 patients, AI was diagnosed in 27.4% of patients with brain tumors and in 21% of hematopoietic cell transplantation recipients. A number of risk factors associated with AI were identified. Adrenocorticotropic hormone stim testing led to a definitive diagnosis of AI or recovery of adrenal function and unambiguous medical management.", "keywords": ["Adrenal Insufficiency", "Adrenocorticotropic Hormone", "Brain Neoplasms", "Child", "Glucocorticoids", "Hematopoietic Stem Cell Transplantation", "Humans", "Hydrocortisone"], "year": "2022", "doi": "10.1097/MPH.0000000000002220"}, {"pmid": "33508294", "title": "Extracellular vesicles derived from bone marrow mesenchymal stem cells repair functional and structural rat adrenal gland damage induced by fluoride.", "abstract": "The adrenal glands have striking morpho-biochemical features that render them vulnerable to the effects of toxins. This study was conducted to explore the therapeutic utility of extracellular vesicles derived from bone marrow mesenchymal stem cells (BMSC-EVs) against fluoride-induced adrenal toxicity. The work included isolation and further identification of BMSC-EVs by transmission electron microscopy and flow cytometric analysis. Adrenal toxicity in rats was induced by oral administration of 300&#xa0;ppm of sodium fluoride (NaF) in drinking water for 60&#xa0;days followed by a single dose injection of BMSC-EVs. The effects of BMSC-EVs against NaF was evaluated by adrenal oxidant/antioxidant biomarkers, hormonal assay of plasma adrenocorticotrophic hormone (ACTH) and corticosterone (CORT) and mRNA gene expression quantitation for adrenal cortical steroidogenic pathway-encoding genes. Histopathological examination of the adrenal tissue was performed. BMSC-EVs were effectively isolated and characterized. NaF exposure decreased adrenal superoxide dismutase and catalase activities, increased adrenal malondialdehyde levels, elevated plasma ACTH, diminished CORT concentrations and downregulated the adrenal cortical steroidogenic pathway-encoding genes. In addition, NaF-induced marked adrenal histopathological lesions. BMSC-EVs treatment repaired damaged adrenal tissue and recovered its function greatly following NaF consumption. BMSC-EVs reversed the toxic effects of NaF and reprogramed injured adrenal cells by activating regenerative processes.", "keywords": ["Adrenal Glands", "Animals", "Bone Marrow Cells", "Cell Differentiation", "Extracellular Vesicles", "Female", "Fluorides", "Mesenchymal Stem Cells", "Microscopy, Electron, Transmission", "Rats"], "year": "2021", "doi": "10.1016/j.lfs.2021.119122"}, {"pmid": "14401042", "title": "[The influence of small doses of radium emanation on the hematopoietic system and the hypophysial-adrenal cortex axis of the white mouse].", "abstract": "", "keywords": ["Adrenal Cortex", "Animals", "Hematopoietic System", "Mice", "Pituitary Gland", "Pituitary-Adrenal System", "Radium"], "year": "1960", "doi": ""}, {"pmid": "13792512", "title": "[The action of adrenocorticotropic hormone of the hypophysis and extracts of the adrenal cortex on hematopoiesis of irradiated animals].", "abstract": "", "keywords": ["Adrenal Cortex", "Adrenal Cortex Hormones", "Adrenocorticotropic Hormone", "Animals", "Hematopoiesis", "Pituitary Gland"], "year": "1959", "doi": ""}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"bone marrow\"[Title] OR \"hematopoietic\"[Title] OR \"haematopoietic\"[Title] OR \"hematopoiesis\"[Title] OR \"bone marrow niche\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__Brain", "source": "Adrenal Glands", "target": "Brain", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: Cortisol, Adrenaline\nNotes: Stress response.  The hypothalamic-pituitary-adrenal (HPA) axis responds to stress and maintains homeostasis.\nSources:\n- doi: 10.7326/0003-4819-141-11-200412070-00008.", "connection_type": "Hormonal connection", "key_players": ["Cortisol", "Adrenaline"], "key_players_metabolites": ["Cortisol", "Adrenaline", "amp", "glucose", "arginine", "fatty acid", "fructose", "glutamate", "leucine", "amino acid", "creatinine", "urea", "cholesterol", "propionate", "glycogen", "atp", "bile acids", "lactate", "creatine", "fatty acids", "glutamine", "alanine"], "key_players_hormones": ["Cortisol", "Adrenaline", "acth", "corticosterone", "glucocorticoid", "crh", "insulin", "tnf", "leptin", "testosterone", "ghrelin", "il-10", "il-6", "angiotensin", "norepinephrine", "vitamin d", "tumor necrosis factor", "vasopressin", "dhea", "angiotensin ii", "oxytocin", "progesterone", "mineralocorticoid", "il-4", "growth hormone", "epinephrine", "aldosterone", "estrogen", "adiponectin", "interleukin-1", "glucagon", "prolactin", "pyy", "il6", "renin", "noradrenaline", "t3", "fsh", "il1b", "gnrh", "estradiol", "interleukin-6"], "key_players_proteins": ["Cortisol", "Adrenaline", "sirt1", "acc", "fabp", "p38", "fxr", "mapk", "jnk", "pi3k", "leptin receptor", "akt", "mtor", "cyp7a1", "cyp27a1"], "key_players_counts_metabolites": {"cholesterol": 1, "propionate": 1, "amp": 24, "glycogen": 1, "atp": 1, "bile acids": 1, "glucose": 24, "fatty acid": 4, "glutamate": 3, "leucine": 2, "lactate": 1, "arginine": 7, "amino acid": 2, "creatinine": 2, "creatine": 1, "urea": 2, "fatty acids": 1, "fructose": 4, "glutamine": 1, "alanine": 1}, "key_players_counts_hormones": {"progesterone": 5, "dhea": 7, "tnf": 23, "testosterone": 15, "glucocorticoid": 65, "pyy": 1, "crh": 63, "interleukin-1": 2, "aldosterone": 3, "glucagon": 2, "acth": 137, "mineralocorticoid": 4, "angiotensin ii": 6, "oxytocin": 6, "il-4": 4, "norepinephrine": 9, "cortisol": 385, "growth hormone": 4, "il6": 1, "renin": 1, "noradrenaline": 1, "estrogen": 3, "adiponectin": 3, "insulin": 25, "t3": 1, "vitamin d": 9, "il-10": 11, "fsh": 1, "adrenaline": 1, "tumor necrosis factor": 8, "epinephrine": 4, "vasopressin": 8, "leptin": 17, "il1b": 1, "corticosterone": 104, "il-6": 10, "gnrh": 1, "ghrelin": 13, "estradiol": 1, "prolactin": 2, "angiotensin": 10, "interleukin-6": 1}, "key_players_counts_proteins": {"mapk": 2, "fabp": 3, "jnk": 1, "pi3k": 1, "p38": 3, "leptin receptor": 1, "akt": 1, "sirt1": 5, "fxr": 3, "acc": 5, "mtor": 1, "cyp7a1": 1, "cyp27a1": 1}, "notes": "Stress response.  The hypothalamic-pituitary-adrenal (HPA) axis responds to stress and maintains homeostasis.", "sources": ["doi: 10.7326/0003-4819-141-11-200412070-00008."], "ai_description": "", "pubmed_n": 199, "pubmed_papers": [{"pmid": "42264997", "title": "Stress and the interaction of the hypothalamic-pituitary-adrenal axis with other pituitary axes and its consequences on muscle mass.", "abstract": "In this manuscript, the relation of the hypothalamic-pituitary-adrenal axis to energy handling, thyroid function, gonadal and growth hormones are discussed against the background of stress. Clinical data from the SHIP-PAGE (steroid hormones in patients with pituitary, adrenal and gonadal endocrinopathies) study are provided to show that the HPA axis is sensitive to glucose and interferes with the activities of other pituitary axes. While chronic stress leads to central hypogonadism and a loss in muscle mass, high glucose loads hamper the plasticities of the HPA, the hypothalamic-pituitary-gonadal as well as the hypothalamic-pituitary-growth hormone axes but elevate insulin concentrations. Therefore, prevention programs ideally include strategies to reduce stress and promote muscle activity.", "keywords": [], "year": "2026", "doi": "10.1016/j.beem.2026.102131"}, {"pmid": "42250115", "title": "Angiotensin II Receptor Signaling in the Hypothalamic-Pituitary-Adrenal Axis and Spleen After Spinal Cord Injury Depends on the Sympathetic Innervation Integrity.", "abstract": "Spinal cord injury (SCI) disrupts the integrated neuroendocrine network linking the hypothalamic-pituitary-adrenal (HPA) axis, renin-angiotensin-aldosterone system, and sympathetic nervous system, resulting in endocrine and immune dysfunction. However, the effects of SCI on angiotensin II receptor signaling remain unclear. This study investigated temporal and lesion-dependent changes in angiotensin II type 1 (AT 1 ) and type 2 (AT 2 ) receptor expression following SCI in rats. Low-thoracic SCI (Th9 compression, 40&#xa0;g/15 min) was evaluated over 28 days, while acute responses to partial (Th9) versus near-complete (Th1) sympathoadrenal denervation were compared. Receptor expression was assessed in the hypothalamic paraventricular nucleus, pituitary, adrenal gland, and spleen, and correlated with hormonal and morphological alterations. Surgical stress alone activated systemic angiotensin II signaling. Low-thoracic SCI induced time- and tissue-specific changes in angiotensin receptor expression independent of circulating angiotensin II levels, indicating adaptive remodeling of HPA axis sensitivity. SCI caused transient adrenal enlargement, zona fasciculata hypertrophy, dysregulated HPA axis activity, angiotensin II-independent aldosterone production, and altered catecholamine secretion. Splenic AT 1 receptor expression showed early upregulation followed by compensatory downregulation, consistent with dynamic neuroimmune modulation. In contrast, high-thoracic SCI markedly reduced receptor expression across central and peripheral HPA axis components and the spleen, accompanied by decreased corticotropin-releasing hormone, aldosterone, and norepinephrine, stable adrenocorticotropic hormone, and elevated corticosterone and epinephrine. These findings demonstrate that the extent of sympathetic disruption critically determines neuroendocrine-immune responses after SCI and identify sympathetic innervation as a key regulator of angiotensin receptor balance and stress-axis homeostasis following spinal cord trauma.", "keywords": [], "year": "2026", "doi": "10.1007/s10571-026-01760-4"}, {"pmid": "42176200", "title": "Impact of Chronic Mild Stress on Neurotrophic and Hypothalamic-Pituitary-Adrenal Factors in the Brain of Rats Submitted to Sepsis.", "abstract": "The present study aimed to investigate the effects of chronic mild stress (CMS) on neurotrophic factors in the brains of rats subjected to the cecal ligation and puncture (CLP) model of sepsis. After 30 days of the CLP procedure, the animals were subjected to CMS. Twenty-four hours after the last stressor, the animals were euthanized, their blood was collected, and their brains were dissected in the frontal cortex and hippocampus. Then, the levels of brain-derived neurotrophic factor, neurotrophin-3, neurotrophin-4, nerve growth factor, and glial cell line-derived neurotrophic factor were evaluated in the brain structures. The levels of adrenocorticotropic hormone and corticosterone were evaluated in the serum of the rats. The four experimental groups of the present study were: (1) Sham&#x2009;+&#x2009;Non-stressed; (2) Sepsis&#x2009;+&#x2009;Non-stressed; (3) Sham&#x2009;+&#x2009;CMS; (4) Sepsis&#x2009;+&#x2009;CMS. CMS increased adrenocorticotropic hormone and corticosterone levels, whereas sepsis alone did not significantly alter these hormones. Regarding neurotrophic factors, CMS reduced the levels of BDNF, NT-3, NT-4, and NGF in both the hippocampus and frontal cortex, regardless of prior sepsis exposure. Sepsis alone was also associated with reduced levels of these neurotrophins, although the magnitude of the effect varied depending on the specific neurotrophin and brain region, with greater reductions observed for BDNF and NGF. No interaction between sepsis and CMS was detected for these neurotrophins, suggesting independent effects. Our findings suggest that sepsis and CMS independently affect most neurotrophin levels, with no clear evidence that prior sepsis potentiates the effects of subsequent CMS. GDNF represents an exception, pointing to potential region-specific mechanisms that warrant further investigation.", "keywords": ["Animals", "Male", "Sepsis", "Corticosterone", "Nerve Growth Factors", "Stress, Psychological", "Adrenocorticotropic Hormone", "Rats, Wistar", "Rats", "Disease Models, Animal", "Brain", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System"], "year": "2026", "doi": "10.1007/s12640-026-00801-6"}, {"pmid": "42173622", "title": "Changes in the orexin system, hypothalamic-pituitary-adrenal axis and circadian rhythm in juvenile-stressed rats.", "abstract": "The orexin system has been demonstrated to play various physiological roles, such as in feeding, sleep, and autonomic neural function. Clinically, orexin receptor antagonists are used as hypnotics, and several clinical trials have suggested their efficacy in major depressive disorder. We investigated the orexin system using juvenile-stressed (3-week foot shock) rats, an animal model of depression. 3-week foot shock rats had significantly reduced prepro-orexin mRNA in the hypothalamus, but not orexin A protein or orexin A -like immunoreactive cells. In contrast, orexin receptor type 1 mRNA and its protein were significantly increased in the dorsal hippocampus, suggesting that some abnormality in orexin neurotransmission in this region due to 3wFS led to changes in orexin receptor type 1. Microinjection of a selective orexin receptor type 1 antagonist, SB334867, and a selective orexin receptor type 2 antagonist, TCS OX2 29, into the dorsal hippocampus in na&#xef;ve rats reduced depressive-like behaviors, suggesting that the hippocampus is a target brain site for the antidepressant effects of orexin receptor antagonists. Furthermore, 3-week foot shock rats showed a slight enhancement of the hypothalamus-pituitary-adrenal axis, a decrease in daily variations in body temperature, and increased behavioral activity.", "keywords": ["Animals", "Orexins", "Male", "Orexin Receptors", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System", "Hippocampus", "Circadian Rhythm", "Stress, Psychological", "Orexin Receptor Antagonists", "Hypothalamus", "RNA, Messenger", "Urea", "Benzoxazoles", "Disease Models, Animal", "Rats, Sprague-Dawley", "Naphthyridines", "Depression", "Rats", "Pyridines"], "year": "2026", "doi": "10.1016/j.jphs.2026.04.003"}, {"pmid": "42143153", "title": "A longitudinal analysis of hypothalamic-pituitary-adrenal axis and metabolic energy interactions pre- and post-menarche within and among Mayan Indigenous adolescent girls.", "abstract": "Adolescent girls face significant energetic trade-offs resulting from the concurrent demands of somatic growth and reproductive maturation. The hypothalamic pituitary-adrenal axis (HPAA) is a mediator of energy allocation. However, its longitudinal role during this critical transition is unclear. Hypothesis: HPAA activity should be positively linked with energy mobilization and inversely linked with energy storage, both pre- and post-menarche. We quantified first morning urine biomarkers of HPAA activity (cortisol), potential energy uptake (c-peptide), and energy storage (adiponectin) collected pre-to post-menarche from 46 Mayan girls. We used mixed effects models to characterize HPAA activity and metabolic energy status across menarche stages. Adiponectin and c-peptide were higher pre- versus post-menarche (p&#x2009;&lt;&#x2009;0.001) after adjusting for cortisol and time relative to menarche. Cortisol was positively associated with both c-peptide and adiponectin after adjusting for time relative to menarche (p&#x2009;&lt;&#x2009;0.001). Consistent with our hypothesis, HPAA activity was positively linked to energy mobilization across the adolescent transition. Energy uptake was higher pre-menarche, a possible response to energetic demands imposed by somatic and reproductive maturation. Energy storage was higher post-menarche, which may help meet future reproductive energy needs. Understanding changes in energy metabolism during the adolescent transition is paramount to optimizing women's development and health across their life span.", "keywords": [], "year": "2026", "doi": "10.1038/s41598-026-53184-1"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"brain\"[Title] OR \"cerebral\"[Title] OR \"hypothalamus\"[Title] OR \"hypothalamic\"[Title] OR \"central nervous system\"[Title] OR \"CNS\"[Title] OR \"neuronal\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__Kidney", "source": "Adrenal Glands", "target": "Kidney", "color": "#64748b", "description": "Type: Hormonal Connection\nKey Players: Glucagon, cortisol, insulin, aldosterone\nNotes: - Adrenal glands sits anatomically next to kidney.\n- Renal function is regulated in multiple ways by the adrenal cortex.\n- Glucagon release by the pancreas is increased by cortisol, leading to gluconeogenesis in the liver and kidney.\n- Cortisol lowers insulin secretion by pancreas. As insulin inhibits gluconeogenesis in the kidney, more gluconeogenesis is done.\nSources:\n- https://doi.org/10.1038/ki.1974.113\n- doi: 10.1093/ckj/sfad046", "connection_type": "Hormonal Connection", "key_players": ["Glucagon", "cortisol", "insulin", "aldosterone"], "key_players_metabolites": ["Glucagon", "cortisol", "insulin", "aldosterone", "glucose", "creatinine", "cholesterol", "urea", "succinate", "fatty acids", "propionate", "amp", "prostaglandin", "triglyceride", "nadph", "fatty acid", "uric acid", "glucose-6-phosphate", "glycine", "atp", "bile acids", "hdl", "amino acids", "arginine", "amino acid", "lipoprotein", "acetate", "nadh", "alanine"], "key_players_hormones": ["Glucagon", "cortisol", "insulin", "aldosterone", "acth", "crh", "corticosterone", "glucocorticoid", "renin", "angiotensin", "vitamin d", "mineralocorticoid", "testosterone", "anp", "angiotensin ii", "vasopressin", "progesterone", "tnf", "natriuretic peptide", "thyroxine", "estradiol", "il-4", "adh", "estrogen", "il-10", "fsh", "adrenaline", "tumor necrosis factor", "epinephrine", "lh", "prolactin", "somatostatin"], "key_players_proteins": ["Glucagon", "cortisol", "insulin", "aldosterone", "cox-2", "acc"], "key_players_counts_metabolites": {"cholesterol": 6, "glycine": 1, "propionate": 3, "amp": 3, "atp": 1, "bile acids": 1, "hdl": 1, "amino acids": 1, "glucose": 22, "fatty acid": 2, "prostaglandin": 3, "arginine": 1, "amino acid": 1, "creatinine": 7, "lipoprotein": 1, "acetate": 1, "uric acid": 2, "urea": 6, "triglyceride": 3, "fatty acids": 5, "succinate": 6, "nadh": 1, "glucose-6-phosphate": 2, "nadph": 3, "alanine": 1}, "key_players_counts_hormones": {"progesterone": 2, "tnf": 2, "testosterone": 6, "natriuretic peptide": 2, "glucocorticoid": 17, "thyroxine": 2, "crh": 28, "aldosterone": 47, "acth": 63, "mineralocorticoid": 7, "angiotensin ii": 4, "il-4": 1, "cortisol": 68, "adh": 1, "renin": 16, "estrogen": 1, "insulin": 5, "vitamin d": 11, "il-10": 1, "fsh": 1, "adrenaline": 1, "tumor necrosis factor": 1, "epinephrine": 1, "lh": 1, "vasopressin": 4, "corticosterone": 22, "estradiol": 2, "prolactin": 1, "somatostatin": 1, "anp": 5, "angiotensin": 16}, "key_players_counts_proteins": {"cox-2": 9, "acc": 7}, "notes": "- Adrenal glands sits anatomically next to kidney.\n- Renal function is regulated in multiple ways by the adrenal cortex.\n- Glucagon release by the pancreas is increased by cortisol, leading to gluconeogenesis in the liver and kidney.\n- Cortisol lowers insulin secretion by pancreas. As insulin inhibits gluconeogenesis in the kidney, more gluconeogenesis is done.", "sources": ["https://doi.org/10.1038/ki.1974.113", "doi: 10.1093/ckj/sfad046"], "ai_description": "", "pubmed_n": 98, "pubmed_papers": [{"pmid": "42317869", "title": "Association between vitamin D deficiency and adrenal gland, kidney function, indicators related to cardiovascular function in hypertensive patients.", "abstract": "Previous research has established an association between vitamin D deficiency and various non-skeletal metabolic disorders. However, the potential association between vitamin D status and specific clinical manifestations including renal dysfunction, primary aldosteronism (PA), and cardiovascular function-related indicators in patients with hypertension remains poorly elucidated. A total of 250 consecutive patients with hypertension who were hospitalized in the Senior Cardiology Department of the Sixth Medical Center of the Chinese PLA General Hospital were enrolled in this study. Volunteers currently supplementing with vitamin D have been excluded. Fasting peripheral venous blood samples were collected from all participants for routine biochemical assays. All participants underwent a comprehensive set of examinations, including transthoracic echocardiography, ambulatory blood pressure monitoring, and routine urinalysis. Serum levels of 25-hydroxyvitamin D (25-OH-D) were measured to evaluate vitamin D status. Relevant clinical and physiological indicators were recorded. Differences in auxiliary examination results and physiological indicators between subgroups were compared and analyzed. The correlations of serum 25-OH-D levels with renal function parameters, cardiovascular function-related indicators, and PA status were further investigated. Of all participants, 165 patients had vitamin D deficiency (serum 25-OH-D&#x202f;&lt;&#x202f;50&#x202f;nmol/L), whereas 85 patients had non-deficient vitamin D status (serum 25-OH-D&#x202f;&#x2265;&#x202f;50&#x202f;nmol/L). There were no statistically significant differences in age, gender, and body mass index (BMI) between the two groups. Compared with the non-deficient group, patients in the vitamin D deficiency group (25-OH-D&#x202f;&lt;&#x202f;50&#x202f;nmol/L) had significantly lower levels of hematocrit, red blood cell count, hemoglobin, serum calcium, urinary uric acid, and urinary creatinine, as well as significantly higher levels of serum sodium, supine aldosterone concentration, supine aldosterone-to-renin ratio (ARR), and upright aldosterone concentration (all p &#x202f;&lt;&#x202f;0.05). Binary logistic regression analysis revealed that PA was significantly associated with vitamin D deficiency ( OR 0.210, 95% CI 0.045-0.974, p &#x202f;=&#x202f;0.046). Multivariate linear regression analysis demonstrated that serum 25-OH-D levels were independently and inversely associated with estimated glomerular filtration rate (eGFR) ( &#x3b2; &#x202f;=&#x202f;-4.348, t &#x202f;=&#x202f;-3.082, p &#x202f;=&#x202f;0.002). Patients with chronic kidney disease (CKD) had a significantly larger left atrial anteroposterior diameter [39(36,42) vs. 36(32,39) mm, p &#x202f;=&#x202f;0.001] and pulmonary artery diameter [24(22,26) vs. 23(21,25) mm, p &#x202f;=&#x202f;0.010], along with a higher 24-h mean systolic blood pressure (131&#x202f;&#xb1;&#x202f;11 vs. 127&#x202f;&#xb1;&#x202f;11&#x202f;mmHg, p &#x202f;=&#x202f;0.042), but a lower 24-h mean diastolic blood pressure (73&#x202f;&#xb1;&#x202f;10 vs. 77&#x202f;&#xb1;&#x202f;9&#x202f;mmHg, p &#x202f;=&#x202f;0.042), compared with those without renal dysfunction. After adjustment for traditional cardiovascular risk factors, PA remained independently associated with vitamin D deficiency in patients with hypertension. Vitamin D and retinol-binding protein were significantly associated with renal dysfunction in this patient population.", "keywords": [], "year": "2026", "doi": "10.3389/fnut.2026.1741253"}, {"pmid": "41085519", "title": "Simultaneous adrenal gland and pancreas-kidney transplantation and associated hormonal challenges.", "abstract": "Adrenal gland transplantation has only been performed in rare cases, with variable results in terms of functional activity. Consequently, there is a lack of evidence in endocrine management and tapering hormone replacement therapy after such transplantations. We report on a simultaneous pancreas-kidney and adrenal gland allotransplantation in a 48-year-old female patient with type 1 diabetes and severe autoimmune adrenal insufficiency. Surgery was uneventful, without major surgical morbidity. Pancreas and kidney graft function were excellent from the beginning. Adrenal graft function was difficult to assess and steroid tapering was not well tolerated and hampered clinical recovery. Despite the evidence of adequate graft perfusion and initially even measurable levels of cortisol production, persistent adrenal graft function was not obtained, and the patient remained on hormone replacement therapy. Simultaneous pancreas-kidney and adrenal gland transplantation is technically safe, without the need for major surgical modifications or adjustments in immunosuppression. However, it should only be performed in combination with a kidney or pancreas-kidney transplant, which justifies the lifelong immunosuppression. The major challenge remains the postoperative endocrine management, with steroid tapering and adequate assessment of adrenal graft function. Patients should be followed by an interdisciplinary team involving endocrinologists, nephrologists and transplant surgeons.", "keywords": ["Humans", "Kidney Transplantation", "Female", "Pancreas Transplantation", "Middle Aged", "Adrenal Glands", "Diabetes Mellitus, Type 1", "Adrenal Insufficiency", "Hydrocortisone"], "year": "2025", "doi": "10.57187/s.4382"}, {"pmid": "40412070", "title": "Bridging the gap-Rethinking the role of the adrenal gland in chronic kidney disease from the feline perspective.", "abstract": "Chronic kidney disease (CKD) is the most common metabolic disease in domestic cats. Unlike humans and dogs, CKD in cats seems to have a highly complex and multifactorial etiology. Despite great effort being poured into research trying to elucidate possible pathways for the pathogenesis of CKD, there is still a lack of understanding regarding its initiating and progression factors. There is also a lack of therapeutic options for these patients, with most treatment plans relying on a low-phosphate diet, dietary protein modification and medical management of complications (e.g. hypertension) as they arise. In this review, we propose the hypothalamic-pituitary-adrenal (HPA) axis plays a central role in the development, pathophysiology and progression of feline chronic kidney disease. The adrenal glands and the hormones they secrete, in particular, may act as lynchpins in chronic kidney disease, mediating virtually every aspect of the disease: from the establishment of fibrosis and kidney damage to the development of hypertension and a pro-inflammatory status. By compiling the available research regarding the influence of adrenal hormones and the HPA axis, we hope to highlight possible future areas of scientific interest regarding feline CKD as well as possible aspects in which the cat may act as a model for research in human medicine.", "keywords": ["Cats", "Animals", "Cat Diseases", "Renal Insufficiency, Chronic", "Adrenal Glands", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System"], "year": "2025", "doi": "10.1016/j.domaniend.2025.106955"}, {"pmid": "39597857", "title": "Hypothalamic-Pituitary-Adrenal Axis Activity and Metabolic Disorders in Kidney Transplant Recipients on Long-Term Glucocorticoid Therapy.", "abstract": "Background/Objectives: Glucocorticoids are commonly used for maintenance immunosuppressive therapy in kidney transplant recipients (KTRs). We aimed to investigate the prevalence of hypothalamic-pituitary-adrenal (HPA) axis suppression and its association with metabolic disorders in stable KTRs on low-dose glucocorticoids. Methods : This cross-sectional study included adult KTRs on low-dose glucocorticoids. HPA axis suppression was defined as baseline morning cortisol &lt; 5 &#x3bc;g/dL. Adrenocorticotropic hormone (ACTH), dehydroepiandrosterone-sulphate (DHEAS) and 24 h urinary free cortisol (UFC) levels were also assessed. Examined metabolic disorders included hypertension, dyslipidemia, central obesity and post-transplant diabetes mellitus (PTDM). Results : Eighty adult KTRs with a median 57 months (IQR 24-102) since transplantation were included in the study. The mean prednisolone dose was 5.0 &#xb1; 1.3 mg/day. Baseline cortisol &lt; 5.0 &#x3bc;g/dL was observed in 27.5% of the KTRs. Participants with baseline cortisol &lt; 5.0 &#x3bc;g/dL were older (55.1 vs. 47.4 years, p = 0.023) and had had a transplant for a longer time (101.4 vs. 67.0 months, p = 0.043), compared with the rest of the cohort. Baseline cortisol correlated positively with ACTH (rho = 0.544, p &lt; 0.001), DHEAS (rho:0.459, p &lt; 0.001) and UFC (rho: 0.377, p = 0.002). The area under the receiver-operating characteristic curve for ACTH as a predictor of baseline cortisol &gt; 5.0 &#x3bc;g/dL was 0.79 [95% confidence interval (CI): 0.68-0.89]. After adjustment for covariates, HPA axis suppression was not associated with the examined metabolic disorders. Conclusions : Our study showed that stable KTRs on chronic low-dose glucocorticoids exhibited an increased prevalence of HPA axis suppression. ACTH may serve as a surrogate biomarker for HPA axis activity in this population. Further research could evaluate the association of glucocorticoid-induced HPA axis inhibition with metabolic disorders.", "keywords": [], "year": "2024", "doi": "10.3390/jcm13226712"}, {"pmid": "39397979", "title": "Regulation of 11&#x3b2;-HSD1 reductase and the HPA axis by long-snake moxibustion in kidney-yang deficiency rats.", "abstract": "Long-snake moxibustion can improve hypothalamic-pituitary-adrenal (HPA) axis function in patients with kidney-yang deficiency (KYDS). 11&#x3b2;-HSD1 controls the HPA axis by boosting CORT production via reductase activity. However, the interaction and mechanism of long snake moxibustion and 11&#x3b2;-HSD1 remain unknown. This study examined the impact of lengthy snake moxibustion on the hypothalamus-pituitary-adrenal axis in KYDS rats. The potential significance of 11&#x3b2;-HSD1 in this process was explored. Rats were randomly divided into two groups: the blank group and the experimental group. The KYDS model was established with an intramuscular injection of hydrocortisone. Rats were randomly assigned to four groups: model, sham intervention, long snake moxibustion, and long snake moxibustion plus 11&#x3b2;-HSD1 inhibitor. Physical indicators included body weight, toe temperature, rectal temperature, and spontaneous movement. The serum levels of corticotropin-releasing hormone (CRH), adrenocorticotropic hormone (ACTH), and CORT were measured. Immunohistochemical examination reveals 11&#x3b2;-HSD1 protein expression in the liver. Western blotting (WB) detected the levels of 11&#x3b2;-HSD1, H6PDH and NADPH/NADP&#xa0;+&#xa0;protein in the liver. The experimental rats' body weight, toe temperature, rectal temperature, time and frequency of spontaneous activity all dropped, as did their serum ACTH, CORT, and CRH levels. The protein expressions of 11&#x3b2;-HSD1, H6PDH, and NADPH/NADP+ in the liver decreased significantly. Long-snake moxibustion improved HPA axis function in rats, boosting expression of 11&#x3b2;-HSD1, H6PDH, and NADPH/NADP+. Adding an 11&#x3b2;-HSD1 inhibitor to Long-snake moxibustion decreased its effect on the HPA axis. Long-snake moxibustion improves KYDS symptoms in rats by increasing 11&#x3b2;-HSD1 expression and reductase activity, which regulates the HPA axis.", "keywords": [], "year": "2024", "doi": "10.1016/j.heliyon.2024.e38486"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"kidney\"[Title] OR \"renal\"[Title] OR \"nephron\"[Title] OR \"glomerular\"[Title] OR \"tubular\"[Title] OR \"nephrology\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__Liver", "source": "Adrenal Glands", "target": "Liver", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: Cortisol, insulin, glucagon\nNotes: \n- Cortisol lowers insulin production in the pancreas which will in turn lower insulin abundance and lead to less glucose uptake in Muscle. For this reason glucose might get taken up by the liver. \n- Glucagon release by the pancreas is increased by cortisol, leading to gluconeogenesis in the liver and kidney.\nSources:\n- DOI: 10.5772/intechopen.1003161", "connection_type": "Hormonal connection", "key_players": ["Cortisol", "insulin", "glucagon"], "key_players_metabolites": ["Cortisol", "insulin", "glucagon", "glucose", "cholesterol", "glycogen", "amp", "lipoprotein", "hdl", "nadph", "bile acids", "alanine", "amino acid", "amino acids", "fatty acids", "methionine", "atp", "glutamate", "triglycerides", "acetate", "glucose-6-phosphate", "phosphoenolpyruvate", "cholic acid", "isoleucine", "leucine", "ldl", "lactate", "cysteine", "triglyceride", "phospholipid", "serine"], "key_players_hormones": ["Cortisol", "insulin", "glucagon", "corticosterone", "acth", "glucocorticoid", "epinephrine", "crh", "t3", "tnf", "testosterone", "growth hormone", "tnf-alpha", "thyroxine", "norepinephrine", "thyroid hormones", "prolactin", "estradiol", "thyroid hormone", "aldosterone", "tumor necrosis factor", "triiodothyronine", "cck", "noradrenaline", "vitamin d", "fsh", "lh", "ghrelin", "thyrotropin", "somatostatin"], "key_players_proteins": ["Cortisol", "insulin", "glucagon", "acc", "lxr", "pepck", "glucokinase", "akt", "cd36", "mtor", "cpt2"], "key_players_counts_metabolites": {"methionine": 2, "cholesterol": 35, "amp": 11, "glycogen": 35, "phosphoenolpyruvate": 1, "atp": 2, "cholic acid": 1, "bile acids": 5, "hdl": 8, "amino acids": 3, "glucose": 44, "isoleucine": 1, "glutamate": 2, "leucine": 1, "ldl": 1, "lactate": 1, "cysteine": 1, "amino acid": 4, "lipoprotein": 11, "triglycerides": 2, "acetate": 2, "triglyceride": 1, "fatty acids": 3, "phospholipid": 1, "glucose-6-phosphate": 2, "nadph": 7, "serine": 1, "alanine": 5}, "key_players_counts_hormones": {"thyroid hormone": 2, "tnf": 7, "cck": 1, "testosterone": 7, "glucocorticoid": 14, "thyroxine": 4, "crh": 8, "aldosterone": 2, "glucagon": 6, "acth": 22, "norepinephrine": 4, "cortisol": 30, "tnf-alpha": 5, "growth hormone": 7, "thyroid hormones": 4, "noradrenaline": 1, "insulin": 24, "t3": 8, "vitamin d": 1, "fsh": 1, "tumor necrosis factor": 2, "triiodothyronine": 2, "epinephrine": 9, "lh": 1, "corticosterone": 36, "ghrelin": 1, "estradiol": 3, "thyrotropin": 1, "prolactin": 4, "somatostatin": 1}, "key_players_counts_proteins": {"pepck": 1, "glucokinase": 1, "akt": 1, "cd36": 1, "acc": 9, "mtor": 1, "lxr": 9, "cpt2": 1}, "notes": "- Cortisol lowers insulin production in the pancreas which will in turn lower insulin abundance and lead to less glucose uptake in Muscle. For this reason glucose might get taken up by the liver. \n- Glucagon release by the pancreas is increased by cortisol, leading to gluconeogenesis in the liver and kidney.", "sources": ["DOI: 10.5772/intechopen.1003161"], "ai_description": "", "pubmed_n": 123, "pubmed_papers": [{"pmid": "41747667", "title": "Central liver-expressed antimicrobial peptide 2 induces anxiety- and depression-related behaviors and activates the hypothalamic-pituitary-adrenal axis in male mice.", "abstract": "The ghrelinergic system is a key regulator of feeding and metabolism. Beyond this, the ghrelinergic system has been implicated for reward, anxiety and depression. In this regard, the effects of the endogenous ghrelin receptor inverse agonist liver-expressed antimicrobial peptide (LEAP) 2 on mental health parameters are unknown. In the present study, the aim was to delineate LEAP2's central effects on anxiety- and depressive-like behaviors in mice, as well as downstream central monoaminergic signaling and HPA-axis activation. Acute intracerebroventricular administration was used to evaluate the effect of central LEAP2. The anxiogenic and depressive-like effects were measured through open-field test, elevated plus maze and forced swim test. Corticosterone and monoamine levels were measured in ex vivo blood and brain tissues, respectively. Acute central administration of LEAP2 increased anxiety-like behavior in both open-field test and elevated plus maze, and increased immobility time in forced swim test, compared to vehicle. Further, LEAP2 administration was associated with a marked increase in blood corticosterone, elevated dopamine in the bed nucleus of the stria terminalis and a trend to increased serotonin in the nucleus accumbens, ventral tegmental area and hypothalamus. These results highlight the influence of the ghrelinergic system on central signaling and mental health, in particular where LEAP2 is elevated or dysregulated, for example in obesity and anorexia nervosa which are often associated with anxiety and depression. Here, LEAP2 emerges as a potential target to treat depression and anxiety in eating disorders.", "keywords": ["Animals", "Male", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System", "Anxiety", "Depression", "Mice", "Corticosterone", "Behavior, Animal", "Antimicrobial Peptides", "Antimicrobial Cationic Peptides"], "year": "2026", "doi": "10.1016/j.yhbeh.2026.105905"}, {"pmid": "41533055", "title": "Acute Stress Attenuates Hepatic Ischemia-Reperfusion Injury via Hypothalamic CRH Neuron-Induced HPA Axis Activation.", "abstract": "Hepatic ischemia-reperfusion injury (HIRI) is a pathologic process commonly encountered during liver surgery, which seriously threatens patient prognosis. Currently, effective interventions or preventive measures are still lacking. Notably, patients with liver disease commonly experience brief acute stress prior to surgery; however, the impact of acute stress on HIRI remains unclear. A 30-min restraint stress was used to simulate acute restraint stress (ARS). Hematoxylin-eosin staining and ELISA were employed to assess HIRI. Immunofluorescence staining and electrophysiology were applied to evaluate neuronal activation. Chemogenetic manipulation was utilized to verify the role of corticotropin-releasing hormone (CRH) neurons in the hypothalamic paraventricular nucleus (PVN) in ARS-mediated attenuation of HIRI. The results showed that ARS significantly ameliorated liver injury, reduced the liver enzyme levels (ALT and AST), and down-regulated the inflammatory factors expression in HIRI mice. Furthermore, we found that ARS alleviated HIRI by activating the hypothalamic-pituitary-adrenal (HPA) axis to release corticosterone, rather than through the sympathetic nervous system. PVN CRH represented a critical subpopulation responding to ARS. Chemogenetic activation of PVN CRH neurons mimicked the protective effect of ARS against HIRI, whereas chemogenetic inhibition of these neurons abolished this protection. Our findings demonstrate that PVN CRH neurons mediate the protective effect of ARS against HIRI by activating the HPA axis to release corticosterone. This work may provide key insights for developing perioperative strategies to prevent HIRI.", "keywords": ["Animals", "Reperfusion Injury", "Male", "Hypothalamo-Hypophyseal System", "Neurons", "Corticotropin-Releasing Hormone", "Pituitary-Adrenal System", "Mice", "Paraventricular Hypothalamic Nucleus", "Liver", "Mice, Inbred C57BL", "Stress, Psychological", "Restraint, Physical", "Corticosterone"], "year": "2026", "doi": "10.1002/cns.70749"}, {"pmid": "38936893", "title": "Depression Exacerbates Hepatic Steatosis in C57BL/6J Mice by Activating the Hypothalamic-Pituitary-Adrenal Axis.", "abstract": "Depression is associated with metabolic disorders, including non-alcoholic fatty liver disease (NAFLD). However, the mechanisms underlying the interaction between them are still poorly known. In this study, mice on a choline deficiency, L-amino acid-defined, high-fat diet (CDAHFD) developing steatosis were challenged with chronic restraint stress (CRS), a protocol widely used to induce depression. The development of depression and steatosis was evaluated using histopathology analysis, ELISA, q-PCR and Western Blot. The contribution of the activated HPA axis to hepatic steatosis progress was fully established, which was validated using a hepatocyte model. Histopathological and biochemical analysis indicated that steatosis was exacerbated by CRS challenge, and behavioral tests indicated that the mice developed depression. Among the screened endocrinal pathways, the hypothalamic-pituitary-adrenal (HPA) axis was significantly activated and the synergistic effect of CDAHFD and CRS in activating the HPA axis was observed. In the hypothalamus, expression of corticotropin-releasing hormone (CRH) was increased by 86% and the protein levels of hypothalamic CRH were upregulated by 25% to 33% by CRS treatment. Plasma CRH levels were elevated by 45-56% and plasma adrenocorticotropic hormone (ACTH) levels were elevated by 29-58% by CRS treatment. In the liver, target genes of the HPA axis were activated, accompanied by disruption of the lipid metabolism and progression of steatohepatitis. The lipid metabolism in the Hepa1-6 cell line treated with endogenous corticosterone (CORT) was in accordance with the aforementioned in vivo responses. Depression aggravated hepatic steatosis in CDAHFD-fed mice by activating the HPA axis. The risk of NAFLD development should be fully considered in depressive patients and improvement of psychotic disorders could be an etiological treatment strategy for them.", "keywords": ["Animals", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System", "Mice", "Depression", "Disease Models, Animal", "Non-alcoholic Fatty Liver Disease", "Male", "Mice, Inbred C57BL", "Corticotropin-Releasing Hormone", "Diet, High-Fat", "Adrenocorticotropic Hormone", "Liver", "Fatty Liver", "Corticosterone"], "year": "2024", "doi": "10.21873/invivo.13618"}, {"pmid": "37234368", "title": "Corrigendum: Loss of hepatic Surf4 depletes lipid droplets in the adrenal cortex but does not impair adrenal hormone production.", "abstract": "[This corrects the article DOI: 10.3389/fcvm.2021.764024.].", "keywords": [], "year": "2023", "doi": "10.3389/fcvm.2023.1215335"}, {"pmid": "35277933", "title": "Hypothalamic-pituitary-adrenal axis activation and glucocorticoid-responsive gene expression in skeletal muscle and liver of Apc mice.", "abstract": "Cancer patients at advanced stages experience a severe depletion of skeletal muscle compartment together with a decrease in muscle function, known as cancer cachexia. Cachexia contributes to reducing quality of life, treatment efficiency, and lifespan of cancer patients. However, the systemic nature of the syndrome is poorly documented. Here, we hypothesize that glucocorticoids would be important systemic mediators of cancer cachexia. To explore the role of glucocorticoids during cancer cachexia, biomolecular analyses were performed on several tissues (adrenal glands, blood, hypothalamus, liver, and skeletal muscle) collected from Apc Min/+ male mice, a mouse model of intestine and colon cancer, aged of 13 and 23&#xa0;weeks, and compared with wild type age-matched C57BL/6J littermates. Twenty-three-week-old Apc mice recapitulated important features of cancer cachexia including body weight loss (-16%, P&#xa0;&lt;&#xa0;0.0001), muscle atrophy (gastrocnemius muscle: -53%, P&#xa0;&lt;&#xa0;0.0001), and weakness (-50% in tibialis anterior muscle force, P&#xa0;&lt;&#xa0;0.0001), increased expression of atrogens (7-fold increase in MuRF1 transcript level, P&#xa0;&lt;&#xa0;0.0001) and down-regulation of Akt-mTOR pathway (3.3-fold increase in 4EBP1 protein content, P&#xa0;&lt;&#xa0;0.0001), together with a marked transcriptional rewiring of hepatic metabolism toward an increased expression of gluconeogenic genes (Pcx: +90%, Pck1: +85%), and decreased expression of glycolytic (Slc2a2: -40%, Gk: -30%, Pklr: -60%), ketogenic (Hmgcs2: -55%, Bdh1: -80%), lipolytic/fatty oxidation (Lipe: -50%, Mgll: -60%, Cpt2: -60%, Hadh: -30%), and lipogenic (Acly: -30%, Acacb: -70%, Fasn: -45%) genes. The hypothalamic pituitary-adrenal axis was activated, as evidenced by the increase in the transcript levels of genes encoding corticotropin-releasing hormone in the hypothalamus (2-fold increase, P&#xa0;&lt;&#xa0;0.01), adrenocorticotropic hormone receptor (3.4-fold increase, P&#xa0;&lt;&#xa0;0.001), and steroid biosynthesis enzymes (Cyp21a1, P&#xa0;&lt;&#xa0;0.0001, and Cyp11b1, P&#xa0;&lt;&#xa0;0.01) in the adrenal glands, as well as by the increase in corticosterone level in the serum (+73%, P&#xa0;&lt;&#xa0;0.05), skeletal muscle (+17%, P&#xa0;&lt;&#xa0;0.001), and liver (+24%, P&#xa0;&lt;&#xa0;0.05) of cachectic 23-week-old Apc mice. A comparative transcriptional analysis with dexamethasone-treated C57BL/6J mice indicated that the activation of the hypothalamic-pituitary-adrenal axis in 23-week-old Apc Min/+ mice was significantly associated with the transcription of glucocorticoid-responsive genes in skeletal muscle (P&#xa0;&lt;&#xa0;0.05) and liver (P&#xa0;&lt;&#xa0;0.001). The transcriptional regulation of glucocorticoid-responsive genes was also observed in the gastrocnemius muscle of Lewis lung carcinoma tumour-bearing mice and in KPC mice (tibialis anterior muscle and liver). These findings highlight the role of the hypothalamic-pituitary-adrenal-glucocorticoid pathway in the transcriptional regulation of skeletal muscle catabolism and hepatic metabolism during cancer cachexia. They also provide the paradigm for the design of new therapeutic strategies.", "keywords": ["Aged", "Animals", "Cachexia", "Carcinoma, Lewis Lung", "Gene Expression", "Glucocorticoids", "Humans", "Hypothalamo-Hypophyseal System", "Liver", "Male", "Mice", "Mice, Inbred C57BL", "Muscle, Skeletal", "Pituitary-Adrenal System", "Quality of Life"], "year": "2022", "doi": "10.1002/jcsm.12939"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"liver\"[Title] OR \"hepatic\"[Title] OR \"hepatocyte\"[Title] OR \"hepatocellular\"[Title] OR \"nonalcoholic fatty liver\"[Title] OR \"NAFLD\"[Title] OR \"NASH\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__Muscle", "source": "Adrenal Glands", "target": "Muscle", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: Cortisol, insulin\nNotes: Cortisol lowers insulin production in the pancreas which will in turn lower insulin abundance and lead to less glucose uptake in Muscle.\nSources:\n- DOI: 10.5772/intechopen.1003161", "connection_type": "Hormonal connection", "key_players": ["Cortisol", "insulin"], "key_players_metabolites": ["Cortisol", "insulin", "glucose", "cholesterol", "glycogen", "lipoprotein", "succinate", "acetate"], "key_players_hormones": ["Cortisol", "insulin", "acth", "testosterone", "aldosterone", "dhea", "glucocorticoid", "corticosterone", "thyroxine", "angiotensin", "crh", "angiotensin ii", "thyroid hormones", "tumor necrosis factor", "progesterone", "interleukin-1", "estradiol", "glucagon", "norepinephrine", "growth hormone", "il6", "renin", "noradrenaline", "androstenedione", "adiponectin", "adrenaline", "epinephrine"], "key_players_proteins": ["Cortisol", "insulin", "glut4", "mtor", "akt", "cpt2"], "key_players_counts_metabolites": {"cholesterol": 3, "glycogen": 2, "glucose": 10, "lipoprotein": 2, "acetate": 1, "succinate": 2}, "key_players_counts_hormones": {"progesterone": 2, "dhea": 7, "testosterone": 9, "glucocorticoid": 7, "thyroxine": 4, "crh": 3, "interleukin-1": 2, "aldosterone": 9, "glucagon": 1, "acth": 15, "angiotensin ii": 3, "norepinephrine": 1, "cortisol": 2, "growth hormone": 1, "thyroid hormones": 3, "il6": 1, "renin": 1, "noradrenaline": 1, "androstenedione": 1, "adiponectin": 1, "insulin": 5, "adrenaline": 1, "tumor necrosis factor": 3, "epinephrine": 1, "corticosterone": 5, "estradiol": 2, "angiotensin": 4}, "key_players_counts_proteins": {"glut4": 4, "akt": 1, "mtor": 2, "cpt2": 1}, "notes": "Cortisol lowers insulin production in the pancreas which will in turn lower insulin abundance and lead to less glucose uptake in Muscle.", "sources": ["DOI: 10.5772/intechopen.1003161"], "ai_description": "", "pubmed_n": 25, "pubmed_papers": [{"pmid": "42264997", "title": "Stress and the interaction of the hypothalamic-pituitary-adrenal axis with other pituitary axes and its consequences on muscle mass.", "abstract": "In this manuscript, the relation of the hypothalamic-pituitary-adrenal axis to energy handling, thyroid function, gonadal and growth hormones are discussed against the background of stress. Clinical data from the SHIP-PAGE (steroid hormones in patients with pituitary, adrenal and gonadal endocrinopathies) study are provided to show that the HPA axis is sensitive to glucose and interferes with the activities of other pituitary axes. While chronic stress leads to central hypogonadism and a loss in muscle mass, high glucose loads hamper the plasticities of the HPA, the hypothalamic-pituitary-gonadal as well as the hypothalamic-pituitary-growth hormone axes but elevate insulin concentrations. Therefore, prevention programs ideally include strategies to reduce stress and promote muscle activity.", "keywords": [], "year": "2026", "doi": "10.1016/j.beem.2026.102131"}, {"pmid": "36735924", "title": "Effects of testis testosterone deficiency on gene expression in the adrenal gland and skeletal muscle of ducks.", "abstract": "1. Testosterone has an anabolic effect on skeletal muscle. The testes produce most of the testosterone in vivo , while the adrenal glands contribute smaller amounts. When testis testosterone is deficient the adrenal gland increases steroid hormone synthesis, which is referred to as compensatory testicular adaptation (CTA).2. To reveal the effects of testis testosterone deficiency on adrenal steroid hormones synthesis and skeletal muscle development, gene expression related to adrenal steroid hormones synthesis and skeletal muscle development were determined by RNA-seq.3. The results showed that castrating male ducks had significant effects on their body weight but no significant impact on cross-sectional area (CSA) or density of pectoral muscle fibres. In skeletal muscle protein metabolism, expression levels of the catabolic gene atrogin1/MAFbx and the anabolic gene eEF2 were significantly higher, with concomitant increases after castration. The adrenal glands' alteration of the steroid hormone 11&#x3b2;-hydroxylase (CYP11B1) was significantly lower following castration.4. Expression pattern analysis showed that the adrenal glands' glucocorticoid receptor (NR3C1/GR) had a potential regulatory relationship with the skeletal muscle-related genes ( Pax7, mTOR, FBXO32, FOXO3 , and FOXO4 ).5. The data showed that castration affected muscle protein metabolism, adrenal steroid and testosterone synthesis. In addition, it was speculated that, after castration, steroid hormones produced by the adrenal gland could have a compensatory effect, which might mediate the changes in skeletal muscle protein metabolism and development.", "keywords": ["Male", "Animals", "Testis", "Ducks", "Chickens", "Testosterone", "Adrenal Glands", "Muscle, Skeletal", "Steroids", "Gene Expression"], "year": "2023", "doi": "10.1080/00071668.2023.2176741"}, {"pmid": "35277933", "title": "Hypothalamic-pituitary-adrenal axis activation and glucocorticoid-responsive gene expression in skeletal muscle and liver of Apc mice.", "abstract": "Cancer patients at advanced stages experience a severe depletion of skeletal muscle compartment together with a decrease in muscle function, known as cancer cachexia. Cachexia contributes to reducing quality of life, treatment efficiency, and lifespan of cancer patients. However, the systemic nature of the syndrome is poorly documented. Here, we hypothesize that glucocorticoids would be important systemic mediators of cancer cachexia. To explore the role of glucocorticoids during cancer cachexia, biomolecular analyses were performed on several tissues (adrenal glands, blood, hypothalamus, liver, and skeletal muscle) collected from Apc Min/+ male mice, a mouse model of intestine and colon cancer, aged of 13 and 23&#xa0;weeks, and compared with wild type age-matched C57BL/6J littermates. Twenty-three-week-old Apc mice recapitulated important features of cancer cachexia including body weight loss (-16%, P&#xa0;&lt;&#xa0;0.0001), muscle atrophy (gastrocnemius muscle: -53%, P&#xa0;&lt;&#xa0;0.0001), and weakness (-50% in tibialis anterior muscle force, P&#xa0;&lt;&#xa0;0.0001), increased expression of atrogens (7-fold increase in MuRF1 transcript level, P&#xa0;&lt;&#xa0;0.0001) and down-regulation of Akt-mTOR pathway (3.3-fold increase in 4EBP1 protein content, P&#xa0;&lt;&#xa0;0.0001), together with a marked transcriptional rewiring of hepatic metabolism toward an increased expression of gluconeogenic genes (Pcx: +90%, Pck1: +85%), and decreased expression of glycolytic (Slc2a2: -40%, Gk: -30%, Pklr: -60%), ketogenic (Hmgcs2: -55%, Bdh1: -80%), lipolytic/fatty oxidation (Lipe: -50%, Mgll: -60%, Cpt2: -60%, Hadh: -30%), and lipogenic (Acly: -30%, Acacb: -70%, Fasn: -45%) genes. The hypothalamic pituitary-adrenal axis was activated, as evidenced by the increase in the transcript levels of genes encoding corticotropin-releasing hormone in the hypothalamus (2-fold increase, P&#xa0;&lt;&#xa0;0.01), adrenocorticotropic hormone receptor (3.4-fold increase, P&#xa0;&lt;&#xa0;0.001), and steroid biosynthesis enzymes (Cyp21a1, P&#xa0;&lt;&#xa0;0.0001, and Cyp11b1, P&#xa0;&lt;&#xa0;0.01) in the adrenal glands, as well as by the increase in corticosterone level in the serum (+73%, P&#xa0;&lt;&#xa0;0.05), skeletal muscle (+17%, P&#xa0;&lt;&#xa0;0.001), and liver (+24%, P&#xa0;&lt;&#xa0;0.05) of cachectic 23-week-old Apc mice. A comparative transcriptional analysis with dexamethasone-treated C57BL/6J mice indicated that the activation of the hypothalamic-pituitary-adrenal axis in 23-week-old Apc Min/+ mice was significantly associated with the transcription of glucocorticoid-responsive genes in skeletal muscle (P&#xa0;&lt;&#xa0;0.05) and liver (P&#xa0;&lt;&#xa0;0.001). The transcriptional regulation of glucocorticoid-responsive genes was also observed in the gastrocnemius muscle of Lewis lung carcinoma tumour-bearing mice and in KPC mice (tibialis anterior muscle and liver). These findings highlight the role of the hypothalamic-pituitary-adrenal-glucocorticoid pathway in the transcriptional regulation of skeletal muscle catabolism and hepatic metabolism during cancer cachexia. They also provide the paradigm for the design of new therapeutic strategies.", "keywords": ["Aged", "Animals", "Cachexia", "Carcinoma, Lewis Lung", "Gene Expression", "Glucocorticoids", "Humans", "Hypothalamo-Hypophyseal System", "Liver", "Male", "Mice", "Mice, Inbred C57BL", "Muscle, Skeletal", "Pituitary-Adrenal System", "Quality of Life"], "year": "2022", "doi": "10.1002/jcsm.12939"}, {"pmid": "31564939", "title": "Effect of berberine on the HPA-axis pathway and skeletal muscle GLUT4 in type 2 diabetes mellitus rats.", "abstract": "Activation of the hypothalamus-pituitary-adrenal (HPA) axis pathway is closely related to insulin resistance (IR), glucose, and lipid metabolism disorders in type 2 diabetes mellitus (T2DM). Berberine (BBR) has effect on regulating disorder of glucose and lipid metabolism in T2DM. In fact, activation of the HPA axis pathway is closely related to IR, glucose, and lipid metabolism disorders in T2DM. Here, we investigated whether the therapeutic effect of BBR on T2DM rats is acted through the HPA axis pathway. In this research, we investigated the effects of BBR on the HPA-axis pathway-related indicators and expression of skeletal muscle glucose transporter 4 (GLUT4) in the high-fat diet and streptozotocin-induced T2DM rats, and identify its possible mechanism of improving IR in T2DM. BBR significantly reduced fasting blood glucose, total cholesterol, and low-density lipoprotein cholesterol in model rats. It also improved the abnormalities of the high-de
