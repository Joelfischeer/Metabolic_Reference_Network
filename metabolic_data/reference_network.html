scription": "The adrenal glands and pancreas communicate through hormonal signals to regulate metabolic homeostasis. The adrenal glands produce cortisol, which stimulates the pancreas to release glucagon, a hormone that raises blood glucose levels [1]. In response, the pancreas releases insulin in an attempt to lower blood glucose, but chronic hypercortisolemia can lead to pancreatic fat deposition and impaired insulin secretion, contributing to type 2 diabetes [1]. The interplay between cortisol and insulin also affects kidney function, with cortisol promoting sodium retention and insulin reducing it, highlighting the complex endocrine axis between these organs [2].", "pubmed_n": 34, "pubmed_papers": [{"pmid": "41965599", "title": "Pancreatic fat deposition as a mediator of adrenal gland volume and type 2 diabetes: evidence from MRI.", "abstract": "PURPOSE: To assess the role of body composition mediating the association between MRI-quantified adrenal gland volume (AGV) and type 2 diabetes mellitus (T2DM) and to clarify the underlying mechanisms involved. METHODS: This retrospective study analyzed 239 hospitalized patients (54 T2DM, 185 non-T2DM) with abdominal MRI. AGV was manually segmented on T1-weighted images. Body composition parameters, including subcutaneous adipose tissue (SAT) area and fat fraction (FF), visceral adipose tissue (VAT) area and FF, hepatic FF (HFF), pancreatic FF (PFF), and abdominal muscle (AM) area and FF, were quantified using MRI fat fraction mapping. RESULTS: After adjusting for age, sex, hypertension, and BMI, mediation analysis showed that PFF partially mediated the association between AGV and T2DM (OR&#x2009;=&#x2009;1.036, 95% CI: 1.009&#x2013;1.101), accounting for 8.7% of the total effect. Multivariate analysis identified both AGV (OR: 1.475, 95% CI: 1.235&#x2013;1.762) and PFF (OR: 1.069, 95% CI: 1.023&#x2013;1.116) as independent factors associated with T2DM. ROC analysis showed AUCs of 0.792 for AGV and 0.803 for PFF in differentiating T2DM. The combined AGV&#x2009;+&#x2009;PFF model achieved an AUC of 0.836 (95% CI: 0.779&#x2013;0.894). CONCLUSION: MRI-quantified AGV and PFF demonstrate potential as biomarkers for T2DM. Pancreatic fat deposition partially mediates the link between adrenal enlargement and T2DM, suggesting a novel pathway involving HPA axis dysregulation and ectopic fat deposition.", "keywords": [], "year": "2026", "doi": "10.1186/s12880-026-02184-8"}, {"pmid": "41085519", "title": "Simultaneous adrenal gland and pancreas-kidney transplantation and associated hormonal challenges.", "abstract": "Adrenal gland transplantation has only been performed in rare cases, with variable results in terms of functional activity. Consequently, there is a lack of evidence in endocrine management and tapering hormone replacement therapy after such transplantations. We report on a simultaneous pancreas-kidney and adrenal gland allotransplantation in a 48-year-old female patient with type 1 diabetes and severe autoimmune adrenal insufficiency. Surgery was uneventful, without major surgical morbidity. Pancreas and kidney graft function were excellent from the beginning. Adrenal graft function was difficult to assess and steroid tapering was not well tolerated and hampered clinical recovery. Despite the evidence of adequate graft perfusion and initially even measurable levels of cortisol production, persistent adrenal graft function was not obtained, and the patient remained on hormone replacement therapy. Simultaneous pancreas-kidney and adrenal gland transplantation is technically safe, without the need for major surgical modifications or adjustments in immunosuppression. However, it should only be performed in combination with a kidney or pancreas-kidney transplant, which justifies the lifelong immunosuppression. The major challenge remains the postoperative endocrine management, with steroid tapering and adequate assessment of adrenal graft function. Patients should be followed by an interdisciplinary team involving endocrinologists, nephrologists and transplant surgeons.", "keywords": ["Humans", "Kidney Transplantation", "Female", "Pancreas Transplantation", "Middle Aged", "Adrenal Glands", "Diabetes Mellitus, Type 1", "Adrenal Insufficiency", "Hydrocortisone"], "year": "2025", "doi": "10.57187/s.4382"}, {"pmid": "38972929", "title": "Robotic Left Pancreatectomy with Perirenal Tissue Excision and Left Adrenalectomy (Posterior Ramps) for Pancreatic Ductal Adenocarcinoma Abutting the Adrenal Gland.", "abstract": "Radical antegrade modular pancreato-splenectomy (RAMPS) has been largely described in left-sided pancreatic cancers.1.J Hepato-Biliary-Pancreat Sci 29:1156-1165 Its prognostic advantage is not clear, although a theoretical improvement in R0 resection rate has been shown.2.J Am Coll Surg 204:244-249 Furthermore, RAMPS is usually carried out without adrenal gland removal, the so-called anterior RAMPS, while extending the resection to the adrenal plane could impair perioperative outcomes.3.HPB 25:311-319 METHODS: A 40&#xa0;mm pancreatic ductal adenocarcinoma (PDAC) was found in a 70-year-old patient. Tumor infiltrates the adrenal gland and a robotic posterior RAMPS was indicated. After sectioning the splenic vessels and the pancreatic neck, the dissection was directed vertically in a sagittal plane along the left border of the superior mesenteric artery to identify the left renal vein. Our dissection plane was then directed on a caudo-cranial axis, after identification of the left renal artery and below the adrenal gland. The resection was also delimitated medially by the left borders of the superior mesenteric artery and the aorta, and posteriorly by the renal parenchyma. Postoperative course was marked by a biochemical leak. The patient was discharged on postoperative day (POD)&#xa0;5 and the drain removed at POD&#xa0;18. Pathological examination confirmed a pT2N2 PDAC with negative margins, with 4/18 positive nodes. The robotic platform is routinely employed in pancreatic surgery. Thanks to its increased degree of movement, its dexterity, and the magnification, this approach can help surgeons with vascular identification and control, in performing extended lymphadenectomies, and finding the correct planes of dissection. All these elements are crucial in a well-performed posterior RAMPS.", "keywords": ["Aged", "Humans", "Adrenal Gland Neoplasms", "Adrenal Glands", "Adrenalectomy", "Carcinoma, Pancreatic Ductal", "Pancreatectomy", "Pancreatic Neoplasms", "Prognosis", "Robotic Surgical Procedures", "Splenectomy"], "year": "2024", "doi": "10.1245/s10434-024-15414-6"}, {"pmid": "38721167", "title": "A Case Report of Bilateral Adrenal Gland Stereotactic Body Radiotherapy to Manage Hypercortisolemia in a Patient With Ectopic Adrenocorticotropic Hormone (ACTH) Production From a Metastatic Pancreatic Neuroendocrine Tumor.", "abstract": "A 63-year-old woman presented with hypokalemia, hypertension, weight gain, limb edema, and tremors. She was diagnosed with Cushing syndrome, with a 24-hour urine cortisol level of 41,013 nmol/day. Investigations revealed a grade 2 pancreatic neuroendocrine tumor with extensive hepatic metastases. Owing to excessive adrenocorticotropic hormone production from her disease, her hypercortisolemia and Cushing symptoms worsened despite ketoconazole, somatostatin analogs, and right liver lobe chemoembolization. Stereotactic body radiotherapy (SBRT) at a dose of 39 Gy in three fractions was administered to her bilateral adrenal glands in the hope of reducing her cortisol levels and improving her symptoms. Her 24-hour urine cortisol levels decreased following SBRT, but not rapidly enough; her clinical condition continued to deteriorate, and she died 21 days after treatment. SBRT was not effective as an urgent intervention in this setting; a greater latency to realize a response is likely necessary.", "keywords": [], "year": "2024", "doi": "10.7759/cureus.57852"}, {"pmid": "38471570", "title": "The Adrenal Gland and Pancreatic Islets - A Beneficial Endocrine Alliance.", "abstract": "Intraportal islet transplantation in patients with type 1 diabetes enables restoration of glucose-regulated insulin secretion. However, several factors hamper a widespread application and long-term success: chronic hypoxia, an inappropriate microenvironment and suppression of regenerative and proliferative potential by high local levels of immunosuppressive agents. Therefore, the identification of alternative and superior transplant sites is of major scientific and clinical interest. Here, we aim to evaluate the adrenal as an alternative transplantation site. The adrenal features a particular microenvironment with extensive vascularization, anti-apoptotic and pro-proliferative, anti-inflammatory and immunosuppressive effects. To validate this novel transplantation site, an in vitro co-culture system of adrenal cells and pancreatic islets was established and viability, islet survival, functional potency and antioxidative defense capacity were evaluated. For in vivo validation, an immune-deficient diabetic mouse model for intra-adrenal islet transplantation was applied. The functional capacity of intra-adrenally grafted islets to reverse diabetes was compared to a standard islet transplant model and measures of engraftment such as vascular integration were evaluated. The presence of adrenal cells positively impacted on cell metabolism and oxidative stress. Following transplantation, we could demonstrate enhanced islet function in comparison to standard models with improved engraftment and superior re-vascularization. This experimental approach allows for novel insights into the interaction of endocrine systems and may open up novel strategies for islet transplantation augmented through the bystander effect of other endocrine cells or the active factors secreted by adrenal cells modulating the microenvironment.", "keywords": ["Mice", "Animals", "Humans", "Islets of Langerhans", "Islets of Langerhans Transplantation", "Diabetes Mellitus, Type 1", "Adrenal Glands", "Insulin Secretion"], "year": "2024", "doi": "10.1055/a-2256-6344"}, {"pmid": "32231811", "title": "An Adrenocortical Carcinoma Associated with Non-Islet Cell Tumor Hypoglycemia and Aberrant ACTH Production.", "abstract": "Introduction . Adrenocortical carcinomas (ACCs) are infrequently reported to present with severe hypoglycemia syndrome resulting from the secretion of insulin-like growth factor II (IGF-II) by tumor cells. Adrenocorticotropic hormone- (ACTH) independent hypercortisolism is the norm of hormonally active ACCs, but aberrant ACTH production by tumor cells can theoretically cause ACTH-dependent hypercortisolism. The purpose of this report was to present a case of an ACC manifested with the co-occurrence of two extremely rare presentations. Case Description . We present a rare case of a 43-year-old male patient admitted with recurrent episodes of severe non-ketotic and non-insulin-mediated hypoglycemia due to IGF-II&#x2009;mediated disease and ACTH-dependent Cushing's syndrome. He was diagnosed with a diffusely disseminated adrenocortical carcinoma with immunohistochemistry of tumor cells showing focal ACTH immunostain positivity. Conclusion . Non-islet cell tumor hypoglycemia and ACTH-dependent Cushing's syndrome are extremely rare presentations of an ACC, and co-occurrence of these entities in a single patient is never reported in the literature.", "keywords": [], "year": "2020", "doi": "10.1155/2020/2025631"}, {"pmid": "28670537", "title": "The Serological and Biochemical Markers of Adrenal Cortex and Endocrine Pancreas Dysfunction in Patients with Hashimoto's Thyroiditis: A Hospital-based Pilot Study.", "abstract": "The prevalence of both islet cell and adrenal autoimmunity among Asian Indian hypothyroidism patients with Hashimoto's thyroiditis (HT) is lacking in literature. The objective of this study was to assess the proportion of Addison's disease (AD) and type 1 diabetes mellitus (T1DM) in patients with HT. The patients with hypothyroidism due to HT were included in this study over 2 years. Primary hypothyroidism was defined as high serum thyroid-stimulating hormone (&gt;5.5 mIU/L) with or without low thyroxine level. HT was defined by the presence of high thyroid peroxidase antibody (Ab) titer (&gt;35 IU/ml). Autoimmune markers of AD and T1DM, i.e., adrenal (21-hydroxylase) Ab, glutamic acid decarboxylase (GAD) Ab, and insulinoma-associated antigen-2 (IA-2) Ab were measured among them. In addition, 250 &#x3bc;g adrenocorticotropic hormone (ACTH) stimulation test was done in patients with adrenal Ab. Similarly, beta cell function was assessed in patients with GAD and/or IA-2 Ab. Out of 150 patients screened, 136 patients were included in this study. Seven patients had adrenal Ab while 15 had IA-2 Ab. The GAD Ab was not present in any of the patients in the study. ACTH stimulation test was done in four of seven patients with adrenal Ab and beta cell function was assessed in 8 of 15 patients with islet cell Ab. All patients with adrenal Ab had normal adrenal function and 1 out of 15 with IA-2 Ab developed diabetes mellitus during follow-up. Either adrenal or islet cell Ab was found in 16% Asian Indian hypothyroidism patients with HT.", "keywords": [], "year": "2017", "doi": "10.4103/ijem.IJEM_72_17"}, {"pmid": "27113853", "title": "HPA axis and vagus nervous function are involved in impaired insulin secretion of MSG-obese rats.", "abstract": "Neuroendocrine dysfunctions such as the hyperactivity of the vagus nerve and hypothalamus-pituitary-adrenal (HPA) axis greatly contribute to obesity and hyperinsulinemia; however, little is known about these dysfunctions in the pancreatic &#x3b2;-cells of obese individuals. We used a hypothalamic-obesity model obtained by neonatal treatment with monosodium l-glutamate (MSG) to induce obesity. To assess the role of the HPA axis and vagal tonus in the genesis of hypercorticosteronemia and hyperinsulinemia in an adult MSG-obese rat model, bilateral adrenalectomy (ADX) and subdiaphragmatic vagotomy (VAG) alone or combined surgeries (ADX-VAG) were performed. To study glucose-induced insulin secretion (GIIS) and the cholinergic insulinotropic process, pancreatic islets were incubated with different glucose concentrations with or without oxotremorine-M, a selective agonist of the M3 muscarinic acetylcholine receptor (M3AChR) subtype. Protein expression of M3AChR in pancreatic islets, corticosteronemia, and vagus nerve activity was also evaluated. Surgeries reduced 80% of the body weight gain. Fasting glucose and insulin were reduced both by ADX and ADX-VAG, whereas VAG was only associated with hyperglycemia. The serum insulin post-glucose stimulation was lower in all animals that underwent an operation. Vagal activity was decreased by 50% in ADX rats. In the highest glucose concentration, both surgeries reduced GIIS by 50%, whereas ADX-VAG decreased by 70%. Additionally, M3AChR activity was recovered by the individual surgeries. M3AChR protein expression was reduced by ADX. Both the adrenal gland and vagus nerve contribute to the hyperinsulinemia in the MSG model, although adrenal is more crucial as it appears to modulate parasympathetic activity and M3AChR expression in obesity.", "keywords": ["Animals", "Glucose", "Hypothalamo-Hypophyseal System", "Insulin", "Insulin Secretion", "Islets of Langerhans", "Male", "Obesity", "Pituitary-Adrenal System", "Rats", "Rats, Wistar", "Sodium Glutamate", "Vagus Nerve"], "year": "2016", "doi": "10.1530/JOE-15-0467"}, {"pmid": "25140390", "title": "Irradiation with X-rays phase-advances the molecular clockwork in liver, adrenal gland and pancreas.", "abstract": "The circadian clock of man and mammals shows a hierarchic organization. The master clock, located in the suprachiasmatic nuclei (SCN), controls peripheral oscillators distributed throughout the body. Rhythm generation depends on molecular clockworks based on transcriptional/translational interaction of clock genes. Numerous studies have shown that the clockwork in peripheral oscillators is capable to maintain circadian rhythms for several cycles in vitro, i.e. in the absence of signals from the SCN. The aim of the present study is to analyze the effects of irradiation with X-rays on the clockwork of liver, adrenal and pancreas. To this end organotypic slice cultures of liver (OLSC) and organotypic explant cultures of adrenal glands (OAEC) and pancreas (OPEC) were prepared from transgenic mPer2(luc) mice which express luciferase under the control of the promoter of an important clock gene, Per2, and allow to study the dynamics of the molecular clockwork by bioluminometry. The preparations were cultured in a membrane-based liquid-air interface culturing system and irradiated with X-rays at doses of 10&#x2009;Gy and 50&#x2009;Gy or left untreated. Bioluminometric real-time recordings show a stable oscillation of all OLSC, OAEC and OPEC for up to 12 days in vitro. Oscillations persist after irradiation with X-rays. However, a dose of 50&#x2009;Gy caused a phase advance in the rhythm of the OLSC by 5&#x2009;h, in the OPEC by 7&#x2009;h and in the OAEC by 6&#x2009;h. Our study shows that X-rays affect the molecular clockwork in liver, pancreas and adrenal leading to phase advances. Our results confirm and extend previous studies showing a phase-advancing effect of X-rays at the level of the whole animal and single cells.", "keywords": ["Adrenal Glands", "Animals", "Circadian Clocks", "Gene Expression Regulation", "Genes, Reporter", "Liver", "Mice, Inbred C57BL", "Mice, Transgenic", "Pancreas", "Period Circadian Proteins", "Photoperiod", "Promoter Regions, Genetic", "Radiation Dosage", "Time Factors", "Tissue Culture Techniques", "X-Rays"], "year": "2015", "doi": "10.3109/07420528.2014.949735"}, {"pmid": "23345449", "title": "Transplantation of pancreatic islets to adrenal gland is promoted by agonists of growth-hormone-releasing hormone.", "abstract": "Here, we evaluate an alternative approach of preconditioning pancreatic islets before transplantation using a potent agonist of growth-hormone-releasing hormone (GHRH) to promote islet viability and function, and we explore the adrenal gland as an alternative transplantation site for islet engraftment. The endocrine microenvironment of the adrenal represents a promising niche with the unique advantages of exceptional high oxygen tension and local anti-inflammatory and immunosuppressive properties. GHRH agonists have been shown to promote islet graft survival and function, which may help to reduce the islet mass necessary to reverse diabetes. In the present study, the most potent GHRH agonist MR403 was tested on insulinoma cells, isolated rat islets, and adrenal &#x3b2;-cell cocultures in vitro. GHRH receptor is expressed on both adrenal cells and islets. MR403 caused a significant increase in cell viability and proliferation and revealed an antiapoptotic effect on insulinoma cells. Viability of rat islets was increased after treatment with the agonist and in coculture with adrenal cells. Rat islets were transplanted into diabetic mice to the intraadrenal transplant site and compared with the classical transplants underneath the kidney capsule. Graft function and integration were tested by metabolic follow-up and immunohistochemical staining of intraadrenal grafts. A rapid decrease occurred in blood glucose levels in both models, and all animals reached normoglycemia within the first days after transplantation. Our studies demonstrated that the adrenal may be an attractive site for islet transplantation and that GHRH analogs might allow reduction of the islet mass needed to reverse a diabetic status.", "keywords": ["Adrenal Glands", "Animals", "Cell Line", "Coculture Techniques", "Diabetes Mellitus, Experimental", "Female", "Gonadotropin-Releasing Hormone", "Islets of Langerhans", "Islets of Langerhans Transplantation", "Mice", "Mice, Inbred NOD", "Mice, SCID", "RNA, Messenger", "Rats", "Rats, Wistar", "Receptors, Neuropeptide", "Receptors, Pituitary Hormone-Regulating Hormone", "Transplantation Conditioning"], "year": "2013", "doi": "10.1073/pnas.1221505110"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"pancreas\"[Title] OR \"pancreatic\"[Title] OR \"islet\"[Title] OR \"beta cell\"[Title] OR \"beta-cell\"[Title] OR \"insulin secretion\"[Title] OR \"exocrine pancreas\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__Small Intestine", "source": "Adrenal Glands", "target": "Small Intestine", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: Cortisol, insulin\nNotes: Cortisol potentially has an impact on metabolism in gut.\nSources:\n-  doi: 10.1016/j.lfs.2017.11.049.  “", "connection_type": "Hormonal connection", "key_players": ["Cortisol", "insulin"], "key_players_metabolites": ["amp", "glucose", "cholesterol", "alanine", "amino acids", "leucine", "lactate", "fatty acids", "methionine", "glycine", "isoleucine", "arginine", "butyrate"], "key_players_hormones": ["corticosterone", "acth", "cortisol", "glucocorticoid", "aldosterone", "crh", "neurotensin", "adrenaline", "dhea", "testosterone", "norepinephrine", "noradrenaline", "androstenedione", "epinephrine", "bnp", "natriuretic peptide", "vitamin d", "secretin"], "key_players_proteins": ["acc"], "key_players_counts_metabolites": {"methionine": 1, "cholesterol": 5, "glycine": 1, "amp": 7, "amino acids": 2, "glucose": 7, "isoleucine": 1, "leucine": 2, "lactate": 2, "arginine": 1, "butyrate": 1, "fatty acids": 2, "alanine": 5}, "key_players_counts_hormones": {"dhea": 2, "testosterone": 2, "bnp": 1, "natriuretic peptide": 1, "glucocorticoid": 22, "crh": 6, "aldosterone": 21, "acth": 35, "neurotensin": 3, "norepinephrine": 2, "cortisol": 26, "noradrenaline": 2, "androstenedione": 2, "vitamin d": 1, "adrenaline": 3, "secretin": 1, "epinephrine": 2, "corticosterone": 44}, "key_players_counts_proteins": {"acc": 8}, "notes": "Cortisol potentially has an impact on metabolism in gut.", "sources": ["doi: 10.1016/j.lfs.2017.11.049.  “"], "ai_description": "The Adrenal Glands-Small Intestine axis is mediated by key signalling molecules and mechanisms that involve the hypothalamic-pituitary-adrenal (HPA) axis. The HPA axis is activated by stress, leading to increased production of corticosterone, a glucocorticoid hormone produced by the adrenal glands [3]. This hormone is also produced in the small intestine, where it regulates gut homeostasis and modulates the gut microbiome through interactions with the enteric nervous system [1]. Alterations in the HPA axis function, such as those induced by high-fat diets or sleep deprivation, can disrupt this axis, leading to changes in gut health and behavior [2,4].", "pubmed_n": 47, "pubmed_papers": [{"pmid": "42116487", "title": "Ready-to-use blueberry extract modulates the hypothalamic-pituitary-adrenal axis and alleviates post-stress anxiety linked to antibiotic-induced gut dysbiosis.", "abstract": "This study investigated, for the first time, the effects of crude blueberry extracts obtained using natural deep eutectic solvent (CE-NADES) or a conventional organic solvent (CE-SORG) on anxiety- and depression-related parameters in a rat model of intestinal dysbiosis induced by antibiotics. CE-NADES is a ready-to-use extract that does not require solvent removal prior to administration, while CE-SORG was reconstituted in water after solvent removal. Oral administration of blueberry extracts (10&#xa0;mg of phenolic compounds/kg b.w./day) for 11&#xa0;days showed that CE-NADES significantly reduced plasma adrenocorticotropic hormone (13.2% vs. control dysbiosis; p&#xa0;&lt;&#xa0;0.01) and corticosterone (22.5% vs. control dysbiosis; p&#xa0;&lt;&#xa0;0.0001) levels, and attenuated anxiety-like behavior after acute restraint stress in the elevated plus maze test (85.1% increased time in open arms and 10.4% decreased anxiety index vs. control dysbiosis; p&#xa0;&lt;&#xa0;0.005). In contrast, CE-SORG reduced only corticosterone levels (15% vs. control dysbiosis; p&#xa0;&lt;&#xa0;0.0001) and did not produce an anxiolytic behavioral effect. These results indicate that while both extracts modulated the hypothalamic-pituitary-adrenal (HPA) axis, CE-NADES was more effective than CE-SORG. Only CE-NADES mitigated post-stress anxiety associated with antibiotic-induced gut dysbiosis, supporting an anxiolytic effect for this ready-to-use extract. NADES solvent/delivery system was a key determinant of the anxiolytic efficacy of blueberry extract, associated with HPA axis modulation at both the pituitary and adrenal levels.", "keywords": ["Animals", "Blueberry Plants", "Dysbiosis", "Plant Extracts", "Anxiety", "Male", "Anti-Bacterial Agents", "Rats", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System", "Corticosterone", "Adrenocorticotropic Hormone", "Disease Models, Animal", "Gastrointestinal Microbiome", "Rats, Wistar", "Anti-Anxiety Agents"], "year": "2026", "doi": "10.1016/j.foodres.2026.119235"}, {"pmid": "41962594", "title": "Exposure to a high-fat diet compromises gut health, behavior, and HPA axis function, with partial reversal when limited to adolescence.", "abstract": "High-fat diet (HFD) consumption contributes to obesity, yet its impact on females of (pre)reproductive age and the effects of dietary modification after adolescence remain underexplored. This study examined how continuous HFD exposure or an adolescent switch from HFD to a standard diet (SD) shapes the gut microbiome, behavior, neurochemistry, metabolism, and key components of the hypothalamic-pituitary-adrenal (HPA) axis in female rats. Because HPA-axis alterations can occur across generations after HFD exposure, we examined reproductive-tissue HPA-axis components as potential mechanisms of transmission. Females received SD, HFD, or HFD followed by SD after majority of adolescence (postnatal day 60). HFD exposure impaired HPA-axis regulation and switching to SD during adolescence did not prevent persistent dysfunction into adulthood. However, reproductive HPA-axis components remained unaltered. Diet also strongly influenced the microbiome: while HFD disrupted microbial composition in adolescence, switching to SD partially restored it by adulthood. Behavioral and metabolic effects, including increased adiposity and anxiety-like behavior, emerged only with prolonged HFD exposure. Brain neurotransmitter concentrations remained largely unaffected. Overall, dietary history across adolescence and early adulthood shaped long-term HPA-axis function, microbiome composition, and behavioral outcomes. The absence of reproductive HPA-axis alterations suggests it is not a major mediator of maternal HFD-induced intergenerational effects. Persistent HPA-axis dysfunction despite dietary switching indicates limited reversibility, whereas the microbiome showed the greatest adaptive capacity. In contrast, lasting behavioral and metabolic consequences of HFD require continued exposure to adulthood.", "keywords": ["Animals", "Female", "Diet, High-Fat", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System", "Rats", "Gastrointestinal Microbiome", "Behavior, Animal", "Obesity", "Rats, Sprague-Dawley"], "year": "2026", "doi": "10.1016/j.brainresbull.2026.111883"}, {"pmid": "41651994", "title": "Sleep deprivation disrupts lacrimal gland homeostasis via hypothalamic-pituitary-adrenal axis and gut dysbiosis in mice.", "abstract": "Sleep deprivation (SD) disrupts systemic homeostasis, but how it drives ocular surface disease remains unclear. Using a male mouse SD model, we show that chronic SD activates the hypothalamic-pituitary-adrenal (HPA) axis, elevates corticosterone, alters gut microbiota, and depletes short-chain fatty acids (SCFAs). These alterations coincide with lacrimal gland atrophy, reduced tear secretion, and increased CD4&#x207a;/CD8&#x207a; T cell infiltration, accompanied by activation of IL-17-associated inflammatory pathways. Pharmacological inhibition of glucocorticoid synthesis with metyrapone preserves lacrimal gland structure and function while attenuating immune activation. Microbiome-directed interventions, including SCFA supplementation and fecal microbiota transplantation, rebalance gut communities, suppress pro-inflammatory T cell responses, and maintain lacrimal gland homeostasis. Transcriptomic and immunohistochemical analyses further reveal that all three interventions converge on the&#xa0;downregulation of IL-17 signaling. Collectively, these findings establish an HPA-gut microbiome-lacrimal gland axis that links neuroendocrine stress to microbial dysbiosis and ocular inflammation, and they suggest therapeutic strategies for SD-associated lacrimal gland dysfunction.", "keywords": ["Animals", "Lacrimal Apparatus", "Hypothalamo-Hypophyseal System", "Male", "Homeostasis", "Mice", "Pituitary-Adrenal System", "Sleep Deprivation", "Dysbiosis", "Gastrointestinal Microbiome", "Mice, Inbred C57BL", "Interleukin-17"], "year": "2026", "doi": "10.1038/s42003-026-09657-0"}, {"pmid": "41614720", "title": "A nonfunctional adrenal incidentaloma revealed by intestinal obstruction: metastatic adrenocortical carcinoma diagnosed by surgery.", "abstract": "This case report describes an 84-year-old male patient who presented with symptoms of intestinal obstruction and was subsequently diagnosed with metastatic adrenocortical carcinoma (ACC), a rare and aggressive endocrine malignancy. The patient arrived at the emergency department with abdominal pain, nausea, vomiting, and bloating. Imaging studies revealed a segmental ileal mass suggestive of obstruction and a large (12 &#xd7; 8 cm) adrenal mass. Hormonal assays indicated a nonfunctional adrenal incidentaloma. Due to persistent obstruction, the patient underwent surgical resection of the terminal ileum and a left adrenalectomy. Histopathological examination confirmed ACC with metastasis to the small intestine. This rare presentation is notable because ACC typically manifests with hormone excess or mass effect symptoms, and intestinal metastasis causing mechanical obstruction is exceedingly uncommon. Radiologically, the adrenal mass lacked classic features of ACC, contributing to initial diagnostic uncertainty. Postoperatively, the patient recovered uneventfully and was started on mitotane therapy after PET imaging confirmed residual disease and para-aortic lymph node metastasis. This report underscores the importance of thorough evaluation of large adrenal incidentalomas, even if nonfunctional, and highlights intestinal obstruction as a rare but possible initial presentation of metastatic ACC. It contributes to the limited literature documenting atypical clinical manifestations of this rare tumor. Adrenocortical carcinoma (ACC) is a rare and aggressive malignancy that is frequently diagnosed at an advanced or metastatic stage. Nonfunctional adrenal incidentalomas &#x2265;4 cm in size warrant comprehensive hormonal evaluation and imaging, followed by multidisciplinary assessment due to the potential risk of malignancy. In this case, despite benign-appearing radiological features, histopathological examination confirmed that the adrenal mass was a metastatic adrenocortical carcinoma. R0 resection remains the only potentially curative treatment for ACC; in selected cases, synchronous resection of metastatic lesions may be necessary. This case highlights a previously undocumented presentation of ACC manifesting as small bowel obstruction due to intestinal metastasis, thereby expanding the clinical spectrum of this rare entity.", "keywords": [], "year": "2026", "doi": "10.1530/EDM-25-0083"}, {"pmid": "41273001", "title": "Vitamin D3 Improves Hypothalamic-Pituitary-Adrenal Axis Function, Immunological Responses, and Gut Dysbiosis in Sleep Desynchrony.", "abstract": "Chronic sleep desynchrony proliferates in modern society, characterized by extended wakefulness and disrupted circadian rhythms over a long period, and is associated with various physiological and immune dysfunctions. This study investigated the health effects of long-term sleep desynchrony and subsequent vitamin D3 treatment, alongside sleep recovery, on biological factors in C57BL/6J mice by assessing their body weight, metabolic activity, stress response, immune function, and gut microbiota composition. Mice underwent 28 days of sleep desynchrony using a Lafayette chamber to model chronic disruption of the HPA axis, immune function, and gut microbiota. Sleep desynchrony did not significantly alter body weight, food intake, or water consumption, suggesting that metabolic homeostasis was preserved. However, stress hormone analysis revealed impaired HPA axis regulation in the sleep-desynchronized mice, as indicated by suppressed corticosterone levels after dexamethasone injection. Notably, vitamin D3 treatment restored the HPA axis function by enhancing corticosterone suppression. Behavioral tests of the mice indicated that sleep desynchrony reduced nest-building ability, locomotor activity, and anxiety-like behaviors, whereas vitamin D3 treatment improved their motor function. Furthermore, vitamin D3 treatment alleviated immune dysregulation by reducing neutrophil levels and increasing lymphocyte counts, suggesting a role in restoring immune balance after sleep desynchrony. Regarding gut microbiota composition, sleep desynchrony disrupted microbial diversity, reducing Bacteroidota and increasing Firmicutes, leading to dysbiosis. Vitamin D3 treatment shifted the microbiota composition toward eubiosis, aligning it closer to control-group levels. Additionally, sleep desynchrony impaired the expression of tight junction proteins in the proximal colon, compromising intestinal barrier integrity. Vitamin D3 treatment restored the levels of key tight junction proteins, such as ZO-1 and claudin, thereby maintaining gut barrier function. Vitamin D3 treatment serves as a promising intervention for mitigating the adverse health effects of chronic sleep desynchrony on the HPA axis, immune function, and gut microbiota, providing potential therapeutic benefits for preserving physiological homeostasis in the middle of a long-term sleep deficiency or chronic sleep deprivation.", "keywords": ["Animals", "Gastrointestinal Microbiome", "Mice", "Dysbiosis", "Cholecalciferol", "Male", "Mice, Inbred C57BL", "Pituitary-Adrenal System", "Hypothalamo-Hypophyseal System", "Corticosterone", "Sleep", "Circadian Rhythm", "Sleep Deprivation"], "year": "2025", "doi": "10.1002/brb3.71084"}, {"pmid": "41180240", "title": "Heat stress affects dairy cow performance via oxidative stress, hypothalamic-pituitary-adrenal axis, gut microbiota, and multi-dimensional mitigation.", "abstract": "Against the backdrop of global warming, heat stress has become one of the greatest challenges facing the dairy industry. This review systematically summarizes the multi-dimensional impacts of heat stress on dairy cows and corresponding mitigation strategies under global warming. It covers the evaluation indicators (temperature-humidity index, physiological and behavioral indicators) and classification of heat stress. It analyzes the negative effects on dairy cows' reproductive performance (e.g., oocyte and sperm damage, hormonal disorders, impaired fetal development) and production performance (e.g., reduced milk yield, deteriorated milk composition). These effects are mediated by physiological mechanisms such as oxidative stress imbalance, hypothalamic-pituitary-adrenal axis (HPA axis) activation, cellular structural damage, altered gene expression, and disrupted host-gut microbiota interactions. Additionally, the review integrates interdisciplinary mitigation strategies including environmental optimization, nutritional regulation, genetic breeding, and intelligent monitoring. It provides theoretical and practical references for constructing a sustainable heat stress prevention and control system.", "keywords": [], "year": "2025", "doi": "10.3389/fvets.2025.1686241"}, {"pmid": "39875781", "title": "Role of Probiotics in Depression: Connecting Dots of Gut-Brain-Axis Through Hypothalamic-Pituitary Adrenal Axis and Tryptophan/Kynurenic Pathway involving Indoleamine-2,3-dioxygenase.", "abstract": "Depression is one of the most disabling mental disorders worldwide and characterized by symptoms including worthlessness, anhedonia, sleep, and appetite disturbances. Recently, studies have suggested that tryptophan (Trp) metabolism plays a key role in depressed mood through serotonin and kynurenine pathway involving enzyme tryptophan 5-monooxygenase (TPH) and indoleamine-2,3-dioxygenase (IDO) respectively. Moreover, during neuroinflammation, IDO is activated by proinflammatory cytokines and affects neurogenesis, cognition, disturbed hypothalamic-pituitary-adrenal (HPA) axis, and gut homeostasis by altering the gut bacteria and its metabolites like Trp derivatives. Furthermore, over the decades, researchers have focused on understanding communication between the human microbiome, especially gut microbiota, and mental health, called gut-brain-axis (GBA), particularly through Trp metabolism. Supplementation of probiotics in depression has gained attention from researchers and clinicians. However, there is limited information about probiotics supplementation on depression involving enzyme IDO and kynurenine pathway metabolites. This review discussed the potential role of probiotics in depression through the tryptophan/kynurenine pathway.", "keywords": ["Humans", "Indoleamine-Pyrrole 2,3,-Dioxygenase", "Tryptophan", "Probiotics", "Hypothalamo-Hypophyseal System", "Kynurenine", "Depression", "Animals", "Pituitary-Adrenal System", "Gastrointestinal Microbiome", "Brain-Gut Axis", "Brain"], "year": "2025", "doi": "10.1007/s12035-025-04708-9"}, {"pmid": "38179773", "title": "A More Holistic Perspective of Alzheimer's Disease: Roles of Gut Microbiome, Adipocytes, HPA Axis, Melatonergic Pathway and Astrocyte Mitochondria in the Emergence of Autoimmunity.", "abstract": "Alzheimer's disease is widely regarded as poorly treated due to poor conceptualization. For 40 years, Alzheimer's disease pathophysiology has focused on two culprits, amyloid-&#x3b2; induced plaques and hyperphosphorylated tau associated tangles, with no significant treatment advance. This is confounded by data showing amyloid-&#x3b2; to be an endogenous antimicrobial that is increased in a wide array of diverse medical conditions associated with heightened inflammation. This article reviews the wider bodies of data pertaining to Alzheimer's disease pathophysiology, highlighting the role of suppressed astrocyte mitochondrial function and mitochondrial melatonergic pathway as a core hub in driving neuronal loss in dementia. It is proposed that astrocyte function over aging becomes dysregulated, at least partly mediated by systemic processes involving the 10-fold decrease in pineal melatonin leading to the attenuated capacity of night-time melatonin to dampen residual daytime inflammation. Suppressed pineal melatonin also attenuates melatonin's inhibition of glucocorticoid receptor nuclear translocation, thereby changing not only stress/hypothalamus-pituitary-adrenal (HPA) axis consequences but also the consequences of the cortisol awakening response, which 'primes the body for the coming day'. Gut microbiome-derived butyrate also inhibits glucocorticoid receptor nuclear translocation, as well as inducing the mitochondrial melatonergic pathway. It is proposed that the loss of astrocyte melatonin prevents the autocrine and paracrine effects of melatonin in limiting amyloid-&#x3b2; levels and effects. Suppressed astrocyte melatonin production also attenuates the melatonin induction of astrocyte lactate, thereby decreasing neuronal mitochondrial metabolism and the neuronal mitochondrial melatonergic pathway. The loss of astrocyte lactate and melatonin, coupled to the suppression of neuronal mitochondrial metabolism and melatonin production decreases mitophagy, leading to the induction of the major histocompatibility complex (MHC)-1. MHC-1 initiates the chemoattraction of CD8+ t cells, leading to neuronal destruction in Alzheimer's disease being driven by 'autoimmune'/'immune-mediated' processes. Alzheimer's disease may therefore be conceptualized as being initiated by systemic processes that act on astrocytes as a core hub, with the suppression of the astrocyte melatonergic pathway leaving neurons deplete of appropriate metabolic substrates and co-ordinated antioxidants. This culminates in an 'immune-mediated' cell death. Future research and treatment/prevention implications are indicated.", "keywords": ["Humans", "Astrocytes", "Melatonin", "Alzheimer Disease", "Autoimmunity", "Gastrointestinal Microbiome", "Hypothalamo-Hypophyseal System", "Receptors, Glucocorticoid", "Pituitary-Adrenal System", "Inflammation", "Mitochondria", "Adipocytes", "Lactates"], "year": "2023", "doi": "10.31083/j.fbl2812355"}, {"pmid": "37834073", "title": "The Effects of Chronic Unpredictable Mild Stress and Semi-Pure Diets on the Brain, Gut and Adrenal Medulla in C57BL6 Mice.", "abstract": "Chronic stress is known to perturb serotonergic regulation in the brain, leading to mood, learning and memory impairments and increasing the risk of developing mood disorders. The influence of the gut microbiota on serotonergic regulation in the brain has received increased attention recently, justifying the investigation of the role of diet on the gut and the brain in mood disorders. Here, using a 4-week chronic unpredictable mild stress (CUMS) model in mice, we aimed to investigate the effects of a high-fat high-glycaemic index (HFD) and high-fibre fruit &amp; vegetable \"superfood\" (SUP) modifications of a semi-pure AIN93M diet on behaviour, serotonin synthesis and metabolism pathway regulation in the brain and the gut, as well as the gut microbiota and the peripheral adrenal medullary system. CUMS induced anxiety-like behaviour, dysregulated the tryptophan and serotonin metabolic pathways in the hippocampus, prefrontal cortex, and colon, and altered the composition of the gut microbiota. CUMS reduced the catecholamine synthetic capacity of the adrenal glands. Differential effects were found in these parameters in the HFD and SUP diet. Thus, dietary modifications may profoundly affect the multiple dynamic systems involved in mood disorders.", "keywords": ["Mice", "Animals", "Serotonin", "Mice, Inbred C57BL", "Brain", "Diet", "Adrenal Medulla", "Stress, Psychological", "Depression"], "year": "2023", "doi": "10.3390/ijms241914618"}, {"pmid": "37404311", "title": "Signalling cognition: the gut microbiota and hypothalamic-pituitary-adrenal axis.", "abstract": "Cognitive function in humans depends on the complex and interplay between multiple body systems, including the hypothalamic-pituitary-adrenal (HPA) axis. The gut microbiota, which vastly outnumbers human cells and has a genetic potential that exceeds that of the human genome, plays a crucial role in this interplay. The microbiota-gut-brain (MGB) axis is a bidirectional signalling pathway that operates through neural, endocrine, immune, and metabolic pathways. One of the major neuroendocrine systems responding to stress is the HPA axis which produces glucocorticoids such as cortisol in humans and corticosterone in rodents. Appropriate concentrations of cortisol are essential for normal neurodevelopment and function, as well as cognitive processes such as learning and memory, and studies have shown that microbes modulate the HPA axis throughout life. Stress can significantly impact the MGB axis via the HPA axis and other pathways. Animal research has advanced our understanding of these mechanisms and pathways, leading to a paradigm shift in conceptual thinking about the influence of the microbiota on human health and disease. Preclinical and human trials are currently underway to determine how these animal models translate to humans. In this review article, we summarize the current knowledge of the relationship between the gut microbiota, HPA axis, and cognition, and provide an overview of the main findings and conclusions in this broad field.", "keywords": ["Animals", "Humans", "Gastrointestinal Microbiome", "Hypothalamo-Hypophyseal System", "Brain", "Hydrocortisone", "Pituitary-Adrenal System", "Cognition"], "year": "2023", "doi": "10.3389/fendo.2023.1130689"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"small intestine\"[Title] OR \"duodenum\"[Title] OR \"jejunum\"[Title] OR \"ileum\"[Title] OR \"intestinal\"[Title] OR \"gut\"[Title] OR \"enterocyte\"[Title] OR \"Peyer's patches\"[Title] OR \"gut-brain axis\"[Title] OR \"enteroendocrine\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__WAT", "source": "Adrenal Glands", "target": "WAT", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: Cortisol, insulin, adrenaline, noradrenaline\nNotes: \n- Cortisol lowers insulin production in the pancreas which will in turn lower insulin abundance and lead to less glucose uptake in WAT.\n- Cortisol drives lipolysis. Patients with a higher cortisol level (higher SUV in Adrenal Glands) will do more lipolysis and have less glucose uptake.\n- Adrenaline and noradrenaline lead to lipolysis in adipocytes and they supress the re-esterification of fatty acids .\nSources:\n-https://doi.org/10.1038/s42255-020-0217-6\n-DOI: 10.3181/00379727-99-24355", "connection_type": "Hormonal connection", "key_players": ["Cortisol", "insulin", "adrenaline", "noradrenaline"], "key_players_metabolites": ["cholesterol", "isocitrate", "triglycerides", "amp", "glycogen", "citrate", "ldl", "atp", "hdl", "glucose", "vldl", "lipoprotein", "fatty acids"], "key_players_hormones": ["cortisol", "aldosterone", "leptin", "thyroxine", "insulin", "estradiol", "glucocorticoid", "acth", "noradrenaline", "mineralocorticoid", "norepinephrine", "adrenaline", "epinephrine", "corticosterone"], "key_players_proteins": ["hexokinase", "hormone-sensitive lipase"], "key_players_counts_metabolites": {"cholesterol": 4, "amp": 2, "glycogen": 2, "citrate": 2, "atp": 1, "hdl": 1, "glucose": 1, "isocitrate": 3, "ldl": 2, "vldl": 1, "lipoprotein": 1, "triglycerides": 3, "fatty acids": 1}, "key_players_counts_hormones": {"glucocorticoid": 3, "thyroxine": 10, "aldosterone": 11, "acth": 3, "mineralocorticoid": 1, "norepinephrine": 1, "cortisol": 20, "noradrenaline": 2, "insulin": 10, "adrenaline": 1, "epinephrine": 1, "leptin": 11, "corticosterone": 1, "estradiol": 4}, "key_players_counts_proteins": {"hormone-sensitive lipase": 2, "hexokinase": 3}, "notes": "- Cortisol lowers insulin production in the pancreas which will in turn lower insulin abundance and lead to less glucose uptake in WAT.\n- Cortisol drives lipolysis. Patients with a higher cortisol level (higher SUV in Adrenal Glands) will do more lipolysis and have less glucose uptake.\n- Adrenaline and noradrenaline lead to lipolysis in adipocytes and they supress the re-esterification of fatty acids .", "sources": ["https://doi.org/10.1038/s42255-020-0217-6", "DOI: 10.3181/00379727-99-24355"], "ai_description": "The Adrenal Glands-WAT (Wheatgerian Adipose Tissue) axis is mediated by the hypothalamic-pituitary-adrenal (HPA) axis, where glucocorticoids produced by the adrenal glands regulate adipose tissue compartments. The specific depot of adipose tissue influences the effects of glucocorticoids, with epicardial adipose tissue and visceral fat being key players in this process [1]. Leptin, a hormone secreted by adipose tissue, also plays a crucial role in regulating body temperature through hypothalamus-adrenal medulla-adipose tissue crosstalk [5], while glucocorticoid receptors and hydroxysteroid 11-beta dehydrogenases (HSD11Bs) are essential for the regulation of glucocorticoid action in both tissues [4]. The interplay between these molecules and mechanisms underlies the complex relationships between the adrenal glands, adipose tissue, and the HPA axis.", "pubmed_n": 20, "pubmed_papers": [{"pmid": "38982517", "title": "Associations between adrenal gland volume and adipose tissue compartments - a whole body MRI study.", "abstract": "Obesity is associated with alterations in the hypothalamic-pituitary-adrenal (HPA) axis. Effects of glucocorticoids on adipose tissues appear to depend on the specific adipose depot, in which they take place. In this study, we aimed to investigate the role of MRI-based adrenal gland volume as an imaging marker in association with different adipose tissue compartments. The study cohort derives from the population-based research platform KORA (Cooperative Health Research in the Augsburg Region, Germany) MRI sub-study, a cross-sectional sub-study investigating the interactions between subclinical metabolic changes&#xa0;and cardiovascular disease in a study sample of 400 participants. Originally, eligible subjects underwent a whole-body MRI. MRI-based segmentations were performed manually and semi-automatically for adrenal gland volume, visceral adipose tissue (VAT), subcutaneous adipose tissue (SAT), epi- and pericardial fat and renal sinus fat. Hepatic and pancreatic lipid content were measured as pancreatic proton density fraction (PDFF) and MR-spectroscopic hepatic fat fraction (HFF). Multivariable linear regression analyses were performed. A number of 307 participants (56.2&#x2009;&#xb1;&#x2009;9.1&#xa0;years, 60.3% male, 14.3% with type 2 diabetes (T2DM), 30.6% with obesity, 34.2% with hypertension) were included. In multivariable analyses, strong positive associations between adrenal gland volume and VAT, total adipose tissue (TAT) as well as HFF persisted after extensive step-wise adjustment for possible metabolic confounders (VAT: beta&#x2009;=&#x2009;0.31, 95%-CI [0.71, 0.81], p&#x2009;&lt;&#x2009;0.001; TAT: beta&#x2009;=&#x2009;0.14, 95%-CI [0.06, 0.23], p&#x2009;&lt;&#x2009;0.001; HFF: beta&#x2009;=&#x2009;1.17, 95%-CI [1.04, 1.31], p&#x2009;=&#x2009;0.009). In contrast, associations between adrenal gland volume and SAT were attenuated in multivariate analysis after adjusting for BMI. Associations between pancreatic PDFF, epi- and pericardial fat and renal sinus fat were mediated to a great extent by VAT (pancreatic PDFF: 72%, epicardial adipose tissue: 100%, pericardial adipose tissue: 100%, renal sinus fat: 81.5%). Our results found MRI-based adrenal gland volume as a possible imaging biomarker of unfavorable adipose tissue distribution, irrespective of metabolic risk factors. Thus, adrenal gland volume may serve as a potential MRI-based biomarker of metabolic changes and contributes to an individual characterization of metabolic states and individual risk stratification. Future studies should elucidate in a longitudinal study design, if and how HPA axis activation may trigger unfavorable adipose tissue distribution and whether and to which extent this is involved in the pathogenesis of manifest metabolic syndrome.", "keywords": [], "year": "2024", "doi": "10.1186/s12986-024-00823-x"}, {"pmid": "36096484", "title": "Management of adreno-cortical adenomas using microwave ablation: study of the effects of the fat tissue.", "abstract": "Adrenocortical neoplasms are the main causes of secondary hypertension and related comorbidities including hypokalemia and cardiovascular diseases. Conventional techniques for the management of this condition are often invasive and not resolutive. Recent studies proposed microwave thermal ablation (MWA) to eradicate adrenocortical adenomas arising in proximity to sensitive structures. This study explores a new MWA approach to selectively direct the electromagnetic energy into the target and shield the surrounding tissues. The new solution relies on the anatomical and dielectric characteristics of the adrenal gland and the surrounding fat capsule. A 3&#x2009;D model of the adrenal gland is developed, and a cooled microwave applicator is placed parallel to the interface between the fat and adrenal tissue. Numerical simulations are conducted at 2.45&#x2009;GHz accounting for two energy delivery settings, two orientations of the applicator and blood perfusion of the tissues . Ex vivo and in&#xa0;vivo ablation procedures are conducted on ovine adrenal glands. Histology analysis completes the experimental studies. Numerical results show asymmetric ablation profiles in ex vivo and in&#xa0;vivo conditions. The asymmetry ratio is influenced by the procedure settings and orientation of the applicator. Ablation zones obtained experimentally agree with those predicted by the numerical simulations. Histology analysis confirms irreversible cellular changes only in the adrenal tissue close to the applicator. The outcomes show that the dielectric contrast between the fat layer and tissue target can be a tool in MWA to shape ablation zones to protect the surrounding structures from excessive temperature increases.", "keywords": ["Adenoma", "Adrenocortical Adenoma", "Animals", "Liver", "Microwaves", "Radiofrequency Ablation", "Sheep"], "year": "2022", "doi": "10.1080/02656736.2022.2114611"}, {"pmid": "34715600", "title": "Epicardial adipose tissue and adrenal gland volume in patients with borderline personality disorder.", "abstract": "Borderline personality disorder (BPD) is associated with an elevated mortality risk that is partially attributed to suicide, but few studies examined other possible causes of premature death. The present study compared epicardial adipose tissue (EAT) volume as a known early predictor of premature cardiovascular morbidity, cardiovascular risk indices, and adrenal gland volume (AGV) as an indicator for chronic hypothalamus-pituitary-adrenal (HPA) axis activation in females with borderline personality disorder (BPD), major depressive disorder (MDD) and in healthy individuals. Twenty-eight patients with BPD comorbid with MDD (BPD/MDD), 22 MDD patients and 26 healthy females (CTRL) of comparable age were included. EAT and AGV were assessed by magnetic resonance tomography; 10-year cardiovascular risk and diabetes risk were determined by PROCAM and FINDRISK score; metabolic syndrome was defined following National Cholesterol Education Adult Treatment Panel III R (NCEP/ATP III) criteria. MADRS was used to assess depression severity. After adjustment for age, body mass index (BMI), and physical activity, EAT and AGV were significantly increased in BPD/MDD compared to MDD and CTRL. EAT and AGV displayed a positive correlation. Finally, diabetes risk in BPD/MDD was elevated compared to CTRL and MDD. The present study highlights the increased cardiometabolic risk of BPD patients. We identify EAT accumulation as an early predictor and potential mediator of cardiovascular disease in BPD that appears to be driven at least in part by HPA axis dysregulation. Therefore, interventions that reduce EAT volume (i.e. exercise and diet) should be considered in the clinical management of BPD.", "keywords": ["Adipose Tissue", "Adrenal Glands", "Adult", "Borderline Personality Disorder", "Major Depressive Disorder", "Female", "Humans", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System"], "year": "2021", "doi": "10.1016/j.jpsychires.2021.10.039"}, {"pmid": "32361423", "title": "Expression of corticosteroid hormone receptors, prereceptors, and molecular chaperones in hypothalamic-pituitary-adrenal axis and adipose tissue after the administration of growth promoters in veal calves.", "abstract": "The action of glucocorticoids on target tissues is regulated by the glucocorticoid and mineralocorticoid receptors (codified by the NR3C1 and NR3C2 gene, respectively). Moreover, the prereceptor system, represented by the hydroxysteroid 11-beta dehydrogenases (HSD11Bs), catalyzes the interconversion from active glucocorticoids into inactive compounds. This study aimed to determine whether the expression of the prereceptor system, the corticosteroid receptors, and the molecules regulating their intracellular trafficking (FKBP prolyl isomerase 4 and FKBP prolyl isomerase 5) could be regulated in the hypothalamic-pituitary-adrenal axis and in different type of adipose tissue of calves by the administration of dexamethasone in combination with estradiol or prednisolone. Research about the glucocorticoid effects on bovine target tissues may allow development of new diagnostic methods that use potential molecular biomarkers of glucocorticoid treatment. The administration of dexamethasone in combination with estradiol increased the gene expression of HSD11B1 (P &lt; 0.01), HSD11B2 (P &lt; 0.05), NR3C1 (P &lt; 0.01), and NR3C2 (P &lt; 0.01) in the adrenal glands; NR3C2 in the intramuscular adipose tissue (P &lt; 0.01), and HSD11B1 in the subcutaneous adipose tissue (P &lt; 0.01). Prednisolone administration increased the gene expression of HSD11B1 (P &lt; 0.01), NR3C1 (P &lt; 0.05), and NR3C2 (P &lt; 0.05) in the adrenal glands and HSD11B1 (P &lt; 0.01) in the subcutaneous adipose tissue. Interestingly, most of the examined tissues/organs showed a significant variation of FKBP5 gene expression after the administration of dexamethasone in combination with estradiol. So, these changes suggest that the FKBP5 gene expression could be a possible biomarker of the illegal dexamethasone administration in calves.", "keywords": ["Adipose Tissue", "Adrenal Glands", "Animals", "Cattle", "Dexamethasone", "Estradiol", "Gene Expression Regulation", "Glucocorticoids", "Hypothalamo-Hypophyseal System", "Hypothalamus", "Male", "Molecular Chaperones", "Pituitary Gland", "Pituitary-Adrenal System", "Receptors, Steroid"], "year": "2020", "doi": "10.1016/j.domaniend.2020.106473"}, {"pmid": "32149734", "title": "Leptin mediates postprandial increases in body temperature through hypothalamus-adrenal medulla-adipose tissue crosstalk.", "abstract": "Meal ingestion increases body temperature in multiple species, an effect that is blunted by obesity. However, the mechanisms responsible for these phenomena remain incompletely understood. Here we show that refeeding increases plasma leptin concentrations approximately 8-fold in 48-hour-fasted lean rats, and this normalization of plasma leptin concentrations stimulates adrenomedullary catecholamine secretion. Increased adrenal medulla-derived plasma catecholamines were necessary and sufficient to increase body temperature postprandially, a process that required both &#xfeff;fatty acids generated from adipose tissue lipolysis and &#x3b2;-adrenergic activation of brown adipose tissue (BAT). Diet-induced obese rats, which remained &#xfeff;relatively hyperleptinemic while fasting, did not exhibit fasting-induced reductions in temperature. To examine the impact of feeding-induced increases in body temperature on energy balance, we compared rats fed chronically by either 2 carbohydrate-rich boluses daily or a continuous &#xfeff;isocaloric intragastric infusion. Bolus feeding increased body temperature and reduced weight gain compared with continuous feeding, an effect abrogated by treatment with atenolol. In summary, these data demonstrate that leptin stimulates a hypothalamus-adrenal medulla-BAT axis, which is necessary and sufficient to induce lipolysis and, as a result, increase body temperature after refeeding.", "keywords": ["Adipose Tissue, Brown", "Adrenal Medulla", "Animals", "Body Temperature Regulation", "Hypothalamo-Hypophyseal System", "Leptin", "Lipolysis", "Male", "Postprandial Period", "Rats", "Rats, Sprague-Dawley", "Signal Transduction"], "year": "2020", "doi": "10.1172/JCI134699"}, {"pmid": "31613736", "title": "Effects of Adipocyte-derived Factors on the Adrenal Cortex.", "abstract": "Obesity is highly complicated by hypertension and hyperglycemia. In particular, it has been proposed that obesity-related hypertension is caused by adipocyte-derived factors that are recognized as undetermined proteins secreted from adipocytes. Adipocyte-derived factors have been known to be related to aldosterone secretion in the adrenal gland. So far, Wnt proteins, CTRP-1, VLDL, LDL, HDL and leptin have been demonstrated to stimulate aldosterone secretion. In contrast, it has not yet been clarified whether adipocyte-derived factors also affect adrenal cortisol secretion. In the present study, we investigated the effect of adipocyte-derived factors on cortisol synthase gene CYP11B1 mRNA expression in vitro study using adrenocortical carcinoma H295R cells and mouse fibroblast 3T3-L1cells. Interestingly, adipocyte-derived factors were demonstrated to have the ability to stimulate CYP11B1 mRNA expression. Since CYP11B1 is well known as a limiting enzyme of cortisol synthesis, our study suggests that adipocyte-derived factors may stimulate cortisol secretion, as well as aldosterone secretion. Taken together, adipocyte-derived factors may be the cause of metabolic syndrome due to their stimulating effects on aldosterone/cortisol secretion. Therefore, the innovation of novel drugs against them may possibly be a new approach against metabolic syndrome.", "keywords": ["Adipocytes", "Adrenal Cortex", "Adrenal Cortex Neoplasms", "Animals", "Carcinoma", "Cell Line", "Cell Line, Tumor", "Cytochrome P-450 CYP11B2", "Fibroblasts", "Gene Expression Regulation", "Humans", "Hydrocortisone", "Leptin", "Lipoproteins, LDL", "Mice", "Proteins", "RNA, Messenger", "Steroid 11-beta-Hydroxylase", "Wnt Proteins", "Zona Fasciculata"], "year": "2020", "doi": "10.2174/1874467212666191015161334"}, {"pmid": "29721436", "title": "Overexpression of 11&#x3b2;-hydroxysteroid dehydrogenase 1 in visceral adipose tissue and underexpression of endothelial nitric oxide synthase in the adrenal cortex of dogs with hyperadrenocorticism.", "abstract": "11&#x3b2;-Hydroxysteroid dehydrogenase 1 (11&#x3b2;-HSD1) is an enzyme that activates cortisone into cortisol in tissues. Alterations in this enzyme are related to the development of metabolic syndrome, obesity and hyperadrenocorticism (HAC). Endothelial nitric oxide synthase (eNOS) produces nitric oxide and is related to the regulation of adrenal steroidogenesis. The aim of the study was to evaluate 11&#x3b2;-HSD1 and eNOS expression in dogs with HAC. Visceral adipose tissue samples were taken to evaluate 11&#x3b2;-HSD1 expression by immunohistochemistry and western blotting. In parallel, adrenal gland samples were collected to evaluate eNOS expression by immunohistochemistry. 11&#x3b2;-HSD1 expression was significantly higher in the adipocytes of dogs with HAC than in those of the control dogs. eNOS expression in the adrenal cortex (zona fasciculata) was significantly lower in the dogs with HAC than in the control dogs. 11&#x3b2;-HSD1 overexpression and eNOS underexpression could play a role in the maintenance of hypercortisolism in dogs with HAC.", "keywords": [], "year": "2018", "doi": "10.4314/ovj.v8i1.13"}, {"pmid": "25935636", "title": "Adrenal gland volume, intra-abdominal and pericardial adipose tissue in major depressive disorder.", "abstract": "Major depressive disorder (MDD) is associated with an increased risk for the development of cardio-metabolic diseases. Increased intra-abdominal (IAT) and pericardial adipose tissue (PAT) have been found in depression, and are discussed as potential mediating factors. IAT and PAT are thought to be the result of a dysregulation of the hypothalamus-pituitary-adrenal axis (HPAA) with subsequent hypercortisolism. Therefore we examined adrenal gland volume as proxy marker for HPAA activation, and IAT and PAT in depressed patients. Twenty-seven depressed patients and 19 comparison subjects were included in this case-control study. Adrenal gland volume, pericardial, intraabdominal and subcutaneous adipose tissue were measured by magnetic resonance imaging. Further parameters included factors of the metabolic syndrome, fasting cortisol, fasting insulin, and proinflammatory cytokines. Adrenal gland and pericardial adipose tissue volumes, serum concentrations of cortisol and insulin, and serum concentrations tumor-necrosis factor-&#x3b1; were increased in depressed patients. Adrenal gland volume was positively correlated with intra-abdominal and pericardial adipose tissue, but not with subcutaneous adipose tissue. Our findings point to the role of HPAA dysregulation and hypercortisolism as potential mediators of IAT and PAT enlargement. Further studies are warranted to examine whether certain subtypes of depression are more prone to cardio-metabolic diseases.", "keywords": ["Adipose Tissue", "Adrenal Glands", "Adult", "Case-Control Studies", "Cytokines", "Major Depressive Disorder", "Female", "Humans", "Hydrocortisone", "Insulin", "Intra-Abdominal Fat", "Magnetic Resonance Imaging", "Male", "Middle Aged", "Organ Size", "Pericardium", "Severity of Illness Index"], "year": "2015", "doi": "10.1016/j.psyneuen.2015.04.008"}, {"pmid": "25834995", "title": "Consumption of sucrose from infancy increases the visceral fat accumulation, concentration of triglycerides, insulin and leptin, and generates abnormalities in the adrenal gland.", "abstract": "Consumption of sugar-sweetened beverages promotes the development of metabolic syndrome (MetS) and type 2 diabetes mellitus in humans. One factor related to the appearance of MetS components is the dysfunction of the adrenal gland. In fact, the experimental generation of hyperglycemia has been associated with morphological and microvascular changes in the adrenal glands of rats. We hypothesized that high sucrose consumption from infancy promotes histological disruption of the adrenal glands associated with the appearance of metabolic syndrome indicators. Male Wistar rats were separated at weaning (21&#xa0;days old) into two groups: free access to tap water (control group, C) or 30&#xa0;% sucrose diluted in water (sugar-fed group). After 12&#xa0;weeks, high sucrose consumption promoted an increase in visceral fat accumulation, adipose cell number, and insulin resistance. Also, a rise in the concentration of triglycerides, very low-density lipoprotein, insulin and leptin was observed. In control rats, a histomorphometric asymmetry between the right and left adrenal glands was found. In the sugar-fed group, sucrose consumption produced a major change in adrenal gland asymmetry. No changes in corticosterone serum level were observed in either group. Our results suggest that a high sucrose liquid-diet from early life alters the morphology of adrenocortical zones, leading to MetS indicators.", "keywords": ["Adrenal Glands", "Age Factors", "Animals", "Dietary Sucrose", "Hyperglycemia", "Insulin", "Intra-Abdominal Fat", "Leptin", "Male", "Metabolic Syndrome", "Microvessels", "Rats", "Rats, Wistar", "Triglycerides"], "year": "2016", "doi": "10.1007/s12565-015-0279-9"}, {"pmid": "25372731", "title": "Cross-talk between adipose tissue and the HPA axis in obesity and overt hypercortisolemic states.", "abstract": "In addition to its roles in providing insulation and mechanical support, adipose tissue (AT) has been recognised as the major site for storage of surplus fuel. Since leptin was discovered, white AT (WAT) has been recognised as an endocrine organ and an important source of biologically active substances with local and/or systemic action called adipokines. The metabolic and endocrine activities of AT are under the control of several hormones: a particular role has been played by glucocorticoids (GC), which able to participate, along with other hormones, both in recruitment of progenitor cells and in differentiation and secretive activities. AT is also able to generate cortisol from cortisone through 11&#x3b2;-hydroxysteroid-dehydrogenase (11&#x3b2;-HSD). There are controversial reports in the literature, showing a hyperactivity of 11&#x3b2;-HSD in obesity. It has been postulated that obesity, particularly the visceral body fat distribution (V-BFD), may be considered a maladaptation to stress exposure, thus leading to hyperactivation of the hypothalamic-pituitary-adrenal (HPA) axis, and higher-than-normal cortisol levels. In this review, we will examine the cross-talk between the HPA axis and AT, their relationship under stressful events, depending on steroid hormones and different adipokine secretions.", "keywords": ["11-beta-Hydroxysteroid Dehydrogenases", "Adipocytes", "Adipokines", "Adipose Tissue", "Animals", "Cell Differentiation", "Cushing Syndrome", "Humans", "Hydrocortisone", "Hypothalamo-Hypophyseal System", "Metabolic Syndrome", "Obesity", "Pituitary-Adrenal System", "Sex Characteristics", "Stress, Physiological"], "year": "2014", "doi": "10.1515/hmbci-2013-0068"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"adipose tissue\"[Title] OR \"white adipose tissue\"[Title] OR \"fat tissue\"[Title] OR \"adipocyte\"[Title] OR \"adipogenesis\"[Title] OR \"visceral fat\"[Title] OR \"subcutaneous fat\"[Title] OR \"WAT\"[Title] OR \"lipogenesis\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Bone Marrow__Brain", "source": "Bone Marrow", "target": "Brain", "color": "#64748b", "description": "Type: Metabolic status.\nKey Players: \nNotes: \n- Might occur only during fasting as glucose is reserved for brain and immune system (bone marrow, spleen)\nSources:", "connection_type": "Metabolic status.", "key_players": ["Notes:"], "key_players_metabolites": ["glucose", "glutamate", "amp", "atp", "serine", "prostaglandin", "adp", "glycogen", "galactose", "fatty acid", "cholesterol", "amino acids", "lactate", "amino acid", "creatine"], "key_players_hormones": ["tnf", "tumor necrosis factor", "leptin", "angiotensin", "insulin", "interleukin-1", "igf-1", "il-6", "epo", "angiotensin ii", "renin", "corticosterone", "interleukin-6", "thyroid hormone", "glucocorticoid", "norepinephrine", "erythropoietin", "somatostatin", "cck", "natriuretic peptide", "glucagon", "acth", "il-4", "il6", "adiponectin", "t3", "il-10", "triiodothyronine"], "key_players_proteins": ["akt", "pi3k", "mapk", "p38", "mtor", "ampk", "sirt1", "inos", "jnk", "cox-2", "foxo1", "glut1", "erk1", "leptin receptor", "cox2", "cd36"], "key_players_counts_metabolites": {"cholesterol": 1, "amp": 11, "glycogen": 5, "atp": 7, "amino acids": 1, "glucose": 63, "galactose": 3, "fatty acid": 2, "glutamate": 14, "lactate": 1, "prostaglandin": 6, "amino acid": 1, "creatine": 1, "adp": 6, "serine": 7}, "key_players_counts_hormones": {"thyroid hormone": 2, "tnf": 19, "cck": 1, "natriuretic peptide": 1, "glucocorticoid": 2, "interleukin-1": 9, "glucagon": 1, "acth": 1, "igf-1": 9, "angiotensin ii": 5, "il-4": 1, "norepinephrine": 2, "erythropoietin": 2, "il6": 1, "renin": 4, "adiponectin": 1, "insulin": 10, "t3": 1, "il-10": 1, "tumor necrosis factor": 13, "triiodothyronine": 1, "leptin": 13, "corticosterone": 3, "il-6": 9, "epo": 7, "somatostatin": 2, "angiotensin": 11, "interleukin-6": 3}, "key_players_counts_proteins": {"mapk": 22, "jnk": 5, "pi3k": 31, "foxo1": 3, "p38": 21, "glut1": 2, "leptin receptor": 1, "akt": 39, "cox2": 1, "cox-2": 4, "cd36": 1, "erk1": 2, "ampk": 10, "sirt1": 8, "inos": 6, "mtor": 17}, "notes": "- Might occur only during fasting as glucose is reserved for brain and immune system (bone marrow, spleen)", "sources": [], "ai_description": "The Bone Marrow–Brain axis is a complex inter-organ communication network where bone marrow-derived cells and signaling molecules interact with the brain to regulate inflammation, metabolism, and tissue repair. In ischemic stroke, post-injury inflammation is regulated by meningeal lymphatic vessels and glymphatic transport [1], while chronic stress induces glioma growth through macrophage-mediated crosstalk between bone marrow and brain [2]. Repeated head impacts establish a senescent cranial bone marrow niche that impairs brain metabolism [3], whereas platelet-rich plasma-primed exosomes from bone marrow mesenchymal stem cells promote nerve regeneration via the miR-29a-3p/PTEN/PI3K/Akt/mTOR axis after spinal cord injury [4]. These findings highlight the critical role of bone marrow-derived signaling molecules and cells in modulating brain function and disease.", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42335982", "title": "The skull bone marrow-meninges-brain axis: A new sentinel for neuroinflammation regulation in ischemic stroke.", "abstract": "The central nervous system (CNS) has long been regarded as relatively immune-privileged, but the discovery of glymphatic transport and meningeal lymphatic vessels has reshaped our understanding of neuroimmune communication. In ischemic stroke, emerging evidence suggests that post-injury inflammation is regulated not only by systemic leukocyte recruitment and blood-brain barrier disruption but also by a spatially organized skull bone marrow-meninges-brain axis. Anatomical studies have identified vascular channels connecting calvarial bone marrow with the dura mater, providing a potential route for rapid communication between skull marrow immune niches and CNS border compartments. After ischemic injury, brain-derived inflammatory signals may activate adjacent skull marrow niches, while skull marrow-derived myeloid cells may migrate toward the meninges and contribute to early neuroinflammatory responses. In parallel, meningeal lymphatic vessels support the clearance of cerebrospinal fluid (CSF)-derived solutes, inflammatory mediators, antigens, and cellular debris toward deep cervical lymph nodes. This review integrates current evidence into a stage-dependent influx-efflux framework. In this model, skull-dura vascular channels may support local cellular influx and immune sensing, whereas meningeal lymphatic vessels provide a molecular and antigenic efflux pathway. The balance between these processes may influence edema formation, inflammatory amplification, immune resolution, and tissue repair after stroke. However, this axis remains an emerging concept rather than a fully established therapeutic target. Human evidence mainly supports anatomical plausibility and imaging accessibility, while direct demonstration of skull marrow-derived immune-cell trafficking in human stroke is still lacking. Further mechanistic, imaging, and translational studies are needed to determine whether this axis can guide precision monitoring and modulation of post-stroke neuroinflammation.", "keywords": [], "year": "2026", "doi": "10.1016/j.expneurol.2026.115890"}, {"pmid": "42314665", "title": "Macrophage-mediated brain-bone marrow crosstalk promotes chronic stress-induced glioma growth.", "abstract": "Stress is associated with increased cancer morbidity and mortality. Here, we show that chronic stress accelerates glioma growth and reduces survival of tumor-bearing mice. Integrated multi-omics analysis of syngeneic glioma samples reveals stress-induced CD45 + CD11b + C5aR1 + macrophages, termed stress-associated macrophages (SAMs). Using parabiosis experiments in mice, we demonstrate that SAMs are derived from bone marrow monocytes. Stress-activated sympathetic nerve promotes the differentiation of ADRB2 + bone marrow monocytes into SAMs, which can be antagonized by selective ablation of catecholaminergic nerves. Conditional knockout of C5ar1 in macrophages, or pharmacologic C5aR inhibition, reduces SAMs and attenuates stress-induced glioma tumor growth in vivo. SAMs exhibit elevated CD36 expression, leading to excessive intracellular lipid accumulation and peroxidization, dampening their phagocytotic capacity. SAMs abundance correlates with self-reported stress levels and portended prognosis in glioma patients. Collectively, these findings suggest that stress reprograms tumor immune microenvironment by inducing molecularly distinguished monocyte-derived macrophages, revealing potential opportunities for immune-based cancer therapies.", "keywords": [], "year": "2026", "doi": "10.1016/j.ccell.2026.05.018"}, {"pmid": "42204700", "title": "Repeated head impacts establish a senescent cranial bone marrow niche that impairs brain metabolism.", "abstract": "Traumatic brain injury (TBI) of any severity is associated with long-term systemic inflammation and increased risk of peripheral comorbidities, yet the mechanisms driving immune dysregulation and accelerated aging after repeated sub-concussive head impacts remain poorly defined. Here, we investigated the acute and chronic effects of repetitive head impacts (RHI) on distal and proximal bone marrow compartments in the femur and calvaria, respectively. Using a modified weight-drop mouse model delivering rotational and acceleration-deceleration forces (3 hits/week for up to 16 weeks), RHI produced no mortality, skull fracture, hemorrhage, or brain leukocyte infiltration. Bone marrow stem and progenitor cell proliferation, senescence, and output were assessed using flow cytometry, senescence-associated assays, telomere analysis, and secretome profiling. One day after three consecutive impacts, RHI induced robust proliferation of LSK stem/progenitor cells in both femoral and calvarial marrow, evidenced by Ki67 expression, BrdU incorporation, and increased monocyte output. By 8 weeks (24 impacts), injury-induced proliferation subsided and LSK cells exhibited increased senescence-associated &#x3b2;-galactosidase activity and upregulation of tumor suppressor genes. At 16 weeks (48 impacts), LSK populations were depleted at both sites, displaying reduced proliferative capacity, telomere shortening, and pancytopenia in otherwise young adult mice. Calvarial bone marrow cells exposed to RHI released a distinct cytokine and proteomic secretome marked by elevated IL-6, suppressed mitochondrial and metabolic signaling, and enhanced DNA repair pathways. Notably, skull-derived secretome factors impaired cortical and hippocampal mitochondrial metabolism, and reduced microglial mitochondrial membrane potential. Together, these findings identify replicative senescence of the brain-adjacent bone marrow niche as an early and progressive consequence of repeated mild head injury, linking RHI to long-lasting metabolic dysfunction, impaired immunity, and accelerated aging.", "keywords": [], "year": "2026", "doi": "10.1186/s12974-026-03846-8"}, {"pmid": "42165939", "title": "Platelet-rich plasma-primed bone marrow mesenchymal stem cell-derived exosomes inhibit neuronal apoptosis and autophagy, and promote nerve regeneration via the miR-29a-3p/PTEN/PI3K/Akt/mTOR axis after spinal cord injury.", "abstract": "Both platelet-rich plasma (PRP) and exosomes derived from
