33;&#x6027;&#x7387;&#x5dee;&#x5f02;&#x5747;&#x6709;&#x7edf;&#x8ba1;&#x5b66;&#x610f;&#x4e49; ( F = 24.42&#x3001;25.28&#x3001;54.51&#x3001;130.55, P &#x5747;&lt; 0.001)&#x3002;&#x6d41;&#x5f0f;&#x7ec6;&#x80de;&#x672f;&#x68c0;&#x6d4b;&#x7ed3;&#x679c;&#x663e;&#x793a;, 4&#x7ec4;&#x5c0f;&#x9f20;&#x809d;&#x810f;&#x3001;&#x813e;&#x810f;&#x7ec4;&#x7ec7;CD86 + &#x3001;CD206 + &#x5de8;&#x566c;&#x7ec6;&#x80de;&#x6bd4;&#x4f8b;&#x5dee;&#x5f02;&#x5747;&#x6709;&#x7edf;&#x8ba1;&#x5b66;&#x610f;&#x4e49; ( F = 67.98&#x3001;18.41&#x3001;29.77&#x3001;172.80, P &#x5747;&lt; 0.001), &#x5176;&#x4e2d;&#x611f;&#x67d3;21 d&#x7ec4;&#x809d;&#x810f;&#x3001;&#x813e;&#x810f;&#x7ec4;&#x7ec7;CD206 + &#x5de8;&#x566c;&#x7ec6;&#x80de;&#x6bd4;&#x4f8b; [(9.25 &#xb1; 2.55) %&#x3001;(4.22 &#xb1; 0.56) %] &#x8f83;&#x5bf9;&#x7167;&#x7ec4; [(3.83 &#xb1; 0.72) %&#x3001;(0.47 &#xb1; 0.18) %] &#x5747;&#x5347;&#x9ad8; ( P &#x5747;&lt; 0.05)&#x3002;4&#x7ec4;&#x5c0f;&#x9f20;&#x809d;&#x810f;&#x3001;&#x813e;&#x810f;&#x7ec4;&#x7ec7;&#x5de8;&#x566c;&#x7ec6;&#x80de;M1&#x578b; ( IL-1&#x3b2; &#x3001; TNF-&#x3b1; &#x3001; Nos2 ) &#x53ca;M2&#x578b;&#x6807;&#x5fd7;&#x7269; ( Arg1 &#x3001; Chil3 &#x3001; Mrc1 ) mRNA&#x76f8;&#x5bf9;&#x8868;&#x8fbe;&#x91cf;&#x5dee;&#x5f02;&#x5747;&#x6709;&#x7edf;&#x8ba1;&#x5b66;&#x610f;&#x4e49; ( F = 41.30&#x3001;31.82&#x3001;199.33&#x3001;19.96&#x3001;62.01&#x3001;119.76&#x3001;23.67&#x3001;95.90&#x3001;72.27&#x3001;82.59&#x3001;123.41&#x3001;29.75, P &#x5747;&lt; 0.05)&#x3002; &#x7ed3;&#x8bba; &#x5e7f;&#x5dde;&#x7ba1;&#x5706;&#x7ebf;&#x866b;&#x611f;&#x67d3;&#x53ef;&#x81f4;&#x5c0f;&#x9f20;&#x809d;&#x813e;&#x7ec4;&#x7ec7;&#x8fdb;&#x884c;&#x6027;&#x75c5;&#x7406;&#x635f;&#x4f24;, &#x5e76;&#x4f34;&#x968f;&#x5de8;&#x566c;&#x7ec6;&#x80de;&#x6781;&#x5316;&#x7684;&#x52a8;&#x6001;&#x65f6;&#x5e8f;&#x53d8;&#x5316;; &#x611f;&#x67d3;&#x65e9;&#x671f;&#x4ee5;M1&#x578b;&#x4e3a;&#x4e3b;, &#x540e;&#x671f;&#x5411;M2&#x578b;&#x8f6c;&#x53d8;, &#x63d0;&#x793a;M2&#x578b;&#x6781;&#x5316;&#x5728;&#x611f;&#x67d3;&#x540e;&#x671f;&#x53ef;&#x80fd;&#x901a;&#x8fc7;&#x6291;&#x5236;&#x8fc7;&#x5ea6;&#x708e;&#x75c7;&#x53cd;&#x5e94;&#x3001;&#x4fc3;&#x8fdb;&#x7ec4;&#x7ec7;&#x4fee;&#x590d;&#x800c;&#x53c2;&#x4e0e;&#x514d;&#x75ab;&#x8c03;&#x8282;&#x3002;.", "keywords": ["Animals", "Female", "Spleen", "Liver", "Macrophages", "Mice, Inbred BALB C", "Strongylida Infections", "Mice", "Angiostrongylus cantonensis", "Nitric Oxide Synthase Type II"], "year": "2026", "doi": "10.16250/j.32.1915.2025228"}, {"pmid": "42151980", "title": "Innovations in liver disease assessment: clinical insights from spleen stiffness measurement in chronic liver diseases.", "abstract": "Chronic liver diseases are a major global health burden, with cirrhosis and portal hypertension driving morbidity and mortality. Non-invasive assessment of portal hypertension is critical for risk stratification and clinical decision-making. Spleen stiffness measurement (SSM) has emerged as a novel elastography-based biomarker reflecting the hemodynamic consequences of portal hypertension. This review summarizes current evidence on SSM across major chronic liver disease etiologies, including viral hepatitis, metabolic-associated fatty liver disease, and autoimmune liver diseases. We outline the principles and technical evolution of SSM across elastography platforms, including transient elastography, shear-wave elastography, and magnetic resonance elastography. Emerging data indicate that SSM provides incremental value beyond established non-invasive markers such as liver stiffness measurement and platelet count, particularly in refining risk stratification for clinically significant portal hypertension and high-risk varices. SSM may reduce unnecessary endoscopic screening and improve patient selection for therapeutic interventions. This review is based on a structured literature search of PubMed and Web of Science. SSM is a promising non-invasive biomarker with increasing translational relevance in the management of chronic liver diseases. With further standardization and prospective validation, SSM has the potential to support precision risk stratification and guide individualized clinical decision-making.", "keywords": [], "year": "2026", "doi": "10.1186/s12967-026-08244-5"}, {"pmid": "42129788", "title": "Phosphoproteomic analysis reveals differential associations between liver-spleen disharmony and qi-blood deficiency syndromes in chronic fatigue syndrome.", "abstract": "Chronic fatigue syndrome (CFS) is a debilitating disorder characterized by persistent fatigue that is not alleviated by rest and is often accompanied by multiple somatic symptoms. The etiology of CFS remains poorly understood, and conventional Western medicine offers limited effective targeted therapies. In contrast, Traditional Chinese Medicine (TCM), which utilizes pattern differentiation-particularly the Liver-Spleen Disharmony Pattern (LSDP) and the Qi-Blood Deficiency Pattern (QBDP)-has demonstrated clinical efficacy in managing CFS. However, the molecular mechanisms underpinning TCM pattern classification in CFS remain largely unexplored. A total of 30 participants were enrolled in this study, including 10 CFS patients with LSDP, 10 CFS patients with QBDP, and 10 age- and sex-matched healthy controls (HC). Serum phosphoproteomic profiling was conducted using liquid chromatography-tandem mass spectrometry (LC-MS/MS), which incorporated data-dependent acquisition (DDA) for spectral library construction and data-independent acquisition (DIA) for label-free quantification. Differentially phosphorylated sites (DPSs) and proteins (DPPs) were identified with thresholds of absolute fold change (|FC|)&#x2009;&#x2265;&#x2009;1.2 and a Benjamini-Hochberg (BH)-corrected false discovery rate (FDR)&#x2009;&lt;&#x2009;0.05. Principal component analysis (PCA) was employed to assess global differences in phosphorylation profiles across groups, and functional enrichment analyses were performed to elucidate the biological functions of differential molecules. PCA revealed distinct clustering of phosphoproteomic profiles among the three groups, with high consistency across biological replicates (PC1 explained 19.3% of the total variance, and PC2 explained 15.9%). A total of 849 non-redundant DPSs and 586 non-redundant DPPs were identified across the three pairwise comparisons. The HC vs. LSDP comparison yielded the highest number of differential molecules (406 DPSs and 351 DPPs), with a balanced distribution of upregulated and downregulated events. In contrast, the HC vs. QBDP comparison was dominated by phosphorylation upregulation (61.2% of DPSs), while the QBDP vs. LSDP comparison showed a higher proportion of downregulated DPSs (56.7%). Functional enrichment analysis indicated that upregulated DPPs in the HC vs. LSDP comparison were primarily involved in MAPK signaling and cytoskeletal remodeling, while downregulated DPPs were enriched in pathways associated with neurodegenerative diseases and nucleocytoplasmic transport. Notably, we identified a candidate differential phosphorylation site, DENND3 S472 (S472@DENND3_HUMAN), with moderate discriminatory power (raw p&#x2009;=&#x2009;0.042, BH-corrected FDR&#x2009;&lt;&#x2009;0.05, AUC&#x2009;=&#x2009;0.72). This exploratory study identified significant differences in serum phosphoproteomic profiles between CFS patients with LSDP and QBDP. The distinct phosphoproteomic signatures observed in LSDP and QBDP provide preliminary molecular evidence supporting TCM pattern differentiation in CFS. These findings enhance the understanding of CFS pathogenesis and lay the groundwork for precision-based TCM diagnosis and individualized therapeutic strategies for CFS.", "keywords": ["Humans", "Fatigue Syndrome, Chronic", "Proteomics", "Male", "Female", "Phosphoproteins", "Adult", "Liver", "Spleen", "Phosphorylation", "Middle Aged", "Case-Control Studies"], "year": "2026", "doi": "10.1186/s12967-026-08157-3"}, {"pmid": "42069604", "title": "Myeloperoxidase regulates hypoxia-induced inflammation and oxidative stress in liver-spleen axis.", "abstract": "High-altitude hypobaric hypoxia induces inflammation and oxidative stress, yet the role of myeloperoxidase (MPO) in this pathology remains incompletely understood. This study aimed to investigate whether MPO mediates injury to the liverspleen axis under hypoxic conditions. Using a 3day murine hypoxia model, we unexpectedly found that MPO deficiency exacerbated, rather than mitigated, damage to the liverspleen axis. Compared with hypoxic wildtype mice, MPO -/- mice displayed aggravated histopathological injury, accompanied by excessive phagocyte recruitment and elevated expression of key chemokines (KC, MCP1, MIP2) and proinflammatory mediators (TNF&#x3b1;, IL1&#x3b2;, IL17A). At the molecular level, MPO absence increased splenic protein expression of NF&#x3ba;B, NLRP3, and iNOS, while dysregulating the antioxidant response via the NRF2/HO1 pathway. These results reveal a novel protective role for MPO during hypoxic stress, where it functions to moderate the innate immune response and limit collateral tissue damage in the liverspleen axis. The study provides new insights into the complex immunomodulatory functions of MPO and suggests its activity is essential for maintaining immune homeostasis during acute hypoxia.", "keywords": [], "year": "2026", "doi": "10.1186/s12950-026-00503-y"}, {"pmid": "42013842", "title": "Spleen-targeted neoantigen mRNA vaccine induces ISG15 + CD8 + T cell-mediated tertiary lymphoid structure formation in hepatocellular carcinoma.", "abstract": "The efficacy of neoantigen vaccine for advanced hepatocellular carcinoma (HCC) is limited largely due to insufficient T cell mobilization and activation. Herein, we develop a spleen-targeted neoantigen mRNA vaccine (STNvac) with highly efficient spleen-selective mRNA transfection. Using a three-dose vaccination regimen, STNvac demonstrates remarkable therapeutic efficacy in orthotopic HCC model with a high likelihood of complete tumor regression and significantly improved survival rates (p &lt; 0.0001). Notably, we identify a distinct ISG15 + CD8 + T cell population as crucial mediators of STNvac-induced immunity with potent antigen-processing and cytotoxic capacities. Intriguingly, STNvac promotes the formation of tertiary lymphoid structures (TLSs) through GZMA-F2R-mediated interactions between ISG15 + CD8 + T cells and antigen-presenting cells (APCs), which is also confirmed in HCC patients. Taken together, our findings demonstrate the potent antitumor efficacy of spleen-targeted mRNA vaccine and reveal its underlying immune cell interactive mechanisms, presenting high potential for clinical translation.", "keywords": ["Carcinoma, Hepatocellular", "Liver Neoplasms", "Animals", "Humans", "Spleen", "CD8-Positive T-Lymphocytes", "Cytokines", "Ubiquitins", "Cancer Vaccines", "Tertiary Lymphoid Structures", "Cell Line, Tumor", "Antigens, Neoplasm", "Female", "mRNA Vaccines", "Mice", "RNA, Messenger", "Male", "Mice, Inbred C57BL"], "year": "2026", "doi": "10.1016/j.xcrm.2026.102754"}, {"pmid": "41953251", "title": "Post Hoc Analysis of a Phase 2 Randomized Trial of Pemafibrate in Metabolic Dysfunction-associated Steatotic Liver Disease: Associations With Platelet Count, Liver Stiffness, and Spleen Volume.", "abstract": "Portal hypertension is a major complication in metabolic dysfunction-associated steatotic liver disease (MASLD). In the PEMA-FL (PEMAfibrate randomised placebo-controlled study in patients with non-alcoholic fatty liver disease) phase 2 trial, this post hoc analysis examined associations between pemafibrate, a selective peroxisome proliferator-activated receptor alpha modulator, and noninvasive markers related to portal hypertension-related hemodynamic stress, including platelet count, liver stiffness, and spleen volume. This 72-week, multicenter, randomized, double-blind, placebo-controlled phase 2 study enrolled 118 patients with high-risk MASLD, randomized 1:1 to pemafibrate 0.4 mg/day or placebo. Platelet count, liver stiffness, and spleen volume were assessed at baseline and during follow-up. Percent changes and parameter associations were evaluated in an exploratory post hoc analysis. Pemafibrate administration was associated with an early and sustained increase in platelet count during follow-up. Liver stiffness showed a gradual decline from week 24 in the pemafibrate group and stabilized after week 48. At week 72, spleen volume decreased in the pemafibrate group, whereas no reduction was observed in the placebo group. In patients with metabolic dysfunction-associated steatohepatitis (MASH), changes in platelet count, liver stiffness, and spleen volume were more pronounced than in those without MASH. At week 72, changes in spleen volume correlated positively with changes in liver stiffness and negatively with platelet count, with a stronger association observed for liver stiffness. In contrast, platelet count changes did not correlate with liver stiffness. In this exploratory post hoc analysis, pemafibrate was associated with sustained increases in platelet count and reductions in spleen volume in patients with MASLD, accompanied by a decline in liver stiffness. While platelet count changes likely reflect mechanisms independent of portal pressure, concordant changes in spleen volume and liver stiffness may represent a coherent noninvasive signal of improvement in portal hypertension-related hemodynamic stress. These hypothesis-generating findings warrant prospective validation using direct hemodynamic assessments and clinical outcomes in MASLD/MASH. ClinicalTrials.gov identifier: NCT03350165.", "keywords": [], "year": "2026", "doi": "10.1016/j.jceh.2026.103525"}, {"pmid": "41859486", "title": "Spleen Size may Also be an Important Prognostic Indicator of Liver-Related Outcomes in Metabolic-Dysfunction-Associated Steatotic Liver Disease Patients Without Clinically Significant Portal Hypertension.", "abstract": "", "keywords": [], "year": "2026", "doi": "10.1016/j.jceh.2026.103522"}, {"pmid": "41828682", "title": "Splenic Macrophage Activation and Disordered Heme-Iron Metabolism in a Mouse Model of Acute Hepatic Encephalopathy.", "abstract": "Hepatic encephalopathy is a severe complication of liver failure, traditionally investigated through brain-liver interactions; however, the involvement of extrahepatic organs remains poorly understood. This study examined splenic histopathological changes in a mouse model of acute hepatic encephalopathy induced by ammonium acetate administration, focusing on iron metabolism and macrophage activation. Although conventional hematoxylin and eosin staining revealed no overt structural abnormalities, unstained spleen sections demonstrated abundant black deposits, predominantly in the red pulp. Prussian blue staining confirmed a significant increase in hemosiderin-positive cells; however, a subset of black deposits was iron-negative. Immunohistochemical analyses revealed that these iron-negative pigments were localized within F4/80-positive macrophages and colocalized with heme oxygenase-1 (HO-1), suggesting enhanced heme degradation. Ultrastructural observations further identified electron-dense granules consistent with hematin accumulation in splenic macrophages. Hematological analyses revealed significant reductions in red blood cell count and hemoglobin levels, indicating accelerated erythrocyte destruction. Collectively, these findings demonstrate that acute hepatic encephalopathy induces splenic macrophage activation, accompanied by disordered iron metabolism and hematin accumulation. This study highlights the spleen as a previously underappreciated extrahepatic organ involved in the pathophysiology of hepatic encephalopathy and suggests that splenic heme-iron handling may represent a novel therapeutic target.", "keywords": ["Animals", "Spleen", "Mice", "Iron", "Disease Models, Animal", "Macrophages", "Macrophage Activation", "Heme", "Hepatic Encephalopathy", "Male", "Acetates"], "year": "2026", "doi": "10.3390/ijms27052463"}, {"pmid": "41819396", "title": "Serial comparative transcriptomics reveals dynamic and coordinated immune-metabolic responses in the liver-spleen axis of Oplegnathus punctatus to Edwardsiella piscicida infection.", "abstract": "Oplegnathus punctatus is a high-value marine fish in aquaculture, yet its production is severely threatened by pathogen infections such as Edwardsiella piscicida (the old name called as Edwardsiellatarda). Understanding the systemic host response is essential for developing effective control strategies. This study investigated the dynamic and coordinated immune-metabolic reactions in the liver and spleen of O. punctatus following E. piscicida infection. Serial transcriptomic analyses of liver and spleen were conducted at 0, 12, 24, 48, 72&#xa0;h post-infection (hpi). Results revealed that the spleen initiated rapid innate immune activation at 12 hpi, while the liver underwent persistent metabolic reprogramming and prioritizing protein synthesis while suppressing small-molecule metabolism. Weighted gene co-expression network analysis (WGCNA) further identified time-specific modules, that was, the midnightblue module (12 hpi) in the spleen was enriched for cytokine and pattern recognition receptor pathways, and the white module (72 hpi) in the liver linked metabolic processes with complement cascade. A core set of 218 genes was co-regulated in both tissues, primarily involved in antigen presentation and ubiquitination. These findings demonstrate that the liver and spleen form a functionally integrated immunometabolic axis, which coordinates temporally organized defense against E. piscicida. This work provides novel insights into systemic immunity in teleosts and supports the development of targeted health management strategies to enhance disease resistance in O. punctatus.", "keywords": ["Animals", "Fish Diseases", "Enterobacteriaceae Infections", "Edwardsiella", "Liver", "Spleen", "Immunity, Innate", "Perciformes", "Transcriptome", "Gene Expression Profiling"], "year": "2026", "doi": "10.1016/j.fsi.2026.111252"}], "pubmed_query": "(\"liver\"[Title] OR \"hepatic\"[Title] OR \"hepatocyte\"[Title] OR \"hepatocellular\"[Title] OR \"nonalcoholic fatty liver\"[Title] OR \"NAFLD\"[Title] OR \"NASH\"[Title]) AND (\"spleen\"[Title] OR \"splenic\"[Title] OR \"splenomegaly\"[Title] OR \"lymphoid organ\"[Title] OR \"immune organ\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Muscle__Pancreas", "source": "Muscle", "target": "Pancreas", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: Insulin\nNotes: Insulin form Pancreas directly influences glucose uptake by GLUT4.\nSources:\n- doi: 10.4331/wjbc.v11.i3.76.\n- doi: 10.1074/jbc.REV119.008351", "connection_type": "Hormonal connection", "key_players": ["Insulin"], "key_players_metabolites": ["glucose", "glycogen", "atp", "glycerol", "fatty acids", "cholesterol", "fatty acid", "serine", "amp", "adp", "lactate", "pyruvate", "ffa", "bile acids", "amino acids", "amino acid", "glucose-6-phosphate", "free fatty acid", "glutamate", "free fatty acids", "lipoprotein", "nadh", "palmitate", "leucine", "triglycerides", "fructose", "methionine", "hdl", "arginine", "acetate", "triglyceride", "glutamine", "alanine", "glycerol-3-phosphate", "citrate", "nefa", "creatine", "acetyl-coa", "isoleucine", "isocitrate", "ldl", "prostaglandin", "malate", "creatinine", "ceramide", "nadph"], "key_players_hormones": ["insulin", "il-6", "glucagon", "tnf", "vitamin d", "irisin", "glp-1", "tumor necrosis factor", "interleukin-6", "epinephrine", "leptin", "amylin", "testosterone", "igf-1", "osteocalcin", "thyroid hormone", "il-1beta", "thyroid hormones", "il6", "adiponectin", "adrenaline", "somatostatin", "natriuretic peptide", "interleukin-1", "tnf-alpha", "growth hormone", "estrone", "noradrenaline", "estrogen", "t3", "prolactin"], "key_players_proteins": ["akt", "insulin receptor", "ampk", "glut4", "irs-1", "pkm2", "mtor", "jnk", "pgc-1alpha", "ucp2", "irs-2", "acc", "foxo1", "mtorc1", "fas", "sglt2", "erk1", "erk2", "hk2", "tfam", "glut1", "pi3k", "glp-1 receptor", "cox-2", "hexokinase", "irs2", "ucp1", "mapk", "p38", "pfk", "irs1", "atgl"], "key_players_counts_metabolites": {"methionine": 3, "cholesterol": 17, "glycerol-3-phosphate": 2, "amp": 13, "glycogen": 81, "palmitate": 4, "citrate": 2, "atp": 37, "bile acids": 9, "hdl": 3, "acetyl-coa": 1, "amino acids": 8, "glucose": 594, "isoleucine": 1, "fatty acid": 15, "glutamate": 5, "leucine": 4, "isocitrate": 1, "ldl": 1, "lactate": 11, "free fatty acids": 5, "prostaglandin": 1, "arginine": 3, "pyruvate": 10, "nefa": 2, "free fatty acid": 6, "amino acid": 7, "malate": 1, "creatinine": 1, "lipoprotein": 5, "ceramide": 1, "glycerol": 29, "triglycerides": 4, "ffa": 10, "acetate": 3, "creatine": 2, "triglyceride": 3, "fatty acids": 21, "fructose": 4, "nadh": 5, "glucose-6-phosphate": 7, "adp": 13, "glutamine": 3, "nadph": 1, "serine": 15, "alanine": 3}, "key_players_counts_hormones": {"thyroid hormone": 2, "tnf": 15, "testosterone": 4, "natriuretic peptide": 1, "il-1beta": 2, "interleukin-1": 1, "glucagon": 20, "igf-1": 4, "osteocalcin": 3, "tnf-alpha": 1, "growth hormone": 1, "thyroid hormones": 2, "il6": 2, "estrone": 1, "noradrenaline": 1, "estrogen": 1, "adiponectin": 2, "insulin": 932, "t3": 1, "vitamin d": 12, "adrenaline": 2, "tumor necrosis factor": 8, "irisin": 12, "epinephrine": 5, "leptin": 5, "glp-1": 12, "il-6": 27, "prolactin": 1, "somatostatin": 2, "amylin": 5, "interleukin-6": 7}, "key_players_counts_proteins": {"irs2": 1, "ucp1": 1, "mapk": 1, "hk2": 3, "jnk": 6, "pi3k": 2, "foxo1": 4, "mtorc1": 4, "p38": 1, "ucp2": 5, "glut4": 22, "fas": 4, "irs-2": 5, "tfam": 3, "sglt2": 4, "glut1": 3, "glp-1 receptor": 2, "insulin receptor": 29, "pfk": 1, "akt": 34, "irs-1": 19, "cox-2": 2, "irs1": 1, "erk1": 4, "ampk": 23, "acc": 5, "hexokinase": 2, "pgc-1alpha": 6, "mtor": 7, "pkm2": 19, "erk2": 4, "atgl": 1}, "notes": "Insulin form Pancreas directly influences glucose uptake by GLUT4.", "sources": ["doi: 10.4331/wjbc.v11.i3.76.", "doi: 10.1074/jbc.REV119.008351"], "ai_description": "The Muscle-Pancreas axis is a critical inter-organ communication network where skeletal muscle plays a vital role in regulating pancreatic function and metabolism [2]. The release of myokines, such as fibroblast growth factor 21 (FGF21) and irisin, from skeletal muscle stimulates the pancreas to produce hormones that regulate glucose and lipid metabolism [3]. In response, the pancreas produces incretins, such as GLP-1 and GIP, which stimulate insulin secretion in the liver and peripheral tissues [4]. Disruption of this axis, as seen in pancreatic cancer, can lead to muscle wasting and impaired pancreatic function, contributing to disease progression [5].\n\nNote: I've focused on the most important signalling molecules and mechanisms, such as myokines, incretins, and their interactions with the pancreas and skeletal muscle.", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42325217", "title": "Computed Tomography-Based Assessment of Sarcopenia and Disease Progression in Pancreatic Ductal Adenocarcinoma: A Radiomics and Machine Learning Approach.", "abstract": "Sarcopenia is a known negative prognostic factor in oncology and is frequently observed in patients with pancreatic ductal adenocarcinoma (PDAC). Computed tomography (CT) enables longitudinal muscle assessment and may provide additional prognostic information. This study aims to assess their association with prognosis in pancreatic cancer and explore the diagnostic and prognostic value of CT radiomics. A retrospective single-center study included 62 patients with primary PDAC who underwent at least three abdominal CT scans: baseline (t0), 3 months (t1), 6 months (t2), and, in 35 patients, 12 months (t3). CT-based sarcopenia was assessed using the psoas muscle index (PMI) based on reference cutoffs and cohort-specific sex-specific quartiles. Skeletal muscles at the L3 level were semi-automatically segmented. Radiomic features of the psoas were extracted and analyzed using k-nearest neighbor, decision tree, and random forest models. Prognostic relevance was evaluated using logistic regression and feature selection via least absolute shrinkage and selection operator (LASSO) regression. Tumor progression was assessed radiologically according to RECIST 1.1 criteria. CT-based sarcopenia prevalence was 45.3% using reference-based PMI thresholds. PMI declined significantly from baseline to t1 and remained stable thereafter, with women exhibiting consistently lower values. Outcome analysis showed a higher proportion of disease progression at t1 in sarcopenic patients using reference cutoffs, whereas cohort-specific quartiles demonstrated no consistent differences. Random forest models predicted sarcopenia with up to 0.73 accuracy and receiver operating characteristics area under the curve (ROC-AUC) of 0.81. LASSO regression identified the psoas short axis and cross-sectional area as the most informative features. Logistic regression using baseline radiomic features predicted disease progression status at 12 months with 0.85 accuracy, weighted F 1 0.841, and AUC 0.823. Interobserver agreement for psoas measurements was high (r = 0.86). Longitudinal CT-based assessment of PMI demonstrates progressive sarcopenia within the studied PDAC cohort, with sex-specific declines. Radiomic analysis of skeletal muscle provides complementary information and predictive insights, highlighting their potential to enhance the characterization of muscle status and its association with disease course in patients able to undergo repeated imaging.", "keywords": [], "year": "2026", "doi": "10.14740/gr2132"}, {"pmid": "42103970", "title": "Impact of preoperative skeletal muscle mass on the healing time of postoperative pancreatic fistula after pancreaticoduodenectomy.", "abstract": "Postoperative pancreatic fistula (POPF) is a serious complication following pancreaticoduodenectomy (PD). While numerous studies have investigated POPF incidence and risk factors, few have focused on POPF healing time (POPF-HT). Skeletal muscle mass has been increasingly recognized as an endocrine organ involved in interorgan communication. The aim of this study was to evaluate how skeletal muscle mass influenced the healing time of POPF after PD. This investigation included patients who developed POPF of grade B-C after PD with pancreaticojejunostomy during the study period. POPF-HT was defined as the duration from the date of PD to the removal of all drains placed for POPF treatment. Skeletal muscle mass was assessed based on preoperative computed tomography images. Clinical factors associated with POPF-HT were analyzed, including skeletal muscle index (SMI). The mean POPF-HT was 40&#x2009;&#xb1;&#x2009;15 days (median: 37 days; range: 21-105 days). Compared to those with high SMI, patients with low SMI had a significantly longer POPF-HT (46&#x2009;&#xb1;&#x2009;18 days vs. 37&#x2009;&#xb1;&#x2009;11 days, p&#x2009;=&#x2009;0.0101). In univariate analysis, low SMI was significantly associated with prolonged POPF-HT (hazard ratio: 0.5655, 95% confidence interval: 0.3687-0.8673, p&#x2009;=&#x2009;0.0090). Kaplan-Meier curves confirmed that patients with low SMI exhibited significantly delayed cumulative POPF healing (p&#x2009;=&#x2009;0.0065). Decreased skeletal muscle mass is significantly associated with prolonged POPF-HT after PD. Therefore, preoperative SMI may serve as a potentially modifiable factor associated with POPF-HT.", "keywords": [], "year": "2026", "doi": "10.1007/s00423-026-04029-y"}, {"pmid": "42084250", "title": "Serum Biomarkers and CT-Derived Muscle Indices in Sarcopenia Associated with Pancreatic Neoplasm: A Comparative Clinical Study.", "abstract": "Background: Sarcopenia is a frequent and clinically relevant condition in patients with pancreatic neoplasm, contributing to poor prognosis, reduced therapeutic tolerance, and increased mortality. The identification of reliable circulating biomarkers, alongside imaging-based muscle assessment, may improve early detection and risk stratification. Methods: This randomized prospective study included 61 patients, of whom 36 had pancreatic neoplasm associated with sarcopenia and 25 served as controls. Serum levels of osteonectin (SPARC), C-terminal agrin fragment (CAF), procollagen type III N-terminal peptide (P3NP), myostatin (MSTN), and insulin-like growth factor-1 (IGF-1) were measured using ELISA. Skeletal muscle index (SMI) and psoas muscle index (PMI) were assessed using CT at the L3 level. Results: Patients with pancreatic neoplasm and sarcopenia showed significantly altered biomarker profiles compared to controls. Osteonectin (median 936.4 vs. 539.9, p 0.001), CAF (2135.9 vs. 1165.5, p 0.001), P3NP (8.01 vs. 5.34, p 0.001), myostatin (47.71 vs. 7.85, p 0.001), and IGF-1 (142 vs. 106.7, p 0.001) were all elevated. The highest biomarker levels were consistently observed in the pancreatic neoplasm group compared to other disease groups. Additionally, 100% of patients with pancreatic neoplasm exhibited reduced SMI, confirming the high prevalence of sarcopenia. Biomarker levels were not significantly influenced by tumor location. Conclusions: The combined use of circulating biomarkers and CT-derived muscle indices provides a clinically relevant approach for identifying sarcopenia in pancreatic cancer.", "keywords": ["Humans", "Sarcopenia", "Biomarkers", "Female", "Male", "Pancreatic Neoplasms", "Prospective Studies", "Osteonectin", "Procollagen", "Aged", "Tomography, X-Ray Computed", "Myostatin", "Insulin-Like Growth Factor I", "Middle Aged", "Peptide Fragments", "Predictive Value of Tests", "Prognosis"], "year": "2026", "doi": "10.21614/chirurgia.3291"}, {"pmid": "42039130", "title": "Effects of polycystic ovary syndrome on liver, heart, muscle, and pancreatic-related diseases.", "abstract": "PCOS is far more than an ovarian disorder; it is a systemic metabolic crisis affecting 11-13% of women. This review maps its extra-ovarian reach into the liver, heart, muscle, and pancreas. We analyzed how the \"pathophysiological quartet\"-insulin resistance, hyperandrogenism, inflammation, and oxidative stress-coordinates systemic damage. PCOS prevalence skyrockets to 28.3% in women with obesity. Key findings include a 51.61% prevalence of MASLD in obese patients and a 2-4 fold increase in cardiovascular and type 2 diabetes risk. These manifestations are rooted in a shared metabolic \"soil,\" creating a vicious cycle of androgen excess and multi-organ dysfunction, including sarcopenia and &#x3b2;-cell exhaustion. Fragmented care is insufficient. The systemic nature of PCOS demands a paradigm shift toward integrated, multidisciplinary management, treating the patient as a metabolic whole.", "keywords": ["Humans", "Female", "Polycystic Ovary Syndrome", "Pancreatic Diseases", "Insulin Resistance", "Liver Diseases", "Animals", "Muscular Diseases", "Obesity"], "year": "2026", "doi": "10.3389/fendo.2026.1776584"}, {"pmid": "41808999", "title": "Pancreatic cancer-associated organ dysfunction promotes muscle autophagy and contributes to peripheral tissue wasting.", "abstract": "Normal pancreas function supports both digestion and the hormonal regulation of whole-body metabolism. We find pancreatic ductal adenocarcinoma (PDAC) disrupts the normal function of the remaining pancreas, leading to altered systemic metabolism and peripheral tissue wasting that begins early in disease progression. Using mouse models of PDAC, we find small pancreas tumors lead to both endocrine and exocrine pancreatic dysfunction that results in systemic nutrient depletion and loss of both muscle and fat tissue. Providing free glucose in the diet that is absorbed despite pancreatic exocrine dysfunction causes hyperglycemia and blunts fat wasting without affecting muscle loss. Muscle mass can be restored by free dietary amino acids or pancreatic enzyme supplementation. Exocrine dysfunction causing reduced dietary protein digestion promotes muscle proteolysis and autophagy. Autophagy is a major driver of muscle wasting in PDAC, as muscle-specific deletion of the core autophagy gene Atg7 also reduces muscle wasting. Disrupting muscle autophagy without restoring systemic nutrition slows tumor growth and improves survival of mice with PDAC. Tracing the fate of amino acids released from muscle of mice with PDAC shows redistribution to both tumor and host tissues. Notably, improving nutrition in mice with disrupted muscle autophagy promotes tumor growth. Together, the data argue that early peripheral tissue wasting associated with early pancreatic cancer is driven by altered normal pancreatic organ function that leads to reduced nutrition and enhanced muscle autophagy, releasing nutrients to support both tumor and host metabolism.", "keywords": [], "year": "2026", "doi": "10.64898/2026.02.27.708635"}, {"pmid": "41591818", "title": "Fiber-type vulnerability and proteostasis reprogramming in skeletal muscle during pancreatic cancer cachexia.", "abstract": "Cachexia is a debilitating syndrome characterized by progressive skeletal muscle wasting, commonly affecting patients with cancer, particularly those with pancreatic cancer. Despite its clinical significance, the molecular mechanisms underlying cancer cachexia remain poorly understood. In this study, we utilized single-nucleus RNA-seq (snRNA-seq) and bulk RNA-seq, complemented by biochemical and histological analyses, to investigate molecular alterations in the skeletal muscle of the KPC mouse model of pancreatic cancer cachexia. Our findings demonstrated that KPC tumor growth induced myofiber-specific changes in the expression of genes involved in proteolytic pathways, mitochondrial biogenesis, and angiogenesis. Notably, tumor progression enhanced the activity of specific transcription factors that regulate the mTORC1 signaling pathway, along with genes involved in translational initiation and ribosome biogenesis. Skeletal muscle-specific, inducible inhibition of mTORC1 activity further exacerbated muscle loss in tumor-bearing mice, highlighting its protective role in maintaining muscle mass. Additionally, we uncovered new intercellular signaling networks within the skeletal muscle microenvironment during pancreatic cancer-induced cachexia. Our study reveals previously unrecognized molecular mechanisms that regulate skeletal muscle homeostasis, and it identifies potential therapeutic targets for the treatment of pancreatic cancer-associated cachexia.", "keywords": ["Animals", "Cachexia", "Pancreatic Neoplasms", "Mice", "Proteostasis", "Muscle, Skeletal", "Mechanistic Target of Rapamycin Complex 1", "Disease Models, Animal", "Signal Transduction", "Male", "Humans", "Muscle Fibers, Skeletal"], "year": "2026", "doi": "10.1172/jci.insight.200396"}, {"pmid": "41583344", "title": "Association between spontaneous neurogenic atrophy of the femoral muscle and islet cell tumors in aged F344 rats.", "abstract": "In aged F344/DuCrlCrlj rats, we observed that all animals with group atrophy of the biceps femoris muscle also had islet cell tumors, suggesting that spontaneous islet cell tumors may induce peripheral neuropathy and muscle atrophy. Among 220 aged male F344/DuCrlCrlj rats examined, 12.3% (27/220) had islet cell tumors, and of these, 22.2% (6/27) had neurogenic muscular atrophy. Sciatic nerve degeneration was observed in 3.2% (7/220) of cases, and all animals with neurogenic muscular atrophy had sciatic nerve degeneration. Notably, no neurogenic muscular atrophy was observed in rats without islet cell tumors. In contrast, rats with neurogenic muscular atrophy tended to have larger islet cell tumors. Although spinal nerve root degeneration was prevalent (90.8%, 198/218), two of the six rats with neurogenic muscular atrophy did not exhibit this pathology. Immunohistochemically, insulin was positive in all islet cell tumors, although glucagon- and somatostatin-positive reactions showed no association with neurogenic muscular atrophy. Experimentally induced hyperinsulinemia in rats is a known cause of neurogenic muscular atrophy, and similar associations have been reported in humans and spontaneous cases of pet rats with islet cell tumors. A complete coincidence between the occurrence of neurogenic muscular atrophy and islet cell tumors in our investigation suggests that some islet cell tumors in F344/DuCrlCrlj rats may be functionally active, and that hyperinsulinemia may contribute to the pathogenesis of neurogenic muscular atrophy.", "keywords": [], "year": "2026", "doi": "10.1293/tox.2025-0016"}, {"pmid": "41525104", "title": "Ablation of tumor-derived IGFBP-3 attenuates cancer-associated skeletal muscle wasting in murine pancreatic cancer.", "abstract": "Pancreatic ductal adenocarcinoma (PDAC) is the fourth leading cause of cancer-related deaths, and its incidence is expected to rise. Skeletal muscle wasting (SMW) is a debilitating comorbidity of PDAC with unknown etiology. Previously, our lab demonstrated that systemic increases in insulin-like growth factor-binding protein-3 (IGFBP-3) are associated with SMW and pathologic myocellular lipid accumulation in an orthotopic murine model of PDAC [ Ptf1a tm1-cre/+ ; Kras tm4Tyj ; Muc1 -/- (KCKO)]. Here we show that PDAC tumor cells secrete high levels of IGFBP-3 and that genetic ablation of IGFBP-3 (IGFBP-3 -/- ) in the KCKO and Ptf1a tm1(cre)Cvw/WT ; Kras tm4Tyj/WT ; Trp53 tm5Tyj/tm5Tyj (KP2) orthotopic models of PDAC increases survival by at least 30 days in both models without affecting tumor progression. Mice with IGFBP-3 -/- tumors lost 10- and 3-fold less appendicular lean mass, and experienced a five- and sixfold decrease in myocellular lipid accumulation versus mice with parental KCKO and KP2 tumors, respectively, at failure to thrive endpoints. Gene expression studies demonstrated increases in the ubiquitin-proteasome pathway ( fbxo32 and trim32 ), autophagy (ULK1 and LC3bII), and transforming growth factor-&#x3b2; receptor (TGF-&#x3b2;R) signaling ( tgf&#x3b2;r1 and FoxO1) in skeletal muscle of mice inoculated with parental PDAC tumors, which was absent in mice with IGFBP-3 -/- tumors. In vitro studies confirmed a role for IGFBP-3 in stimulating TGF-&#x3b2; receptors and regulating SMAD3 nuclear localization. Moreover, IGFBP-3 deletion in tumor cells and small molecule inhibition of TGF-&#x3b2;R1/2 attenuated myotube wasting. Collectively, these results suggest that PDAC-derived IGFBP-3 promotes SMW via noncanonical binding of TGF-&#x3b2;Rs, warranting formal investigation of IGFBP-3 as a potential therapeutic target for PDAC-related SMW through a novel pathway. NEW &amp; NOTEWORTHY The mechanism underlying PDAC-associated SMW is not well understood but has been connected to increases in systemic IGFBP-3 to supraphysiologic levels, resulting in dysregulated protein synthesis and catabolism signaling. Here, we show that genetic deletion of IGFBP-3 in orthotopic PDAC tumors significantly improves survival and muscle phenotypes in mice. Molecular studies suggest the role for noncanonical IGFBP-3 signaling through TGF-&#x3b2; receptors. Thus, IGFBP-3 may be a therapeutic target in the treatment of PDAC-related SMW.", "keywords": ["Animals", "Insulin-Like Growth Factor Binding Protein 3", "Muscle, Skeletal", "Pancreatic Neoplasms", "Mice", "Mice, Knockout", "Carcinoma, Pancreatic Ductal", "Signal Transduction", "Cell Line, Tumor", "Muscular Atrophy", "Cachexia", "Humans"], "year": "2026", "doi": "10.1152/ajpcell.00421.2025"}, {"pmid": "41249735", "title": "The canonical ER stress IRE1&#x3b1;/XBP1 pathway mediates skeletal muscle wasting during pancreatic cancer cachexia.", "abstract": "Cancer cachexia is a debilitating syndrome characterized by the progressive loss of skeletal muscle mass with or without fat loss. Recent studies have implicated dysregulation of the endoplasmic reticulum (ER) stress-induced unfolded protein response (UPR) pathways in skeletal muscle under various conditions, including cancer. In this study, we demonstrate that the IRE1&#x3b1;/XBP1 branch of the UPR promotes activation of the ubiquitin-proteasome system, autophagy, JAK-STAT3 signaling, and fatty acid metabolism in the skeletal muscle of the KPC mouse model of pancreatic cancer cachexia. Moreover, we show that the IRE1&#x3b1;/XBP1 pathway is a key contributor to muscle wasting. Skeletal muscle-specific deletion of the XBP1 transcription factor significantly attenuates tumor-induced muscle atrophy. Mechanistically, transcriptionally active XBP1 binds to the promoter regions of genes such as Map1lc3b, Fbxo32, and Il6, which encode proteins known to drive muscle proteolysis. Pharmacological inhibition of IRE1&#x3b1; using 4&#xb5;8C in KPC tumor-bearing mice attenuates cachexia-associated molecular changes and improves muscle mass and strength. Collectively, our findings suggest that targeting IRE1&#x3b1;/XBP1 pathway may offer a therapeutic strategy to counteract muscle wasting during pancreatic cancer-induced cachexia.", "keywords": ["Animals", "Cachexia", "Endoribonucleases", "X-Box Binding Protein 1", "Protein Serine-Threonine Kinases", "Endoplasmic Reticulum Stress", "Pancreatic Neoplasms", "Mice", "Muscle, Skeletal", "Signal Transduction", "Unfolded Protein Response", "Muscular Atrophy", "Disease Models, Animal", "Humans", "Autophagy"], "year": "2025", "doi": "10.1038/s44321-025-00337-w"}, {"pmid": "41140072", "title": "Spexin as a metabolic regulatory peptide in liver, adipose tissue, skeletal muscle, and pancreas: evidence from animal models and human studies.", "abstract": "The prevalence of metabolic diseases is increasing worldwide. The identification of novel biomarkers and peptides is one approach to diagnosing and treating such disorders. Spexin is a relatively new peptide hormone that plays a pivotal role in energy metabolism. The prominent role of spexin in obesity, non-alcoholic fatty liver disease, diabetes, and insulin resistance has been established. This mini-review summarizes recent findings on the physiological and potential therapeutic roles of spexin in metabolic disorders. A targeted literature review of scientific sources was conducted using PubMed, Scopus, and Web of Science databases. The search focused on published experimental and clinical studies on the metabolic effects of spexin in the liver, adipose tissue, skeletal muscle, and pancreas. This peptide regulates energy homeostasis by affecting the metabolism of specific tissues. Spexin reduces hepatic fat accumulation by modulating lipogenesis and &#x3b2;-oxidation. In adipose tissue, spexin modulates adipocyte differentiation by enhancing lipolysis and inhibiting lipogenesis. In skeletal muscle, it is effective in increasing glucose uptake by upregulating glucose transporter 4. Spexin also affects insulin secretion and regulates &#x3b2;-cell function in the pancreas. Although studies on the physiological and therapeutic effects of spexin are ongoing, current evidence highlights its involvement in metabolic regulation. Further research is required to clarify the mechanisms and therapeutic potential of this pathway in metabolic diseases.", "keywords": ["Humans", "Adipose Tissue", "Animals", "Muscle, Skeletal", "Pancreas", "Liver", "Peptide Hormones", "Energy Metabolism", "Metabolic Diseases", "Disease Models, Animal"], "year": "2025", "doi": "10.1515/hmbci-2025-0042"}], "pubmed_query": "(\"skeletal muscle\"[Title] OR \"muscle\"[Title] OR \"myocyte\"[Title] OR \"myofiber\"[Title] OR \"sarcopenia\"[Title] OR \"muscular\"[Title]) AND (\"pancreas\"[Title] OR \"pancreatic\"[Title] OR \"islet\"[Title] OR \"beta cell\"[Title] OR \"beta-cell\"[Title] OR \"insulin secretion\"[Title] OR \"exocrine pancreas\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Muscle__Thyroid", "source": "Muscle", "target": "Thyroid", "color": "#64748b", "description": "Type: Metabolic status\nKey Players: TSH, TH\nNotes: - TH  regulates Thermogenesis, energy utilization by increasing the basal metabolic rate and regulate lipid and glucose metabolism. \nThermogenesis occurs to a large part in muscle.\nSources:\n- doi: 10.1177/2042018820917869\n- https://doi.org/10.1152/physrev.00030.2013\n- doi: 10.4093/dmj.2017.41.5.327.", "connection_type": "Metabolic status", "key_players": ["TSH", "TH"], "key_players_metabolites": ["glucose", "atp", "amp", "fatty acids", "cholesterol", "fatty acid", "lactate", "leucine", "phospholipid", "amino acid", "citrate", "nadph", "free fatty acids", "glycerol", "triglycerides", "creatine", "adp", "serine", "palmitate", "amino acids", "ffa", "glycogen", "lipoprotein", "oleate", "triglyceride", "ketone bodies", "thromboxane", "ldl", "arginine", "pyruvate", "free fatty acid", "bile acids", "hdl", "beta-hydroxybutyrate", "prostaglandin", "butyrate", "valine", "nadh", "alanine", "linoleate"], "key_players_hormones": ["thyroid hormone", "t3", "thyroid hormones", "tsh", "insulin", "triiodothyronine", "thyroxine", "t4", "thyrotropin", "leptin", "angiotensin", "vitamin d", "irisin", "tgf-beta", "glucocorticoid", "fndc5", "growth hormone", "renin", "corticosterone", "igf-1", "angiotensin ii", "oxytocin", "norepinephrine", "cck", "osteocalcin", "estrogen", "interleukin-1", "adiponectin", "visfatin", "calcitriol", "tumor necrosis factor", "il1b", "ghrelin", "interleukin-6"], "key_players_proteins": ["ucp3", "glut4", "akt", "ampk", "p38", "pgc-1a", "cd36", "mtor", "foxo1", "erk1", "pi3k", "irs1", "jnk", "insulin receptor", "lipoprotein lipase", "foxo", "pgc-1alpha", "mapk", "rxr", "mtorc1", "fas", "pgc-1", "hexokinase", "ucp1", "mtorc2", "pparg", "tfam", "nfkb", "irs-1", "ppara", "acc", "atgl"], "key_players_counts_metabolites": {"cholesterol": 20, "ketone bodies": 2, "amp": 23, "glycogen": 3, "palmitate": 4, "citrate": 6, "thromboxane": 2, "atp": 25, "bile acids": 1, "hdl": 1, "beta-hydroxybutyrate": 1, "amino acids": 4, "glucose": 59, "fatty acid": 11, "leucine": 9, "ldl": 2, "lactate": 11, "free fatty acids": 5, "prostaglandin": 1, "arginine": 2, "butyrate": 1, "pyruvate": 2, "free fatty acid": 2, "amino acid": 8, "valine": 1, "lipoprotein": 3, "glycerol": 5, "triglycerides": 5, "ffa": 4, "creatine": 5, "oleate": 3, "triglyceride": 3, "fatty acids": 23, "nadh": 1, "phospholipid": 9, "adp": 5, "nadph": 6, "serine": 5, "alanine": 1, "linoleate": 1}, "key_players_counts_hormones": {"thyroid hormone": 291, "cck": 2, "glucocorticoid": 7, "thyroxine": 72, "interleukin-1": 1, "igf-1": 4, "angiotensin ii": 4, "oxytocin": 3, "norepinephrine": 3, "osteocalcin": 2, "fndc5": 6, "growth hormone": 5, "thyroid hormones": 148, "renin": 5, "estrogen": 2, "adiponectin": 1, "insulin": 97, "t3": 261, "vitamin d": 10, "visfatin": 1, "calcitriol": 1, "tumor necrosis factor": 1, "irisin": 9, "triiodothyronine": 90, "leptin": 12, "il1b": 1, "corticosterone": 5, "ghrelin": 1, "tgf-beta": 9, "tsh": 103, "thyrotropin": 30, "t4": 44, "angiotensin": 12, "interleukin-6": 1}, "key_players_counts_proteins": {"ucp1": 1, "mapk": 2, "pgc-1a": 12, "jnk": 3, "rxr": 2, "pi3k": 5, "foxo1": 6, "mtorc1": 2, "p38": 18, "mtorc2": 1, "pparg": 1, "glut4": 22, "fas": 2, "tfam": 1, "nfkb": 1, "insulin receptor": 3, "akt": 21, "irs-1": 1, "lipoprotein lipase": 3, "foxo": 3, "cd36": 12, "irs1": 5, "erk1": 6, "ppara": 1, "pgc-1": 2, "ampk": 21, "ucp3": 25, "acc": 1, "hexokinase": 2, "pgc-1alpha": 3, "mtor": 8, "atgl": 1}, "notes": "- TH  regulates Thermogenesis, energy utilization by increasing the basal metabolic rate and regulate lipid and glucose metabolism. \nThermogenesis occurs to a large part in muscle.", "sources": ["doi: 10.1177/2042018820917869", "https://doi.org/10.1152/physrev.00030.2013", "doi: 10.4093/dmj.2017.41.5.327."], "ai_description": "Thyroid hormone (TH) plays a critical role in regulating skeletal muscle physiology, influencing both contractile function and metabolic pathways. Through the regulation of ion channels, such as voltage-gated potassium channels [1], TH modulates muscle excitability and contraction. Additionally, TH signaling creates an intracellular environment conducive to protein accretion and oxidative capacity, supporting mitochondrial integrity and coordinated protein turnover [2]. This hormonal axis is further supported by the clinical efficacy of parathyroid autotransplantation into skeletal muscle during thyroid surgery, suggesting a functional restoration mechanism [3].", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42316864", "title": "Voltage-gated potassium channels mediate thyroid hormone control of skeletal muscle excitability.", "abstract": "Thyroid hormone (TH) is a critical regulator of skeletal muscle (SkM) physiology, influencing muscle development, metabolism and contractile function. However, the molecular mechanisms by which TH modulates muscle excitability and contraction remain incompletely defined. Here, we investigated the role of TH signalling in regulating SkM electrical activity through transcriptional control of ion channels. Using RNA sequencing of gastrocnemius muscles from wild-type (CTR), muscle-specific deiodinase type 2-deficient (mD2KO), and thyroid hormone receptor &#x3b1;/&#x3b2;-deficient (TR&#x3b1;KO/TR&#x3b2;KO) mice, we identified a shared transcriptional signature of TH deficiency characterized by the dysregulation of multiple ion channel genes. Notably, two potassium (K + ) channel-related genes Kcnh2 and Kcnk1, which encode for mERG1 and TWIK-1, respectively, were downregulated, while Kcnab1 was consistently upregulated in both mD2KO and TR&#x3b1;KO/TR&#x3b2;KO muscles compared with CTR, suggesting a common TH-dependent regulatory mechanism. To investigate whether such transcriptional remodelling of K + channels translates into functional changes, we assessed the direct effects of TH on K + currents using patch-clamp recordings in differentiated C2C12 cells exposed to TH as a model of physiological TH signalling. Interestingly, we found that TH treatment significantly increased mERG current density in differentiated C2C12 cells, supporting a role for TH signalling in the modulation of SkM electrical activity. Collectively, these results provide a mechanistic framework through which TH contributes to the regulation of muscle electrical stability, with potential implications for thyroid-related myopathies. KEY POINTS: Thyroid hormone (TH) regulates skeletal muscle excitability through transcriptional modulation of potassium (K + ) channel-related genes. RNA-seq analyses identified a TH-dependent signature with downregulation of Kcnh2 (mERG1) and Kcnk1 (TWIK-1), and upregulation of Kcnab1 under TH-deficient conditions. Chromatin immunoprecipitation demonstrates direct binding of TH receptors to regulatory regions of these channel genes. Electrophysiological recordings in differentiated C2C12 cells show that TH treatment increases mERG current density. This coordinated remodelling of K + channel expression provides a mechanistic basis for TH-driven optimization of muscle electrical stability and contractile performance. These findings support a role for TH signalling in the regulation of skeletal muscle electrical stability, with potential implications for thyroid-related myopathies.", "keywords": [], "year": "2026", "doi": "10.1113/JP291418"}, {"pmid": "42173706", "title": "Thyroid hormones as permissive regulators of skeletal muscle protein accretion and oxidative capacity: Implications for resistance and endurance training.", "abstract": "Thyroid hormones (THs) are fundamental regulators of skeletal muscle energy metabolism and protein turnover. Instead of directly stimulating muscle growth, they create the intracellular environment required for effective adaptation to exercise. Adequate TH availability supports mitochondrial integrity, ribosome biogenesis, and coordinated protein turnover, thereby enabling the translation of anabolic signaling into structural adaptation and remodeling. Accordingly, reduced translational efficiency during hypothyroidism may blunt hypertrophic responses. In contrast, hyperthyroidism accelerates proteolytic pathways and compromises net protein gain despite elevated turnover. Training modalities determine the physiological outcome within this endocrine context, with endurance exercise primarily enhancing oxidative remodeling, while resistance training, when sufficient biosynthetic capacity is present, can stimulate myofibrillar accretion. Reduced energy availability lowers T3 concentrations and may attenuate adaptive efficiency across both modalities. Overall, thyroid status emerges as a critical determinant of muscle remodeling capacity, underscoring the clinical relevance of thyroid assessment in exercise-based interventions.", "keywords": [], "year": "2026", "doi": "10.1016/j.beem.2026.102110"}, {"pmid": "42131420", "title": "Clinical efficacy of parathyroid autotransplantation into the forearm muscle in thyroid surgery: a retrospective cohort study on functional restoration.", "abstract": "This study was conducted to evaluate the clinical efficacy of autologous parathyroid transplantation into the forearm brachioradialis muscle during thyroid surgery and analyze the timing of graft function recovery. A total of 52 patients undergoing thyroid surgery with autologous parathyroid transplantation were selected. Serum parathyroid hormone (PTH) levels were measured at various postoperative intervals, and instances of hypoparathyroidism were recorded. Postoperative PTH levels on the transplant side were significantly higher than on the non-transplant side from week 1 to 1 year. Effective graft rates were 1.9% on day 1, 40.4% at week 1, 84.6% at 1 month, and stabilized at around 73% after 1 year. Transient hypoparathyroidism was observed in 17.3% of patients, with no permanent cases. Autologous parathyroid transplantation into the forearm brachioradialis muscle effectively preserves parathyroid function, with grafts regaining optimal function within 2-3 months and the graft still having good secretory function 1 year after surgery.", "keywords": [], "year": "2026", "doi": "10.4174/astr.2026.110.5.311"}, {"pmid": "41883468", "title": "Dynamic Monitoring of Thyroid-Stimulating Hormone Receptor Antibody and Extraocular Muscle Thickness: A Clinical Risk Stratification Model for Recurrence Risk Post-Glucocorticoid Therapy in TED Patients.", "abstract": "To develop a clinical risk stratification model for thyroid eye disease (TED) recurrence post-glucocorticoid therapy by integrating dynamic thyroid-stimulating hormone receptor antibody (TRAb), extraocular muscle (EOM) thickness, and baseline clinical-biochemical indicators, with only internal validation. A single-center retrospective cohort study of 426 TED patients (2016-2023) was conducted. Recurrence (12-month follow-up) was adjudicated by two ophthalmologists. LASSO regression screened predictors, and multiple machine learning models were built and validated via 10-fold cross-validation. Model performance was assessed by AUC and decision curve analysis (DCA). 98 patients (23.0%) had recurrence, with 89% occurring after 6 months post-treatment. Recurrent patients showed slower TRAb decline and persistent EOM thickening. 15 key predictors were identified, and the random forest (RF) model had the best performance (AUC=0.92, 95% CI: 0.88-0.95; accuracy=0.87) with consistent subgroup results (Events Per Variable=6.5, potential overfitting risk). This internally validated risk stratification model identifies factors associated with TED recurrence post-glucocorticoid therapy, with dynamic TRAb and EOM thickness as key indicators. The findings are preliminary due to no external validation and temporal limitations, and prospective multi-center studies are required before clinical implementation to inform individualized follow-up.", "keywords": [], "year": "2026", "doi": "10.2147/IJGM.S590217"}, {"pmid": "41869726", "title": "Hypothyroidism impairs skeletal muscle regeneration after injury by altering myogenic and nonmyogenic pathways.", "abstract": "Thyroid hormone signaling is an essential regulator of skeletal muscle development, function, and metabolism, yet the specific signaling pathways required for muscle regeneration are not yet defined. We used scRNA-seq and the FUCCI (fluorescent ubiquitination-based cell cycle indicator) reporter mouse model to examine how hypothyroidism impacts repair processes after cardiotoxin-induced injury in mice. During regeneration, and up to 2 months after injury, hypothyroid muscles displayed smaller myofibers and a shift to slower oxidative fiber types. scRNA-seq of tibialis anterior muscle during regeneration revealed that hypothyroidism reduced myogenic-lineage diversity. Cell cycle analysis confirmed delayed cell cycle progression at 5 and 14 days after injury, with skeletal muscle stem cells stalled at the G1/S transition, hindering differentiation. Transcriptomic data revealed altered nonmyogenic dynamics, including elevated activated fibro-adipogenic progenitors (FAPs) early in repair and persistent proinflammatory macrophages. Integrative regulon and ligand-receptor analysis further demonstrated that triiodothyronine acted through dual modes: a direct transcriptional control of myogenic cell cycle and oxidative programs and an indirect paracrine remodeling mediated by FAP and immune signaling networks. This study identified what we believe to be novel effects of hypothyroidism on myogenic heterogeneity and impaired tissue repair, offering insights into muscle-wasting mechanisms relevant to hypothyroidism-associated myopathy and sarcopenia.", "keywords": ["Hypothyroidism", "Muscle, Skeletal", "Regeneration", "Skeletal Muscle Enlargement", "G1 Phase Cell Cycle Checkpoints", "Muscular Diseases", "Male", "Animals", "Mice"], "year": "2026", "doi": "10.1172/jci.insight.197761"}, {"pmid": "41785040", "title": "Type 2 deiodinase-dependent surge in thyroid hormone controls muscle stem cell quiescence and self-renewal.", "abstract": "Stem cells are critical for the homeostasis of adult tissues. Thyroid hormone (TH), whose intracellular concentration is increased by type 2 deiodinase (D2), is involved in many functions, but its role in quiescence is unknown. Here, we show that D2 marks quiescent stem cells in muscle and skin. Genetic D2 depletion in quiescent muscle stem cells triggered their transition from a G0 to a GAlert-like state. This increased the proliferative potential of the stem cells but impaired their self-renewal capacity, leading to depletion of the stem cell pool and regenerative failure over time. Mechanistically, TH sustained Notch signaling, and active Notch overexpression partially rescued D2 depletion. Transient pharmacological inhibition of D2 accelerated muscle regeneration and skin wound healing by promoting stem cell expansion. In conclusion, we show that D2 is a critical metabolic enzyme in maintaining stem cell quiescence and in regulating self-renewal.", "keywords": ["Iodide Peroxidase", "Animals", "Iodothyronine Deiodinase Type II", "Thyroid Hormones", "Mice", "Signal Transduction", "Cell Self Renewal", "Stem Cells", "Receptors, Notch", "Cell Proliferation", "Muscle, Skeletal"], "year": "2026", "doi": "10.1172/JCI194925"}, {"pmid": "41763195", "title": "Leptin enhances the intracellular thyroid hormone activation in skeletal muscle to boost energy balance.", "abstract": "", "keywords": [], "year": "2026", "doi": "10.1016/j.cmet.2026.02.015"}, {"pmid": "41704967", "title": "Prevention of Lower Limb Muscle Atrophy With Neuromuscular Electrical Stimulation in a Patient With Tachycardia-Induced Cardiomyopathy Secondary to Thyroid Storm: A Case Report.", "abstract": "Tachycardia-induced cardiomyopathy (TIC) is reversible; however, the acute phase is often accompanied by hemodynamic instability, which makes conventional exercise therapy difficult to implement. Neuromuscular electrical stimulation (NMES) has been suggested as a potential alternative strategy to prevent muscle atrophy. Herein, we report a case in which NMES was used in a patient during the acute phase of TIC, secondary to thyroid storm, highlighting its safety and potential effectiveness. A male in his 40s was diagnosed with TIC associated with thyroid storm. On admission, the patient presented with atrial fibrillation, severe cardiac dysfunction with a left ventricular ejection fraction of 19%, and markedly elevated thyroid hormone levels. Due to unstable hemodynamics, conventional exercise therapy was deferred, and NMES was initiated on day nine of hospitalization, and it was continued until day 12. It was performed once daily for 20 minutes. Muscle ultrasonography revealed that quadriceps muscle thickness had decreased by approximately 5% during hospitalization. Importantly, no hemodynamic deterioration or adverse events were observed. From day 13, aerobic exercises using a cycle ergometer and resistance training were initiated. The patient achieved a six-minute walk distance of 545 m and was discharged on day 28. NMES was safely implemented without adverse events, even during periods of hemodynamic instability in a patient with TIC. In situations where conventional exercise therapy is limited due to hemodynamic instability, NMES may represent a feasible intervention option. The findings of this single case are hypothesis-generating and warrant further investigation.", "keywords": [], "year": "2026", "doi": "10.7759/cureus.101732"}, {"pmid": "41685685", "title": "Mechanisms and clinical prospects of mesenchymal stem cells and their derivatives in treating hypothyroidism-induced injuries: A focus on cardiovascular, skeletal muscle, and nervous systems.", "abstract": "Hypothyroidism, a prevalent endocrine disorder characterized by insidious onset and prolonged progression, leads to metabolic slowdown and multiorgan dysfunction, significantly compromising patients' quality of life. While hormone replacement therapy improves most patients' serum thyroid function, it faces limitations, including individual response variations, lifelong medication requirements, and potential risks, with no reversal of existing tissue damage. In recent years, the mesenchymal stem cells (MSCs) and their derivatives have gained prominence in immunomodulation and regenerative medicine because of their abundant sources, low immunogenicity, potent paracrine effects, and multidirectional differentiation capabilities for tissue repair. Their unique advantages in modulating the immune microenvironment, promoting angiogenesis, reducing fibrosis, and stimulating endogenous cell regeneration offer novel strategies to overcome treatment bottlenecks in hypothyroidism and its complications, effectively repairing thyroid and multiorgan damage in animal models. This review synthesizes literature from the PubMed and Web of Science databases, incorporating relevant basic research and clinical trials. This study examined the systemic impacts of hypothyroidism, evaluated the experimental and clinical roles of the MSCs in thyroid tissue reconstruction and organ protection, and analyzed molecular mechanisms, including immune regulation, the antioxidant stress response, anti-apoptosis, and cellular function restoration. Clinical application potential is assessed alongside critical challenges such as standardized preparation, long-term safety, in vivo homing efficiency, and large-scale production.", "keywords": ["Humans", "Hypothyroidism", "Mesenchymal Stem Cells", "Animals", "Mesenchymal Stem Cell Transplantation", "Muscle, Skeletal", "Cardiovascular System"], "year": "2026", "doi": "10.1177/09636897261418754"}, {"pmid": "41489243", "title": "Publisher Correction: Effects of effective antithyroid therapy on adiposity and skeletal muscle in patients with hyperthyroidism across gender and age groups.", "abstract": "Eur Rev Med Pharmacol Sci 2023; 27 (13): 6170-6175 DOI: 10.26355/eurrev_202307_32973D-PMID: 37458673, published online on July 13, 2023. Following an editorial quality check, we have determined that incorrect references from another article were inadvertently inserted into the final PDF. The error was not detected by the authors prior to publication, and the PDF file was approved for publication. The erratum is issued to correct the whole list of references. The corrected list of references is provided below: Lai CL, Wu H, Ni GJ. [Traditional Chinese medicine Pericarpium Citri Reticulatae from Guangdong and Xinhui textual criticism]. Zhongguo Zhong Yao Za Zhi 2017; 42: 789-794. Moro T, Tinsley G, Bianco A, Marcolin G, Pacelli QF, Battaglia G, Palma A, Gentil P, Neri M, Paoli A. Effects of eight weeks of time-restricted feeding (16/8) on basal metabolism, maximal strength, body composition, inflammation, and cardiovascular risk factors in resistance-trained males. J Transl Med 2016; 14: 290. Hayashi A, Takano K, Kawakami Y, Hitomi M, Ohata Y, Suzuki A, Kamata Y, Shichiri M. Short-term Change in Resting Energy Expenditure and Body Compositions in Therapeutic Process for Graves' Disease. Intern Med 2020; 59: 1827-1833. New Medical Journal: Archives of Scientific and Practical Medicine. Buffalo Med Surg J 1872; 12: 154. Bande AR, lycerol", "pyruvate", "acetate", "sphingolipid", "oxaloacetate", "propionate", "palmitate", "amino acids", "creatinine", "lipoprotein", "lysophosphatidylcholine", "uric acid", "glutamine", "hdl", "lactate", "free fatty acid", "glycerol", "alanine", "atp", "lithocholic acid", "glutamate", "leucine", "ldl", "free fatty acids", "butyrate", "amino acid", "ceramide", "ffa", "nadh", "adp", "nadph", "serine"], "key_players_hormones": ["insulin", "adiponectin", "fndc5", "irisin", "leptin", "il-6", "tnf", "glp-1", "interleukin-6", "glucagon", "t3", "vitamin d", "triiodothyronine", "growth hormone", "angiotensin", "natriuretic peptide", "pyy", "thyroid hormone", "testosterone", "aldosterone", "igf-1", "angiotensin ii", "osteocalcin", "omentin", "il6", "renin", "apelin", "resistin", "chemerin", "visfatin", "calcitriol", "corticosterone", "ghrelin", "thyrotropin"], "key_players_proteins": ["ampk", "pgc-1", "glut4", "ucp1", "akt", "sirt1", "dgat2", "ucp3", "mtor", "lxr", "hsl", "fabp", "pi3k", "mtorc1", "irs-1", "cd36", "mapk", "fatp4", "foxo1", "ucp2", "hif1a", "pparg", "fas", "irs-2", "adiponectin receptor", "glut1", "glp-1 receptor", "hormone-sensitive lipase", "insulin receptor", "chrebp", "adipose triglyceride lipase", "cox2", "lpl", "ppara", "hexokinase", "sirt3", "atgl", "srebp"], "key_players_counts_metabolites": {"cholesterol": 8, "diacylglycerol": 4, "sphingolipid": 3, "oxaloacetate": 3, "propionate": 3, "amp": 9, "glycogen": 5, "palmitate": 3, "atp": 1, "hdl": 2, "lithocholic acid": 1, "amino acids": 3, "glucose": 104, "fatty acid": 47, "glutamate": 1, "leucine": 1, "ldl": 1, "lactate": 2, "free fatty acids": 1, "arginine": 8, "butyrate": 1, "pyruvate": 4, "free fatty acid": 2, "amino acid": 1, "creatinine": 3, "lipoprotein": 3, "ceramide": 1, "glycerol": 2, "lysophosphatidylcholine": 3, "triglycerides": 6, "ffa": 1, "acetate": 4, "uric acid": 3, "triglyceride": 11, "fatty acids": 34, "fructose": 8, "succinate": 6, "nadh": 1, "adp": 1, "glutamine": 3, "nadph": 1, "serine": 1, "alanine": 2}, "key_players_counts_hormones": {"thyroid hormone": 1, "tnf": 8, "testosterone": 1, "natriuretic peptide": 2, "pyy": 2, "aldosterone": 1, "glucagon": 5, "igf-1": 1, "angiotensin ii": 1, "osteocalcin": 1, "fndc5": 14, "growth hormone": 3, "omentin": 1, "il6": 1, "renin": 1, "adiponectin": 18, "insulin": 158, "t3": 4, "vitamin d": 4, "apelin": 1, "resistin": 1, "chemerin": 1, "visfatin": 1, "calcitriol": 1, "irisin": 14, "triiodothyronine": 4, "leptin": 12, "glp-1": 7, "corticosterone": 1, "il-6": 10, "ghrelin": 1, "thyrotropin": 1, "angiotensin": 3, "interleukin-6": 6}, "key_players_counts_proteins": {"hsl": 2, "dgat2": 3, "ucp1": 10, "mapk": 1, "fabp": 2, "fatp4": 1, "pi3k": 2, "foxo1": 1, "mtorc1": 2, "ucp2": 1, "hif1a": 1, "pparg": 1, "glut4": 13, "fas": 1, "irs-2": 1, "adiponectin receptor": 1, "glut1": 1, "glp-1 receptor": 1, "hormone-sensitive lipase": 1, "insulin receptor": 1, "akt": 7, "chrebp": 1, "irs-1": 2, "adipose triglyceride lipase": 1, "cox2": 1, "lpl": 1, "cd36": 2, "ppara": 1, "pgc-1": 18, "ampk": 24, "ucp3": 3, "sirt1": 6, "hexokinase": 1, "mtor": 3, "sirt3": 1, "atgl": 1, "lxr": 3, "srebp": 1}, "notes": "- Insulin produced by the pancreas leads to glucose uptake in both WAT and Muscle as both express GLUT4.\n- Both organs are large glucose sinks.", "sources": ["doi: 10.1074/jbc.REV119.008351”"], "ai_description": "The Muscle-WAT axis is regulated by a complex interplay between skeletal muscle and visceral adipose tissue (VAT), mediated by key signalling molecules such as Hedgehog pathway ligand Desert Hedgehog [1], which promotes myofiber repair and suppresses intramuscular adipogenesis. In contrast, inflammation and aging acceleration, linked to poor sleep quality, inversely associate with the skeletal muscle mass-to-visceral fat ratio (SVR) [2]. The gut microbiome and circulating metabolites also play a crucial role in modulating body composition, as evidenced by studies linking cancer cachexia to depletion of both skeletal muscle and adipose tissue [3]. Furthermore, metabolic flexibility and oxidative metabolism in skeletal muscle and brown adipose tissue can be enhanced by extracts from purple sweet potato leaves, which may prevent weight gain and lipotoxicity [4], while muscle-derived ANXA2 promotes hepatic steatosis through activation of SREBP1c-mediated de novo lipogenesis [5].", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42282532", "title": "FAP-intrinsic Hedgehog signaling controls intramuscular adipogenesis, fibrosis, and myofiber regeneration.", "abstract": "Fibro/adipogenic progenitors (FAPs) are multipotent stromal cells that support myofiber regeneration, but can also give rise to intramuscular adipose tissue (IMAT) and fibrotic scar tissue. While the Hedgehog pathway suppresses FAP adipogenesis and promotes myofiber repair through ligand Desert Hedgehog, the key cell type that senses this signal has remained unclear. Here, we demonstrate through FAP-specific deletion of the Hedgehog signal transducer Smoothened that FAPs are the primary Hedgehog-responding cells during muscle regeneration. Loss of Smoothened in FAPs increases IMAT, causes persistent fibrosis, reduces the Hedgehog-dependent effectors TIMP3 and GDF10, and impairs myofiber regeneration. FAPs lacking Smoothened also fail to support in vitro myoblast differentiation and fusion as efficiently as control FAPs, showing that Hedgehog signaling helps establish a pro-myogenic FAP state early after injury. Pharmacological Hedgehog activation via the Smoothened agonist SAG fails to rescue adipocyte accumulation or myofiber regeneration when FAPs lack Smoothened. Together, these findings provide direct genetic evidence that FAPs are the primary cellular mediators of Hedgehog signaling in muscle and establish FAP Hedgehog signaling competence as a key determinant of regenerative outcome and a target for restoring muscle repair in disease.", "keywords": [], "year": "2026", "doi": "10.64898/2026.05.29.727896"}, {"pmid": "42249335", "title": "The inverse association between skeletal muscle mass to visceral fat ratio (SVR) and sleep disturbance: the mediating role of inflammation and aging acceleration.", "abstract": "A growing body of evidence has linked body composition to poor sleep quality. The skeletal muscle mass-to-visceral fat ratio (SVR) is a valid indicator of body composition that integrates appendicular skeletal muscle mass and visceral fat, reflecting the severity of sarcopenic obesity (SO). However, the association between SVR and sleep disturbance has not been well established. This study aimed to investigate the relationship between SVR and sleep disturbance among U.S. adults, along with the mediating roles of inflammation and biological aging. A total of 1,564 participants from the National Health and Nutrition Examination Survey (NHANES) with complete data on SVR, sleep parameters, and other essential covariates were included. Weighted multivariable logistic regression models, subgroup and interaction analyses, and restricted cubic spline (RCS) analyses were used to explore the association between SVR and sleep disturbance. Furthermore, mediation analysis was used to explore the mediating role of aggregate index of systemic inflammation (AISI), C-reactive Protein-Albumin-Lymphocyte index (CALLY), and Phenotypic age acceleration (PhenoAgeAccel) in this association. 15.22% of participants reported sleep disturbance. After full covariate adjustment, SVR was inversely associated with sleep disturbance: each unit increase in SVR was linked to a 91.1% lower risk (OR&#x2009;=&#x2009;0.089, 95% CI: 0.024-0.334), and the highest versus lowest SVR quartile showed a 57.4% reduced risk (OR&#x2009;=&#x2009;0.426, 95% CI: 0.241-0.752; P-trend&#x2009;=&#x2009;0.006). RCS analyses confirmed a significant linear dose-response relationship between SVR and sleep disturbance (P-nonlinearity&#x2009;=&#x2009;0.907). Subgroup analyses and interaction tests showed a more pronounced association in females (OR&#x2009;=&#x2009;0.42 vs. males: OR&#x2009;=&#x2009;0.01) and individuals with depression (OR&#x2009;=&#x2009;0.16 vs. non-depressed individuals: OR&#x2009;&lt;&#x2009;0.01). Additionally, after adjusting for alternative mediators in sensitivity analyses, AISI, CALLY, and PhenoAgeAccel statistically mediated 10.64%, 36.43%, and 15.99% of the association, respectively (all P&#x2009;&lt;&#x2009;0.05). SVR was inversely associated with sleep disturbance, with inflammation and biological aging statistically explaining a significant portion of this association. Further studies with longitudinal or interventional designs are warranted to clarify the causal links of body composition with inflammation, biological aging and sleep disturbance given the cross-sectional design. Not applicable.", "keywords": [], "year": "2026", "doi": "10.1186/s12888-026-08248-x"}, {"pmid": "42231158", "title": "Microbiome and metabolome patterns centered on cancer cachexia link skeletal muscle and adipose tissue depletion to clinical outcomes in locally advanced rectal cancer.", "abstract": "Cancer cachexia is a multifactorial syndrome characterized by involuntary weight loss and tissue wasting; it was associated with adverse survival outcomes in patients with locally advanced rectal cancer (LARC). However, its biological basis and links to the gut microbiome, circulating metabolites, and body composition in LARC remain unclear. We conducted a retrospective cohort study of 198 LARC patients, including 30 with cachexia. Gut microbial profiles were characterized using 16S rRNA sequencing with predictive functional inference. Serum metabolites were analyzed via orthogonal partial least squares-discriminant analysis (OPLS-DA) and validated by ROC analysis. Associations among microbial taxa, metabolites, body composition, and clinical indices were assessed using correlation analyses. Survival outcomes were evaluated by Kaplan-Meier curves and multivariate Cox regression models, with subgroup and sensitivity analyses performed to validate the robustness of findings. Cachectic patients exhibited marked reductions in BMI, circulating triglycerides and cholesterol, as well as visceral and subcutaneous adipose tissue (VAT and SAT) and skeletal muscle area (SMA) (all P&#x2009;&lt;&#x2009;0.05). Microbial &#x3b1;- and &#x3b2;-diversity were comparable between groups, yet cachexia was associated with selective enrichment of Peptostreptococcaceae, Erysipelotrichaceae, Veillonella, and Fusobacterium, alongside depletion of Faecalibacterium, Roseburia, and Prevotella. Notably, UBA1819 (Ruminococcaceae) was enriched in cachectic patients and inversely correlated with Faecalibacterium, hemoglobin, and albumin, suggesting intra-family functional divergence. Specific cachexia-enriched taxa, including Veillonella and Erysipelotrichaceae, were inversely associated with SMA and VAT, whereas butyrate-producing genera showed positive correlations with muscle preservation. Functional predictions highlighted enrichment of N-acetylneuraminate degradation in cachexia versus TCA cycle pathways in non-cachectic patients. High abundance of Peptostreptococcaceae and Erysipelotrichaceae was associated with poorer overall survival. Metabolomic profiling identified lithocholic acid, cortisone, 3,5,9-trihydroxyergost-7-en-6-one, and 5,6-DHET as cachexia-associated metabolites (AUC 0.65-0.78), which formed cross-domain correlations with microbial taxa and host tissue measures. Our findings reveal a coordinated linkage between the gut microbiome, metabolome, and host body composition in LARC cachexia. Specifically, selective microbial remodeling and metabolite perturbations are closely coupled with skeletal muscle and adipose tissue depletion and adverse survival. These results provide a conceptual foundation for future mechanistic and translational studies exploring the host-microbiome-metabolic interactions in cancer cachexia.", "keywords": [], "year": "2026", "doi": "10.1186/s12866-026-05171-9"}, {"pmid": "42226237", "title": "Purple sweet potato (Ipomoea batatas L. Lam) leaves extract prevents weight gain and lipotoxicity in mice fed a high-fat diet by increasing metabolic flexibility and oxidative metabolism in skeletal muscle and brown adipose tissue.", "abstract": "Purple sweet potato leaves are a rich source of caffeoylquinic acids (CQA) and related compounds with potential metabolic benefits. Our previous research demonstrated that 5-CQA and 3,4-diCQA increase mitochondrial respiration in primary hepatocytes. To explore the translational relevance of purple sweet potato leaves extract (PSPLE) in the management and treatment of obesity, we evaluated the effect of PSPLE in C57BL/6 mice fed a high-fat (HF) diet supplemented with either 1% or 3% PSPLE (w/w) and assessed insulin secretion in INS-1E cells. PSPLE phenolic compounds were identified by LC-MS. Male C57BL/6J mice were fed (1) a Control, (2) high-fat (HF) diet, (3) HF diet supplemented with 1% and (4) HF diet supplemented with 3% of PSPLE for 15 weeks. Body composition, energy expenditure, glucose and insulin tolerance, serum metabolites, and tissue morphology were evaluated. AMPK activation was analyzed in the liver and skeletal muscle. Complementary, &#x3b2;-cell function was assessed in vitro. LC-MS revealed that PSPLE contained abundant CQA derivatives (5-CQA, caffeic acid, 3,4-di-CQA, 3,5-di-CQA, 4,5-di-CQA, 4&#xa0;F-5CQA, and 3,4,5-tri-CQA). The HF&#x2009;+&#x2009;1% PSPLE diet attenuated weight gain and adipocyte hypertrophy, increased brown adipose UCP-1 expression, and prevented hepatic steatosis. AMPK phosphorylation was enhanced in the liver and muscle, paralleling higher oxygen consumption and energy expenditure. Although PSPLE stimulated &#x3b2;-cell metabolism and insulin secretion in vitro, in vivo glucose tolerance showed only modest improvement, likely reflecting the multiple regulatory inputs on insulin secretion under physiological conditions. PSPLE e
