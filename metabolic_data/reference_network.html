ility to recurrent infections. Hematopoietic stem cell transplantation (HSCT) has been considered a curative approach, yet its long-term efficacy remains unclear. We report long-term outcomes of two patients with genetically confirmed NIK deficiency who underwent HSCT. Both patients achieved full donor chimerism and early T-cell reconstitution with normalized CD3 + , CD4 + , and CD8 + counts and na&#xef;ve T-cell subsets. However, memory T-cell differentiation remained impaired, with persistently reduced central memory T cells and circulating T follicular helper cells. Immune dysregulation emerged years after HSCT, with one patient developing seropositive arthritis and the other exhibiting autoimmune hepatitis. Thymic dysfunction was suspected as an underlying contributor to impaired central tolerance in this pathology. Similarly, B-cell reconstitution was incomplete, characterized by persistent hypogammaglobulinemia and a marked deficiency in class-switched memory B cells, despite donor-derived chimerism. Lymphoscintigraphy confirmed absence of lymph nodes. Both patients suffered from recurrent, severe infections and ultimately died of infection-related complications. Our findings indicate that HSCT alone is insufficient to fully correct the immune disorder in MAP3K14 deficiency, likely due to non-hematopoietic defects in lymph node stromal structures and thymic central tolerance. These results highlight the importance of long-term immunologic monitoring, including assessments for immune dysregulation and anti-cytokine autoantibodies. Future therapies should consider adjunct strategies such as thymic regeneration or targeted immune modulation to address the underlying architectural defects in this disorder.", "keywords": ["Humans", "Bone Marrow Transplantation", "Hematopoietic Stem Cell Transplantation", "Lymphoid Tissue", "NF-kappa B", "NF-kappaB-Inducing Kinase", "Protein Serine-Threonine Kinases", "Signal Transduction", "Thymus Gland", "Treatment Outcome"], "year": "2025", "doi": "10.3389/fimmu.2025.1682642"}, {"pmid": "41181713", "title": "Splenic compensation alleviates impaired-development of bone marrow terminal erythroid to attenuate anemia in ATPIF1 knockout mice.", "abstract": "ATPIF1 (ATPase Inhibitory Factor 1) is a critical regulatory factor of mitochondrial ATP synthase, maintaining ATP homeostasis by modulating ATP synthesis and hydrolysis. In this study, we investigated the consequences of ATPIF1 knockout (KO) on terminal erythroid development and mitochondrial metabolic adaptation in mice. ATPIF1-KO mice exhibited significant reductions in peripheral red blood cell (RBC) counts, hemoglobin, and hematocrit. Mechanistic studies identified impaired development of bone marrow (BM) erythroid, accompanied by robust compensatory erythroid development in the spleen. Integrated RNA-seq and metabolomic analyses revealed that ATPIF1 deficiency disrupted cell proliferation and mitochondrial function in oxidative phosphorylation (OXPHOS) and the tricarboxylic acid (TCA) cycle of BM erythroblasts, leading to defective terminal differentiation of erythrocytes. BM-derived erythroid cells showed a reduction in proliferation, mitochondrial mass, and reactive oxygen species (ROS) levels with an increase in apoptosis. Conversely, the spleen displayed extramedullary erythroid development characterized by enhanced proliferation, reduced apoptosis, increased reductive stress, and upregulation of heme-related genes. Heme levels were decreased in the bone marrow, but not in the spleen. These findings establish ATPIF1 as a key regulator of terminal erythroid development and highlight the essential compensatory role of the spleen in maintaining erythropoietic homeostasis under KO-induced mitochondrial dysfunction. Our work provides new insight into the pathophysiology of mitochondrial-related anemias and potential therapeutic targets.", "keywords": [], "year": "2025", "doi": "10.3389/fcell.2025.1675547"}, {"pmid": "40765825", "title": "Ferritinophagy activation states determine the susceptibility to ferroptosis of macrophages in bone marrow and spleen.", "abstract": "Macrophages exhibit heterogeneity due to their presence in different tissues that have distinct cell fates. Ferroptosis is one type of cellular fate, but the sensitivity of different types of macrophages to ferroptosis and the associated molecular mechanisms are not clear. This study explored the ferroptosis sensitivity of bone marrow and splenic macrophage, focusing on the contribution of ferritinophagy. We found that bone marrow M2 macrophages were more susceptible to ferroptosis, which was attributed to their lower solute carrier family 40 member 1 (SLC40A1) and ferritin heavy/light chain (FTH/L) expression and higher labile iron levels compared to those of splenic macrophages. Further, ferritinophagy activation, particularly in M2 macrophages, was identified as the primary cause of increased labile iron levels, as evidenced by experiments using autophagic flux modifiers and RAW264.7 cells with autophagy related 5 (ATG5) and nuclear receptor coactivator 4 (NCOA4) knockdown and NCOA4 knockout. These results provide a new direction for further understanding the heterogeneity and functionality of macrophages, and offers innovative treatments for a variety of health issues in which macrophage regulation plays a critical role.", "keywords": ["Animals", "Ferroptosis", "Macrophages", "Mice", "Spleen", "Autophagy", "Mice, Inbred C57BL", "Nuclear Receptor Coactivators", "Ferritins", "Bone Marrow", "RAW 264.7 Cells", "Iron", "Autophagy-Related Protein 5"], "year": "2025", "doi": "10.7150/ijbs.114545"}, {"pmid": "40420375", "title": "[A Case of Invasive Lobular Carcinoma Complicated by Disseminated Carcinomatosis of the Bone Marrow with Severe Bone Marrow Fibrosis and Acute Splenomegaly].", "abstract": "A 60-year-old female presented at our hospital with a mass in her left breast. Needle biopsy of the breast mass confirmed a diagnosis of invasive lobular carcinoma, and the patient underwent left mastectomy and axillary lymph node dissection. The patient received adjuvant chemotherapy and was started on continuous endocrine therapy. Three years post-surgery, she experienced recurrence of multiple bone metastases and received a combination of hormone therapy and selective cyclin-dependent kinases 4/6 inhibitors. Therapeutic efficacy was poor, allowing bone metastases to spread. Four months post-recurrence, blood tests revealed moderate thrombocytopenia. Despite the switch to chemotherapy, the patient's platelet count did not recover. CT revealed splenomegaly, which was not present three months earlier. Bone marrow biopsy revealed severe myelofibrosis with infiltration of small dysplastic cells into dense fibrotic tissue. The patient developed microangiopathic hemolytic anemia, but DIC was not observed during the course of the disease. Ten months after recurrence, a brain metastasis was detected, and the patient died the following month.", "keywords": ["Humans", "Female", "Middle Aged", "Breast Neoplasms", "Splenomegaly", "Carcinoma, Lobular", "Primary Myelofibrosis", "Fatal Outcome", "Bone Marrow Neoplasms", "Acute Disease", "Neoplasm Invasiveness", "Antineoplastic Combined Chemotherapy Protocols"], "year": "2025", "doi": ""}], "pubmed_query": "(\"bone marrow\"[Title] OR \"hematopoietic\"[Title] OR \"haematopoietic\"[Title] OR \"hematopoiesis\"[Title] OR \"bone marrow niche\"[Title]) AND (\"spleen\"[Title] OR \"splenic\"[Title] OR \"splenomegaly\"[Title] OR \"lymphoid organ\"[Title] OR \"immune organ\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Brain__Small Intestine", "source": "Brain", "target": "Small Intestine", "color": "#64748b", "description": "Type: Glucose-sensing\nKey Players: Glucose\nNotes: Gut-Brain axis regulates glucose production.\nSources:\n- DOI: 10.1016/j.cmet.2017.04.032\n- DOI: 10.1038/nature06852\n- https://doi.org/10.1038/s41467-021-21235-y", "connection_type": "Glucose-sensing", "key_players": ["Glucose"], "key_players_metabolites": ["Glucose", "butyrate", "fatty acids", "fatty acid", "fructose", "bile acids", "galactose", "bile acid", "amino acid", "glutamate", "acetate", "amino acids", "sphingolipid", "propionate", "amp", "leucine", "ceramide", "deoxycholic acid", "methionine", "cholesterol", "ammonia", "atp", "arginine", "free fatty acid", "triglyceride", "serine"], "key_players_hormones": ["Glucose", "il-6", "ghrelin", "tnf", "insulin", "pyy", "glucagon", "glp-1", "il-10", "cck", "il-4", "glucocorticoid", "cortisol", "apelin", "motilin", "corticosterone", "norepinephrine", "estrogen", "fsh", "leptin", "testosterone", "fgf21", "gastrin", "interleukin-1", "oxytocin", "cnp", "tumor necrosis factor", "fgf19", "irisin", "lh", "somatostatin", "amylin", "interleukin-6"], "key_players_proteins": ["Glucose", "tgr5", "pi3k", "akt", "mtorc1", "acc", "mtor", "sglt1", "ampk", "fxr", "mapk", "foxo1", "p38", "foxo", "sirt1", "glp1r"], "key_players_counts_metabolites": {"methionine": 1, "cholesterol": 1, "ammonia": 1, "sphingolipid": 3, "propionate": 3, "amp": 2, "atp": 1, "bile acids": 12, "amino acids": 5, "glucose": 15, "galactose": 10, "fatty acid": 21, "glutamate": 6, "leucine": 2, "arginine": 1, "butyrate": 35, "free fatty acid": 1, "amino acid": 7, "ceramide": 2, "acetate": 6, "triglyceride": 1, "fatty acids": 22, "fructose": 18, "deoxycholic acid": 2, "serine": 1, "bile acid": 9}, "key_players_counts_hormones": {"tnf": 11, "cck": 4, "testosterone": 1, "glucocorticoid": 3, "pyy": 7, "fgf21": 1, "gastrin": 1, "interleukin-1": 1, "glucagon": 7, "oxytocin": 1, "il-4": 4, "norepinephrine": 2, "cortisol": 3, "cnp": 1, "estrogen": 2, "insulin": 11, "apelin": 3, "il-10": 5, "fsh": 2, "tumor necrosis factor": 1, "fgf19": 1, "irisin": 1, "lh": 1, "leptin": 2, "motilin": 3, "glp-1": 6, "corticosterone": 3, "il-6": 12, "ghrelin": 12, "somatostatin": 1, "amylin": 1, "interleukin-6": 1}, "key_players_counts_proteins": {"mapk": 1, "pi3k": 6, "foxo1": 1, "mtorc1": 5, "p38": 1, "akt": 6, "tgr5": 15, "sglt1": 2, "foxo": 1, "ampk": 2, "sirt1": 1, "fxr": 2, "acc": 4, "mtor": 3, "glp1r": 1}, "notes": "Gut-Brain axis regulates glucose production.", "sources": ["DOI: 10.1016/j.cmet.2017.04.032", "DOI: 10.1038/nature06852", "https://doi.org/10.1038/s41467-021-21235-y"], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42330779", "title": "Probiotic, prebiotic, and synbiotic interventions targeting the early-life gut-brain axis: A systematic review of randomized controlled trials.", "abstract": "Early life represents a critical window for maturation of the gut microbiota, mucosal immunity, and neuroimmune pathways underpinning the gut-brain axis (GBA). Probiotic, prebiotic, and synbiotic interventions have been proposed to modulate these processes; however, their mechanistic effects on GBA-relevant biomarkers in humans remain unclear. We conducted a systematic review of randomized controlled trials (RCTs) evaluating microbiota-directed interventions in infants aged 0-36&#xa0;months, focusing on biological pathways implicated in gut-brain communication. Searches of PubMed/MEDLINE, Scopus, and Web of Science identified six eligible RCTs including 1148 randomized participants, of whom 923 contributed data to at least one GBA-relevant biomarker. Outcomes were synthesized across six mechanistic domains: intestinal microbiota composition and functional proxies, microbial metabolites, mucosal immunity, systemic cytokines, intestinal inflammation and permeability, and hypothalamic-pituitary-adrenal (HPA) axis activity. Across trials, interventions were associated with localized mucosal effects, including selective enrichment of Bifidobacterium and Lactobacillus, modest reductions in fecal pH, and modest, variably reported increases in fecal secretory sIgA. In contrast, short-chain fatty acids (SCFAs) were inconsistently reported and showed no robust between-group differences. Systemic cytokines, fecal calprotectin, permeability markers, basal salivary cortisol, and neurodevelopmental outcomes remained unchanged. Methodological heterogeneity, frequent values below assay detection limits, and developmental variability precluded quantitative meta-analysis. Available RCT evidence, although limited and heterogeneous, suggests that early-life microbiota-directed interventions may be associated with compartmentalized microbial and mucosal immune modulation without measurable propagation to systemic neuroimmune or neurodevelopmental pathways in healthy or mildly symptomatic infants. These findings support a model of developmental neuroimmune gating within the early-life GBA, defined here as the physiological restriction of signal propagation from mucosal to systemic and central pathways during early life, and highlight the need for standardized biomarker frameworks, dynamic neuroendocrine assessments, and studies in higher-risk populations to clarify mechanistic relevance.", "keywords": [], "year": "2026", "doi": "10.1016/j.jneuroim.2026.579005"}, {"pmid": "42329321", "title": "Clozapine-associated pneumonia: a gut-lung-brain axis perspective.", "abstract": "", "keywords": [], "year": "2026", "doi": "10.1007/s00406-026-02297-9"}, {"pmid": "42329290", "title": "Canagliflozin attenuates Parkinson's disease and is associated with modulation of gut-inflammasome-brain axis in rats.", "abstract": "Recent evidence links gut dysbiosis and the gut-brain axis to the pathophysiology of Parkinson's disease (PD), which is considered one of the most common neurodegenerative illnesses and is characterized by motor symptoms and a gradual loss of nigral dopaminergic neurons. Canagliflozin (CANA), a sodium-glucose cotransporter-2 inhibitor with emerging anti-inflammatory and antioxidant properties, has recently gained attention for its neuroprotective effects beyond glycemic control. This research aimed to examine the neuroprotective potential of CANA in a rat model of PD, focusing on its potential effect on the gut-inflammasome-brain axis. Rats were treated with rotenone&#xa0;(ROT) (2&#xa0;mg/kg, subcutaneous) and/or CANA (20&#xa0;mg/kg, oral) for 30 consecutive days. Behavioral assessment (n&#x2009;=&#x2009;13), biochemical assays (n&#x2009;=&#x2009;6), and histological and immunohistochemical analysis (n&#x2009;=&#x2009;3) were performed. Microbiome profiling (n&#x2009;=&#x2009;3) using 16S rRNA amplicon sequencing was conducted using three pooled fecal samples/group, with each pool prepared from fecal material collected from three rats and fecal metabolomic profiling (n&#x2009;=&#x2009;5) was performed to assess microbial metabolites. ROT intoxication caused significant motor impairments, including decreased locomotor activity, poor coordination, and increased catalepsy. Further histological examination demonstrated dopaminergic neuronal loss and &#x3b1;-synuclein aggregation in the substantia nigra and striatum. CANA treatment enhanced motor function, conserved neuronal integrity, and decreased &#x3b1;-synuclein accumulation. Moreover, ROT altered the gut microbiota with selective taxonomic shifts, including enriched abundance of Parabacteroides and Ruminococcaceae with depleted Prevotella-related taxa, in addition to fecal metabolite profile alteration. Consequently, it increased colonic oxidative stress and weakened tight junctions, all of which enhanced LPS translocation. This systemic endotoxemia generated oxidative stress, dyslipidemia, and NF-&#x3ba;B/NLRP3 inflammasome activation. Conversely, CANA restored gut microbial balance and their metabolites, and gut integrity, decreased LPS leakage, and reduced systemic and central oxidative stress and inflammation, preventing inflammasome activation and &#x3b1;-synuclein aggregation. Collectively, these findings suggest that CANA may exert neuroprotective effects in ROT-induced PD associated with modulating the gut-inflammasome-brain axis.", "keywords": [], "year": "2026", "doi": "10.1007/s10787-026-02292-5"}, {"pmid": "42328953", "title": "The microbiota-gut-brain axis in fibromyalgia: a scoping review.", "abstract": "Fibromyalgia (FM) is a nociplastic pain condition characterised by widespread pain, fatigue, cognitive dysfunction and multisystem involvement. Increasing evidence implicates the microbiota-gut-brain axis (MGBA) as a potential contributor to its complex pathophysiology. This scoping review maps contemporary evidence (2020-2026) on MGBA alterations in FM across microbial, metabolic, neuroimmune and translational dimensions. This review was conducted following the Arksey and O'Malley framework, as refined by Levac et al. and the Joanna Briggs Institute, and reported in accordance with PRISMAScR guidelines. A systematic search of PubMed/MEDLINE, EMBASE, Web of Science and Scopus identified studies published between January 2020 and March 2026. Eligible studies included primary clinical, translational and preclinical investigations evaluating microbiota composition, microbial metabolites, intestinal permeability, neuroimmune signalling, or microbiometargeted interventions in FM. Narrative and systematic reviews were used only to contextualise findings and were not counted among the included studies. Of 1,365 records identified, 39 studies were included in the final synthesis. Across studies, findings were heterogeneous but most frequently described alterations in gut microbiota composition, including reduced diversity and depletion of butyrate-producing taxa such as Faecalibacterium prausnitzii, along with shifts in Bifidobacterium and Prevotella. Key metabolic perturbations encompassed reduced short-chain fatty acid production and dysregulated tryptophan metabolism. Increased intestinal permeability and activation of neuroimmune pathways were additionally documented. Microbiota profiles were associated with clinically relevant outcomes including pain intensity, fatigue, and cognitive dysfunction. Interventional evidence remains limited but suggests emerging therapeutic potential. The MGBA represents a biologically plausible and integrative framework for FM, linking peripheral and central mechanisms. Current evidence remains heterogeneous and largely associative. Future research should prioritise longitudinal, mechanistically driven studies to advance microbiome-informed diagnostic and therapeutic strategies.", "keywords": ["Humans", "Fibromyalgia", "Gastrointestinal Microbiome", "Brain-Gut Axis", "Brain", "Animals", "Nociplastic Pain"], "year": "2026", "doi": "10.55563/clinexprheumatol/5yhjub"}, {"pmid": "42328654", "title": "Polygonatum sibiricum combined with Poria cocos prevents spleen deficiency constipation via the gut microbiota-mediated brain-gut axis.", "abstract": "The study evaluates the preventive effects of Polygonatum sibiricum and Poria cocos (3:1) on spleen deficiency constipation in mice, focusing on the brain-gut axis, gut microbiota, and oxidative stress. The findings aim to inform the prevention and treatment of this condition. Thirty male specific pathogen-free (SPF) KM mice (4 weeks old, 20 &#xb1; 2&#xa0;g) were randomized into a normal control group (NC), a model group (NM), and a Polygonatum sibiricum and Poria cocos group (HF). Serum levels of 5-hydroxytryptamine (5-HT), cholecystokinin (CCK), motilin (MTL), and vasoactive intestinal peptide (VIP) were measured by ELISA. Liver superoxide dismutase (SOD) activity and malondialdehyde (MDA) content were measured by a spectrophotometer. Gut microbiota was analyzed by 16S rRNA sequencing. Compared to NM, the HF showed significantly increased 5-HT, CCK( p &lt; 0.05), and MTL ( p &lt; 0.001), and significantly decreased VIP( p &lt; 0.05). Liver MDA content was markedly higher in NM than in NC( p &lt; 0.01), with a downward trend in HF. Conversely, the liver SOD activity in NM was significantly lower than in NC( p &lt; 0.001), and the HF displayed an upward trend. Microbiota analysis revealed higher diversity in HF, as indicated by higher chao1, pielou_e, shannon, and simpson indices. The gut microbiota species composition in the HF was dominated by beneficial bacteria such as Bacteroidota and Faecalibaculum , with a reduction in pathogenic bacteria such as Proteobacteria and Escherichia-Shigella . The characteristic gut microbiota of the NM was enriched in Escherichia-Shigella and its conditional pathogens, while the characteristic gut microbiota of the HF was enriched in beneficial symbiotic bacteria such as Akkermansia , Blautia, and Bifidobacterium . The metabolic pathways and the genetic information processing pathway were improved in the HF, and the DNA repair and recombination protein pathways were also repaired. The P. sibiricum and P. cocos combination effectively prevents spleen deficiency constipation, an effect associated with the brain-gut axis and gut microbiota. The observed trends in oxidative stress markers warrant further investigation.", "keywords": [], "year": "2026", "doi": "10.3389/fphar.2026.1793441"}], "pubmed_query": "(\"brain\"[Title] OR \"cerebral\"[Title] OR \"hypothalamus\"[Title] OR \"hypothalamic\"[Title] OR \"central nervous system\"[Title] OR \"CNS\"[Title] OR \"neuronal\"[Title]) AND (\"small intestine\"[Title] OR \"duodenum\"[Title] OR \"jejunum\"[Title] OR \"ileum\"[Title] OR \"intestinal\"[Title] OR \"gut\"[Title] OR \"enterocyte\"[Title] OR \"Peyer's patches\"[Title] OR \"gut-brain axis\"[Title] OR \"enteroendocrine\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Brain__Spleen", "source": "Brain", "target": "Spleen", "color": "#64748b", "description": "Type: Metabolic status.\nKey Players: \nNotes: \n- Might occur only during fasting as glucose is reserved for brain and immune system (bone marrow, spleen)\nSources:", "connection_type": "Metabolic status.", "key_players": ["Notes:"], "key_players_metabolites": ["Notes:", "glucose", "amp", "glutamine", "glutamate", "prostaglandin", "amino acid", "fatty acids", "cholesterol", "monoacylglycerol", "methionine", "atp", "leucine", "pyruvate", "creatine", "sphingolipid", "amino acids", "galactose", "lactate", "glycerol", "triglycerides", "bile acid"], "key_players_hormones": ["Notes:", "il-6", "il-10", "tnf", "interleukin-6", "tumor necrosis factor", "il-4", "norepinephrine", "corticosterone", "insulin", "angiotensin", "crh", "gnrh", "cck", "angiotensin ii", "noradrenaline", "testosterone", "estradiol", "il-1beta", "tnf-alpha", "estrogen", "glucocorticoid", "aldosterone", "acth", "somatostatin", "progesterone", "interleukin-1", "t3", "secretin", "prolactin", "t4", "renin", "apelin", "fsh", "epinephrine", "lh", "motilin"], "key_players_proteins": ["Notes:", "hexokinase", "p38", "cox-2", "mapk", "erk1", "ampk"], "key_players_counts_metabolites": {"methionine": 2, "cholesterol": 3, "sphingolipid": 1, "amp": 8, "atp": 2, "amino acids": 1, "glucose": 28, "galactose": 1, "glutamate": 5, "leucine": 2, "lactate": 1, "prostaglandin": 4, "pyruvate": 2, "amino acid": 4, "glycerol": 1, "triglycerides": 1, "creatine": 2, "fatty acids": 4, "monoacylglycerol": 3, "glutamine": 6, "bile acid": 1}, "key_players_counts_hormones": {"progesterone": 2, "tnf": 21, "cck": 6, "testosterone": 5, "il-1beta": 4, "glucocorticoid": 3, "crh": 8, "interleukin-1": 2, "aldosterone": 3, "acth": 3, "angiotensin ii": 6, "il-4": 15, "norepinephrine": 15, "tnf-alpha": 4, "renin": 1, "noradrenaline": 6, "estrogen": 4, "insulin": 9, "t3": 2, "apelin": 1, "il-10": 22, "fsh": 1, "tumor necrosis factor": 17, "secretin": 2, "epinephrine": 1, "lh": 1, "motilin": 1, "corticosterone": 12, "il-6": 69, "gnrh": 8, "estradiol": 5, "prolactin": 2, "somatostatin": 3, "t4": 2, "angiotensin": 9, "interleukin-6": 20}, "key_players_counts_proteins": {"mapk": 1, "p38": 2, "cox-2": 2, "erk1": 1, "ampk": 1, "hexokinase": 5}, "notes": "- Might occur only during fasting as glucose is reserved for brain and immune system (bone marrow, spleen)", "sources": [], "ai_description": "", "pubmed_n": 138, "pubmed_papers": [{"pmid": "42328654", "title": "Polygonatum sibiricum combined with Poria cocos prevents spleen deficiency constipation via the gut microbiota-mediated brain-gut axis.", "abstract": "The study evaluates the preventive effects of Polygonatum sibiricum and Poria cocos (3:1) on spleen deficiency constipation in mice, focusing on the brain-gut axis, gut microbiota, and oxidative stress. The findings aim to inform the prevention and treatment of this condition. Thirty male specific pathogen-free (SPF) KM mice (4 weeks old, 20 &#xb1; 2&#xa0;g) were randomized into a normal control group (NC), a model group (NM), and a Polygonatum sibiricum and Poria cocos group (HF). Serum levels of 5-hydroxytryptamine (5-HT), cholecystokinin (CCK), motilin (MTL), and vasoactive intestinal peptide (VIP) were measured by ELISA. Liver superoxide dismutase (SOD) activity and malondialdehyde (MDA) content were measured by a spectrophotometer. Gut microbiota was analyzed by 16S rRNA sequencing. Compared to NM, the HF showed significantly increased 5-HT, CCK( p &lt; 0.05), and MTL ( p &lt; 0.001), and significantly decreased VIP( p &lt; 0.05). Liver MDA content was markedly higher in NM than in NC( p &lt; 0.01), with a downward trend in HF. Conversely, the liver SOD activity in NM was significantly lower than in NC( p &lt; 0.001), and the HF displayed an upward trend. Microbiota analysis revealed higher diversity in HF, as indicated by higher chao1, pielou_e, shannon, and simpson indices. The gut microbiota species composition in the HF was dominated by beneficial bacteria such as Bacteroidota and Faecalibaculum , with a reduction in pathogenic bacteria such as Proteobacteria and Escherichia-Shigella . The characteristic gut microbiota of the NM was enriched in Escherichia-Shigella and its conditional pathogens, while the characteristic gut microbiota of the HF was enriched in beneficial symbiotic bacteria such as Akkermansia , Blautia, and Bifidobacterium . The metabolic pathways and the genetic information processing pathway were improved in the HF, and the DNA repair and recombination protein pathways were also repaired. The P. sibiricum and P. cocos combination effectively prevents spleen deficiency constipation, an effect associated with the brain-gut axis and gut microbiota. The observed trends in oxidative stress markers warrant further investigation.", "keywords": [], "year": "2026", "doi": "10.3389/fphar.2026.1793441"}, {"pmid": "42321169", "title": "Disruption of the brain-spleen axis impairs monocyte-microglia communication and accelerates disease progression in a mouse model of amyloidosis.", "abstract": "Alzheimer's disease (AD) is characterized by a prolonged asymptomatic phase before cognitive decline emerges, yet the mechanisms driving symptom onset remain unclear. Here, we hypothesized that the transition from asymptomatic to symptomatic disease is linked to dysfunction of brain-immune communication. Retrograde neuronal tracing in the 5xFAD mouse model of amyloidosis reveals reduced brain-spleen connectivity at advanced disease stages. To probe the functional role of the brain-spleen axis in coping with disease, we denervated the splenic nerve at an early presymptomatic stage. This intervention accelerated cognitive decline, impaired splenic hematopoiesis, diminished monocyte recruitment to the brain, disrupted monocyte-microglia signaling networks, and reduced the transition of microglia from a homeostatic to a disease-associated (DAM) state. Conversely, enhancing splenic noradrenergic input increased hematopoiesis, restored monocyte homing to the brain, and delayed cognitive impairment. The protective role of splenic monocytes was independently validated in a retinal cytotoxic injury model, in which splenic denervation impairs post-insult survival of retinal ganglion cells. Together, these findings identify an active brain-spleen circuit in&#xa0;regulating monocyte recruitment, and establish peripheral monocytes as important drivers of microglial state transitions and disease progression.", "keywords": [], "year": "2026", "doi": "10.1038/s41467-026-74253-z"}, {"pmid": "42285095", "title": "Piriform cortex gates learned fear through a brain-spleen neuroimmune axis.", "abstract": "Maladaptive learned fear responses to stress underlie several debilitating neuropsychiatric disorders. Here, we identify a brain-to-spleen neural pathway that mediates learned fear through coordinated neuroimmune interactions. Using a chronic acquired olfactory stress (CAOS) model, we demonstrate that sustained enhancement of the piriform cortex (Pir) excitability contributes to the transformation of stress-associated olfactory inputs into learned fear-avoidance behavior. Through comprehensive neural tracing approaches, we mapped a functional tetrasynaptic circuit (Pir&#x2192;ventral hippocampus CA1 subregion [vCA1]&#x2192;CeM&#x2192;DVC&#x2192;spleen) regulating T helper 17 (Th17) cell-dependent fear responses. Single-nucleus RNA sequencing revealed that olfactomedin 3-expressing glutamatergic neurons in the Pir integrate olfactory stress inputs to activate this pathway. Importantly, targeted disruption of this circuit through either conditional knockdown of Olfm3 within Pir&#x2192;vCA1 projecting glutamatergic neurons or chemogenetic inhibition of these projections eliminated CAOS-induced splenic Th17 cell expansion and fear avoidance. These findings provide fundamental insights into how learned fear becomes maladaptive by identifying a complete neural circuit linking olfactory perception to peripheral immunity.", "keywords": [], "year": "2026", "doi": "10.1016/j.neuron.2026.05.023"}, {"pmid": "42262616", "title": "Splenic treg-related immunoregulation in the spleen-brain axis of alzheimer's disease: mechanisms and translational strategies.", "abstract": "Alzheimer's disease (AD) is traditionally characterized by amyloid-&#x3b2; (A&#x3b2;) plaque deposition, tau pathology, and neuroinflammation in the brain. Increasing evidence highlights the contribution of systemic immune dysregulation to AD progression, in which the spleen may serve as an important peripheral immune organ for sensing and integrating circulating signals. Splenic regulatory T cells (Tregs) contribute to immune tolerance and may shape myeloid-cell inflammatory and phagocytic functions, positioning them as potential modulators of how peripheral immune responses influence brain pathology. During AD progression, alterations in splenic Tregs may be associated with impaired systemic clearance and delayed resolution of inflammation, thereby potentially amplifying the crosstalk between peripheral and central pathological processes. This review synthesizes current knowledge on the spleen-brain axis, discusses potential mechanisms by which splenic Tregs regulate peripheral immune homeostasis, and highlights therapeutic strategies that leverage Treg-mediated immunoregulation to modulate AD-related pathological processes. These insights provide a foundation for exploring whether interventions that modulate splenic Treg function may influence disease progression in AD.", "keywords": ["Alzheimer Disease", "T-Lymphocytes, Regulatory", "Humans", "Spleen", "Brain", "Animals", "Amyloid beta-Peptides"], "year": "2026", "doi": "10.1007/s11033-026-12088-z"}, {"pmid": "42250115", "title": "Angiotensin II Receptor Signaling in the Hypothalamic-Pituitary-Adrenal Axis and Spleen After Spinal Cord Injury Depends on the Sympathetic Innervation Integrity.", "abstract": "Spinal cord injury (SCI) disrupts the integrated neuroendocrine network linking the hypothalamic-pituitary-adrenal (HPA) axis, renin-angiotensin-aldosterone system, and sympathetic nervous system, resulting in endocrine and immune dysfunction. However, the effects of SCI on angiotensin II receptor signaling remain unclear. This study investigated temporal and lesion-dependent changes in angiotensin II type 1 (AT 1 ) and type 2 (AT 2 ) receptor expression following SCI in rats. Low-thoracic SCI (Th9 compression, 40&#xa0;g/15 min) was evaluated over 28 days, while acute responses to partial (Th9) versus near-complete (Th1) sympathoadrenal denervation were compared. Receptor expression was assessed in the hypothalamic paraventricular nucleus, pituitary, adrenal gland, and spleen, and correlated with hormonal and morphological alterations. Surgical stress alone activated systemic angiotensin II signaling. Low-thoracic SCI induced time- and tissue-specific changes in angiotensin receptor expression independent of circulating angiotensin II levels, indicating adaptive remodeling of HPA axis sensitivity. SCI caused transient adrenal enlargement, zona fasciculata hypertrophy, dysregulated HPA axis activity, angiotensin II-independent aldosterone production, and altered catecholamine secretion. Splenic AT 1 receptor expression showed early upregulation followed by compensatory downregulation, consistent with dynamic neuroimmune modulation. In contrast, high-thoracic SCI markedly reduced receptor expression across central and peripheral HPA axis components and the spleen, accompanied by decreased corticotropin-releasing hormone, aldosterone, and norepinephrine, stable adrenocorticotropic hormone, and elevated corticosterone and epinephrine. These findings demonstrate that the extent of sympathetic disruption critically determines neuroendocrine-immune responses after SCI and identify sympathetic innervation as a key regulator of angiotensin receptor balance and stress-axis homeostasis following spinal cord trauma.", "keywords": [], "year": "2026", "doi": "10.1007/s10571-026-01760-4"}], "pubmed_query": "(\"brain\"[Title] OR \"cerebral\"[Title] OR \"hypothalamus\"[Title] OR \"hypothalamic\"[Title] OR \"central nervous system\"[Title] OR \"CNS\"[Title] OR \"neuronal\"[Title]) AND (\"spleen\"[Title] OR \"splenic\"[Title] OR \"splenomegaly\"[Title] OR \"lymphoid organ\"[Title] OR \"immune organ\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Brain__Thyroid", "source": "Brain", "target": "Thyroid", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: TSH, TH (T3, T4), Il-6, TNF-alpha\nNotes: \n- Thyroid hormones are essential for regulation of brain energy metabolism.\n- During inflammation Il-6 is produced by a multitude of cells/organs and leads to\nA decrease in plasma concentration of TSH and T3 in renal cancer patients. This might\nLead to a lower and generally dysregulated thyroid activity.\nSources:\n- doi: 10.3389/fnins.2024.1383355.\n- DOI: 10.1210/jcem.79.5.7962327", "connection_type": "Hormonal connection", "key_players": ["TSH", "TH (T3", "T4)", "Il-6", "TNF-alpha"], "key_players_metabolites": ["TSH", "TH (T3", "T4)", "Il-6", "TNF-alpha", "glucose", "ammonia", "propionate", "fructose", "cholesterol", "creatine", "ldl", "fatty acid", "acetate", "fatty acids", "phospholipid", "serine", "amp", "atp", "glutamate", "arginine", "amino acid", "succinate"], "key_players_hormones": ["TSH", "TH (T3", "T4)", "Il-6", "TNF-alpha", "thyroid hormone", "thyroid hormones", "t3", "t4", "thyrotropin", "thyroxine", "triiodothyronine", "insulin", "leptin", "vitamin d", "estrogen", "cortisol", "prolactin", "igf1", "growth hormone", "noradrenaline", "gnrh", "testosterone", "adrenaline", "glucocorticoid", "igf-1", "progesterone", "crh", "fsh", "tnf", "oxytocin", "norepinephrine", "lh", "estradiol", "somatostatin", "acth", "il-4", "il-10", "epinephrine", "vasopressin", "interleukin-6"], "key_players_proteins": ["TSH", "TH (T3", "T4)", "Il-6", "TNF-alpha", "pgc-1", "ucp1", "ampk", "mapk", "insulin receptor", "srebp", "hif1a", "fas", "akt", "inos", "acc", "mtor"], "key_players_counts_metabolites": {"cholesterol": 7, "ammonia": 12, "propionate": 8, "amp": 1, "atp": 1, "glucose": 17, "fatty acid": 2, "glutamate": 1, "ldl": 3, "arginine": 1, "amino acid": 1, "acetate": 2, "creatine": 4, "fatty acids": 2, "fructose": 8, "succinate": 1, "phospholipid": 2, "serine": 2}, "key_players_counts_hormones": {"progesterone": 3, "thyroid hormone": 263, "tnf": 2, "testosterone": 5, "glucocorticoid": 4, "thyroxine": 82, "crh": 3, "acth": 1, "igf-1": 4, "oxytocin": 2, "il-4": 1, "norepinephrine": 2, "cortisol": 12, "growth hormone": 6, "thyroid hormones": 191, "noradrenaline": 6, "estrogen": 15, "insulin": 38, "t3": 115, "vitamin d": 16, "il-10": 1, "fsh": 3, "adrenaline": 5, "triiodothyronine": 44, "epinephrine": 1, "lh": 2, "vasopressin": 1, "leptin": 18, "il-6": 1, "igf1": 7, "gnrh": 6, "tsh": 161, "estradiol": 2, "thyrotropin": 87, "prolactin": 12, "somatostatin": 2, "t4": 91, "interleukin-6": 1}, "key_players_counts_proteins": {"ucp1": 8, "mapk": 2, "hif1a": 1, "fas": 1, "insulin receptor": 2, "akt": 1, "pgc-1": 9, "ampk": 3, "inos": 1, "acc": 1, "mtor": 1, "srebp": 2}, "notes": "- Thyroid hormones are essential for regulation of brain energy metabolism.\n- During inflammation Il-6 is produced by a multitude of cells/organs and leads to\nA decrease in plasma concentration of TSH and T3 in renal cancer patients. This might\nLead to a lower and generally dysregulated thyroid activity.", "sources": ["doi: 10.3389/fnins.2024.1383355.", "DOI: 10.1210/jcem.79.5.7962327"], "ai_description": "", "pubmed_n": 199, "pubmed_papers": [{"pmid": "42306513", "title": "Helicobacter pylori infection and the hypothalamic-pituitary axis: association with cortisol and thyroid-stimulating hormone levels in adults.", "abstract": "Helicobacter pylori is a common chronic bacterial infection primarily associated with gastrointestinal disease. Increasing evidence suggests that H. pylori may also exert systemic effects beyond the stomach, including possible modulation of neuroendocrine pathways. This study aimed to investigate the association between H. pylori infection and alterations in serum cortisol and thyroid-stimulating hormone (TSH) levels as indicators of hypothalamic-pituitary-adrenal (HPA) and hypothalamic-pituitary-thyroid (HPT) axis activity. In this case-control study, 850 adults were enrolled, including 425 H. pylori -positive cases and 425 H. pylori -negative controls. Active H. pylori infection was determined using a monoclonal stool antigen test (HpSA). Fasting venous blood samples were collected between 08:00 and 10:00 AM under standardized conditions. Serum cortisol and TSH levels were measured using validated immunoassays. Group comparisons, correlation analysis, sex-stratified subgroup analysis, and receiver operating characteristic (ROC) curve analysis were performed. H. pylori -positive participants had significantly higher serum cortisol levels and lower TSH levels compared with controls (both p &lt; 0.001). A significant inverse correlation between cortisol and TSH was observed only in infected participants (r = -0.41, p &lt; 0.001). These hormonal alterations were evident in both sexes. ROC analysis showed moderate discriminatory performance for cortisol (AUC = 0.71) and fair-to-moderate performance for TSH (AUC = 0.67). H. pylori infection was significantly associated with elevated cortisol levels, reduced TSH levels, and an inverse relationship between both hormones in adults. These findings suggest that chronic H. pylori infection may influence both HPA and HPT axis regulation and support further investigation into its systemic neuroendocrine effects.", "keywords": [], "year": "2026", "doi": "10.18502/ijm.v18i3.21653"}, {"pmid": "42292908", "title": "Maternal Thyroid Supplementation Prevents Autistic-relevant Social Behavior and Hypothalamic Oxytocin Depletion Produced by Developmental Exposure to Environmental Toxicants.", "abstract": "Environmental toxicants that target the developing brain are suspected of contributing to autism spectrum disorder risk but causative evidence is lacking. We and others have shown that the indoor flame retardants, polybrominated diphenyl ethers (PBDEs), reduce prosocial behavior, however, few studies have assessed the central targets and underlying mechanisms. PBDEs are well established endocrine disruptors of the expanded thyroid system, which also regulates the prosocial neuropeptides oxytocin (OXT) and vasopressin (AVP) and their hypothalamic signaling. The potential role of PBDE-induced thyroid hormone (TH) deregulation in mediating disruption of central OXT and ASD-like social behavior deficits remains unmapped. To address this gap, we conducted a study in C57BL6/N mice that examined behavioral and neuromolecular reprogramming after developmental exposure to the commercial PBDE mixture, DE-71, and evaluated the therapeutic potential of TH supplementation. Dams were exposed daily during gestation and lactation to corn oil vehicle, low dose (0.1 mg/kg) and high dose (0.4 mg/kg) of DE-71 with or without concurrent L-thyroxine (+mT4). In offspring, dose-dependent ASD-relevant behavioral responses and central neuroendocrine OXT neuron depletion after developmental PBDE exposure was prevented with mT4. mRNA transcripts for the TH transporter Mct8 , deiodinase ( Dio3) and estrogen receptor beta ( Esr2 ) expressed on OXT neurons in PVH were upregulated in low dose females. In contrast, Mct8 and Dio3 were downregulated in low dose males. These findings uncover sex-specific mechanisms of PBDE-induced reprogramming of TH-regulated pathways in hypothalamic neuroendocrine cells leading to depleted central OXT signaling and ultimately ASD-relevant phenotypes. Importantly, we provide novel evidence of the therapeutic potential of maternal thyroid supplementation against toxicant-induced neurodevelopmental disorders.", "keywords": [], "year": "2025", "doi": "10.1101/2025.07.28.667293"}, {"pmid": "42276318", "title": "Neurotoxicity of myclobutanil in zebrafish larvae via thyroid disruption and neuronal apoptosis.", "abstract": "Myclobutanil (MYC) is a systemic synthetic triazole-class fungicide extensively deployed in global agriculture. Residues of MYC are often detected in various ecosystems and biological systems. However, studies investigating its potential neurodevelopmental toxicity are still scarce. In this research, zebrafish embryos were treated with MYC (at 0, 0.5, and 1&#x202f;mg/L) during 4 to 96&#x202f;h post fertilization (hpf) to assess its neurotoxic effects and underlying molecular pathways. Our results revealed that MYC adversely affected embryonic development, manifesting as reduced hatching rate, decreased survival rate, lower heart rate, concurrently with elevated malformation and spontaneous movement. Locomotor dysfunction was observed following MYC exposure. MYC also attenuated central nervous system neurogenesis in Tg(HuC:EGFP) zebrafish, as evidenced by diminished cholinesterase activities and decreased transcription of neurodevelopmental genes. In addition, MYC disturbed thyroid hormone balance and modulated the transcriptional profile of hypothalamus-pituitary-thyroid (HPT) axis-related genes. Molecular docking suggests a strong binding interaction between catalytic residues of thyroid hormone receptor &#x3b2; and MYC. Subsequently, MYC triggered apoptosis in brain neurons by upregulating apoptotic genes. These neurotoxic effects were effectively counteracted after T3 administration, suggesting thyroid dysfunction as a vital mechanism of MYC-induced neurotoxicity. Overall, this study reveals that MYC induces neurotoxicity in zebrafish larvae through thyroid hormone disruption and neuronal apoptosis, providing new insights into the developmental neurotoxic risks of triazole fungicides.", "keywords": [], "year": "2026", "doi": "10.1016/j.cbi.2026.112204"}, {"pmid": "42274556", "title": "Comparative Evaluation of hiPSC-Derived Brain Organoids as Platforms for Assessing Thyroid Hormone System Disrupting Chemicals.", "abstract": "Thyroid hormones (THs) are essential regulators of human brain development, and disrupted TH availability during pregnancy or early life is linked to adverse neurodevelopmental outcomes. Concerns that environmental chemicals interfere with TH signalling have increased the need for human-relevant in vitro systems to identify thyroid hormone system-disrupting chemicals (THSDCs) for risk assessment. Here, we compared two human-induced pluripotent stem cell (hiPSC)-derived brain organoid models for THSDC assessment: (i) human cortical organoids (COs) generated by unguided differentiation, offering higher architectural complexity but lower throughput; and (ii) neural stem cell-derived organoids (NSCOs), designed for scalability with reduced cellular diversity. Both models expressed key TH handling components, including the transporter SLC16A2 (MCT8) and the inactivating enzyme DIO3 . Using LC-MS/MS, we show that exogenous T3 is depleted from culture media and metabolized to 3,3'-T2 and 3'-T1 in both models, alongside upregulation of T3-responsive genes ( HR , KLF9 , DIO3 , SEMA3C ). Pulse and chronic co-exposures to reference disruptors iopanoic acid (IA, deiodinase inhibitor) and silychristin (SC, MCT8 inhibitor) altered T3 metabolism and modulated T3-responsive transcriptional endpoints. In NSCOs, high-content imaging revealed treatment-associated changes in cell composition, with chronic T3 reducing the SOX2-positive progenitor pool and THSDCs blocking this effect. Together, these findings provide a framework for organoid qualification-linking TH handling, transcriptomic responsiveness, and scalable phenotypic readouts-as a necessary step toward model validation and implementation of brain organoids in THSDC risk assessment pipelines.", "keywords": ["Organoids", "Humans", "Thyroid Hormones", "Induced Pluripotent Stem Cells", "Brain", "Cell Differentiation", "Endocrine Disruptors", "Neural Stem Cells", "Iodide Peroxidase"], "year": "2026", "doi": "10.3390/cells15110963"}, {"pmid": "42269856", "title": "Roles of the nuclear receptor corepressor 1 (NCoR1) and the silencing mediator of retinoid and thyroid hormone receptors (SMRT) in the developing brain.", "abstract": "Nuclear receptor corepressor 1 (NCoR1) and silencing mediator of retinoic acid and thyroid hormone (SMRT) are critical regulators that mediate transcriptional repression through histone deacetylation. Despite high structural homology, their distinct roles in the central nervous system remain poorly understood. To elucidate these roles, we generated neuronal-specific NCoR1 or SMRT knockout mice using Snap25-IRES2-Cre mice. Behavioral assessments revealed that while both NCoR1 and SMRT deficiency led to hypoactivity, social deficits, and mild anxiety, NCoR1-deficient mice uniquely exhibited enhanced learning abilities in a visual discrimination task, indicating functional separation in cognitive regulation. This divergence was supported by RNA-sequencing in the amygdala at postnatal day 21 (PND 21), where SMRT deletion upregulated 449 genes, whereas NCoR1 deletion upregulated only 8 genes. Furthermore, we investigated the protein stability of HDAC3, the primary enzymatic partner of these corepressors. At PND 21, HDAC3 levels were significantly reduced in the NCoR1-deficient hippocampus but significantly increased in the SMRT-deficient amygdala. In contrast, HDAC3 levels remained stable in the adult cerebellum and PND 3 cerebrum regardless of corepressor status. Notably, while mice with deletion of both NCoR1 and SMRT exhibit early postnatal lethality, their HDAC3 levels were unchanged compared to controls at PND 3, suggesting that the lethal phenotype is not primarily driven by a systemic loss of HDAC3 protein. Collectively, our findings demonstrate that NCoR1 and SMRT function through independent transcriptional networks and context-dependent regulatory mechanisms. This study highlights the specialized, non-redundant roles of these homologous corepressors in the brain according to developmental stage and region.", "keywords": [], "year": "2026", "doi": "10.1016/j.lfs.2026.124523"}], "pubmed_query": "(\"brain\"[Title] OR \"cerebral\"[Title] OR \"hypothalamus\"[Title] OR \"hypothalamic\"[Title] OR \"central nervous system\"[Title] OR \"CNS\"[Title] OR \"neuronal\"[Title]) AND (\"thyroid\"[Title] OR \"thyroid gland\"[Title] OR \"thyroid hormone\"[Title] OR \"T3\"[Title] OR \"T4\"[Title] OR \"TSH\"[Title] OR \"hypothyroidism\"[Title] OR \"hyperthyroidism\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Colon__Small Intestine", "source": "Colon", "target": "Small Intestine", "color": "#64748b", "description": "Type: Similar organ function. Correlation might depend on fasting state/last meal.\nKey Players: \nNotes: \nSources:", "connection_type": "Similar organ function. Correlation might depend on fasting state/last meal.", "key_players": ["Notes:"], "key_players_metabolites": ["Notes:", "glucose", "fatty acids", "cholesterol", "bile acid", "fatty acid", "butyrate", "amino acid", "bile acids", "propionate", "leucine", "triglycerides", "hdl", "lipoprotein", "acetate", "sphingolipid", "amp", "lactate", "alanine", "amino acids", "galactose", "pyruvate", "glycogen", "branched-chain amino acid", "glutamate", "ldl", "cysteine", "arginine", "creatinine", "triglyceride", "methionine", "glycine", "atp", "chenodeoxycholic acid", "lithocholic acid", "sphingosine-1-phosphate", "free fatty acids", "ffa", "urea", "fructose", "succinate", "nadh", "deoxycholic acid"], "key_players_hormones": ["Notes:", "tnf", "insulin", "il-6", "il-4", "tumor necrosis factor", "glp-1", "il6", "vitamin d", "il-10", "cck", "glucagon", "estrogen", "corticosterone", "interleukin-6", "progesterone", "aldosterone", "norepinephrine", "adrenaline", "leptin", "il1b", "motilin", "estradiol", "glp1"], "key_players_proteins": ["Notes:", "fxr", "sirt1", "mapk", "foxo1", "akt", "tgr5", "cd36", "pi3k", "mtor", "cyp7a1", "lxr", "ucp1", "p38", "pparg", "sglt2", "glp-1 receptor", "insulin receptor", "sglt1", "cox-2", "ampk", "inos", "pkm2", "sirt3"], "key_players_counts_metabolites": {"methionine": 1, "cholesterol": 34, "sphingolipid": 5, "glycine": 1, "propionate": 11, "amp": 5, "glycogen": 2, "atp": 1, "chenodeoxycholic acid": 1, "bile acids": 13, "hdl": 6, "branched-chain amino acid": 2, "lithocholic acid": 1, "amino acids": 3, "glucose": 49, "sphingosine-1-phosphate": 1, "galactose": 3, "fatty acid": 28, "glutamate": 2, "leucine": 8, "ldl": 2, "lactate": 5, "cysteine": 2, "free fatty acids": 1, "arginine": 2, "butyrate": 25, "pyruvate": 3, "amino acid": 14, "creatinine": 2, "lipoprotein": 6, "triglycerides": 7, "ffa": 1, "acetate": 6, "urea": 1, "triglyceride": 2, "fatty acids": 41, "fructose": 1, "succinate": 1, "nadh": 1, "deoxycholic acid": 1, "bile acid": 34, "alanine": 5}, "key_players_counts_hormones": {"progesterone": 1, "tnf": 23, "cck": 2, "aldosterone": 1, "glucagon": 2, "il-4": 7, "norepinephrine": 1, "il6": 3, "estrogen": 2, "insulin": 21, "vitamin d": 3, "il-10": 3, "adrenaline": 1, "tumor necrosis factor": 6, "leptin": 1, "il1b": 1, "motilin": 1, "glp-1": 4, "corticosterone": 2, "il-6": 20, "estradiol": 1, "glp1": 1, "interleukin-6": 2}, "key_players_counts_proteins": {"ucp1": 1, "mapk": 6, "pi3k": 2, "foxo1": 3, "p38": 1, "pparg": 1, "sglt2": 1, "glp-1 receptor": 1, "insulin receptor": 1, "akt": 3, "tgr5": 3, "sglt1": 1, "cox-2": 1, "cd36": 3, "ampk": 1, "sirt1": 11, "inos": 1, "fxr": 17, "mtor": 2, "pkm2": 1, "sirt3": 1, "cyp7a1": 2, "lxr": 2}, "notes": "", "sources": [], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42337354", "title": "Fermented food microbiome: influence on oral and gut microbiota, and human health.", "abstract": "The fermented food microbiome comprises live microorganisms, their genetic elements and their metabolites, and represents an established dietary approach for modulating host-microbiome interactions through the consumption of fermented foods. Fermentation enhances food preservation and nutrient bioavailability, and supplies the host with probiotics, prebiotic substrates and postbiotic metabolites. These bioactive compounds can influence the oral and gut microbiota, modulate immune function and support metabolic resilience. Fibre-rich, plant-based fermented foods retain such components within structured matrices that enhance microbial viability and mucosal interactions more consistently than do fermented dairy foods. This Review explores how the fermented food microbiome affects the oral-gut axis via both transient microbial exposure and metabolite-mediated signalling. Drawing on clinical and preclinical evidence, we examine how fermented food intake alters resident microbiota and host physiology throughout the digestive tract. Despite growing evidence, the mechanisms through which fermented food might promote health remain insufficiently defined in humans owing to strain variability, inconsistency in microbial composition across fermented foods, heterogeneous clinical outcomes and regulatory ambiguity. Taking into account these limitations, we propose a roadmap to integrate the fermented food microbiome into precision nutrition as a feasible, personalized, diet-based strategy to promote health and prevent disease.", "keywords": [], "year": "2026", "doi": "10.1038/s41579-026-01333-8"}, {"pmid": "42337290", "title": "Gut microbiota contributions to anorexia nervosa pathogenesis: insights from the activity-based anorexia model.", "abstract": "Anorexia nervosa (AN) is a severe eating disorder that profoundly affects quality of life. Despite increasing understanding of the neurobiological basis of the disease, many patients develop a chronic course of illness accompanied by a variety of physical and psychiatric comorbidities. To investigate the contribution of the gut microbiome to disease progression, we employed the activity-based anorexia (ABA) mouse model of AN. We performed fecal microbiota transplantation using samples from three donor groups: healthy controls, patients with acute AN, and patients with severe and enduring AN (SEAN). We continuously assessed changes in the gut microbiota and fecal metabolites (e.g., short-chain fatty acids, serotonin, and GABA) throughout the experiment, along with behavioral traits across the three groups of mice. Mice colonized with microbiota from acute AN patients exhibited reduced hunger signaling (via NPY, AgRP, MCH, and orexin), accompanied by decreased food intake. In contrast, mice transplanted with microbiota from SEAN patients showed appetite signaling and food consumption comparable to those colonized with microbiota from healthy controls but displayed significantly higher running activity relative to the other groups. However, the distinct microbiota did not affect the development of the ABA phenotype. Overall, our findings suggest that changes in the gut microbiome during disease development contribute to disease progression. Our results also indicate that restoration of a healthy gut microbiome is essential for complete recovery.", "keywords": [], "year": "2026", "doi": "10.1038/s41522-026-01055-y"}, {"pmid": "42336868", "title": "Oxygen homeostasis: new insight of gut microbiota-host interactions.", "abstract": "Oxygen homeostasis is a key ecological factor shaping microbial composition, epithelial function, and immune balance in the gut. Spatial and developmental oxygen gradients drive the transition from facultative to obligate anaerobes. Gut hypoxia is maintained by epithelial oxygen consumption and microbial metabolism, forming a positive feedback loop that supports barrier integrity and immune homeostasis. Disruption by inflammation, antibiotics, or diet elevates oxygen availability, promoting dysbiosis, pathogen expansion, and disease risk.", "keywords": [], "year": "2026", "doi": "10.1038/s41522-026-01062-z"}, {"pmid": "42335822", "title": "Long-term groundwater arsenic exposure is associated with altered arsenic methylation capacity and gut microbiota composition in a rural Chinese population.", "abstract": "This study investigated the relationship between long-term groundwater arsenic exposure, arsenic methylation capacity, and gut microbiota in adults from rural northern China. Arsenic detoxification relies in part on methylation processes, and growing evidence suggests that the gut microbiome may participate in arsenic biotransformation, yet population-based data integrating exposure, metabolism, and microbial profiles remain scarce. We recruited 258 participants from two neighboring villages supplied by centralized wells with contrasting arsenic levels (control, n&#x202f;=&#x202f;138; exposure, n&#x202f;=&#x202f;120). Total urinary arsenic was measured in all participants, and arsenic species were quantified in a subgroup (n&#x202f;=&#x202f;60) to derive primary and secondary methylation indices (PMI and SMI). Fecal metagenomes were sequenced to characterize taxonomic composition and functional potential based on KEGG and GO annotations. Individuals in the exposure village showed higher levels of urinary inorganic arsenic and methylated metabolites. While PMI was comparable between groups, SMI was significantly reduced among exposed individuals, indicating impaired secondary methylation. Arsenic exposure was also associated with pronounced alterations in gut microbial diversity and community structure. Several anaerobic taxa, largely linked to fermentative metabolism, were positively associated with SMI after multivariable adjustment. Functional analyses further revealed differences in pathways related to transport, environmental sensing, and metabolism. These findings suggest that chronic arsenic exposure is associated with reduced methylation efficiency and shifts in gut microbial composition and function, and that the gut microbiome may contribute to interindividual variability in arsenic metabolism and toxicity.", "keywords": [], "year": "2026", "doi": "10.1016/j.jhazmat.2026.142658"}, {"pmid": "42335639", "title": "Ciwujianoside B alleviates cholestatic liver injury by regulating TMAO synthesis via remodeling of the gut microbiota.", "abstract": "Cholestatic liver injury (CLI) is mainly driven by intrahepatic cholestasis, a pathological condition characterized by systemic and intrahepatic accumulation of bile acids. Ciwujianoside B (CWB), the active constituent of Eleutherococcus senticosus, has demonstrated protective effects in various hepatic pathologies, but its functional role in CLI has not yet been investigated. This study aims to evaluate the therapeutic potential of CWB against CLI and investigate its mechanism. CLI was induced via bile duct ligation, and the protective effects of CWB were assessed through H&amp;E, Sirius red, and immunohistochemical staining. Inflammatory cytokines in serum were measured by ELISA. Integrated analysis of 16S rDNA sequencing, serum metabolomics, and fecal microbiota transplantation was performed to investigate the interactions between gut microbiota and host metabolism. Trimethylamine oxide (TMAO) was supplemented to evaluate its impact on the hepatoprotective effects of CWB. In AML-12 cells, flavin-containing monooxygenase 3 (FMO3) was knockdown or overexpressed to assess TMAO levels, apoptosis, reactive oxygen species (ROS) content, and endoplasmic reticulum (ER) stress. The interaction between CWB and FMO3 was evaluated with molecular docking and molecular dynamics simulations. CWB alleviated hepatocellular damage and apoptosis, which was accompanied by reduced serum levels of ALT, AST, ALP, and inflammatory cytokines. Mechanistic analyses revealed that CWB remodeled the gut microbiota, suppressed Cut C and Cut D levels in feces, thereby reducing systemic TMAO accumulation. Exogenous TMAO supplementation reversed the protective effect of CWB. Antibiotic treatment partially abrogated the hepatic protective effects of CWB. CWB significantly suppressed FMO3 expression. Knockdown of FMO3 in AML-12 cells led to a reduction in intracellular TMAO levels, apoptosis rate, ROS content and ER stress activation. Molecular docking revealed a stable binding interaction between CWB and FMO3. Our results suggest that CWB alleviates CLI by suppressing TMAO biosynthesis, primarily through reducing trimethylamine-producing bacteria and directly inhibiting hepatic FMO3 expression.", "keywords": [], "year": "2026", "doi": "10.1016/j.phymed.2026.158426"}], "pubmed_query": "(\"colon\"[Title] OR \"large intestine\"[Title] OR \"colorectal\"[Title] OR \"colonic\"[Title] OR \"gut microbiota\"[Title] OR \"microbiome\"[Title]) AND (\"small intestine\"[Title] OR \"duodenum\"[Title] OR \"jejunum\"[Title] OR \"ileum\"[Title] OR \"intestinal\"[Title] OR \"gut\"[Title] OR \"enterocyte\"[Title] OR \"Peyer's patches\"[Title] OR \"gut-brain axis\"[Title] OR \"enteroendocrine\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Heart__Kidney", "source": "Heart", "target": "Kidney", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: TSH, TH, Insulin, Glucagon\nNotes: - At a fasting and resting state, the heart, kidney, and liver all take up Fatty acids secreted form the WAT which might lead to a more coordinated metabolism of these organs.\nSources:", "connection_type": "Hormonal connection", "key_players": ["TSH", "TH", "Insulin", "Glucagon"], "key_players_metabolites": ["TSH", "TH", "Insulin", "Glucagon", "glucose", "creatinine", "cholesterol", "triglyceride", "atp", "hdl", "urea", "amp", "lipoprotein", "uric acid", "amino acids", "ldl", "triglycerides", "fatty acid", "ammonia", "glutamate", "lactate", "arginine", "malate", "creatine", "fatty acids", "serine", "glycine", "palmitate", "citrate", "pyruvate", "succinate", "bile acid"], "key_players_hormones": ["TSH", "TH", "Insulin", "Glucagon", "angiotensin", "fgf23", "klotho", "natriuretic peptide", "renin", "mineralocorticoid", "vasopressin", "norepinephrine", "aldosterone", "il-6", "glp-1", "tnf", "interleukin-6", "bnp", "fetuin-a", "angiotensin ii", "leptin", "gip", "adiponectin", "t3", "vitamin d", "tumor necrosis factor", "il-10", "t4", "anp"], "key_players_proteins": ["TSH", "TH", "Insulin", "Glucagon", "sglt2", "mtor", "acc", "mtorc1", "mtorc2", "sirt1", "mapk", "nos2", "pi3k", "pparg", "glp-1 receptor", "akt", "cd36", "pgc-1"], "key_players_counts_metabolites": {"cholesterol": 14, "ammonia": 2, "glycine": 1, "amp": 5, "palmitate": 1, "citrate": 1, "atp": 8, "hdl": 7, "amino acids": 4, "glucose": 81, "fatty acid": 3, "glutamate": 2, "ldl": 4, "lactate": 2, "arginine": 2, "pyruvate": 1, "malate": 2, "creatinine": 37, "lipoprotein": 5, "triglycerides": 4, "creatine": 2, "uric acid": 5, "urea": 6, "triglyceride": 10, "fatty acids": 2, "succinate": 1, "serine": 2, "bile acid": 1}, "key_players_counts_hormones": {"tnf": 5, "bnp": 4, "natriuretic peptide": 22, "fetuin-a": 4, "fgf23": 30, "aldosterone": 10, "glucagon": 18, "mineralocorticoid": 16, "angiotensin ii": 4, "norepinephrine": 11, "renin": 20, "adiponectin": 2, "insulin": 25, "t3": 2, "vitamin d": 2, "il-10": 1, "tumor necrosis factor": 2, "vasopressin": 12, "klotho": 23, "leptin": 4, "glp-1": 9, "il-6": 10, "gip": 3, "t4": 1, "anp": 1, "angiotensin": 42, "interleukin-6": 5}, "key_players_counts_proteins": {"mapk": 3, "nos2": 1, "pi3k": 1, "mtorc1": 5, "mtorc2": 4, "pparg": 1, "sglt2": 45, "glp-1 receptor": 1, "akt": 1, "cd36": 1, "pgc-1": 1, "sirt1": 4, "acc": 9, "mtor": 10}, "notes": "- At a fasting and resting state, the heart, kidney, and liver all take up Fatty acids secreted form the WAT which might lead to a more coordinated metabolism of these organs.", "sources": [], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42331355", "title": "Interaction of heart failure with chronic kidney disease, liver disease and cancer: the need for systems cardiology.", "abstract": "", "keywords": [], "year": "2026", "doi": "10.1093/eurheartj/ehag476"}, {"pmid": "42329131", "title": "Do the treatment selection factors emphasized in clinical guidelines-Chronic kidney disease, cardiovascular disease, and heart failure-contribute to the risk of urinary tract infections during the administration of sodium-glucose cotransporter-2 inhibitors?", "abstract": "Sodium-glucose cotransporter-2 inhibitors (SGLT2Is) are recommended in Japan for patients with cardiovascular disease (CVD), heart failure (HF), or chronic kidney disease (CKD) due to their organ-protective effects, leading to increased use in high-risk populations. However, whether urinary tract infection (UTI) risk associated with SGLT2Is differs according to the presence of these factors remains unclear. This study aimed to estimate UTI risk among SGLT2I users and treatment selection factors and examine whether these factors modify risk. We selected dipeptidyl peptidase-4 inhibitors (DPP4Is) as the comparators. This retrospective cohort study used DeSC claims data from patients with diabetes mellitus who received their first prescription for either an SGLT2I or a DPP4I between October 2014 and February 2023. The analysis focused on data from 2019 to 2022. Hazard ratios (HRs) for UTI incidence were estimated using Cox proportional hazard regression. A total of 66,968 SGLT2I users and 170,678 DPP4I users were aged 65&#x2009;years or older. UTI incidence among SGLT2I users was 2.04% in those with treatment selection factors and 0.84% in those without. Compared with DPP4I users, the HR for UTI was 0.80 in patients with treatment selection factors and 0.51 in those without treatment selection factors. SGLT2I use was not associated with an increase in UTI risk, regardless of treatment selection factor status. These findings suggest a favorable safety profile for SGLT2Is even among high-risk populations, supporting their use following clinical guidelines.", "keywords": [], "year": "2026", "doi": "10.1111/jdi.70362"}, {"pmid": "42325759", "title": "Application of 131 I-MIBG imaging in assessing renal sympathetic overdrive in heart failure with preserved ejection fraction (HFpEF).", "abstract": "To quantitatively assess cardiac and renal sympathetic nerve activity using 131 I-metaiodobenzylguanidine (MIBG) imaging, in patients with heart failure with preserved ejection fraction (HFpEF) diagnosed via left heart catheterization, compared with matched controls. The study enrolled 18 HFpEF patients (diagnosed via left heart catheterization for exertional dyspnea as the test group) and 10 matched controls. All subjects underwent cardiac and renal 131 I-MIBG imaging. We measured early (15 min, reflecting nerve density/uptake) and delayed (4 h, reflecting neurotransmitter storage/turnover) kidney-to-mediastinum (K/M) and heart-to-mediastinum (H/M) ratios, as well as washout rates (WR). Invasive hemodynamic measurements showed elevated mean left ventricular end-diastolic pressure (mLVEDP) in the test group [21 (18, 24) mmHg vs. 7.5 (5, 8) mmHg, P &lt; 0.05]. Notably, 131 I-MIBG imaging indicated significantly higher renal sympathetic activation in the test group during both the early and delayed phases (K/M15min: 10.5 &#xb1; 2.5 vs. 3.7 &#xb1; 0.45 and K/M4h: 8.1 &#xb1; 3.3 vs. 4.6 &#xb1; 0.3, P &lt; 0.05), the former being approximately two to three times greater than the latter. This hypersympathetic state significantly paralleled the elevation in LAD and mLVEDP (P &lt; 0.05), indicating a direct link between renal neuro-overactivity and cardiac diastolic impairment. 131 I-MIBG imaging successfully quantifies renal-cardiac sympathetic crosstalk in HFpEF. The markedly elevated K/M ratios demonstrate that renal sympathetic overactivity is a core driver of hemodynamic congestion in these patients. Clinically, this technique may serve as a powerful non-invasive biomarker to identify candidates for sympatho-inhibitory therapies and provides a precise tool for monitoring therapeutic efficacy in HFpEF management.", "keywords": [], "year": "2026", "doi": "10.62347/OBPS4683"}, {"pmid": "42318367", "title": "Nivolumab-Associated Cardiac Manifestation of Cutaneous T-Cell Lymphoma in a Patient With Concurrent Renal Cell Carcinoma.", "abstract": "Cardiac involvement by cutaneous T-cell lymphoma is exceedingly rare and poses considerable diagnostic and therapeutic challenges. Immune checkpoint inhibitors targeting programmed cell death-1 have reported variable activity in T-cell lymphomas and have been associated with paradoxical progression in select cases. We report a 72-year-old man with longstanding indolent CD8-positive cutaneous T-cell lymphoma and metastatic renal cell carcinoma who developed myocardial infiltration by lymphoma after prolonged nivolumab therapy. Diagnosis was established by surgical cardiac biopsy reporting CD3-positive, CD8-positive, and CD30-negative T-cell lymphoma with clonal overlap with prior cutaneous disease. Given concern for paradoxical progression, therapy was transitioned to avelumab, an antiprogrammed death ligand-1 antibody. After nivolumab discontinuation and transition to avelumab, the patient experienced complete metabolic resolution of cardiac involvement, improvement in cardiac biomarkers, and durable control of cutaneous lymphoma over more than 3 years of follow-up. This case highlights a temporal association between programmed cell death-1 blockade and atypical dissemination of cutaneous T-cell lymphoma, supported by biologic plausibility, and underscores a potential therapeutic distinction between programmed cell death-1 and programmed death ligand-1 inhibition in malignant T-cell disorders.", "keywords": [], "year": "2026", "doi": "10.1016/j.mayocpiqo.2026.100728"}, {"pmid": "42312166", "title": "Kidney-Targeted Nanoparticle Delivery of Formoterol Mitigates Diabetic Kidney Disease without Adverse Cardiac Effects.", "abstract": "Mitochondrial dysfunction plays a critical role in the progression of diabetic kidney disease (DKD). Previous research indicates that the FDA-approved &#x3b2;2-adrenergic receptor agonist and bronchodilator formoterol are efficacious at restoring mitochondrial function and slowing DKD progression. Unfortunately, &#x3b2;2-adrenergic receptor antagonists have been shown to result in cardiovascular toxicity. To mitigate these negative effects while maintaining the therapeutic capabilities of formoterol, we developed formoterol-containing renally targeted polymeric nanoparticles (NPs). Biocompatible NPs were synthesized (300-400 nm), and efficient internalization by renal proximal tubule cells was confirmed. NPs were administered to SKH-1 Elite mice, and renal accumulation was observed within 1h and retained for 144h. To determine the therapeutic potential of this strategy for DKD treatment, BTBR ob / ob mice, a model of type 2 diabetes, were administered formoterol free drug (FFD) or formoterol-containing NPs (FNP) for 8 weeks. FFD and FNP administration slowed progression of DKD, as evidenced by reduced blood glucose levels, urine output, and the albumin:creatinine ratio. FNPs also decreased glomerular hyperfiltration, mesangial expansion, glomerulosclerosis, and tubular inflammation in BTBR ob / ob mice. Importantly, unlike FFD, the chronic administration of NP-encapsulated formoterol did not show evidence of cardiovascular toxicity. This approach introduces novel renally targeted, formoterol-containing polymeric NPs as a potential therapeutic for hyperglycemia-induced DKD.", "keywords": [], "year": "2026", "doi": "10.1021/acsptsci.6c00009"}], "pubmed_query": "(\"heart\"[Title] OR \"cardiac\"[Title] OR \"myocardial\"[Title] OR \"cardiomyocyte\"[Title] OR \"left ventricle\"[Title] OR \"myocardium\"[Title]) AND (\"kidney\"[Title] OR \"renal\"[Title] OR \"nephron\"[Title] OR \"glomerular\"[Title] OR \"tubular\"[Title] OR \"nephrology\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Heart__Liver", "source": "Heart", "target": "Liver", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: TSH, TH, Insulin, Glucagon\nNotes: - At a fasting and resting state, the heart, kidney, and liver all take up Fatty acids secreted form the WAT which might lead to a more coordinated metabolism of these organs.\nSources:", "connection_type": "Hormonal connection", "key_players": ["TSH", "TH", "Insulin", "Glucagon"], "key_players_metabolites": ["TSH", "TH", "Insulin", "Glucagon", "glucose", "fructose", "alanine", "bilirubin", "fatty acid", "fatty acids", "cholesterol", "triglycerides", "triglyceride", "glycogen", "atp", "amino acids", "lipoprotein", "uric acid", "amp", "glutamate", "amino acid", "serine", "hdl", "ldl", "nefa", "acetyl-coa", "creatinine", "acetate", "palmitate", "citrate", "bile acids", "isoleucine", "leucine", "lactate", "prostaglandin", "arginine", "creatine", "urea", "succinate", "nadh", "phospholipid", "nadph", "bile acid"], "key_players_hormones": ["TSH", "TH", "Insulin", "Glucagon", "angiotensin", "tnf", "fetuin-a", "natriuretic peptide", "igf1", "anp", "adiponectin", "vitamin d", "glp-1", "il-6", "fgf21", "mineralocorticoid", "angiotensin ii", "tumor necrosis factor", "renin", "t3", "il-10", "vasopressin", "interleukin-6", "erythropoietin", "visfatin"], "key_players_proteins": ["TSH", "TH", "Insulin", "Glucagon", "sglt2", "cd36", "ampk", "mtor", "akt", "sirt1", "glp-1 receptor", "mtorc1", "mtorc2", "adiponectin receptor", "pgc-1", "inos", "insulin receptor", "sglt1", "pi3k", "p38", "glut4", "cpt1", "cyp7a1", "srebp"], "key_players_counts_metabolites": {"cholesterol": 8, "amp": 5, "glycogen": 7, "palmitate": 1, "citrate": 1, "atp": 7, "bilirubin": 16, "bile acids": 1, "hdl": 3, "acetyl-coa": 2, "amino acids": 7, "glucose": 50, "isoleucine": 1, "fatty acid": 12, "glutamate": 4, "leucine": 1, "ldl": 3, "lactate": 1, "prostaglandin": 1, "arginine": 1, "nefa": 3, "amino acid": 4, "creatinine": 2, "lipoprotein": 6, "triglycerides": 8, "acetate": 2, "creatine": 1, "uric acid": 6, "urea": 1, "triglyceride": 8, "fatty acids": 10, "fructose": 23, "succinate": 1, "nadh": 1, "phospholipid": 1, "nadph": 1, "serine": 4, "bile acid": 1, "alanine": 17}, "key_players_counts_hormones": {"tnf": 10, "natriuretic peptide": 9, "fetuin-a": 10, "fgf21": 4, "glucagon": 6, "mineralocorticoid": 4, "angiotensin ii": 4, "erythropoietin": 1, "renin": 2, "adiponectin": 7, "insulin": 40, "t3": 2, "vitamin d": 7, "il-10": 2, "visfatin": 1, "tumor necrosis factor": 4, "vasopressin": 2, "glp-1": 7, "il-6": 5, "igf1": 8, "anp": 8, "angiotensin": 13, "interleukin-6": 2}, "key_players_counts_proteins": {"pi3k": 1, "mtorc1": 5, "p38": 1, "mtorc2": 4, "glut4": 1, "adiponectin receptor": 3, "sglt2": 13, "cpt1": 1, "glp-1 receptor": 6, "insulin receptor": 2, "akt": 9, "sglt1": 2, "cd36": 13, "pgc-1": 3, "ampk": 11, "sirt1": 7, "inos": 3, "mtor": 11, "cyp7a1": 1, "srebp": 1}, "notes": "- At a fasting and resting state, the heart, kidney, and liver all take up Fatty acids secreted form the WAT which might lead to a more coordinated metabolism of these organs.", "sources": [], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42331709", "title": "Metabolic dysfunction-associated fatty liver disease and cardiac remodeling in non-ischemic dilated cardiomyopathy.", "abstract": "Metabolic dysfunction-associated fatty liver disease (MAFLD) represents systemic metabolic dysfunction and is significantly associated with cardiovascular disease. However, its specific impact on cardiac remodeling in non-ischemic dilated cardiomyopathy (NIDCM) remains unclear. This study aimed to investigate the impact of MAFLD and liver fibrosis on biventricular remodeling in patients with NIDCM. We evaluated 293 NIDCM patients using comprehensive echocardiography. Liver fibrosis was assessed via the NAFLD Fibrosis Score (NFS). Associations were analyzed using multivariable linear regression and dose-response models. MAFLD was independently associated with a larger right ventricular diameter (RV; &#x3b2;&#xa0;=&#xa0;3.32, P&#xa0;=&#xa0;0.01), increased LV posterior wall thickness (&#x3b2;&#xa0;=&#xa0;0.399, P&#xa0;=&#xa0;0.037), and a lower LV mass index (LVMI; &#x3b2;&#xa0;=&#xa0;-22.11, P&#xa0;=&#xa0;0.006), alongside a reduced prevalence of eccentric hypertrophy. This reduction in LVMI showed a graded pattern across MAFLD subtypes, being most pronounced in MAFLD with diabetes. Independently of MAFLD, more severe liver fibrosis (higher NFS) was associated with larger right heart dimensions (RV, right atrium, and main pulmonary artery) across all adjusted models. MAFLD and liver fibrosis are associated with distinct cardiac remodeling phenotypes in NIDCM, notably right heart enlargement and a unique pattern of LV remodeling. These findings highlight the clinical relevance of the liver-heart axis and support routine hepatic assessment in NIDCM management.", "keywords": [], "year": "2026", "doi": "10.1016/j.numecd.2026.104752"}, {"pmid": "42331355", "title": "Interaction of heart failure with chronic kidney disease, liver disease and cancer: the need for systems cardiology.", "abstract": "", "keywords": [], "year": "2026", "doi": "10.1093/eurheartj/ehag476"}, {"pmid": "42323382", "title": "Protective effects of dietary omega-3 on cardiac and hepatic function, mortality, and gene expression in broilers under high stocking density.", "abstract": "This study aimed to investigate the effects of dietary omega-3 fatty acids on cardiac and liver function, mortality rates, hematological parameters, tissue morphometric, and gene expression in broilers exposed to high stocking density (HSD). A total of 420 one-day-old Arian broiler chicks were allocated to a 2 &#xd7; 2 factorial arrangements consisting of two stocking densities [standard stocking density (SSD; 9 birds/m 2 ) and high stocking density (HSD; 16 birds/m 2 )] and two levels of omega-3 supplementation (0.057% basal vs. 0.5%) within a completely randomized design. At 40 days of age, birds reared under HSD and supplemented with 0.5% omega-3 showed significantly lower total ventricle-to-body weight (TV/BW) and right ventricle-to-body weight (RV/BW) ratios compared with the other groups (P &#x2264; 0.05). Additionally, omega-3 supplementation significantly reduced mortality rates in birds reared under both SSD and HSD (P &#x2264; 0.05). Omega-3 supplementation signific
