rather than causally definitive, derived largely from small-scale trials and preclinical models. Rigorous, large-scale RCTs with standardized TCM protocols, multi-omics endpoints, and extended follow-up are essential to establish efficacy and safety before microbiota-based TCM interventions can be recommended as adjunctive or standalone therapies.", "keywords": [], "year": "2026", "doi": "10.3389/fmicb.2026.1817839"}, {"pmid": "42148943", "title": "Fermented goat milk powder promotes intestinal development and enhances splenic antioxidant function in mice.", "abstract": "Fermented goat milk powder, containing probiotic bacteria, may regulate intestinal flora and modulate immunity. This study aimed to evaluate the effects of fermented goat milk powder on intestinal development, gut microbiota composition, and splenic antioxidant capacity in young mice, and to explore the potential underlying mechanisms. Metabolomics results revealed that FGMP contains various bioactive components closely related to antioxidants, such as Creatine, Choline, Betaine, and O -acetyl-L-carnitine. Supplementation increased body weight and significantly elevated serum SOD, CAT, and GSH-Px activities while reducing MDA levels. It promoted intestinal development, evidenced by increased villus height and decreased crypt depth in the jejunum and ileum. Microbial sequencing revealed an altered gut microbiota, including reduced Escherichia - Shigella and increased abundances of several other genera. Concurrently, levels of arachidonic acid and related metabolites decreased. In the spleen, antioxidant capacity was enhanced, lipid peroxidation (4-HNE) was suppressed, and mRNA levels of ACSL4 , ALOX15 , NOX1 , PTGS2 , and LPCAT3 were downregulated. These results indicate that fermented goat milk powder supports intestinal development and inhibits splenic ferroptosis via the ACSL4 / ALOX15 pathway, enhancing antioxidant status.", "keywords": [], "year": "2026", "doi": "10.1039/d6fo00370b"}, {"pmid": "42137323", "title": "A novel method for real-time adulteration identification of heated-honey processed Astragali radix using REIMS-iKnife and its regulatory effects on gut microbiota, SCFAs, and immune function in spleen-deficient rats.", "abstract": "Astragali radix (AR) is a well-known traditional Chinese medicine (TCM). AR processed with heated honey (HAR) can enhance the effect in treating spleen deficiency. However, some people have used heated sugar as a substitute for heated honey in processing AR. The mechanism underlying the effect of HAR in ameliorating spleen deficiency has not been fully elucidated so far. Therefore, this study aimed to determine whether AR has been processed with heated honey or heated sugar. Subsequently, we compared the differential effects of AR and HAR on the composition of intestinal microbiota, short-chain fatty acid (SCFA) metabolism, and immune responses in spleen-deficient rats. Rapid evaporative ionization mass spectrometry (REIMS) was employed to detect AR processed with different types of heated honey, different types of heated sugar, and heated honey mixed with heated soft sugar in various proportions. 16S rRNA high-throughput sequencing was conducted to analyze the effects of AR and HAR on intestinal flora diversity in spleen-deficient rats. The regulatory effects of AR and HAR on SCFA metabolism in spleen-deficient rats were measured using headspace gas chromatography-mass spectrometry (HS-GC-MS). The effects of AR and HAR on specific and non-specific immunoreactivity in spleen-deficient rats were evaluated using enzyme-linked immunosorbent assay (ELISA). Furthermore, correlations were detected between different intestinal flora, short-chain fatty acids, and immune response factors. We successfully identified AR processed with heated potpourri honey, linden honey, and locust flower honey as genuine heated honey processed products. Additionally, we achieved accurate identification of AR processed with heated soft sugar or granulated white sugar and determined the proportion of adulterated sugar in samples. Both AR and HAR increased the abundance of beneficial gut bacteria, reduced the abundance of pathogenic bacteria, upregulated the synthesis of propionic acid and butyric acid, and modulated the metabolism of isovaleric acid. Notably, the positive effect of HAR on propionic acid expressinon was stronger than that of AR. Meanwhile, both AR and HAR significantly modulated the expression levels of immune factors in serum and colon samples, with HAR exhibiting superior regulatory effects compared to AR. The procedure developed in this study can help rapidly and accurately determine whether sugar has been added during the heated honey processing of AR. The enhanced effect of HAR on spleen deficiency may be associated with its regulatory effect on the abundance of Lactobacillus and Turicibacter genera. Through this effect, it promotes the synthesis of propionic acid, upregulates anti-inflammatory factors, downregulates pro-inflammatory factors, and enhances the immunomodulatory effect.", "keywords": [], "year": "2026", "doi": "10.3389/fphar.2026.1711584"}, {"pmid": "42078522", "title": "Sanyin decoction alleviates psoriasis by reshaping gut microbiota and modulating the gut-spleen-skin axis.", "abstract": "Sanyin decoction (SYD) is an improved formulation based on Xiaoyinsan, commonly used as an adjunct treatment for psoriasis; however, its molecular mechanisms remain unclear. A psoriasis-like mouse model was established using imiquimod induction. Mice were treated with SYD via gavage, and their health status was assessed based on skin histopathology, PASI scores, and ear thickness measurements. Fecal samples were collected for 16S rRNA sequencing and short-chain fatty acid (SCFA) analysis to examine changes in gut microbiota and SCFA levels before and after SYD treatment. Additionally, transcriptomic sequencing was performed on the spleen and skin lesions to analyze gene expression changes and immune modulation in these tissues. SYD improved the skin pathology, reduced lesion scores, and decreased ear thickness in psoriasis-like mice. Following treatment, the gut microbiota of treated mice showed significant enrichment of short-chain fatty acid-producing bacteria, including g__Lachnospiraceae, g__Rikenella , and g__Muribaculum , with increased levels of SCFAs, particularly acetate, in the feces. Transcriptomic analysis of splenic tissue revealed a significant upregulation of IL-4 expression and activation of G protein-coupled receptor-related signaling pathways following treatment. In addition, the abundance of regulatory T cells in the spleen was significantly increased. Plasma IL-4 level was significantly higher after treatment. In lesional skin, SYD treatment was associated with significant suppression of the IL-17 signaling pathway, along with activation of keratinocyte differentiation-related pathways were activated, promoting tissue repair. Our study suggests that acetate derived from gut microbiota may serve as an important link between SYD treatment and systemic immune regulation in psoriasis, highlighting the potential of the gut-spleen-skin axis as a target for traditional herbal interventions.", "keywords": [], "year": "2026", "doi": "10.3389/fmicb.2026.1799928"}, {"pmid": "42014006", "title": "Spleen metabolomics coupled with gut microbiome analysis to elucidate the immunomodulatory mechanisms of longan polysaccharides against cyclophosphamide-induced immunosuppression in mice.", "abstract": "Longan polysaccharide (LP) has exhibited excellent immunomodulatory activities by modifying gut microbiota but the specific regulatory mechanism remains unclear. Therefore, spleen metabolomics and metagenomic sequencing of gut microbiota were combined to investigate the immunomodulatory mechanism of LP in cyclophosphamide (CPA)-induced immunosuppressed mice with an intact and antibiotic-depleted microbiota. The results indicated that LP significantly restored thymic and splenic indices, increased lymphocyte proliferation, and mitigated damage to immune organs. LP up-regulated the ratio of CD4 + /CD8 + in the mouse spleen to modulated cytokine secretion, thereby increasing serum concentrations of IFN-&#x3b3;, TNF-&#x3b1;, IL-12, and IL-6. The metabolomic analysis indicated that LP alleviated CPA-induced splenic disturbance by coordinately improving amino acid metabolism, unsaturated fatty acid metabolism, and pyrimidine metabolism. Furthermore, LP significantly reshaped the CPA-induced gut microbiota imbalance, particularly by increasing the relative abundance of unclassified_f__Muribaculaceae and Bacteroides. However, antibiotic intervention almost offset the LP-mediated alleviation of immunosuppression. Our findings provide novel insights into the mechanisms underlying the immunosuppression-alleviating effects of natural polysaccharides.", "keywords": ["Animals", "Spleen", "Polysaccharides", "Cyclophosphamide", "Gastrointestinal Microbiome", "Mice", "Metabolomics", "Cytokines", "Immunosuppression Therapy", "Male", "Immunologic Factors", "Metabolome", "Immunosuppressive Agents"], "year": "2026", "doi": "10.1016/j.ijbiomac.2026.152109"}, {"pmid": "41890891", "title": "Gut microbiota and spleen-strengthening and dampness-dispelling therapies in obesity and related metabolic disorders: key mechanisms and therapeutic potential.", "abstract": "Obesity, characterized by excessive body fat and systemic low-level inflammation, is closely linked to energy imbalance and gut dysbiosis. Traditional Chinese medicine (TCM) attributes obesity to spleen deficiency and dampness excess, advocating \"strengthening the spleen and expelling dampness\" as the core treatment strategy. Studies have shown that TCM formulas, botanical drugs, and their active metabolites can significantly enhance the balance of the gut microbiota, correcting lipid and glucose metabolism disorders, and effectively reducing chronic inflammation and oxidative stress. This study summarizes and concludes relevant research, systematically elaborating on the relationships among TCM formulas, botanical drugs, their metabolites for strengthening the spleen and dispelling dampness, and the gut microbiota. Try to elucidate their effects on obesity by regulating the gut microbiota.", "keywords": [], "year": "2026", "doi": "10.3389/fphar.2026.1674533"}, {"pmid": "41814729", "title": "[Scientific connotation of spleen-tonifying and lung-replenishing therapy in chronic obstructive pulmonary disease based on \"gut-lung axis\" theory].", "abstract": "Chronic obstructive pulmonary disease(COPD) characterized by persistent airflow limitation is a heterogeneous lung condition prone to exacerbations and progression. Recent studies have revealed that gut microbiota dysbiosis can trigger metabolic disorders, immune abnormalities, and inflammatory responses, contributing to the pathogenesis and progression of COPD through the gut-lung axis. The spleen-tonifying and lung-replenishing therapy originates from the five elements theory of TCM, specifically the principle of tonifying the source in the case of deficiency. Enhancing the function of the spleen and stomach(earth element) indirectly nourishes the lungs(metal element), embodying the holistic concept of organ interdependence. The gut, as an extension of the transformation function of the spleen and stomach, reflects the modern interpretation of the spleen's role in transformation and transportation. When the spleen is deficient, gut microbiota dysbiosis leads to the accumulation of turbid toxins, which rise to affect the lungs, resulting in impaired flow of healthy Qi and the interplay of phlegm and stasis. The concept of tonifying the spleen not only involves tonifying the middle Qi but also encompasses multidimensional interventions such as improving gastrointestinal functions and regulating the gut microbiota to restore lung-spleen coordination. The spleen-tonifying and lung-replenishing therapy can influence the gut microbiota in COPD patients, effectively interrupting the pathological vicious cycle of spleen deficiency-microbiota dysbiosis-lung damage, slowing down disease progression, and reducing acute exacerbations. This method highlights the scientific value of the holistic thinking in TCM and provides a key pathway for integrating TCM and Western medicine in the prevention and treatment of COPD, underscoring the core clinical significance of tonifying the spleen and replenishing the lung.", "keywords": ["Humans", "Pulmonary Disease, Chronic Obstructive", "Spleen", "Animals", "Lung", "Drugs, Chinese Herbal"], "year": "2026", "doi": "10.19540/j.cnki.cjcmm.20251011.706"}], "pubmed_query": "(\"small intestine\"[Title] OR \"duodenum\"[Title] OR \"jejunum\"[Title] OR \"ileum\"[Title] OR \"intestinal\"[Title] OR \"gut\"[Title] OR \"enterocyte\"[Title] OR \"Peyer's patches\"[Title] OR \"gut-brain axis\"[Title] OR \"enteroendocrine\"[Title]) AND (\"spleen\"[Title] OR \"splenic\"[Title] OR \"splenomegaly\"[Title] OR \"lymphoid organ\"[Title] OR \"immune organ\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Thyroid__WAT", "source": "Thyroid", "target": "WAT", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: TSH, leptin\nNotes: \n- Higher TSH production due to obesity leads to higher glucose uptake in the thyroid.\n- TSH is positively correlated with obesity and metabolic syndrome. Leptin seems to stimulate the hypothalamus to increase TSH secretion in the thyroid. Higher TSH levels are often associated with hypothyroidism. \n- Higher TSH/low-normal T3 is linked with a slower metabolic rate and metabolic syndrome.\nSources:\n- DOI: 10.1177/2042018820917869\n", "connection_type": "Hormonal connection", "key_players": ["TSH", "leptin"], "key_players_metabolites": ["glucose", "fatty acid", "lipoprotein", "fructose", "triglyceride", "fatty acids", "glycerol", "triglycerides", "amp", "atp", "cholesterol", "acetate", "ldl", "phosphoenolpyruvate", "methionine", "amino acids", "prostaglandin", "amino acid", "uric acid", "serine", "glycerol-3-phosphate", "hdl", "acetyl-coa", "lactate", "free fatty acids", "nefa", "ffa", "succinate", "alanine", "propionate", "glycogen", "citrate", "leucine", "isocitrate", "cysteine", "arginine", "pyruvate", "free fatty acid", "adp"], "key_players_hormones": ["thyroid hormone", "t3", "insulin", "thyroid hormones", "tsh", "t4", "triiodothyronine", "leptin", "thyroxine", "adiponectin", "thyrotropin", "norepinephrine", "il-6", "igf-1", "resistin", "fgf21", "estrogen", "noradrenaline", "igf1", "interleukin-6", "growth hormone", "chemerin", "omentin", "corticosterone", "progesterone", "tnf", "glucocorticoid", "tumor necrosis factor", "epinephrine", "cck", "crh", "glucagon", "neurotensin"], "key_players_proteins": ["ucp1", "lpl", "lipoprotein lipase", "ucp2", "fabp", "glut4", "akt", "pi3k", "lxr", "glut1", "ampk", "fatty acid synthase", "hormone-sensitive lipase", "mtor", "pparg", "srebp-1c", "chrebp", "srebp", "fas", "insulin receptor", "acc", "foxo1", "mtorc1", "pgc-1", "sirt1", "p38", "hsl", "pepck", "mapk", "gapdh", "jnk", "rxr", "leptin receptor", "pfk", "adipose triglyceride lipase", "ppara", "ucp3"], "key_players_counts_metabolites": {"methionine": 3, "cholesterol": 9, "propionate": 1, "glycerol-3-phosphate": 2, "amp": 11, "glycogen": 1, "citrate": 1, "phosphoenolpyruvate": 4, "atp": 11, "hdl": 2, "acetyl-coa": 2, "amino acids": 3, "glucose": 122, "fatty acid": 38, "leucine": 1, "isocitrate": 1, "ldl": 5, "lactate": 2, "cysteine": 1, "free fatty acids": 2, "prostaglandin": 3, "arginine": 1, "pyruvate": 1, "nefa": 2, "free fatty acid": 1, "amino acid": 3, "lipoprotein": 28, "glycerol": 17, "triglycerides": 13, "ffa": 2, "acetate": 6, "uric acid": 3, "triglyceride": 20, "fatty acids": 20, "fructose": 22, "succinate": 2, "adp": 1, "serine": 3, "alanine": 2}, "key_players_counts_hormones": {"progesterone": 4, "thyroid hormone": 305, "tnf": 4, "cck": 2, "glucocorticoid": 3, "fgf21": 12, "thyroxine": 76, "crh": 2, "glucagon": 2, "igf-1": 14, "neurotensin": 1, "norepinephrine": 23, "growth hormone": 6, "thyroid hormones": 160, "omentin": 5, "noradrenaline": 7, "estrogen": 8, "adiponectin": 52, "insulin": 175, "t3": 224, "resistin": 13, "chemerin": 6, "tumor necrosis factor": 3, "triiodothyronine": 89, "epinephrine": 3, "leptin": 83, "corticosterone": 5, "il-6": 15, "igf1": 7, "tsh": 133, "thyrotropin": 37, "t4": 100, "interleukin-6": 7}, "key_players_counts_proteins": {"hsl": 1, "pepck": 1, "ucp1": 49, "mapk": 1, "fatty acid synthase": 6, "gapdh": 1, "fabp": 16, "jnk": 1, "rxr": 1, "pi3k": 13, "foxo1": 3, "mtorc1": 3, "p38": 2, "ucp2": 17, "pparg": 5, "glut4": 16, "fas": 4, "glut1": 8, "srebp-1c": 5, "hormone-sensitive lipase": 6, "insulin receptor": 4, "leptin receptor": 1, "pfk": 1, "akt": 14, "chrebp": 5, "adipose triglyceride lipase": 1, "lipoprotein lipase": 18, "lpl": 31, "ppara": 1, "pgc-1": 3, "ampk": 7, "ucp3": 1, "sirt1": 3, "acc": 4, "mtor": 6, "lxr": 11, "srebp": 5}, "notes": "- Higher TSH production due to obesity leads to higher glucose uptake in the thyroid.\n- TSH is positively correlated with obesity and metabolic syndrome. Leptin seems to stimulate the hypothalamus to increase TSH secretion in the thyroid. Higher TSH levels are often associated with hypothyroidism. \n- Higher TSH/low-normal T3 is linked with a slower metabolic rate and metabolic syndrome.", "sources": ["DOI: 10.1177/2042018820917869"], "ai_description": "The Thyroid-WAT axis is mediated by thyroid hormones, which regulate brown adipogenesis through the activation of uncoupling protein 1 [4]. Fructose consumption impairs brown adipogenesis by promoting thyroid hormone resistance in differentiated brown adipocytes [1], suggesting a link between excessive sugar intake and metabolic dysfunction. Additionally, adipocytes can promote tumor cell invasion and metastasis via FATP2, highlighting a novel cell-cell interaction in papillary thyroid carcinoma [3]. The differential effects of EP3, FP, and EP2 receptor agonists on orbital adipogenesis in a 3D spheroid model of thyroid eye disease further underscore the complex interplay between thyroid hormones and adipose tissue [2].", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42237874", "title": "Fructose impairs brown adipogenesis by promoting thyroid hormone resistance in differentiated brown adipocytes.", "abstract": "Excessive fructose consumption is increasingly linked to obesity, diabetes, non-alcoholic fatty liver disease (NAFLD), and cardiovascular disease, yet its impact on brown adipocytes remains poorly defined. Here, we investigated how fructose alters brown adipogenesis with a focus on thyroid hormone receptor (THR) signaling. Differentiation of mouse brown preadipocytes in fructose-containing medium resulted in markedly reduced lipid droplet size and number, impaired expression of adipogenic markers (PPAR&#x3b3;, FABP4), and a loss of the brown adipocyte identity protein UCP-1. Whereas triiodothyronine (T3) and the THR&#x3b2;-selective agonist resmetirom dose-dependently enhanced UCP-1 expression in glucose medium, neither T3 nor resmetirom restored UCP-1 in fructose medium, revealing thyroid hormone resistance. Mechanistically, fructose specifically downregulated THR but not its heterodimer partner, retinoid X receptor (RXR), via ubiquitin-mediated degradation. Overexpression of THR rescued UCP-1 in glucose medium and promoted dynamic lipid turnover but failed to restore UCP-1 or lipid remodeling in fructose medium, indicating a defect in THR transcriptional regulation. Our secretome proteomics revealed that both the sugar source and THR overexpression strongly remodel the secreted protein landscape of brown adipocytes. The data indicate that fructose both reconfigures metabolic and signaling networks and blunts oxidative resilience, while excess THR activity in fructose conditions disrupts energy metabolism and increases the risk of protein misfolding. All these could contribute to THR dysfunction and impair adipogenesis. Collectively, these findings identify fructose as a potent inhibitor of brown adipogenesis, suppressing THR-dependent UCP-1 expression by inducing thyroid hormone resistance through a defect in THR-mediated transcriptional regulation. This mechanism links dietary fructose to impaired brown adipocytes and metabolic imbalance.", "keywords": ["Fructose", "Adipocytes, Brown", "Adipogenesis", "Animals", "Mice", "Cell Differentiation", "Thyroid Hormones", "Signal Transduction", "Gene Expression Regulation", "Uncoupling Protein 1", "Receptors, Thyroid Hormone", "Proteomics"], "year": "2026", "doi": "10.1242/bio.062648"}, {"pmid": "41697065", "title": "Differential Effects of EP3, FP, and EP2 Receptor Agonists on Orbital Adipogenesis in a 3D Spheroid Model of Thyroid Eye Disease.", "abstract": "To compare the differential effects of EP3, FP, and EP2 receptor agonists on adipogenic differentiation in orbital adipose-derived mesenchymal stem cell (OASC) spheroids from thyroid eye disease (TED) patients. Orbital adipose tissue was obtained from inactive TED patients, and OASCs were isolated. Three-dimensional spheroid cultures were established and induced for adipogenic differentiation in the presence of FP agonist bimatoprost (BIM), EP3 agonist sulprostone (SULP), or EP2 agonist butaprost (BUTA). Spheroid size and lipid accumulation were assessed using bright-field imaging, BODIPY staining, and Oil Red O staining. Gene and protein expression of adipogenic markers (PPARG, ADIPOQ, FABP4, LEPTIN) were quantified by qPCR and/or western blotting. Levels of IL-1, IL-6, TNF-&#x3b1;, IFN-&#x3b3;, MCP-1, and Leptin in culture supernatants were measured by ELISA. Sulprostone and bimatoprost markedly inhibited adipogenic differentiation of OASC spheroids, as evidenced by reduced spheroid size, decreased lipid accumulation, and downregulation of PPARG, FABP4, and LEPTIN. Compared with sulprostone, bimatoprost exerted a stronger inhibitory effect, showing smaller spheroid size, fewer lipid droplets, and lower LEPTIN expression. Despite the suppression of lipid accumulation, ADIPOQ expression was significantly upregulated in both SULP and BIM groups. Notably, bimatoprost treatment was associated with increased secretion of IL-6 and TNF-&#x3b1;, whereas sulprostone did not significantly alter the levels of the examined inflammatory cytokines. In contrast, butaprost showed no significant inhibitory effect on adipogenic differentiation, with lipid accumulation patterns similar to those of the control group. Activation of EP3, FP, and EP2 receptors differentially modulates orbital adipogenesis. Among them, EP3 receptor activation by sulprostone suppresses adipogenic differentiation without increasing the evaluated inflammatory cytokines in our study. These findings suggest that EP3 receptor agonism may represent a potential strategy for limiting orbital fat expansion in TED, although further in vivo studies are required to evaluate its therapeutic feasibility and safety.", "keywords": ["Humans", "Graves Ophthalmopathy", "Adipogenesis", "Spheroids, Cellular", "Receptors, Prostaglandin E, EP2 Subtype", "Mesenchymal Stem Cells", "Receptors, Prostaglandin E, EP3 Subtype", "Blotting, Western", "Receptors, Prostaglandin", "Cells, Cultured", "Real-Time Polymerase Chain Reaction", "Female", "Enzyme-Linked Immunosorbent Assay", "Adipose Tissue", "Cell Differentiation", "Orbit", "Alprostadil"], "year": "2026", "doi": "10.1080/02713683.2026.2619891"}, {"pmid": "41668918", "title": "Adipocyte promotes tumor cell invasion and metastasis via FATP2: a novel cell-cell interaction in papillary thyroid carcinoma.", "abstract": "Papillary thyroid carcinoma (PTC) is the most common malignant tumor of the endocrine system, with its incidence increasing annually worldwide. Currently, despite the adoption of various treatment modalities, tumor invasion and metastasis constitute critical factors affecting the long-term survival of PTC patients. Adipocytes participate in regulating the malignant biological characteristics of tumor cells. However, the role of adipocytes in PTC carcinogenesis and progression remains poorly understood. Therefore, this study aims to investigate the role of adipocytes in PTC metastasis. 3T3L1-D cells were treated with differentiation medium to induce differentiation into adipocytes. PTC cells were cultured with adipocytes, and the PTC cell invasion ability was examined by transwell assay. The associated mechanisms were further investigated. Here, we found that the surrounding adipocytes could promote the invasion capacity of PTC cells via FATP2/TR4 signaling, and the inhibition of FATP2 or TR4 expression could reverse the invasion capacity of PTC cells. Furthermore, the preclinical investigation demonstrated that targeting this newly identified signaling with lipofermata (a FATP2-specific inhibitor) suppressed PTC progression. Together, these findings suggest that adipocytes in the PTC microenvironment may function via FATP2/TR4 signaling to regulate PTC progression, and targeting this newly identified adipocyte/FATP2/TR4 signaling axis may facilitate the development of novel therapeutic strategies for PTC.", "keywords": [], "year": "2026", "doi": "10.21037/gs-2025-aw-500"}, {"pmid": "41665424", "title": "Thyroid response to cold activation of brown adipose tissue in Greenlanders and Danes.", "abstract": "Brown adipose tissue (BAT) thermogenesis is mediated by sympathetic nervous system activation and enhanced by thyroid hormones via upregulation of uncoupling protein 1. Studying thyroid hormone response to cooling in populations with habitual cold exposure may give new insights to the role of thyroid hormones in non-shivering thermogenesis. Twenty-one participants (11 Greenlanders, 10 Danes) underwent a cross-over protocol with experimental sessions of cooling and thermal comfort, followed by [18F]FDG positron emission tomography/computed tomography scans. Serial blood samples were collected to assess thyrotropin (TSH), total triiodothyronine (TT3), total thyroxine (TT4), and thyroglobulin (Tg) before, during, and after cooling. Cooling induced an increase in TSH (Danes: 0.24 mIU/L, P &lt; .001; Greenlanders: 0.15 mIU/L, P = .009). TT3 also increased in response to cooling (Danes: 0.15&#x2005;nmol/L, Greenlanders: 0.09&#x2005;nmol/L, Pboth &lt; .001). Greenlanders had lower TSH and higher TT3 levels compared to Danes (baseline 0.27&#x2005;nmol/L, P = .009) with an attenuated TT3 response to cooling (-0.07&#x2005;nmol/L, P &#xa0;= &#xa0;.009). The T3/T4 ratio was elevated during cold exposure compared to thermoneutral conditions in both Danes (P &lt; .001) and Greenlanders (P = .022), and Greenlanders had consistently higher T3/T4 ratios compared to Danes (baseline, P = .001; after cooling, P = .023). Finally, Tg levels were higher in participants with low- compared to high-BAT volume (7.27&#x2005;&#xb5;g/L, P = .008). Serial measurements of thyroid hormones and thyroglobulin with gold-standard detection of BAT activity documented distinct thyroid responses to cooling. The findings suggested a physiological preparedness to acute cold exposure in individuals with cold adaptation, irrespective of origin.", "keywords": ["Humans", "Adipose Tissue, Brown", "Male", "Cold Temperature", "Female", "Greenland", "Adult", "Thyroid Gland", "Thyrotropin", "Thermogenesis", "Triiodothyronine", "Thyroxine", "Cross-Over Studies", "Thyroid Hormones", "Thyroglobulin", "Young Adult", "Denmark", "Scandinavians and Nordic People"], "year": "2026", "doi": "10.1093/ejendo/lvag001"}, {"pmid": "41533941", "title": "Transcriptomic Profiling of Orbital Fat Tissue and Ocular Surface Wash in Active Thyroid Eye Disease Requiring Urgent Orbital Decompression.", "abstract": "Thyroid eye disease (TED) is an autoimmune disorder characterized by orbital inflammation and tissue remodeling. Although most patients with active TED respond to medical therapy, a subset develops sight-threatening complications which require urgent orbital decompression when conservative treatment fails. This study aimed to elucidate the molecular mechanisms underlying active, moderate-to-severe TED in patients requiring urgent orbital decompression during the active disease stage. Transcriptomic profiling was performed on retro-orbital fat samples from 13 patients and ocular surface wash samples from 9 patients undergoing urgent orbital decompression, as well as on samples from control subjects. Differential gene expression, pathway enrichment, cell-type composition, and drug-gene interactions were analyzed. In retro-orbital fat, the majority of differentially expressed genes were upregulated, predominantly mapping to immune system, with a pronounced neutrophilic signature including degranulation and extracellular trap formation. Increased infiltration of neutrophils, B cells, and T cells was observed, whereas ocular surface wash samples exhibited a largely downregulated immune signature, reflecting compartment-specific immune responses. Expression of several transcripts from ocular surface wash correlated with patients' disease activity, suggesting potential use as noninvasive biomarkers with CD151, MAST4, and HPCAL1 genes correlating best. Drug-gene interaction analysis nominated JAK and BTK inhibitors as candidate therapeutics in TED. This study provides a unique molecular atlas of active, moderate-to-severe TED environment, uncovers the active role of neutrophils in TED pathogenesis, and identifies candidate therapeutic targets and noninvasive biomarkers that may inform future clinical strategies.", "keywords": ["Humans", "Graves Ophthalmopathy", "Female", "Decompression, Surgical", "Gene Expression Profiling", "Adipose Tissue", "Male", "Middle Aged", "Orbit", "Adult", "Transcriptome", "Aged", "Gene Expression Regulation"], "year": "2025", "doi": "10.1167/iovs.66.15.71"}, {"pmid": "41376652", "title": "Thermogenic Gene Expression in Human Neck Adipose Tissue in Relation to Circulating and Local Thyroid Hormone Levels.", "abstract": "Brown adipose tissue (BAT) contributes to thermogenesis and has been proposed as a therapeutic target for metabolic disease. Thyroid hormones (THs) regulate thermogenic activity, but the relationship between circulating and local TH concentrations and their associations with thermogenic gene and pathway expression in human adipose tissue remain unclear. We obtained paired deep neck and subcutaneous adipose tissue samples from adults undergoing thyroid surgery, which represent BAT and white adipose tissue, respectively. Serum and local adipose tissue TH concentrations (T3, T4, TSH) were measured. Bulk RNA-sequencing was performed on adipose tissue samples. Associations between hormone concentrations and thermogenic gene expression and pathway activation were analyzed, with false discovery rate correction for multiple testing. Both serum and local T4 concentrations were positively associated with thermogenic pathway activation in deep neck adipose tissue. Although serum T3 was also positively associated, local T3 was inversely associated with thermogenic pathways in deep neck adipose tissue. However, circulating TH concentrations did not correlate with local tissue hormone levels. No significant associations were observed between serum or local TH concentrations and individual thermogenic gene expression after correction for different clinical covariates and multiple comparisons. Local regulation of THs may play a role in human adipose tissue thermogenic activity. Pathway-level transcriptomic analysis may better capture these effects than single-gene approaches. Deep neck adipose tissue can serve as a practical model for studying BAT function and endocrine regulation in humans.", "keywords": [], "year": "2026", "doi": "10.1210/jendso/bvaf178"}, {"pmid": "41356001", "title": "Association of thyroid hormone sensitivity indicators with visceral fat area in euthyroid overweight/obese type 2 diabetes patients: sex differences.", "abstract": "Thyroid hormone (TH) sensitivity plays a key role in glucose and lipid metabolism. However, its relationship with visceral fat distribution in euthyroid overweight/obese patients with type 2 diabetes mellitus (T2DM) remains unclear. This study aimed to examine the associations between TH sensitivity indices and visceral fat area (VFA), with particular attention to sex-specific differences. A total of 831 euthyroid overweight/obese T2DM patients (374 males and 457 females) were enrolled. Multiple TH sensitivity indices were calculated. VFA was measured by bioelectrical impedance analysis (BIA), and visceral fat obesity (VFO) was defined as VFA &#x2265; 100 cm&#xb2;. Associations were assessed using univariate and multivariate linear and logistic regression models, adjusting for age, BMI, and glycemic control parameters. In males, TFQI FT3 was independently associated with VFA (&#x3b2; = 0.088, P &lt; 0.05) and predicted VFO (OR: 2.545; 95% CI: 1.206-5.370, P = 0.014). In females, no significant associations were observed between TH sensitivity indices and either VFA or VFO, indicating a clear sex-specific difference. TFQI FT3 may serve as a potential marker linking thyroid hormone sensitivity with visceral fat accumulation, particularly in male T2DM patients.", "keywords": ["Humans", "Diabetes Mellitus, Type 2", "Female", "Male", "Intra-Abdominal Fat", "Middle Aged", "Thyroid Hormones", "Overweight", "Obesity", "Aged", "Adult", "Sex Characteristics", "Sex Factors", "Cross-Sectional Studies", "Electric Impedance"], "year": "2025", "doi": "10.3389/fendo.2025.1699552"}, {"pmid": "41212406", "title": "Puerarin suppress adipogenesis and inflammation on orbital fibroblasts from patients with thyroid eye disease.", "abstract": "PURPOSE: To investigate the therapeutic effects of puerarin in reducing adipogenesis and controlling inflammation in primary orbital fibroblasts derived from patients with thyroid eye disease (TED), and to explore the potential underlying mechanisms. METHODS: After primary fibroblast culture and identification, the Cell Counting Kit-8 (CCK-8) was used to estimate the cytotoxic effects of puerarin. Wound-healing test was performed to assess the impact of puerarin on cellular migration. Adipogenic models were built with or without puerarin and inflammation model was built with the induction of IL-1&#x3b2;. Levels of IL-6, IL-8, CXCL-1, ADIPOQ, FABP4, and PPAR&#x3b3; were determined using quantitative real-time polymerase chain reaction (PCR). IL-6 and IL-8 in the cell supernatant were measured using enzyme-linked immunosorbent assay (ELISA). We performed network pharmacology and molecular docking to identify possible pathway and validated with Western blot. RESULTS: Puerarin significantly reduce the wound healing area and lipid area (p&#x2009;&lt;&#x2009;0.001, p&#x2009;=&#x2009;0.004, p&#x2009;&lt;&#x2009;0.001 for 5&#xb5;M, 10&#xb5;M and 25&#xb5;M, respectively) but no difference was found between the different puerarin groups. The levels of ADIPOQ, FABP4, and PPAR&#x3b3; were significantly decreased in the 5&#xb5;M-puerarin treated group (p&#x2009;=&#x2009;0.032, 0.041, 0.008, respectively), and the levels of IL-6 and IL-8 were significantly decreased in the puerarin-treated inflammation group (p&#x2009;&lt;&#x2009;0.01). PIK3CA and AKT 1 were identified as core targets, and the results were further supported by western blotting. CONCLUSION: Puerarin has anti-adipogenic and anti-inflammatory effects on the fibroblasts of patients with TED. These effects may be mediated by the PI3K-AKT pathway. Puerarin may be a potential treatment option for TED.", "keywords": [], "year": "2026", "doi": "10.1007/s40618-025-02746-7"}, {"pmid": "40789364", "title": "Hypothyroidism impacts mammary tumor-associated adipose tissue and breast cancer epithelial cell dialogue.", "abstract": "Thyroid hormones play a key role in adipose tissue development and function. Hypothyroidism (HypoT) can delay mammary tumor development in rats, possibly by altering mammary adipose tissue (MAT) and its interaction with epithelial cells. To explore this hypothesis, we evaluated the effects of conditioned media derived from mammary adipose tissue (MAT-CMs) of hypothyroid (HypoT) and euthyroid (EUT) rats, with and without mammary tumors, on the behavior of mammary epithelial cells. Specifically, we assessed cell viability, proliferation, apoptosis, adhesion, and migration in tumorigenic (MCF-7, MDA-MB-231) and non-tumorigenic (MCF-10A) human mammary epithelial cell lines exposed to the MAT-CMs. Mammary tumors were induced in female Sprague-Dawley rats using 7,12-dimethylbenz[a]anthracene (15 mg/rat), and animals were randomly assigned to HypoT (0.01 % 6-N-propyl-2-thiouracil in drinking water; n = 30) or EUT (tap water; n = 30) groups. MAT fragments were incubated in M199 medium for 24 h, and the resulting CMs were collected and applied to cell cultures. In vivo, HypoT rats exhibited larger mammary fat pads, reduced tumor incidence, volume, and growth rate, and extended tumor-free survival. In vitro, non-tumor MAT-CMs from HypoT rats promoted apoptosis in MCF-10A cells, reduced viability and adhesion of MCF-7 cells, and increased proliferation while decreasing adhesion in MDA-MB-231 cells. Tumor MAT-CMs from HypoT rats stimulated proliferation in tumorigenic cells and inhibited apoptosis in MCF-10A cells. In conclusion, these findings indicate that HypoT modifies the secretory profile of MAT, with tumor MAT-CMs from HypoT potentially enhancing tumorigenic behaviors in mammary tumor cells.", "keywords": ["Animals", "Female", "Humans", "Rats", "Rats, Sprague-Dawley", "Adipose Tissue", "Epithelial Cells", "Hypothyroidism", "Breast Neoplasms", "MCF-7 Cells", "Apoptosis", "Cell Proliferation", "Mammary Neoplasms, Experimental", "Culture Media, Conditioned", "Cell Line, Tumor", "Cell Movement", "Cell Adhesion"], "year": "2025", "doi": "10.1016/j.biochi.2025.08.012"}, {"pmid": "40585042", "title": "Thyroid Stimulating Hormone May Facilitates Adipose Tissue Insulin Resistance by Inducing M1 Macrophage Polarization.", "abstract": "Recent studies suggest connection between the thyroid stimulating hormone (TSH) and insulin resistance (IR). Adipose tissue is one of insulin's target tissues. However, currently the regulatory mechanism of TSH on the adipose tissue is not fully investigated yet. We constructed a subclinical hypothyroidism (SCH) mouse model induced by methimazole with elevated TSH levels and then observed its metabolic profile, adipose tissue IR, and the adipose tissue macrophages (ATMs) phenotype. In vitro, we treated RAW264.7 cells and bone marrow-derived macrophages (BMDM) to assess the effect of TSH on macrophage polarization and explore the specific underlying mechanisms. SCH mice exhibited a poorer metabolic profile and an advanced adipose tissue IR. Meanwhile, the number of M1 ATMs was increased in SCH mice adipose tissue. In vitro, TSH induced endoplasmic reticulum stress in macrophages, which activated the GRP78-ATF6-CHOP signaling pathway, and further promoted M1 macrophage polarization. 4-phenylbutyric acid (4-PBA), an endoplasmic reticulum stress inhibitor, corrected the polarization imbalance of ATMs in SCH mice adipose tissue and improved adipose tissue dysfunction and IR. TSH activated endoplasmic reticulum stress in macrophages, which induced the polarization of ATMs toward a pro-inflammatory M1 phenotype and promotes adipose tissue IR. Our findings highlight the possible relationship of TSH with immunity and metabolism.", "keywords": [], "year": "2025", "doi": "10.2147/JIR.S522062"}], "pubmed_query": "(\"thyroid\"[Title] OR \"thyroid gland\"[Title] OR \"thyroid hormone\"[Title] OR \"T3\"[Title] OR \"T4\"[Title] OR \"TSH\"[Title] OR \"hypothyroidism\"[Title] OR \"hyperthyroidism\"[Title]) AND (\"adipose tissue\"[Title] OR \"white adipose tissue\"[Title] OR \"fat tissue\"[Title] OR \"adipocyte\"[Title] OR \"adipogenesis\"[Title] OR \"visceral fat\"[Title] OR \"subcutaneous fat\"[Title] OR \"WAT\"[Title] OR \"lipogenesis\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}];

        'border-width': 3,
        'border-color': '#fbbf24',
        'width': 60,
        'height': 60,
      }
    },
    {
      selector: 'edge',
      style: {
        'width': 2.5,
        'line-color': 'data(color)',
        'target-arrow-color': 'data(color)',
        'target-arrow-shape': 'none',
        'curve-style': 'bezier',
        'opacity': 1,
        'transition-property': 'opacity, width, line-color',
        'transition-duration': '0.15s',
      }
    },
    {
      selector: 'edge:selected, edge.highlighted',
      style: {
        'width': 5,
        'line-color': '#fbbf24',
        'target-arrow-color': '#fbbf24',
        'opacity': 1,
      }
    },
    {
      selector: '.faded',
      style: { 'opacity': 0.08 }
    },
    {
      selector: '.search-hit',
      style: {
        'line-color': '#fbbf24',
        'target-arrow-color': '#fbbf24',
        'width': 4,
        'opacity': 1,
      }
    },
    {
      selector: 'node.search-hit',
      style: {
        'border-color': '#fbbf24',
        'border-width': 3,
        'opacity': 1,
      }
    },
  ],
  layout: {
    name: 'cose',
    animate: true,
    padding: 80,
    nodeRepulsion: 15000,
    idealEdgeLength: 180,
    edgeElasticity: 200,
    gravity: 0.25,
    randomize: false,
  }
});

// ── Helpers ───────────────────────────────────────────────────────────────

function runLayout(name) {
  cy.layout({ name, animate: true, padding: 60 }).run();
}

function chipsHtml(items, cls, counts) {
  if (!items || items.length === 0) return '<span style="color:#475569;font-size:12px">None identified</span>';
  return '<div class="chips-wrap">' +
    items.map(t => {
      const n = counts && counts[t];
      const badge = n ? `<span style="margin-left:4px;background:rgba(0,0,0,0.25);border-radius:8px;padding:0 5px;font-size:10px;font-weight:700">${n}×</span>` : '';
      return `<span class="chip ${cls}" title="${n ? n + ' mentions' : ''}">${escHtml(t)}${badge}</span>`;
    }).join('') +
    '</div>';
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function section(label, content) {
  return `<div class="section-label">${label}</div>${content}`;
}

// ── Sidebar rendering ─────────────────────────────────────────────────────

function showEdgeSidebar(data) {
  document.getElementById('sidebar-title').textContent = 'Connection';
  document.getElementById('sidebar-name').textContent =
    data.source + ' ↔ ' + data.target;

  let html = '';

  if (data.connection_type) {
    html += section('Type',
      `<span class="connection-type-badge">${escHtml(data.connection_type)}</span>`);
  }

  // Key players — hormones, metabolites, proteins
  const hormones    = data.key_players_hormones    || [];
  const metabolites = data.key_players_metabolites || [];
  const proteins    = data.key_players_proteins    || [];
  const rawKP       = data.key_players             || [];
  const cntH = data.key_players_counts_hormones    || {};
  const cntM = data.key_players_counts_metabolites || {};
  const cntP = data.key_players_counts_proteins    || {};

  // If we have categorised players, show them; otherwise fall back to raw list
  if (hormones.length || metabolites.length || proteins.length) {
    html += section('Key Players',
      '<div style="display:flex;flex-direction:column;gap:8px">' +
      (hormones.length    ? '<div><span style="font-size:11px;color:#64748b;margin-bottom:3px;display:block">Hormones</span>'              + chipsHtml(hormones,    'chip-hormone',    cntH) + '</div>' : '') +
      (metabolites.length ? '<div><span style="font-size:11px;color:#64748b;margin-bottom:3px;display:block">Metabolites</span>'           + chipsHtml(metabolites, 'chip-metabolite', cntM) + '</div>' : '') +
      (proteins.length    ? '<div><span style="font-size:11px;color:#64748b;margin-bottom:3px;display:block">Proteins / Transporters</span>' + chipsHtml(proteins,    'chip-protein',    cntP) + '</div>' : '') +
      '</div>'
    );
  } else if (rawKP.length) {
    html += section('Key Players', chipsHtml(rawKP, 'chip-general', {}));
  }

  if (data.ai_description) {
    const papers = data.pubmed_papers || [];

    // Replace [1], [2,3], [1-3] etc. with superscript links and collect cited indices
    const citedIndices = new Set();
    const linkedSummary = escHtml(data.ai_description).replace(
      /\[(\d[\d,\s-]*)\]/g,
      (match, inner) => {
        // Parse individual numbers out of "1,2" or "1-3" or "1, 2"
        const nums = [];
        inner.split(/[,\s]+/).forEach(part => {
          const dash = part.match(/^(\d+)-(\d+)$/);
          if (dash) {
            for (let i = parseInt(dash[1]); i <= parseInt(dash[2]); i++) nums.push(i);
          } else {
            const n = parseInt(part);
            if (!isNaN(n)) nums.push(n);
          }
        });
        nums.forEach(n => citedIndices.add(n));
        const links = nums.map(n => {
          const p = papers[n - 1];
          const href = p ? (p.doi ? `https://doi.org/${p.doi}` : `https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/`) : '#';
          return `<a href="${href}" target="_blank" rel="noopener"
            style="color:#818cf8;text-decoration:none;font-size:10px;vertical-align:super;font-weight:700">${n}</a>`;
        }).join(',');
        return `[${links}]`;
      }
    );

    // Build bibliography only for cited papers
    const bibEntries = [];
    citedIndices.forEach(n => {
      const p = papers[n - 1];
      if (!p) return;
      const href = p.doi ? `https://doi.org/${p.doi}` : `https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/`;
      bibEntries.push({ n, p, href });
    });
    bibEntries.sort((a, b) => a.n - b.n);

    const bibHtml = bibEntries.length ? bibEntries.map(entry =>
      `<div style="display:flex;gap:6px;margin-bottom:6px;font-size:11px;color:#94a3b8">
        <span style="color:#818cf8;font-weight:700;flex-shrink:0">${entry.n}.</span>
        <span><a href="${entry.href}" target="_blank" rel="noopener"
          style="color:#cbd5e1;text-decoration:underline dotted">${escHtml(entry.p.title)}</a>
          <span style="color:#475569"> · ${entry.p.year} · PMID ${entry.p.pmid}</span></span>
      </div>`
    ).join('') : '';

    const summaryBlock =
      `<div style="line-height:1.7;color:#cbd5e1;font-size:13px;margin-bottom:${bibHtml ? '12px' : '0'}">${linkedSummary}</div>` +
      (bibHtml ? `<div style="border-top:1px solid #334155;padding-top:8px">${bibHtml}</div>` : '');

    html += section('Literature Summary',
      `<div style="border-left:3px solid #6366f1;padding-left:10px">${summaryBlock}</div>`);
  }

  if (data.notes) {
    html += section('Notes', `<p class="notes-text">${escHtml(data.notes)}</p>`);
  }

  if (data.sources && data.sources.length) {
    html += section('Sources',
      data.sources.filter(s => s.trim()).map(s => {
        const href = s.match(/https?:[/][/][^ ]+/) ? s.match(/https?:[/][/][^ ]+/)[0] : '#';
        return `<a class="source-item" href="${href}" target="_blank" rel="noopener">${escHtml(s)}</a>`;
      }).join('')
    );
  }

  // Show total paper count as a compact note (no cards)
  if (data.pubmed_n > 0 && !data.ai_description) {
    html += section('PubMed Literature',
      `<div style="font-size:12px;color:#64748b">Found ${data.pubmed_n} papers — run LLM step to generate summary.</div>`);
  }

  document.getElementById('sidebar-body').innerHTML = html || '<p style="color:#475569;font-size:13px">No additional information available.</p>';
}

function showNodeSidebar(data) {
  document.getElementById('sidebar-title').textContent = 'Organ';
  document.getElementById('sidebar-name').textContent = data.label;

  let html = '';

  if (data.llm_description) {
    const papers = data.llm_papers || [];
    const citedIndices = new Set();
    const linkedSummary = escHtml(data.llm_description).replace(
      /\[(\d[\d,\s-]*)\]/g,
      (match, inner) => {
        const nums = [];
        inner.split(/[,\s]+/).forEach(part => {
          const dash = part.match(/^(\d+)-(\d+)$/);
          if (dash) {
            for (let i = parseInt(dash[1]); i <= parseInt(dash[2]); i++) nums.push(i);
          } else {
            const n = parseInt(part);
            if (!isNaN(n)) nums.push(n);
          }
        });
        nums.forEach(n => citedIndices.add(n));
        const links = nums.map(n => {
          const p = papers[n - 1];
          const href = p ? (p.doi ? `https://doi.org/${p.doi}` : `https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/`) : '#';
          return `<a href="${href}" target="_blank" rel="noopener"
            style="color:#818cf8;text-decoration:none;font-size:10px;vertical-align:super;font-weight:700">${n}</a>`;
        }).join(',');
        return `[${links}]`;
      }
    );
    const bibEntries = [];
    citedIndices.forEach(n => {
      const p = papers[n - 1];
      if (!p) return;
      const href = p.doi ? `https://doi.org/${p.doi}` : `https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/`;
      bibEntries.push({ n, p, href });
    });
    bibEntries.sort((a, b) => a.n - b.n);
    const bibHtml = bibEntries.map(entry =>
      `<div style="display:flex;gap:6px;margin-bottom:6px;font-size:11px;color:#94a3b8">
        <span style="color:#818cf8;font-weight:700;flex-shrink:0">${entry.n}.</span>
        <span><a href="${entry.href}" target="_blank" rel="noopener"
          style="color:#cbd5e1;text-decoration:underline dotted">${escHtml(entry.p.title)}</a>
          <span style="color:#475569"> · ${entry.p.year} · PMID ${entry.p.pmid}</span></span>
      </div>`
    ).join('');
    const summaryBlock =
      `<div style="line-height:1.7;color:#cbd5e1;font-size:13px;margin-bottom:${bibHtml ? '12px' : '0'}">${linkedSummary}</div>` +
      (bibHtml ? `<div style="border-top:1px solid #334155;padding-top:8px">${bibHtml}</div>` : '');
    html += section('Metabolic Summary',
      `<div style="border-left:3px solid #0ea5e9;padding-left:10px">${summaryBlock}</div>`);
  } else if (data.description) {
    html += section('Description',
      `<p class="notes-text">${escHtml(data.description)}</p>`);
  }

  // List connected edges
  const node = cy.getElementById(data.id);
  const edges = node.connectedEdges();
  if (edges.length) {
    html += section(`Connections (${edges.length})`,
      '<div style="display:flex;flex-direction:column;gap:4px">' +
      edges.map(e => {
        const other = e.source().id() === data.id ? e.target().id() : e.source().id();
        const ct = e.data('connection_type') || '';
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:#0f172a;border-radius:6px;cursor:pointer"
          onclick="selectEdge('${e.id()}')" >
          <span style="font-size:13px;color:#cbd5e1">${escHtml(other)}</span>
          ${ct ? `<span style="font-size:11px;color:#64748b">${escHtml(ct)}</span>` : ''}
        </div>`;
      }).join('') +
      '</div>'
    );
  }

  document.getElementById('sidebar-body').innerHTML = html ||
    '<p style="color:#475569;font-size:13px">No description available.</p>';
}

function selectEdge(edgeId) {
  cy.elements().removeClass('faded highlighted');
  const edge = cy.getElementById(edgeId);
  if (edge.length) {
    cy.elements().addClass('faded');
    edge.removeClass('faded').addClass('highlighted');
    edge.connectedNodes().removeClass('faded').addClass('highlighted');
    showEdgeSidebar(edge.data());
  }
}

// ── Click events ──────────────────────────────────────────────────────────

cy.on('tap', 'edge', function(evt) {
  const el = evt.target;
  cy.elements().removeClass('faded highlighted search-hit');
  cy.elements().addClass('faded');
  el.removeClass('faded').addClass('highlighted');
  el.connectedNodes().removeClass('faded').addClass('highlighted');
  showEdgeSidebar(el.data());
});

cy.on('tap', 'node', function(evt) {
  const el = evt.target;
  cy.elements().removeClass('faded highlighted search-hit');
  cy.elements().addClass('faded');
  el.removeClass('faded').addClass('highlighted');
  el.connectedEdges().removeClass('faded').addClass('highlighted');
  el.connectedNodes().removeClass('faded');
  showNodeSidebar(el.data());
});

cy.on('tap', function(evt) {
  if (evt.target === cy) {
    cy.elements().removeClass('faded highlighted search-hit');
    document.getElementById('sidebar-title').textContent = 'Select a node or edge';
    document.getElementById('sidebar-name').textContent = '—';
    document.getElementById('sidebar-body').innerHTML = `<div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
      </svg>
      Click any <strong>node</strong> or <strong>edge</strong> to see details.
    </div>`;
  }
});

// ── Tooltip ───────────────────────────────────────────────────────────────

const tooltip = document.getElementById('tooltip');

cy.on('mouseover', 'node', function(evt) {
  const d = evt.target.data();
  tooltip.textContent = d.label;
  tooltip.style.display = 'block';
});

cy.on('mouseover', 'edge', function(evt) {
  const d = evt.target.data();
  const kp = (d.key_players || []).slice(0, 4).join(', ');
  tooltip.innerHTML = `<strong>${escHtml(d.source)} ↔ ${escHtml(d.target)}</strong>${kp ? '<br><span style="color:#94a3b8">' + escHtml(kp) + '</span>' : ''}`;
  tooltip.style.display = 'block';
});

cy.on('mousemove', function(evt) {
  tooltip.style.left = (evt.originalEvent.clientX + 12) + 'px';
  tooltip.style.top = (evt.originalEvent.clientY + 12) + 'px';
});

cy.on('mouseout', 'node, edge', function() {
  tooltip.style.display = 'none';
});

// ── Search ────────────────────────────────────────────────────────────────

const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const searchCount = document.getElementById('search-count');

function buildSearchIndex() {
  const index = [];
  cy.edges().forEach(e => {
    const d = e.data();
    const text = [
      d.description || '',
      (d.key_players || []).join(' '),
      (d.key_players_hormones || []).join(' '),
      (d.key_players_metabolites || []).join(' '),
      (d.key_players_proteins || []).join(' '),
      d.notes || '',
      d.connection_type || '',
    ].join(' ').toLowerCase();
    index.push({ el: e, text, label: d.source + ' ↔ ' + d.target, type: 'edge' });
  });
  cy.nodes().forEach(n => {
    const d = n.data();
    const text = (d.description || '').toLowerCase() + ' ' + d.label.toLowerCase();
    index.push({ el: n, text, label: d.label, type: 'node' });
  });
  return index;
}

const searchIndex = buildSearchIndex();

searchInput.addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();

  if (!q) {
    cy.elements().removeClass('faded search-hit');
    searchResults.style.display = 'none';
    searchCount.textContent = '';
    return;
  }

  // Find matches
  const hits = searchIndex.filter(entry => entry.text.includes(q));
  const hitEls = cy.collection(hits.map(h => h.el));
  const edgeHits = hits.filter(h => h.type === 'edge');
  const nodeHits = hits.filter(h => h.type === 'node');

  // Visual feedback
  cy.elements().removeClass('search-hit').addClass('faded');
  hitEls.removeClass('faded').addClass('search-hit');
  // Also un-fade nodes connected to hit edges
  edgeHits.forEach(h => h.el.connectedNodes().removeClass('faded'));

  searchCount.textContent = `${edgeHits.length} edge${edgeHits.length !== 1 ? 's' : ''}`;

  // Dropdown results list
  if (hits.length === 0) {
    searchResults.innerHTML = '<div class="search-result-item" style="color:#64748b">No results found</div>';
  } else {
    searchResults.innerHTML = hits.slice(0, 20).map(h => {
      const icon = h.type === 'edge' ? '🔗' : '⬤';
      return `<div class="search-result-item" data-id="${h.el.id()}" data-type="${h.type}">
        <span>${icon}</span>
        <span>${escHtml(h.label)}</span>
        <span class="match-type">${h.type}</span>
      </div>`;
    }).join('');
    searchResults.querySelectorAll('.search-result-item[data-id]').forEach(item => {
      item.addEventListener('click', () => {
        const id = item.dataset.id;
        const type = item.dataset.type;
        searchResults.style.display = 'none';
        if (type === 'edge') {
          selectEdge(id);
        } else {
          cy.getElementById(id).trigger('tap');
        }
        cy.center(cy.getElementById(id));
      });
    });
  }
  searchResults.style.display = 'block';
});

// Hide dropdown on outside click
document.addEventListener('click', e => {
  if (!document.getElementById('search-wrap').contains(e.target)) {
    searchResults.style.display = 'none';
  }
});
searchInput.addEventListener('focus', () => {
  if (searchInput.value.trim()) searchResults.style.display = 'block';
});

</script>
