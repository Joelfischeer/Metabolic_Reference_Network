"epinephrine", "cck", "crh", "glucagon", "neurotensin"], "key_players_proteins": ["TSH", "leptin", "ucp1", "lpl", "lipoprotein lipase", "ucp2", "fabp", "glut4", "akt", "pi3k", "lxr", "glut1", "ampk", "fatty acid synthase", "hormone-sensitive lipase", "mtor", "pparg", "srebp-1c", "chrebp", "srebp", "fas", "insulin receptor", "acc", "foxo1", "mtorc1", "pgc-1", "sirt1", "p38", "hsl", "pepck", "mapk", "gapdh", "jnk", "rxr", "leptin receptor", "pfk", "adipose triglyceride lipase", "ppara", "ucp3"], "key_players_counts_metabolites": {"methionine": 3, "cholesterol": 9, "propionate": 1, "glycerol-3-phosphate": 2, "amp": 11, "glycogen": 1, "citrate": 1, "phosphoenolpyruvate": 4, "atp": 11, "hdl": 2, "acetyl-coa": 2, "amino acids": 3, "glucose": 122, "fatty acid": 38, "leucine": 1, "isocitrate": 1, "ldl": 5, "lactate": 2, "cysteine": 1, "free fatty acids": 2, "prostaglandin": 3, "arginine": 1, "pyruvate": 1, "nefa": 2, "free fatty acid": 1, "amino acid": 3, "lipoprotein": 28, "glycerol": 17, "triglycerides": 13, "ffa": 2, "acetate": 6, "uric acid": 3, "triglyceride": 20, "fatty acids": 20, "fructose": 22, "succinate": 2, "adp": 1, "serine": 3, "alanine": 2}, "key_players_counts_hormones": {"progesterone": 4, "thyroid hormone": 305, "tnf": 4, "cck": 2, "glucocorticoid": 3, "fgf21": 12, "thyroxine": 76, "crh": 2, "glucagon": 2, "igf-1": 14, "neurotensin": 1, "norepinephrine": 23, "growth hormone": 6, "thyroid hormones": 160, "omentin": 5, "noradrenaline": 7, "estrogen": 8, "adiponectin": 52, "insulin": 175, "t3": 224, "resistin": 13, "chemerin": 6, "tumor necrosis factor": 3, "triiodothyronine": 89, "epinephrine": 3, "leptin": 83, "corticosterone": 5, "il-6": 15, "igf1": 7, "tsh": 133, "thyrotropin": 37, "t4": 100, "interleukin-6": 7}, "key_players_counts_proteins": {"hsl": 1, "pepck": 1, "ucp1": 49, "mapk": 1, "fatty acid synthase": 6, "gapdh": 1, "fabp": 16, "jnk": 1, "rxr": 1, "pi3k": 13, "foxo1": 3, "mtorc1": 3, "p38": 2, "ucp2": 17, "pparg": 5, "glut4": 16, "fas": 4, "glut1": 8, "srebp-1c": 5, "hormone-sensitive lipase": 6, "insulin receptor": 4, "leptin receptor": 1, "pfk": 1, "akt": 14, "chrebp": 5, "adipose triglyceride lipase": 1, "lipoprotein lipase": 18, "lpl": 31, "ppara": 1, "pgc-1": 3, "ampk": 7, "ucp3": 1, "sirt1": 3, "acc": 4, "mtor": 6, "lxr": 11, "srebp": 5}, "notes": "- Higher TSH production due to obesity leads to higher glucose uptake in the thyroid.\n- TSH is positively correlated with obesity and metabolic syndrome. Leptin seems to stimulate the hypothalamus to increase TSH secretion in the thyroid. Higher TSH levels are often associated with hypothyroidism. \n- Higher TSH/low-normal T3 is linked with a slower metabolic rate and metabolic syndrome.", "sources": ["DOI: 10.1177/2042018820917869"], "ai_description": "", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42237874", "title": "Fructose impairs brown adipogenesis by promoting thyroid hormone resistance in differentiated brown adipocytes.", "abstract": "Excessive fructose consumption is increasingly linked to obesity, diabetes, non-alcoholic fatty liver disease (NAFLD), and cardiovascular disease, yet its impact on brown adipocytes remains poorly defined. Here, we investigated how fructose alters brown adipogenesis with a focus on thyroid hormone receptor (THR) signaling. Differentiation of mouse brown preadipocytes in fructose-containing medium resulted in markedly reduced lipid droplet size and number, impaired expression of adipogenic markers (PPAR&#x3b3;, FABP4), and a loss of the brown adipocyte identity protein UCP-1. Whereas triiodothyronine (T3) and the THR&#x3b2;-selective agonist resmetirom dose-dependently enhanced UCP-1 expression in glucose medium, neither T3 nor resmetirom restored UCP-1 in fructose medium, revealing thyroid hormone resistance. Mechanistically, fructose specifically downregulated THR but not its heterodimer partner, retinoid X receptor (RXR), via ubiquitin-mediated degradation. Overexpression of THR rescued UCP-1 in glucose medium and promoted dynamic lipid turnover but failed to restore UCP-1 or lipid remodeling in fructose medium, indicating a defect in THR transcriptional regulation. Our secretome proteomics revealed that both the sugar source and THR overexpression strongly remodel the secreted protein landscape of brown adipocytes. The data indicate that fructose both reconfigures metabolic and signaling networks and blunts oxidative resilience, while excess THR activity in fructose conditions disrupts energy metabolism and increases the risk of protein misfolding. All these could contribute to THR dysfunction and impair adipogenesis. Collectively, these findings identify fructose as a potent inhibitor of brown adipogenesis, suppressing THR-dependent UCP-1 expression by inducing thyroid hormone resistance through a defect in THR-mediated transcriptional regulation. This mechanism links dietary fructose to impaired brown adipocytes and metabolic imbalance.", "keywords": ["Fructose", "Adipocytes, Brown", "Adipogenesis", "Animals", "Mice", "Cell Differentiation", "Thyroid Hormones", "Signal Transduction", "Gene Expression Regulation", "Uncoupling Protein 1", "Receptors, Thyroid Hormone", "Proteomics"], "year": "2026", "doi": "10.1242/bio.062648"}, {"pmid": "41697065", "title": "Differential Effects of EP3, FP, and EP2 Receptor Agonists on Orbital Adipogenesis in a 3D Spheroid Model of Thyroid Eye Disease.", "abstract": "To compare the differential effects of EP3, FP, and EP2 receptor agonists on adipogenic differentiation in orbital adipose-derived mesenchymal stem cell (OASC) spheroids from thyroid eye disease (TED) patients. Orbital adipose tissue was obtained from inactive TED patients, and OASCs were isolated. Three-dimensional spheroid cultures were established and induced for adipogenic differentiation in the presence of FP agonist bimatoprost (BIM), EP3 agonist sulprostone (SULP), or EP2 agonist butaprost (BUTA). Spheroid size and lipid accumulation were assessed using bright-field imaging, BODIPY staining, and Oil Red O staining. Gene and protein expression of adipogenic markers (PPARG, ADIPOQ, FABP4, LEPTIN) were quantified by qPCR and/or western blotting. Levels of IL-1, IL-6, TNF-&#x3b1;, IFN-&#x3b3;, MCP-1, and Leptin in culture supernatants were measured by ELISA. Sulprostone and bimatoprost markedly inhibited adipogenic differentiation of OASC spheroids, as evidenced by reduced spheroid size, decreased lipid accumulation, and downregulation of PPARG, FABP4, and LEPTIN. Compared with sulprostone, bimatoprost exerted a stronger inhibitory effect, showing smaller spheroid size, fewer lipid droplets, and lower LEPTIN expression. Despite the suppression of lipid accumulation, ADIPOQ expression was significantly upregulated in both SULP and BIM groups. Notably, bimatoprost treatment was associated with increased secretion of IL-6 and TNF-&#x3b1;, whereas sulprostone did not significantly alter the levels of the examined inflammatory cytokines. In contrast, butaprost showed no significant inhibitory effect on adipogenic differentiation, with lipid accumulation patterns similar to those of the control group. Activation of EP3, FP, and EP2 receptors differentially modulates orbital adipogenesis. Among them, EP3 receptor activation by sulprostone suppresses adipogenic differentiation without increasing the evaluated inflammatory cytokines in our study. These findings suggest that EP3 receptor agonism may represent a potential strategy for limiting orbital fat expansion in TED, although further in vivo studies are required to evaluate its therapeutic feasibility and safety.", "keywords": ["Humans", "Graves Ophthalmopathy", "Adipogenesis", "Spheroids, Cellular", "Receptors, Prostaglandin E, EP2 Subtype", "Mesenchymal Stem Cells", "Receptors, Prostaglandin E, EP3 Subtype", "Blotting, Western", "Receptors, Prostaglandin", "Cells, Cultured", "Real-Time Polymerase Chain Reaction", "Female", "Enzyme-Linked Immunosorbent Assay", "Adipose Tissue", "Cell Differentiation", "Orbit", "Alprostadil"], "year": "2026", "doi": "10.1080/02713683.2026.2619891"}, {"pmid": "41668918", "title": "Adipocyte promotes tumor cell invasion and metastasis via FATP2: a novel cell-cell interaction in papillary thyroid carcinoma.", "abstract": "Papillary thyroid carcinoma (PTC) is the most common malignant tumor of the endocrine system, with its incidence increasing annually worldwide. Currently, despite the adoption of various treatment modalities, tumor invasion and metastasis constitute critical factors affecting the long-term survival of PTC patients. Adipocytes participate in regulating the malignant biological characteristics of tumor cells. However, the role of adipocytes in PTC carcinogenesis and progression remains poorly understood. Therefore, this study aims to investigate the role of adipocytes in PTC metastasis. 3T3L1-D cells were treated with differentiation medium to induce differentiation into adipocytes. PTC cells were cultured with adipocytes, and the PTC cell invasion ability was examined by transwell assay. The associated mechanisms were further investigated. Here, we found that the surrounding adipocytes could promote the invasion capacity of PTC cells via FATP2/TR4 signaling, and the inhibition of FATP2 or TR4 expression could reverse the invasion capacity of PTC cells. Furthermore, the preclinical investigation demonstrated that targeting this newly identified signaling with lipofermata (a FATP2-specific inhibitor) suppressed PTC progression. Together, these findings suggest that adipocytes in the PTC microenvironment may function via FATP2/TR4 signaling to regulate PTC progression, and targeting this newly identified adipocyte/FATP2/TR4 signaling axis may facilitate the development of novel therapeutic strategies for PTC.", "keywords": [], "year": "2026", "doi": "10.21037/gs-2025-aw-500"}, {"pmid": "41665424", "title": "Thyroid response to cold activation of brown adipose tissue in Greenlanders and Danes.", "abstract": "Brown adipose tissue (BAT) thermogenesis is mediated by sympathetic nervous system activation and enhanced by thyroid hormones via upregulation of uncoupling protein 1. Studying thyroid hormone response to cooling in populations with habitual cold exposure may give new insights to the role of thyroid hormones in non-shivering thermogenesis. Twenty-one participants (11 Greenlanders, 10 Danes) underwent a cross-over protocol with experimental sessions of cooling and thermal comfort, followed by [18F]FDG positron emission tomography/computed tomography scans. Serial blood samples were collected to assess thyrotropin (TSH), total triiodothyronine (TT3), total thyroxine (TT4), and thyroglobulin (Tg) before, during, and after cooling. Cooling induced an increase in TSH (Danes: 0.24 mIU/L, P &lt; .001; Greenlanders: 0.15 mIU/L, P = .009). TT3 also increased in response to cooling (Danes: 0.15&#x2005;nmol/L, Greenlanders: 0.09&#x2005;nmol/L, Pboth &lt; .001). Greenlanders had lower TSH and higher TT3 levels compared to Danes (baseline 0.27&#x2005;nmol/L, P = .009) with an attenuated TT3 response to cooling (-0.07&#x2005;nmol/L, P &#xa0;= &#xa0;.009). The T3/T4 ratio was elevated during cold exposure compared to thermoneutral conditions in both Danes (P &lt; .001) and Greenlanders (P = .022), and Greenlanders had consistently higher T3/T4 ratios compared to Danes (baseline, P = .001; after cooling, P = .023). Finally, Tg levels were higher in participants with low- compared to high-BAT volume (7.27&#x2005;&#xb5;g/L, P = .008). Serial measurements of thyroid hormones and thyroglobulin with gold-standard detection of BAT activity documented distinct thyroid responses to cooling. The findings suggested a physiological preparedness to acute cold exposure in individuals with cold adaptation, irrespective of origin.", "keywords": ["Humans", "Adipose Tissue, Brown", "Male", "Cold Temperature", "Female", "Greenland", "Adult", "Thyroid Gland", "Thyrotropin", "Thermogenesis", "Triiodothyronine", "Thyroxine", "Cross-Over Studies", "Thyroid Hormones", "Thyroglobulin", "Young Adult", "Denmark", "Scandinavians and Nordic People"], "year": "2026", "doi": "10.1093/ejendo/lvag001"}, {"pmid": "41533941", "title": "Transcriptomic Profiling of Orbital Fat Tissue and Ocular Surface Wash in Active Thyroid Eye Disease Requiring Urgent Orbital Decompression.", "abstract": "Thyroid eye disease (TED) is an autoimmune disorder characterized by orbital inflammation and tissue remodeling. Although most patients with active TED respond to medical therapy, a subset develops sight-threatening complications which require urgent orbital decompression when conservative treatment fails. This study aimed to elucidate the molecular mechanisms underlying active, moderate-to-severe TED in patients requiring urgent orbital decompression during the active disease stage. Transcriptomic profiling was performed on retro-orbital fat samples from 13 patients and ocular surface wash samples from 9 patients undergoing urgent orbital decompression, as well as on samples from control subjects. Differential gene expression, pathway enrichment, cell-type composition, and drug-gene interactions were analyzed. In retro-orbital fat, the majority of differentially expressed genes were upregulated, predominantly mapping to immune system, with a pronounced neutrophilic signature including degranulation and extracellular trap formation. Increased infiltration of neutrophils, B cells, and T cells was observed, whereas ocular surface wash samples exhibited a largely downregulated immune signature, reflecting compartment-specific immune responses. Expression of several transcripts from ocular surface wash correlated with patients' disease activity, suggesting potential use as noninvasive biomarkers with CD151, MAST4, and HPCAL1 genes correlating best. Drug-gene interaction analysis nominated JAK and BTK inhibitors as candidate therapeutics in TED. This study provides a unique molecular atlas of active, moderate-to-severe TED environment, uncovers the active role of neutrophils in TED pathogenesis, and identifies candidate therapeutic targets and noninvasive biomarkers that may inform future clinical strategies.", "keywords": ["Humans", "Graves Ophthalmopathy", "Female", "Decompression, Surgical", "Gene Expression Profiling", "Adipose Tissue", "Male", "Middle Aged", "Orbit", "Adult", "Transcriptome", "Aged", "Gene Expression Regulation"], "year": "2025", "doi": "10.1167/iovs.66.15.71"}], "pubmed_query": "(\"thyroid\"[Title] OR \"thyroid gland\"[Title] OR \"thyroid hormone\"[Title] OR \"T3\"[Title] OR \"T4\"[Title] OR \"TSH\"[Title] OR \"hypothyroidism\"[Title] OR \"hyperthyroidism\"[Title]) AND (\"adipose tissue\"[Title] OR \"white adipose tissue\"[Title] OR \"fat tissue\"[Title] OR \"adipocyte\"[Title] OR \"adipogenesis\"[Title] OR \"visceral fat\"[Title] OR \"subcutaneous fat\"[Title] OR \"WAT\"[Title] OR \"lipogenesis\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}];

        'opacity': 1,
      }
    },
  ],
  layout: {
    name: 'cose',
    animate: true,
    padding: 80,
    nodeRepulsion: 15000,
    idealEdgeLength: 180,
    edgeElasticity: 200,
    gravity: 0.25,
    randomize: false,
  }
});

// ── Helpers ───────────────────────────────────────────────────────────────

function runLayout(name) {
  cy.layout({ name, animate: true, padding: 60 }).run();
}

function chipsHtml(items, cls, counts) {
  if (!items || items.length === 0) return '<span style="color:#475569;font-size:12px">None identified</span>';
  return '<div class="chips-wrap">' +
    items.map(t => {
      const n = counts && counts[t];
      const badge = n ? `<span style="margin-left:4px;background:rgba(0,0,0,0.25);border-radius:8px;padding:0 5px;font-size:10px;font-weight:700">${n}×</span>` : '';
      return `<span class="chip ${cls}" title="${n ? n + ' mentions' : ''}">${escHtml(t)}${badge}</span>`;
    }).join('') +
    '</div>';
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function section(label, content) {
  return `<div class="section-label">${label}</div>${content}`;
}

// ── Sidebar rendering ─────────────────────────────────────────────────────

function showEdgeSidebar(data) {
  document.getElementById('sidebar-title').textContent = 'Connection';
  document.getElementById('sidebar-name').textContent =
    data.source + ' ↔ ' + data.target;

  let html = '';

  if (data.connection_type) {
    html += section('Type',
      `<span class="connection-type-badge">${escHtml(data.connection_type)}</span>`);
  }

  // Key players — hormones, metabolites, proteins
  const hormones    = data.key_players_hormones    || [];
  const metabolites = data.key_players_metabolites || [];
  const proteins    = data.key_players_proteins    || [];
  const rawKP       = data.key_players             || [];
  const cntH = data.key_players_counts_hormones    || {};
  const cntM = data.key_players_counts_metabolites || {};
  const cntP = data.key_players_counts_proteins    || {};

  // If we have categorised players, show them; otherwise fall back to raw list
  if (hormones.length || metabolites.length || proteins.length) {
    html += section('Key Players',
      '<div style="display:flex;flex-direction:column;gap:8px">' +
      (hormones.length    ? '<div><span style="font-size:11px;color:#64748b;margin-bottom:3px;display:block">Hormones</span>'              + chipsHtml(hormones,    'chip-hormone',    cntH) + '</div>' : '') +
      (metabolites.length ? '<div><span style="font-size:11px;color:#64748b;margin-bottom:3px;display:block">Metabolites</span>'           + chipsHtml(metabolites, 'chip-metabolite', cntM) + '</div>' : '') +
      (proteins.length    ? '<div><span style="font-size:11px;color:#64748b;margin-bottom:3px;display:block">Proteins / Transporters</span>' + chipsHtml(proteins,    'chip-protein',    cntP) + '</div>' : '') +
      '</div>'
    );
  } else if (rawKP.length) {
    html += section('Key Players', chipsHtml(rawKP, 'chip-general', {}));
  }

  if (data.ai_description) {
    // Turn [PMID 12345678] into clickable PubMed links
    const linkedSummary = escHtml(data.ai_description).replace(
      /\[PMID\s+(\d+)\]/gi,
      (_, pmid) => `<a href="https://pubmed.ncbi.nlm.nih.gov/${pmid}/" target="_blank" rel="noopener"
         style="color:#818cf8;text-decoration:underline dotted">[PMID ${pmid}]</a>`
    );
    html += section('Literature Summary',
      `<div style="line-height:1.7;border-left:3px solid #6366f1;padding-left:10px;color:#cbd5e1;font-size:13px">${linkedSummary}</div>`);
  }

  if (data.notes) {
    html += section('Notes', `<p class="notes-text">${escHtml(data.notes)}</p>`);
  }

  if (data.sources && data.sources.length) {
    html += section('Sources',
      data.sources.filter(s => s.trim()).map(s => {
        const href = s.match(/https?:[/][/][^ ]+/) ? s.match(/https?:[/][/][^ ]+/)[0] : '#';
        return `<a class="source-item" href="${href}" target="_blank" rel="noopener">${escHtml(s)}</a>`;
      }).join('')
    );
  }

  // PubMed section
  if (data.pubmed_n > 0) {
    let papersHtml = `<div style="font-size:12px;color:#64748b;margin-bottom:8px">`+
      `Found ${data.pubmed_n} papers in last 5 years</div>`;
    if (data.pubmed_papers && data.pubmed_papers.length) {
      papersHtml += data.pubmed_papers.slice(0, 4).map(p => {
        const link = p.doi ? `https://doi.org/${p.doi}` : `https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/`;
        return `<div class="paper-card">
          <div class="paper-title">${escHtml(p.title)}</div>
          <div class="paper-meta">PMID: ${p.pmid} · ${p.year}</div>
          ${p.abstract ? `<div class="paper-abstract">${escHtml(p.abstract)}</div>` : ''}
          <a class="paper-link" href="${link}" target="_blank" rel="noopener">→ View on PubMed</a>
        </div>`;
      }).join('');
    }
    html += section('PubMed Literature', papersHtml);
  }

  document.getElementById('sidebar-body').innerHTML = html || '<p style="color:#475569;font-size:13px">No additional information available.</p>';
}

function showNodeSidebar(data) {
  document.getElementById('sidebar-title').textContent = 'Organ';
  document.getElementById('sidebar-name').textContent = data.label;

  let html = '';
  if (data.description) {
    html += section('Description',
      `<p class="notes-text">${escHtml(data.description)}</p>`);
  }

  // List connected edges
  const node = cy.getElementById(data.id);
  const edges = node.connectedEdges();
  if (edges.length) {
    html += section(`Connections (${edges.length})`,
      '<div style="display:flex;flex-direction:column;gap:4px">' +
      edges.map(e => {
        const other = e.source().id() === data.id ? e.target().id() : e.source().id();
        const ct = e.data('connection_type') || '';
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:#0f172a;border-radius:6px;cursor:pointer"
          onclick="selectEdge('${e.id()}')" >
          <span style="font-size:13px;color:#cbd5e1">${escHtml(other)}</span>
          ${ct ? `<span style="font-size:11px;color:#64748b">${escHtml(ct)}</span>` : ''}
        </div>`;
      }).join('') +
      '</div>'
    );
  }

  document.getElementById('sidebar-body').innerHTML = html ||
    '<p style="color:#475569;font-size:13px">No description available.</p>';
}

function selectEdge(edgeId) {
  cy.elements().removeClass('faded highlighted');
  const edge = cy.getElementById(edgeId);
  if (edge.length) {
    cy.elements().addClass('faded');
    edge.removeClass('faded').addClass('highlighted');
    edge.connectedNodes().removeClass('faded').addClass('highlighted');
    showEdgeSidebar(edge.data());
  }
}

// ── Click events ──────────────────────────────────────────────────────────

cy.on('tap', 'edge', function(evt) {
  const el = evt.target;
  cy.elements().removeClass('faded highlighted search-hit');
  cy.elements().addClass('faded');
  el.removeClass('faded').addClass('highlighted');
  el.connectedNodes().removeClass('faded').addClass('highlighted');
  showEdgeSidebar(el.data());
});

cy.on('tap', 'node', function(evt) {
  const el = evt.target;
  cy.elements().removeClass('faded highlighted search-hit');
  cy.elements().addClass('faded');
  el.removeClass('faded').addClass('highlighted');
  el.connectedEdges().removeClass('faded').addClass('highlighted');
  el.connectedNodes().removeClass('faded');
  showNodeSidebar(el.data());
});

cy.on('tap', function(evt) {
  if (evt.target === cy) {
    cy.elements().removeClass('faded highlighted search-hit');
    document.getElementById('sidebar-title').textContent = 'Select a node or edge';
    document.getElementById('sidebar-name').textContent = '—';
    document.getElementById('sidebar-body').innerHTML = `<div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
      </svg>
      Click any <strong>node</strong> or <strong>edge</strong> to see details.
    </div>`;
  }
});

// ── Tooltip ───────────────────────────────────────────────────────────────

const tooltip = document.getElementById('tooltip');

cy.on('mouseover', 'node', function(evt) {
  const d = evt.target.data();
  tooltip.textContent = d.label;
  tooltip.style.display = 'block';
});

cy.on('mouseover', 'edge', function(evt) {
  const d = evt.target.data();
  const kp = (d.key_players || []).slice(0, 4).join(', ');
  tooltip.innerHTML = `<strong>${escHtml(d.source)} ↔ ${escHtml(d.target)}</strong>${kp ? '<br><span style="color:#94a3b8">' + escHtml(kp) + '</span>' : ''}`;
  tooltip.style.display = 'block';
});

cy.on('mousemove', function(evt) {
  tooltip.style.left = (evt.originalEvent.clientX + 12) + 'px';
  tooltip.style.top = (evt.originalEvent.clientY + 12) + 'px';
});

cy.on('mouseout', 'node, edge', function() {
  tooltip.style.display = 'none';
});

// ── Search ────────────────────────────────────────────────────────────────

const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const searchCount = document.getElementById('search-count');

function buildSearchIndex() {
  const index = [];
  cy.edges().forEach(e => {
    const d = e.data();
    const text = [
      d.description || '',
      (d.key_players || []).join(' '),
      (d.key_players_hormones || []).join(' '),
      (d.key_players_metabolites || []).join(' '),
      (d.key_players_proteins || []).join(' '),
      d.notes || '',
      d.connection_type || '',
    ].join(' ').toLowerCase();
    index.push({ el: e, text, label: d.source + ' ↔ ' + d.target, type: 'edge' });
  });
  cy.nodes().forEach(n => {
    const d = n.data();
    const text = (d.description || '').toLowerCase() + ' ' + d.label.toLowerCase();
    index.push({ el: n, text, label: d.label, type: 'node' });
  });
  return index;
}

const searchIndex = buildSearchIndex();

searchInput.addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();

  if (!q) {
    cy.elements().removeClass('faded search-hit');
    searchResults.style.display = 'none';
    searchCount.textContent = '';
    return;
  }

  // Find matches
  const hits = searchIndex.filter(entry => entry.text.includes(q));
  const hitEls = cy.collection(hits.map(h => h.el));
  const edgeHits = hits.filter(h => h.type === 'edge');
  const nodeHits = hits.filter(h => h.type === 'node');

  // Visual feedback
  cy.elements().removeClass('search-hit').addClass('faded');
  hitEls.removeClass('faded').addClass('search-hit');
  // Also un-fade nodes connected to hit edges
  edgeHits.forEach(h => h.el.connectedNodes().removeClass('faded'));

  searchCount.textContent = `${edgeHits.length} edge${edgeHits.length !== 1 ? 's' : ''}`;

  // Dropdown results list
  if (hits.length === 0) {
    searchResults.innerHTML = '<div class="search-result-item" style="color:#64748b">No results found</div>';
  } else {
    searchResults.innerHTML = hits.slice(0, 20).map(h => {
      const icon = h.type === 'edge' ? '🔗' : '⬤';
      return `<div class="search-result-item" data-id="${h.el.id()}" data-type="${h.type}">
        <span>${icon}</span>
        <span>${escHtml(h.label)}</span>
        <span class="match-type">${h.type}</span>
      </div>`;
    }).join('');
    searchResults.querySelectorAll('.search-result-item[data-id]').forEach(item => {
      item.addEventListener('click', () => {
        const id = item.dataset.id;
        const type = item.dataset.type;
        searchResults.style.display = 'none';
        if (type === 'edge') {
          selectEdge(id);
        } else {
          cy.getElementById(id).trigger('tap');
        }
        cy.center(cy.getElementById(id));
      });
    });
  }
  searchResults.style.display = 'block';
});

// Hide dropdown on outside click
document.addEventListener('click', e => {
  if (!document.getElementById('search-wrap').contains(e.target)) {
    searchResults.style.display = 'none';
  }
});
searchInput.addEventListener('focus', () => {
  if (searchInput.value.trim()) searchResults.style.display = 'block';
});

</script>
