 bone marrow mesenchymal stem cells (BMSCs) exhibit therapeutic potential for spinal cord injury (SCI). However, the combined application of PRP and BMSCs-derived exosome (PRP-primed BMSCs-EXO, PRP-BMSCs-EXO) has not been reported. This study aimed to investigate whether the combined use confers superior therapeutic effects and to explore the underlying molecular mechanisms. First, we examined the effects of PRP priming on the proliferation and exosome secretion of BMSCs. High-throughput sequencing and RT-qPCR were used to analyze the differential miRNA expression profiles between exosomes from PRP- primed BMSCs (PRP-BMSCs-EXO) and naive BMSCs (BMSCs-EXO). Subsequently, a series of in vitro SCI models were established to evaluate the therapeutic effects of PRP-BMSCs-EXO on SCI. TargetScan, RNAhybrid, GO, KEGG, dual-luciferase reporter assay, RT-qPCR, western blotting (WB), and rescue experiments were performed to explore the roles of miRNAs in PRP-BMSCs-EXO and the associated signaling regulatory mechanisms in SCI. Finally, a series of in vivo SCI models were used to verify the therapeutic efficacy and mechanisms of PRP-BMSCs-EXO in vivo. PRP priming promoted the proliferation and exosome secretion of BMSCs. High-throughput sequencing and RT-qPCR revealed that multiple miRNAs were highly expressed in PRP-BMSCs-EXO compared with BMSCs-EXO, among which miR-29a-3p was the most abundant. In in vitro SCI models, PRP-BMSCs-EXO exerted better therapeutic effects than BMSCs-EXO and PRP. Mechanistically, PRP-BMSCs-EXO may enhance the viability and migration and inhibit the apoptosis and autophagy of pheochromocytoma 12 (PC12) cells by delivering miR-29a-3p, thereby promoting nerve regeneration and SCI repair. Bioinformatic analysis and luciferase assays indicated that PTEN may be a downstream target gene of miR-29a-3p. Rescue experiments confirmed that the miR-29a-3p/PTEN/PI3K/Akt/mTOR axis may mediate the regulatory effects of PRP-BMSCs-EXO on neuronal apoptosis, autophagy, and nerve regeneration in SCI. These findings were further validated in in vivo SCI models. Compared with PRP and BMSC-derived exosomes alone, PRP-primed BMSC-derived exosomes provide superior neuroprotective effects against SCI. PRP-BMSCs-EXO inhibits neuronal apoptosis and autophagy and promotes nerve regeneration via the miR-29a-3p/PTEN/PI3K/Akt/mTOR axis, representing a promising and effective therapeutic strategy for SCI.", "keywords": ["Exosomes", "Spinal Cord Injuries", "Mesenchymal Stem Cells", "Platelet-Rich Plasma", "MicroRNAs", "Animals", "Autophagy", "PTEN Phosphohydrolase", "Proto-Oncogene Proteins c-akt", "Apoptosis", "TOR Serine-Threonine Kinases", "Phosphatidylinositol 3-Kinases", "Nerve Regeneration", "Signal Transduction", "Rats", "Neurons", "Rats, Sprague-Dawley", "Disease Models, Animal", "Male"], "year": "2026", "doi": "10.1007/s10735-026-10823-1"}, {"pmid": "42133908", "title": "Hematopoietic Stem Cell Transplant and Brain Volume Changes in Adults With Sickle Cell Disease.", "abstract": "Adults with sickle cell disease (SCD) are at risk of decline in brain health and cognition, even without clinical stroke. SCD-related changes on MRI include brain atrophy and T2 fluid attenuated inversion recovery (FLAIR) white matter hyperintensity (WMH) growth. Hematopoietic stem cell transplant (HSCT) can be curative, but conditioning regimens risk new complications, particularly for adults with accumulated organ damage. We tested whether successful HSCT for adults with SCD was associated with reduced brain atrophy or WMH growth. In this cohort study, adults with severe SCD underwent HSCT as part of 5 research protocols at the National Institutes of Health Clinical Center, including autologous gene therapy, HLA-matched donor HSCs, and haploidentical HSCs. Serial brain MRI scans acquired before and after transplant for up to 12 years included 3D T1-weighted and axial FLAIR sequences. Longitudinal brain volumes, segmented using FreeSurfer and corrected for total intracranial volume (TICV), were used to measure brain parenchymal fraction (BPF). A deep learning algorithm segmented WMH volumes from FLAIR sequences. Volumes were log 2 -transformed as a percentage of TICV. We tested whether HSCT success (persistent engraftment vs graft failure) or change in hemoglobin (Hb) (post-pre-HSCT) was associated with the rate of brain atrophy or WMH growth using mixed-effects linear regression. Random effects included scanner, participant intercept, and slope, while fixed effects included age and sex. Seventy-seven participants (mean age 32 &#xb1; 9 years, 43% female) who underwent HSCT were followed for a median 5.3 years (interquartile range [IQR] = 4.6). For 65 participants with successful HSCT, BPF declined nonsignificantly (-0.055%/year; 95% CI -0.12, 0.006; p = 0.08). Twelve participants with graft failure had a 7-fold greater BPF decline (-0.42%/year; 95% CI -0.57, -0.26; p &lt; 0.001; group difference p &lt; 0.001). A smaller change in Hb after HSCT was associated with steeper BPF decline (0.035%/year per unit Hb; 95% CI 0.017, 0.053; interaction p &lt; 0.001). WMH growth was similar in both groups (0.038% vs 0.030% per year; interaction p = 0.50) and was associated with older age and baseline WMHs, but not treatment success. Successful HSCT was associated with preserved brain volume, but not WMH growth, another brain health biomarker. Whether these HSCT-related brain structural changes translate to cognitive preservation remains to be determined. ClinicalTrials.gov NCT02140554 registered 2014-05-14, first enrollment February 2015; ClinicalTrials.gov NCT00061568; registered 2004-07-16, first enrollment July 2004; ClinicalTrials.gov NCT02105766; registered 2014-04-01, first enrollment April 2014; ClinicalTrials.gov NCT03077542; registered 2017-03-10, first enrollment April 2017; ClinicalTrials.gov NCT00977691; registered 2009-12-14, first enrollment December 2009. This study provides Class III evidence that in adults with sickle cell disease, successful hematopoietic stem cell transplant is associated with slower declines in BPFs over a median period of 5 years, compared with patients with transplant failure.", "keywords": ["Humans", "Female", "Male", "Anemia, Sickle Cell", "Adult", "Hematopoietic Stem Cell Transplantation", "Brain", "Magnetic Resonance Imaging", "Young Adult", "Cohort Studies", "Organ Size", "Atrophy", "Middle Aged"], "year": "2026", "doi": "10.1212/WNL.0000000000218050"}, {"pmid": "42107073", "title": "A Skull Bone Marrow-to-Brain Axis Links Osteoblastic Activity to Myeloid Cell Trafficking, Cerebral Blood Flow, and Cognition in Alzheimer's Progression.", "abstract": "Patients with Alzheimer's disease (AD) often develop osteoporosis, but the role of bone remodeling in AD remains unclear. We previously showed that osteoblast-specific expression of APP swe induces bone loss, glial activation, and behavioral deficits, suggesting a bone-to-brain signaling axis. Here, we identify an altered skull bone marrow (SBM)-to-brain axis in AD. Early SBM changes, including reduced cellularity, increased density, and expanded vascular channels to the meninges, occur in multiple APP swe mouse models. These vascular changes facilitate migration of SBM-derived myeloid cells into the meninges and cortex, improving cerebral blood flow (CBF) and slowing cognitive decline. Notably, these effects are age-dependent, emerging at 6 months but diminishing by 12 months. Enhancing this axis via bone marrow transplantation improves CBF and cognitive function in aged mice, whereas disrupting it through osteoblastic deletion of ATP6AP2 impairs both. Together, these findings reveal a previously unrecognized SBM-to-brain axis that regulates immune, vascular, and cognitive functions, highlighting systemic contributions to AD pathogenesis.", "keywords": [], "year": "2026", "doi": "10.1002/advs.75622"}, {"pmid": "42009626", "title": "Treatment-related neuroanatomical and functional consequences of hematopoietic stem cell transplantation: A comprehensive review of brain structure and function.", "abstract": "Hematopoietic stem cell transplantation (HSCT) is a foundational treatment for hematological disorders. While its efficacy is established, the conditioning regimens required for HSCT (high-dose chemotherapy and radiotherapy), along with transplant-related immunological and metabolic changes, can induce significant neurological complications. These treatment-related effects necessitate a comprehensive evaluation of their impact on brain structure and function. A synthesis of current evidence on these neurological outcomes is essential to guide clinical practice and future research. This review synthesizes literature on the effects of HSCT-associated treatments on neuroanatomy, cognitive performance, and long-term neurological sequelae. Evidence indicates consistent reductions in gray-matter volume, particularly within frontal, temporal, and parietal cortices, alongside diffuse white-matter alterations affecting major commissural and association tracts. These structural changes correlate with clinically meaningful deficits in attention, executive function, and memory. The underlying pathogenic mechanisms are multifactorial, involving direct neurotoxicity from conditioning regimens, systemic and neuroinflammatory responses, and oxidative stress. The findings underscore the importance of integrating thorough neurological evaluation and longitudinal monitoring into routine care for HSCT recipients. Future research should elucidate detailed mechanisms and develop personalized, evidence-based neuroprotective and rehabilitative strategies. A deeper understanding of these neurological consequences is paramount for improving outcomes and long-term quality of life.", "keywords": [], "year": "2026", "doi": "10.1097/CM9.0000000000003981"}, {"pmid": "41961082", "title": "Avapritinib for targeting KIT D816V-mutated acute myeloid leukemia relapsed after allogeneic hematopoietic stem cell transplant with extramedullary and central nervous system involvement.", "abstract": "Relapse of acute myeloid leukemia with CBFB::MYH11 fusion and KIT D816V mutation after allogeneic hematopoietic stem cell transplantation is uncommon and often associated with aggressive extramedullary spread and poor outcomes, particularly when the central nervous system is involved. We report a case of a 54&#x2011;year&#x2011;old man who developed extensive paravertebral, central nervous system, and multiorgan extramedullary relapse despite donor lymphocyte infusions and high&#x2011;dose chemotherapy. Avapritinib, a selective inhibitor of mutated KIT , was initiated as single&#x2011;agent therapy and resulted in rapid neurological improvement, complete metabolic response on positron emission tomography&#x2013;computed tomography, and full molecular remission in peripheral blood. Due to temporary loss of off&#x2011;label access, avapritinib was discontinued, leading to a new extramedullary and central nervous system relapse. Remarkably, rechallenge with single&#x2011;agent avapritinib again induced molecular remission in both peripheral blood and cerebrospinal fluid, along with near&#x2011;complete metabolic response across all previously involved sites. The reproducibility of the response strongly supports a direct, target&#x2011;driven antileukemic effect. This case highlights the potential of avapritinib as an effective salvage therapy for KIT &#x2011;mutated acute myeloid leukemia with extramedullary and central nervous system involvement, including relapse after transplantation. The robust and repeated responses observed in this patient underscore the rationale the potential role of avapritinib as salvage therapy and support its investigation as a component of measurable residual disease-guided or post-transplant maintenance strategies.", "keywords": [], "year": "2026", "doi": "10.1007/s00277-026-06953-x"}, {"pmid": "41952146", "title": "Hematopoietic cell kinase regulates microglial/macrophage activation to drive neuroinflammation after traumatic brain injury.", "abstract": "Brain-resident microglia and infiltrating monocyte-derived macrophages are among the main effectors in regulating innate immunity and mediating neuroinflammation after traumatic brain injury (TBI). Our previous work demonstrated that circulating extracellular vesicles from TBI patients (TEVs) aggravate microglial/macrophage activation and associated neuroinflammatory damage. However, the key molecular regulators governing TBI-induced and TEV-aggravated microglial/macrophage responses remain elusive. To identify key molecular regulators of microglial/macrophage activation during the acute phase after TBI, we first performed RNA-sequencing on mouse TBI brains at multiple acute time points, and on brains from TBI mice treated with TEVs. We then integrated and analyzed a public single-nucleus RNA-sequencing dataset from human TBI brains (GSE209552) to validate and extend our murine findings. After hub gene identification, we used complementary in vivo (TBI and TBI&#x2009;+&#x2009;TEV mice) and in vitro [oxygen-glucose deprivation/re-oxygenation (OGD/R)-stimulated and TEV-stimulated BV2 cells] models for mechanistic investigation. Multi-dimensional bioinformatics analyses identified six hub genes, including HCK , BLNK , C1QB , CTSC , P2RY6 , and VAV1 , consistently implicated in microglial/macrophage activation throughout the acute phase after TBI. Subsequent mechanistic investigations focused on hematopoietic cell kinase (HCK), a central node within this hub gene network. Pharmacological inhibition of HCK kinase activity with A-419259 was found to (1) alleviate TBI-induced and TEV-aggravated microglial/macrophage activation and recruitment, (2) promote a phenotypic shift from pro-inflammatory M1 toward anti-inflammatory/reparative M2 polarization, and (3) suppress the activation of microglial/macrophage nucleotide-binding oligomerization domain-like receptor family pyrin domain containing 3 (NLRP3) inflammasome. These effects collectively ameliorated secondary brain damage and improved neurological outcomes after TBI. Complementary in vitro studies confirmed that A-419,259 treatment alleviated OGD/R-stimulated or TEV-stimulated BV2 microglial activation and NLRP3 inflammasome activation, while facilitating the M1-to-M2 transition. Our findings identify HCK as a pivotal molecular regulator of microglia/macrophage-mediated neuroinflammation, thus providing a potential therapeutic target for ameliorating secondary brain injury after TBI. The online version contains supplementary material available at 10.1186/s12964-026-02871-7.", "keywords": [], "year": "2026", "doi": "10.1186/s12964-026-02871-7"}, {"pmid": "41945041", "title": "Retraction Notice to \"Bone marrow stromal cells-derived exosomes reduce neurological damage in traumatic brain injury through the miR-124-3p/p38 MAPK/GLT-1 axis\" [Experimental Neurology 365 (2023) 114408].", "abstract": "", "keywords": [], "year": "2026", "doi": "10.1016/j.expneurol.2026.115760"}], "pubmed_query": "(\"bone marrow\"[Title] OR \"hematopoietic\"[Title] OR \"haematopoietic\"[Title] OR \"hematopoiesis\"[Title] OR \"bone marrow niche\"[Title]) AND (\"brain\"[Title] OR \"cerebral\"[Title] OR \"hypothalamus\"[Title] OR \"hypothalamic\"[Title] OR \"central nervous system\"[Title] OR \"CNS\"[Title] OR \"neuronal\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Bone Marrow__Small Intestine", "source": "Bone Marrow", "target": "Small Intestine", "color": "#64748b", "description": "Type: Metabolic status. Similar Function.\nKey Players: \nNotes: \n- Might occur only during fasting as glucose is reserved for brain and immune system (bone marrow, spleen, Peyer's patches in small intestine)\nSources:\n- doi: 10.4061/2010/823710 ", "connection_type": "Metabolic status. Similar Function.", "key_players": ["Notes:"], "key_players_metabolites": ["butyrate", "galactose", "fatty acids", "fatty acid", "methionine", "amp", "glucose", "lactate", "nadph", "cholesterol", "lipoprotein", "acetate", "adp", "propionate", "amino acids", "prostaglandin", "pyruvate", "free fatty acid", "ceramide", "triglycerides", "uric acid", "sphingolipid", "bile acids", "ldl", "cysteine", "amino acid", "creatine", "triglyceride", "nadh", "deoxycholic acid", "glutamine"], "key_players_hormones": ["tnf", "il-6", "tumor necrosis factor", "insulin", "progesterone", "il-4", "il-10", "angiotensin", "glucocorticoid", "tnf-alpha", "adiponectin", "vitamin d", "interleukin-6", "resistin", "leptin", "igf1", "interleukin-1", "glucagon", "estrogen", "t3", "glp-1", "epo", "gip", "fgf23", "il6", "renin"], "key_players_proteins": ["ampk", "erk1", "inos", "akt", "mapk", "sirt4", "pi3k", "fabp", "p38", "pkm2", "cpt2"], "key_players_counts_metabolites": {"methionine": 7, "cholesterol": 3, "sphingolipid": 1, "propionate": 2, "amp": 6, "bile acids": 1, "amino acids": 2, "glucose": 5, "galactose": 13, "fatty acid": 10, "ldl": 1, "lactate": 5, "cysteine": 1, "prostaglandin": 2, "butyrate": 18, "pyruvate": 2, "free fatty acid": 2, "amino acid": 1, "lipoprotein": 3, "ceramide": 2, "triglycerides": 2, "acetate": 3, "creatine": 1, "uric acid": 2, "triglyceride": 1, "fatty acids": 12, "nadh": 1, "deoxycholic acid": 1, "adp": 3, "glutamine": 1, "nadph": 5}, "key_players_counts_hormones": {"progesterone": 7, "tnf": 17, "glucocorticoid": 4, "interleukin-1": 2, "fgf23": 1, "glucagon": 2, "il-4": 7, "tnf-alpha": 4, "il6": 1, "renin": 1, "estrogen": 2, "adiponectin": 4, "insulin": 8, "t3": 2, "vitamin d": 4, "resistin": 3, "il-10": 6, "tumor necrosis factor": 11, "leptin": 3, "glp-1": 2, "il-6": 12, "igf1": 3, "epo": 2, "gip": 2, "angiotensin": 6, "interleukin-6": 4}, "key_players_counts_proteins": {"sirt4": 2, "mapk": 3, "fabp": 1, "pi3k": 2, "p38": 1, "akt": 4, "erk1": 7, "ampk": 8, "inos": 5, "pkm2": 1, "cpt2": 1}, "notes": "- Might occur only during fasting as glucose is reserved for brain and immune system (bone marrow, spleen, Peyer's patches in small intestine)", "sources": ["doi: 10.4061/2010/823710"], "ai_description": "The bone marrow-small intestine axis is mediated by inter-organ communication through the gut microbiome and hormonal signaling pathways. The gut microbiota influences bone marrow mesenchymal stem cells (BMSCs) via modulation of connexin43 expression, which in turn affects adipose tissue homeostasis [2]. Fusobacterium nucleatum, a gut microbiota component, synergizes with BMSCs to drive colorectal tumorigenesis through Wnt3a signaling [1]. Additionally, the gut-bone axis is regulated by dietary fibers that modulate the gut microbiome and regulatory T cells, influencing hematopoietic stem cell transplantation outcomes [3].", "pubmed_n": 144, "pubmed_papers": [{"pmid": "42216221", "title": "Bone marrow mesenchymal stem cells synergize with fusobacterium nucleatum to drive colorectal tumorigenesis via gut microbiome dysbiosis.", "abstract": "The oncogenic role of F. nucleatum (Fn) in colorectal cancer (CRC) is increasingly recognized, yet its interaction with host stromal components, such as bone marrow mesenchymal stem cells (BMSCs), remains poorly understood. Building on our previous discovery that BMSC-derived Wnt3a promotes Fn-driven tumorigenesis, this study aims to investigate the synergistic interplay between BMSCs and F. nucleatum in CRC pathogenesis via the gut microbiome. Based on the established Apc Min/+ mouse model of CRC, animals were randomly assigned to four experimental groups: control, Fn-only, BMSCs-only, and Fn+BMSCs co-treatment group. Gut microbiota composition was continuously analyzed over 8 weeks by metagenomic sequencing. Metagenomic functions were predicted using PICRUSt2. The Fn+BMSCs co-treatment group exhibited the highest enrichment of F. nucleatum and the greatest reduction in microbial diversity. Fn+BMSCs co-treatment induced a distinct pro-tumorigenic shift, marked by a decline in symbiont Lactobacillus and an increase in pathobiont Escherichia-Shigella. Metagenomic analysis revealed a unique enhancement of butanoate metabolism in the Fn+BMSC co-treatment group. Furthermore, a profoundly elevated LPS level was discovered in the Fn+BMSCs co-treatment group, indicating hyperactivation of the pro-inflammatory and proliferative TLR4/NF-&#x3ba;B pathway. Our findings demonstrate that BMSCs synergize with F. nucleatum to create a tumorigenicmicroenvironment by driving microbial dysbiosis, reprogramming metabolic pathways, and amplifying pro-inflammatory signaling. Our findings reveal that BMSCs fuel CRC progression via multiple mechanisms: by altering the gut microbiome ecology and, as previously discovered, by providing oncogenic Wnt3a signals. Targeting the synergistic BMSC-Fn axis may thus offer a novel therapeutic strategy for CRC.", "keywords": [], "year": "2026", "doi": "10.1186/s13099-026-00839-z"}, {"pmid": "42203970", "title": "Gut microbiota alteration contributes to bone marrow mesenchymal stem cells connexin43 response to high-fat diet induced obesity in mice.", "abstract": "Bone marrow mesenchymal stem cells (BMSCs) contribute to controlling adipose tissue homeostasis and may be a potential target for obesity therapy. Since lack of connexin43(Cx43) in mesenchymal stem cells (MSCs) is known to combat high-fat diet (HFD)-induced adiposity. Also, HFD is a well-known risk factor for gut microbiota dysbiosis. Here we attempt to address the interaction between HFD, gut microbiota, and Cx43 deficiency in BMSCs during the development of obesity. BMSC-specific Cx43 knockout (Prrx1-Cre;Cx43 flox/flox (cKO)) and control littermate (Cx43 flox/flox (flox))mice were fed a regular chow diet or a HFD for 8 weeks. Cecal microbiome composition was assessed by 16S ribosomal RNA (rRNA) sequencing, and further analyzing correlation between gut microbiota and obesogenic parameters. Moreover, transplantation fecal microbiota was used to probe the salutary effect of BMSC Cx43. HFD fed cKO mice notably altered cecal microbiome composition as proved by a distinctively clustered separation from flox mice. Concomitantly, Allobaculum induced by HFD was strongly correlated positively with body weight, glucose intolerance, and adipose mass. The recipients with gut microbiota from cKO mice displayed anti-obesity phenotype as the donors. Gut microbiota alteration may be one main reason for the salutary effect of BMSC Cx43 knockout on body adiposity.", "keywords": [], "year": "2026", "doi": "10.1038/s41366-026-02104-4"}, {"pmid": "42075029", "title": "Modulation of Gut Microbiota Through Dietary Fibers to Enhance Regulatory T Cell-Based Immunotherapy in GVHD Following Hematopoietic Stem Cell Transplantation.", "abstract": "Graft-versus-host disease (GVHD) is one of the principal complications seen in the recipients of allogenic hematopoietic stem cell transplantation (allo-HSCT), and persists as a leading cause of post-transplant morbidity and mortality. Increasing evidence highlights the crucial influence of the gut microbiome (GM) on transplant outcomes. Microbial dysbiosis, characterized by reduced bacterial diversity and pathogenic overgrowth, is strongly associated with higher rates of complications and mortality. Patients with lower microbial diversity exhibit poorer overall survival (OS) and an increased incidence of acute GVHD (aGVHD). Conversely, restoration of beneficial commensal communities has been shown to enhance immune homeostasis, mitigate GVHD severity, and decrease infection risk. Emerging therapeutic strategies now focus on modulating the intestinal microbiome through dietary interventions, probiotics, prebiotics, and fecal microbiota transplantation (FMT). It has been demonstrated that bacterial metabolites, such as short-chain fatty acids (SCFAs) from the diet, especially a diet rich in fibers, reduce the occurrence/severity of GVHD by inducing regulatory T cells (Tregs), which release anti-inflammatory cytokines and regulate the host immune system. Hence, the implementation of dietary fibers (DFs) could increase beneficial commensals, Treg induction, and improve outcomes such as GVHD and OS in recipients of allo-HCT. Hereupon, this review addresses how a fiber-rich diet modulates GM composition, reinforces epithelial barrier integrity, and improves the efficacy of Treg-based immunotherapy by stabilizing their regulatory phenotype and increasing their functional persistence, ultimately leading to a reduction in GI complications associated with GVHD. Unlike prior reviews that primarily cover the microbiome-GVHD axis or Treg therapies in isolation, this review emphasizes fermentable dietary fibers as a mechanistically grounded, clinically actionable strategy to support Treg stability and persistence via microbiota-derived metabolites. We integrate mechanistic evidence with emerging clinical feasibility data and ongoing trials of prebiotic supplementation in allogeneic HSCT.", "keywords": ["Humans", "Graft vs Host Disease", "Hematopoietic Stem Cell Transplantation", "T-Lymphocytes, Regulatory", "Dietary Fiber", "Gastrointestinal Microbiome", "Animals", "Immunotherapy", "Prebiotics", "Dysbiosis"], "year": "2026", "doi": "10.3390/nu18081216"}, {"pmid": "42038323", "title": "Si xian formula (SXF) alleviates carboplatin-induced bone marrow microenvironment damage and promotes thrombocytopenia recovery by regulating gut microbiota and bone marrow metabolites: a correlative study.", "abstract": "Chemotherapy-induced thrombocytopenia (CIT) presents as a prevalent hematological toxicity, often complicating the clinical management of cancer patients. SI XIAN Formula (SXF), a prescription consisting of ten traditional Chinese medicine for treating chemotherapy-induced thrombocytopenia (CIT), has been widely used to treat CIT patients more than 10&#xa0;years. The mechanism of SXF remains unclear. This study was designed to systematically evaluate the therapeutic efficacy and elucidate the underlying mechanisms of SXF in a CIT mouse model. A CIT mice model was successfully established via the tail vein injection of carboplatin. The Mice were subsequently treated daily with SXF for 15&#xa0;days and 24&#xa0;days. Body weight and platelet count were recorded every 3&#xa0;days. The bone marrow cells and fluid were collected for flow cytometry analysis and cytokine detection separately. Histological changes in the femurs bone marrow were observed using H&amp;E staining. The diversity and composition of the intestinal microbiota were analyzed using 16S rDNA gene sequencing. The bone marrow metabolites were identified by HPLC-MS/MS analysis. SXF administration significantly accelerated the recovery of platelet counts to baseline levels following carboplatin -induced thrombocytopenia. Mechanistically, SXF demonstrated protective effects on multiple hematopoietic cells, including hematopoietic stem/progenitor cells, megakaryocytic progenitor cells, and bone marrow megakaryocytes in CIT-induced mice. Furthermore, SXF effectively restored carboplatin-induced alterations in hematopoietic cytokine profiles. SXF treatment altered gut microbial diversity and community structure, particularly reducing the abundance of Paraprevotella and Bacteroides while increasing the abundance of Lachnospiraceae_NK4A136 compared with the model group, which is positively correlated with all hematopoietic function indicators (P &lt; 0.001). Metabolomic profiling further revealed that SXF ameliorated the bone marrow metabolic profile in CIT-induced mice. Spearman correlation analysis revealed significant positive associations between Parabacteroides , Prevotellaceae_UCG-001 , Bacillu s, and unclassified Muribaculaceae with upregulated metabolites, while showing inverse correlations with downregulated metabolites in SXF(H) versus MDL group comparisons. Our findings demonstrate that SXF alleviates CIT in mice by orchestrating a novel gut-bone marrow regulatory axis, bridging gut microbiota and marrow metabolic remodeling. In CIT murine models, SXF administration was shown to alleviate carboplatin-induced bone marrow microenvironment injury and accelerate platelet recovery via bidirectional regulation of gut microbiota and marrow metabolic remodeling.", "keywords": [], "year": "2026", "doi": "10.3389/fphar.2026.1689477"}, {"pmid": "42034936", "title": "The gut-bone axis in osteoporosis: Microbiota-associated immune-metabolic remodeling of the bone marrow microenvironment.", "abstract": "Osteoporosis is a common systemic skeletal disease in the aging population, and its pathogenesis involves multiple mechanisms such as estrogen deficiency, aging, reduced mechanical load, chronic low-grade inflammation, and imbalance of the calcium&#x2011;phosphorus-vitamin D-PTH/FGF23 axis. In recent years, the gut-bone axis has increasingly been recognized as a complementary regulatory network for understanding the systemic heterogeneity of osteoporosis, rather than a single dominant pathway independent of classical mechanisms. Existing studies suggest that intestinal barrier status, microbiota imbalance, and their related inflammatory/metabolic signals may affect the bone marrow immune-metabolic state and bone remodeling balance through a continuous mechanism chain of \"gut output-bone marrow microenvironment translation-bone remodeling imbalance.\" Accordingly, the main significance of the gut-bone axis lies in supplementing the explanation from a cross-organ perspective of how classical osteoporosis mechanisms such as inflammation, aging, and abnormal mineral metabolism collectively converge on bone marrow microenvironment imbalance and bone loss. This article reviews how intestinal barrier dysfunction, microbiota imbalance, and their related metabolic pathways affect the bone marrow microenvironment and alter osteoblast-osteoclast coupling, focusing on three levels: gut signal output, bone marrow immune-metabolic translation, and dysregulation at the bone remodeling execution level. Currently, relatively consistent supporting evidence mainly comes from animal and preclinical mechanism studies; population studies more often suggest a correlation between the gut-bone axis and osteoporosis, while genetic/MR inference and clinical intervention evidence remain limited. Therefore, the gut-bone axis is more suitable as an analysis framework for integrating immune, metabolic, and bone marrow microenvironment changes in osteoporosis, and its translational potential is currently limited to providing insights for mechanism and stratification research levels, rather than serving as a mature intervention pathway.", "keywords": ["Humans", "Osteoporosis", "Animals", "Bone Marrow", "Gastrointestinal Microbiome", "Bone Remodeling", "Fibroblast Growth Factor-23", "Cellular Microenvironment", "Bone and Bones", "Intestinal Barrier Function"], "year": "2026", "doi": "10.1016/j.intimp.2026.116690"}, {"pmid": "41727025", "title": "Alamandine/MrgD Pathway Modulates Gut-Bone Marrow Axis in Aging.", "abstract": "Aging is associated with colon epithelial barrier integrity and upregulation of myelopoiesis in the bone marrow (BM). Alamandine (Ala) and MrgD are novel members of the renin angiotensin system (RAS). This study tested the hypothesis that Ala restores the colon epithelial barrier integrity in aging via modulating gut-BM axis. Mice of age 2-3 (Young) or 22-24 months (Old) were treated with saline or Ala by using Osmotic pumps. The intestinal permeability was evaluated by using FITC-dextran. Lgr5 + Olfm4 + intestinal stem cells (ISCs), Wnt3a and &#x3b2;-catenin were evaluated by immunohistochemistry or western blotting. Fecal microbiome was analyzed by 16S rRNA sequencing. Monocyte-macrophages were characterized by flow cytometry. Cecal or serum bacterial metabolites were analyzed. The pro-myelopoietic potential of cecal supernatants (CS) was tested in the Young-BM cells. MrgD was expressed in ISCs, which was decreased in the Old. Increased intestinal permeability in aging was reversed by Ala. In the colon organoids, Ala increased Wnt3a levels that were antagonized by the NF449, SQ22536 or 666-15. Ala restored phospho-CREB and active &#x3b2;-catenin levels that were decreased in the Old colon-organoids. Ala increased the richness and &#x3b2;-diversity of the aging microbiome and decreased Bacillota / Bacteroidota . Ala decreased the CD80 + and increased CX3CR + cells in the Old colons. Old-CS induced myelopoiesis in vitro in BM cells with higher number of monocytes and pro-inflammatory macrophages which was not observed in the CS derived from Ala-treated Old mice. Ala is a promising pharmacological agent for reversing the leaky gut of aging by restoring homeostasis in the gut-BM axis.", "keywords": [], "year": "2026", "doi": "10.64898/2026.02.12.705187"}, {"pmid": "41532847", "title": "Mutational Signatures and Clonal Hematopoiesis in Intestinal Metaplasia across Countries with Varying Stomach Cancer Incidence.", "abstract": "Intestinal metaplasia (IM) is a premalignant condition associated with increased risk of gastric cancer-a deadly malignancy with varying geographic incidence. High-depth targeted sequencing of more than 1,500 IM samples from six countries identified 47 significantly mutated genes, including driver genes associated with high-risk populations and worse prognosis (ARID1A), KRAS/MAPK signaling (KRAS, BRAF, MAP2K1, MAP3K1, and MAP2K4), and altered mucosal immunity (PIGR). IM whole-genome sequencing and DNA methylation analysis revealed SBS17 as a specific mutational signature separating IMs from normal gastric tissues, associated with late DNA replication, genomic hypomethylation, and tobacco exposure. Beyond epithelial-derived somatic mutations, we observed elevated clonal hematopoiesis (CH) in patients with IM associated with age, smoking, and enhanced risk of progressing to gastric cancer. Patients with CH expansions exhibited co-occurring IM PIGR truncating mutations and greater colonization of the IM microenvironment by orally derived bacteria, suggesting that CH may promote IM progression by modulating host-microbe mucosal immunity. This international study identifies recurrent IM driver genes, IM-specific mutational signatures, and alterations in IM-associated immune landscapes and microbiomes. Our results highlight a role for nonepithelial somatic alterations (CH) in IM progression to gastric cancer, offering new translational opportunities for early cancer detection and interception.", "keywords": ["Humans", "Stomach Neoplasms", "Clonal Hematopoiesis", "Mutation", "Metaplasia", "Incidence", "Female", "Precancerous Conditions"], "year": "2026", "doi": "10.1158/2159-8290.CD-25-0778"}, {"pmid": "41481427", "title": "Clostridium butyricum alleviates multiple myeloma by remodeling the bone marrow microenvironment and inhibiting PI3K/AKT pathway through the gut&#x2012;bone axis.", "abstract": "Emerging evidence reveals a strong connection between the gut microbiota and cancer. However, the exact role of gut microbiota dysbiosis in multiple myeloma (MM) is poorly understood, and the therapeutic potential of microbiota-targeted interventions represents a promising strategy that demands urgent mechanistic and translational investigation. First, we conducted a comprehensive microbiome-metabolite analysis between MM patients and healthy individuals. The result revealed a marked compositional difference characterized by reduced abundances of butyrate-producing bacteria and diminished butyrate levels in the MM cohort. Subsequent fecal microbiota transplantation demonstrated that the gut microbiota critically modulates MM progression, with healthy donor-derived microbiota reducing the tumor burden and concomitantly elevating serum butyrate. Furthermore, through function-based culturomics screening, Clostridium butyricum ( C. butyricum ) was identified as a key butyrate-producing specialist. C. butyricum or its metabolite butyrate significantly reduced the systemic tumor burden in 5TGM1 mice. Notably, C. butyricum and butyrate alleviated bone marrow inflammation and osteolytic lesions by suppressing Th17 cells and IL-17 levels in the bone marrow. Moreover, cellular assays and transcriptome sequencing further revealed that butyrate could induce MM cells' apoptosis via HDAC inhibition-mediated upregulation of PPAR&#x3b3;, leading to sequential suppression of the PI3K/AKT pathway and antiapoptotic BCL-2 expression. This apoptotic signaling cascade was reversed by PPAR&#x3b3; antagonism. The direct antitumor effect was further confirmed in M-NSG mice. Our research systematically verifies the specific role of the gut microbiota in MM and provides the first evidence of the immune and molecular mechanisms by which C. butyricum alleviates MM progression, offering preclinical support for probiotic-based therapies against MM.", "keywords": ["Clostridium butyricum", "Animals", "Multiple Myeloma", "Humans", "Gastrointestinal Microbiome", "Mice", "Phosphatidylinositol 3-Kinases", "Proto-Oncogene Proteins c-akt", "Butyrates", "Fecal Microbiota Transplantation", "Male", "Bone Marrow", "Signal Transduction", "Tumor Microenvironment", "Dysbiosis", "Female", "Th17 Cells"], "year": "2026", "doi": "10.1080/19490976.2025.2609455"}, {"pmid": "41144746", "title": "Bone Marrow Mesenchymal Stem Cell Hydrogel-Mediated Fibroblast Reprogramming Restores Intestinal Function in Adhesive Small Bowel Obstruction.", "abstract": "Adhesive small bowel obstruction (ASBO) is a surgical complication characterized by intestinal stenosis due to ectopic fibroblast activation following serosal injury. This study demonstrates that bone marrow mesenchymal stem cells encapsulated in a silk hydrogel (BMSC@Gel) not only prevent tissue adhesion but also restores physiological functions in both mouse tissues and human-derived organoids. BMSCs exert dual regulatory effects on the obstructed intestinal microenvironment. First, they preferentially differentiate into proliferating fibroblasts (FBs) expressing Top2a, Stmn1, and Spp1 rather than inflammatory FBs marked by Adamdec1, Mmp3, and Igfbp3. Second, BMSC-derived exosomes suppress the inflammatory microenvironment, thereby maintaining intestinal homeostasis. Furthermore, BMSCs modulate fibroblast phenotypes and intracellular interactions and inhibit the TGF-&#x3b2;1/Smad3 signaling pathway during fibrosis development, thereby reversing the onset of ASBO. Collectively, these findings highlight BMSC@Gel as a promising therapeutic strategy for the prevention of ASBO in clinical practice.", "keywords": ["Animals", "Mesenchymal Stem Cells", "Mice", "Hydrogels", "Intestinal Obstruction", "Fibroblasts", "Humans", "Intestine, Small", "Mesenchymal Stem Cell Transplantation", "Tissue Adhesions", "Mice, Inbred C57BL", "Male", "Cell Differentiation", "Disease Models, Animal", "Cellular Reprogramming"], "year": "2026", "doi": "10.1002/advs.202513781"}, {"pmid": "41082369", "title": "Faecalibaculum rodentium Alleviates Ionizing Radiation-Induced Damage in Mice by Improving Intestinal Integrity and Hematopoiesis via Its Metabolite Butyrate.", "abstract": "The gut microbiota is key to mitigating ionizing radiation (IR)-induced injuries; however, the specific species involved in and the molecular mechanisms remain elusive.&#xa0;Mitochondrial dynamics affect gut microbiota diversity. To identify the specific species involved in the radioprotective effect, we performed mitochondrial proteomic profiling of mouse intestinal epithelial cells and identified the accumulation of signal transducer and activator of transcription 3 (STAT3). Using mitochondrial STAT3 knock-in mice, we observed the abundance of the probiotic Faecalibaculum rodentium and its metabolite butyrate decreased in parallel with increased sensitivity to IR. Supplementation with Faecalibaculum rodentium or butyrate attenuated IR-induced intestinal barrier dysfunction, enhanced hematopoietic recovery, and prolonged survival. Butyrate is found to exert dual protective effects: It increases tight junction proteins, such as zonula occludens-1 (ZO-1) and occludin, and the defense factor levels to reinforce intestinal integrity. Furthermore, it sustains&#xa0;extracellular regulated protein kinases (ERK)-mediated pyruvate kinase isozyme type M2 (PKM2) nuclear localization, thereby attenuating p53-dependent apoptotic signaling in hematopoietic stem cells and ultimately prolonging mouse survival. These findings indicate that Faecalibaculum rodentium-derived butyrate confers radioprotection by maintaining the intestinal barrier and hematopoietic regeneration, suggesting a promising microbiota-directed therapeutic strategy against radiation-induced injury.", "keywords": ["Animals", "Mice", "Butyrates", "Gastrointestinal Microbiome", "Hematopoiesis", "Radiation, Ionizing", "Intestines", "Male", "Intestinal Mucosa", "Mice, Inbred C57BL", "Probiotics"], "year": "2026", "doi": "10.1002/advs.202509383"}], "pubmed_query": "(\"bone marrow\"[Title] OR \"hematopoietic\"[Title] OR \"haematopoietic\"[Title] OR \"hematopoiesis\"[Title] OR \"bone marrow niche\"[Title]) AND (\"small intestine\"[Title] OR \"duodenum\"[Title] OR \"jejunum\"[Title] OR \"ileum\"[Title] OR \"intestinal\"[Title] OR \"gut\"[Title] OR \"enterocyte\"[Title] OR \"Peyer's patches\"[Title] OR \"gut-brain axis\"[Title] OR \"enteroendocrine\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Bone Marrow__Spleen", "source": "Bone Marrow", "target": "Spleen", "color": "#64748b", "description": "Type: Metabolic status. Similar Function.\nKey Players: \nNotes: \n- Might occur only during fasting as glucose is reserved for brain and immune system (bone marrow, spleen, Peyer's patches in small intestine)\nSources:", "connection_type": "Metabolic status. Similar Function.", "key_players": ["Notes:"], "key_players_metabolites": ["glucose", "galactose", "prostaglandin", "phospholipid", "atp", "arginine", "methionine", "amp", "leukotriene", "fatty acid", "lactate", "glycerol", "cholesterol", "sphingosine-1-phosphate", "ldl", "eicosanoid", "pyruvate", "acetate", "nadph", "serine"], "key_players_hormones": ["erythropoietin", "il-10", "epo", "growth hormone", "tnf", "tnf-alpha", "insulin", "estrogen", "vitamin d", "corticosterone", "calcitriol", "tumor necrosis factor", "il-6", "prolactin", "acth", "igf-1", "il-4", "norepinephrine", "cortisol", "osteocalcin", "noradrenaline", "thyrotropin"], "key_players_proteins": ["akt", "cox-2", "pi3k", "inos", "acc"], "key_players_counts_metabolites": {"methionine": 2, "cholesterol": 1, "amp": 2, "atp": 3, "leukotriene": 2, "glucose": 13, "sphingosine-1-phosphate": 1, "galactose": 10, "fatty acid": 2, "ldl": 1, "lactate": 2, "eicosanoid": 1, "prostaglandin": 9, "arginine": 3, "pyruvate": 1, "glycerol": 2, "acetate": 1, "phospholipid": 4, "nadph": 1, "serine": 1}, "key_players_counts_hormones": {"tnf": 4, "acth": 1, "igf-1": 1, "il-4": 1, "norepinephrine": 1, "cortisol": 1, "osteocalcin": 1, "tnf-alpha": 4, "growth hormone": 6, "erythropoietin": 20, "noradrenaline": 1, "estrogen": 3, "insulin": 4, "vitamin d": 3, "il-10": 15, "calcitriol": 2, "tumor necrosis factor": 2, "corticosterone": 3, "il-6": 2, "epo": 11, "thyrotropin": 1, "prolactin": 2}, "key_players_counts_proteins": {"pi3k": 2, "akt": 7, "cox-2": 6, "inos": 2, "acc": 2}, "notes": "- Might occur only during fasting as glucose is reserved for brain and immune system (bone marrow, spleen, Peyer's patches in small intestine)", "sources": [], "ai_description": "The Bone Marrow-Spleen axis is a complex inter-organ communication network that involves the exchange of signalling molecules and metabolic byproducts between these two critical organs in the immune system. The key players in this axis include ferritin, which is taken up by macrophages in bone marrow and spleen, leading to ferroptosis [4], while ATP synthase activity, regulated by ATPIF1 [3], influences mitochondrial metabolism and erythropoiesis in bone marrow. The activation of reticuloendothelial system (RES) in lymphoma patients leads to increased 18F-FDG uptake in spleen and/or bone marrow, which can serve as a prognostic marker [1]. Non-canonical NF-κB signaling, disrupted by NIK deficiency [2], plays a crucial role in thymic reconstitution and secondary lymphoid organ development.", "pubmed_n": 150, "pubmed_papers": [{"pmid": "41547774", "title": "Prognostic value of diffusely increased FDG uptake in spleen and/ or bone marrow due to reticuloendothelial system activation in lymphoma patients.", "abstract": "The primary objective of this investigation was to evaluate the predictive utility of diffusely increased 18 F-FDG uptake in the spleen or bone marrow in lymphoma patients and explore the correlation between reticuloendothelial system activation and inflammation. Our retrospective cohort comprised 629 treatment-na&#xef;ve lymphoma patients with pathological confirmation who received diagnostic 18&#xa0;F-FDG PET/CT scans between June 2018 and December 2024. The patients cohort with conditions affecting splenic/bone marrow metabolism (e.g., anemia) or focal uptake were excluded, leaving 142 patients. Based on liver uptake, spleen and bone marrow FDG uptake were classified into two groups: diffusely increased FDG uptake (dFDG, n&#x2009;=&#x2009;67) and normal FDG uptake (nFDG, n&#x2009;=&#x2009;75). Hematologic parameters (white blood cells, monocytes, neutrophils, platelets) and inflammatory markers (lactate dehydrogenase [LDH], &#x3b2; 2 -microglobulin) were recorded within one week of PET/CT. Volumes of interest (VOIs) were delineated for the liver, spleen, and bone marrow to obtain SUVmean values, calculating SLR and BLR. Survival data were obtained via medical records or telephone follow-up. Prognostic factors were assessed using correlation analysis, proportional hazards regression modeling complemented by Kaplan-Meier survival curve estimation. No statistically significant differences were observed in age, sex, or B symptoms between groups. The dFDG group had more advanced staging (Stage III/IV: 83.6% vs. 52.0%, p&#x2009;&lt;&#x2009;0.001) and significantly higher inflammatory markers (LDH, &#x3b2; 2 -microglobulin, D-dimer; all p&#x2009;&lt;&#x2009;0.05). SLR positively correlated with LDH, &#x3b2; 2 -microglobulin, and D-dimer (all p&#x2009;&lt;&#x2009;0.05). SLR&#x2009;&gt;&#x2009;2.221 was an independent risk factor for PFS (HR&#x2009;=&#x2009;4.660, p&#x2009;=&#x2009;0.012). Diffuse bone marrow uptake showed low concordance with bone marrow aspiration (kappa&#x2009;=&#x2009;0.337, p&#x2009;&lt;&#x2009;0.001), possibly related to inflammation or marrow activation. Multivariate analysis confirmed SLR as an independent predictor of PFS. Diffuse splenic FDG uptake strongly correlates with systemic inflammation. The SLR emerged as an independent predictor of progression-free survival in our lymphoma cohort. Diffuse bone marrow uptake may involve non-neoplastic factors and requires comprehensive clinicopathological assessment. This study provides new evidence for PET/CT-guided prognostic evaluation in lymphoma.", "keywords": ["Humans", "Female", "Fluorodeoxyglucose F18", "Bone Marrow", "Male", "Lymphoma", "Positron Emission Tomography Computed Tomography", "Prognosis", "Retrospective Studies", "Spleen", "Middle Aged", "Aged", "Adult", "Mononuclear Phagocyte System", "Radiopharmaceuticals", "Aged, 80 and over"], "year": "2026", "doi": "10.1186/s12885-026-15568-4"}, {"pmid": "41280889", "title": "Long-term outcome of bone marrow transplantation in NIK deficiency: non-redundant role of non-canonical NF-&#x3ba;B signaling in thymic reconstitution and secondary lymphoid organ development.", "abstract": "Biallelic mutations in MAP3K14 , encoding NF-&#x3ba;B-inducing kinase (NIK), disrupt non-canonical NF-&#x3ba;B signaling and lead to a rare inborn error of immunity marked by impaired lymphoid organ development, defective lymphocyte maturation, and susceptibility to recurrent infections. Hematopoietic stem cell transplantation (HSCT) has been considered a curative approach, yet its long-term efficacy remains unclear. We report long-term outcomes of two patients with genetically confirmed NIK deficiency who underwent HSCT. Both patients achieved full donor chimerism and early T-cell reconstitution with normalized CD3 + , CD4 + , and CD8 + counts and na&#xef;ve T-cell subsets. However, memory T-cell differentiation remained impaired, with persistently reduced central memory T cells and circulating T follicular helper cells. Immune dysregulation emerged years after HSCT, with one patient developing seropositive arthritis and the other exhibiting autoimmune hepatitis. Thymic dysfunction was suspected as an underlying contributor to impaired central tolerance in this pathology. Similarly, B-cell reconstitution was incomplete, characterized by persistent hypogammaglobulinemia and a marked deficiency in class-switched memory B cells, despite donor-derived chimerism. Lymphoscintigraphy confirmed absence of lymph nodes. Both patients suffered from recurrent, severe infections and ultimately died of infection-related complications. Our findings indicate that HSCT alone is insufficient to fully correct the immune disorder in MAP3K14 deficiency, likely due to non-hematopoietic defects in lymph node stromal structures and thymic central tolerance. These results highlight the importance of long-term immunologic monitoring, including assessments for immune dysregulation and anti-cytokine autoantibodies. Future therapies should consider adjunct strategies such as thymic regeneration or targeted immune modulation to address the underlying architectural defects in this disorder.", "keywords": ["Humans", "Bone Marrow Transplantation", "Hematopoietic Stem Cell Transplantation", "Lymphoid Tissue", "NF-kappa B", "NF-kappaB-Inducing Kinase", "Protein Serine-Threonine Kinases", "Signal Transduction", "Thymus Gland", "Treatment Outcome"], "year": "2025", "doi": "10.3389/fimmu.2025.1682642"}, {"pmid": "41181713", "title": "Splenic compensation alleviates impaired-development of bone marrow terminal erythroid to attenuate anemia in ATPIF1 knockout mice.", "abstract": "ATPIF1 (ATPase Inhibitory Factor 1) is a critical regulatory factor of mitochondrial ATP synthase, maintaining ATP homeostasis by modulating ATP synthesis and hydrolysis. In this study, we investigated the consequences of ATPIF1 knockout (KO) on terminal erythroid development and mitochondrial metabolic adaptation in mice. ATPIF1-KO mice exhibited significant reductions in peripheral red blood cell (RBC) counts, hemoglobin, and hematocrit. Mechanistic studies identified impaired development of bone marrow (BM) erythroid, accompanied by robust compensatory erythroid development in the spleen. Integrated RNA-seq and metabolomic analyses revealed that ATPIF1 deficiency disrupted cell proliferation and mitochondrial function in oxidative phosphorylation (OXPHOS) and the tricarboxylic acid (TCA) cycle of BM erythroblasts, leading to defective terminal differentiation of erythrocytes. BM-derived erythroid cells showed a reduction in proliferation, mitochondrial mass, and reactive oxygen species (ROS) levels with an increase in apoptosis. Conversely, the spleen displayed extramedullary erythroid development characterized by enhanced proliferation, reduced apoptosis, increased reductive stress, and upregulation of heme-related genes. Heme levels were decreased in the bone marrow, but not in the spleen. These findings establish ATPIF1 as a key regulator of terminal erythroid development and highlight the essential compensatory role of the spleen in maintaining erythropoietic homeostasis under KO-induced mitochondrial dysfunction. Our work provides new insight into the pathophysiology of mitochondrial-related anemias and potential therapeutic targets.", "keywords": [], "year": "2025", "doi": "10.3389/fcell.2025.1675547"}, {"pmid": "40765825", "title": "Ferritinophagy activation states determine the susceptibility to ferroptosis of macrophages in bone marrow and spleen.", "abstract": "Macrophages exhibit heterogeneity due to their presence in different tissues that have distinct cell fates. Ferroptosis is one type of cellular fate, but the sensitivity of different types of macrophages to ferroptosis and the associated molecular mechanisms are not clear. This study explored the ferroptosis sensitivity of bone marrow and splenic macrophage, focusing on the contribution of ferritinophagy. We found that bone marrow M2 macrophages were more susceptible to ferroptosis, which was attributed to their lower solute carrier family 40 member 1 (SLC40A1) and ferritin heavy/light chain (FTH/L) expression and higher labile iron levels compared to those of splenic macrophages. Further, ferritinophagy activation, particularly in M2 macrophages, was identified as the primary cause of increased labile iron levels, as evidenced by experiments using autophagic flux modifiers and RAW264.7 cells with autophagy related 5 (ATG5) and nuclear receptor coactivator 4 (NCOA4) knockdown and NCOA4 knockout. These results provide a new direction for further understanding the heterogeneity and functionality of macrophages, and offers innovative treatments for a variety of health issues in which macrophage regulation plays a critical role.", "keywords": ["Animals", "Ferroptosis", "Macrophages", "Mice", "Spleen", "Autophagy", "Mice, Inbred C57BL", "Nuclear Receptor Coactivators", "Ferritins", "Bone Marrow", "RAW 264.7 Cells", "Iron", "Autophagy-Related Protein 5"], "year": "2025", "doi": "10.7150/ijbs.114545"}, {"pmid": "40420375", "title": "[A Case of Invasive Lobular Carcinoma Complicated by Disseminated Carcinomatosis of the Bone Marrow with Severe Bone Marrow Fibrosis and Acute Splenomegaly].", "abstract": "A 60-year-old female presented at our hospital with a mass in her left breast. Needle biopsy of the breast mass confirmed a diagnosis of invasive lobular carcinoma, and the patient underwent left mastectomy and axillary lymph node dissection. The patient received adjuvant chemotherapy and was started on continuous endocrine therapy. Three years post-surgery, she experienced recurrence of multiple bone metastases and received a combination of hormone therapy and selective cyclin-dependent kinases 4/6 inhibitors. Therapeutic efficacy was poor, allowing bone metastases to spread. Four months post-recurrence, blood tests revealed moderate thrombocytopenia. Despite the switch to chemotherapy, the patient's platelet count did not recover. CT revealed splenomegaly, which was not present three months earlier. Bone marrow biopsy revealed severe myelofibrosis with infiltration of small dysplastic cells into dense fibrotic tissue. The patient developed microangiopathic hemolytic anemia, but DIC was not observed during the course of the disease. Ten months after recurrence, a brain metastasis was detected, and the patient died the following month.", "keywords": ["Humans", "Female", "Middle Aged", "Breast Neoplasms", "Splenomegaly", "Carcinoma, Lobular", "Primary Myelofibrosis", "Fatal Outcome", "Bone Marrow Neoplasms", "Acute Disease", "Neoplasm Invasiveness", "Antineoplastic Combined Chemotherapy Protocols"], "year": "2025", "doi": ""}, {"pmid": "40227986", "title": "Analyzing Ex Vivo Metabolic Flux in Splenic and Cardiac Macrophages and Bone Marrow Monocytes.", "abstract": "Metabolic reprogramming is a hallmark of monocyte/macrophage activation and polarization between pro- and anti-inflammatory states. For example, pro-inflammatory (i.e., M1-like) monocytes/macrophages display more reliance on anaerobic glycolysis and less reliance on mitochondrial oxidative phosphorylation, whereas anti-inflammatory (M2-like) macrophages display more reliance on glucose and fatty acid oxidation in the mitochondria. Here, we describe in-depth protocols for extracting macrophages from the two major monocyte/macrophage reservoirs in the body, the spleen and bone marrow, as well as injured tissues such as the heart following myocardial infarction. Macrophages or monocytes are extracted by immunomagnetic sorting by using antibody-tagged microbeads, which easily bind to cells without compromising their phenotypes. The extracted cells are then cultured in 96-well plates, followed by extracellular flux analysis using a metabolic flux analyzer. Both glycolysis and mitochondrial oxidative phosphorylation can be measured simultaneously in small numbers of cells (as little as 2-3 &#xd7; 10 5 cells). This method can easily be performed in 1 day and produces reliable and repeatable results. Ultimately, these methods help to enhance our understanding of metabolic changes during immune and inflammatory responses to injury and disease, which could lead to the development of novel therapeutic targets for immunometabolic pathways.", "keywords": ["Animals", "Macrophages", "Mice", "Spleen", "Monocytes", "Bone Marrow Cells", "Myocardium", "Glycolysis", "Oxidative Phosphorylation"], "year": "2025", "doi": "10.3791/67824"}, {"pmid": "39273097", "title": "Lack of Hfe and TfR2 in Macrophages Impairs Iron Metabolism in the Spleen and the Bone Marrow.", "abstract": "Iron is a vital element involved in a plethora of metabolic activities. Mammalian systemic iron homeostasis is mainly modulated by hepcidin, the synthesis of which is regulated by a number of proteins, including the hemochromatosis-associated proteins Hfe and Transferrin Receptor 2 (TfR2). Macrophages play versatile functions in iron homeostasis by storing iron derived from the catabolism of erythrocytes and supplying iron required for erythropoiesis. The absence of Hfe in macrophages causes a mild iron deficiency in aged mice and leads to an overproduction of the iron exporter Ferroportin 1 (Fpn1). Conversely, TfR2 gene silencing in macrophages does not influence systemic iron metabolism but decreases transcription of the macrophage Fpn1 in adult mice and modulates their immune response. This study investigated cellular and systemic iron metabolism in adult and aged male mice with macrophage-specific Hfe and TfR2 silencing (double knock-out, DKO). Serum iron parameters were significantly modified in aged animals, and significant differences were found in hepatic hepcidin transcription at both ages. Interestingly, splenic iron content was low in adult DKOs and splenic Fpn1 transcription was significantly increased in DKO animals at both ages, while the protein amount does not reflect the transcriptional trend. Additionally, DKO macrophages were isolated from mice bone marrow (BMDMs) and showed significant variations in the transcription of iron genes and protein amounts in targeted mice compared to controls. Specifically, Tranferrin Receptor 1 (TfR1) increased in DKO adult mice BMDMs, while the opposite is observed in the cells of aged DKO mice. Fpn1 transcript was significantly decreased in the BMDMs of adult DKO mice, while the protein was reduced at both ages. Lastly, a significant increase in Erythropoietin production was evidenced in aged DKO mice. Overall, our study reveals that Hfe and TfR2 in macrophages regulate hepatic Hepc production and affect iron homeostasis in the spleen and BMDMs, leading to an iron deficiency in aged animals that impairs their erythropoiesis.", "keywords": ["Animals", "Receptors, Transferrin", "Spleen", "Iron", "Macrophages", "Mice", "Male", "Hemochromatosis Protein", "Mice, Knockout", "Bone Marrow", "Cation Transport Proteins", "Hepcidins", "Mice, Inbred C57BL", "Homeostasis", "Liver", "Ferroportin"], "year": "2024", "doi": "10.3390/ijms25179142"}, {"pmid": "39195940", "title": "Hyperlipidemia-induced hematopoiesis is repressed by MLKL in endothelial cells of the splenic niche.", "abstract": "Dysregulation of the hematopoietic niche during hyperlipidemia facilitates pathologic leukocyte production, driving atherogenesis. Although definitive hematopoiesis occurs primarily in the bone marrow, during atherosclerosis this also occurs in the spleen. Cells of the bone marrow niche, particularly endothelial cells, have been studied in atherosclerosis, although little is known about how splenic endothelial cells respond to the atherogenic environment. Here we show unique dysregulated pathways in splenic compared to bone marrow endothelial cells during atherosclerosis, including perturbations of lipid metabolism and endocytic trafficking pathways. As part of this response, we identify the mixed lineage kinase domain-like (MLKL) protein as a repressor of splenic, but not bone marrow, myelopoiesis. Silencing MLKL in splenic endothelial cells results in inefficient endosomal trafficking and lipid accumulation, ultimately promoting the production of myeloid cells that participate in plaque development. These studies identify endocytic trafficking by MLKL as a key mechanism of splenic endothelial cell maintenance, splenic hematopoiesis and, subsequently, atherosclerosis.", "keywords": ["Spleen", "Protein Kinases", "Endothelial Cells", "Animals", "Atherosclerosis", "Hyperlipidemias", "Mice, Inbred C57BL", "Disease Models, Animal", "Male", "Myelopoiesis", "Humans", "Cells, Cultured", "Lipid Metabolism", "Mice", "Plaque, Atherosclerotic", "Mice, Knockout, ApoE", "Endocytosis", "Endosomes", "Stem Cell Niche"], "year": "2024", "doi": "10.1038/s44161-024-00470-8"}, {"pmid": "39177943", "title": "Effect of Leishmania infantum infection on B cell lymphopoiesis and memory in the bone marrow and spleen.", "abstract": "Visceral leishmaniasis (VL) is characterized by an uncontrolled infection of internal organs such as the spleen, liver and bone marrow (BM) and can be lethal when left untreated. No effective vaccination is currently available for humans. The importance of B cells in infection and VL protective immunity has been controversial, with both detrimental and protective effects described. VL infection was found in this study to increase not only all analyzed B cell subsets in the spleen but also the B cell progenitors in the BM. The enhanced B lymphopoiesis aligns with the clinical manifestation of polyclonal hypergammaglobulinemia and the occurrence of autoantibodies. In line with earlier reports, flow cytometric and microscopic examination identified parasite attachment to B cells of the BM and spleen without internalization, and transformation of promastigotes into amastigote morphotypes. The interaction appears independent of IgM expression and is associated with an increased detection of activated lysosomes. Furthermore, the extracellularly attached amastigotes could be efficiently transferred to infect macrophages. The observed interaction underscores the potentially crucial role of B cells during VL infection. Additionally, using immunization against a fluorescent heterologous antigen, it was shown that the infection does not impair immune memory, which is reassuring for vaccination campaigns in VL endemic areas.", "keywords": ["Leishmaniasis, Visceral", "Animals", "Spleen", "Leishmania infantum", "Mice", "Bone Marrow", "B-Lymphocytes", "Immunologic Memory", "Lymphopoiesis", "Female", "Mice, Inbred BALB C"], "year": "2024", "doi": "10.1096/fj.202400715R"}, {"pmid": "39043352", "title": "Shenling Baizhu Decoction treats ulcerative colitis of spleen-deficiency and dampness obstruction types by targeting 'gut microbiota and galactose metabolism-bone marrow' axis.", "abstract": "Shenlin Baizhu Decoction (SLBZD), which comes from 'Taiping Huimin Heji Ju Fang', belongs to a classical prescription for treating spleen deficiency and dampness obstruction (SQDDS)-type ulcerative colitis (UC) in traditional Chinese medicine. However, the mechanism of SLBZD in treating UC with SQDDS remains unclear. This study aims to investigate the mechanism of SLBZD against SQDDS-type UC of based on the \"gut microbiota and metabolism - bone marrow\" axis to induce endogenous bone marrow mesenchymal stem cells (BMSCs) homing. Ultra-performance liquid chromatography-mass spectrometry was used to analysis of SLBZD qualitatively. The efficacy of SLBZD in SQDDS-type UC was evaluated based on the following indicators: the body weight, colon length, disease activity index (DAI) score, Haemotoxylin and Eosin (H&amp;E) pathological sections, and intestinal permeability proteins (occluding and ZO-1). 16S rRNA gene sequencing and non-target metabolomics were performed to identify gut microbiota changes and its metabolites in feces, respectively. BMSCs in each group was collected, cultured, and analyzed. Optimal passaged BMSCs were injected by tail vein into UC rats of SQDDS types. BMSCs homing to the colonic mucosal tissue was observed by immunofluorescent. Finally, the repairing effect of BMSCs homing to the colonic mucosal tissue after SLBZD treatment was analyzed by transmission electron microscopy, qRT-PCR, and immunohistochemistry. SLBZD effectively improved the colonic length and the body weight, reduced DAI and H&amp;E scores, and increased the expression of the intestinal permeability proteins, including occluding and ZO-1, to treat SQDDS-type UC. After SLBZD treatment, the &#x3b1;-diversity and &#x3b2;-diversity of the gut microbiota were improved. The differential microbiota was screened as Aeromonadaceae, Lactobacillaceae, and Clostridiaceae at the family level, and Aeromonas, Lactobacillus, Clostridium_sensu_stricto_1&#xa0;at the genus level. Meanwhile, the main metabolic pathway was the galactose metabolism pathway. SLBZD treatment timely corrected the aberrant levels of &#x3b2;-galactose in peripheral blood and bone marrow, senescence-associate-&#x3b2;-galactosidase in BMSCs, and galactose kinase-2, galactose mutase, and galactosidase beta-1 in peripheral blood to further elevate the expression levels of senescence-associated (SA) proteins (p16, p53, p21, and p27) in BMSCs. The Spearman's correlation analysis demonstrated the relationship between microbiota and metabolism, and the relationship between the galactose metabolism pathway and SA proteins. After BMSCs in each group injection via the tail vein, the pharmacodynamic effects were consistent with those of SLBZD in SQDDS-type UC rats. Furthermore, BMSCs have been homing to colonic mucosal tissue. BMSCs from the SLBZD treatment group had stronger restorative effects on intestinal permeability function due to increasing protein and mRNA expressions of occludin and ZO-1, and decreasing the proteins and mRNA expressions of SDF-1 and CXCR4 in colon. SLBZD alleviated the damaged structure of gut microbiota and regulated their metabolism, specifically the galactose metabolism, to treat UC of SDDOS types. SLBZD treatment promotes endogenous BMSCs homing to colonic mucosal tissue to repaire the intestinal permeability. The current exploration revealed an underlying mechanism wherein SLBZD activates endogenous BMSCs by targeting 'the gut microbiota and its metabolism-bone marrow' axis and repairs colonic mucosal damage to treat SDDOS-type UC.", "keywords": ["Animals", "Gastrointestinal Microbiome", "Colitis, Ulcerative", "Drugs, Chinese Herbal", "Male", "Rats", "Mesenchymal Stem Cells", "Galactose", "Rats, Sprague-Dawley", "Zonula Occludens-1 Protein", "Colon", "Occludin", "Bone Marrow", "Spleen", "Disease Models, Animal"], "year": "2024", "doi": "10.1016/j.jep.2024.118599"}], "pubmed_
