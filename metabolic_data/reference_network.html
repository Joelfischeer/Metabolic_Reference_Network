and lipid peroxidation, Nitric oxide, tumor necrosis factor-&#x3b1;, interleukin-1&#x3b2;, and caspase-3 in both tissues. Conversely, treatment with myricetin significantly restored the serum levels of ACTH and corticosterone, enhanced the antioxidant enzyme activities, reduced the oxidative-inflammatory and apoptotic markers in both tissues, and increased the hypothalamic AChE activity of the treated animals. Myricetin also reversed the histological abnormalities that atrazine elicited in the treated animals. Overall, MYR, through its antioxidant, anti-inflammatory, and anti-apoptotic properties, attenuated the ATZ-induced disruption of the HPA axis of rats.", "keywords": ["Animals", "Atrazine", "Flavonoids", "Hypothalamo-Hypophyseal System", "Male", "Pituitary-Adrenal System", "Rats, Wistar", "Antioxidants", "Apoptosis", "Rats", "Anti-Inflammatory Agents", "Oxidative Stress"], "year": "2026", "doi": "10.1080/08923973.2026.2662624"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"brain\"[Title] OR \"cerebral\"[Title] OR \"hypothalamus\"[Title] OR \"hypothalamic\"[Title] OR \"central nervous system\"[Title] OR \"CNS\"[Title] OR \"neuronal\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__Kidney", "source": "Adrenal Glands", "target": "Kidney", "color": "#64748b", "description": "Type: Hormonal Connection\nKey Players: Glucagon, cortisol, insulin, aldosterone\nNotes: - Adrenal glands sits anatomically next to kidney.\n- Renal function is regulated in multiple ways by the adrenal cortex.\n- Glucagon release by the pancreas is increased by cortisol, leading to gluconeogenesis in the liver and kidney.\n- Cortisol lowers insulin secretion by pancreas. As insulin inhibits gluconeogenesis in the kidney, more gluconeogenesis is done.\nSources:\n- https://doi.org/10.1038/ki.1974.113\n- doi: 10.1093/ckj/sfad046", "connection_type": "Hormonal Connection", "key_players": ["Glucagon", "cortisol", "insulin", "aldosterone"], "key_players_metabolites": ["glucose", "creatinine", "cholesterol", "urea", "succinate", "fatty acids", "propionate", "amp", "prostaglandin", "triglyceride", "nadph", "fatty acid", "uric acid", "glucose-6-phosphate", "glycine", "atp", "bile acids", "hdl", "amino acids", "arginine", "amino acid", "lipoprotein", "acetate", "nadh", "alanine"], "key_players_hormones": ["cortisol", "acth", "aldosterone", "crh", "corticosterone", "glucocorticoid", "renin", "angiotensin", "vitamin d", "mineralocorticoid", "testosterone", "insulin", "anp", "angiotensin ii", "vasopressin", "progesterone", "tnf", "natriuretic peptide", "thyroxine", "estradiol", "il-4", "adh", "estrogen", "il-10", "fsh", "adrenaline", "tumor necrosis factor", "epinephrine", "lh", "prolactin", "somatostatin"], "key_players_proteins": ["cox-2", "acc"], "key_players_counts_metabolites": {"cholesterol": 6, "glycine": 1, "propionate": 3, "amp": 3, "atp": 1, "bile acids": 1, "hdl": 1, "amino acids": 1, "glucose": 22, "fatty acid": 2, "prostaglandin": 3, "arginine": 1, "amino acid": 1, "creatinine": 7, "lipoprotein": 1, "acetate": 1, "uric acid": 2, "urea": 6, "triglyceride": 3, "fatty acids": 5, "succinate": 6, "nadh": 1, "glucose-6-phosphate": 2, "nadph": 3, "alanine": 1}, "key_players_counts_hormones": {"progesterone": 2, "tnf": 2, "testosterone": 6, "natriuretic peptide": 2, "glucocorticoid": 17, "thyroxine": 2, "crh": 28, "aldosterone": 47, "acth": 63, "mineralocorticoid": 7, "angiotensin ii": 4, "il-4": 1, "cortisol": 68, "adh": 1, "renin": 16, "estrogen": 1, "insulin": 5, "vitamin d": 11, "il-10": 1, "fsh": 1, "adrenaline": 1, "tumor necrosis factor": 1, "epinephrine": 1, "lh": 1, "vasopressin": 4, "corticosterone": 22, "estradiol": 2, "prolactin": 1, "somatostatin": 1, "anp": 5, "angiotensin": 16}, "key_players_counts_proteins": {"cox-2": 9, "acc": 7}, "notes": "- Adrenal glands sits anatomically next to kidney.\n- Renal function is regulated in multiple ways by the adrenal cortex.\n- Glucagon release by the pancreas is increased by cortisol, leading to gluconeogenesis in the liver and kidney.\n- Cortisol lowers insulin secretion by pancreas. As insulin inhibits gluconeogenesis in the kidney, more gluconeogenesis is done.", "sources": ["https://doi.org/10.1038/ki.1974.113", "doi: 10.1093/ckj/sfad046"], "ai_description": "The adrenal glands and kidneys communicate through a complex axis involving cortisol, aldosterone, and renin-angiotensin system (RAS) activation [1]. Cortisol produced by the adrenal glands stimulates the release of renin from the kidneys, which in turn activates the RAS, leading to increased blood pressure [2]. In contrast, low levels of vitamin D have been linked to impaired adrenal function and kidney disease, suggesting a potential role for vitamin D in regulating this axis [1]. The hypothalamic-pituitary-adrenal (HPA) axis also plays a crucial role in modulating the relationship between the adrenal glands and kidneys, with glucocorticoid therapy affecting HPA axis activity in kidney transplant recipients [4].", "pubmed_n": 98, "pubmed_papers": [{"pmid": "42317869", "title": "Association between vitamin D deficiency and adrenal gland, kidney function, indicators related to cardiovascular function in hypertensive patients.", "abstract": "Previous research has established an association between vitamin D deficiency and various non-skeletal metabolic disorders. However, the potential association between vitamin D status and specific clinical manifestations including renal dysfunction, primary aldosteronism (PA), and cardiovascular function-related indicators in patients with hypertension remains poorly elucidated. A total of 250 consecutive patients with hypertension who were hospitalized in the Senior Cardiology Department of the Sixth Medical Center of the Chinese PLA General Hospital were enrolled in this study. Volunteers currently supplementing with vitamin D have been excluded. Fasting peripheral venous blood samples were collected from all participants for routine biochemical assays. All participants underwent a comprehensive set of examinations, including transthoracic echocardiography, ambulatory blood pressure monitoring, and routine urinalysis. Serum levels of 25-hydroxyvitamin D (25-OH-D) were measured to evaluate vitamin D status. Relevant clinical and physiological indicators were recorded. Differences in auxiliary examination results and physiological indicators between subgroups were compared and analyzed. The correlations of serum 25-OH-D levels with renal function parameters, cardiovascular function-related indicators, and PA status were further investigated. Of all participants, 165 patients had vitamin D deficiency (serum 25-OH-D&#x202f;&lt;&#x202f;50&#x202f;nmol/L), whereas 85 patients had non-deficient vitamin D status (serum 25-OH-D&#x202f;&#x2265;&#x202f;50&#x202f;nmol/L). There were no statistically significant differences in age, gender, and body mass index (BMI) between the two groups. Compared with the non-deficient group, patients in the vitamin D deficiency group (25-OH-D&#x202f;&lt;&#x202f;50&#x202f;nmol/L) had significantly lower levels of hematocrit, red blood cell count, hemoglobin, serum calcium, urinary uric acid, and urinary creatinine, as well as significantly higher levels of serum sodium, supine aldosterone concentration, supine aldosterone-to-renin ratio (ARR), and upright aldosterone concentration (all p &#x202f;&lt;&#x202f;0.05). Binary logistic regression analysis revealed that PA was significantly associated with vitamin D deficiency ( OR 0.210, 95% CI 0.045-0.974, p &#x202f;=&#x202f;0.046). Multivariate linear regression analysis demonstrated that serum 25-OH-D levels were independently and inversely associated with estimated glomerular filtration rate (eGFR) ( &#x3b2; &#x202f;=&#x202f;-4.348, t &#x202f;=&#x202f;-3.082, p &#x202f;=&#x202f;0.002). Patients with chronic kidney disease (CKD) had a significantly larger left atrial anteroposterior diameter [39(36,42) vs. 36(32,39) mm, p &#x202f;=&#x202f;0.001] and pulmonary artery diameter [24(22,26) vs. 23(21,25) mm, p &#x202f;=&#x202f;0.010], along with a higher 24-h mean systolic blood pressure (131&#x202f;&#xb1;&#x202f;11 vs. 127&#x202f;&#xb1;&#x202f;11&#x202f;mmHg, p &#x202f;=&#x202f;0.042), but a lower 24-h mean diastolic blood pressure (73&#x202f;&#xb1;&#x202f;10 vs. 77&#x202f;&#xb1;&#x202f;9&#x202f;mmHg, p &#x202f;=&#x202f;0.042), compared with those without renal dysfunction. After adjustment for traditional cardiovascular risk factors, PA remained independently associated with vitamin D deficiency in patients with hypertension. Vitamin D and retinol-binding protein were significantly associated with renal dysfunction in this patient population.", "keywords": [], "year": "2026", "doi": "10.3389/fnut.2026.1741253"}, {"pmid": "41085519", "title": "Simultaneous adrenal gland and pancreas-kidney transplantation and associated hormonal challenges.", "abstract": "Adrenal gland transplantation has only been performed in rare cases, with variable results in terms of functional activity. Consequently, there is a lack of evidence in endocrine management and tapering hormone replacement therapy after such transplantations. We report on a simultaneous pancreas-kidney and adrenal gland allotransplantation in a 48-year-old female patient with type 1 diabetes and severe autoimmune adrenal insufficiency. Surgery was uneventful, without major surgical morbidity. Pancreas and kidney graft function were excellent from the beginning. Adrenal graft function was difficult to assess and steroid tapering was not well tolerated and hampered clinical recovery. Despite the evidence of adequate graft perfusion and initially even measurable levels of cortisol production, persistent adrenal graft function was not obtained, and the patient remained on hormone replacement therapy. Simultaneous pancreas-kidney and adrenal gland transplantation is technically safe, without the need for major surgical modifications or adjustments in immunosuppression. However, it should only be performed in combination with a kidney or pancreas-kidney transplant, which justifies the lifelong immunosuppression. The major challenge remains the postoperative endocrine management, with steroid tapering and adequate assessment of adrenal graft function. Patients should be followed by an interdisciplinary team involving endocrinologists, nephrologists and transplant surgeons.", "keywords": ["Humans", "Kidney Transplantation", "Female", "Pancreas Transplantation", "Middle Aged", "Adrenal Glands", "Diabetes Mellitus, Type 1", "Adrenal Insufficiency", "Hydrocortisone"], "year": "2025", "doi": "10.57187/s.4382"}, {"pmid": "40412070", "title": "Bridging the gap-Rethinking the role of the adrenal gland in chronic kidney disease from the feline perspective.", "abstract": "Chronic kidney disease (CKD) is the most common metabolic disease in domestic cats. Unlike humans and dogs, CKD in cats seems to have a highly complex and multifactorial etiology. Despite great effort being poured into research trying to elucidate possible pathways for the pathogenesis of CKD, there is still a lack of understanding regarding its initiating and progression factors. There is also a lack of therapeutic options for these patients, with most treatment plans relying on a low-phosphate diet, dietary protein modification and medical management of complications (e.g. hypertension) as they arise. In this review, we propose the hypothalamic-pituitary-adrenal (HPA) axis plays a central role in the development, pathophysiology and progression of feline chronic kidney disease. The adrenal glands and the hormones they secrete, in particular, may act as lynchpins in chronic kidney disease, mediating virtually every aspect of the disease: from the establishment of fibrosis and kidney damage to the development of hypertension and a pro-inflammatory status. By compiling the available research regarding the influence of adrenal hormones and the HPA axis, we hope to highlight possible future areas of scientific interest regarding feline CKD as well as possible aspects in which the cat may act as a model for research in human medicine.", "keywords": ["Cats", "Animals", "Cat Diseases", "Renal Insufficiency, Chronic", "Adrenal Glands", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System"], "year": "2025", "doi": "10.1016/j.domaniend.2025.106955"}, {"pmid": "39597857", "title": "Hypothalamic-Pituitary-Adrenal Axis Activity and Metabolic Disorders in Kidney Transplant Recipients on Long-Term Glucocorticoid Therapy.", "abstract": "Background/Objectives: Glucocorticoids are commonly used for maintenance immunosuppressive therapy in kidney transplant recipients (KTRs). We aimed to investigate the prevalence of hypothalamic-pituitary-adrenal (HPA) axis suppression and its association with metabolic disorders in stable KTRs on low-dose glucocorticoids. Methods : This cross-sectional study included adult KTRs on low-dose glucocorticoids. HPA axis suppression was defined as baseline morning cortisol &lt; 5 &#x3bc;g/dL. Adrenocorticotropic hormone (ACTH), dehydroepiandrosterone-sulphate (DHEAS) and 24 h urinary free cortisol (UFC) levels were also assessed. Examined metabolic disorders included hypertension, dyslipidemia, central obesity and post-transplant diabetes mellitus (PTDM). Results : Eighty adult KTRs with a median 57 months (IQR 24-102) since transplantation were included in the study. The mean prednisolone dose was 5.0 &#xb1; 1.3 mg/day. Baseline cortisol &lt; 5.0 &#x3bc;g/dL was observed in 27.5% of the KTRs. Participants with baseline cortisol &lt; 5.0 &#x3bc;g/dL were older (55.1 vs. 47.4 years, p = 0.023) and had had a transplant for a longer time (101.4 vs. 67.0 months, p = 0.043), compared with the rest of the cohort. Baseline cortisol correlated positively with ACTH (rho = 0.544, p &lt; 0.001), DHEAS (rho:0.459, p &lt; 0.001) and UFC (rho: 0.377, p = 0.002). The area under the receiver-operating characteristic curve for ACTH as a predictor of baseline cortisol &gt; 5.0 &#x3bc;g/dL was 0.79 [95% confidence interval (CI): 0.68-0.89]. After adjustment for covariates, HPA axis suppression was not associated with the examined metabolic disorders. Conclusions : Our study showed that stable KTRs on chronic low-dose glucocorticoids exhibited an increased prevalence of HPA axis suppression. ACTH may serve as a surrogate biomarker for HPA axis activity in this population. Further research could evaluate the association of glucocorticoid-induced HPA axis inhibition with metabolic disorders.", "keywords": [], "year": "2024", "doi": "10.3390/jcm13226712"}, {"pmid": "39397979", "title": "Regulation of 11&#x3b2;-HSD1 reductase and the HPA axis by long-snake moxibustion in kidney-yang deficiency rats.", "abstract": "Long-snake moxibustion can improve hypothalamic-pituitary-adrenal (HPA) axis function in patients with kidney-yang deficiency (KYDS). 11&#x3b2;-HSD1 controls the HPA axis by boosting CORT production via reductase activity. However, the interaction and mechanism of long snake moxibustion and 11&#x3b2;-HSD1 remain unknown. This study examined the impact of lengthy snake moxibustion on the hypothalamus-pituitary-adrenal axis in KYDS rats. The potential significance of 11&#x3b2;-HSD1 in this process was explored. Rats were randomly divided into two groups: the blank group and the experimental group. The KYDS model was established with an intramuscular injection of hydrocortisone. Rats were randomly assigned to four groups: model, sham intervention, long snake moxibustion, and long snake moxibustion plus 11&#x3b2;-HSD1 inhibitor. Physical indicators included body weight, toe temperature, rectal temperature, and spontaneous movement. The serum levels of corticotropin-releasing hormone (CRH), adrenocorticotropic hormone (ACTH), and CORT were measured. Immunohistochemical examination reveals 11&#x3b2;-HSD1 protein expression in the liver. Western blotting (WB) detected the levels of 11&#x3b2;-HSD1, H6PDH and NADPH/NADP&#xa0;+&#xa0;protein in the liver. The experimental rats' body weight, toe temperature, rectal temperature, time and frequency of spontaneous activity all dropped, as did their serum ACTH, CORT, and CRH levels. The protein expressions of 11&#x3b2;-HSD1, H6PDH, and NADPH/NADP+ in the liver decreased significantly. Long-snake moxibustion improved HPA axis function in rats, boosting expression of 11&#x3b2;-HSD1, H6PDH, and NADPH/NADP+. Adding an 11&#x3b2;-HSD1 inhibitor to Long-snake moxibustion decreased its effect on the HPA axis. Long-snake moxibustion improves KYDS symptoms in rats by increasing 11&#x3b2;-HSD1 expression and reductase activity, which regulates the HPA axis.", "keywords": [], "year": "2024", "doi": "10.1016/j.heliyon.2024.e38486"}, {"pmid": "37628918", "title": "Renal Glucose Release after Unilateral Renal Denervation during a Hypoglycemic Clamp in Pigs with an Altered Hypothalamic Pituitary Adrenal Axis after Late-Gestational Dexamethasone Injection.", "abstract": "Previously, we demonstrated in pigs that renal denervation halves glucose release during hypoglycaemia and that a prenatal dexamethasone injection caused increased ACTH and cortisol concentrations as markers of a heightened hypothalamic pituitary adrenal axis (HPAA) during hypoglycaemia. In this study, we investigated the influence of an altered HPAA on renal glucose release during hypoglycaemia. Pigs whose mothers had received two late-gestational dexamethasone injections were subjected to a 75 min hyperinsulinaemic-hypoglycaemic clamp (&lt;3 mmol/L) after unilateral surgical denervation. Para-aminohippurate (PAH) clearance, inulin, sodium excretion and arterio-venous blood glucose difference were measured every fifteen minutes. The statistical analysis was performed with a Wilcoxon signed-rank test. PAH, inulin, the calculated glomerular filtration rate and plasma flow did not change through renal denervation. Urinary sodium excretion increased significantly ( p = 0.019). Side-dependent renal net glucose release (SGN) decreased by 25 &#xb1; 23% ( p = 0.004). At 25 percent, the SGN decrease was only half of that observed in non-HPAA-altered animals in our prior investigation. The current findings may suggest that specimens with an elevated HPAA undergo long-term adaptations to maintain glucose homeostasis. Nonetheless, the decrease in SGN warrants further investigations and potentially caution in performing renal denervation in certain patient groups, such as diabetics at risk of hypoglycaemia.", "keywords": ["Female", "Animals", "Swine", "Pregnancy", "Hypoglycemic Agents", "Glucose", "Hypothalamo-Hypophyseal System", "Inulin", "Pituitary-Adrenal System", "Hypoglycemia", "p-Aminohippuric Acid", "Dexamethasone", "Denervation"], "year": "2023", "doi": "10.3390/ijms241612738"}, {"pmid": "36640002", "title": "Efficacy of suspended moxibustion stimulating Shenshu (BL23) and Guanyuan (CV4) on the amygdala-HPA axis in rats with kidney-deficiency symptom pattern induced by hydrocortisone.", "abstract": "To investigated the effects of suspended moxibustion stimulating Shenshu (BL23) and Guanyuan (CV4) acupoints on the amygdala and HPA axis in our rat model and elucidated the possible molecular mechanisms of moxibustion on kidney- deficiency symptom pattern (KYDS). Sixty male Sprague Dawley rats were randomly divided into a control group ( 12) and an experimental group ( 48). Rats in the experimental group were given intramuscular injections of hydrocortisone to establish a KYDS model. The 48 rats successfully modeled were then randomly divided into a model group (model, 12), a carbenoxolone intraperitoneal injection group (CBX, 12), a moxibustion group (moxi, 12), and a moxi + CBX group ( 12). In the moxi, the Shenshu (BL23) and Guanyuan (CV 4) acupoints were treated with moxibustion for 14 d. After treatment, measures were taken of serum levels of corticosterone (CORT), adrenocorticotropic hormone (ACTH), and corticotropin-releasing hormone (CRH). The expression of mineralocorticoid receptors (MRs), glucocorticoid receptors (GRs), 11beta-hydroxysteroid dehydrogenase type 1 (11&#x3b2;-HSD1), CRH, and ACTH in the rats' amygdala, hypothalamus, or pituitary (as appropriate) was detected. Data were analyzed using one-way analysis of variance. Compared with those of the control group, the serum levels of CRH, ACTH, and CORT; the mRNA and protein expressions of MR, GR, and 11&#x3b2;-HSD1 in the amygdala; the mRNA and protein expressions of 11&#x3b2;-HSD1 in the hypothalamus; the CRH mRNA expression in the amygdala and hypothalamus; and the ACTH mRNA expression in the pituitary of the rats in the model group were all significantly decreased (0.05 or 0.01). After treatment with moxibustion, all the aforementioned observation indices except for 11&#x3b2;-HSD1 mRNA expression were ameliorated compared with those in the model group (0.05 or 0.01). Suspended moxibustion can effectively improve the serum levels of ACTH, CRH, and CORT and can up-regulate the mRNA and protein expressions of MR, GR, 11&#x3b2;-HSD1, CRH, and ACTH in the amygdala and hypothalamus of KYDS rats. This may be one of the molecular mechanisms with which moxibustion alleviates KYDS.", "keywords": ["Rats", "Male", "Animals", "Hydrocortisone", "Hypothalamo-Hypophyseal System", "Rats, Sprague-Dawley", "11-beta-Hydroxysteroid Dehydrogenase Type 1", "Moxibustion", "Pituitary-Adrenal System", "Corticotropin-Releasing Hormone", "Adrenocorticotropic Hormone", "Corticosterone", "Amygdala", "RNA, Messenger", "Kidney"], "year": "2023", "doi": "10.19852/j.cnki.jtcm.2023.01.010"}, {"pmid": "36010286", "title": "ACTH-Independent Cushing's Syndrome Caused by an Ectopic Adrenocortical Adenoma in the Renal Hilum.", "abstract": "We report a rare case of Cushing's syndrome induced by an ectopic adrenocortical adenoma. A 57-year-old woman was diagnosed with adrenocorticotropic hormone (ACTH)-independent Cushing's syndrome based on clinical manifestation and laboratory information. She was found to have a mass in the left renal hilum via contrast-enhanced computed tomography (CT). The mass was negative, as seen in somatostatin receptor imaging with 99m Tc-hydrazinonicotinyl-Tyr3-octreotide (HYNIC-TOC), and showed mild fluorodeoxyglucose (FDG) activity via positron emission tomography (PET)/CT. The results of adrenal venous sampling suggested a left-side adrenal origin of hypercortisolism, possibly secreted by the mass in the renal hilum. Histopathology after surgical resection of the mass confirmed an ectopic adrenocortical adenoma, which was responsible for the patient's Cushing's syndrome. During the 8-month follow-up after surgery, no recurrence of Cushing's syndrome was found.", "keywords": [], "year": "2022", "doi": "10.3390/diagnostics12081937"}, {"pmid": "35453788", "title": "RNA-seq and Mitochondrial DNA Analysis of Adrenal Gland Metastatic Tissue in a Patient with Renal Cell Carcinoma.", "abstract": "This study aimed to clarify whether genetic mutations participate in renal cell carcinoma (RCC) metastasis to the adrenal gland (AG). Our study analyzed whole mitochondrial gene and ribonucleic acid sequencing (RNA-seq) data from a male patient in his 60s with metastatic RCC. We confirmed common mutation sites in the mitochondrial gene and carried out Kyoto Encyclopedia of Genes and Genomes (KEGG) analysis using RNA-seq data for RCC and adrenal carcinoma. Furthermore, we confirmed the common mutation sites of mitochondrial genes in which the T3394Y (p.H30Y) site transitioned from histidine (His.; H) to tyrosine (Tyr.; Y) in the NADH dehydrogenase subunit 1 ( ND1 ) gene. The R11,807G (p.T350A) site transitioned from threonine (Thr.; T) to alanine (Ala.; A). Additionally, the G15,438R or A (p.G231D) site transitioned from glycine (Gly.; G) to aspartic acid (Asp.; D) in cytochrome b (CYTB). Furthermore, pathway analysis, using RNA-seq, confirmed the common mutant pathway between RCC and adrenal carcinoma as cytokine-cytokine receptor (CCR) interaction. Confirmation of the original mutation sites suggests that transfer to AG may be related to the CCR interaction. Thus, during metastasis to the AG, mitochondria DNA mutation may represent the initial origin of the metastasis, followed by the likely mutation of the nuclear genes.", "keywords": [], "year": "2022", "doi": "10.3390/biology11040589"}, {"pmid": "34987692", "title": "Ectopic adrenocortical adenoma in the renal hilum mimicking a renal cell carcinoma.", "abstract": "Ectopic adrenocortical tissue can arise along the path of embryonic migration, such as the celiac axis, broad ligament, adnexa of the testis, and spermatic cord. Occasionally, ectopic adrenocortical tissues undergo marked hyperplasia and develop into ectopic adrenocortical adenomas. This report describes the case of a 60-year-old man who was incidentally found to have a lipid-containing mass with early enhancement and delayed washout in the right renal hilum. A renal cell carcinoma was suspected, and robot-assisted partial nephrectomy was performed, but the final diagnosis was an ectopic adrenocortical adenoma. We should include ectopic adrenocortical adenoma in the differential diagnosis when we find a lipid-containing tumor adjacent to the kidney.", "keywords": [], "year": "2022", "doi": "10.1016/j.radcr.2021.10.038"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"kidney\"[Title] OR \"renal\"[Title] OR \"nephron\"[Title] OR \"glomerular\"[Title] OR \"tubular\"[Title] OR \"nephrology\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__Liver", "source": "Adrenal Glands", "target": "Liver", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: Cortisol, insulin, glucagon\nNotes: \n- Cortisol lowers insulin production in the pancreas which will in turn lower insulin abundance and lead to less glucose uptake in Muscle. For this reason glucose might get taken up by the liver. \n- Glucagon release by the pancreas is increased by cortisol, leading to gluconeogenesis in the liver and kidney.\nSources:\n- DOI: 10.5772/intechopen.1003161", "connection_type": "Hormonal connection", "key_players": ["Cortisol", "insulin", "glucagon"], "key_players_metabolites": ["glucose", "cholesterol", "glycogen", "amp", "lipoprotein", "hdl", "nadph", "bile acids", "alanine", "amino acid", "amino acids", "fatty acids", "methionine", "atp", "glutamate", "triglycerides", "acetate", "glucose-6-phosphate", "phosphoenolpyruvate", "cholic acid", "isoleucine", "leucine", "ldl", "lactate", "cysteine", "triglyceride", "phospholipid", "serine"], "key_players_hormones": ["corticosterone", "cortisol", "insulin", "acth", "glucocorticoid", "epinephrine", "crh", "t3", "tnf", "testosterone", "growth hormone", "glucagon", "tnf-alpha", "thyroxine", "norepinephrine", "thyroid hormones", "prolactin", "estradiol", "thyroid hormone", "aldosterone", "tumor necrosis factor", "triiodothyronine", "cck", "noradrenaline", "vitamin d", "fsh", "lh", "ghrelin", "thyrotropin", "somatostatin"], "key_players_proteins": ["acc", "lxr", "pepck", "glucokinase", "akt", "cd36", "mtor", "cpt2"], "key_players_counts_metabolites": {"methionine": 2, "cholesterol": 35, "amp": 11, "glycogen": 35, "phosphoenolpyruvate": 1, "atp": 2, "cholic acid": 1, "bile acids": 5, "hdl": 8, "amino acids": 3, "glucose": 44, "isoleucine": 1, "glutamate": 2, "leucine": 1, "ldl": 1, "lactate": 1, "cysteine": 1, "amino acid": 4, "lipoprotein": 11, "triglycerides": 2, "acetate": 2, "triglyceride": 1, "fatty acids": 3, "phospholipid": 1, "glucose-6-phosphate": 2, "nadph": 7, "serine": 1, "alanine": 5}, "key_players_counts_hormones": {"thyroid hormone": 2, "tnf": 7, "cck": 1, "testosterone": 7, "glucocorticoid": 14, "thyroxine": 4, "crh": 8, "aldosterone": 2, "glucagon": 6, "acth": 22, "norepinephrine": 4, "cortisol": 30, "tnf-alpha": 5, "growth hormone": 7, "thyroid hormones": 4, "noradrenaline": 1, "insulin": 24, "t3": 8, "vitamin d": 1, "fsh": 1, "tumor necrosis factor": 2, "triiodothyronine": 2, "epinephrine": 9, "lh": 1, "corticosterone": 36, "ghrelin": 1, "estradiol": 3, "thyrotropin": 1, "prolactin": 4, "somatostatin": 1}, "key_players_counts_proteins": {"pepck": 1, "glucokinase": 1, "akt": 1, "cd36": 1, "acc": 9, "mtor": 1, "lxr": 9, "cpt2": 1}, "notes": "- Cortisol lowers insulin production in the pancreas which will in turn lower insulin abundance and lead to less glucose uptake in Muscle. For this reason glucose might get taken up by the liver. \n- Glucagon release by the pancreas is increased by cortisol, leading to gluconeogenesis in the liver and kidney.", "sources": ["DOI: 10.5772/intechopen.1003161"], "ai_description": "The adrenal glands and liver are interconnected via a complex axis involving key signalling molecules such as ghrelin and corticotropin-releasing hormone (CRH). The activation of the hypothalamic-pituitary-adrenal (HPA) axis by CRH from the liver triggers the release of cortisol from the adrenal glands, which in turn affects metabolic processes [1,3]. Chronic stress can exacerbate hepatic steatosis and activate the HPA axis, leading to increased glucocorticoid production and contributing to metabolic disorders [2,3]. The interplay between these organs is crucial for maintaining homeostasis and responding to physiological and pathological stimuli.", "pubmed_n": 123, "pubmed_papers": [{"pmid": "41747667", "title": "Central liver-expressed antimicrobial peptide 2 induces anxiety- and depression-related behaviors and activates the hypothalamic-pituitary-adrenal axis in male mice.", "abstract": "The ghrelinergic system is a key regulator of feeding and metabolism. Beyond this, the ghrelinergic system has been implicated for reward, anxiety and depression. In this regard, the effects of the endogenous ghrelin receptor inverse agonist liver-expressed antimicrobial peptide (LEAP) 2 on mental health parameters are unknown. In the present study, the aim was to delineate LEAP2's central effects on anxiety- and depressive-like behaviors in mice, as well as downstream central monoaminergic signaling and HPA-axis activation. Acute intracerebroventricular administration was used to evaluate the effect of central LEAP2. The anxiogenic and depressive-like effects were measured through open-field test, elevated plus maze and forced swim test. Corticosterone and monoamine levels were measured in ex vivo blood and brain tissues, respectively. Acute central administration of LEAP2 increased anxiety-like behavior in both open-field test and elevated plus maze, and increased immobility time in forced swim test, compared to vehicle. Further, LEAP2 administration was associated with a marked increase in blood corticosterone, elevated dopamine in the bed nucleus of the stria terminalis and a trend to increased serotonin in the nucleus accumbens, ventral tegmental area and hypothalamus. These results highlight the influence of the ghrelinergic system on central signaling and mental health, in particular where LEAP2 is elevated or dysregulated, for example in obesity and anorexia nervosa which are often associated with anxiety and depression. Here, LEAP2 emerges as a potential target to treat depression and anxiety in eating disorders.", "keywords": ["Animals", "Male", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System", "Anxiety", "Depression", "Mice", "Corticosterone", "Behavior, Animal", "Antimicrobial Peptides", "Antimicrobial Cationic Peptides"], "year": "2026", "doi": "10.1016/j.yhbeh.2026.105905"}, {"pmid": "41533055", "title": "Acute Stress Attenuates Hepatic Ischemia-Reperfusion Injury via Hypothalamic CRH Neuron-Induced HPA Axis Activation.", "abstract": "Hepatic ischemia-reperfusion injury (HIRI) is a pathologic process commonly encountered during liver surgery, which seriously threatens patient prognosis. Currently, effective interventions or preventive measures are still lacking. Notably, patients with liver disease commonly experience brief acute stress prior to surgery; however, the impact of acute stress on HIRI remains unclear. A 30-min restraint stress was used to simulate acute restraint stress (ARS). Hematoxylin-eosin staining and ELISA were employed to assess HIRI. Immunofluorescence staining and electrophysiology were applied to evaluate neuronal activation. Chemogenetic manipulation was utilized to verify the role of corticotropin-releasing hormone (CRH) neurons in the hypothalamic paraventricular nucleus (PVN) in ARS-mediated attenuation of HIRI. The results showed that ARS significantly ameliorated liver injury, reduced the liver enzyme levels (ALT and AST), and down-regulated the inflammatory factors expression in HIRI mice. Furthermore, we found that ARS alleviated HIRI by activating the hypothalamic-pituitary-adrenal (HPA) axis to release corticosterone, rather than through the sympathetic nervous system. PVN CRH represented a critical subpopulation responding to ARS. Chemogenetic activation of PVN CRH neurons mimicked the protective effect of ARS against HIRI, whereas chemogenetic inhibition of these neurons abolished this protection. Our findings demonstrate that PVN CRH neurons mediate the protective effect of ARS against HIRI by activating the HPA axis to release corticosterone. This work may provide key insights for developing perioperative strategies to prevent HIRI.", "keywords": ["Animals", "Reperfusion Injury", "Male", "Hypothalamo-Hypophyseal System", "Neurons", "Corticotropin-Releasing Hormone", "Pituitary-Adrenal System", "Mice", "Paraventricular Hypothalamic Nucleus", "Liver", "Mice, Inbred C57BL", "Stress, Psychological", "Restraint, Physical", "Corticosterone"], "year": "2026", "doi": "10.1002/cns.70749"}, {"pmid": "38936893", "title": "Depression Exacerbates Hepatic Steatosis in C57BL/6J Mice by Activating the Hypothalamic-Pituitary-Adrenal Axis.", "abstract": "Depression is associated with metabolic disorders, including non-alcoholic fatty liver disease (NAFLD). However, the mechanisms underlying the interaction between them are still poorly known. In this study, mice on a choline deficiency, L-amino acid-defined, high-fat diet (CDAHFD) developing steatosis were challenged with chronic restraint stress (CRS), a protocol widely used to induce depression. The development of depression and steatosis was evaluated using histopathology analysis, ELISA, q-PCR and Western Blot. The contribution of the activated HPA axis to hepatic steatosis progress was fully established, which was validated using a hepatocyte model. Histopathological and biochemical analysis indicated that steatosis was exacerbated by CRS challenge, and behavioral tests indicated that the mice developed depression. Among the screened endocrinal pathways, the hypothalamic-pituitary-adrenal (HPA) axis was significantly activated and the synergistic effect of CDAHFD and CRS in activating the HPA axis was observed. In the hypothalamus, expression of corticotropin-releasing hormone (CRH) was increased by 86% and the protein levels of hypothalamic CRH were upregulated by 25% to 33% by CRS treatment. Plasma CRH levels were elevated by 45-56% and plasma adrenocorticotropic hormone (ACTH) levels were elevated by 29-58% by CRS treatment. In the liver, target genes of the HPA axis were activated, accompanied by disruption of the lipid metabolism and progression of steatohepatitis. The lipid metabolism in the Hepa1-6 cell line treated with endogenous corticosterone (CORT) was in accordance with the aforementioned in vivo responses. Depression aggravated hepatic steatosis in CDAHFD-fed mice by activating the HPA axis. The risk of NAFLD development should be fully considered in depressive patients and improvement of psychotic disorders could be an etiological treatment strategy for them.", "keywords": ["Animals", "Hypothalamo-Hypophyseal System", "Pituitary-Adrenal System", "Mice", "Depression", "Disease Models, Animal", "Non-alcoholic Fatty Liver Disease", "Male", "Mice, Inbred C57BL", "Corticotropin-Releasing Hormone", "Diet, High-Fat", "Adrenocorticotropic Hormone", "Liver", "Fatty Liver", "Corticosterone"], "year": "2024", "doi": "10.21873/invivo.13618"}, {"pmid": "37234368", "title": "Corrigendum: Loss of hepatic Surf4 depletes lipid droplets in the adrenal cortex but does not impair adrenal hormone production.", "abstract": "[This corrects the article DOI: 10.3389/fcvm.2021.764024.].", "keywords": [], "year": "2023", "doi": "10.3389/fcvm.2023.1215335"}, {"pmid": "35277933", "title": "Hypothalamic-pituitary-adrenal axis activation and glucocorticoid-responsive gene expression in skeletal muscle and liver of Apc mice.", "abstract": "Cancer patients at advanced stages experience a severe depletion of skeletal muscle compartment together with a decrease in muscle function, known as cancer cachexia. Cachexia contributes to reducing quality of life, treatment efficiency, and lifespan of cancer patients. However, the systemic nature of the syndrome is poorly documented. Here, we hypothesize that glucocorticoids would be important systemic mediators of cancer cachexia. To explore the role of glucocorticoids during cancer cachexia, biomolecular analyses were performed on several tissues (adrenal glands, blood, hypothalamus, liver, and skeletal muscle) collected from Apc Min/+ male mice, a mouse model of intestine and colon cancer, aged of 13 and 23&#xa0;weeks, and compared with wild type age-matched C57BL/6J littermates. Twenty-three-week-old Apc mice recapitulated important features of cancer cachexia including body weight loss (-16%, P&#xa0;&lt;&#xa0;0.0001), muscle atrophy (gastrocnemius muscle: -53%, P&#xa0;&lt;&#xa0;0.0001), and weakness (-50% in tibialis anterior muscle force, P&#xa0;&lt;&#xa0;0.0001), increased expression of atrogens (7-fold increase in MuRF1 transcript level, P&#xa0;&lt;&#xa0;0.0001) and down-regulation of Akt-mTOR pathway (3.3-fold increase in 4EBP1 protein content, P&#xa0;&lt;&#xa0;0.0001), together with a marked transcriptional rewiring of hepatic metabolism toward an increased expression of gluconeogenic genes (Pcx: +90%, Pck1: +85%), and decreased expression of glycolytic (Slc2a2: -40%, Gk: -30%, Pklr: -60%), ketogenic (Hmgcs2: -55%, Bdh1: -80%), lipolytic/fatty oxidation (Lipe: -50%, Mgll: -60%, Cpt2: -60%, Hadh: -30%), and lipogenic (Acly: -30%, Acacb: -70%, Fasn: -45%) genes. The hypothalamic pituitary-adrenal axis was activated, as evidenced by the increase in the transcript levels of genes encoding corticotropin-releasing hormone in the hypothalamus (2-fold increase, P&#xa0;&lt;&#xa0;0.01), adrenocorticotropic hormone receptor (3.4-fold increase, P&#xa0;&lt;&#xa0;0.001), and steroid biosynthesis enzymes (Cyp21a1, P&#xa0;&lt;&#xa0;0.0001, and Cyp11b1, P&#xa0;&lt;&#xa0;0.01) in the adrenal glands, as well as by the increase in corticosterone level in the serum (+73%, P&#xa0;&lt;&#xa0;0.05), skeletal muscle (+17%, P&#xa0;&lt;&#xa0;0.001), and liver (+24%, P&#xa0;&lt;&#xa0;0.05) of cachectic 23-week-old Apc mice. A comparative transcriptional analysis with dexamethasone-treated C57BL/6J mice indicated that the activation of the hypothalamic-pituitary-adrenal axis in 23-week-old Apc Min/+ mice was significantly associated with the transcription of glucocorticoid-responsive genes in skeletal muscle (P&#xa0;&lt;&#xa0;0.05) and liver (P&#xa0;&lt;&#xa0;0.001). The transcriptional regulation of glucocorticoid-responsive genes was also observed in the gastrocnemius muscle of Lewis lung carcinoma tumour-bearing mice and in KPC mice (tibialis anterior muscle and liver). These findings highlight the role of the hypothalamic-pituitary-adrenal-glucocorticoid pathway in the transcriptional regulation of skeletal muscle catabolism and hepatic metabolism during cancer cachexia. They also provide the paradigm for the design of new therapeutic strategies.", "keywords": ["Aged", "Animals", "Cachexia", "Carcinoma, Lewis Lung", "Gene Expression", "Glucocorticoids", "Humans", "Hypothalamo-Hypophyseal System", "Liver", "Male", "Mice", "Mice, Inbred C57BL", "Muscle, Skeletal", "Pituitary-Adrenal System", "Quality of Life"], "year": "2022", "doi": "10.1002/jcsm.12939"}, {"pmid": "34859075", "title": "Loss of Hepatic Surf4 Depletes Lipid Droplets in the Adrenal Cortex but Does Not Impair Adrenal Hormone Production.", "abstract": "The adrenal gland produces steroid hormones to play essential roles in regulating various physiological processes. Our previous studies showed that knockout of hepatic Surf4 (Surf4 LKO ) markedly reduced fasting plasma total cholesterol levels in adult mice, including low-density lipoprotein and high-density lipoprotein cholesterol. Here, we found that plasma cholesterol levels were also dramatically reduced in 4-week-old young mice and non-fasted adult mice. Circulating lipoprotein cholesterol is an important source of the substrate for the production of adrenal steroid hormones. Therefore, we investigated whether adrenal steroid hormone production was affected in Surf4 LKO mice. We observed that lacking hepatic Surf4 essentially eliminated lipid droplets and significantly reduced cholesterol levels in the adrenal gland; however, plasma levels of aldosterone and corticosterone were comparable in Surf4 LKO and the control mice under basal and stress conditions. Further analysis revealed that mRNA levels of genes encoding enzymes important for hormone synthesis were not altered, whereas the expression of scavenger receptor class B type I (SR-BI), low-density lipoprotein receptor (LDLR) and 3-hydroxy-3-methyl-glutaryl-CoA reductase was significantly increased in the adrenal gland of Surf4 LKO mice, indicating increased de novo cholesterol biosynthesis and enhanced LDLR and SR-BI-mediated lipoprotein cholesterol uptake. We also observed that the nuclear form of SREBP2 was increased in the adrenal gland of Surf4 LKO mice. Taken together, these findings indicate that the very low levels of circulating lipoprotein cholesterol in Surf4 LKO mice cause a significant reduction in adrenal cholesterol levels but do not significantly affect adrenal steroid hormone production. Reduced adrenal cholesterol levels activate SREBP2 and thus increase the expression of genes involved in cholesterol biosynthesis, which increases de novo cholesterol synthesis to compensate for the loss of circulating lipoprotein-derived cholesterol in the adrenal gland of Surf4 LKO mice.", "keywords": [], "year": "2021", "doi": "10.3389/fcvm.2021.764024"}, {"pmid": "33112814", "title": "Liver at the nexus of rat postnatal HPA axis maturation and sexual dimorphism.", "abstract": "Normal function of the hypothalamic-pituitary-adrenal (HPA) axis is critical for survival, and its development is choreographed for age-, sex- and context-specific actions. The liver influences HPA ontogeny, integrating diverse endocrine signals that inhibit or activate its development. This review examines how developmental changes in the expression of genes in the liver coordinate postnatal changes in multiple endocrine systems that facilitate the maturation and sexual dimorphism of the rat HPA axis. Specifically, it examines how the ontogeny of testicular androgen production, somatostatin-growth hormone activities, and hypothalamic-pituitary-thyroid axis activity intersect to influence the hepatic gene expression of insulin-like growth factor 1, corticosteroid-binding globulin, thyroxine-binding globulin, 11&#x3b2;-hydroxysteroid dehydrogenase type 1 and 5&#x3b1;-reductase type 1. The timing of such molecular changes vary between mammalian species, but they are evolutionarily conserved and are poised to control homeostasis broadly, especially during adversity. Importantly, with the liver as their nexus, these diverse endocrine systems establish the fundamental organization of the HPA axis throughout postnatal development, and thereby ultimately determine the actions of glucocorticoids during adulthood.", "keywords": ["Androgens", "Animals", "Hypothalamo-Hypophyseal System", "Liver", "Rats", "Sex Characteristics", "Thyroid Gland", "Thyroid Hormones", "Transcortin"], "year": "2021", "doi": "10.1530/JOE-20-0286"}, {"pmid": "32213610", "title": "Early Transcriptional Changes within Liver, Adrenal Gland, and Lymphoid Tissues Significantly Contribute to Ebola Virus Pathogenesis in Cynomolgus Macaques.", "abstract": "Ebola virus (EBOV) continues to pose a significant threat to human health, as evidenced by the 2013-2016 epidemic in West Africa and the ongoing outbreak in the Democratic Republic of the Congo. EBOV causes hemorrhagic fever, organ damage, and shock culminating in death, with case fatality rates as high as 90%. This high lethality combined with the paucity of licensed medical countermeasures makes EBOV a critical human pathogen. Although EBOV infection results in significant damage to the liver and the adrenal glands, little is known about the molecular signatures of injury in these organs. Moreover, while changes in peripheral blood cells are becoming increasingly understood, the host responses within organs and lymphoid tissues remain poorly characterized. To address this knowledge gap, we tracked longitudinal transcriptional changes in tissues collected from EBOV-Makona-infected cynomolgus macaques. Following infection, both liver and adrenal glands exhibited significant and early downregulation of genes involved in metabolism, coagulation, hormone synthesis, and angiogenesis; upregulated genes were associated with inflammation. Analysis of lymphoid tissues showed early upregulation of genes that play a role in innate immunity and inflammation and downregulation of genes associated with cell cycle and adaptive immunity. Moreover, transient activation of innate immune responses and downregulation of humoral immune responses in lymphoid tissues were confirmed with flow cytometry. Together, these data suggest that the liver, adrenal gland, and lymphatic organs are important sites of EBOV infection and that dysregulating the function of these vital organs contributes to the development of Ebola virus disease. IMPORTANCE Ebola virus (EBOV) remains a high-priority pathogen since it continues to cause outbreaks with high case fatality rates. Although it is well established that EBOV results in severe organ damage, our understanding of tissue injury in the liver, adrenal glands, and lymphoid tissues remains limited. We begin to address this knowledge gap by conducting longitudinal gene expression studies in these tissues, which were collected from EBOV-infected cynomolgus macaques. We report robust and early gene expression changes within these tissues, indicating they are primary sites of EBOV infection. Furthermore, genes involved in metabolism, coagulation, and adaptive immunity were downregulated, while inflammation-related genes were upregulated. These results indicate significant tissue damage consistent with the development of hemorrhagic fever and lymphopenia. Our study provides novel insight into EBOV-host interactions and elucidates how host responses within the liver, adrenal glands, and lymphoid tissues contribute to EBOV pathogenesis.", "keywords": ["Adrenal Glands", "Animals", "Ebolavirus", "Female", "Gene Expression Regulation, Viral", "Hemorrhagic Fever, Ebola", "Liver", "Lymphoid Tissue", "Macaca fascicularis", "Male", "Monkey Diseases", "Transcription, Genetic"], "year": "2020", "doi": "10.1128/JVI.00250-20"}, {"pmid": "31789919", "title": "Adrenocortical Scintigraphy With SPECT/CT for the Diagnosis of Hepatic Adrenal Rest.", "abstract": "Hepatic adrenal rest include ectopic adrenal tissue in the liver and adrenohepatic fusion. Long-lasting hyperstimulation of that tissue induces hyperplasia sometimes simulating true tumors. True autonomic tumors originating from ectopic adrenal tissue with or without hyperfunction are rare. Hepatic adrenal rest sometimes has similar imaging findings to lipid-rich hepatocellular carcinoma or angiomyolipoma, containing obvious lipid component. But in our cases, tumors showed hypervascular patterns similar to hepatocellular adenoma or carcinoma. Therefore, adrenocortical scintigraphy with SPECT/CT should be taken into consideration to diagnose tumoral lesions in the posterior segment of the right hepatic lobe with or without an obvious lipid component.", "keywords": ["Adrenal Glands", "Adult", "Angiomyolipoma", "Carcinoma", "Choristoma", "Diagnosis, Differential", "Female", "Humans", "Liver Neoplasms", "Middle Aged", "Single Photon Emission Computed Tomography Computed Tomography"], "year": "2020", "doi": "10.1097/RLU.0000000000002852"}, {"pmid": "30684267", "title": "The possible structural changes in the adrenal gland cortex after induction of hepatic ischemia-reperfusion injury in male albino rats: Light and electron microscopic study.", "abstract": "The adrenal gland is an important endocrine gland in the body that secrets the adrenal hormones. One of the important clinical issues is the hepatic ischemia-reperfusion (IR) injury. Liver IR injury results in many distant organs dysfunctions such as lung, kidney, intestine, pancreas, and myocardium. The aim of the present study was to investigate the possible remote effects of hepatic IR on the structure of the adrenal cortex. Twenty healthy males, Sprague-Dawley albino rats aged 6-8 weeks were randomly divided into two groups (10 rats each): the sham control group (SC-group) and the ischemia-reperfusion group (IR-group). Sera were estimated for the following: aspartate transaminase (AST), alanine transaminase (ALT), lactic dehydrogenase (LDH), and corticosterone levels. Also oxidative markers such as malondialdehyde (MDA) and tumor necrosis factor-&#x3b1; (TNF-&#x3b1;), and the antioxidative enzyme, catalase were measured. Adrenal glands were processed for light and transmission electron microscopic study. The results showed a significant increase in serum liver enzymes (AST, ALT, and LDH), corticosterone, MDA, and TNF-&#x3b1; levels and a significant decrease in serum levels of catalase in IR-group compared with SC-group. Adrenal cortical tissue of IR-group showed the loss of normal appearance. Some cells of zona glomerulosa and most of the zona fasciculata cells appeared swollen and degenerated with highly vacuolated cytoplasm. Other cells were shrunken with deeply acidophilic cytoplasm and pyknotic nuclei. Degenerated mitochondria with disrupted cristae, lipid droplets were confluent and dilated smooth endoplasmic reticulum were seen. Few zona reticularis cells had the dark nucleus and cytoplasmic vacuolations. In the different zones, blood capillaries were markedly congested and some inflammatory cells infiltrations were observed. Liver IR affected the structure of the adrenal cortex.", "keywords": [], "year": "2019", "doi": "10.1002/jcp.28196"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"liver\"[Title] OR \"hepatic\"[Title] OR \"hepatocyte\"[Title] OR \"hepatocellular\"[Title] OR \"nonalcoholic fatty liver\"[Title] OR \"NAFLD\"[Title] OR \"NASH\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__Muscle", "source": "Adrenal Glands", "target": "Muscle", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: Cortisol, insulin\nNotes: Cortisol lowers insulin production in the pancreas which will in turn lower insulin abundance and lead to less glucose uptake in Muscle.\nSources:\n- DOI: 10.5772/intechopen.1003161", "connection_type": "Hormonal connection", "key_players": ["Cortisol", "insulin"], "key_players_metabolites": ["glucose", "cholesterol", "glycogen", "lipoprotein", "succinate", "acetate"], "key_players_hormones": ["acth", "testosterone", "aldosterone", "dhea", "glucocorticoid", "insulin", "corticosterone", "thyroxine", "angiotensin", "crh", "angiotensin ii", "thyroid hormones", "tumor necrosis factor", "progesterone", "interleukin-1", "cortisol", "estradiol", "glucagon", "norepinephrine", "growth hormone", "il6", "renin", "noradrenaline", "androstenedione", "adiponectin", "adrenaline", "epinephrine"], "key_players_proteins": ["glut4", "mtor", "akt", "cpt2"], "key_players_counts_metabolites": {"cholesterol": 3, "glycogen": 2, "glucose": 10, "lipoprotein": 2, "acetate": 1, "succinate": 2}, "key_players_counts_hormones": {"progesterone": 2, "dhea": 7, "testosterone": 9, "glucocorticoid": 7, "thyroxine": 4, "crh": 3, "interleukin-1": 2, "aldosterone": 9, "glucagon": 1, "acth": 15, "angiotensin ii": 3, "norepinephrine": 1, "cortisol": 2, "growth hormone": 1, "thyroid hormones": 3, "il6": 1, "renin": 1, "noradrenaline": 1, "androstenedione": 1, "adiponectin": 1, "insulin": 5, "adrenaline": 1, "tumor necrosis factor": 3, "epinephrine": 1, "corticosterone": 5, "estradiol": 2, "angiotensin": 4}, "key_players_counts_proteins": {"glut4": 4, "akt": 1, "mtor": 2, "cpt2": 1}, "notes": "Cortisol lowers insulin production in the pancreas which will in turn lower insulin abundance and lead to less glucose uptake in Muscle.", "sources": ["DOI: 10.5772/intechopen.1003161"], "ai_description": "The adrenal glands and muscles interact through the hypothalamic-pituitary-adrenal (HPA) axis, which is sensitive to glucose levels [1]. In response to stress or energy depletion, the HPA axis stimulates glucocorticoid production in the adrenal glands, leading to increased gluconeogenesis and lipolysis in skeletal muscle [3]. Testosterone deficiency, as seen in testicular dysfunction, triggers compensatory testicular adaptation (CTA) in the adrenal gland, resulting in increased steroid hormone synthesis [2]. Activation of the HPA axis also promotes glucocorticoid-responsive gene expression in skeletal muscle, contributing to muscle atrophy and cachexia in cancer patients [3].", "pubmed_n": 25, "pubmed_papers": [{"pmid": "42264997", "title": "Stress and the interaction of the hypothalamic-pituitary-adrenal axis with other pituitary axes and its consequences on muscle mass.", "abstract": "In this manuscript, the relation of the hypothalamic-pituitary-adrenal axis to energy handling, thyroid function, gonadal and growth hormones are discussed against the background of stress. Clinical data from the SHIP-PAGE (steroid hormones in patients with pituitary, adrenal and gonadal endocrinopathies) study are provided to show that the HPA axis is sensitive to glucose and interferes with the activities of other pituitary axes. While chronic stress leads to central hypogonadism and a loss in muscle mass, high glucose loads hamper the plasticities of the HPA, the hypothalamic-pituitary-gonadal as well as the hypothalamic-pituitary-growth hormone axes but elevate insulin concentrations. Therefore, prevention programs ideally include strategies to reduce stress and promote muscle activity.", "keywords": [], "year": "2026", "doi": "10.1016/j.beem.2026.102131"}, {"pmid": "36735924", "title": "Effects of testis testosterone deficiency on gene expression in the adrenal gland and skeletal muscle of ducks.", "abstract": "1. Testosterone has an anabolic effect on skeletal muscle. The testes produce most of the testosterone in vivo , while the adrenal glands contribute smaller amounts. When testis testosterone is deficient the adrenal gland increases steroid hormone synthesis, which is referred to as compensatory testicular adaptation (CTA).2. To reveal the effects of testis testosterone deficiency on adrenal steroid hormones synthesis and skeletal muscle development, gene expression related to adrenal steroid hormones synthesis and skeletal muscle development were determined by RNA-seq.3. The results showed that castrating male ducks had significant effects on their body weight but no significant impact on cross-sectional area (CSA) or density of pectoral muscle fibres. In skeletal muscle protein metabolism, expression levels of the catabolic gene atrogin1/MAFbx and the anabolic gene eEF2 were significantly higher, with concomitant increases after castration. The adrenal glands' alteration of the steroid hormone 11&#x3b2;-hydroxylase (CYP11B1) was significantly lower following castration.4. Expression pattern analysis showed that the adrenal glands' glucocorticoid receptor (NR3C1/GR) had a potential regulatory relationship with the skeletal muscle-related genes ( Pax7, mTOR, FBXO32, FOXO3 , and FOXO4 ).5. The data showed that castration affected muscle protein metabolism, adrenal steroid and testosterone synthesis. In addition, it was speculated that, after castration, steroid hormones produced by the adrenal gland could have a compensatory effect, which might mediate the changes in skeletal muscle protein metabolism and development.", "keywords": ["Male", "Animals", "Testis", "Ducks", "Chickens", "Testosterone", "Adrenal Glands", "Muscle, Skeletal", "Steroids", "Gene Expression"], "year": "2023", "doi": "10.1080/00071668.2023.2176741"}, {"pmid": "35277933", "title": "Hypothalamic-pituitary-adrenal axis activation and glucocorticoid-responsive gene expression in skeletal muscle and liver of Apc mice.", "abstract": "Cancer patients at advanced stages experience a severe depletion of skeletal muscle compartment together with a decrease in muscle function, known as cancer cachexia. Cachexia contributes to reducing quality of life, treatment efficiency, and lifespan of cancer patients. However, the systemic nature of the syndrome is poorly documented. Here, we hypothesize that glucocorticoids would be important systemic mediators of cancer cachexia. To explore the role of glucocorticoids during cancer cachexia, biomolecular analyses were performed on several tissues (adrenal glands, blood, hypothalamus, liver, and skeletal muscle) collected from Apc Min/+ male mice, a mouse model of intestine and colon cancer, aged of 13 and 23&#xa0;weeks, and compared with wild type age-matched C57BL/6J littermates. Twenty-three-week-old Apc mice recapitulated important features of cancer cachexia including body weight loss (-16%, P&#xa0;&lt;&#xa0;0.0001), muscle atrophy (gastrocnemius muscle: -53%, P&#xa0;&lt;&#xa0;0.0001), and weakness (-50% in tibialis anterior muscle force, P&#xa0;&lt;&#xa0;0.0001), increased expression of atrogens (7-fold increase in MuRF1 transcript level, P&#xa0;&lt;&#xa0;0.0001) and down-regulation of Akt-mTOR pathway (3.3-fold increase in 4EBP1 protein content, P&#xa0;&lt;&#xa0;0.0001), together with a marked transcriptional rewiring of hepatic metabolism toward an increased expression of gluconeogenic genes (Pcx: +90%, Pck1: +85%), and decreased expression of glycolytic (Slc2a2: -40%, Gk: -30%, Pklr: -60%), ketogenic (Hmgcs2: -55%, Bdh1: -80%), lipolytic/fatty oxidation (Lipe: -50%, Mgll: -60%, Cpt2: -60%, Hadh: -30%), and lipogenic (Acly: -30%, Acacb: -70%, Fasn: -45%) genes. The hypothalamic pituitary-adrenal axis was activated, as evidenced by the increase in the transcript levels of genes encoding corticotropin-releasing hormone in the hypothalamus (2-fold increase, P&#xa0;&lt;&#xa0;0.01), adrenocorticotropic hormone receptor (3.4-fold increase, P&#xa0;&lt;&#xa0;0.001), and steroid biosynthesis enzymes (Cyp21a1, P&#xa0;&lt;&#xa0;0.0001, and Cyp11b1, P&#xa0;&lt;&#xa0;0.01) in the adrenal glands, as well as by the increase in corticosterone level in the serum (+73%, P&#xa0;&lt;&#xa0;0.05), skeletal muscle (+17%, P&#xa0;&lt;&#xa0;0.001), and liver (+24%, P&#xa0;&lt;&#xa0;0.05) of cachectic 23-week-old Apc mice. A comparative transcriptional analysis with dexamethasone-treated C57BL/6J mice indicated that the activation of the hypothalamic-pituitary-adrenal axis in 23-week-old Apc Min/+ mice was significantly associated with the transcription of glucocorticoid-responsive genes in skeletal muscle (P&#xa0;&lt;&#xa0;0.05) and liver (P&#xa0;&lt;&#xa0;0.001). The transcriptional regulation of glucocorticoid-responsive genes was also observed in the gastrocnemius muscle of Lewis lung carcinoma tumour-bearing mice and in KPC mice (tibialis anterior muscle and liver). These findings highlight the role of the hypothalamic-pituitary-adrenal-glucocorticoid pathway in the transcriptional regulation of skeletal muscle catabolism and hepatic metabolism during cancer cachexia. They also provide the paradigm for the design of new therapeutic strategies.", "keywords": ["Aged", "Animals", "Cachexia", "Carcinoma, Lewis Lung", "Gene Expression", "Glucocorticoids", "Humans", "Hypothalamo-Hypophyseal System", "Liver", "Male", "Mice", "Mice, Inbred C57BL", "Muscle, Skeletal", "Pituitary-Adrenal System", "Quality of Life"], "year": "2022", "doi": "10.1002/jcsm.12939"}, {"pmid": "31564939", "title": "Effect of berberine on the HPA-axis pathway and skeletal muscle GLUT4 in type 2 diabetes mellitus rats.", "abstract": "Activation of the hypothalamus-pituitary-adrenal (HPA) axis pathway is closely related to insulin resistance (IR), glucose, and lipid metabolism disorders in type 2 diabetes mellitus (T2DM). Berberine (BBR) has effect on regulating disorder of glucose and lipid metabolism in T2DM. In fact, activation of the HPA axis pathway is closely related to IR, glucose, and lipid metabolism disorders in T2DM. Here, we investigated whether the therapeutic effect of BBR on T2DM rats is acted through the HPA axis pathway. In this research, we investigated the effects of BBR on the HPA-axis pathway-related indicators and expression of skeletal muscle glucose transporter 4 (GLUT4) in the high-fat diet and streptozotocin-induced T2DM rats, and identify its possible mechanism of improving IR in T2DM. BBR significantly reduced fasting blood glucose, total cholesterol, and low-density lipoprotein cholesterol in model rats. It also improved the abnormalities of the high-density lipoprotein cholesterol, the insulin resistance index, the insulin sensitivity index, glucagon, and insulin levels. BBR decreased levels of hypothalamic Orexin-A, the OX2R receptor, the corticotropin-releasing hormone, the pituitary and the plasma adrenocorticotropic hormone, as well as serum and urine corticosterone. At the same time, BBR increased mRNA and protein expressions of GLUT4 in skeletal muscles of model rats as well. Those results suggested that BBR can exert inhibition on the HPA-axis and increased skeletal muscle expression of GLUT4 proteins, which may be one of the important mechanisms in BBR to improve IR and regulating glucose and lipid metabolism in T2DM rats.", "keywords": [], "year": "2019", "doi": "10.2147/DMSO.S211188"}, {"pmid": "22084407", "title": "Central nervous system inflammation induces muscle atrophy via activation of the hypothalamic-pituitary-adrenal axis.", "abstract": "Skeletal muscle catabolism is a co-morbidity of many chronic diseases and is the result of systemic inflammation. Although direct inflammatory cytokine action on muscle promotes atrophy, nonmuscle sites of action for inflammatory mediators are less well described. We demonstrate that central nervous system (CNS)-delimited interleukin 1&#x3b2; (IL-1&#x3b2;) signaling alone can evoke a catabolic program in muscle, rapidly inducing atrophy. This effect is dependent on hypothalamic-pituitary-adrenal (HPA) axis activation, as CNS IL-1&#x3b2;-induced atrophy is abrogated by adrenalectomy. Furthermore, we identified a glucocorticoid-responsive gene expression pattern conserved in models of acute and chronic inflammatory muscle atrophy. In contrast with studies suggesting that the direct action of inflammatory cytokines on muscle is sufficient to induce catabolism, adrenalectomy also blocks the atrophy program in response to systemic inflammation, demonstrating that glucocorticoids are requisite for this process. Additionally, circulating levels of glucocorticoids equivalent to those produced under inflammatory conditions are sufficient to cause profound muscle wasting. Together, these data suggest that a significant component of inflammation-induced muscle catabolism occurs indirectly via a relay in the CNS.", "keywords": ["Adrenalectomy", "Analysis of Variance", "Animals", "Blotting, Western", "Central Nervous System", "Corticosterone", "Enzyme-Linked Immunosorbent Assay", "Gene Expression Profiling", "Glucocorticoids", "Humans", "Hypothalamo-Hypophyseal System", "Immunohistochemistry", "In Situ Hybridization", "Inflammation", "Interleukin-1beta", "Mice", "Mice, Inbred C57BL", "Microarray Analysis", "Muscle, Skeletal", "Muscular Atrophy", "Pituitary-Adrenal System", "Rats", "Rats, Sprague-Dawley", "Real-Time Polymerase Chain Reaction", "Signal Transduction"], "year": "2011", "doi": "10.1084/jem.20111020"}, {"pmid": "21606192", "title": "Long-term DHEA substitution in female adrenocortical failure, body composition, muscle function, and bone metabolism: a randomized trial.", "abstract": "Adrenal derived androgens are low in women with adrenal failure. The physiological consequences of substitution therapy are uncertain. To investigate the effects of DHEA substitution in women with adrenal failure on body composition, fuel metabolism, and inflammatory markers. DESIGN, PARTICIPANTS AND INTERVENTION: In this study, ten female patients (median age 38.5 years, range 28-52) with adrenal failure were treated with DHEA 50&#x200a;mg for 6 months in a double-blind, randomized, placebo-controlled, and crossover study. The participants underwent dual-energy X-ray absorptiometry (DXA) scan, computed tomography scan of abdominal fat, indirect calorimetry, bicycle ergometry, muscle and fat biopsies, and blood samples. Baseline androgens were normalized to fertile range during active treatment. Anthropometric data were unaffected, but lean body mass (LBM) slightly increased compared with placebo (delta LBM (kg) placebo versus DHEA: -0.48&#xb1;6.1 vs 1.6&#xb1;3.4, P=0.02) with no alterations in total or abdominal fat mass. PTH increased with DHEA, but no significant changes were observed in other bone markers or in bone mineral content. The mRNA levels of markers of tissue inflammation (adiponectin, interleukin 6 (IL6), IL10, monocyte chemoattractant protein 1, and tumor necrosis factor &#x3b1;) in fat and muscle tissue were unaffected by DHEA treatment, as was indirect calorimetry and maximal oxygen uptake. A high proportion of self-reported seborrheic side effects were recorded (60%). In female adrenal failure, normalization of androgens with DHEA 50&#x200a;mg for 6 months had no effects on muscle, fat, and bone tissue and on fuel metabolism in this small study. A small increase in LBM was observed. Treatment was associated with a high frequency of side effects.", "keywords": ["Adrenal Cortex Hormones", "Adrenal Insufficiency", "Adult", "Body Composition", "Bone and Bones", "Cross-Over Studies", "Dehydroepiandrosterone", "Double-Blind Method", "Drug Administration Schedule", "Female", "Hormone Replacement Therapy", "Humans", "Middle Aged", "Muscle, Skeletal", "Placebos", "Time Factors"], "year": "2011", "doi": "10.1530/EJE-11-0289"}, {"pmid": "12644301", "title": "Interferon-inducible genes in the rat adrenal gland and vascular smooth muscle cells.", "abstract": "Chronic stimulation of the renin-angiotensin system results in increased zona glomerulosa cells and in cells expressing the final enzyme in the synthesis of aldosterone, the cytochrome P-450 aldosterone synthase. The genes activated during adrenal remodeling are not well defined. We have reported that the expression of interferon-inducible genes, 9-27, 1-8D and 1-8U in H295R cells is stimulated by A-II. The 9-27 gene is expressed mainly in leukocytes and is associated with cell proliferation. In this study, we searched for similar genes in a rat zona glomerulosa cDNA library, and examined the regulation of the expression of these genes. We found the Rat8 gene, which has been reported to be similar to human interferon-inducible genes, as well as two similar genes, No. 10 (1096 bp), and No. 16 (630 bp). Rat8 gene and No. 16 were mainly expressed in zona glomerulosa. The product of No. 10 is thought to be a secreted protein, unlike those of 8 and 16, and its expression in the adrenal was weak in comparison. The control of the expression of rat8 or No. 16 genes differs depending on the tissue. Expression in A10 cells (derived from rat embryo thoracic aorta) was not stimulated by A-II, nor was it influenced by salt intake in the adrenal gland, but it was reduced in vascular smooth muscle cells (VSMC) of rats on a low sodium diet. These results show that genes similar to the human 1-8 gene family are expressed in rat adrenal glomerulosa cells and VSMC, but their expression is not regulated by A-II. The function of these genes in VSMC and adrenal is unknown.", "keywords": ["Adrenal Glands", "Animals", "Base Sequence", "Gene Expression Regulation", "Humans", "Interferons", "Male", "Molecular Sequence Data", "Muscle, Smooth, Vascular", "Protein Biosynthesis", "Proteins", "Rats", "Zona Glomerulosa"], "year": "2003", "doi": "10.1016/s0303-7207(02)00412-4"}, {"pmid": "10481548", "title": "[Hyperkalemic periodic muscle paralysis in primary adrenocortical insufficiency. A case report].", "abstract": "20-years old man was admitted to the hospital because of a few paroxysmal muscle paralysis episodes with pronounced periodic hiperkalemia (maximal 9.8 mmol/l). The first episode was preceded by a very hard physical effort. Primary adrenal insufficiency was recognised on the basis of clinical, humoral and biochemical examinations. There was elevated ACTH and a very low serum level of cortisol and aldosterone. There was slight metabolic acidosis and hiponatremia. The patient was treated with hydrocortisone and fludrocortisone acetate (Cortineff) with positive result. During one year of this therapy his general condition was very good and clinical, humoral and biochemical signs (except of metabolic acidosis) resolved. Neurological symptoms and a very high serum kalium level were the most important signs of primary adrenal insufficiency in the presented case.", "keywords": ["Acidosis", "Adrenal Insufficiency", "Adrenocorticotropic Hormone", "Adult", "Aldosterone", "Anti-Inflammatory Agents", "Fludrocortisone", "Humans", "Hydrocortisone", "Hyperkalemia", "Hyponatremia", "Male", "Muscle, Skeletal", "Paralysis", "Periodicity"], "year": "1999", "doi": ""}, {"pmid": "9745431", "title": "Androgen response to hypothalamic-pituitary-adrenal stimulation with naloxone in women with myotonic muscular dystrophy.", "abstract": "Myotonic muscular dystrophy (MMD) is a disease of autosomal dominant inheritance characterized by multisystem disease, including myotonia, muscle-wasting and weakness of all muscular tissues, and endocrine abnormalities attributed to a genetic abnormality causing a defective cAMP-dependent kinase. We have previously reported that MMD patients demonstrate ACTH hypersecretion after endogenous CRH release stimulated by naloxone administration while manifesting a normal cortisol (F) response. Additionally, others have reported a reduced adrenal androgen (AA) response to exogenous ACTH administration in MMD patients. As ACTH stimulates the secretion of both AAs and F, it is possible that the discordant relationship of these hormones in MMD patients results from a defect of adrenocortical ACTH receptor function or postreceptor signaling or subsequent biochemical events. Furthermore, the molecular abnormality seen in MMD patients may suggest that the mechanism underlying the frequently observed discordances in the secretion of glucocorticoids and AAs (e.g. adrenarche, surgical trauma, severe burns, or intermittent glucocorticoid administration) are explainable solely via an alteration in the function of the ACTH receptor or postreceptor signaling. To ascertain whether the responses of F and AAs to endogenous ACTH diverged in this disorder, we prospectively studied the responses of these hormones to naloxone-stimulated CRH release in nine premenopausal women with MMD and seven healthy age and weight-matched control women. After naloxone infusion (125 micrograms/kg, i.v.), blood sampling was performed at baseline (i.e. -5 min) and at 30 and 60 min. In addition to the absolute hormone level at each time, we calculated the net increment (i.e. change) at 30 and 60 min and the area under the curve (AUC) for F, ACTH, dehydroepiandrosterone (DHA), and androstenedione (A4). Consistent with our previous study, MMD patients demonstrated higher ACTH levels at all sampling times except [minud]5 min. AUC analysis revealed the ACTHAUC values were significantly higher in MMD than in control women (457 +/- 346 vs. 157 +/- 123 pmol/min.L; P &lt; 0.03), whereas the FAUC response did not differ between MMD and controls (13860 +/- 3473 vs. 13375 +/- 3465 nmol/min.L; P &gt; 0.5). Despite the greater ACTH secretion, the baseline circulating dehydroepiandrosterone sulfate levels were significantly lower in MMD compared with control women (18 +/- 23 vs. 61 +/- 23 mumol/L; P &lt; 0.002). The serum concentrations of A4 at baseline, 30 min, and 60 min and DHA levels at 30 and 60 min were also significantly lower in MMD vs. control women. Additionally, the A4AUC and DHAAUC values were significantly lower in MMD patients than in controls. Furthermore, the net response of DHA at 60 min to the endogenous ACTH increase was also reduced in MMD patients compared with that in control subjects (2.3 +/- 2.1 vs. 5.6 +/- 2.6 nmol/L; P &lt; 0.02). In conclusion, in addition to ACTH hypersecretion to CRH-mediated stimuli, these data suggest that MMD patients have a defect in the adrenocortical response to ACTH, reflected in normal F and reduced DHA and A4 secretion. Whether this defect is inherent to the disease or simply reflects adaptive changes to chronic disease remains to be demonstrated. However, it is possible that further studies of the response of MMD patients to ACTH may reveal a mechanism that explains the frequently observed dichotomy in the secretion of glucocorticoids and AAs.", "keywords": ["Adrenal Cortex", "Adrenocorticotropic Hormone", "Adult", "Androgens", "Corticotropin-Releasing Hormone", "Dehydroepiandrosterone", "Female", "Humans", "Hydrocortisone", "Hypothalamo-Hypophyseal System", "Kinetics", "Muscular Dystrophies", "Naloxone", "Narcotic Antagonists", "Premenopause", "Prospective Studies"], "year": "1998", "doi": "10.1210/jcem.83.9.5078"}, {"pmid": "7794283", "title": "Adrenocortical steroids, thyroid hormones and retinoic acid augment the production of adrenomedullin in vascular smooth muscle cells.", "abstract": "Adrenomedullin (AM) is produced and secreted from vascular smooth muscle cells (VSMCs), which express AM specific receptors. In the survey for substances regulating AM production, we found that dexamethasone, hydrocortisone and aldosterone stimulate AM production in cultured rat VSMC with ED50 values of 2.4 nM, 16 nM and 270 nM, while progesterone, estradiol and testosterone induced weak or no effect. Maximal stimulation levels of dexamethasone, hydrocortisone and aldosterone were comparable and a little lower than those of the most potent stimulants, interleukin-1 and tumor necrosis factor. Hydrocortisone dose-dependently activated AM gene transcription, and AM mRNA level was highest at 12 h after stimulation. A physiological concentration of hydrocortisone was deduced to be enough to regulate AM production in VSMC. Retinoic acid and thyroid hormones increased AM production to 400% and 150% after 14 h incubation. These results demonstrate a complex regulation system of AM production in VSMC by hormones and related substances. Furthermore, effects of actinomycin D and cycloheximide suggest that biosynthesis of AM is designed for quick response to physiological stimulation.", "keywords": ["Adrenomedullin", "Aldosterone", "Animals", "Antihypertensive Agents", "Aorta, Thoracic", "Cells, Cultured", "Cycloheximide", "Dactinomycin", "Dexamethasone", "Estradiol", "Gene Expression", "Hydrocortisone", "Interleukin-1", "Kinetics", "Lipopolysaccharides", "Muscle, Smooth, Vascular", "Peptide Biosynthesis", "Peptides", "Progesterone", "Rats", "Rats, Sprague-Dawley", "Testosterone", "Thyroid Hormones", "Time Factors", "Transcription, Genetic", "Tretinoin", "Tumor Necrosis Factor-alpha"], "year": "1995", "doi": "10.1006/bbrc.1995.1866"}], "pubmed_query": "(\"adrenal gland\"[Title] OR \"adrenal cortex\"[Title] OR \"adrenal medulla\"[Title] OR \"adrenocortical\"[Title] OR \"HPA axis\"[Title] OR \"hypothalamic-pituitary-adrenal\"[Title]) AND (\"skeletal muscle\"[Title] OR \"muscle\"[Title] OR \"myocyte\"[Title] OR \"myofiber\"[Title] OR \"sarcopenia\"[Title] OR \"muscular\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Adrenal Glands__Pancreas", "source": "Adrenal Glands", "target": "Pancreas", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: Cortisol, insulin\nNotes: Cortisol lowers insulin production in the pancreas.\nSources:\n- DOI: 10.5772/intechopen.1003161", "connection_type": "Hormonal connection", "key_players": ["Cortisol", "insulin"], "key_players_metabolites": ["glucose", "arginine", "amino acid", "fatty acids", "amp", "glutamate", "alanine", "glycogen", "beta-hydroxybutyrate", "amino acids", "lactate", "free fatty acids", "serine"], "key_players_hormones": ["insulin", "acth", "glucagon", "growth hormone", "glucocorticoid", "cortisol", "somatostatin", "aldosterone", "vasopressin", "corticosterone", "pyy", "thyroxine", "gastrin", "testosterone", "renin", "noradrenaline", "epinephrine", "motilin"], "key_players_proteins": ["acc"], "key_players_counts_metabolites": {"amp": 2, "glycogen": 1, "beta-hydroxybutyrate": 1, "amino acids": 1, "glucose": 49, "glutamate": 2, "lactate": 1, "free fatty acids": 1, "arginine": 4, "amino acid": 3, "fatty acids": 3, "serine": 1, "alanine": 2}, "key_players_counts_hormones": {"testosterone": 1, "glucocorticoid": 7, "pyy": 2, "thyroxine": 2, "gastrin": 2, "aldosterone": 3, "glucagon": 9, "acth": 19, "cortisol": 7, "growth hormone": 8, "renin": 1, "noradrenaline": 1, "insulin": 41, "epinephrine": 1, "vasopressin": 3, "motilin": 1, "corticosterone": 3, "somatostatin": 6}, "key_players_counts_proteins": {"acc": 2}, "notes": "Cortisol lowers insulin production in the pancreas.", "sources": ["DOI: 10.5772/intechopen.1003161"], "ai_de
