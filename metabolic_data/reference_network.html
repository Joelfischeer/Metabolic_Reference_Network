tabolites": {"methionine": 1, "cholesterol": 1, "ammonia": 1, "sphingolipid": 3, "propionate": 3, "amp": 2, "atp": 1, "bile acids": 12, "amino acids": 5, "glucose": 15, "galactose": 10, "fatty acid": 21, "glutamate": 6, "leucine": 2, "arginine": 1, "butyrate": 35, "free fatty acid": 1, "amino acid": 7, "ceramide": 2, "acetate": 6, "triglyceride": 1, "fatty acids": 22, "fructose": 18, "deoxycholic acid": 2, "serine": 1, "bile acid": 9}, "key_players_counts_hormones": {"tnf": 11, "cck": 4, "testosterone": 1, "glucocorticoid": 3, "pyy": 7, "fgf21": 1, "gastrin": 1, "interleukin-1": 1, "glucagon": 7, "oxytocin": 1, "il-4": 4, "norepinephrine": 2, "cortisol": 3, "cnp": 1, "estrogen": 2, "insulin": 11, "apelin": 3, "il-10": 5, "fsh": 2, "tumor necrosis factor": 1, "fgf19": 1, "irisin": 1, "lh": 1, "leptin": 2, "motilin": 3, "glp-1": 6, "corticosterone": 3, "il-6": 12, "ghrelin": 12, "somatostatin": 1, "amylin": 1, "interleukin-6": 1}, "key_players_counts_proteins": {"mapk": 1, "pi3k": 6, "foxo1": 1, "mtorc1": 5, "p38": 1, "akt": 6, "tgr5": 15, "sglt1": 2, "foxo": 1, "ampk": 2, "sirt1": 1, "fxr": 2, "acc": 4, "mtor": 3, "glp1r": 1}, "notes": "Gut-Brain axis regulates glucose production.", "sources": ["DOI: 10.1016/j.cmet.2017.04.032", "DOI: 10.1038/nature06852", "https://doi.org/10.1038/s41467-021-21235-y"], "ai_description": "The brain-small intestine axis is mediated by the gut-brain axis, where the gut microbiota produces metabolites such as short-chain fatty acids [1] that are detected by the vagus nerve and released into the bloodstream, ultimately reaching the brain via the hypothalamic-pituitary-adrenal (HPA) axis. The gut microbiota also influences the production of neurotransmitters, such as serotonin and dopamine, through the tryptophan-kynurenine pathway [3], which is linked to Parkinson's disease pathophysiology. Furthermore, the gut-lung-brain axis plays a role in Clozapine-associated pneumonia, highlighting the interconnectedness of these organs [2]. The gut microbiota also modulates inflammation and oxidative stress, as seen in fibromyalgia, where canagliflozin has been shown to attenuate Parkinson's disease symptoms by targeting the gut-inflammasome-brain axis [3].", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42330779", "title": "Probiotic, prebiotic, and synbiotic interventions targeting the early-life gut-brain axis: A systematic review of randomized controlled trials.", "abstract": "Early life represents a critical window for maturation of the gut microbiota, mucosal immunity, and neuroimmune pathways underpinning the gut-brain axis (GBA). Probiotic, prebiotic, and synbiotic interventions have been proposed to modulate these processes; however, their mechanistic effects on GBA-relevant biomarkers in humans remain unclear. We conducted a systematic review of randomized controlled trials (RCTs) evaluating microbiota-directed interventions in infants aged 0-36&#xa0;months, focusing on biological pathways implicated in gut-brain communication. Searches of PubMed/MEDLINE, Scopus, and Web of Science identified six eligible RCTs including 1148 randomized participants, of whom 923 contributed data to at least one GBA-relevant biomarker. Outcomes were synthesized across six mechanistic domains: intestinal microbiota composition and functional proxies, microbial metabolites, mucosal immunity, systemic cytokines, intestinal inflammation and permeability, and hypothalamic-pituitary-adrenal (HPA) axis activity. Across trials, interventions were associated with localized mucosal effects, including selective enrichment of Bifidobacterium and Lactobacillus, modest reductions in fecal pH, and modest, variably reported increases in fecal secretory sIgA. In contrast, short-chain fatty acids (SCFAs) were inconsistently reported and showed no robust between-group differences. Systemic cytokines, fecal calprotectin, permeability markers, basal salivary cortisol, and neurodevelopmental outcomes remained unchanged. Methodological heterogeneity, frequent values below assay detection limits, and developmental variability precluded quantitative meta-analysis. Available RCT evidence, although limited and heterogeneous, suggests that early-life microbiota-directed interventions may be associated with compartmentalized microbial and mucosal immune modulation without measurable propagation to systemic neuroimmune or neurodevelopmental pathways in healthy or mildly symptomatic infants. These findings support a model of developmental neuroimmune gating within the early-life GBA, defined here as the physiological restriction of signal propagation from mucosal to systemic and central pathways during early life, and highlight the need for standardized biomarker frameworks, dynamic neuroendocrine assessments, and studies in higher-risk populations to clarify mechanistic relevance.", "keywords": [], "year": "2026", "doi": "10.1016/j.jneuroim.2026.579005"}, {"pmid": "42329321", "title": "Clozapine-associated pneumonia: a gut-lung-brain axis perspective.", "abstract": "", "keywords": [], "year": "2026", "doi": "10.1007/s00406-026-02297-9"}, {"pmid": "42329290", "title": "Canagliflozin attenuates Parkinson's disease and is associated with modulation of gut-inflammasome-brain axis in rats.", "abstract": "Recent evidence links gut dysbiosis and the gut-brain axis to the pathophysiology of Parkinson's disease (PD), which is considered one of the most common neurodegenerative illnesses and is characterized by motor symptoms and a gradual loss of nigral dopaminergic neurons. Canagliflozin (CANA), a sodium-glucose cotransporter-2 inhibitor with emerging anti-inflammatory and antioxidant properties, has recently gained attention for its neuroprotective effects beyond glycemic control. This research aimed to examine the neuroprotective potential of CANA in a rat model of PD, focusing on its potential effect on the gut-inflammasome-brain axis. Rats were treated with rotenone&#xa0;(ROT) (2&#xa0;mg/kg, subcutaneous) and/or CANA (20&#xa0;mg/kg, oral) for 30 consecutive days. Behavioral assessment (n&#x2009;=&#x2009;13), biochemical assays (n&#x2009;=&#x2009;6), and histological and immunohistochemical analysis (n&#x2009;=&#x2009;3) were performed. Microbiome profiling (n&#x2009;=&#x2009;3) using 16S rRNA amplicon sequencing was conducted using three pooled fecal samples/group, with each pool prepared from fecal material collected from three rats and fecal metabolomic profiling (n&#x2009;=&#x2009;5) was performed to assess microbial metabolites. ROT intoxication caused significant motor impairments, including decreased locomotor activity, poor coordination, and increased catalepsy. Further histological examination demonstrated dopaminergic neuronal loss and &#x3b1;-synuclein aggregation in the substantia nigra and striatum. CANA treatment enhanced motor function, conserved neuronal integrity, and decreased &#x3b1;-synuclein accumulation. Moreover, ROT altered the gut microbiota with selective taxonomic shifts, including enriched abundance of Parabacteroides and Ruminococcaceae with depleted Prevotella-related taxa, in addition to fecal metabolite profile alteration. Consequently, it increased colonic oxidative stress and weakened tight junctions, all of which enhanced LPS translocation. This systemic endotoxemia generated oxidative stress, dyslipidemia, and NF-&#x3ba;B/NLRP3 inflammasome activation. Conversely, CANA restored gut microbial balance and their metabolites, and gut integrity, decreased LPS leakage, and reduced systemic and central oxidative stress and inflammation, preventing inflammasome activation and &#x3b1;-synuclein aggregation. Collectively, these findings suggest that CANA may exert neuroprotective effects in ROT-induced PD associated with modulating the gut-inflammasome-brain axis.", "keywords": [], "year": "2026", "doi": "10.1007/s10787-026-02292-5"}, {"pmid": "42328953", "title": "The microbiota-gut-brain axis in fibromyalgia: a scoping review.", "abstract": "Fibromyalgia (FM) is a nociplastic pain condition characterised by widespread pain, fatigue, cognitive dysfunction and multisystem involvement. Increasing evidence implicates the microbiota-gut-brain axis (MGBA) as a potential contributor to its complex pathophysiology. This scoping review maps contemporary evidence (2020-2026) on MGBA alterations in FM across microbial, metabolic, neuroimmune and translational dimensions. This review was conducted following the Arksey and O'Malley framework, as refined by Levac et al. and the Joanna Briggs Institute, and reported in accordance with PRISMAScR guidelines. A systematic search of PubMed/MEDLINE, EMBASE, Web of Science and Scopus identified studies published between January 2020 and March 2026. Eligible studies included primary clinical, translational and preclinical investigations evaluating microbiota composition, microbial metabolites, intestinal permeability, neuroimmune signalling, or microbiometargeted interventions in FM. Narrative and systematic reviews were used only to contextualise findings and were not counted among the included studies. Of 1,365 records identified, 39 studies were included in the final synthesis. Across studies, findings were heterogeneous but most frequently described alterations in gut microbiota composition, including reduced diversity and depletion of butyrate-producing taxa such as Faecalibacterium prausnitzii, along with shifts in Bifidobacterium and Prevotella. Key metabolic perturbations encompassed reduced short-chain fatty acid production and dysregulated tryptophan metabolism. Increased intestinal permeability and activation of neuroimmune pathways were additionally documented. Microbiota profiles were associated with clinically relevant outcomes including pain intensity, fatigue, and cognitive dysfunction. Interventional evidence remains limited but suggests emerging therapeutic potential. The MGBA represents a biologically plausible and integrative framework for FM, linking peripheral and central mechanisms. Current evidence remains heterogeneous and largely associative. Future research should prioritise longitudinal, mechanistically driven studies to advance microbiome-informed diagnostic and therapeutic strategies.", "keywords": ["Humans", "Fibromyalgia", "Gastrointestinal Microbiome", "Brain-Gut Axis", "Brain", "Animals", "Nociplastic Pain"], "year": "2026", "doi": "10.55563/clinexprheumatol/5yhjub"}, {"pmid": "42328654", "title": "Polygonatum sibiricum combined with Poria cocos prevents spleen deficiency constipation via the gut microbiota-mediated brain-gut axis.", "abstract": "The study evaluates the preventive effects of Polygonatum sibiricum and Poria cocos (3:1) on spleen deficiency constipation in mice, focusing on the brain-gut axis, gut microbiota, and oxidative stress. The findings aim to inform the prevention and treatment of this condition. Thirty male specific pathogen-free (SPF) KM mice (4 weeks old, 20 &#xb1; 2&#xa0;g) were randomized into a normal control group (NC), a model group (NM), and a Polygonatum sibiricum and Poria cocos group (HF). Serum levels of 5-hydroxytryptamine (5-HT), cholecystokinin (CCK), motilin (MTL), and vasoactive intestinal peptide (VIP) were measured by ELISA. Liver superoxide dismutase (SOD) activity and malondialdehyde (MDA) content were measured by a spectrophotometer. Gut microbiota was analyzed by 16S rRNA sequencing. Compared to NM, the HF showed significantly increased 5-HT, CCK( p &lt; 0.05), and MTL ( p &lt; 0.001), and significantly decreased VIP( p &lt; 0.05). Liver MDA content was markedly higher in NM than in NC( p &lt; 0.01), with a downward trend in HF. Conversely, the liver SOD activity in NM was significantly lower than in NC( p &lt; 0.001), and the HF displayed an upward trend. Microbiota analysis revealed higher diversity in HF, as indicated by higher chao1, pielou_e, shannon, and simpson indices. The gut microbiota species composition in the HF was dominated by beneficial bacteria such as Bacteroidota and Faecalibaculum , with a reduction in pathogenic bacteria such as Proteobacteria and Escherichia-Shigella . The characteristic gut microbiota of the NM was enriched in Escherichia-Shigella and its conditional pathogens, while the characteristic gut microbiota of the HF was enriched in beneficial symbiotic bacteria such as Akkermansia , Blautia, and Bifidobacterium . The metabolic pathways and the genetic information processing pathway were improved in the HF, and the DNA repair and recombination protein pathways were also repaired. The P. sibiricum and P. cocos combination effectively prevents spleen deficiency constipation, an effect associated with the brain-gut axis and gut microbiota. The observed trends in oxidative stress markers warrant further investigation.", "keywords": [], "year": "2026", "doi": "10.3389/fphar.2026.1793441"}, {"pmid": "42326835", "title": "Erratum: The prairie vole gut-brain-microbiota-axis: a narrative review - CORRIGENDUM.", "abstract": "[This corrects the article DOI: 10.1017/gmb.2026.10021.].", "keywords": [], "year": "2026", "doi": "10.1017/gmb.2026.10029"}, {"pmid": "42326011", "title": "Early life stress and the pathogenesis of visceral hypersensitivity: mechanisms and implications for disorders of gut-brain interaction.", "abstract": "Early life stress (ELS) is a major risk factor for disorders of gut-brain interaction (DGBIs), particularly irritable bowel syndrome (IBS), through the induction of persistent visceral hypersensitivity. This review synthesizes evidence from epidemiological studies, clinical observations, and preclinical models to establish ELS-induced visceral hypersensitivity as a core pathophysiological axis. I delineate the multi-level mechanisms underlying this phenomenon, encompassing: (1) central neuroendocrine dysregulation (hypothalamic-pituitary-adrenal axis, corticotropin-releasing factor signaling) with epigenetic modifications (histone acetylation, non-coding RNAs) in limbic circuits; (2) spinal sensitization via brain-derived neurotrophic factor upregulation, glutamate transporter dysfunction, and potassium channel downregulation; (3) peripheral alterations including enterochromaffin cell hyperplasia, mast cell activation, enteric glial phenotypic switching, barrier disruption, and microbiota dysbiosis. I highlight critical modifiers including sexual dimorphism (estrogen-dependent mechanisms) and resilience factors (benevolent childhood experiences, environmental enrichment). Finally, I present a translational roadmap integrating pharmacological, nutritional, and behavioral interventions targeting ELS-programmed dysfunction along the brain-gut axis, emphasizing opportunities for prevention and precision medicine.", "keywords": [], "year": "2026", "doi": "10.3389/fcell.2026.1827148"}, {"pmid": "42325915", "title": "Neurohormonal-Immune Dysregulation in Rosacea: Emerging Perspectives from the Skin-Gut-Brain Axis.", "abstract": "Rosacea is a chronic inflammatory skin disease with a global prevalence of approximately 5.1%. Existing evidence suggests that its pathogenesis may be associated with dysregulation of the neuro-hormone-immune network within the skin-gut-brain axis framework. This review summarizes the potential roles of stress hormones, sex hormones, and insulin-like growth factor-1 in the four major subtypes. In erythematotelangiectatic rosacea, glucocorticoid resistance within keratinocytes may induce CCL20-driven Th17 inflammation, while catecholamines released by sympathetic nerves are associated with neurovascular flushing. In papulopustular rosacea, androgen excess, relative estrogen deficiency, LL-37-mediated innate immune activation, and gut microbiota dysbiosis may collectively contribute to the formation of inflammatory skin lesions.In the phymatous type, insulin-like growth factor-1 and androgens may interact through the PI3K/Akt/mTOR and FoxO1 pathways, promoting sebaceous gland hyperplasia and fibrosis. Ocular rosacea is associated with gut-derived low-grade systemic inflammation and neurogenic inflammation. For treatment, &#x3b2;-receptor blockers such as carvedilol and selective serotonin reuptake inhibitors such as paroxetine can be used for erythematotelangiectatic rosacea; anti-androgen drugs like spironolactone and metformin may be explored for papulopustular rosacea; metformin for the phymatous type; and for ocular rosacea, topical corticosteroids can be used cautiously for a short term under ophthalmological supervision. Adjunctive interventions such as eradication of small intestinal bacterial overgrowth, a low glycemic index diet, and mindfulness-based stress reduction therapy also demonstrate potential.Taken together, existing evidence supports viewing rosacea as a systemic disease potentially mediated by the skin-gut-brain axis and characterized by dysregulation of the neuro-hormone-immune network. However, more high-quality randomized controlled trials and stratified studies guided by hormone-related biomarkers are currently needed to further validate its mechanisms and advance precision treatment.", "keywords": ["Humans", "Rosacea", "Skin", "Brain", "Animals", "Neurotransmitter Agents"], "year": "2026", "doi": "10.2147/DDDT.S608151"}, {"pmid": "42325435", "title": "The gut-brain axis in Alzheimer's disease: early detection, microbial metabolites, mechanisms, and therapeutic opportunities.", "abstract": "Alzheimer's disease (AD), the leading cause of dementia worldwide, imposes a growing clinical and societal burden, yet no therapies have been proven to alter its progression despite decades of intensive research. As traditional targets have yielded limited success, attention has shifted to modifiable upstream pathways, notably the gut-brain axis, a bidirectional system linking gut microbiota with CNS function. Emerging evidence indicates that microbial dysbiosis may influence key processes leading to AD, including neuroinflammation, amyloid and tau pathology, and cognitive decline. While microbiome composition is associated with AD, it remains unclear at which stage-preclinical, mild cognitive impairment (MCI), or AD dementia-these differences first arise, or how specific risk bacteria and metabolites contribute to progression. The precise roles of these microbes and metabolites in AD pathology or brain resilience also remain poorly understood, and few microbiome-targeted treatments have been validated in humans. Existing reviews often overlook host-specific factors that influence microbiome composition and confound associations with AD. To bridge these gaps, we summarize human studies published in the past 5 years. The literature suggests that gut microbial changes may precede clinical symptoms, with consistent dysbiosis observed in AD patients. We adopt a microbiome-centered perspective emphasizing bacteria-driven and metabolite-driven mechanisms, each playing distinct yet complementary roles in neural and bloodstream pathways. These pathways offer potential targets for microbiome-based prevention and treatment but require more human validation. Future studies should leverage longitudinal, multi-omics approaches and artificial intelligence (AI) tools while rigorously accounting for confounders to improve early detection and develop personalized therapies for AD.", "keywords": [], "year": "2026", "doi": "10.3389/fmolb.2026.1735332"}, {"pmid": "42324594", "title": "Editorial: Rifaximin and the Gut-Liver-Brain Axis-Progress and Prudence.", "abstract": "", "keywords": [], "year": "2026", "doi": "10.1111/apt.70809"}], "pubmed_query": "(\"brain\"[Title] OR \"cerebral\"[Title] OR \"hypothalamus\"[Title] OR \"hypothalamic\"[Title] OR \"central nervous system\"[Title] OR \"CNS\"[Title] OR \"neuronal\"[Title]) AND (\"small intestine\"[Title] OR \"duodenum\"[Title] OR \"jejunum\"[Title] OR \"ileum\"[Title] OR \"intestinal\"[Title] OR \"gut\"[Title] OR \"enterocyte\"[Title] OR \"Peyer's patches\"[Title] OR \"gut-brain axis\"[Title] OR \"enter  axis, gut microbiota, and oxidative stress. The findings aim to inform the prevention and treatment of this condition. Thirty male specific pathogen-free (SPF) KM mice (4 weeks old, 20 &#xb1; 2&#xa0;g) were randomized into a normal control group (NC), a model group (NM), and a Polygonatum sibiricum and Poria cocos group (HF). Serum levels of 5-hydroxytryptamine (5-HT), cholecystokinin (CCK), motilin (MTL), and vasoactive intestinal peptide (VIP) were measured by ELISA. Liver superoxide dismutase (SOD) activity and malondialdehyde (MDA) content were measured by a spectrophotometer. Gut microbiota was analyzed by 16S rRNA sequencing. Compared to NM, the HF showed significantly increased 5-HT, CCK( p &lt; 0.05), and MTL ( p &lt; 0.001), and significantly decreased VIP( p &lt; 0.05). Liver MDA content was markedly higher in NM than in NC( p &lt; 0.01), with a downward trend in HF. Conversely, the liver SOD activity in NM was significantly lower than in NC( p &lt; 0.001), and the HF displayed an upward trend. Microbiota analysis revealed higher diversity in HF, as indicated by higher chao1, pielou_e, shannon, and simpson indices. The gut microbiota species composition in the HF was dominated by beneficial bacteria such as Bacteroidota and Faecalibaculum , with a reduction in pathogenic bacteria such as Proteobacteria and Escherichia-Shigella . The characteristic gut microbiota of the NM was enriched in Escherichia-Shigella and its conditional pathogens, while the characteristic gut microbiota of the HF was enriched in beneficial symbiotic bacteria such as Akkermansia , Blautia, and Bifidobacterium . The metabolic pathways and the genetic information processing pathway were improved in the HF, and the DNA repair and recombination protein pathways were also repaired. The P. sibiricum and P. cocos combination effectively prevents spleen deficiency constipation, an effect associated with the brain-gut axis and gut microbiota. The observed trends in oxidative stress markers warrant further investigation.", "keywords": [], "year": "2026", "doi": "10.3389/fphar.2026.1793441"}, {"pmid": "42321169", "title": "Disruption of the brain-spleen axis impairs monocyte-microglia communication and accelerates disease progression in a mouse model of amyloidosis.", "abstract": "Alzheimer's disease (AD) is characterized by a prolonged asymptomatic phase before cognitive decline emerges, yet the mechanisms driving symptom onset remain unclear. Here, we hypothesized that the transition from asymptomatic to symptomatic disease is linked to dysfunction of brain-immune communication. Retrograde neuronal tracing in the 5xFAD mouse model of amyloidosis reveals reduced brain-spleen connectivity at advanced disease stages. To probe the functional role of the brain-spleen axis in coping with disease, we denervated the splenic nerve at an early presymptomatic stage. This intervention accelerated cognitive decline, impaired splenic hematopoiesis, diminished monocyte recruitment to the brain, disrupted monocyte-microglia signaling networks, and reduced the transition of microglia from a homeostatic to a disease-associated (DAM) state. Conversely, enhancing splenic noradrenergic input increased hematopoiesis, restored monocyte homing to the brain, and delayed cognitive impairment. The protective role of splenic monocytes was independently validated in a retinal cytotoxic injury model, in which splenic denervation impairs post-insult survival of retinal ganglion cells. Together, these findings identify an active brain-spleen circuit in&#xa0;regulating monocyte recruitment, and establish peripheral monocytes as important drivers of microglial state transitions and disease progression.", "keywords": [], "year": "2026", "doi": "10.1038/s41467-026-74253-z"}, {"pmid": "42285095", "title": "Piriform cortex gates learned fear through a brain-spleen neuroimmune axis.", "abstract": "Maladaptive learned fear responses to stress underlie several debilitating neuropsychiatric disorders. Here, we identify a brain-to-spleen neural pathway that mediates learned fear through coordinated neuroimmune interactions. Using a chronic acquired olfactory stress (CAOS) model, we demonstrate that sustained enhancement of the piriform cortex (Pir) excitability contributes to the transformation of stress-associated olfactory inputs into learned fear-avoidance behavior. Through comprehensive neural tracing approaches, we mapped a functional tetrasynaptic circuit (Pir&#x2192;ventral hippocampus CA1 subregion [vCA1]&#x2192;CeM&#x2192;DVC&#x2192;spleen) regulating T helper 17 (Th17) cell-dependent fear responses. Single-nucleus RNA sequencing revealed that olfactomedin 3-expressing glutamatergic neurons in the Pir integrate olfactory stress inputs to activate this pathway. Importantly, targeted disruption of this circuit through either conditional knockdown of Olfm3 within Pir&#x2192;vCA1 projecting glutamatergic neurons or chemogenetic inhibition of these projections eliminated CAOS-induced splenic Th17 cell expansion and fear avoidance. These findings provide fundamental insights into how learned fear becomes maladaptive by identifying a complete neural circuit linking olfactory perception to peripheral immunity.", "keywords": [], "year": "2026", "doi": "10.1016/j.neuron.2026.05.023"}, {"pmid": "42262616", "title": "Splenic treg-related immunoregulation in the spleen-brain axis of alzheimer's disease: mechanisms and translational strategies.", "abstract": "Alzheimer's disease (AD) is traditionally characterized by amyloid-&#x3b2; (A&#x3b2;) plaque deposition, tau pathology, and neuroinflammation in the brain. Increasing evidence highlights the contribution of systemic immune dysregulation to AD progression, in which the spleen may serve as an important peripheral immune organ for sensing and integrating circulating signals. Splenic regulatory T cells (Tregs) contribute to immune tolerance and may shape myeloid-cell inflammatory and phagocytic functions, positioning them as potential modulators of how peripheral immune responses influence brain pathology. During AD progression, alterations in splenic Tregs may be associated with impaired systemic clearance and delayed resolution of inflammation, thereby potentially amplifying the crosstalk between peripheral and central pathological processes. This review synthesizes current knowledge on the spleen-brain axis, discusses potential mechanisms by which splenic Tregs regulate peripheral immune homeostasis, and highlights therapeutic strategies that leverage Treg-mediated immunoregulation to modulate AD-related pathological processes. These insights provide a foundation for exploring whether interventions that modulate splenic Treg function may influence disease progression in AD.", "keywords": ["Alzheimer Disease", "T-Lymphocytes, Regulatory", "Humans", "Spleen", "Brain", "Animals", "Amyloid beta-Peptides"], "year": "2026", "doi": "10.1007/s11033-026-12088-z"}, {"pmid": "42250115", "title": "Angiotensin II Receptor Signaling in the Hypothalamic-Pituitary-Adrenal Axis and Spleen After Spinal Cord Injury Depends on the Sympathetic Innervation Integrity.", "abstract": "Spinal cord injury (SCI) disrupts the integrated neuroendocrine network linking the hypothalamic-pituitary-adrenal (HPA) axis, renin-angiotensin-aldosterone system, and sympathetic nervous system, resulting in endocrine and immune dysfunction. However, the effects of SCI on angiotensin II receptor signaling remain unclear. This study investigated temporal and lesion-dependent changes in angiotensin II type 1 (AT 1 ) and type 2 (AT 2 ) receptor expression following SCI in rats. Low-thoracic SCI (Th9 compression, 40&#xa0;g/15 min) was evaluated over 28 days, while acute responses to partial (Th9) versus near-complete (Th1) sympathoadrenal denervation were compared. Receptor expression was assessed in the hypothalamic paraventricular nucleus, pituitary, adrenal gland, and spleen, and correlated with hormonal and morphological alterations. Surgical stress alone activated systemic angiotensin II signaling. Low-thoracic SCI induced time- and tissue-specific changes in angiotensin receptor expression independent of circulating angiotensin II levels, indicating adaptive remodeling of HPA axis sensitivity. SCI caused transient adrenal enlargement, zona fasciculata hypertrophy, dysregulated HPA axis activity, angiotensin II-independent aldosterone production, and altered catecholamine secretion. Splenic AT 1 receptor expression showed early upregulation followed by compensatory downregulation, consistent with dynamic neuroimmune modulation. In contrast, high-thoracic SCI markedly reduced receptor expression across central and peripheral HPA axis components and the spleen, accompanied by decreased corticotropin-releasing hormone, aldosterone, and norepinephrine, stable adrenocorticotropic hormone, and elevated corticosterone and epinephrine. These findings demonstrate that the extent of sympathetic disruption critically determines neuroendocrine-immune responses after SCI and identify sympathetic innervation as a key regulator of angiotensin receptor balance and stress-axis homeostasis following spinal cord trauma.", "keywords": [], "year": "2026", "doi": "10.1007/s10571-026-01760-4"}, {"pmid": "42069173", "title": "Spleen-brain axis regulates myelin integrity via TGF-&#x3b2;1 signaling in cuprizone-induced demyelination and remyelination model.", "abstract": "Demyelination and impaired remyelination are hallmark features of many neurodegenerative and psychiatric disorders. Although central mechanisms have been widely investigated, the contribution of peripheral immune organs such as the spleen remains poorly understood. In this study, we examined the role of the spleen and transforming growth factor-&#x3b2;1 (TGF-&#x3b2;1) in cuprizone (CPZ)-induced demyelination and remyelination in mice. Splenectomy performed before CPZ exposure significantly worsened demyelination in the corpus callosum, as indicated by reduced myelinated area and myelin basic protein (MBP) intensity. Likewise, splenectomy immediately after CPZ withdrawal markedly impaired remyelination during the recovery phase. Immunohistochemical analysis showed that splenectomy reduced TGF-&#x3b2;1 expression in the corpus callosum at both 2 and 7 weeks after surgery. Moreover, systemic administration of a neutralizing anti-TGF-&#x3b2;1 antibody during either the demyelination or remyelination phase reproduced the effects of splenectomy, resulting in greater myelin loss or reduced myelin repair, respectively. Antibody treatment significantly decreased TGF-&#x3b2;1 levels in both brain and plasma, which were positively correlated with the degree of myelination. Together, these findings reveal a previously unrecognized role of the spleen in preserving myelin integrity and facilitating repair through TGF-&#x3b2;1 signaling. They further suggest that the spleen-brain axis contributes to myelin homeostasis and that peripheral TGF-&#x3b2;1 may represent a potential biomarker and therapeutic target for demyelinating disorders.", "keywords": ["Animals", "Cuprizone", "Transforming Growth Factor beta1", "Demyelinating Diseases", "Myelin Sheath", "Signal Transduction", "Spleen", "Remyelination", "Mice", "Male", "Brain", "Corpus Callosum", "Disease Models, Animal", "Mice, Inbred C57BL", "Splenectomy"], "year": "2026", "doi": "10.1016/j.ejphar.2026.178915"}, {"pmid": "41778859", "title": "The spleen-brain axis in Alzheimer's disease and related dementias: Integrating immune and metabolic regulation.", "abstract": "Emerging evidence highlights the central role of peripheral immune-metabolic regulation in the pathogenesis of Alzheimer's disease and related dementias (ADRD). Among peripheral organs, the spleen has gained increasing attention as a critical immune-metabolic hub linking systemic homeostasis to central neurodegeneration. This review systematically elucidates the regulatory functions of the spleen-brain axis from three complementary perspectives: (1) structural remodeling and immunopathological alterations of the spleen in ADRD; (2) spleen-driven immunometabolic crosstalk, which integrates immune function with iron homeostasis, glucolipid metabolism, and amino acid turnover, contributing to the progression of neurodegenerative pathology; and (3) key molecular pathways mediating immune-metabolic crosstalk, such as Toll-like receptor 4 (TLR4)-nuclear factor kappa-light-chain-enhancer of activated B cells (NF-&#x3ba;B), NLR family pyrin domain containing 3 (NLRP3) inflammasome, high-mobility group box 1 (HMGB1)-receptor for advanced glycation end-products (RAGE), and Janus kinase/signal transducer and activator of transcription protein (JAK/STAT) signaling. We systematically elucidate how splenic dysfunction drives a positive feedback loop involving systemic inflammation, metabolic disorder, and neuroinflammation. This novel perspective, which views the spleen as an integrated immune-metabolic regulator, highlights spleen-targeted interventions as a potential therapeutic strategy for ADRD.", "keywords": ["Humans", "Alzheimer Disease", "Spleen", "Brain", "Animals", "Dementia", "Signal Transduction"], "year": "2026", "doi": "10.1002/alz.71243"}, {"pmid": "41645849", "title": "Oral Magnetoelectric Neuroimmunomodulation via the Gut-Brain-Spleen-Heart Axis for Noninvasive Atrial Fibrillation Therapy.", "abstract": "Atrial fibrillation (AF), the most common cardiac arrhythmia, is closely associated with autonomic imbalance and inflammation. While low-level vagus nerve stimulation (LL-VNS) offers therapeutic benefits, its clinical application is limited by the need for surgical implants. Here, we present a noninvasive, orally delivered magnetoelectric neuroimmunomodulation platform that targets the gut-brain-spleen-heart axis to deliver LL-VNS for AF therapy. The platform comprises ingestible microparticles (MPs) embedding magnetostrictive Fe 3 O 4 @BaTiO 3 nanogenerators (FO@BTO NGs) within a conductive matrix of poly(3,4-ethylenedioxythiophene):poly(styrenesulfonate) (PEDOT:PSS), which facilitates electrical signal transmission, and dopamine-alginate, which promotes gastric adhesion via catechol-mediated interactions. After oral gavage in a rat AF model, MPs adhere to the stomach lining and, upon alternating magnetic activation, FO@BTO NGs generate pulsed electrical currents that stimulate vagal afferent fibers. This activates brainstem autonomic circuits, enhancing parasympathetic tone and suppressing sympathetic activity. Concurrently, it engages the splenic neuroimmune circuit via the cholinergic anti-inflammatory pathway, thereby reducing systemic inflammation. This dual neuroimmune modulation significantly shortens AF duration and mitigates cardiac inflammation and electrical remodeling. These findings establish a clinically translatable, implant-free strategy for delivering LL-VNS through coordinated neural and immune pathways, offering a safe and accessible alternative to implantable systems for AF management.", "keywords": ["Animals", "Atrial Fibrillation", "Brain", "Spleen", "Administration, Oral", "Rats", "Polystyrenes", "Neuroimmunomodulation", "Barium Compounds", "Heart", "Male", "Polymers", "Rats, Sprague-Dawley", "Vagus Nerve Stimulation", "Gastrointestinal Tract", "Thiophenes", "Titanium"], "year": "2026", "doi": "10.1002/adma.202516956"}, {"pmid": "41508224", "title": "[Treatment of Alzheimer's disease from gut-brain interactions based on theory of \"spleen deficiency leading to obstruction of nine orifices\"].", "abstract": "Alzheimer's disease(AD) is the most common form of dementia. The decline in sensory function is associated with pathological damage in specific brain regions during the early stages of AD. Such decline often precedes cognitive impairment, worsens as the pathology progresses, and constitutes a high-risk factor for the onset of AD. According to traditional Chinese medicine(TCM), all orifices are connected to the brain, and the brain governs all orifices. The mind originates from and depends on both the brain and orifices, with their physiological and pathological states being closely interconnected. In AD, dysfunction of the sensory orifices is closely linked to the later-stage manifestations of impaired mental clarity and consciousness. The theory that &amp;quot;spleen deficiency leading to obstruction of nine orifices&amp;quot; emphasizes that insufficiency of the spleen and stomach is the root cause of orifice dysfunction. Both internal and external pathogenic factors in AD can damage the spleen and stomach, leading to the abnormal movement of turbid substances generated by these organs, which may transform into turbid toxins. This, in turn, gradually impairs the orifices, brain, and mind, thereby exacerbating the progression of AD. The digestive, absorptive, and transport functions of the spleen and stomach are similar to those of the gut microbiota. Spleen deficiency is a core pathological factor in diseases associated with gut microbiota dysbiosis. Such dysbiosis can lead to dysfunction in the neural, metabolic, and immune pathways involved in gut-brain interactions, constituting the biological basis for the TCM concept that &amp;quot;spleen deficiency leading to obstruction of nine orifices&amp;quot;. Under the guidance of this theory, employing spleen-strengthening and cognition-enhancing drugs alongside aromatic orifice-opening drugs to support spleen function, and using ingredients that promote dampness elimination, lubrication, and blood stasis resolution to dispel pathogenic factors from the orifices, can help restore the structural balance of the gut microbiota, regulate related metabolic and immune dysfunctions, and ultimately delay the progression of AD. This article explores the etiology, pathogenesis, and therapeutic strategies of AD based on the theory of &amp;quot;spleen deficiency leading to obstruction of nine orifices&amp;quot;, and interprets its biological significance from the perspective of gut-brain interactions, aiming to provide new insights for the prevention and treatment of AD.", "keywords": ["Alzheimer Disease", "Humans", "Brain", "Spleen", "Animals", "Medicine, Chinese Traditional", "Drugs, Chinese Herbal", "Gastrointestinal Microbiome"], "year": "2025", "doi": "10.19540/j.cnki.cjcmm.20250618.501"}, {"pmid": "41453507", "title": "Spleen-derived immune cells potentiate cerebral ischemia-reperfusion injury through brain-spleen communication.", "abstract": "Immune and inflammatory responses play a major role in cerebral ischemia-reperfusion injury (CIRI). The spleen participates in the regulation of immune and inflammatory responses. However, the exact mechanism through which the spleen participates in CIRI remains unclear. The goal of this study is to explore the brain-spleen communication mechanism in CIRI. Transient middle cerebral artery occlusion model (tMCAO) was performed in rats. Dynamic observation of brain injury severity was performed using neurological function scoring and TTC staining. Changes in spleen morphology, immune cells in spleen and brain infiltrating immune cells were observed by weighing method and flow cytometry. Subsequently, the splenectomy experiments further confirmed the role of immune cells as intermediaries in brain-spleen communication. The results demonstrated that the spleen exhibited a biphasic \"V\"-shaped curve, characterized by marked atrophy during the acute phase followed by a return to baseline levels. This change was significantly correlated with the degree of brain injury. Flow cytometry and correlation analysis showed that splenic atrophy was accompanied by the release of splenic T cells and NKT cells into brain tissue, exacerbating neuroinflammatory responses. After splenectomy, the proportion of immune cells in the brain tissue decreased, and the degree of brain injury was significantly reduced. Our research results indicate that the spleen initially contracts and then expands after CIRI, and mediates ischemic brain injury through immune cells. Thus, focusing on indirect spleen regulation in future studies will provide a new perspective for the treatment of inflammation after CIRI.", "keywords": ["Animals", "Spleen", "Reperfusion Injury", "Male", "Rats", "Brain", "Rats, Sprague-Dawley", "Splenectomy", "Infarction, Middle Cerebral Artery", "Disease Models, Animal", "T-Lymphocytes", "Natural Killer T-Cells"], "year": "2026", "doi": "10.1016/j.ejphar.2025.178509"}], "pubmed_query": "(\"brain\"[Title] OR \"cerebral\"[Title] OR \"hypothalamus\"[Title] OR \"hypothalamic\"[Title] OR \"central nervous system\"[Title] OR \"CNS\"[Title] OR \"neuronal\"[Title]) AND (\"spleen\"[Title] OR \"splenic\"[Title] OR \"splenomegaly\"[Title] OR \"lymphoid organ\"[Title] OR \"immune organ\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Brain__Thyroid", "source": "Brain", "target": "Thyroid", "color": "#64748b", "description": "Type: Hormonal connection\nKey Players: TSH, TH (T3, T4), Il-6, TNF-alpha\nNotes: \n- Thyroid hormones are essential for regulation of brain energy metabolism.\n- During inflammation Il-6 is produced by a multitude of cells/organs and leads to\nA decrease in plasma concentration of TSH and T3 in renal cancer patients. This might\nLead to a lower and generally dysregulated thyroid activity.\nSources:\n- doi: 10.3389/fnins.2024.1383355.\n- DOI: 10.1210/jcem.79.5.7962327", "connection_type": "Hormonal connection", "key_players": ["TSH", "TH (T3", "T4)", "Il-6", "TNF-alpha"], "key_players_metabolites": ["glucose", "ammonia", "propionate", "fructose", "cholesterol", "creatine", "ldl", "fatty acid", "acetate", "fatty acids", "phospholipid", "serine", "amp", "atp", "glutamate", "arginine", "amino acid", "succinate"], "key_players_hormones": ["thyroid hormone", "thyroid hormones", "tsh", "t3", "t4", "thyrotropin", "thyroxine", "triiodothyronine", "insulin", "leptin", "vitamin d", "estrogen", "cortisol", "prolactin", "igf1", "growth hormone", "noradrenaline", "gnrh", "testosterone", "adrenaline", "glucocorticoid", "igf-1", "progesterone", "crh", "fsh", "tnf", "oxytocin", "norepinephrine", "lh", "estradiol", "somatostatin", "acth", "il-4", "il-10", "epinephrine", "vasopressin", "il-6", "interleukin-6"], "key_players_proteins": ["pgc-1", "ucp1", "ampk", "mapk", "insulin receptor", "srebp", "hif1a", "fas", "akt", "inos", "acc", "mtor"], "key_players_counts_metabolites": {"cholesterol": 7, "ammonia": 12, "propionate": 8, "amp": 1, "atp": 1, "glucose": 17, "fatty acid": 2, "glutamate": 1, "ldl": 3, "arginine": 1, "amino acid": 1, "acetate": 2, "creatine": 4, "fatty acids": 2, "fructose": 8, "succinate": 1, "phospholipid": 2, "serine": 2}, "key_players_counts_hormones": {"progesterone": 3, "thyroid hormone": 263, "tnf": 2, "testosterone": 5, "glucocorticoid": 4, "thyroxine": 82, "crh": 3, "acth": 1, "igf-1": 4, "oxytocin": 2, "il-4": 1, "norepinephrine": 2, "cortisol": 12, "growth hormone": 6, "thyroid hormones": 191, "noradrenaline": 6, "estrogen": 15, "insulin": 38, "t3": 115, "vitamin d": 16, "il-10": 1, "fsh": 3, "adrenaline": 5, "triiodothyronine": 44, "epinephrine": 1, "lh": 2, "vasopressin": 1, "leptin": 18, "il-6": 1, "igf1": 7, "gnrh": 6, "tsh": 161, "estradiol": 2, "thyrotropin": 87, "prolactin": 12, "somatostatin": 2, "t4": 91, "interleukin-6": 1}, "key_players_counts_proteins": {"ucp1": 8, "mapk": 2, "hif1a": 1, "fas": 1, "insulin receptor": 2, "akt": 1, "pgc-1": 9, "ampk": 3, "inos": 1, "acc": 1, "mtor": 1, "srebp": 2}, "notes": "- Thyroid hormones are essential for regulation of brain energy metabolism.\n- During inflammation Il-6 is produced by a multitude of cells/organs and leads to\nA decrease in plasma concentration of TSH and T3 in renal cancer patients. This might\nLead to a lower and generally dysregulated thyroid activity.", "sources": ["doi: 10.3389/fnins.2024.1383355.", "DOI: 10.1210/jcem.79.5.7962327"], "ai_description": "The brain-thyroid axis is regulated by a complex interplay of hormonal and metabolic signals, with thyroid-stimulating hormone (TSH) from the pituitary gland stimulating the release of triiodothyronine (T3) and thyroxine (T4) from the thyroid gland. These hormones then bind to nuclear receptors in neurons, influencing gene expression and neuronal function [5]. Environmental toxins such as H. pylori infection [1] and exposure to flame retardants like PBDEs [2] can disrupt this axis by altering cortisol and TSH levels, leading to changes in hypothalamic-pituitary-adrenal (HPA) axis activity and potentially contributing to neurodevelopmental disorders. Disruption of thyroid hormone signaling has also been linked to neuronal apoptosis and neurotoxicity, highlighting the importance of maintaining normal thyroid function for brain health [3].", "pubmed_n": 199, "pubmed_papers": [{"pmid": "42306513", "title": "Helicobacter pylori infection and the hypothalamic-pituitary axis: association with cortisol and thyroid-stimulating hormone levels in adults.", "abstract": "Helicobacter pylori is a common chronic bacterial infection primarily associated with gastrointestinal disease. Increasing evidence suggests that H. pylori may also exert systemic effects beyond the stomach, including possible modulation of neuroendocrine pathways. This study aimed to investigate the association between H. pylori infection and alterations in serum cortisol and thyroid-stimulating hormone (TSH) levels as indicators of hypothalamic-pituitary-adrenal (HPA) and hypothalamic-pituitary-thyroid (HPT) axis activity. In this case-control study, 850 adults were enrolled, including 425 H. pylori -positive cases and 425 H. pylori -negative controls. Active H. pylori infection was determined using a monoclonal stool antigen test (HpSA). Fasting venous blood samples were collected between 08:00 and 10:00 AM under standardized conditions. Serum cortisol and TSH levels were measured using validated immunoassays. Group comparisons, correlation analysis, sex-stratified subgroup analysis, and receiver operating characteristic (ROC) curve analysis were performed. H. pylori -positive participants had significantly higher serum cortisol levels and lower TSH levels compared with controls (both p &lt; 0.001). A significant inverse correlation between cortisol and TSH was observed only in infected participants (r = -0.41, p &lt; 0.001). These hormonal alterations were evident in both sexes. ROC analysis showed moderate discriminatory performance for cortisol (AUC = 0.71) and fair-to-moderate performance for TSH (AUC = 0.67). H. pylori infection was significantly associated with elevated cortisol levels, reduced TSH levels, and an inverse relationship between both hormones in adults. These findings suggest that chronic H. pylori infection may influence both HPA and HPT axis regulation and support further investigation into its systemic neuroendocrine effects.", "keywords": [], "year": "2026", "doi": "10.18502/ijm.v18i3.21653"}, {"pmid": "42292908", "title": "Maternal Thyroid Supplementation Prevents Autistic-relevant Social Behavior and Hypothalamic Oxytocin Depletion Produced by Developmental Exposure to Environmental Toxicants.", "abstract": "Environmental toxicants that target the developing brain are suspected of contributing to autism spectrum disorder risk but causative evidence is lacking. We and others have shown that the indoor flame retardants, polybrominated diphenyl ethers (PBDEs), reduce prosocial behavior, however, few studies have assessed the central targets and underlying mechanisms. PBDEs are well established endocrine disruptors of the expanded thyroid system, which also regulates the prosocial neuropeptides oxytocin (OXT) and vasopressin (AVP) and their hypothalamic signaling. The potential role of PBDE-induced thyroid hormone (TH) deregulation in mediating disruption of central OXT and ASD-like social behavior deficits remains unmapped. To address this gap, we conducted a study in C57BL6/N mice that examined behavioral and neuromolecular reprogramming after developmental exposure to the commercial PBDE mixture, DE-71, and evaluated the therapeutic potential of TH supplementation. Dams were exposed daily during gestation and lactation to corn oil vehicle, low dose (0.1 mg/kg) and high dose (0.4 mg/kg) of DE-71 with or without concurrent L-thyroxine (+mT4). In offspring, dose-dependent ASD-relevant behavioral responses and central neuroendocrine OXT neuron depletion after developmental PBDE exposure was prevented with mT4. mRNA transcripts for the TH transporter Mct8 , deiodinase ( Dio3) and estrogen receptor beta ( Esr2 ) expressed on OXT neurons in PVH were upregulated in low dose females. In contrast, Mct8 and Dio3 were downregulated in low dose males. These findings uncover sex-specific mechanisms of PBDE-induced reprogramming of TH-regulated pathways in hypothalamic neuroendocrine cells leading to depleted central OXT signaling and ultimately ASD-relevant phenotypes. Importantly, we provide novel evidence of the therapeutic potential of maternal thyroid supplementation against toxicant-induced neurodevelopmental disorders.", "keywords": [], "year": "2025", "doi": "10.1101/2025.07.28.667293"}, {"pmid": "42276318", "title": "Neurotoxicity of myclobutanil in zebrafish larvae via thyroid disruption and neuronal apoptosis.", "abstract": "Myclobutanil (MYC) is a systemic synthetic triazole-class fungicide extensively deployed in global agriculture. Residues of MYC are often detected in various ecosystems and biological systems. However, studies investigating its potential neurodevelopmental toxicity are still scarce. In this research, zebrafish embryos were treated with MYC (at 0, 0.5, and 1&#x202f;mg/L) during 4 to 96&#x202f;h post fertilization (hpf) to assess its neurotoxic effects and underlying molecular pathways. Our results revealed that MYC adversely affected embryonic development, manifesting as reduced hatching rate, decreased survival rate, lower heart rate, concurrently with elevated malformation and spontaneous movement. Locomotor dysfunction was observed following MYC exposure. MYC also attenuated central nervous system neurogenesis in Tg(HuC:EGFP) zebrafish, as evidenced by diminished cholinesterase activities and decreased transcription of neurodevelopmental genes. In addition, MYC disturbed thyroid hormone balance and modulated the transcriptional profile of hypothalamus-pituitary-thyroid (HPT) axis-related genes. Molecular docking suggests a strong binding interaction between catalytic residues of thyroid hormone receptor &#x3b2; and MYC. Subsequently, MYC triggered apoptosis in brain neurons by upregulating apoptotic genes. These neurotoxic effects were effectively counteracted after T3 administration, suggesting thyroid dysfunction as a vital mechanism of MYC-induced neurotoxicity. Overall, this study reveals that MYC induces neurotoxicity in zebrafish larvae through thyroid hormone disruption and neuronal apoptosis, providing new insights into the developmental neurotoxic risks of triazole fungicides.", "keywords": [], "year": "2026", "doi": "10.1016/j.cbi.2026.112204"}, {"pmid": "42274556", "title": "Comparative Evaluation of hiPSC-Derived Brain Organoids as Platforms for Assessing Thyroid Hormone System Disrupting Chemicals.", "abstract": "Thyroid hormones (THs) are essential regulators of human brain development, and disrupted TH availability during pregnancy or early life is linked to adverse neurodevelopmental outcomes. Concerns that environmental chemicals interfere with TH signalling have increased the need for human-relevant in vitro systems to identify thyroid hormone system-disrupting chemicals (THSDCs) for risk assessment. Here, we compared two human-induced pluripotent stem cell (hiPSC)-derived brain organoid models for THSDC assessment: (i) human cortical organoids (COs) generated by unguided differentiation, offering higher architectural complexity but lower throughput; and (ii) neural stem cell-derived organoids (NSCOs), designed for scalability with reduced cellular diversity. Both models expressed key TH handling components, including the transporter SLC16A2 (MCT8) and the inactivating enzyme DIO3 . Using LC-MS/MS, we show that exogenous T3 is depleted from culture media and metabolized to 3,3'-T2 and 3'-T1 in both models, alongside upregulation of T3-responsive genes ( HR , KLF9 , DIO3 , SEMA3C ). Pulse and chronic co-exposures to reference disruptors iopanoic acid (IA, deiodinase inhibitor) and silychristin (SC, MCT8 inhibitor) altered T3 metabolism and modulated T3-responsive transcriptional endpoints. In NSCOs, high-content imaging revealed treatment-associated changes in cell composition, with chronic T3 reducing the SOX2-positive progenitor pool and THSDCs blocking this effect. Together, these findings provide a framework for organoid qualification-linking TH handling, transcriptomic responsiveness, and scalable phenotypic readouts-as a necessary step toward model validation and implementation of brain organoids in THSDC risk assessment pipelines.", "keywords": ["Organoids", "Humans", "Thyroid Hormones", "Induced Pluripotent Stem Cells", "Brain", "Cell Differentiation", "Endocrine Disruptors", "Neural Stem Cells", "Iodide Peroxidase"], "year": "2026", "doi": "10.3390/cells15110963"}, {"pmid": "42269856", "title": "Roles of the nuclear receptor corepressor 1 (NCoR1) and the silencing mediator of retinoid and thyroid hormone receptors (SMRT) in the developing brain.", "abstract": "Nuclear receptor corepressor 1 (NCoR1) and silencing mediator of retinoic acid and thyroid hormone (SMRT) are critical regulators that mediate transcriptional repression through histone deacetylation. Despite high structural homology, their distinct roles in the central nervous system remain poorly understood. To elucidate these roles, we generated neuronal-specific NCoR1 or SMRT knockout mice using Snap25-IRES2-Cre mice. Behavioral assessments revealed that while both NCoR1 and SMRT deficiency led to hypoactivity, social deficits, and mild anxiety, NCoR1-deficient mice uniquely exhibited enhanced learning abilities in a visual discrimination task, indicating functional separation in cognitive regulation. This divergence was supported by RNA-sequencing in the amygdala at postnatal day 21 (PND 21), where SMRT deletion upregulated 449 genes, whereas NCoR1 deletion upregulated only 8 genes. Furthermore, we investigated the protein stability of HDAC3, the primary enzymatic partner of these corepressors. At PND 21, HDAC3 levels were significantly reduced in the NCoR1-deficient hippocampus but significantly increased in the SMRT-deficient amygdala. In contrast, HDAC3 levels remained stable in the adult cerebellum and PND 3 cerebrum regardless of corepressor status. Notably, while mice with deletion of both NCoR1 and SMRT exhibit early postnatal lethality, their HDAC3 levels were unchanged compared to controls at PND 3, suggesting that the lethal phenotype is not primarily driven by a systemic loss of HDAC3 protein. Collectively, our findings demonstrate that NCoR1 and SMRT function through independent transcriptional networks and context-dependent regulatory mechanisms. This study highlights the specialized, non-redundant roles of these homologous corepressors in the brain according to developmental stage and region.", "keywords": [], "year": "2026", "doi": "10.1016/j.lfs.2026.124523"}, {"pmid": "42205262", "title": "Maternal exposure to the thyroperoxidase-inhibiting pesticide amitrole induces hypothyroidism and developmental neurotoxicity in the rat brain.", "abstract": "Thyroid hormone (TH) system-disrupting chemicals pose significant risks to human health and the environment, highlighting the urgent need for improved toxicological testing methods. A major concern is that environmental chemicals may induce developmental neurotoxicity by compromising TH signaling during critical life stages. In this study, we evaluated the thyroidal and neurotoxic effects of two compounds that interfere with TH signaling by inhibiting TH synthesis in the thyroid gland. Methimazole (MMI) is a pharmaceutical specifically designed to treat hyperthyroidism by inhibiting thyroperoxidase (TPO), while the herbicide amitrole has unintentional TPO-inhibiting properties. Pregnant and lactating rat dams were exposed to control (corn oil), 8 or 16 mg/kg body weight/day MMI, or 25 or 50 mg/kg body weight/day amitrole from gestation day 7 to postnatal day 16. MMI and amitrole induced fetal and postnatal hypothyroidism in offspring. Both compounds induced similar reductions in serum and brain TH concentrations and induced a brain malformation, periventricular heterotopia, tied to compromised TH signaling. Our results reinforce concerns over the potential for exposure to environmental chemicals with TH system-disrupting properties to negatively impact the developing brain in vertebrates.", "keywords": ["Animals", "Female", "Hypothyroidism", "Pregnancy", "Rats", "Amitrole", "Brain", "Pesticides", "Maternal Exposure", "Prenatal Exposure Delayed Effects", "Methimazole", "Neurotoxicity Syndromes", "Iodide Peroxidase", "Thyroid Hormones", "Male", "Rats, Sprague-Dawley", "Antithyroid Agents"], "year": "2026", "doi": "10.3389/fendo.2026.1823237"}, {"pmid": "42065260", "title": "Does Thyroid Hormone Boost Energy and Plasticity in the Brain as a Mechanism of Action in Antidepressant Augmentation Therapy?", "abstract": "Depression is a large and expanding worldwide unmet clinical need that has proven difficult to treat. Thyroid hormone has been used clinically for decades as an augmentation therapy to first-line antidepressants, although the mechanism of action (MOA) behind the beneficial effect of thyroid hormone augmentation is not clear. Here we present a narrative review of the literature to provide an understanding of the known pathophysiology that occurs in depression and the different actions that thyroid hormone promotes in the brain to develop new insight into the mechanism behind the antidepressant activity of thyroid hormone. We believe this review of published literature illustrates the complex picture of depression pathophysiology and provides new insight into the MOA of thyroid hormones used as augmentation therapy to antidepressants. Impaired monoaminergic neurotransmission is an established pathophysiological hallmark of depression. However, there are other pathways that are impacted, including inflammatory and endocrine responses. Brain bioenergetics is affected, with depressed patients having lower brain ATP levels than healthy subjects. In addition, and perhaps related, depression patients display a loss in brain volume, particularly in the mood control regions of the brain. This is brought about by a dampening in neuroplasticity, the process by which new dendrites and synapses are formed. Here the connection to thyroid hormone augmentation becomes intriguing because thyroid hormone is known to play a role in stimulating neuroplasticity. At the target gene level, brain-derived neurotrophic factor, an initiator and biomarker of neuroplastic changes, is positively regulated by thyroid hormone, as are some of the immediate-early genes implicated in driving neuroplasticity. Thyroid hormone induces neuroplasticity and brain remodeling in a mouse model of behavior associated with increased decision-making and exploration, as well as mouse models of traumatic brain injury and stroke. We propose that thyroid hormone augmentation of antidepressant therapy works by stimulating the processes of neuroplasticity in the regions of the brain that are affected by depression, restoring synaptic connections lost from depression. Since neuroplasticity is an energy-demanding process, the cellular increase in brain bioenergetics stimulated by thyroid hormone action likely drives the initiation and maintenance of plasticity.", "keywords": [], "year": "2026", "doi": "10.1177/10507256261448290"}, {"pmid": "42037694", "title": "Diffusion tensor imaging along the perivascular space and choroid plexus volume for assessing the brain glymphatic system in overt hypothyroidism.", "abstract": "The neurocognitive impairment in overt hypothyroidism (OH) is well-recognized, but its underlying mechanisms remain unclear. The glymphatic system, a recently discovered brain waste-clearance pathway, represents a promising yet unexplored target in this context. This study aimed to non-invasively assess glymphatic function in OH patients using the DTI-ALPS index and choroid plexus (CP) volume, and to investigate their relationships with thyroid function and cognitive performance. We enrolled 40 patients with overt hypothyroidism (OH) and 42 healthy controls. All participants underwent 3D-T1 weighted imaging (3D-T1WI) and diffusion tensor imaging (DTI). Glymphatic activity was assessed using the DTI-ALPS index, and choroid plexus (CP) volume was segmented from 3D-T1WI images. After adjusting for covariates, correlations between these imaging markers and thyroid hormones as well as neuropsychological scale scores were analyzed. After confounder adjustment, OH patients demonstrated a significantly reduced DTI-ALPS index and enlarged CP volume compared to controls. Critically, a lower DTI-ALPS index was associated with a larger CP volume. Serum FT3 levels and MoCA scores showed strong positive correlations with the DTI-ALPS index but negative correlations with CP volume. Our study provides the first direct evidence of glymphatic system dysfunction in OH, linking it to thyroid hormone levels and cognitive deficits. The DTI-ALPS index and CP volume emerge as novel and promising neuroimaging biomarkers, offering new insights into the pathophysiology of hypothyroidism-related neurocognitive decline and potential targets for future interventions.", "keywords": [], "year": "2026", "doi": "10.3389/fneur.2026.1747261"}, {"pmid": "41994797", "title": "A Rare Case of Solitary Brain Metastasis From Papillary Thyroid Carcinoma: The Role of Empiric I-131 Therapy and SPECT/CT (Single Photon Emission Computed Tomography/Computed Tomography) in Achieving an 11-Year Survival.", "abstract": "Brain metastases from papillary thyroid carcinoma (PTC) are rare and typically associated with a poor prognosis; however, early detection of solitary lesions can lead to exceptional long-term outcomes. We present the case of a 65-year-old man with a history of multicentric PTC&#xa0;(T1bN0M0, Stage I) treated with total thyroidectomy and postoperative radioiodine ablation 12 years earlier, who presented with rising thyroglobulin (Tg) levels (12 ng/mL) under TSH (thyroid-stimulating hormone) stimulation. Neck ultrasonography and 18F-FDG PET/CT (18-fluorodeoxyglucose positron emission tomography/computed tomography) failed to identify recurrent disease. Empiric high-dose (150 mCi; 5.55 GBq) I-131 therapy was administered. Post-therapy, whole-body imaging demonstrated focal cranial uptake, initially suspected as contamination. I-131 SPECT/CT (single photon emission computed tomography/computed tomography) fusion imaging localized intense iodine uptake to the right occipital lobe. A cranial MRI confirmed a 15 &#xd7; 15 mm enhancing lesion. The patient underwent craniotomy, and histopathological evaluation confirmed metastatic PTC with follicular features. Immunohistochemistry was positive for TTF-1 and thyroglobulin, with a Ki-67 proliferation index of 20%. The patient remains clinically and biochemically stable and disease-free 11 years after the metastasectomy, demonstrating an exceptionally long survival period for brain metastasis from PTC. This case highlights the diagnostic value of empiric high-dose radioiodine therapy combined with SPECT/CT in detecting occult metastases. Furthermore, the 11-year disease-free survival in our patient underscores that early identification and surgical resection of solitary brain metastases from PTC can lead to an exceptionally favorable long-term prognosis.", "keywords": [], "year": "2026", "doi": "10.7759/cureus.105291"}, {"pmid": "41993152", "title": "[Retracted] MicroRNA-1236-3p/translationally controlled tumor protein (TPT1) axis participates in congenital hypothyroidism progression by regulating neuronal apoptosis.", "abstract": "[This retracts the article DOI: 10.3892/etm.2019.8262.].", "keywords": [], "year": "2026", "doi": "10.3892/etm.2026.13142"}], "pubmed_query": "(\"brain\"[Title] OR \"cerebral\"[Title] OR \"hypothalamus\"[Title] OR \"hypothalamic\"[Title] OR \"central nervous system\"[Title] OR \"CNS\"[Title] OR \"neuronal\"[Title]) AND (\"thyroid\"[Title] OR \"thyroid gland\"[Title] OR \"thyroid hormone\"[Title] OR \"T3\"[Title] OR \"T4\"[Title] OR \"TSH\"[Title] OR \"hypothyroidism\"[Title] OR \"hyperthyroidism\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Colon__Small Intestine", "source": "Colon", "target": "Small Intestine", "color": "#64748b", "description": "Type: Similar organ function. Correlation might depend on fasting state/last meal.\nKey Players: \nNotes: \nSources:", "connection_type": "Similar organ function. Correlation might depend on fasting state/last meal.", "key_players": ["Notes:"], "key_players_metabolites": ["glucose", "fatty acids", "cholesterol", "bile acid", "fatty acid", "butyrate", "amino acid", "bile acids", "propionate", "leucine", "triglycerides", "hdl", "lipoprotein", "acetate", "sphingolipid", "amp", "lactate", "alanine", "amino acids", "galactose", "pyruvate", "glycogen", "branched-chain amino acid", "glutamate", "ldl", "cysteine", "arginine", "creatinine", "triglyceride", "methionine", "glycine", "atp", "chenodeoxycholic acid", "lithocholic acid", "sphingosine-1-phosphate", "free fatty acids", "ffa", "urea", "fructose", "succinate", "nadh", "deoxycholic acid"], "key_players_hormones": ["tnf", "insulin", "il-6", "il-4", "tumor necrosis factor", "glp-1", "il6", "vitamin d", "il-10", "cck", "glucagon", "estrogen", "corticosterone", "interleukin-6", "progesterone", "aldosterone", "norepinephrine", "adrenaline", "leptin", "il1b", "motilin", "estradiol", "glp1"], "key_players_proteins": ["fxr", "sirt1", "mapk", "foxo1", "akt", "tgr5", "cd36", "pi3k", "mtor", "cyp7a1", "lxr", "ucp1", "p38", "pparg", "sglt2", "glp-1 receptor", "insulin receptor", "sglt1", "cox-2", "ampk", "inos", "pkm2", "sirt3"], "key_players_counts_metabolites": {"methionine": 1, "cholesterol": 34, "sphingolipid": 5, "glycine": 1, "propionate": 11, "amp": 5, "glycogen": 2, "atp": 1, "chenodeoxycholic acid": 1, "bile acids": 13, "hdl": 6, "branched-chain amino acid": 2, "lithocholic acid": 1, "amino acids": 3, "glucose": 49, "sphingosine-1-phosphate": 1, "galactose": 3, "fatty acid": 28, "glutamate": 2, "leucine": 8, "ldl": 2, "lactate": 5, "cysteine": 2, "free fatty acids": 1, "arginine": 2, "butyrate": 25, "pyruvate": 3, "amino acid": 14, "creatinine": 2, "lipoprotein": 6, "triglycerides": 7, "ffa": 1, "acetate": 6, "urea": 1, "triglyceride": 2, "fatty acids": 41, "fructose": 1, "succinate": 1, "nadh": 1, "deoxycholic acid": 1, "bile acid": 34, "alanine": 5}, "key_players_counts_hormones": {"progesterone": 1, "tnf": 23, "cck": 2, "aldosterone": 1, "glucagon": 2, "il-4": 7, "norepinephrine": 1, "il6": 3, "estrogen": 2, "insulin": 21, "vitamin d": 3, "il-10": 3, "adrenaline": 1, "tumor necrosis factor": 6, "leptin": 1, "il1b": 1, "motilin": 1, "glp-1": 4, "corticosterone": 2, "il-6": 20, "estradiol": 1, "glp1": 1, "interleukin-6": 2}, "key_players_counts_proteins": {"ucp1": 1, "mapk": 6, "pi3k": 2, "foxo1": 3, "p38": 1, "pparg": 1, "sglt2": 1, "glp-1 receptor": 1, "insulin receptor": 1, "akt": 3, "tgr5": 3, "sglt1": 1, "cox-2": 1, "cd36": 3, "ampk": 1, "sirt1": 11, "inos": 1, "fxr": 17, "mtor": 2, "pkm2": 1, "sirt3": 1, "cyp7a1": 2, "lxr": 2}, "notes": "", "sources": [], "ai_description": "The Colon–Small Intestine axis is mediated by a complex interplay between metabolic and hormonal signals, with key players including short-chain fatty acids (SCFAs) produced by the gut microbiota [1]. The gut microbiome influences oxygen homeostasis in the gut, modulating epithelial function and immune balance through mechanisms involving spatial and developmental oxygen gradients [3]. Furthermore, the gut microbiota plays a crucial role in arsenic detoxification, with alterations in gut microbiota composition associated with long-term groundwater arsenic exposure [4]. The gut microbiome also influences liver health, with ciwujianoside B alleviating cholestatic liver injury through regulation of trimethylamine N-oxide (TMAO) synthesis via remodeling of the gut microbiota [5].", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42337354", "title": "Fermented food microbiome: influence on oral and gut microbiota, and human health.", "abstract": "The fermented food microbiome comprises live microorganisms, their genetic elements and their metabolites, and represents an established dietary approach for modulating host-microbiome interactions through the consumption of fermented foods. Fermentation enhances food preservation and nutrient bioavailability, and supplies the host with probiotics, prebiotic substrates and postbiotic metabolites. These bioactive compounds can influence the oral and gut microbiota, modulate immune function and support metabolic resilience. Fibre-rich, plant-based fermented foods retain such components within structured matrices that enhance microbial viability and mucosal interactions more consistently than do fermented dairy foods. This Review explores how the fermented food microbiome affects the oral-gut axis via both transient microbial exposure and metabolite-mediated signalling. Drawing on clinical and preclinical evidence, we examine how fermented food intake alters resident microbiota and host physiology throughout the digestive tract. Despite growing evidence, the mechanisms through which fermented food might promote health remain insufficiently defined in humans owing to strain variability, inconsistency in microbial composition across fermented foods, heterogeneous clinical outcomes and regulatory ambiguity. Taking into account these limitations, we propose a roadmap to integrate the fermented food microbiome into precision nutrition as a feasible, personalized, diet-based strategy to promote health and prevent disease.", "keywords": [], "year": "2026", "doi": "10.1038/s41579-026-01333-8"}, {"pmid": "42337290", "title": "Gut microbiota contributions to anorexia nervosa pathogenesis: insights from the activity-based anorexia model.", "abstract": "Anorexia nervosa (AN) is a severe eating disorder that profoundly affects quality of life. Despite increasing understanding of the neurobiological basis of the disease, many patients develop a chronic course of illness accompanied by a variety of physical and psychiatric comorbidities. To investigate the contribution of the gut microbiome to disease progression, we employed the activity-based anorexia (ABA) mouse model of AN. We performed fecal microbiota transplantation using samples from three donor groups: healthy controls, patients with acute AN, and patients with severe and enduring AN (SEAN). We continuously assessed changes in the gut microbiota and fecal metabolites (e.g., short-chain fatty acids, serotonin, and GABA) throughout the experiment, along with behavioral traits across the three groups of mice. Mice colonized with microbiota from acute AN patients exhibited reduced hunger signaling (via NPY, AgRP, MCH, and orexin), accompanied by decreased food intake. In contrast, mice transplanted with microbiota from SEAN patients showed appetite signaling and food consumption comparable to those colonized with microbiota from healthy controls but displayed significantly higher running activity relative to the other groups. However, the distinct microbiota did not affect the development of the ABA phenotype. Overall, our findings suggest that changes in the gut microbiome during disease development contribute to disease progression. Our results also indicate that restoration of a healthy gut microbiome is essential for complete recovery.", "keywords": [], "year": "2026", "doi": "10.1038/s41522-026-01055-y"}, {"pmid": "42336868", "title": "Oxygen homeostasis: new insight of gut microbiota-host interactions.", "abstract": "Oxygen homeostasis is a key ecological factor shaping microbial composition, epithelial function, and immune balance in the gut. Spatial and developmental oxygen gradients drive the transition from facultative to obligate anaerobes. Gut hypoxia is maintained by epithelial oxygen consumption and microbial metabolism, forming a positive feedback loop that supports barrier integrity and immune homeostasis. Disruption by inflammation, antibiotics, or diet elevates oxygen availability, promoting dysbiosis, pathogen expansion, and disease risk.", "keywords": [], "year": "2026", "doi": "10.1038/s41522-026-01062-z"}, {"pmid": "42335822", "title": "Long-term groundwater arsenic exposure is associated with altered arsenic methylation capacity and gut microbiota composition in a rural Chinese population.", "abstract": "This study investigated the relationship between long-term groundwater arsenic exposure, arsenic methylation capacity, and gut microbiota in adults from rural northern China. Arsenic detoxification relies in part on methylation processes, and growing evidence suggests that the gut microbiome may participate in arsenic biotransformation, yet population-based data integrating exposure, metabolism, and microbial profiles remain scarce. We recruited 258 participants from two neighboring villages supplied by centralized wells with contrasting arsenic levels (control, n&#x202f;=&#x202f;138; exposure, n&#x202f;=&#x202f;120). Total urinary arsenic was measured in all participants, and arsenic species were quantified in a subgroup (n&#x202f;=&#x202f;60) to derive primary and secondary methylation indices (PMI and SMI). Fecal metagenomes were sequenced to characterize taxonomic composition and functional potential based on KEGG and GO annotations. Individuals in the exposure village showed higher levels of urinary inorganic arsenic and methylated metabolites. While PMI was comparable between groups, SMI was significantly reduced among exposed individuals, indicating impaired secondary methylation. Arsenic exposure was also associated with pronounced alterations in gut microbial diversity and community structure. Several anaerobic taxa, largely linked to fermentative metabolism, were positively associated with SMI after multivariable adjustment. Functional analyses further revealed differences in pathways related to transport, environmental sensing, and metabolism. These findings suggest that chronic arsenic exposure is associated with reduced methylation efficiency and shifts in gut microbial composition and function, and that the gut microbiome may contribute to interindividual variability in arsenic metabolism and toxicity.", "keywords": [], "year": "2026", "doi": "10.1016/j.jhazmat.2026.142658"}, {"pmid": "42335639", "title": "Ciwujianoside B alleviates cholestatic liver injury by regulating TMAO synthesis via remodeling of the gut microbiota.", "abstract": "Cholestatic liver injury (CLI) is mainly driven by intrahepatic cholestasis, a pathological condition characterized by systemic and intrahepatic accumulation of bile acids. Ciwujianoside B (CWB), the active constituent of Eleutherococcus senticosus, has demonstrated protective effects in various hepatic pathologies, but its functional role in CLI has not yet been investigated. This study aims to evaluate the therapeutic potential of CWB against CLI and investigate its mechanism. CLI was induced via bile duct ligation, and the protective effects of CWB were assessed through H&amp;E, Sirius red, and immunohistochemical staining. Inflammatory cytokines in serum were measured by ELISA. Integrated analysis of 16S rDNA sequencing, serum metabolomics, and fecal microbiota transplantation was performed to investigate the interactions between gut microbiota and host metabolism. Trimethylamine oxide (TMAO) was supplemented to evaluate its impact on the hepatoprotective effects of CWB. In AML-12 cells, flavin-containing monooxygenase 3 (FMO3) was knockdown or overexpressed to assess TMAO levels, apoptosis, reactive oxygen species (ROS) content, and endoplasmic reticulum (ER) stress. The interaction between CWB and FMO3 was evaluated with molecular docking and molecular dynamics simulations. CWB alleviated hepatocellular damage and apoptosis, which was accompanied by reduced serum levels of ALT, AST, ALP, and inflammatory cytokines. Mechanistic analyses revealed that CWB remodeled the gut microbiota, suppressed Cut C and Cut D levels in feces, thereby reducing systemic TMAO accumulation. Exogenous TMAO supplementation reversed the protective effect of CWB. Antibiotic treatment partially abrogated the hepatic protective effects of CWB. CWB significantly suppressed FMO3 expression. Knockdown of FMO3 in AML-12 cells led to a reduction in intracellular TMAO levels, apoptosis rate, ROS content and ER stress activation. Molecular docking revealed a stable binding interaction between CWB and FMO3. Our results suggest that CWB alleviates CLI by suppressing TMAO biosynthesis, primarily through reducing trimethylamine-producing bacteria and directly inhibiting hepatic FMO3 expression.", "keywords": [], "year": "2026", "doi": "10.1016/j.phymed.2026.158426"}, {"pmid": "42335503", "title": "Niaoduqing particles ameliorated tubulointerstitial fibrosis by suppressing I&#x3ba;B/NF-&#x3ba;B signalling pathway via inhibiting host- and gut microbiota-mediated tryptophan co-metabolism.", "abstract": "Tubulointerstitial fibrosis (TIF) is an inevitable outcome of progressive chronic kidney disease (CKD). Niaoduqing particles (NDQ) were developed for the treatment of CKD. However, the molecular mechanisms underlying the effect of NDQ on TIF remain unclear. Fecal gut microbiota (GM) and serum metabolites were analyzed using metagenomics and metabolomics in unilateral ureteral obstruction (UUO)-induced TIF rats. NDQ treatment attenuated UUO-induced TIF in rats in a dose- and time-dependent manner. The increased abundance of eight pathogenic bacteria, including Bacillus wiedmannii, Enterococcus mundtii and Fusobacterium varium, showed strong positive correlations with TID scores, whereas the reduced abundance of two probiotic bacteria, Ruminococcus flavefaciens and Clostridium celatum, showed strong negative correlations with tubulointerstitial damage (TID) scores. NDQ treatment reversed these aberrant microbial alterations, indicating its capacity to remodel GM dysbiosis. TID scores were strongly correlated with host- and GM-mediated tryptophan co-metabolites, including indoxyl sulfate, tryptamine and indole-3-acetic acid, in both TIF- and NDQ-treated TIF rats, and NDQ intervention normalized these metabolic disturbances. Notably, Fusobacterium varium and Enterococcus faecium exhibited strong linear correlations with indoxyl sulfate, indole-3-acetic acid, and indole-3-aldehyde in the TIF rat model. Furthermore, NDQ suppressed I&#x3ba;B/NF-&#x3ba;B signaling pathway in both TIF rats and TGF-&#x3b2;1-induced NRK
