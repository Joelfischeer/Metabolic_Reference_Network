nhanced metabolic flexibility and oxidative capacity in HF-fed mice by activating AMPK-dependent pathways in muscle, liver, and adipose tissue. The higher efficacy of the 1% PSPLE indicates a hormetic response, where low polyphenol exposure triggers adaptive mitochondrial and metabolic activation, on the contrary, higher doses offer no further benefits. These results present PSPLE as a sustainable, polyphenol-rich food ingredient with potential to combat obesity-related metabolic dysfunction.", "keywords": [], "year": "2026", "doi": "10.1186/s12986-026-01144-x"}, {"pmid": "42225205", "title": "Muscle-derived ANXA2 promotes hepatic steatosis by activating SREBP1c-mediated de novo lipogenesis.", "abstract": "Hepatic steatosis, a hallmark of many liver diseases, is primarily driven by metabolic dysfunction; however, the extrahepatic regulatory mechanisms remain poorly understood. This study aimed to investigate muscle-liver crosstalk and to identify the underlying mechanisms of hepatic steatosis in patients with muscular dystrophy. We used mouse models of muscular dystrophy, fibroadipogenic progenitor (FAP)-specific annexin A2 (ANXA2) knockout mice, and muscle biopsy samples from patients with muscular dystrophy. The correlation between serum ANXA2 levels and lipid accumulation was evaluated in both human patients and mouse models of muscular dystrophy. RNA sequencing, mass spectrometry, and peptide library analyses were performed to investigate the mechanisms underlying hepatic steatosis associated with muscular dystrophy. We identified hepatic steatosis and hyperlipidemia in both patients and mouse models of muscular dystrophy. Using multiomic analyses, we found that muscle-resident FAPs secrete ANXA2, which functions as a key myokine driving hepatic steatosis. Muscle-specific overexpression of ANXA2 and manipulation of primary cells further confirmed this finding. In vivo FAP-specific ANXA2 ablation significantly alleviated systemic metabolic disturbances and hepatic steatosis in muscular dystrophy mouse models and high-fat diet-treated mice. Mechanistically, ANXA2 secreted by FAPs acts on hepatocyte-specific ANXA2R, promoting liver de novo lipogenesis through activation of the sterol regulatory element-binding protein 1c (SREBP1c) signaling pathway. Moreover, neutralizing ANXA2 suppressed hepatic steatosis and insulin resistance in mice. Collectively, our results demonstrate that ANXA2 derived from muscle FAPs promotes hepatic steatosis by activating SREBP1c-mediated de novo lipogenesis. Our findings identify the ANXA2-SREBP1c axis as a novel mechanism underlying muscle-liver metabolic crosstalk, and suggest that ANXA2 may represent a potential therapeutic target for hepatic steatosis in metabolic dysfunction-associated steatotic liver disease.", "keywords": [], "year": "2026", "doi": "10.1016/j.metabol.2026.156657"}, {"pmid": "42218923", "title": "The epigenetic control of inflammaging in skeletal muscle and adipose tissue.", "abstract": "Metabolic inflexibility, mitochondrial dysfunction, and persistent low-grade inflammation are recognized as fundamental hallmarks of biological ageing and key drivers of the inflammaging process. Ageing is associated with a progressive decline in cellular function and systemic homeostasis, particularly affecting skeletal muscle and white adipose tissue, which are central to energy metabolism and inflammatory regulation. In skeletal muscle, ageing leads to reduced oxidative capacity, impaired mitochondrial turnover, and anabolic resistance. In adipose tissue, adipocytes exhibit hypertrophy, hypoxia, and increased immune cell infiltration. Together, these changes promote persistent activation of inflammatory pathways and contribute to systemic insulin resistance. Epigenetic regulation plays a key role in linking metabolic stress to gene expression, modulating mechanisms such as DNA methylation, histone acetylation, and hydroxymethylation, thereby influencing chromatin accessibility in genes involved in ageing. Importantly, lifestyle interventions, including caloric restriction and physical exercise, can partially reverse these effects by reprogramming the epigenome. Both aerobic and resistance exercise promote epigenetic modifications associated with improved mitochondrial function, enhanced myogenesis, better adipocyte health, and reduced inflammatory gene expression. Thus, inflammaging is a dynamic and modifiable process, in which epigenetic plasticity connects metabolic dysfunction to chronic inflammation while also enabling interventions that preserve metabolic health during ageing.", "keywords": [], "year": "2026", "doi": "10.1016/j.mad.2026.112205"}, {"pmid": "42188301", "title": "Long-Chain n-3 Polyunsaturated Fatty Acids Attenuate the Severity of Obesity-Associated White Adipose Tissue and Skeletal Muscle Dysfunction.", "abstract": "Obesity is a complex metabolic disorder defined by a body mass index greater than 30 kg/m 2 , excess adipose tissue accumulation, chronic low-grade inflammation and metabolic dysfunction, leading to increased susceptibility to other chronic conditions. Evidence from both mechanistic pre-clinical studies and human clinical trial suggests a role for long-chain (LC) n-3 polyunsaturated fatty acids (PUFAs), namely eicosapentaenoic acid (EPA) and docosahexaenoic acid (DHA), to modulate obesity-associated outcomes and attenuate the production of inflammatory mediators, namely adipokines from adipose tissue and myokines from skeletal muscle, that can mitigate inflammation-associated metabolic dysfunction. Therefore, this narrative review synthesizes evidence and mechanistic insights on the role(s) of n-3 PUFA in regulating obesity-associated changes in adipose tissue and skeletal muscle inflammation and immune cell trafficking and metabolic outcomes.", "keywords": ["Humans", "Obesity", "Muscle, Skeletal", "Animals", "Fatty Acids, Omega-3", "Adipose Tissue, White", "Docosahexaenoic Acids", "Eicosapentaenoic Acid", "Inflammation", "Myokines", "Adipokines"], "year": "2026", "doi": "10.3390/md24050166"}, {"pmid": "42157960", "title": "MicroRNA-based targeting strategies enable AAV-mediated, tissue-selective gene expression in adipose tissue and skeletal muscle of mice.", "abstract": "Functional validation of therapeutic concepts-including understanding a target protein's mode of action in disease-relevant tissues-is a critical component of early drug discovery research. Tissue selectivity of recombinant adeno-associated viral vectors (AAVs) is an important property for both gene therapy and the modulation of target genes in model organisms, to investigate protein function and signaling pathways in specific cell types and tissues. However, while many target tissues can be transduced efficiently by selected capsids, achieving tissue specificity remains challenging in certain contexts. In this study, we compared different microRNA (miRNA)-based strategies to transcriptionally restrict AAV expression to either adipose tissue or skeletal muscle. Our findings demonstrate that liver-specific miR122 effectively suppressed AAV9-driven liver expression, while preserving adipose tissue targeting efficiency. Similarly, AAVMYO, in combination with a muscle-specific promoter and target sites for miR208a, confined transgene expression to skeletal muscle, while successfully de-targeting the liver and, importantly, the heart. Notably, both approaches outperformed conditionally self-silencing constructs that utilized artificial miRNAs (amiRs) driven by liver (LP1)- or heart (troponin T)-specific promoters. In summary, we expand the AAV toolbox by introducing expression cassette designs that enable specific expression in adipose tissue and skeletal muscle, thereby facilitating mechanistic studies in metabolic and muscle disease research.", "keywords": [], "year": "2026", "doi": "10.1016/j.omta.2025.201664"}, {"pmid": "42135577", "title": "Glutamine-driven reductive TCA cycle metabolism supports aged muscle stem cell function via de novo lipogenesis.", "abstract": "Sarcopenia and the age-related decline in muscular strength and regenerative capacity contribute directly to loss of autonomy, greater risk for hospitalization and healthcare utilization. One contributing cellular phenotype associated with skeletal muscle aging is a loss in the function and number of resident muscle stem cells (MuSCs) or satellite cells. MuSC activation leads to dramatic changes in cellular architecture and metabolic reprogramming, including both mitochondrial biogenesis and increased glycolysis. Despite these changes to increase energy production, high energy demands may not be fully met during periods of MuSC activation. Here we used in vitro and in vivo approaches in mice to demonstrate the function of glutaminase for age-related changes in MuSC function. By combining fluorescence-activated cell sorting (FACS) isolation with metabolomics and stable isotope tracing, we show an age-related decline in reductive (counterclockwise) flux of glutamine through the tricarboxylic acid (TCA) cycle, a pathway by which MuSCs build cellular fatty acid stores as necessary biomass for MuSC function.", "keywords": ["Animals", "Glutamine", "Citric Acid Cycle", "Mice", "Muscle, Skeletal", "Lipogenesis", "Aging", "Glutaminase", "Mice, Inbred C57BL", "Stem Cells", "Satellite Cells, Skeletal Muscle", "Male", "Cellular Senescence", "Metabolomics"], "year": "2026", "doi": "10.1038/s43587-026-01120-3"}, {"pmid": "42129838", "title": "Molecular and cellular mechanisms of muscle-adipose tissue crosstalk driving sarcopenic obesity: an integrative review of human, animal, and in vitro models.", "abstract": "Sarcopenic Obesity is a complex geriatric syndrome that is not simply the co-occurrence of sarcopenia and obesity but is a synergistic pathophysiological relationship in which the sum of the risk factors is greater than the sum of the individual conditions. This integrative review proposes that sarcopenic obesity is fundamentally an illness of impaired bidirectional communication between skeletal muscle and adipose tissue that function as dynamic endocrine organs that interact through a vast repertoire of bioactive molecules. We critically analyze the molecular signaling pathways responsible for this crosstalk and the simultaneous hyperactivation of the Ubiquitin-Proteasome System and NF-&#x3ba;B pathways. Furthermore, highlighting the paradigm-shifting role of the Exosomal miRNA Regulatory Network, we explored how adipose-derived extracellular vesicles deliver atromiRs (e.g., miR-27a, Let-7d-3p) to myocytes and cause insulin resistance and regenerative failure, and the loss of myocyte-derived miR-146a-5p eliminates an important brake on adipogenesis. Also, we explored cellular mechanisms such as macrophage phenotypic switching (metaflammation), mitochondrial lipotoxicity, and the newly emerging gut-microbiota-muscle axis. Finally, we explored advanced experimental models, such as organ-on-a-chip systems, and explored the clinical paradox of GLP-1 receptor agonist-induced muscle loss. We conclude that future therapeutic frontiers are in the area of combination therapies and miRNA mimics to reinstate this broken molecular dialogue.", "keywords": [], "year": "2026", "doi": "10.1186/s12986-026-01123-2"}], "pubmed_query": "(\"skeletal muscle\"[Title] OR \"muscle\"[Title] OR \"myocyte\"[Title] OR \"myofiber\"[Title] OR \"sarcopenia\"[Title] OR \"muscular\"[Title]) AND (\"adipose tissue\"[Title] OR \"white adipose tissue\"[Title] OR \"fat tissue\"[Title] OR \"adipocyte\"[Title] OR \"adipogenesis\"[Title] OR \"visceral fat\"[Title] OR \"subcutaneous fat\"[Title] OR \"WAT\"[Title] OR \"lipogenesis\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Pancreas__Thyroid", "source": "Pancreas", "target": "Thyroid", "color": "#64748b", "description": "Type: General metabolic state\nKey Players: TSH, TH\nNotes: - TH  regulates Thermogenesis, energy utilization by increasing the basal metabolic rate and regulate lipid and glucose metabolism. TH acts also through the pancreas.\nSources:\n- doi: 10.1177/2042018820917869\n- https://doi.org/10.1152/physrev.00030.2013", "connection_type": "General metabolic state", "key_players": ["TSH", "TH"], "key_players_metabolites": ["glucose", "cholesterol", "arginine", "glutamate", "propionate", "amp", "amino acid", "ffa", "triglyceride", "fatty acids", "ldl", "glycogen", "phosphoenolpyruvate", "hdl", "free fatty acids", "lipoprotein", "amino acids", "leucine", "glycerol", "triglycerides", "acetate", "glutamine", "atp", "lactate", "malate", "creatinine", "fructose", "succinate", "glucose-6-phosphate", "serine", "alanine"], "key_players_hormones": ["insulin", "t3", "thyroid hormone", "tsh", "thyroid hormones", "triiodothyronine", "thyroxine", "glucagon", "t4", "thyrotropin", "somatostatin", "growth hormone", "amylin", "noradrenaline", "estrogen", "leptin", "testosterone", "osteocalcin", "glp1", "interleukin-1", "cortisol", "adrenaline", "epinephrine", "lh", "prolactin", "angiotensin", "tnf", "glucocorticoid", "gastrin", "acth", "norepinephrine", "renin", "fsh", "tumor necrosis factor", "secretin", "estradiol", "progesterone", "angiotensin ii", "corticosterone", "gnrh", "ghrelin"], "key_players_proteins": ["akt", "glucokinase", "glp1r", "pi3k", "chrebp", "glut2", "fxr", "glut4", "mapk", "p38", "insulin receptor", "hexokinase", "rxr", "irs-1", "foxo", "mtor"], "key_players_counts_metabolites": {"cholesterol": 23, "propionate": 8, "amp": 8, "glycogen": 4, "phosphoenolpyruvate": 4, "atp": 1, "hdl": 3, "amino acids": 2, "glucose": 441, "glutamate": 9, "leucine": 2, "ldl": 5, "lactate": 1, "free fatty acids": 3, "arginine": 14, "amino acid": 8, "malate": 1, "creatinine": 1, "lipoprotein": 3, "glycerol": 2, "triglycerides": 2, "ffa": 8, "acetate": 2, "triglyceride": 6, "fatty acids": 6, "fructose": 1, "succinate": 1, "glucose-6-phosphate": 1, "glutamine": 2, "serine": 1, "alanine": 1}, "key_players_counts_hormones": {"progesterone": 1, "thyroid hormone": 150, "tnf": 2, "testosterone": 7, "glucocorticoid": 2, "thyroxine": 77, "gastrin": 2, "interleukin-1": 3, "glucagon": 73, "acth": 2, "angiotensin ii": 1, "norepinephrine": 2, "cortisol": 3, "osteocalcin": 4, "growth hormone": 22, "thyroid hormones": 91, "renin": 2, "noradrenaline": 9, "estrogen": 9, "insulin": 717, "t3": 184, "fsh": 2, "adrenaline": 3, "tumor necrosis factor": 2, "triiodothyronine": 89, "secretin": 2, "epinephrine": 3, "lh": 3, "leptin": 8, "corticosterone": 1, "gnrh": 1, "ghrelin": 1, "tsh": 104, "estradiol": 2, "thyrotropin": 33, "prolactin": 3, "somatostatin": 31, "t4": 69, "amylin": 14, "glp1": 4, "angiotensin": 3}, "key_players_counts_proteins": {"mapk": 2, "rxr": 1, "pi3k": 9, "p38": 2, "glut4": 3, "glucokinase": 24, "glut2": 5, "insulin receptor": 2, "akt": 27, "chrebp": 7, "irs-1": 1, "foxo": 1, "fxr": 5, "hexokinase": 2, "mtor": 1, "glp1r": 14}, "notes": "- TH  regulates Thermogenesis, energy utilization by increasing the basal metabolic rate and regulate lipid and glucose metabolism. TH acts also through the pancreas.", "sources": ["doi: 10.1177/2042018820917869", "https://doi.org/10.1152/physrev.00030.2013"], "ai_description": "The pancreas-thyroid axis is a complex interplay between metabolic and hormonal signals that regulate glucose homeostasis and pancreatic function. Thyroid hormones, particularly T3, play a crucial role in modulating pancreatic beta-cell function and insulin sensitivity [1, 2]. Elevated thyroid-stimulating hormone (TSH) levels have been linked to insulin resistance and beta-cell dysfunction in type 2 diabetes with subclinical hypothyroidism [4], while genetic liability to hypothyroidism has been shown to protect against pancreatic disease risk [3]. Furthermore, dietary dityrosine, a biomarker of high-oxidative pork consumption, can disrupt thyroid hormone signaling in pancreatic beta-cells, impairing glucose homeostasis [5].", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42279352", "title": "Perioperative Thyroid-Metabolic Changes in Pancreatic Ductal Adenocarcinoma According to Surgical Management.", "abstract": "Background: Pancreatic ductal adenocarcinoma (PDAC) is associated not only with tumor progression but also with profound metabolic and nutritional disturbances. Thyroid hormone homeostasis may reflect this systemic response; however, perioperative data in PDAC remain limited. We aimed to assess perioperative changes in thyroid-related parameters in patients with PDAC undergoing different types of surgical management and to explore their associations with nutritional, metabolic, and tumor-burden variables. Methods: We performed a retrospective single-center study including 101 patients with PDAC. Thyroid-related and metabolic laboratory parameters were assessed before surgery and again 4-6 weeks later. The analyzed variables included thyroid-stimulating hormone (TSH), free triiodothyronine (FT3), free thyroxine (FT4), the FT3/FT4 ratio, albumin, total protein, glucose, insulin, HbA1c, lipid parameters, and CA 19-9. Patients were analyzed according to resectional versus non-resectional treatment and according to four procedure types. The primary endpoint was perioperative change in the FT3/FT4 ratio. Results: At baseline, resectional patients had significantly higher FT3 and FT3/FT4 ratio values and lower FT4 and CA 19-9 levels than non-resectional patients. In the whole cohort, FT3 and the FT3/FT4 ratio decreased significantly after treatment, whereas TSH increased, and FT4 remained unchanged. These endocrine changes occurred in parallel with significant declines in albumin, total protein, glucose, insulin, HbA1c, and HDL cholesterol, together with an increase in triglyceride levels. Baseline FT3 and FT3/FT4 ratios correlated positively with albumin and total protein and negatively with CA 19-9. Although perioperative changes did not differ significantly between resectional and non-resectional groups except for triglycerides, significant procedure-dependent differences were observed across the four surgical categories for FT3, FT4, TSH, and the FT3/FT4 ratio; glucose; insulin; and triglycerides. The prevalence of low-T3 syndrome increased from 11.1% preoperatively to 38.7% postoperatively. Conclusions: In PDAC, perioperative changes in thyroid hormone indices are pronounced and strongly depend on the type of surgical management. FT3 and the FT3/FT4 ratio appear to reflect systemic metabolic and nutritional adaptation as well as disease burden rather than acting as tumor-specific markers.", "keywords": [], "year": "2026", "doi": "10.3390/cancers18111769"}, {"pmid": "42181188", "title": "Thyroid autoimmunity in relation to islet autoantibodies in newly diagnosed type 1 diabetes mellitus in children and adolescents.", "abstract": "This study aimed to investigate the occurrence of thyroid autoantibodies at the onset of type 1 diabetes mellitus (T1DM) in children and adolescents, and to assess whether the presence of islet autoantibodies is associated with thyroid autoantibody presence. This retrospective cross-sectional study included 122 children and adolescents newly diagnosed with T1DM who visited Qingdao University Affiliated Women's and Children's Hospital between January 2022 and December 2024. We collected their blood glucose, glycated hemoglobin (HbA1c), C-peptide levels, and autoantibodies to islet cell antigen (ICA), glutamate decarboxylase (GADA), islet antigen-2 (IA-2A), insulin (IAA) and zinc transporter 8 (ZnT8A), thyroid peroxidase antibodies (TPOAb), and antithyroglobulin antibodies (TGAb). 84.4% of patients had at least one islet autoantibody, with IA-2A showing the highest positivity rate (64.8%) and ZnT8A the lowest (3.3%). No patient tested positive for all five antibodies. In comparison of 42 thyroid autoantibody (TA)-positive patients (34.4%) with 80 TA-negative patients, the TA-positive group was older (7.8 &#xb1; 3.0 years vs. 6.6 &#xb1; 3.1 years, P&#xa0;=&#xa0;0.045). The GADA positivity rate (60.9% vs. 41.4%, P&#xa0;=&#xa0;0.004) and IAA positivity rate (33.3% vs. 11.3%, P&#xa0;=&#xa0;0.003) were significantly higher in the TA-positive group than in the TA-negative group, with a higher median GADA titer (29.3 U/ml vs. 5.2 U/ml, P&#xa0;=&#xa0;0.029). Logistic regression analysis revealed that GADA positivity (OR&#xa0;=&#xa0;3.18, 95% CI: 1.44-7.01, P&#xa0;=&#xa0;0.004) and IAA positivity (OR&#xa0;=&#xa0;3.94, 95% CI: 1.53-10.15, P&#xa0;=&#xa0;0.004) were significantly associated with TA positivity. After adjusting for age, sex, BMI, and family history of diabetes, both remained independently associated with TA (aOR=2.68 and 4.06, respectively). Additionally, GADA titer showed a weak positive correlation with TPOAb titer (r = 0.204, P&#xa0;=&#xa0;0.024). Positive GADA and IAA antibodies were independently associated with thyroid autoimmunity in children with newly diagnosed type 1 diabetes, and GADA titer correlated with TPOAb titer. These findings support the consideration of early screening and long-term monitoring of thyroid function in children with newly diagnosed type 1 diabetes, particularly those positive for GADA and/or IAA antibodies.", "keywords": ["Humans", "Diabetes Mellitus, Type 1", "Child", "Adolescent", "Female", "Autoantibodies", "Male", "Retrospective Studies", "Cross-Sectional Studies", "Autoimmunity", "Thyroid Gland", "Child, Preschool", "Islets of Langerhans"], "year": "2026", "doi": "10.3389/fendo.2026.1822960"}, {"pmid": "41564647", "title": "Thyroid hormone signaling causally influences pancreatic disease risk: Evidence from Mendelian randomization and multi-omics integration.", "abstract": "The relationship between thyroid function and pancreatic disease has been observed clinically, yet causality remains unestablished. We applied bidirectional Mendelian randomization using genetic instruments from genome-wide association studies encompassing over 500,000 individuals to determine causal relationships. We demonstrate that genetic liability to hypothyroidism substantially protects against acute pancreatitis (odds ratio 0.37, 95&#x202f;% CI 0.17-0.80). Genetically elevated basal metabolic rate increases acute pancreatitis risk (OR 1.16) while decreasing chronic pancreatitis risk (OR 0.77), revealing divergent pathophysiological mechanisms. No causal relationship exists between thyroid function and pancreatic cancer. To elucidate underlying mechanisms, we performed multi-omics analysis including bulk RNA sequencing from 172 pancreatic adenocarcinomas, single-cell RNA sequencing from acute pancreatitis (32,830 cells), chronic pancreatitis (30,426 cells), and pancreatic cancer (95,751 cells), and GeoMx spatial transcriptomics (253 regions). High metabolic gene expression predicts favorable cancer survival (hazard ratio 0.52, P&#x202f;=&#x202f;0.0015). Single-cell analysis reveals myeloid-specific metabolic gene downregulation in chronic pancreatitis and 31-fold upregulation of the thyroid hormone-inactivating enzyme DIO3 in tumor epithelial cells. Spatial transcriptomics demonstrates that PPARGC1A downregulation occurs in preneoplastic lesions before malignant transformation. These findings establish thyroid function as a causal determinant of pancreatitis susceptibility, identify cell type-specific mechanisms including local thyroid hormone inactivation and metabolic reprogramming, and demonstrate that patient-derived organoids better preserve prognostically favorable metabolic phenotypes than cell lines. Thyroid function represents a potentially modifiable risk factor for inflammatory pancreatic disease.", "keywords": ["Humans", "Multiomics", "Thyroid Hormones", "Mendelian Randomization Analysis", "Signal Transduction", "Genome-Wide Association Study", "Pancreatic Diseases", "Pancreatitis"], "year": "2026", "doi": "10.1016/j.compbiolchem.2026.108897"}, {"pmid": "41552333", "title": "Elevated thyroid-stimulating hormone correlates with insulin resistance and &#x3b2;-cell dysfunction in type 2 diabetes with subclinical hypothyroidism.", "abstract": "To investigate the correlation between thyroid-stimulating hormone (TSH) levels and insulin function indices, including the homeostatic model assessment of insulin resistance (HOMA-IR) and &#x3b2;-cell function (HOMA-ISLET), in patients with type 2 diabetes mellitus (T2DM) complicated by subclinical hypothyroidism (SCH), and to evaluate their diagnostic value for identifying elevated TSH states. A total of 384 T2DM patients treated between April 2022 and November 2024 were retrospectively analyzed. Among them, 184 patients with SCH comprised the combined group, and 200 patients with T2DM alone comprised the diabetes group. Demographic data, fasting plasma glucose (FPG), fasting insulin (FINS), and TSH were collected to calculate HOMA-IR and HOMA-ISLET. Inter-group comparisons, correlation analyses, and receiver operating characteristic (ROC) curve analyses were performed. Compared to the diabetes group, the combined group showed significantly higher TSH, HOMA-IR, and HOMA-ISLET (all P &lt; 0.001). TSH correlated positively with HOMA-IR and negatively with HOMA-ISLET (combined group: r = 0.587 and -0.464; diabetes group: r = 0.334 and -0.545; all P &lt; 0.001). ROC analysis demonstrated favorable diagnostic performance for HOMA-IR (AUC = 0.720 for SCH; 0.892 for elevated TSH) and HOMA-ISLET (AUC = 0.711 for SCH; 0.878 for elevated TSH). HOMA-IR showed stronger discriminative ability than HOMA-ISLET in distinguishing diabetes-only from high TSH states (AUC = 0.928 vs. 0.709). Elevated TSH levels are closely associated with increased insulin resistance and impaired &#x3b2;-cell function in T2DM. Both HOMA-IR and HOMA-ISLET are valuable diagnostic tools, with HOMA-IR demonstrating superior clinical applicability for detecting T2DM with SCH and elevated TSH states.", "keywords": [], "year": "2025", "doi": "10.62347/UYSH9211"}, {"pmid": "41008194", "title": "Dietary Dityrosine Impairs Glucose Homeostasis by Disrupting Thyroid Hormone Signaling in Pancreatic &#x3b2;-Cells.", "abstract": "Growing evidence links processed red meat consumption to increased diabetes risk, with oxidized proteins and/or amino acids proposed as potential mediators. We investigated whether dityrosine (Dityr), a key oxidation biomarker in high-oxidative pork (HOP) and structural analog of thyroid hormone T3, mediates HOP-induced glucose dysregulation via thyroid hormone (TH) signaling disruption. C57BL/6J mice were fed control, low-oxidative pork (LOP), HOP, LOP + Dityr, or Dityr diets for 12 weeks. HOP and Dityr impaired glucose tolerance and induced hyperglycemia and hypoinsulinemia. Both induced oxidative stress and inflammation that partly contributed to pancreatic &#x3b2;-cell dysfunction and reduction in insulin secretion. Crucially, they downregulated pancreatic thyroid hormone receptor &#x3b2;1 (TR&#x3b2;1) and monocarboxylate transporter 8 (MCT-8), impairing TH signaling. This reduced TH transport in pancreatic tissue and triggered &#x3b2;-cell apoptosis by modulating TR&#x3b2;1-mediated expression of TH-responsive genes and proteins involved in pancreatic function, ultimately leading to diminished insulin secretion and elevated blood glucose levels. Dityr alone recapitulated the metabolic and molecular disruptions of HOP. We conclude that Dityr drives HOP-induced glucose metabolism disorders primarily by disrupting TH signaling, along with promoting oxidative stress and inflammation that collectively impair &#x3b2;-cell function. Minimizing dietary Dityr exposure via modified cooking methods or antioxidant-rich diets may mitigate diabetes risk.", "keywords": [], "year": "2025", "doi": "10.3390/foods14183220"}, {"pmid": "40430234", "title": "Association Between Gestational Diabetes Mellitus and Risk of Overall and Site-Specific Cancers (Pancreatic, Liver, Thyroid, Lung): A Systematic Review and Meta-Analysis.", "abstract": "Background : Gestational diabetes mellitus (GDM) is a common endocrine and metabolic disorder during pregnancy. However, current studies have not reached a consensus on the correlation between GDM and the risk of developing cancers. Objective : This systematic review and meta-analysis aims to comprehensively evaluate the association between GDM and the risk of overall cancer and cancers at specific sites (pancreatic cancer, thyroid cancer, liver cancer, lung cancer). Methods : A systematic search was conducted in PubMed, Web of Science, Scopus, EMBASE, and Cochrane Library databases from the establishment of the databases to 16 January 2025. Two researchers independently assessed the quality of the included studies using the Newcastle-Ottawa Scale and extracted relevant data. Data were analyzed using STATA Version 17.0. Results: This systematic review and meta-analysis included a total of 8 studies involving 1,936,836 participants. We calculated the pooled hazard ratio (HR) to evaluate the association, and the results showed that the pooled HR for overall cancer risk was 1.16 (95%CI: 1.04-1.28), indicating a significant increase in the risk of overall malignancies among patients with GDM. GDM was also significantly associated with the risk of pancreatic cancer (HR = 2.80; 95%CI: 1.20-6.55), thyroid cancer (HR = 1.21; 95%CI: 1.08-1.36), and liver cancer (HR = 1.33; 95%CI: 1.10-1.61). Additionally, the association between GDM and lung cancer was close to being statistically significant (HR = 1.19; 95%CI: 0.98-1.44). Conclusion: Our study suggests that GDM is associated with an increased risk of overall cancer, as well as pancreatic cancer, thyroid cancer, and liver cancer.", "keywords": [], "year": "2025", "doi": "10.3390/life15050808"}, {"pmid": "39687453", "title": "Serum C-reactive Protein Levels about Insulin Resistance and Beta Cell Function in Iranian Women with Subclinical Hypothyroidism.", "abstract": "Subclinical hypothyroidism (SCH), is defined as an asymptomatic state characterized by a normal serum concentration of free thyroxine and elevated serum concentration of TSH. This study aims to investigate the complex interplay between hyperinsulinism, insulin resistance, beta cell function, and low-grade chronic inflammation in Iranian women with SCH. Eighty women with SCH and 80 healthy women as controls matched to the patient group for sex, age, and body mass index (BMI), were enrolled in this prospective cross-sectional study. TSH, free T3, free T4, highly sensitive C-reactive protein (hs-CRP), fasting insulin, fasting glucose, total cholesterol, HDL-cholesterol, LDL-cholesterol, Triglyceride, HOMA-IR index, Beta cell function (HOMA-B index) and insulin sensitivity were determined. Hs-CRP was not statistically different between the SCH patients and the control group (3.7&#xb1;3.2 Vs 3.6&#xb1;4.0, P &gt;0.05). Total cholesterol and LDL-cholesterol were significantly higher; however, triglyceride and HDL-cholesterol were not statistically different in patients with SCH as compared with the control group. Fasting insulin levels and HOMA-IR and Beta cell function (HOMA-B) were significantly higher in SCH women compared to the control group. A positive correlation between HOMA-IR and HOMA-B with TSH levels was found (r=0.324, r=0.191, P &lt;0.05 respectively). A positive correlation between insulin levels and hs-CRP (r=0.22, P &lt;0.05), also between insulin levels and TSH (r=0.312, P &lt;0.05) and LDL- LDL-cholesterol was obtained (r=0.27, P &lt;0.05). Iranian women with SCH may exhibit elevated atherogenic parameters (hyperinsulinemia, LDL-cholesterol, and total cholesterol), HOMA-IR, and HOMA-B.", "keywords": [], "year": "2024", "doi": "10.30699/IJP.2024.2015823.3213"}, {"pmid": "39460967", "title": "Changes in liver function, fluctuations in blood glucose, insulin secretion and gender differences in patients with hyperthyroidism after treatment with propranolol hydrochloride tablets coalition with methimazole tablets.", "abstract": "To investigate liver function changes, blood glucose fluctuation, insulin secretion and gender differences in hyperthyroidism patients before and after propranolol with methimazole. Clinical data 110 hyperthyroidism patients admitted to Zhangzhou Affiliated Hospital of Fujian Medical University from February 2023 to February 2024 were retrospectively analyzed. They were categorized into the methimazole group (methimazole, n = 55) and the coalition medication group (Methimazole with propranolol, n = 55). The therapeutic effects of both groups were observed. Pre- and post-treatment liver function dynamic blood glucose parameters and insulin secretion characteristics were analyzed between the two groups. Gender differences prior to treatment were also examined. Overall efficacy was significantly higher in the oalition group (96.35%) than in the methimazole group (83.64%) (P&lt;0.05); Post-treatment, the TBiL, AST, ALT, FT 3 , FT 4 , FBG, P1BG, HOMA-IR, HOMA-&#x3b2;, postprandial blood glucose peak value, LAGE, MAGE, MODD and SDBG levels in the coalition group were lower compared to the methimazole group, while TSH was higher (P&lt;0.05). Female patients exhibited significantly lower LAGE, MAGE, MODD and SDBG levels compared to the male group (P&lt;0.05). The combination of methimazole and propranolol enhances thyroid and liver functions for hyperthyroid patients while improving insulin resistance along with reducing postprandial blood glucose variability.", "keywords": ["Humans", "Female", "Propranolol", "Methimazole", "Male", "Hyperthyroidism", "Adult", "Blood Glucose", "Middle Aged", "Retrospective Studies", "Liver", "Antithyroid Agents", "Sex Factors", "Tablets", "Insulin Secretion", "Insulin", "Drug Therapy, Combination", "Liver Function Tests", "Treatment Outcome"], "year": "2024", "doi": ""}, {"pmid": "39403034", "title": "Pancreatic inflammation induced by hypothyroidism in female rabbits is associated with cholesterol accumulation and a reduced expression of CYP51A1, FXR&#x3b2;, and PPAR&#x3b2;/&#x3b4;.", "abstract": "In women and animal models, hypothyroidism induces hypercholesterolemia, pancreatitis, and insulitis. We investigated whether lipids are involved in the effects of hypothyroidism in the pancreas. Control (n&#x2009;=&#x2009;6) and hypothyroid (n&#x2009;=&#x2009;6) adult female rabbits were used. We quantified serum and pancreatic triacylglycerol and total cholesterol levels, the oxidative and antioxidant status, and the expression of low-density lipoprotein cholesterol receptor (LDLR) in the pancreas. Inflammation of the pancreas was evaluated by infiltration of immune cells positive to CD163 and &#x3b1;-farnesoid receptor (FXR&#x3b1;). Other lipid players involved in both inflammation and insulin secretion of the pancreas, such as lanosterol 14-&#x3b1;-demethylase (CYP51A1), &#x3b2;-farnesoid receptor (FXR&#x3b2;), 3&#x3b2;-hydroxysteroid dehydrogenase (3&#x3b2;-HSD), and peroxisome proliferator-activated receptor &#x3b2; (PPAR&#x3b2;/&#x3b4;), were quantified. Groups were compared by t-Student or U-Mann-Whitney tests (p&#x2009;&#x2264;&#x2009;0.05). Hypothyroidism induced hypercholesterolemia and a high cholesterol accumulation in the pancreas of female rabbits, without affecting oxidative or antioxidative status nor the expression of LDLR. The pancreas of hypothyroid females showed inflammation identified by a great infiltration of immune cells, macrophages CD163+, and loss of expression of FXR&#x3b1;+ in immune cells. Moreover, a reduced expression of CYP51A1, FXR&#x3b2;, and PPAR&#x3b2;/&#x3b4;, but not 3&#x3b2;-HSD, in the hypothyroid pancreas was found. Pancreatitis and insulitis promoted by hypothyroidism may be related to the accumulation of cholesterol, lanosterol actions, and the activation of PPAR&#x3b2;/&#x3b4;. All inflammatory markers evaluated in this study are related to glucose regulation, suggesting the link between hypothyroidism and diabetes.", "keywords": ["Animals", "Female", "Rabbits", "Hypothyroidism", "Cholesterol", "PPAR-beta", "Sterol 14-Demethylase", "Receptors, Cytoplasmic and Nuclear", "PPAR delta", "Pancreatitis", "Pancreas", "Hypercholesterolemia", "Receptor, Farnesoid X-Activated"], "year": "2025", "doi": "10.1002/ar.25590"}, {"pmid": "38717324", "title": "Melatonin protects zebrafish pancreatic development and physiological rhythms from sodium propionate-induced disturbances via the hypothalamic-pituitary-thyroid axis.", "abstract": "The widespread use of sodium propionate as a preservative in food may affect public health. We aimed to assess the effects of sodium propionate on circadian rhythms and pancreatic development in zebrafish and the possible underlying mechanisms. In this experiment, we analyzed the relationship between circadian rhythms and pancreatic development and then revealed the role of the thyroid endocrine system in zebrafish. The results showed that sodium propionate interfered with the rhythmic behavior of zebrafish, and altered the expression of important rhythmic genes. Experimental data revealed that pancreatic morphology and developmental genes were altered after sodium propionate exposure. Additionally, thyroid hormone levels and key gene expression associated with the hypothalamic-pituitary-thyroid axis were significantly altered. Melatonin at a concentration of 1&#x2009;&#x3bc;mol&#x2009;L -1 , with a mild effect on zebrafish, observably alleviated sodium propionate-induced disturbances in circadian rhythms and pancreatic development, as well as regulating the thyroid system. Melatonin, while modulating the thyroid system, significantly alleviates sodium propionate-induced circadian rhythm disturbances and pancreatic developmental disorders. We further revealed the deleterious effects of sodium propionate as well as the potential therapeutic effects of melatonin on circadian rhythm, pancreatic development and the thyroid system. &#xa9; 2024 Society of Chemical Industry.", "keywords": ["Animals", "Melatonin", "Zebrafish", "Thyroid Gland", "Circadian Rhythm", "Propionates", "Pancreas", "Hypothalamo-Hypophyseal System", "Thyroid Hormones"], "year": "2024", "doi": "10.1002/jsfa.13565"}], "pubmed_query": "(\"pancreas\"[Title] OR \"pancreatic\"[Title] OR \"islet\"[Title] OR \"beta cell\"[Title] OR \"beta-cell\"[Title] OR \"insulin secretion\"[Title] OR \"exocrine pancreas\"[Title]) AND (\"thyroid\"[Title] OR \"thyroid gland\"[Title] OR \"thyroid hormone\"[Title] OR \"T3\"[Title] OR \"T4\"[Title] OR \"TSH\"[Title] OR \"hypothyroidism\"[Title] OR \"hyperthyroidism\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Pancreas__WAT", "source": "Pancreas", "target": "WAT", "color": "#64748b", "description": "“Type: Hormonal connection\nKey Players: Insulin\nNotes:\n- Insulin produced by the pancreas leads to glucose uptake in WAT\n- Dysfunction of adipocyte metabolism is also a key event in the development of insulin resistance.\nSources:\n- https://doi.org/10.1038/s41574-021-00471-8”", "connection_type": "Hormonal connection", "key_players": ["Insulin"], "key_players_metabolites": ["glucose", "fatty acid", "fatty acids", "cholesterol", "glycerol", "triglycerides", "amp", "triglyceride", "atp", "fructose", "glycogen", "ldl", "palmitate", "acetyl-coa", "glycerol-3-phosphate", "nefa", "ffa", "acetate", "hdl", "amino acid", "lipoprotein", "monoacylglycerol", "glutamine", "amino acids", "glutamate", "pyruvate", "free fatty acid", "alanine", "ammonia", "thromboxane", "bile acids", "lactate", "free fatty acids", "arginine", "butyrate", "valine", "oleate", "phospholipid", "serine", "bile acid"], "key_players_hormones": ["insulin", "leptin", "gip", "adiponectin", "glucagon", "ghrelin", "il-6", "angiotensin", "resistin", "tnf", "interleukin-6", "progesterone", "angiotensin ii", "osteocalcin", "tumor necrosis factor", "il-4", "t3", "il-10", "visfatin", "amylin", "estrogen", "chemerin", "cck", "testosterone", "il-1beta", "pyy", "interleukin-1", "renin", "irisin", "glp-1", "prolactin", "fgf21", "gastrin", "norepinephrine", "growth hormone", "il6", "vitamin d", "apelin", "adrenaline", "epinephrine", "lh", "il1b", "estradiol", "somatostatin"], "key_players_proteins": ["cd36", "atgl", "pi3k", "fas", "srebp", "lxr", "fatty acid synthase", "glucokinase", "srebp-1c", "akt", "ampk", "foxo1", "acc", "p38", "pdk4", "sirt1", "jnk", "insulin receptor", "chrebp", "irs-1", "ucp1", "mapk", "pparg", "glut2", "hormone-sensitive lipase", "leptin receptor", "hsl", "glp-1 receptor", "adipose triglyceride lipase", "lipoprotein lipase", "erk1", "inos", "mtor", "glp1r"], "key_players_counts_metabolites": {"cholesterol": 28, "ammonia": 1, "glycerol-3-phosphate": 5, "amp": 12, "glycogen": 7, "palmitate": 6, "thromboxane": 1, "atp": 8, "bile acids": 1, "hdl": 3, "acetyl-coa": 6, "amino acids": 2, "glucose": 317, "fatty acid": 42, "glutamate": 2, "ldl": 7, "lactate": 1, "free fatty acids": 1, "arginine": 1, "butyrate": 1, "pyruvate": 2, "nefa": 5, "free fatty acid": 2, "amino acid": 3, "valine": 1, "lipoprotein": 3, "glycerol": 16, "triglycerides": 15, "ffa": 4, "acetate": 4, "oleate": 1, "triglyceride": 11, "fatty acids": 32, "fructose": 8, "phospholipid": 1, "monoacylglycerol": 3, "glutamine": 3, "serine": 1, "bile acid": 1, "alanine": 2}, "key_players_counts_hormones": {"progesterone": 10, "tnf": 14, "cck": 2, "testosterone": 2, "il-1beta": 2, "pyy": 2, "fgf21": 1, "gastrin": 1, "interleukin-1": 2, "glucagon": 29, "angiotensin ii": 9, "il-4": 5, "norepinephrine": 1, "osteocalcin": 9, "growth hormone": 1, "il6": 1, "renin": 2, "estrogen": 3, "adiponectin": 33, "insulin": 676, "t3": 5, "vitamin d": 1, "apelin": 1, "resistin": 15, "chemerin": 3, "il-10": 4, "visfatin": 4, "adrenaline": 1, "tumor necrosis factor": 9, "irisin": 2, "epinephrine": 1, "lh": 1, "leptin": 38, "il1b": 1, "glp-1": 2, "il-6": 22, "ghrelin": 24, "estradiol": 1, "prolactin": 2, "gip": 34, "somatostatin": 1, "amylin": 4, "angiotensin": 16, "interleukin-6": 13}, "key_players_counts_proteins": {"hsl": 1, "ucp1": 2, "mapk": 2, "fatty acid synthase": 9, "jnk": 4, "pi3k": 13, "foxo1": 6, "p38": 5, "pparg": 2, "fas": 13, "glucokinase": 8, "srebp-1c": 8, "glut2": 2, "glp-1 receptor": 1, "hormone-sensitive lipase": 2, "insulin receptor": 4, "leptin receptor": 2, "akt": 7, "chrebp": 4, "irs-1": 4, "adipose triglyceride lipase": 1, "lipoprotein lipase": 1, "cd36": 15, "erk1": 1, "pdk4": 5, "ampk": 7, "sirt1": 5, "inos": 1, "acc": 6, "mtor": 1, "atgl": 15, "lxr": 11, "srebp": 13, "glp1r": 1}, "notes": "- Insulin produced by the pancreas leads to glucose uptake in WAT\n- Dysfunction of adipocyte metabolism is also a key event in the development of insulin resistance.", "sources": ["https://doi.org/10.1038/s41574-021-00471-8”"], "ai_description": "The Pancreas-WAT axis is orchestrated by the IL-1β/CXCL12 signalling pathway, which promotes crosstalk between pancreatic neuroendocrine tumors (PanNETs) and adipocytes [1]. This axis is also linked to impaired autophagic flux in adipose tissue, exacerbating pancreatic injury in obesity-related severe acute pancreatitis [4]. Furthermore, tumour-infiltrating adipocyte-derived 12,13-DiHOME can subvert CD8+ T cell immunity in pancreatic ductal adenocarcinoma by promoting PPARγ-mediated ferritinophagy and tumour-associated neutrophil ferroptosis [3]. The interplay between these mechanisms highlights the complex relationships between adipose tissue, PanNETs, and pancreatic function.", "pubmed_n": 200, "pubmed_papers": [{"pmid": "42316277", "title": "IL-1&#x3b2;/CXCL12 signalling orchestrates adipocyte-pancreatic neuroendocrine tumor crosstalk.", "abstract": "Pancreatic neuroendocrine tumors (PanNETs) are rare neoplasms belonging to the broader group of neuroendocrine neoplasms. Epidemiological evidence indicates that visceral obesity is associated with both an increased incidence of PanNETs and unfavorable clinicopathological features. However, the mechanisms underlying adipocyte-PanNETs interactions remain poorly understood. Here, we investigated the crosstalk between adipocytes and PanNET cells (BON-1 and QGP-1 cell lines) using indirect co-culture systems and conditioned media derived from differentiated 3T3-L1 adipocytes or PanNET cells. Our results demonstrate that PanNET cells induce adipocyte reprogramming toward a cancer-associated adipocyte (CAA) phenotype, characterized by lipid depletion and downregulation of adipogenic markers, including Pparg, Fabp4, Hsl, and Atgl. We identified PanNET-derived interleukin-1&#x3b2; (IL-1&#x3b2;) as a key driver of adipocyte conversion into CAAs. This process was accompanied by increased secretion of the chemokine CXCL12 from CAAs, which in turn appeared to enhance PanNET cell proliferation and IL-1&#x3b2; release, thereby establishing a positive bidirectional crosstalk consistent with a feedback-like mechanism between CXCL12 and IL-1&#x3b2; in CAAs and PanNET cells, respectively. Indeed, pharmacological disruption of this axis using AMD3100, a CXCR4 antagonist, significantly reduced both IL-1&#x3b2; and CXCL12 secretion, prevented adipocyte reprogramming, and suppressed tumor cell proliferation. Comparable effects were observed following incubation of PanNET-adipocyte co-cultures with canakinumab, an IL-1&#x3b2; pathway inhibitor. Collectively, these findings identify IL-1&#x3b2; and CXCL12 as potential critical mediators of the inflammatory crosstalk between adipocytes and PanNET cells. Targeting this signalling axis may therefore represent a promising therapeutic strategy for PanNETs.", "keywords": [], "year": "2026", "doi": "10.1186/s12967-026-08428-z"}, {"pmid": "42284094", "title": "Association between inter lobular pancreatic adipose tissue and low glucose induced insulin secretion by &#x3b2;-cells.", "abstract": "The potential role of pancreatic fat on human &#x3b2;-cell dysfunction and its association with fibrosis are controversial. From the PANC-DB database, we estimated &#x3b2;-cell function with Glucose Stimulated Insulin Secretion (GSIS) and quantified fat infiltration and fibrosis using pancreatic histology sections from 45 organs from cadaveric organ donors. In the donors without diabetes, high fat infiltration and adipocyte size in the pancreatic septum were associated with lower GSIS. Low GSIS in fatty pancreas was confirmed in living pancreatic tissue slices. This association is dependent on age and global adiposity and independent of fibrosis. These results suggest that the localization and phenotype of fat infiltration in the pancreas are important factors to determine the role of adipose tissue on pancreatic endocrine function.", "keywords": [], "year": "2026", "doi": "10.1152/ajpgi.00116.2026"}, {"pmid": "42209194", "title": "Tumour-infiltrating adipocyte-derived 12,13-DiHOME subverts CD8 + T cell immunity in pancreatic ductal adenocarcinoma by promoting PPAR&#x3b3;-mediated ferritinophagy and tumour-associated neutrophil ferroptosis.", "abstract": "Pancreatic ductal adenocarcinoma (PDAC) frequently invades adjacent peripancreatic adipose tissue, yet the role of tumour-infiltrating adipocytes (TIAs) in shaping antitumour immunity remains unclear. To determine how TIAs influence PDAC progression and to define the immunometabolic mechanism involved. We used orthotopic PDAC models and Kras(LSL-G12D/+);Trp53(LSL-R172H/+);Pdx1-Cre (KPC) mice, together with neutrophil lineage peroxisome proliferator-activated receptor gamma (PPAR&#x3b3;) conditional knockout mice (PPAR&#x3b3;(fl/fl)-S100A8(cre)). Tumour metabolomics, bulk RNA sequencing (bulk RNA-seq) and single-cell RNA sequencing (scRNA-seq) were integrated with adipocyte and tumour-associated neutrophil (TAN) co-culture assays. Human relevance was assessed in a retrospective PDAC cohort (n=121) and validated in public transcriptomic datasets. High TIA abundance correlated with poorer overall survival and an immune-suppressed tumour microenvironment (TME). In mouse models, adipocyte-enriched tumours showed reduced CD8 + T cell functions. Multiomics analyses highlighted the adipocyte-derived metabolite 12,13-dihydroxy-9Z-octadecenoic acid (12,13-DiHOME) and supported its role in increasing TAN ferroptosis susceptibility. Mechanistically, 12,13-DiHOME enhanced PPAR&#x3b3;-dependent ferritinophagy signalling in TANs, accompanied by increased ferroptosis and CXCL2 production. Genetic or pharmacologic disruption of this axis, CXCL2 neutralisation or CXCR2 blocking, attenuated tumour-promoting phenotypes and restored CD8 + T cell functions in vivo and in vitro. These findings support an adipocyte-TAN immunometabolic circuit in PDAC, where TIA-derived 12,13-DiHOME promotes PPAR&#x3b3;-dependent TAN ferroptosis and increases CXCL2, leading to impaired CD8 + T&#x2009;cell functions. Targeting this pathway may help mitigate immune suppression in PDAC.", "keywords": [], "year": "2026", "doi": "10.1136/gutjnl-2025-337119"}, {"pmid": "41801557", "title": "Impaired Autophagic Flux in Adipose Tissue Aggravates Pancreatic Injury in Obesity-Related Severe Acute Pancreatitis.", "abstract": "Adipose tissue (AT) playing a crucial role in obesity-related pancreatitis. This study investigated the impact of autophagy in AT on pancreatic injury during obesity-related severe acute pancreatitis (SAP). Non-obese and obese mice were induced using a normal diet (ND) or high-fat diet (HFD) before establishing SAP. Pancreatic injury and autophagy in AT were evaluated. Adipose tissue macrophages (ATMs) were analyzed. Autophagy in RAW 264.7 cells co-cultured with palmitic acid (PA) and lipopolysaccharide (LPS), simulating the conditions of ATMs during SAP, was further investigated. The effect of PA on autophagy within inflammatory macrophages in vitro was explored, utilizing Sulfo-N-succinimidyloleate (SSO) to inhibit fatty acid transport. Additionally, the impact of autophagy in AT on inflammation in SAP mice was investigated using SSO, complemented by metabolomics analysis to uncover underlying molecular mechanisms. Pancreatic histological scores were significantly higher in obese SAP mice than in non&#x2011;obese SAP mice (n&#x2009;=&#x2009;6; 9.50&#x2009;&#xb1;&#x2009;1.05 vs. 7.33&#x2009;&#xb1;&#x2009;1.03; p&#x2009;=&#x2009;0.0005). Impaired autophagic flux was observed in the AT of obese SAP mice compared with obese control mice, as indicated by increased LC3&#x2011;II (p&#x2009;=&#x2009;0.0383) and p62 levels (p&#x2009;=&#x2009;0.0171). PA induced impaired autophagic flux in inflammatory macrophages. Inhibition of fatty acid transport partially restored impaired autophagic flux in an ATM cell model of SAP. Furthermore, this inhibition also alleviated the impairment of autophagic flux in AT and attenuated pancreatic injury in obese SAP mice. Metabolomics analysis of AT revealed elevated levels of more fatty acids and several signaling pathways correlated with autophagy in obese SAP mice. Impaired autophagic flux in AT aggravates pancreatic injury in obese SAP mice, with impaired autophagic flux in ATMs likely playing a crucial role. Metabolomics analysis revealed abnormal lipid metabolism in AT of obese SAP mice, and several signaling pathways may contribute to impaired autophagic flux in this tissue.", "keywords": ["Animals", "Autophagy", "Mice", "Obesity", "Pancreatitis", "Adipose Tissue", "Macrophages", "Pancreas", "Male", "RAW 264.7 Cells", "Palmitic Acid", "Disease Models, Animal", "Mice, Inbred C57BL", "Diet, High-Fat"], "year": "2026", "doi": "10.1002/iid3.70395"}, {"pmid": "41746929", "title": "The association between epicardial adipose tissue thickness and diabetes mellitus, hyperlipidemia, hepatosteatosis, pancreatic steatosis and pancreatitis.", "abstract": "Epicardial adipose tissue (EAT) is associated with cardiometabolic disorders such as diabetes mellitus (DM), hyperlipidemia, and nonalcoholic fatty liver disease. However, its potential relationship with pancreatic steatosis and pancreatitis remains unclear, and existing studies offer inconsistent findings. Therefore, a clearer understanding of whether EAT reflects broader systemic ectopic fat burden or inflammatory processes is needed.This study evaluated the relationships between EAT thickness and DM, hyperlipidemia, hepatosteatosis, pancreatic steatosis, and pancreatitis. This retrospective, single-center study included 200 patients who underwent abdominal CT between 2022 and 2024. EAT thickness was measured at the mid-RCA and LAD levels, and subcutaneous fat was measured at the umbilical level. Liver and pancreatic steatosis were assessed with CT or MRI. Demographic and clinical data (age, gender, LDL cholesterol, diabetes, and history of pancreatitis) were collected. Mann-Whitney U, Spearman correlation, and logistic regression were used in analyses; p&#x2009;&lt;&#x2009;0.05 was considered significant. Of the 200 patients, 31.4% had diabetes, 42% had hepatosteatosis, and 73.5% had a history of pancreatitis. EAT and subcutaneous fat were significantly higher in women at all levels (p&#x2009;&lt;&#x2009;0.05). Diabetes was associated with increased EAT in both the RCA (p&#x2009;=&#x2009;0.002) and the LAD (p&#x2009;=&#x2009;0.001). In multivariate analysis, RCA-EAT (OR=1.18, p&#x2009;=&#x2009;0.002) and age (OR=1.03, p&#x2009;=&#x2009;0.003) were significantly associated with diabetes. High LDL was associated with LAD-EAT (p&#x2009;=&#x2009;0.030). For pancreatitis, multivariate analysis identified pancreatic steatosis (OR=5.78, p&#x2009;&lt;&#x2009;0.001) and LAD-EAT (OR=1.52, p&#x2009;=&#x2009;0.002) as variables significantly associated with a history of pancreatitis. EAT thickness is significantly associated with DM, LDL cholesterol, pancreatitis history, and age, supporting its role as a potential imaging biomarker of cardiometabolic risk. These findings suggest that EAT may serve as an imaging marker of broader metabolic and inflammatory burden, supporting its relevance for cardiometabolic risk assessment.", "keywords": [], "year": "2026", "doi": "10.1371/journal.pone.0343831"}, {"pmid": "41483133", "title": "Integrative immunogenomic profiling identifies CALU as a brown adipocyte-linked modulator of progression and treatment response in pancreatic cancer.", "abstract": "OBGECTIVE: Pancreatic Ductal Adenocarcinoma (PDAC) remains a lethal malignancy with limited therapeutic options. This study aimed to identify brown adipocyte-related genes (BARGs) influencing PDAC prognosis and explore their roles in the tumor microenvironment (TME) and immunotherapy response. METHODS: Transcriptomic and proteomic data from TCGA, GEO, ICGC, and CPTAC databases were analyzed to screen prognostic BARGs. Immune infiltration, immunotherapy prediction (via TIDE, IRnet, and TCIA), and drug sensitivity analyses were conducted. Single-cell RNA sequencing (CRA001160 dataset) and experimental validation (qPCR in pancreatic cancer cell lines) were performed to validate findings. RESULTS: CALU emerged as a core prognostic gene, significantly overexpressed in PDAC tissues and correlated with advanced tumor grade. High CALU expression was linked to stromal cell activation (e.g., cancer-associated fibroblasts, M1 macrophages) and suppressed T-cell infiltration, indicating immunosuppressive TME remodeling. CALU predicted resistance to CTLA4 inhibitors but showed no significant association with PD1 blockade. Drug sensitivity analysis revealed correlations between CALU and chemotherapeutic agents (e.g., TAK-715, LGK974). Single-cell analysis localized CALU to malignant and stromal cells, highlighting its role in PERIOSTIN-mediated fibroblast-malignant cell communication. Experimental validation confirmed elevated CALU expression in pancreatic cancer cell lines compared to normal cells. CONCLUSION: CALU is a critical regulator of PDAC progression, influencing stromal-TME interactions and immune evasion. It serves as a potential prognostic biomarker and therapeutic target, offering insights into combination strategies targeting stromal-immune crosstalk in PDAC.", "keywords": [], "year": "2026", "doi": "10.1007/s12672-025-04309-x"}, {"pmid": "41468878", "title": "Adipose tissue- derived mesenchymal stem cells versus puerarin for ameliorating nicotine- induced pancreatic fibrosis in rats.", "abstract": "Chronic pancreatitis is a critical health problem that is usually complicated by pancreatic fibrosis and diabetes mellitus. Nicotine is a considerable etiological risk factor for this condition. Our research was constructed to explore and compare between the possible therapeutic roles of adipose tissue- derived mesenchymal stem cells (AT- MSCs) and puerarin (Pue) in improving nicotine-induced pancreatic fibrosis. Rats were randomly distributed into: group I; control rats and group II; nicotine- treated rats. Group II was further divided into; model, AT-MSCs- treated, Pue-treated and withdrawal groups. Weight gain study and intraperitoneal glucose tolerance tests were assessed. Pancreatic tissue was processed for measurement of amylase, lipase, interleukin- 6, malondialdehyde and superoxide dismutase. Furthermore, quantitative RT-PCR of caspase-3, transforming growth factor-beta1 (TGF- &#x3b2;1), alpha-smooth muscle actin (&#x3b1;-SMA) and collagen I, was performed. Histopathological, immunohistochemical and ultra-structural examinations were conducted as well. We found that administration of AT- MSCs and Pue helped to increase insulin secretion and suppress inflammatory oxidative stress parameters. In addition, apoptosis and fibrosis were receded through declining of caspase-3 and elements of TGF-&#x3b2;1/&#x3b1;-SMA/collagen I fibrotic pathway. The pancreatic architecture was restored to a great extent. However, AT-MSCs caused a marked pancreatic improvement and regeneration when compared to Pue which resulted in only a moderate amelioration. Insignificant and difficultly detectable spontaneous recovery was noticed in the withdrawal group. Both AT-MSCs and Pue have a promising effectiveness as targeted therapeutic agents against nicotine- induced pancreatic fibrosis, with a higher efficiency of AT- MSCs.", "keywords": ["Animals", "Fibrosis", "Rats", "Mesenchymal Stem Cells", "Nicotine", "Mesenchymal Stem Cell Transplantation", "Pancreas", "Isoflavones", "Adipose Tissue", "Male", "Oxidative Stress", "Transforming Growth Factor beta1", "Apoptosis", "Rats, Sprague-Dawley"], "year": "2026", "doi": "10.1016/j.tice.2025.103295"}, {"pmid": "41456678", "title": "Timing-Dependent Effects of &#x3c9;-3 Fatty Acids on Adipose Tissue and Tumorigenesis in Obesity-Driven Pancreatic Cancer in Mice.", "abstract": "Pancreatic ductal adenocarcinoma is a deadly cancer linked to obesity. Adipose tissue contributes to tumor progression by promoting inflammation and supplying lipids and cytokines that support cancer growth. Although omega-6 fatty acid (FA)-rich diets accelerate pancreatic carcinogenesis, the role of &#x3c9;-3 FA, particularly within the adipose-tumor microenvironment in obesity, remains unclear. The objective of this was to investigate the impact of &#x3c9;-3 FA on obesity-driven early pancreatic carcinogenesis and adipose-tumor interactions. Using genetically engineered LSL-Kras LSL-G12D/+ ; Ptf1-Cre (KC) mice, we conducted 2 dietary studies. In the first, mice (n = 9-12/sex/group) were fed either a high-fat diet (HF; &#x3c9;-6:&#x3c9;-3 ratio of 9:1) or an &#x3c9;-3 FA-rich high-fat diet (HO; ratio of 1:1) for 8 wk. In the second, obese mice (n = 9-12/sex/group) initially fed HF for 8 wk were either maintained on HF or switched to HO for 13 additional weeks. We analyzed tissue histology, immune infiltration, gene expression, serum biomarkers, and lipid/metabolite profiles. In the 8-wk intervention, HO-fed mice showed reduced pancreas and mesenteric adipose tissue weights, acinar-to-ductal metaplasia (ADM), cell proliferation, and adipocyte size. HO also increased anti-inflammatory M2 macrophages and reduced serum IL-6. In contrast, dietary switch after obesity onset led to reduced fat mass, elevated adiponectin, increased anti-inflammatory &#x3c9;-3-derived metabolites, and sex-specific changes in peripancreatic adipose tissue metabolites. However, it failed to improve ADM, cell proliferation, or cancer incidence. &#x3c9;-3 FA-rich diets mitigate early pancreatic and adipose tissue abnormalities, with greater benefits when introduced before obesity onset, highlighting the importance of early dietary interventions for pancreatic cancer prevention.", "keywords": ["Animals", "Fatty Acids, Omega-3", "Obesity", "Pancreatic Neoplasms", "Adipose Tissue", "Mice", "Male", "Female", "Diet, High-Fat", "Carcinogenesis", "Mice, Inbred C57BL"], "year": "2026", "doi": "10.1016/j.tjnut.2025.101286"}, {"pmid": "41285230", "title": "Zhi-Shen Pill ameliorates impaired glucose tolerance by targeting pancreatic &#x3b2;-cell and adipocyte pathways.", "abstract": "Zhi-Shen Pill (ZSP), a traditional Chinese medicine formula with a history of use in regulating glucose metabolism, was chosen as potential IGT treatment due to its ethnopharmacological relevance. To investigate and elucidate the underlying mechanism of Zhi-Shen Pill (ZSP) in IGT treatment through regulating the function of pancreatic &#x3b2; cells-adipocytes. 3-Deoxyglucosone(3-DG) was employed to establish IGT cell models in INS-1&#xa0;cells and 3T3 L1 cells. Cell viability, apoptosis, insulin secretion, and key proteins associated with STRs axis, Adiponectin (APN)-adipoR1 axis, and insulin signaling were assessed using Cell Counting Kit-8 (CCK-8), flow cytometry (FCM), Western blot and cell immunofluorescence imaging. The downstream signals of STRs such as cyclic adenosine monophosphate (cAMP) and Ca 2+ were quantified through fluorescence report proteins and live-cell Ca 2+ imaging, respectively. Under IGT conditions, ZSP intervention exhibited potential anti-IGT activity. It promoted insulin production and release in INS-1&#xa0;cells (with double changes in the high-dose group), improved insulin sensitivity in 3T3 L1 cells, and increased the levels of Sirtuin family including sirtuin1 (SIRT1) (p&#xa0;&lt;&#xa0;0.001, n&#xa0;=&#xa0;3, in high-dose group) and SIRT6 (p&#xa0;&lt;&#xa0;0.001, n&#xa0;=&#xa0;3, in high-dose group) in 3T3 L1 cells. In addition, ZSP mediates its functional activities by interacting synergistically with AMP-activated protein kinase (AMPK), thereby inhibiting the transcriptional activation of key inflammatory factors. These findings suggest that ZSP may serve as a potential therapeutic formula in traditional Chinese medicine (TCM) for IGT treatment.", "keywords": ["Animals", "Mice", "3T3-L1 Cells", "Drugs, Chinese Herbal", "Insulin-Secreting Cells", "Adipocytes", "Rats", "Insulin", "Signal Transduction", "Cell Survival", "Apoptosis", "Insulin Resistance", "Glucose", "Deoxyglucose", "Hypoglycemic Agents", "Adiponectin"], "year": "2026", "doi": "10.1016/j.jep.2025.120931"}, {"pmid": "41205342", "title": "Mild pancreatic fibrosis with preserved exocrine function and increased visceral adipose tissue in m.3243A&gt;G carriers: A magnetic resonance imaging study.", "abstract": "Carriers of the mitochondrial variant m.3243A&gt;G have a high risk of diabetes mellitus and frequently report gastrointestinal symptoms, suggesting a dual endocrine and exocrine pancreas dysfunction. Whether changes in pancreatic morphology, abdominal or ectopic fat distribution contribute to these conditions, remains unknown. Twelve m.3243A&gt;G carriers with diabetes, 11 carriers without diabetes, and 23 healthy controls underwent abdominal magnetic resonance imaging (MRI). T1 relaxation time and magnetic resonance elastography (MRE) stiffness estimated pancreatic fibrosis. Pancreas volume was assessed by MRI and combined with faecal elastase measurements to evaluate exocrine pancreatic function. The ectopic fat content of muscle and the pancreas was estimated using proton density fat fraction, alongside abdominal fat measurements of cross-sectional areas (CSA) of visceral and subcutaneous adipose tissue. The homeostasis model assessment 2 (HOMA2) was used to estimate insulin resistance (HOMA2-IR). Compared to healthy controls, carriers with diabetes had an increased median [IQR] T1 relaxation time (909&#xa0;ms [868-1085] vs. 823&#xa0;ms [785-852], p&#xa0;&lt;&#xa0;0.001) and MRE stiffness (1.32&#xa0;kPa [1.24-1.43] vs. 1.23&#xa0;kPa [1.12-1.28], p&#xa0;=&#xa0;0.03). There was no difference in pancreas volume or evidence of exocrine pancreatic dysfunction evaluated by faecal elastase. Visceral adipose tissue CSA median [IQR] was increased in m.3243A&gt;G carriers compared to controls (61.0&#xa0;cm 2 [26.4-100.9] vs. 27.9&#xa0;cm 2 [17.2-65.0], p&#xa0;=&#xa0;0.03) and correlated positively with HOMA2-IR (r s &#xa0;=&#xa0;0.7, p&#xa0;&lt;&#xa0;0.001). Increased T1 relaxation time and MRE stiffness indicate mild pancreatic fibrosis in m.3243A&gt;G carriers with diabetes, without further evidence of exocrine insufficiency. Visceral fat was increased in m.3243A&gt;G carriers and associated with insulin resistance, implying metabolic dysregulation.", "keywords": ["Humans", "Male", "Female", "Magnetic Resonance Imaging", "Intra-Abdominal Fat", "Middle Aged", "Adult", "Fibrosis", "Pancreas", "Insulin Resistance", "Heterozygote", "Case-Control Studies", "Elasticity Imaging Techniques", "Pancreatic Diseases", "Diabetes Mellitus, Type 2"], "year": "2025", "doi": "10.1016/j.ymgme.2025.109282"}], "pubmed_query": "(\"pancreas\"[Title] OR \"pancreatic\"[Title] OR \"islet\"[Title] OR \"beta cell\"[Title] OR \"beta-cell\"[Title] OR \"insulin secretion\"[Title] OR \"exocrine pancreas\"[Title]) AND (\"adipose tissue\"[Title] OR \"white adipose tissue\"[Title] OR \"fat tissue\"[Title] OR \"adipocyte\"[Title] OR \"adipogenesis\"[Title] OR \"visceral fat\"[Title] OR \"subcutaneous fat\"[Title] OR \"WAT\"[Title] OR \"lipogenesis\"[Title]) AND (metabolism[Title/Abstract] OR metabolic[Title/Abstract] OR crosstalk[Title/Abstract] OR signaling[Title/Abstract] OR communication[Title/Abstract] OR axis[Title/Abstract] OR interaction[Title/Abstract] OR regulation[Title/Abstract] OR hormone[Title/Abstract] OR glucose[Title/Abstract] OR insulin[Title/Abstract] OR lipid[Title/Abstract] OR energy[Title/Abstract])"}}, {"data": {"id": "Small Intestine__Spleen", "source": "Small Intestine", "target": "Spleen", "color": "#64748b", "description": "Type: Multiple Connections\nKey Players: \nNotes:\n- Gut-Spleen-Liver axis. Has key roles in liver Disease. Feedback loop between Spleen and Liver. Connected through lymphatic, vascular system and neurological pathways.\n- Likely to be present during inflammatory states.\n- Peyer’s patches in small intestine are part of immune system and might correlate with spleen and bone marrow due to inflammation.\nSources:\n- doi: 10.4061/2010/823710 \n- https://doi.org/10.1096/fj.202502523RR\"\n", "connection_type": "Multiple Connections", "key_players": ["Notes:"], "key_players_metabolites": ["fatty acids", "amp", "amino acids", "bile acid", "glucose", "cholesterol", "galactose", "fatty acid", "atp", "bile acids", "amino acid", "ammonia", "arginine", "urea", "glutamine", "alanine", "sphingolipid", "lipoprotein", "ldl", "lactate", "acetate", "creatine", "triglyceride", "methionine", "citrate", "lithocholic acid", "sphingosine-1-phosphate", "leucine", "cysteine", "prostaglandin", "lysophosphatidylcholine", "phospholipid", "deoxycholic acid"], "key_players_hormones": ["tnf", "il-6", "insulin", "igf-1", "tumor necrosis factor", "glucagon", "il-10", "tnf-alpha", "interleukin-6", "il-4", "ghrelin", "somatostatin", "acth", "gastrin", "growth hormone", "motilin", "cck", "t3", "secretin", "t4", "testosterone", "crh", "interleukin-1", "aldosterone", "erythropoietin", "il6", "estrogen", "triiodothyronine", "il1b", "glp-1", "epo"], "key_players_proteins": ["akt", "pi3k", "inos", "mapk", "acc", "erk2", "p38", "nf-kb", "fxr", "fatty acid synthase", "jnk", "mtorc1", "fas", "tgr5", "ampk"], "key_players_counts_metabolites": {"methionine": 1, "cholesterol": 13, "ammonia": 5, "sphingolipid": 3, "amp": 20, "citrate": 1, "atp": 7, "bile acids": 7, "lithocholic acid": 1, "amino acids": 17, "glucose": 14, "sphingosine-1-phosphate": 1, "galactose": 10, "fatty acid": 9, "leucine": 1, "ldl": 2, "lactate": 2, "cysteine": 1, "prostaglandin": 1, "arginine": 5, "amino acid": 6, "lipoprotein": 3, "lysophosphatidylcholine": 1, "acetate": 2, "creatine": 2, "urea": 4, "triglyceride": 2, "fatty acids": 21, "phospholipid": 1, "deoxycholic acid": 1, "glutamine": 4, "bile acid": 17, "alanine": 4}, "key_players_counts_hormones": {"tnf": 33, "cck": 2, "testosterone": 1, "crh": 1, "gastrin": 3, "interleukin-1": 1, "aldosterone": 1, "glucagon": 14, "acth": 5, "igf-1": 18, "il-4": 6, "tnf-alpha": 10, "growth hormone": 3, "erythropoietin": 1, "il6": 1, "estrogen": 1, "insulin": 21, "t3": 2, "il-10": 11, "tumor necrosis factor": 15, "triiodothyronine": 1, "secretin": 2, "il1b": 1, "motilin": 3, "glp-1": 1, "il-6": 26, "ghrelin": 6, "epo": 1, "somatostatin": 6, "t4": 2, "interleukin-6": 8}, "key_players_counts_proteins": {"mapk": 5, "fatty acid synthase": 1, "jnk": 1, "pi3k": 7, "mtorc1": 1, "p38": 3, "fas": 1, "nf-kb": 3, "akt": 8, "tgr5": 1, "ampk": 1, "inos": 6, "fxr": 3, "acc": 4, "erk2": 4}, "notes": "- Gut-Spleen-Liver axis. Has key roles in liver Disease. Feedback loop between Spleen and Liver. Connected through lymphatic, vascular system and neurological pathways.\n- Likely to be present during inflammatory states.\n- Peyer’s patches in small intestine are part of immune system and might correlate with spleen and bone marrow due to inflammation.", "sources": ["doi: 10.4061/2010/823710", "https://doi.org/10.1096/fj.202502523RR\""], "ai_description": "The Small Intestine-Spleen axis is a bidirectional communication network where the gut microbiome and the spleen interact to regulate systemic homeostasis [1]. The gut microbiota produces short-chain fatty acids, which are then absorbed by the splenic endothelial cells, triggering the release of splenic hormones such as sphingosine-1-phosphate (S1P) and adrenomedullin, which in turn modulate immune responses and inflammation [2]. Additionally, the spleen produces cytokines that can influence gut barrier function and intestinal epithelial cell proliferation, highlighting a complex interplay between these two organs [3]. This axis is also influenced by external factors such as diet and lifestyle, with fermented foods like Polygonatum sibiricum and Poria cocos shown to modulate the gut-spleen axis and prevent spleen deficiency constipation [2].", "pubmed_n": 130, "pubmed_papers": [{"pmid": "42333863", "title": "Evidence for bidirectional gut-spleen crosstalk in rodent models: scoping review of possible mechanisms and therapeutic implications.", "abstract": "The gut-spleen axis has been proposed to link the gut environment with splenic immune regulation and systemic homeostasis. This scoping review examines this interaction in rodent models. Following PRISMA-ScR guidelines, we analyzed literature (2015-2025) from PubMed, Scopus, and other major databases, including English-language rodent studies reporting gut and splenic outcomes. Analysis of 48 studies suggests that gut dysbiosis may alter splenic architecture and immune function mainly via microbial metabolites, particularly short-chain fatty acids. Limited evidence indicates that splenic dysfunction could impair gut barrier integrity. Systemic stressors (e.g., infection or allergy) may reinforce this bidirectional inflammatory loop. Microbiota-targeted therapies have been observed primarily through gut-initiated mechanisms. Vagus nerve-mediated signaling points to a gut-brain-spleen network, though its directional hierarchy remains unresolved. Evidence supports a gut-spleen axis in rodents, with gut-derived microbial metabolites appearing to influence splenic immunity. Support for a reciprocal spleen-to-gut pathway remains limited and emergent, highlighting a research asymmetry. Together, these interactions suggest a partially bidirectional network linking the gut ecosystem to systemic immunity, with additional neural integration extending this framework toward a gut-brain-spleen axis. This integrative model proposes the gut-spleen axis as a potential therapeutic target warranting further investigation in inflammatory, metabolic, and neurological diseases.", "keywords": ["Animals", "Spleen", "Gastrointestinal Microbiome", "Rodentia", "Dysbiosis", "Gastrointestinal Tract"], "year": "2026", "doi": "10.32725/jab.2026.006"}, {"pmid": "42328654", "title": "Polygonatum sibiricum combined with Poria cocos prevents spleen deficiency constipation via the gut microbiota-mediated brain-gut axis.", "abstract": "The study evaluates the preventive effects of Polygonatum sibiricum and Poria cocos (3:1) on spleen deficiency constipation in mice, focusing on the brain-gut axis, gut microbiota, and oxidative stress. The findings aim to inform the prevention and treatment of this condition. Thirty male specific pathogen-free (SPF) KM mice (4 weeks old, 20 &#xb1; 2&#xa0;g) were randomized into a normal control group (NC), a model group (NM), and a Polygonatum sibiricum and Poria cocos group (HF). Serum levels of 5-hydroxytryptamine (5-HT), cholecystokinin (CCK), motilin (MTL), and vasoactive intestinal peptide (VIP) were measured by ELISA. Liver superoxide dismutase (SOD) activity and malondialdehyde (MDA) content were measured by a spectrophotometer. Gut microbiota was analyzed by 16S rRNA sequencing. Compared to NM, the HF showed significantly increased 5-HT, CCK( p &lt; 0.05), and MTL ( p &lt; 0.001), and significantly decreased VIP( p &lt; 0.05). Liver MDA content was markedly higher in NM than in NC( p &lt; 0.01), with a downward trend in HF. Conversely, the liver SOD activity in NM was significantly lower than in NC( p &lt; 0.001), and the HF displayed an upward trend. Microbiota analysis revealed higher diversity in HF, as indicated by higher chao1, pielou_e, shannon, and simpson indices. The gut microbiota species composition in the HF was dominated by beneficial bacteria such as Bacteroidota and Faecalibaculum , with a reduction in pathogenic bacteria such as Proteobacteria and Escherichia-Shigella . The characteristic gut microbiota of the NM was enriched in Escherichia-Shigella and its conditional pathogens, while the characteristic gut microbiota of the HF was enriched in beneficial symbiotic bacteria such as Akkermansia , Blautia, and Bifidobacterium . The metabolic pathways and the genetic information processing pathway were improved in the HF, and the DNA repair and recombination protein pathways were also repaired. The P. sibiricum and P. cocos combination effectively prevents spleen deficiency constipation, an effect associated with the brain-gut axis and gut microbiota. The observed trends in oxidative stress markers warrant further investigation.", "keywords": [], "year": "2026", "doi": "10.3389/fphar.2026.1793441"}, {"pmid": "42322789", "title": "Electroacupuncture at Jiaji points regulates splenic immunity and gut microbiota to ameliorate peripheral immune dysfunction after spinal cord injury.", "abstract": "Peripheral immune dysfunction induced by spinal cord injury (SCI) is a key factor rendering patients prone to infection. However, there is still a lack of effective intervention methods for this pathological process. This study aims to explore the effects of electroacupuncture (EA) at Jiaji points on peripheral immune dysfunction induced by SCI in a mouse T10 SCI model. Following seven consecutive days of EA at T9 and T11, results showed that EA reversed SCI-induced splenic white pulp atrophy, CD3 + T cell reduction, and downregulation of inflammatory cytokines, indicating a systemic immunomodulatory effect. Concurrently, EA alleviated colonic mucosal inflammatory infiltration and barrier damage, and improved colonic emptying. These improvements in the intestinal environment were accompanied by specific modulation of key functional microbial genera, as well as alterations in microbial function and metabolic profiles, particularly in amino acid synthesis and bile acid metabolism. Furthermore, EA significantly upregulated the level of calcitonin gene-related peptide (CGRP) in the colon and significantly increased the gene expression of the bile acid receptor FXR in the colon of SCI mice. In the spleen, although the change in CGRP level did not reach statistical significance after EA intervention, an increasing trend was observed. These findings demonstrate that EA at Jiaji points may regulate the intestinal function-gut microbiota-bile acid synthesis/FXR signaling axis and synergistically restore splenic immune homeostasis to ameliorate peripheral immune dysfunction induced by SCI, with CGRP playing a potential neural signaling role in the processes.", "keywords": [], "year": "2026", "doi": "10.1016/j.jneuroim.2026.579008"}, {"pmid": "42232906", "title": "From \"spleen governing muscle\" to gut microbiota: mechanisms of sarcopenic obesity in perimenopausal women.", "abstract": "Sarcopenic obesity (SO) in perimenopausal women-characterized by the paradoxical coexistence of skeletal muscle loss and visceral adiposity-represents a complex metabolic challenge that conventional estrogen replacement therapies have failed to fully address. Emerging evidence from traditional Chinese medicine (TCM) suggests that the \"spleen governing muscle\" theory may offer a unique lens through which to understand this condition, with the gut microbiota serving as a critical mechanistic link between spleen deficiency and musculoskeletal deterioration. To systematically review the mechanisms linking spleen deficiency, gut microbiota dysbiosis, and sarcopenic obesity risk in perimenopausal women, integrating TCM theory with modern biomedical evidence. We synthesized findings from clinical observational studies, randomized controlled trials (RCTs), and mechanistic investigations examining the \"spleen-gut-muscle\" axis, with particular attention to studies employing 16S rRNA sequencing, metabolomics, and multi-omics approaches. Spleen deficiency-manifesting as impaired transformation and transportation of nutrients-correlates with characteristic alterations in gut microbiota composition, including reduced diversity, elevated Firmicutes /Bacteroidetes ratios, and depletion of short-chain fatty acid (SCFA)-producing taxa. These microbial changes propagate systemic inflammation through lipopolysaccharide (LPS)-TLR4 signaling, activate muscle protein degradation via MuRF1 upregulation, and compromise insulin sensitivity through diminished GLP-1 secretion. Notably, TCM interventions-including herbal formulations (Sijunzi decoction, Buzhong Yiqi decoction), acupuncture, moxibustion, catgut embedding, and tuina massage-demonstrate potential to restore microbial homeostasis, increase SCFA production, and improve muscle mass and function. However, the evidence quality remains modest, with methodological limitations including inadequate blinding, small sample sizes, and short follow-up durations. The \"spleen-gut-muscle\" axis represents a promising therapeutic target for perimenopausal sarcopenic obesity, bridging TCM theory with modern microbiome science. Nevertheless, current evidence is predominantly associative
